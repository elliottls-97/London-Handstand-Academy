<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Press masterclass · London Handstand Academy</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="The Press masterclass is in development. It will be in the London Handstand Academy app when it is ready.">
<!-- The masterclass that lived here was unfinished and still reachable from
     the workshop pages' menus. The draft is kept in the repo as
     masterclass-wall-press-draft.html and stripped from every live build;
     this says so and moves people on to the app. -->
<meta http-equiv="refresh" content="8;url=/lha-app.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
  :root{--forest:#006663;--deep:#00403d;--ground:#062522;--mint:#8fe3d6;--sans:'Figtree',system-ui,-apple-system,sans-serif;--serif:'Newsreader',Georgia,serif}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--ground);color:#fff;font-family:var(--sans)}
  main{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:48px 26px;max-width:560px;margin:0 auto}
  .kick{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#a9e6dc}
  h1{font:400 44px/1.02 var(--serif);letter-spacing:-.015em;margin:18px 0 0}
  h1 em{font-style:normal;color:var(--mint)}
  p{font:400 17px/1.5 var(--sans);color:rgba(255,255,255,.84);margin:16px 0 0}
  .go{display:flex;align-items:center;justify-content:center;height:56px;margin-top:28px;border-radius:14px;background:#fff;
      color:var(--deep);font:700 17px/1 var(--sans);text-decoration:none;box-shadow:0 14px 34px rgba(0,0,0,.35)}
  .small{font:400 13.5px/1.5 var(--sans);color:rgba(255,255,255,.66);margin-top:16px;text-align:center}
  .small a{color:#a9e6dc}
  @media (min-width:700px){h1{font-size:54px}}
</style>
</head>
<body>
<main>
  <div class="kick">London Handstand Academy</div>
  <h1>The Press masterclass is <em>in development.</em></h1>
  <p>It will be in the app when it&rsquo;s ready. <span id="count">Taking you to the app in a moment.</span></p>
  <a class="go" href="/lha-app.html">Open the app</a>
  <div class="small">Or go to the <a href="/">homepage</a>.</div>
</main>
<script>
(function(){
  var n=8, el=document.getElementById('count');
  var t=setInterval(function(){
    n--; if(el) el.textContent='Taking you to the app in '+n+' second'+(n===1?'':'s')+'.';
    if(n<=0){ clearInterval(t); location.href='/lha-app.html'; }
  },1000);
})();
</script>
</body>
</html>
