<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fix one thing · London Handstand Academy</title>
<meta name="description" content="A four week fix for one handstand problem, from London Handstand Academy.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* The page a reel links to. One problem, why it happens, what fixes it, and
   the app underneath. It is also what Google and the assistants read, so the
   question is the title and the answer is real text, not a screenshot. */
:root{--bg:#f4f4f5;--forest:#006663;--deep:#00403d;--ink:#111111;--sand:#cfe6ec;--amber:#f3a949;
 --grey:#5c6660;--grey2:#8a8f8c;--mist:#e6e3de;--line:rgba(17,17,17,.12);
 --serif:Newsreader,Georgia,serif;--sans:Figtree,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.6 var(--sans)}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px 100px}
.brand{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--forest);text-decoration:none}
.kick{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--forest);margin-top:34px}
h1{font:400 42px/1.02 var(--serif);letter-spacing:-.015em;margin:10px 0 0;text-wrap:balance}
.tag{font:400 19px/1.45 var(--sans);color:var(--grey);margin:14px 0 0;max-width:34em}
.goal{margin:12px 0 0;font-size:16px}.goal b{color:var(--forest)}
.cover{aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:var(--mist);margin:22px 0 0}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
h2{font:400 27px/1.15 var(--serif);letter-spacing:-.01em;margin:30px 0 8px}
p{margin:0 0 14px;max-width:66ch;white-space:pre-wrap}
blockquote{margin:20px 0;padding:4px 0 4px 16px;border-left:3px solid var(--forest);font:400 21px/1.35 var(--serif);color:var(--deep)}
figure{margin:18px 0}
figure img{width:100%;border-radius:18px;display:block}
figcaption{font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:7px}
.vid{border-radius:18px;overflow:hidden;background:#000;aspect-ratio:16/9}
.vid iframe,.vid video{display:block;width:100%;height:100%;border:0}
.cta{position:sticky;bottom:14px;margin:34px 0 0;padding:16px 18px;border-radius:22px;background:#fff;
 box-shadow:0 18px 40px -22px rgba(28,32,25,.5);border:1px solid rgba(255,255,255,.9)}
.cta .l{font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--grey2)}
.cta .t{font:400 22px/1.2 var(--serif);margin-top:6px}
.cta .s{font:400 13.5px/1.5 var(--sans);color:var(--grey);margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;min-height:56px;border-radius:16px;
 background:linear-gradient(180deg,#0a7a76,#006663);color:#f7f4f1;text-decoration:none;font:600 17px/1 var(--sans);
 box-shadow:0 12px 30px rgba(0,102,99,.3)}
.drills{margin:26px 0 0;display:flex;flex-direction:column;gap:8px}
.dr{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px 8px 8px}
.dr .th{width:72px;height:44px;border-radius:9px;background:#000;overflow:hidden;flex:none}
.dr .th img{width:100%;height:100%;object-fit:cover;display:block}
.dr .n{font:600 14.5px/1.25 var(--sans)}.dr .m{font:400 12.5px/1.3 var(--sans);color:var(--grey2);margin-top:3px}
.foot{font:400 12.5px/1.6 var(--sans);color:var(--grey2);margin-top:30px}
.foot a{color:var(--forest)}
.none{padding:60px 0;text-align:center;color:var(--grey)}
@media (max-width:520px){h1{font-size:34px}.wrap{padding:22px 16px 100px}}
</style></head><body>
<div class="wrap">
  <a class="brand" href="/">London Handstand Academy</a>
  <div id="fix"><div class="none">Loading…</div></div>
</div>
<script>
(function(){
  const STREAM='https://customer-pns1oongdltmkjwa.cloudflarestream.com/';
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const thumb=uid=>STREAM+uid+'/thumbnails/thumbnail.jpg?time=3s&height=720';
  const uidOf=u=>{ const m=/\/([a-f0-9]{32})\//.exec(String(u||'')); return m?m[1]:''; };
  const q=new URLSearchParams(location.search);
  const slug=(q.get('slug')||q.get('fix')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,20);
  const ref=(q.get('ref')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,20);
  const box=document.getElementById('fix');
  /* one count per page, with where the person came from */
  try{ navigator.sendBeacon('/api/app/event', JSON.stringify({n:'sitefix'})); }catch(e){}
  const block=b=>{
    if(b.t==='h') return '<h2>'+esc(b.text)+'</h2>';
    if(b.t==='p') return '<p>'+esc(b.text)+'</p>';
    if(b.t==='quote') return '<blockquote>'+esc(b.text)+'</blockquote>';
    if(b.t==='img'&&b.id) return '<figure><img src="/api/app/image/'+esc(b.id)+'" alt="'+esc(b.cap)+'" loading="lazy">'+(b.cap?'<figcaption>'+esc(b.cap)+'</figcaption>':'')+'</figure>';
    if(b.t==='vid'&&b.uid) return '<figure><div class="vid"><iframe src="'+STREAM+esc(b.uid)+'/iframe?preload=metadata&poster='+encodeURIComponent(thumb(b.uid))+'" loading="lazy" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen"></iframe></div>'+(b.cap?'<figcaption>'+esc(b.cap)+'</figcaption>':'')+'</figure>';
    if(b.t==='drill'&&b.v){ const u=uidOf(b.url);
      return '<figure>'+(u?'<div class="vid"><video src="'+esc(b.url)+'" poster="'+thumb(u)+'" controls playsinline muted loop preload="metadata"></video></div>':'')
        +'<figcaption><b style="color:var(--ink)">'+esc(b.n||b.v)+'</b>'+(b.cap?' · '+esc(b.cap):'')+'</figcaption></figure>'; }
    return '';
  };
  fetch('/api/app/fixes').then(r=>r.json()).then(d=>{
    const all=(d&&d.fixes)||{};
    const f=all[slug];
    if(!f){
      const list=Object.values(all);
      box.innerHTML=list.length
        ? '<div class="kick">Fix one thing</div><h1>Pick the problem.</h1><div class="drills">'+list.map(x=>'<a class="dr" href="/fix.html?slug='+esc(x.slug)+(ref?'&ref='+esc(ref):'')+'" style="text-decoration:none;color:inherit"><div class="th">'+(x.cover&&x.cover.uid?'<img src="'+thumb(x.cover.uid)+'" alt="">':'')+'</div><div><div class="n">'+esc(x.name)+'</div><div class="m">'+esc(x.tag||'')+'</div></div></a>').join('')+'</div>'
        : '<div class="none">Nothing here yet.</div>';
      return;
    }
    document.title=f.name+' · London Handstand Academy';
    const cover=(f.cover&&f.cover.uid)?thumb(f.cover.uid):(f.cover&&f.cover.img)?'/api/app/image/'+f.cover.img:'';
    const app='/lha-app.html?fix='+encodeURIComponent(f.slug)+(ref?'&ref='+encodeURIComponent(ref):'');
    const cta='<div class="cta"><div class="l">In the Handstand Ladder app</div><div class="t">The '+esc(f.weeks)+' week fix, with every session timed and filmed.</div>'
      +'<div class="s">'+(f.access==='free'?'Free. No account needed to start.':'The first stage of the ladder is free. Fixes are in the £5 a month tier, and the first week is free.')+'</div>'
      +'<a class="btn" href="'+app+'">Start '+esc(f.name)+' →</a></div>';
    box.innerHTML='<div class="kick">A fix · '+esc(f.weeks)+' weeks · '+esc(f.perWeek)+' a week · about '+esc(f.mins)+' min</div>'
      +'<h1>'+esc(f.name)+'</h1>'
      +(f.tag?'<div class="tag">'+esc(f.tag)+'</div>':'')
      +(f.goal?'<div class="goal"><b>In '+esc(f.weeks)+' weeks:</b> '+esc(f.goal)+'</div>':'')
      +(cover?'<div class="cover"><img src="'+cover+'" alt=""></div>':'')
      +(f.article||[]).map(block).join('')
      +((f.drills||[]).length?'<h2>The drills.</h2><p style="color:var(--grey);font-size:14px">'+f.drills.length+' in the pool. A session takes six to ten and the app picks a different spread each time.</p><div class="drills">'
        +f.drills.map(x=>'<div class="dr"><div class="th">'+(x.url?'<img src="'+thumb(uidOf(x.url))+'" alt="" loading="lazy">':'')+'</div><div><div class="n">'+esc(x.n||x.v)+'</div><div class="m">'+esc(x.g||'')+(x.g?' · ':'')+'level '+esc(x.L||1)+'</div></div></div>').join('')+'</div>':'')
      +cta
      +'<div class="foot">Written by Elliott Staley, London Handstand Academy. Coaching in London and online: <a href="/">londonhandstandacademy.com</a></div>';
  }).catch(()=>{ box.innerHTML='<div class="none">Could not load it. Try again in a moment.</div>'; });
})();
</script>
</body></html>
