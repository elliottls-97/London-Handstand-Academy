<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>Free Handstand Form Check · London Handstand Academy</title>
<meta name="description" content="Send one clip of your handstand. Elliott Staley watches it himself and replies on video with the one thing to change, within 48 hours. Your first one is free.">
<link rel="canonical" href="https://londonhandstandacademy.com/form-check">
<meta property="og:title" content="Send me a clip. I reply on video.">
<meta property="og:description" content="One clip of your handstand, a video reply within 48 hours with the one thing to change. Your first one is free.">
<meta property="og:image" content="https://londonhandstandacademy.com/assets/og/app.jpg">
<link rel="preload" as="image" href="/assets/site/elliott-one-arm-lake-hero.jpg">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* One screen and one button (10 Nov 2026): the page a reel or the Instagram
   bio sends people to. The button opens the app on its free form check. */
:root{--deep:#00403d;--forest:#006663;--ink:#111;--grey:#5a5a5a;--serif:Newsreader,Georgia,serif;--sans:Figtree,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:400 16px/1.5 var(--sans);color:#fff;background:#0b1f1e}
a{color:inherit}
.fc{position:relative;min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:#16324a url('/assets/site/elliott-one-arm-lake-hero.jpg') center bottom/auto 140% no-repeat}
/* the sky carries the heading, the ground carries the button */
.fc::before{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(6,37,60,.4) 0%,rgba(6,37,60,0) 16%,rgba(6,37,34,0) 38%,rgba(6,37,34,.6) 58%,rgba(6,37,34,.95) 100%)}
.fc>*{position:relative;z-index:1}
.fc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0}
.fc-brand{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:#fff}
.fc-in{font:600 13.5px/1 var(--sans);text-decoration:none;padding:10px 15px;border-radius:999px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.fc-head{padding:26px 20px 0}
.fc-k{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#a9e6dc}
h1{font:400 clamp(38px,10.5vw,52px)/1 var(--serif);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance;text-shadow:0 2px 18px rgba(6,37,60,.35)}
h1 em{font-style:normal;color:#a9e6dc}
.fc-foot{margin-top:auto;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
.fc-how{font:400 15.5px/1.5 var(--sans);color:rgba(255,255,255,.88);margin:0 0 14px;max-width:34ch}
.fc-ticks{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:9px}
.fc-ticks li{display:flex;align-items:center;gap:11px;font:500 15px/1.35 var(--sans)}
.fc-ticks i{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center}
.fc-ticks svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fc-go{display:flex;align-items:center;justify-content:center;height:60px;border-radius:18px;background:#fff;color:var(--deep);
  font:700 17px/1 var(--sans);text-decoration:none;box-shadow:0 14px 34px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.fc-go:hover{transform:translateY(-2px)}.fc-go:active{transform:scale(.98)}
.fc-after{margin:14px 0 0;font:400 13px/1.5 var(--sans);color:rgba(255,255,255,.74);text-align:center}
.fc-after a{color:#fff;font-weight:600;text-underline-offset:3px}
/* it arrives, once */
@keyframes fcUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fc-foot>*{animation:fcUp .7s cubic-bezier(.2,.8,.2,1) both}
.fc-foot>:nth-child(2){animation-delay:.08s}.fc-foot>:nth-child(3){animation-delay:.16s}.fc-foot>:nth-child(4){animation-delay:.26s}
@media (prefers-reduced-motion:reduce){.fc-foot>*{animation:none}.fc-go{transition:none}}
/* the cookie question sits at the top here: at the foot it covered the one button */
#lhaCookie{bottom:auto!important;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%)!important}
#lhaCookie.in{transform:translate(-50%,0)!important}
/* the cookie question sits at the top here: at the foot it covered the one button */
#lhaCookie{bottom:auto!important;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%)!important}
#lhaCookie.in{transform:translate(-50%,0)!important}
@media (min-width:561px){body{display:grid;place-items:center;padding:24px}
  .fc{width:100%;min-height:min(880px,calc(100dvh - 48px));border-radius:28px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}}
</style>
</head>
<body>
<main class="fc">
  <div class="fc-top">
    <a class="fc-brand" href="/">London Handstand Academy</a>
    <a class="fc-in" href="/lha-app.html?ref=form-check">Log in</a>
  </div>
  <div class="fc-foot">
    <h1>Find out what&rsquo;s holding you <em>back.</em></h1>
    <p class="fc-how">Send one clip of your handstand, at the wall or off it. Film from the side, whole body in frame.</p>
    <ul class="fc-ticks">
      <li><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Reviewed by Elliott himself</li>
      <li><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></i>Your video reply lands within 48 hours</li>
      <li><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg></i>Free. No card</li>
    </ul>
    <a class="fc-go" href="/lha-app.html?start=check&amp;ref=form-check">Send my free clip</a>
  </div>
</main>
<script src="/stats.js" defer></script>
</body>
</html>
