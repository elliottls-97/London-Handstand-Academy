/* The week, as a strip of days with the sessions under it. It sat on Today,
   where it competed with the one thing Today is for: choosing a session and
   starting it. It lives on Progress now, which is where someone goes to look
   at their week rather than to train. */
/* NOT MOUNTED. The seven-pill week strip, replaced by the calendar. */
function weekCard(){
  /* it read `done` and `target` out of Today's scope, which is fine while it
     lives inside Today and a crash the moment it does not */
  const cells=weekCells();
  const trainedDays=new Set(sessionsDone().map(x=>new Date(x.at).toDateString()));
  const mon=new Date(); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const done=cells.filter((c,n)=>{
    const dt=new Date(mon); dt.setDate(mon.getDate()+dayFor(n));
    return !isRestCell(c) && trainedDays.has(dt.toDateString());
  }).length;
  const target=weekTarget();
  return (function(){
        /* the card that lifts is the one today holds, not the one a counter
           happens to be pointing at */
        const idx=todayCellIdx();
        /* seven days, Monday first, from this week's actual dates — so a chip
           is filled because you trained that day, not because of a counter. */
        const now=new Date();
        const mon=new Date(now); mon.setHours(0,0,0,0);
        mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
        const trained=new Set(sessionsDone().map(x=>new Date(x.at).toDateString()));
        const cells=weekCells();
        /* wrist and mobility days are a different kind of day, not a
           quieter version of a training day, so they get their own colour
           rather than the same green at less opacity */
        const kindOn={};
        cells.forEach((c,k)=>{ const d=dayFor(k);
          if(kindOn[d]!=='work') kindOn[d]=isRestCell(c)?'rest':'work'; });
        const chips=['M','T','W','T','F','S','S'].map((L,i)=>{
          const dt=new Date(mon); dt.setDate(mon.getDate()+i);
          const isToday=dt.toDateString()===now.toDateString();
          const did=trained.has(dt.toDateString());
          const kind=kindOn[i];
          /* Today is a ring around whichever day it happens to be, so a rest
             day today cannot look like a training day. */
          const bg = kind==='rest' ? 'var(--sage)' : kind==='work' ? 'var(--forest)'
                                                                  : 'rgba(17,17,17,.05)';
          const fg = kind==='rest' ? 'var(--deep)' : kind==='work' ? 'var(--on-primary)'
                                                                  : 'var(--grey2)';
          return `<div onclick="st.weekOpen=!st.weekOpen;save();render()" style="flex:1;min-width:0;
            height:30px;border-radius:9px;display:grid;place-items:center;cursor:pointer;position:relative;
            font:600 11.5px/1 var(--sans);background:${bg};color:${fg};
            box-shadow:${isToday?'0 0 0 2px var(--bg),0 0 0 3.5px var(--forest)':'none'}">${L}
            ${did?`<span style="position:absolute;bottom:3px;font:700 7px/1 var(--sans)">✓</span>`:''}</div>`;
        }).join('');
        return `<div data-tour="week" style="border-radius:18px;background:rgba(255,255,255,.5);
          border:1px solid rgba(17,17,17,.08)">
          <div onclick="st.weekOpen=!st.weekOpen;save();render()"
            style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer">
            <span style="flex:none;font:600 10.5px/1 var(--sans);letter-spacing:.12em;
              color:var(--grey)">WEEK</span>
            <div style="flex:1;display:flex;gap:5px;min-width:0">${chips}</div>
            <span style="flex:none;font:600 10.5px/1 var(--sans);letter-spacing:.1em;
              color:var(--grey2)">${done}/${target}</span>
            <span style="flex:none;font:400 13px/1 var(--sans);color:var(--grey2);
              transform:rotate(${st.weekOpen?180:0}deg)">⌄</span>
          </div>
          ${st.weekOpen?`<div style="padding:0 14px 14px">
            <div class="rail" style="display:flex;gap:9px;overflow-x:auto;
              scroll-snap-type:x mandatory;padding:2px 0;-webkit-overflow-scrolling:touch">
            ${cells.map((dd,n)=>{
              const on=n===idx;
              const rest=isRestCell(dd);
              const wd=dayFor(n);
              /* done means that day's date was actually trained, not that a
                 counter has moved past it */
              const cd=new Date(mon); cd.setDate(mon.getDate()+wd);
              const past=trained.has(cd.toDateString());
              /* the two kinds of day read as two kinds of day, whether or
                 not one of them happens to be today */
              const tint = rest ? 'var(--sage)' : 'var(--forest)';
              return `<div style="flex:none;width:138px;scroll-snap-align:start;padding:13px;
                border-radius:18px;
                border:1px solid ${on?'transparent':rest?'rgba(143,190,202,.65)':'rgba(17,17,17,.1)'};
                background:${on?tint:rest?'rgba(143,190,202,.16)':'#fff'};
                box-shadow:${on?'0 14px 30px -18px rgba(17,17,17,.85)':'0 1px 2px rgba(17,17,17,.04)'};
                transform:translateY(${on?-3:0}px)">
                <div style="display:flex;align-items:center;justify-content:space-between;min-height:20px">
                  <button onclick="event.stopPropagation();moveWorkout(${n},-1)" aria-label="Earlier in the week"
                    style="border:none;background:none;cursor:pointer;width:40px;height:40px;margin:-10px 0;
                    display:grid;place-items:center;font:600 17px/1 var(--sans);
                    color:${on&&!rest?'rgba(236,231,226,.85)':'var(--grey)'}">‹</button>
                  <span style="font:700 10px/1 var(--sans);letter-spacing:.14em;
                    color:${on?(rest?'var(--deep)':'var(--on-primary)'):rest?'#3d7b8c':'var(--forest)'}">${DAYL[wd]}</span>
                  <button onclick="event.stopPropagation();moveWorkout(${n},1)" aria-label="Later in the week"
                    style="border:none;background:none;cursor:pointer;width:40px;height:40px;margin:-10px 0;
                    display:grid;place-items:center;font:600 17px/1 var(--sans);
                    color:${on&&!rest?'rgba(236,231,226,.85)':'var(--grey)'}">›</button>
                </div>
                <div onclick="startDay(${n})" style="cursor:pointer">
                  ${rest?`<span style="display:inline-block;margin-top:8px;padding:3px 7px;border-radius:5px;
                    background:${on?'rgba(0,64,61,.16)':'rgba(61,123,140,.16)'};
                    font:700 8.5px/1 var(--sans);letter-spacing:.13em;
                    color:${on?'var(--deep)':'#3d7b8c'}">MOBILITY</span>`:''}
                  <p style="margin:8px 0 0;font:400 16px/1.18 var(--serif);
                    color:${on?(rest?'var(--deep)':'var(--on-primary)'):'var(--ink)'}">${esc(dd.n)}</p>
                  <span style="display:block;margin-top:7px;font:500 12px/1.3 var(--sans);
                    color:${on?(rest?'rgba(0,64,61,.6)':'rgba(236,231,226,1)'):'var(--grey2)'}">${esc(dd.sub||'')}</span>
                  ${past?`<span style="display:block;margin-top:8px;font:600 10px/1 var(--sans);
                    color:${on?(rest?'var(--deep)':'var(--on-primary)'):'var(--forest)'}">✓ DONE</span>`:''}
                </div>
              </div>`;}).join('')}
            </div>
            <div style="display:flex;gap:14px;padding-top:11px">
              <span style="display:inline-flex;align-items:center;gap:6px;font:400 11.5px/1 var(--sans);
                color:var(--grey2)"><i style="width:9px;height:9px;border-radius:3px;
                background:var(--forest)"></i>Session</span>
              <span style="display:inline-flex;align-items:center;gap:6px;font:400 11.5px/1 var(--sans);
                color:var(--grey2)"><i style="width:9px;height:9px;border-radius:3px;
                background:var(--sage)"></i>Mobility day</span>
            </div>
            <div style="font:400 11.5px/1.5 var(--sans);color:var(--grey2);padding-top:8px">
              Tap a day to see its drills. The arrows move it to another day of the week.</div>
          </div>`:''}
        </div>`;})();
}
/* NOT MOUNTED. The folded month calendar, replaced by trainingCalendar,
   which is open by default and lists the exercises for a day. */
function sessionCalendar(){
  const ss=((st.prog&&st.prog.sessions)||[]).filter(x=>x&&x.at);
  /* days the app was opened but nothing was logged. Turning up is worth
     seeing next to training: it is the difference between a quiet week and
     a week you disappeared. */
  const opens=new Set(((st.prog&&st.prog.opens)||[]));
  const byDay={};
  ss.forEach(x=>{ (byDay[dayKey(x.at)]=byDay[dayKey(x.at)]||[]).push(x); });

  const now=new Date(); now.setDate(1);
  now.setMonth(now.getMonth()-(st.calOff|0));
  const y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const lead=(first.getDay()+6)%7;                       /* Monday first */
  const title=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const todayK=dayKey(Date.now());

  let full=0, part=0, missed=0, opened=0;
  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<div></div>');
  for(let dn=1;dn<=last.getDate();dn++){
    const k=dayKey(new Date(y,m,dn,12));
    const list=byDay[k]||[];
    const isToday=k===todayK;
    const future=new Date(y,m,dn)>new Date();
    const done=list.some(x=>x.done || x.kind==='all');
    const miss=list.length && list.every(x=>x.kind==='none');
    const of=list.reduce((a,x)=>a+(Number(x.of)||0),0);
    const got=list.reduce((a,x)=>a+Math.min(Number(x.of)||0,Number(x.got)||0),0);
    const approx=list.some(x=>x.approx);
    const pc=approx?0.5:(of?Math.max(0,Math.min(1,got/of)):(done?1:0));

/* pull the thread from the worker; harmless if it isn't deployed yet */
/* what we have sent but the server has not echoed back yet. Blobs takes up
   to ~15s to propagate, so a read a second after a write legitimately comes
   back without the new message — and replacing the thread with that answer
   is what made a client's own video disappear out of their chat. */
let pendingMsgs=[];
const msgKey=m=>(m.video?'v:'+m.video:m.image?'i:'+m.image:'t:'+String(m.text||'').trim());
function loadThread(){
  if(!st.token) return;
  fetch(AUTH.messages,{headers:authed()}).then(r=>r.ok?r.json():null).then(d=>{
    if(!d||!d.messages) return;
    const next=d.messages.map(m=>({from:m.from==='coach'?'e':'me',text:m.text,
      ...(m.video?{video:m.video}:{}),...(m.image?{image:m.image}:{}),
      at:m.at||0, time:when(m.at)}));
    /* forget the ones the server has caught up on, keep the rest on screen */
    const seen=new Set(next.map(msgKey));
    pendingMsgs=pendingMsgs.filter(p=>!seen.has(msgKey(p)) && Date.now()-p.sentAt<600000);
    const merged=next.concat(pendingMsgs.map(p=>({from:'me',text:p.text,
      ...(p.video?{video:p.video}:{}),...(p.image?{image:p.image}:{}),
      at:p.sentAt||0, time:when(p.sentAt)})));
    /* a redraw rebuilds the input and loses half-typed text, reloads every
       video iframe and drops the scroll to the top — so only redraw when
       something was actually said. Relative times change on their own and
       must not count as a change. */
    const shape=a=>JSON.stringify((a||[]).map(m=>[m.from,m.text||'',m.video||'',m.image||'']));
    const same=shape(merged)===shape(st.msgs);
    st.msgs=merged; save();
    const onChat = !document.hidden && (st.tab==='ask' || (st.tab==='coaching' && coTab()==='chat'));
    if(onChat) markChatSeen();
    if(!same){
      if(st.tab==='ask'||st.tab==='coaching') render();
      else if(unreadMsgs()>0) render();   /* the dot on the chat button */
    }
  }).catch(()=>{});
}
function when(t){
  if(!t) return '';
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'Just now';
  if(m<60) return m+' min ago';
  const h=Math.round(m/60);
  return h<24 ? h+' hr ago' : Math.round(h/24)+' days ago';
}

/* ── sending a photo ───────────────────────────────────────────────
   Shrunk here rather than sent whole: a phone photo is 4MB of detail
   nobody needs to judge a shoulder angle, and small enough to go
   through the function means no second storage provider. */
async function shrinkPhoto(file, max=1600, quality=0.82){
  let src;
  try{ src=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){
    src=await new Promise((res,rej)=>{
      const i=new Image(), u=URL.createObjectURL(file);
      i.onload=()=>{ URL.revokeObjectURL(u); res(i); };
      i.onerror=()=>{ URL.revokeObjectURL(u); rej('Could not read that photo'); };
      i.src=u;
    });
  }
  const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight;
  if(!w||!h) throw 'Could not read that photo';
  const s=Math.min(1, max/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  return c.toDataURL('image/jpeg',quality);
}

/* one uploader, three callers: the chat, the free assessment, and the
   two-week test. The file goes phone → Cloudflare directly either way. */
function uploadClip(file, say){
  say=say||upSay;
  if(file.size > 100*1024*1024) return Promise.reject('That file is very large. Keep it under 100MB, about three minutes from a phone.');
  say('Getting ready…');
  return fetch(AUTH.upload,{method:'POST',headers:authed(),body:'{}'})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
    .then(d=>new Promise((resolve,reject)=>{
      const fd=new FormData(); fd.append('file',file);
      const xhr=new XMLHttpRequest();
      xhr.open('POST',d.uploadURL);
      xhr.upload.onprogress=e=>{ if(e.lengthComputable)
        say('Uploading… '+Math.round(e.loaded/e.total*100)+'%'); };
      xhr.onload=()=> (xhr.status>=200&&xhr.status<300) ? resolve(d.uid)
                    : reject('Upload failed ('+xhr.status+')');
      xhr.onerror=()=>reject('Upload failed, check your signal');
      xhr.send(fd);
    }));
}

  const clips=cps.filter(c=>d.clips&&d.clips[c.k]).map(c=>({drill:c.k, name:c.n, uid:d.clips[c.k]}));
  if(!clips.length) return;
  const btn=document.getElementById('fcSendBtn'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  fetch(AUTH.submission,{method:'POST',headers:authed(),
    body:JSON.stringify({kind:'assessment', clips, numbers:Object.assign({stage:curStage()+1}, d.q?{question:d.q}:{})})})
    .then(gateCheck)
    .then(()=>{ st.freeCheckUsed=true; st.awaitingReview=Date.now(); st.fcDraft=null; st.checkOpen=true;
      st.intake=st.intake||{}; st.intake.baseline=Date.now();
      save(); closeOv(); loadSubmissions(); loadThread(); loadEntitlement(); render(); })
    .catch(e=>{ if(btn){ btn.disabled=false; btn.textContent='Send them'; } const el=document.getElementById('fcMsg'); if(el) el.textContent=String(e); });
}

function sendAssessment(file, question){
  if(upBusy) return;
  upBusy=true;
  const photo=(file.type||'').startsWith('image/');
  const go = photo
    ? shrinkPhoto(file).then(data=>{ upSay('Sending…');
        return fetch(AUTH.image,{method:'POST',headers:authed(),body:JSON.stringify({data})})
          .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that photo')))
          .then(d=>({image:d.id})); })
    : uploadClip(file).then(uid=>({uid}));

  go.then(got=>{
    upSay('Sending…');
    return fetch(AUTH.submission,{method:'POST',headers:authed(),
      body:JSON.stringify({kind:'assessment',
        clips:[got.uid?{uid:got.uid,name:'Form check clip'}
                      :{image:got.image,name:'Form check photo'}],
        numbers:Object.assign({stage:curStage()+1}, question?{question:String(question).slice(0,600)}:{})})})
      .then(gateCheck);
  })
  .then(()=>{ upBusy=false; upSay(''); st.freeCheckUsed=true; st.awaitingReview=Date.now(); st.fcDraft=null; st.checkOpen=true;
      /* a filmed clip is the baseline. Nothing used to set this, so the
         profile bar stopped at 85% with no way to move it. */
      st.intake=st.intake||{}; st.intake.baseline=Date.now();
              save(); loadSubmissions(); loadThread(); render(); })
  .catch(e=>{ upBusy=false; upSay(String(e)); });
}

/* has anything been sent that is still waiting on a reply */
/* People should be able to turn off anything that is not essential. A
   password reset or a receipt still goes; a nudge does not have to. */
/* ── state that belongs to the person, not the phone ──────────────
   The week layout and any drill lengths they have changed. Written on
   change and read on sign-in, so a new phone picks up where they left off. */
let stateQueued=null;
function loadState(){
  if(!st.token) return Promise.resolve();
  return fetch(AUTH.state,{headers:authed()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(!d) return;
      if(d.dayMap && Object.keys(d.dayMap).length) st.dayMap=d.dayMap;
      if(d.secs && Object.keys(d.secs).length) st.secs=d.secs;
      if(d.time) st.time=d.time;
      if(d.perWeek) st.perWeek=d.perWeek;
      /* the quiz followed the phone, not the person, so a new device or a
         cleared cache asked all of it again */
      if(d.intake && Object.keys(d.intake).length){
        st.intake=Object.assign({}, d.intake, st.intake||{});
        if(st.intake.level!=null) st.quizDone=true;
      }
      if(d.quizDone) st.quizDone=true;
      if(Number.isInteger(d.taste)) st.taste=d.taste;
      /* sessions done on each fix, so a new phone does not start a fix again */
      if(d.fixDone && typeof d.fixDone==='object') st.fixDone=Object.assign({}, d.fixDone, st.fixDone||{});
      /* Where they are on the ladder followed the phone, not the person. It
         was written to the account row by sendIntake and read back by the
         coach's dashboard and by nothing else, so a paying subscriber who
         signed in on a second device was put back on Foundations with no
         way to see why, and every stage they had cleared was gone. */
      if(d.stage!=null && Number.isFinite(Number(d.stage))) st.stage=Number(d.stage);
    if(d.ladderDone && Object.keys(d.ladderDone).length) st.ladderDone=d.ladderDone;
      save(); render();
    })
    .catch(()=>{});
}
/* The server keeps the highest stage it has been told unless this says
   otherwise, because an ordinary save runs before the stored state has come
   back and would send 0. Only the two places that deliberately move somebody
   down pass it. */
let stageDown=false;
function saveStateDown(){ stageDown=true; saveState(); }
function saveState(){
  if(st.preview) return;   /* read only: the server would refuse it anyway */
  if(!st.token) return;
  clearTimeout(stateQueued);
  const down=stageDown; stageDown=false;
  stateQueued=setTimeout(()=>{
    stateQueued=null;
    fetch(AUTH.state,{method:'POST',headers:authed(),body:JSON.stringify({
      dayMap:st.dayMap||{}, secs:st.secs||{}, time:st.time||0, perWeek:st.perWeek||0,
      intake:st.intake||{}, quizDone:!!st.quizDone, stage:placedStage(),
      ...(down?{stageDown:true}:{}),
      ...(Number.isInteger(st.taste)?{taste:st.taste}:{}),
      ladderDone:st.ladderDone||{},
      fixDone:st.fixDone||{}
    })}).catch(()=>{});
  }, 800);
}

function loadPrefs(){
  if(!st.token) return;
  fetch(AUTH.prefs,{headers:authed()}).then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ st.prefs=d; save();
      if(st.ov==='account') ['replies','reminders','marketing','promo'].forEach(paintPref); } })
    .catch(()=>{});
}
/* the switch is the only thing that changed, so redraw the switch. Rebuilding
   the whole sheet — twice, once for the optimistic flip and once for the
   server's answer — is what made a toggle feel like a page reload. */
function paintPref(k){
  const b=document.getElementById('pref-'+k); if(!b) return;
  const on=(st.prefs||{})[k]!==false;
  b.setAttribute('aria-pressed', String(on));
  b.style.background = on ? 'var(--forest)' : 'rgba(28,32,25,.18)';
  b.style.justifyContent = on ? 'flex-end' : 'flex-start';
}
function setPref(k){
  const v=((st.prefs||{})[k]===false);
  st.prefs=Object.assign({},st.prefs,{[k]:v}); save(); paintPref(k);
  fetch(AUTH.prefs,{method:'POST',headers:authed(),body:JSON.stringify({[k]:v})})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ st.prefs=d; save(); ['replies','reminders','marketing','promo'].forEach(paintPref); } })
    .catch(()=>{});
}

   could not read it. The answer was rendered in one place, on a screen only
   the free tier can open, and the coached client got a card saying "tap to
   read it" that took them to the chat, where the answer existed only if the
   coach had also typed it there by hand. */

function loadSubmissions(){
  if(!st.token) return;
  fetch(AUTH.submissions,{headers:authed()}).then(r=>r.ok?r.json():null).then(d=>{
    if(!d||!d.submissions) return;
    const open=d.submissions.find(s=>s.status==='submitted');
    const was=st.awaitingReview;
    st.awaitingReview = open ? open.at : 0;
    const done=d.submissions.find(s=>s.status==='reviewed')||{};
    st.lastReview = done.reviewedAt||0;
    st.lastAnswer = done.answer||null;
    /* the whole list, so the clips screen can say what each one was for and
       what came back about it */
    st.subs = d.submissions.slice(0,40).map(x=>({id:x.id, kind:x.kind, cycle:x.cycle, at:x.at,
      status:x.status, clips:x.clips||[], numbers:x.numbers||{},
      reviewedAt:x.reviewedAt||0, answer:x.answer||null}));
    save(); if(was!==st.awaitingReview && (st.tab==='coaching'||st.tab==='progress')) render();
  }).catch(()=>{});
}

function sendApplication(){
  const a=st.applyDraft||{};
  const say=m=>{ const el=$('#applyMsg'); if(el) el.textContent=m; };
  const em=(st.email||a.email||'').trim();
  if(!em){ say('I need an email address to reply to.'); return; }
  if(!a.goal||!a.level){ say('Pick a goal and where you are now.'); return; }
  say('Sending…');
  fetch(AUTH.application,{method:'POST',headers:authed(),
    body:JSON.stringify({email:em,name:a.name||'',
      answers:{goal:a.goal,level:a.level,format:a.format||'',days:a.days||'',
               injuries:a.injuries||'',notes:a.notes||''}})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that')))
    .then(()=>{ st.applyDraft={}; st.applied=Date.now(); save(); closeOv(); render(); })
    .catch(e=>say(String(e)));
}

/* the server is what rations the free form check; the app only reports it */
function gateCheck(r){
  if(r.ok) return r;
  return r.json().catch(()=>({})).then(d=>{
    if(d && d.gated){
      st.canCheck=false;
      st.intake=st.intake||{}; st.intake.baseline=st.intake.baseline||Date.now();
      /* only roll back an optimistic chat bubble if one was actually added */
      if(pendingMsgs.length){ pendingMsgs.pop(); st.msgs=(st.msgs||[]).slice(0,-1); }
      save(); render();
    }
    return Promise.reject((d&&d.error)||'Could not send that');
  });
}

function sendPhoto(file){
  if(upBusy) return;
  upBusy=true; upSay('Preparing the photo…');
  shrinkPhoto(file)
    .then(data=>fetch(AUTH.image,{method:'POST',headers:authed(),
      body:JSON.stringify({data})})
      .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that photo'))))
    .then(d=>{
      upSay('Sending…');
      const text=(($('#askIn')||{}).value||'').trim();
      askDraft=''; const el=$('#askIn'); if(el) el.value='';
      pendingMsgs.push({text,image:d.id,sentAt:Date.now()});
      st.msgs=(st.msgs||[]).concat([{from:'me',text,image:d.id,time:'Just now'}]);
      save(); render();
      return fetch(AUTH.messages,{method:'POST',headers:authed(),
        body:JSON.stringify({text,image:d.id})}).then(gateCheck);
    })
    .then(()=>{ upBusy=false; upSay(''); loadEntitlement(); setTimeout(loadThread,1200); })
    .catch(e=>{ upBusy=false; upSay(String(e)); });
}

function sendClip(file){
  if(upBusy) return;
  /* 180s is the cap the server sets on the upload link, so say so before
     they wait through an upload that will be rejected */
  if(file.size > 100*1024*1024){ upSay('That file is very large. Keep it under 100MB, about three minutes from a phone.'); return; }
  upBusy=true; upPct=0; upSay('Getting ready…');

  fetch(AUTH.upload,{method:'POST',headers:authed(),body:'{}'})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
    .then(d=>new Promise((resolve,reject)=>{
      const fd=new FormData(); fd.append('file',file);
      const xhr=new XMLHttpRequest();
      xhr.open('POST',d.uploadURL);
      xhr.upload.onprogress=e=>{ if(e.lengthComputable){
        upPct=Math.round(e.loaded/e.total*100); upSay('Uploading… '+upPct+'%'); } };
      xhr.onload=()=> (xhr.status>=200&&xhr.status<300) ? resolve(d.uid)
                    : reject('Upload failed ('+xhr.status+')');
      xhr.onerror=()=>reject('Upload failed, check your signal');
      xhr.send(fd);
    }))
    .then(uid=>{
      upSay('Sending…');
      const text=(($('#askIn')||{}).value||'').trim();
      askDraft=''; const el=$('#askIn'); if(el) el.value='';
      pendingMsgs.push({text,video:uid,sentAt:Date.now()});
      st.msgs=(st.msgs||[]).concat([{from:'me',text,video:uid,time:'Just now'}]);
      save(); render();
      return fetch(AUTH.messages,{method:'POST',headers:authed(),
        body:JSON.stringify({text,video:uid})}).then(gateCheck);
    })
    .then(()=>{ upBusy=false; upSay(''); loadEntitlement(); setTimeout(loadThread,1200); })
    .catch(e=>{ upBusy=false; upSay(String(e)); });
}

function screenAsk(){
  /* never invent a message from Elliott — a client would read it as real */
  /* and never draw an empty one either: a row carrying no words, no clip and
     no photo rendered as a blank bubble with a timestamp under it */
  const hasMsg=m=>!!(m && (m.video || m.image || String(m.text||'').trim()));
  const msgs=(st.msgs||[]).filter(hasMsg);
  const bubbles=msgs.map(m=>{
    const mine=m.from==='me';
    return `<div style="display:flex;flex-direction:column;align-items:${mine?'flex-end':'flex-start'}">
      ${m.video?`<div style="max-width:82%;width:82%;border-radius:18px;overflow:hidden;
        margin-bottom:${m.text?'6px':'0'}">${clipPoster(m.video,'4/5','56vh')}</div>`:''}
      ${m.image?`<a href="${AUTH.image}/${esc(m.image)}" target="_blank" rel="noopener"

   booking, and both asked Stripe to refund the same payment. Stripe refuses
   the second, so the money went back and the person was emailed to say it
   had not. */
let cancelling='';
function cancelBooking(slug){
  if(cancelling) return;
  const b=(st.bookings||[]).find(x=>x.slug===slug); if(!b) return;
  const msg = b.refundable ? 'Cancel your place? It is more than 48 hours away, so it is refunded in full.'

  fetch('/api/app/workshop/cancel',{method:'POST',headers:authed(),body:JSON.stringify({slug})})
    .then(r=>r.json().then(d=>r.ok?d:Promise.reject(d.error||'Could not cancel')))

/* 88 thumbnails is 88 video downloads if you let it. Only the ones coming
   into view get a src, which keeps the library scrollable on mobile data. */
let lazyObs=null;
function lazyThumbs(){
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('video[data-lazy]').forEach(v=>{
      v.src=v.dataset.lazy; v.removeAttribute('data-lazy'); });
    return;
  }
  if(lazyObs) lazyObs.disconnect();
  lazyObs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      const v=e.target;
      if(e.isIntersecting){
        if(v.dataset.lazy){ v.src=v.dataset.lazy; v.removeAttribute('data-lazy'); v.load(); }
      } else if(!v.paused){
        /* off screen is off — no point burning battery and data on a clip
           nobody can see */
        try{ v.pause(); }catch(err){}
      }
    });
  },{rootMargin:'300px'});
  document.querySelectorAll('.scroll video').forEach(v=>lazyObs.observe(v));
}

function openLib(i){
  const all=libraryDrills();
  const it=all[i]; if(!it) return;
  /* a paid drill opens the wall, not the film */
  if(drillLocked(it.v)){ closeMenu(); openStage(FREE_STAGES); return; }
  st.ovDrill=it; openOv('drill');
}

let Q=[],qi=0,left=0,tTotal=0,phase='work',paused=false,tick_=null,lastT=0,sessionStart=0;

/* always m:ss — a bare '4' on a big clock reads as four minutes */
function fmtT(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60;
  return m+':'+String(r).padStart(2,'0'); }
const isHoldDose = d => /max hold|attempts|build to|to failure/i.test(String(d||''));

/* what a row says it will take, in the same seconds the player counts.
   A dose is the prescription ("3 x 8"); this is the clock. */
function lenLabel(it, grp){
  const w=work(it, grp);
  if(!w) return 'until you stop';
  return w<90 ? w+'s' : fmtT(w);
}

/* the big number is the dose, not a countdown — a set of ten reps should
   say TEN, not however many seconds we guessed it would take */
function repOf(it){
  /* the big number on the follow-along card. It parsed the dose a fourth
     time, with its own patterns, so "build to 5" and "3 x 5" put different
     things on screen for the same work. Stated numbers answer it now. */
  const st0=timed(it);
  if(Number(st0.amt)>0 && (st0.unit==='s'||st0.unit==='')){
    return {n:String(Math.round(Number(st0.amt))), u:st0.unit==='s'?'seconds':'reps'};
  }
  const d=String(it.d||'');
  let m=d.match(/^\s*\d+\s*[×x]\s*(\d+)\s*(?:each|per)?/i);   if(m) return {n:m[1],u:'reps'};
  m=d.match(/(\d+)\s*reps/i);                                  if(m) return {n:m[1],u:'reps'};
  m=d.match(/(\d+)\s*s\b/);                                    if(m) return {n:m[1],u:'seconds'};
  m=d.match(/build to\s*(\d+)/i);                              if(m) return {n:m[1],u:'build to'};
  m=d.match(/^\s*(\d+)\s*$/);                                  if(m) return {n:m[1],u:'reps'};
  return {n:d||'',u:'',small:true};
}

function startPlayer(){
  Q=queue(); if(!Q.length) return;
  qi=0; phase='work'; paused=false; sessionStart=Date.now();
  $('#player').classList.add('on');
  $('#player').innerHTML=playerShell();
  bindPlayer();
  showStep();
}
function playerShell(){
  return `<div class="p-bar">
      <span class="p-idx" id="p-idx"></span>
      <span class="p-clock" id="p-clock"></span>
      <span class="p-ctrls">
        <span class="p-elapsed" id="p-elapsed"></span>
        <button class="p-sound" id="p-sound" onclick="toggleCue()"></button>
        <button class="p-x" id="p-pause" title="Pause">II</button>
        <button class="p-x" id="p-exit" title="End">✕</button>
      </span>
    </div>
    <div class="p-track"><i id="p-fill"></i></div>
    <div class="p-track p-track2"><i id="p-timefill"></i></div>
    <div class="p-scroll" id="p-scroll">
      <div class="p-vwrap" id="p-vwrap"></div>
      <div class="p-body" id="p-body"></div>
    </div>
    <div class="p-foot">
      <div class="p-btns">
        <button class="ghost" id="p-prev">Back</button>
        <button class="p-bigpause" id="p-bigpause" onclick="togglePause()" aria-label="Pause the set">II</button>
        <button class="green" id="p-next">Done →</button>
      </div>
      <div class="p-subrow">
        <span style="display:flex;align-items:center;gap:10px">
          <button class="p-cuesbtn" id="p-cuesbtn" onclick="cueSheet()" aria-controls="p-cuesheet" aria-expanded="false">Form cues</button>
          <button class="p-skip" id="p-skip">Skip</button>
        </span>
        <span class="p-extend">
          <button data-ext="15">+15s</button><button data-ext="30">+30s</button>
        </span>
      </div>
    </div>
    <div class="p-cuescrim" id="p-cuescrim" onclick="cueSheet(false)"></div>
    <div class="p-cuesheet" id="p-cuesheet" role="dialog" aria-label="Form cues">
      <div class="grab"></div>
      <div id="p-cuesbody"></div>
      <button class="btn2" style="width:100%;margin-top:16px" onclick="cueSheet(false)">Back to the set</button>
    </div>`;
}
function cueSheet(force){
  const sh=$('#p-cuesheet'), sc=$('#p-cuescrim'), b=$('#p-cuesbtn');
  if(!sh) return;
  const open = force===undefined ? !sh.classList.contains('open') : !!force;
  sh.classList.toggle('open', open); if(sc) sc.classList.toggle('open', open);
  if(b) b.setAttribute('aria-expanded', open?'true':'false');
}
function bindPlayer(){
  $('#p-pause').onclick=togglePause;
  /* a swipe moves a set: left is on to the next, right is back. Sixty
     pixels, mostly sideways, inside a moment, so a scroll or a tap on the
     film never counts as one. */
  const sc=$('#p-scroll'); let sx=0, sy=0, st0=0;
  if(sc){
    sc.addEventListener('touchstart',e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st0=Date.now(); },{passive:true});
    sc.addEventListener('touchend',e=>{
      const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
      if(Date.now()-st0>700 || Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
      swipeStep(dx<0 ? 1 : -1);
    },{passive:true});
  }
  const sh=$('#p-cuesheet'); let shy=0;
  if(sh){
    sh.addEventListener('touchstart',e=>{ shy=e.touches[0].clientY; },{passive:true});
    sh.addEventListener('touchend',e=>{ if(e.changedTouches[0].clientY-shy>50 && sh.scrollTop<=0) cueSheet(false); },{passive:true});
  }
  $('#p-exit').onclick=()=>endPlayer(false);
  $('#p-next').onclick=()=>{ clearInterval(tick_); tick_=null; advance(); };
  $('#p-prev').onclick=stepBack;
  $('#p-skip').onclick=()=>{ clearInterval(tick_); tick_=null; phase='work'; qi++; showStep(); };
  document.querySelectorAll('.p-extend button').forEach(b=>{
    b.onclick=()=>{ left+=+b.dataset.ext; tTotal+=+b.dataset.ext; paintClock(); };
  });
}
function togglePause(){
  paused=!paused; lastT=Date.now();
  const b=$('#p-pause'); if(b) b.textContent=paused?'▶':'II';
  const B=$('#p-bigpause'); if(B){ B.textContent=paused?'▶':'II'; B.classList.toggle('play',paused); B.setAttribute('aria-label',paused?'Resume the set':'Pause the set'); }
  document.querySelectorAll('#player video').forEach(v=>{ try{ paused?v.pause():v.play(); }catch(e){} });
}
function paintPause(){ const b=$('#p-pause'); if(b) b.textContent=paused?'▶':'II';
  const B=$('#p-bigpause'); if(B){ B.textContent=paused?'▶':'II'; B.classList.toggle('play',paused); } }
function stepBack(){
  clearInterval(tick_); tick_=null;
  if(phase==='rest'){ phase='work'; }
  else if(qi>0){ qi--; phase='work'; }
  showStep();
}
function paintClock(){
  const c=$('#p-clock'); if(c) c.textContent = tTotal>0 ? fmtT(left) : 'Hold';
  const f=$('#p-timefill');
  if(f) f.style.width = (tTotal>0 ? (1-left/tTotal)*100 : 0).toFixed(1)+'%';
  const e=$('#p-elapsed');
  if(e&&sessionStart) e.textContent = fmtT((Date.now()-sessionStart)/1000)+' / ~'+
    Math.round(Q.reduce((a,x,_i)=>a+work(x.it)+rest(x,_i,Q),0)/60)+' min';
}


/* what is coming, and tappable — rest is the natural moment to look at
   the next drill's video and cues rather than being told a name */
function upNextHTML(){
  const rest=Q.slice(qi+1, qi+5);
  if(!rest.length) return `<div class="p-up"><div class="p-uphead">Up next</div>
    <div class="p-uprow"><span style="font:400 14px/1.4 var(--sans);color:var(--grey)">Last one, that is the session.</span></div></div>`;
  return `<div class="p-up">
    <div class="p-uphead">Up next · ${Q.length-qi-1} to go
      <span style="float:right;font-weight:500;letter-spacing:0;text-transform:none">tap to preview</span></div>
    ${rest.map((q,i)=>{
      const it=q.it, cues=it.cues||[];
      return `<div class="p-upblock" data-up="${i}">
        <button class="p-uprow p-upbtn" onclick="toggleUp(${i})">
          <span class="p-upnum">${qi+2+i}</span>
          ${it.url?`<span class="p-upthumb"><video src="${sig(it.url)}#t=0.6" muted playsinline preload="metadata"></video></span>`
                  :'<span class="p-upthumb"></span>'}
          <span style="flex:1;min-width:0;text-align:left">
            <span style="display:block;font:600 14.5px/1.2 var(--sans)">${esc(it.n)}</span>
            <span style="display:block;font:400 12.5px/1 var(--sans);color:var(--grey2);margin-top:6px">${
              esc(perSet(it.d,q.sets))}${q.sets>1?' · set '+q.set+' of '+q.sets:''}</span>
          </span>
          <span class="p-upchev">▾</span>
        </button>
        <div class="p-updetail">
          ${it.url?`<div class="p-upvid">${drillFilm(it.url,'16/10')}</div>`
                  :''}
          ${it.desc?`<p style="font:600 14px/1.5 var(--sans);margin:12px 0 0">${esc(it.desc)}</p>`:''}
          ${cues.length?`<ul style="margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
            ${cues.map(c=>`<li style="font:400 13.5px/1.45 var(--sans);color:var(--grey)">${esc(c)}</li>`).join('')}
          </ul>`:''}
        </div></div>`;
    }).join('')}</div>`;
}
function toggleUp(i){
  const b=document.querySelector(`.p-upblock[data-up="${i}"]`);
  if(!b) return;
  const opening=!b.classList.contains('open');
  b.classList.toggle('open');
  /* one open at a time, and stop any clip the closing one was playing */
  document.querySelectorAll('.p-upblock').forEach(x=>{
    if(x!==b){ x.classList.remove('open');
      x.querySelectorAll('.p-upvid video').forEach(v=>{try{v.pause()}catch(e){}}); }
  });
  if(!opening) b.querySelectorAll('.p-upvid video').forEach(v=>{try{v.pause()}catch(e){}});
}

function showStep(){
  if(qi>=Q.length) return endPlayer(true);
  const s=Q[qi], it=s.it, resting=phase==='rest';
  document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}});
  $('#player').classList.toggle('resting',resting);
  /* the player moves a set at a time, so counting sets and calling them
     exercises said twenty five exercises in a seventeen drill session */
  $('#p-idx').textContent = resting ? 'REST' : 'SET '+(qi+1)+' OF '+Q.length;

  const vw=$('#p-vwrap'), body=$('#p-body');
  if(resting){
    tTotal=left=rest(Q[qi], qi, Q);
    vw.className='p-vwrap novideo'; vw.innerHTML='';
    /* only preview a genuinely different drill — the line above already
       names the next set of the current one */
    const nx=Q[qi+1];
    const n=(nx && nx.it!==it) ? nx : null;
    body.innerHTML=`<span class="p-phase">Rest</span>
      <div class="p-main">
        <div class="p-repcol"><div class="p-repnum" id="p-repnum">${Math.round(left)}</div>
          <div class="p-repunit">remaining</div></div>
        <div class="p-info"><h2 class="p-name">Rest</h2>
          <div class="p-rule"></div>
          <div class="p-cues"><span class="cl">${
            s.set<s.sets ? 'Next: set '+(s.set+1)+' of '+s.sets+' · '+esc(it.n)
            : nx ? 'Next: '+esc(nx.it.n) : 'Last one done.'}</span></div></div>
      </div>
      ${upNextHTML()}`;
    $('#p-next').textContent='Skip rest →';
    const cbtn=$('#p-cuesbtn'); if(cbtn) cbtn.hidden=true;
  } else {
    tTotal=left=work(it, s.g||s.grp);
    if(it.url){ vw.className='p-vwrap'; vw.innerHTML=
      `<video src="${sig(it.url)}" autoplay loop playsinline controls ${soundOn()?'':'muted'}></video>`;
      /* The explainers were captioned and the drill you are mid-set on was
         not, which is the one place the words matter most. Captions only, not
         the theatre: the player has its own chrome and a second control bar
         over a running set is one too many. */
      const uid=uidOfUrl(it.url);
      if(uid){ const vEl=vw.querySelector('video'); if(vEl) attachCaptions(vEl, uid); } }
    else { vw.className='p-vwrap novideo';
      vw.innerHTML=''; vw.classList.add('novideo'); }
    const rp=repOf(it), cues=it.cues||[];
    const dose=esc(String(rp.n)+(rp.u?' '+rp.u:''));
    /* The clock is the big number now. It was 21px in the top bar, and the
       big number was the dose, which does not change while you work. */
    body.innerHTML=`<span class="p-phase">${s.sets>1?'Set '+s.set+' of '+s.sets:esc(s.grp||'Exercise')}</span>
      <div class="p-main">
        <div class="p-repcol"><div class="p-repnum${tTotal>0?'':' small'}" id="p-repnum">${tTotal>0?fmtT(left):'Hold'}</div>
          <div class="p-repunit">${tTotal>0?'left &middot; '+dose:dose}</div></div>
        <div class="p-info"><h2 class="p-name">${esc(it.n)}</h2>
          ${cpRow(it)}
          ${it.desc?`<div class="p-rule"></div><div class="p-cues"><b>${esc(it.desc)}</b></div>`:''}
        </div>
      </div>`;
    const cb=$('#p-cuesbody');
    const nCues=cues.length+(it.nt?1:0);
    if(cb) cb.innerHTML=`<div class="kick2">FORM CUES</div>
      <div style="font:400 22px/1.15 var(--serif);margin-top:8px">${esc(it.n)}</div>
      <div class="p-cues" style="margin-top:14px">
        ${it.desc?`<b>${esc(it.desc)}</b>`:''}
        ${cues.map(c=>`<span class="cl">${esc(c)}</span>`).join('')}
        ${it.nt?`<span class="cl">${esc(it.nt)}</span>`:''}
        ${!nCues&&!it.desc?`<span class="cl">No cues written for this one yet.</span>`:''}
      </div>`;
    const cbtn=$('#p-cuesbtn');
    if(cbtn){ cbtn.hidden=false; cbtn.textContent='Form cues'+(nCues?' · '+nCues:''); }
    $('#p-next').textContent = s.sets>1 ? 'Set done →' : 'Done →';
  }

  cueSheet(false);
  $('#p-prev').style.visibility = (qi===0&&phase==='work') ? 'hidden' : '';
  $('#p-fill').style.width=((qi/Q.length)*100).toFixed(1)+'%';
  $('#p-scroll').scrollTop=0;
  paintClock(); paintPause();
  paintSound();
  clearInterval(tick_); tick_=null;
  if(tTotal>0 && !paused){ lastT=Date.now(); tick_=setInterval(step,250); }
}

/* wall-clock delta, so a backgrounded phone does not lose seconds */
function step(){
  if(paused){ lastT=Date.now(); return; }
  const now=Date.now(); left-=(now-lastT)/1000; lastT=now;
  paintClock();
  const rn=$('#p-repnum');
  if(rn){ rn.textContent = phase==='rest' ? Math.max(0,Math.round(left)) : fmtT(Math.max(0,left));
          rn.classList.toggle('urgent', left<=5 && left>0); }
  if(left>0) return;
  clearInterval(tick_); tick_=null; cue(); advance();
}
function advance(){
  if(phase==='work'){
    const s=Q[qi];
    st.tick[key(st.day,s.gi,s.ii)]=true; save();
    /* the early warm-up drills run straight through, and a rest of zero
       used to leave the player sat on a Rest card with no timer to end it */
    if(qi<Q.length-1 && rest(Q[qi], qi, Q) > 0){ phase='rest'; showStep(); return; }
  }
  phase='work'; qi++;
  if(qi>=Q.length){ endPlayer(true); return; }
  showStep();
}
function skip(){ clearInterval(tick_); tick_=null; advance(); }
/* on to the next set or back to the last one, by swipe. Never off the end:
   the session ends by pressing Done on the last set, not by a flick. */
function swipeStep(dir){
  const sc=$('#p-scroll');
  if(dir>0){
    if(qi>=Q.length-1 && phase==='work') return;
    clearInterval(tick_); tick_=null;
    if(sc) sc.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX(-26px)',opacity:.35},{transform:'translateX(0)',opacity:1}],{duration:280,easing:'ease-out'});
    phase='work'; qi++; showStep();
  } else {
    if(qi===0 && phase==='work') return;
    if(sc) sc.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX(26px)',opacity:.35},{transform:'translateX(0)',opacity:1}],{duration:280,easing:'ease-out'});
    stepBack();
  }
}
/* A line that says what just happened and then goes away. There was no
   such thing in here, and alert() stops the app dead to say one sentence. */
let toast_=null;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){
    el=document.createElement('div'); el.id='toast';
    el.style.cssText='position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;'+
      'background:var(--forest,#003b38);color:#fff;border-radius:999px;padding:11px 19px;'+
      'font:600 13.5px/1.2 var(--sans);box-shadow:0 8px 26px rgba(0,0,0,.22);'+
      'max-width:calc(100vw - 40px);text-align:center;opacity:0;transition:opacity .18s ease';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  el.style.opacity='1';
  clearTimeout(toast_);
  toast_=setTimeout(()=>{ el.style.opacity='0'; }, 2600);
}

/* The only place a follow-along ever gets asked. Rating a single drill
   needs the drill list open, and someone who only ever presses play would
   have stayed on level one forever, so the answer here moves every
   grouping the session touched. */
function sessionFeel(f){
  const dir = f==='Too easy' ? +1 : f==='Too hard' ? -1 : 0;
  /* Two different products behind one button. On the free ladder the app
     owns the difficulty, so it moves the dial and says so. For a coached
     client the programme is written by hand, and this is how they tell
     Elliott to change it: nudging a ladder they do not train on and then
     telling them to go and change it there was the wrong answer twice. */
  if(coachedView()){
    if(dir){
      post({type:'Session feel',feel:f,day:(day()&&day().label)||'',
            block:blockNo(),week:weekNow()});
      reportProgress({feedback:{kind:'session feel', text:f+' · '+((day()&&day().label)||'')}});
    }
    closeOv();
    if(dir) toast(f==='Too hard'
      ? 'Told Elliott. He writes the next block from this.'
      : 'Told Elliott. He writes the next block from this.');
    return;
  }
  const moved = dir ? nudgeStage(dir) : null;
  closeOv();
  /* say what it did, or the session quietly changing next week reads as the
     app being inconsistent rather than as the thing they just asked for */
  if(moved) toast((dir>0?'Harder workouts from now on.':'Easier workouts from now on.')
    +' You can change it on the ladder.');
  else if(dir>0) toast('Already on the hardest workouts for this stage.');
  else if(dir<0) toast('Already on the easiest workouts for this stage.');
}

function endPlayer(done){ clearInterval(tick_); tick_=null; letSleep();
  document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}});
  $('#player').classList.remove('on'); $('#player').innerHTML='';
  const d=day();
  const partWay = !done && qi>0 && qi<Q.length-1;
  if(partWay) whyStopContext=(Q[qi]&&Q[qi].it&&Q[qi].it.n)||'';
  /* The player has known the drill-by-drill all along — every set in Q
     carries its drill, its block and its position — and threw it away at
     the end, reporting only a count. Without it a coach can see that a
     session was abandoned but not which drill it died on, or how far
     into it. */
  const rows=(function(){
    const m=new Map();
    Q.forEach((x,idx)=>{
      const k=(x.it&&x.it.v)||(x.it&&x.it.n)||('#'+idx);
      if(!m.has(k)){
        const a=doseAmount(x.it);
        m.set(k,{v:(x.it&&x.it.v)||'',n:(x.it&&x.it.n)||'',grp:x.grp||'',got:0,of:0,
          /* how much one set asks for, and in what unit, so a finished set
             is countable rather than just ticked */
          per:a.n, unit:a.unit, dose:String((x.it&&x.it.d)||'').slice(0,40),
          secsPer:(work(x.it, x.g||x.grp)||0)});
      }
      const r=m.get(k); r.of++; if(idx<qi||done) r.got++;
    });
    /* ── the number they counted ──────────────────────────────────
       The comment under this said an adjusted count wins, and the line
       it sat on multiplied the dose by the sets and ignored it. So
       eleven typed where the dose asked for eight was saved as eight,
       the account rebuilt the history from that, and the number came
       back wrong on the next open. The working list keeps one figure
       per drill, what a set of it was actually counted at, so that is
       the figure a set is worth here. */
    const typedOf={};
    (Q||[]).forEach((x,i)=>{
      const v=(x.it&&x.it.v)||(x.it&&x.it.n)||('#'+i);
      const n=Number((st.reps||{})['q'+i]);
      if(typedOf[v]==null && Number.isFinite(n) && n>0) typedOf[v]=n;
    });
    return [...m.values()].slice(0,40).map(r=>{
      const each = typedOf[r.v]!=null ? typedOf[r.v] : (typedOf[r.n]!=null ? typedOf[r.n] : r.per);
      return Object.assign(r,{
        rate:(st.rate||{})[r.v]||'',
        reps:each*r.got,
        want:r.per*r.of,
        secs:r.secsPer*r.got});
    });
  })();
  reportProgress({session:{day:st.day, name:(d&&d.label)||'', done:!!done, items:rows,
    /* how they trained, so the coach's calendar can say whether this was the
       timed follow-along or the drill list ticked off. The player sent
       nothing at all, so every follow-along session was unlabelled. */
    mode:'player',
    drills:Q.length,
    mins:Math.round(Q.reduce((a,x,_i)=>a+work(x.it,x.g||x.grp)+rest(x,_i,Q),0)/60),
    actual: sessionStart?Math.round((Date.now()-sessionStart)/60000):0,
    got: done?Q.length:qi, of: Q.length,
    /* where they stopped is the useful half of an abandoned session */
    stoppedAt: done?'':((Q[qi]&&Q[qi].it&&Q[qi].it.n)||''),
    block: done?'':((Q[qi]&&Q[qi].grp)||'')}});
  st.lastSessionMins = sessionStart ? Math.round((Date.now()-sessionStart)/60000) : 0;
  if(done) track('finish');
  fixSessionDone(done);
  if(done && !st.in) advanceDay();
  save();
  if(done){ st.ovSummary=true; openOv('summary'); }
  else if(partWay){ render(); openOv('why'); }
  else render(); }
/* One switch for the lot: the rest chime, the follow-along clip and every
   demo. It was per video and reset on each render, so turning sound on was
   something you did over and over. */
const soundOn = () => st.sound !== false;
/* the icon and the word together: an icon alone is a state nobody can read */
function paintSound(){
  const b=document.getElementById('p-sound');
  if(b){
    b.classList.toggle('on', cueOn());
    b.innerHTML=(cueOn()?VB_SPK:VB_MUTED)+'<span>Cue '+(cueOn()?'on':'off')+'</span>';
    b.setAttribute('aria-label', cueOn()
      ? 'The end of each set sounds and buzzes. Turn it off'
      : 'The end of each set is silent. Turn it on');
  }
  const l=document.getElementById('l-sound');
  if(l){ l.innerHTML=soundOn()?VB_SPK:VB_MUTED;
         l.setAttribute('aria-label', soundOn()?'Sound on':'Sound off'); }
}
function toggleSound(){
  st.sound = !soundOn(); save();
  document.querySelectorAll('#player video, .vb video').forEach(v=>{
    try{ v.muted = !soundOn(); }catch(e){}
  });
  document.querySelectorAll('[data-vb-sound]').forEach(b=>{
    b.innerHTML = soundOn()?VB_SPK:VB_MUTED;
    b.setAttribute('aria-label', soundOn()?'Sound on':'Sound off');
  });
  paintSound();
}
/* ── the clock on a row ──────────────────────────────────────────────
   Working down the list meant timing your own holds on a phone clock,
   which is the one thing a training app should never make you do. Tapping
   the seconds runs that set down in place. One row at a time, counted on
   wall-clock deltas so a backgrounded tab does not drift, and it ticks the
   set off when it lands. Tap again to stop it. */
let rowT=null;          /* {k, ends, raf, label, secs} */
function rowClockStop(done){
  if(!rowT) return;
  clearInterval(rowT.raf);
  const el=document.getElementById('clk-'+rowT.k);
  if(el){ el.textContent=rowT.label; el.style.background='rgba(0,102,99,.08)';
          el.style.color='var(--forest)'; }
  const key=rowT.k; rowT=null;
  if(done){ cue();
    /* the same tick the box does, so one set is one tick wherever it came from */
    const box=document.getElementById('box-'+key);
    if(box && !box.classList.contains('on')) box.click();
  }
}
function rowClock(k){
  if(rowT && rowT.k===k) return rowClockStop(false);
  if(rowT) rowClockStop(false);
  const el=document.getElementById('clk-'+k);
  if(!el) return;
  const secs=Number(el.dataset.secs)||0;
  if(secs<=0) return;                       /* a rep drill has nothing to count */
  rowT={k, label:el.textContent, ends:Date.now()+secs*1000, raf:0};
  const paint=()=>{
    if(!rowT) return;
    const el2=document.getElementById('clk-'+rowT.k);
    if(!el2 || !el2.isConnected) return rowClockStop(false);
    const left=Math.ceil((rowT.ends-Date.now())/1000);
    if(left<=0) return rowClockStop(true);
    el2.textContent=left+'s';
    el2.style.background='var(--forest)';
    el2.style.color='var(--on-primary)';
  };
  paint();
  rowT.raf=setInterval(paint,200);
}
/* ── the cue at the end of a set ───────────────────────────────────
   One switch used to mute the films and silence the timer together, so
   the combination everybody actually wants, a silent demo and a loud
   cue, was the one you could not have. The cue has its own switch now,
   and it buzzes as well as sounds, because a 660Hz blip does not carry
   in a gym and you are upside down looking at the floor. */
const cueOn = () => st.cue !== false;
function toggleCue(){ st.cue=!cueOn(); save(); paintSound();
  if(cueOn()) cue(); }
function cue(){
  if(!cueOn()) return;
  try{ if(navigator.vibrate) navigator.vibrate([45,60,45]); }catch(e){}
  beep();
}
function beep(){ if(!cueOn()) return; try{ const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
  o.frequency.value=660;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.2,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);
  o.start();o.stop(a.currentTime+.31);}catch(e){} }
/* ── the screen has to stay on ─────────────────────────────────────
   Nothing held the screen awake, and the player pauses itself when the
   screen goes dark. So you propped the phone, kicked up, and half a
   minute later it dimmed, locked, and the session sat paused while you
   were upside down looking at the floor. A wake lock is dropped by the
   browser whenever the tab is hidden, so it is taken again every time
   the tab comes back. */
let wakeLock=null;
function keepAwake(){
  try{
    if(!navigator.wakeLock || wakeLock) return;
    navigator.wakeLock.request('screen').then(l=>{
      wakeLock=l;
      l.addEventListener('release', ()=>{ wakeLock=null; });
    }).catch(()=>{});
  }catch(e){}
}
function letSleep(){
  try{ if(wakeLock) wakeLock.release(); }catch(e){}
  wakeLock=null;
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(tick_){ paused=true;
      document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}}); paintPause(); }
    return;
  }
  const pl=document.getElementById('player');
  if(pl && pl.classList.contains('on')) keepAwake();
});

   has just hit a bug, a person with an idea and a person who simply likes
   it are three different conversations and only one of them is urgent.

   One box, and then the offer of more. Most people will write a line and
   go, and asking them six questions first means they write nothing. The
   longer set is there for the ones who want to be asked. */
const FB_KINDS=[
  ['bug',   'Something is broken',  'It crashed, a video will not play, a number looks wrong'],

  ['better','What got better?',null],
  ['friction','What got in the way?',null],

  ['quote','Happy for a line of this to be used publicly, first name only?',['Yes','No']]

const FB_MORE=[
  ['often','How often are you actually training with it?',
    ['Most days','A few times a week','Now and then','I have stopped']],
  ['stuck','What are you stuck on right now?', null],

  ['pay','Would the whole ladder be worth the monthly price to you?',

function fbSet(f,val){ st.fb=st.fb||{}; st.fb[f]=val; save(); }
function fbExtra(k,val){ st.fb=st.fb||{}; st.fb.extra=Object.assign({}, st.fb.extra||{}); 
  st.fb.extra[k]=val; save(); if(FB_MORE.concat(FB_BLOCK).some(r=>r[0]===k && r[2])) drawOv(); }
function fbMore(){ st.fb=Object.assign({}, st.fb||{}, {more:!(st.fb||{}).more}); save(); drawOv(); }
function fbSend(){
  const fb=st.fb||{};
  const el=$('#fbText'); const text=((el&&el.value)||fb.text||'').trim();
  const say=m=>{ const e2=$('#fbMsg'); if(e2) e2.textContent=m; };
  if(!text){ say('Write a line first.'); return; }
  say('Sending…');
  const extra=Object.assign({}, fb.extra||{});
  /* the free text answers live in the DOM until they are sent, so that
     typing in them does not repaint the sheet underneath the cursor */
  ((fb.kind==='block')?FB_BLOCK:FB_MORE).forEach(([k,,opts])=>{ if(opts) return;
    const e3=document.getElementById('fbx-'+k);
    if(e3 && e3.value.trim()) extra[k]=e3.value.trim(); });
  fetch(AUTH.feedback,{method:'POST',
    headers:st.token?authed():{'Content-Type':'application/json'},
    body:JSON.stringify({kind:fb.kind||'review', text, extra,
      stage:curStage()+1, plus:!!st.plus})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that')))
    .then(()=>{ st.fb={sent:true}; save(); drawOv(); })
    .catch(e=>say(String(e)));
}

/* ── video block ───────────────────────────────────────────────────
   Native controls put a black bar over the clip and a three-dot menu
   offering Download on paid footage. This is the same loop with our own
   chrome: tap to play/pause, a scrub line, and a sound toggle. */
const VB_SPK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const VB_MUTED='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
/* A drill clip, with the caption plate and the player's own fullscreen and
   rotate. The explainers have had both since the player was built; the
   drills were still the bare loop. */
function drillFilm(url, ratio){
  const uid=uidOfUrl(url);
  if(!uid) return vidBlock(url, ratio, 'contain');
  setTimeout(mountCaptions,0);
  return ccWrap(`<video src="${sig(url)}" controls playsinline loop muted
    poster="${streamThumb(uid)}" data-cc="${uid}"
    style="width:100%;aspect-ratio:${ratio||'4/3'};object-fit:contain;
    background:#11150f;display:block"></video>`,
    'border-radius:22px;overflow:hidden;margin-bottom:18px');
}
function vidBlock(url, ratio, fit){
  return `<div class="vb" data-vb style="position:relative;border-radius:22px;overflow:hidden;
    background:#000;margin-bottom:18px;cursor:pointer">
    <video src="${sig(url)}#t=0.6" ${soundOn()?'':'muted'} loop playsinline preload="metadata" autoplay
      style="display:block;width:100%;aspect-ratio:${ratio||'4/3'};object-fit:${fit||'cover'};background:#11150f"></video>
    <div data-vb-play style="position:absolute;inset:0;display:grid;place-items:center;
      background:rgba(0,0,0,.18);opacity:0;transition:opacity .18s;pointer-events:none">
      <span style="width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.92);
        display:grid;place-items:center;font-size:19px;color:#111111">&#9654;</span></div>
    <div style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;
      padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.55))">
      <div data-vb-track style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)">
        <div data-vb-fill style="height:100%;width:0;border-radius:2px;background:#fff"></div></div>
      <button data-vb-sound aria-label="Sound" style="flex:none;width:30px;height:30px;border:none;
        border-radius:50%;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;
        display:grid;place-items:center;padding:0">${soundOn()?VB_SPK:VB_MUTED}</button>
    </div></div>`;
}
document.addEventListener('click',function(e){
  const box=e.target.closest('[data-vb]'); if(!box) return;
  const v=box.querySelector('video'); if(!v) return;
  const sound=e.target.closest('[data-vb-sound]');
  if(sound){
    /* the toggle is the app's setting, not this one clip's, so it holds
       across drills and across sessions */
    toggleSound();
    if(soundOn() && v.paused) v.play().catch(()=>{});
    return;
  }
  const track=e.target.closest('[data-vb-track]');
  if(track && v.duration){
    const r=track.getBoundingClientRect();
    v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v.duration;
    return;
  }
  if(v.paused) v.play().catch(()=>{}); else v.pause();
},true);
/* one loop keeps every visible scrub line in sync — cheaper than a
   timeupdate listener per clip, and it stops when nothing is on screen */
(function vbLoop(){
  document.querySelectorAll('[data-vb]').forEach(function(box){
    const v=box.querySelector('video'); if(!v) return;
    const f=box.querySelector('[data-vb-fill]');
    if(f && v.duration) f.style.width=((v.currentTime/v.duration)*100).toFixed(1)+'%';
    const pl=box.querySelector('[data-vb-play]');
    if(pl) pl.style.opacity = v.paused ? '1' : '0';
  });
  requestAnimationFrame(vbLoop);
})();

/* Drag the sheet down to dismiss it. Only starts when the sheet is already
   scrolled to the top, so a downward swipe through a long list still scrolls
   the list rather than throwing it away. */
function bindSheetDrag(sheet){
  let y0=null, dy=0, live=false;
  const start=e=>{
    if(sheet.scrollTop>0) return;
    y0=e.touches?e.touches[0].clientY:e.clientY; dy=0; live=true;
    sheet.classList.add('drag');
  };
  const move=e=>{
    if(!live||y0==null) return;
    const y=e.touches?e.touches[0].clientY:e.clientY;
    dy=y-y0;
    if(dy<=0){ sheet.style.transform=''; return; }
    if(e.cancelable) e.preventDefault();
    sheet.style.transform='translateY('+dy+'px)';
    sheet.style.opacity=String(Math.max(.4, 1-dy/500));
  };
  const end=()=>{
    if(!live) return;
    live=false; sheet.classList.remove('drag');
    sheet.style.transform=''; sheet.style.opacity='';
    if(dy>110) closeOv();
    y0=null; dy=0;
  };
  sheet.addEventListener('touchstart',start,{passive:true});
  sheet.addEventListener('touchmove',move,{passive:false});
  sheet.addEventListener('touchend',end);
  sheet.addEventListener('touchcancel',end);
  sheet.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
}

/* let people read what they typed — most sign-in failures here are just a
   fat-fingered password on a phone keyboard */
/* the sign-up form's own eye, same behaviour, different ids */
function toggleJoinPw(){ togglePw('#joinPw','#joinEye','#joinEyeSlash'); }
function togglePw(iSel,bSel,sSel){
  const i=$(iSel||'#pwIn'), b=$(bSel||'#pwEye'), sl=$(sSel||'#pwEyeSlash');
  if(!i) return;
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  if(sl) sl.style.display = show ? '' : 'none';
  if(b){ b.setAttribute('aria-pressed', show ? 'true' : 'false');
         b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); }
  i.focus();
  // keep the caret at the end rather than jumping to the start on type-swap
  try { const n=i.value.length; i.setSelectionRange(n,n); } catch(e){}
}

function doLogin(ev){
  if(ev) ev.preventDefault();
  const email=(($('#emailIn')||{}).value||'').trim().toLowerCase();
  const password=($('#pwIn')||{}).value||'';
  const msg=$('#authMsg');
  if(!email||!password){ if(msg) msg.textContent='Both fields, please.'; return; }
  if(msg) msg.textContent='Checking…';
  fetch(AUTH.login,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password})})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{
      /* a coach signing in here wants the coach view, not a client screen */
      if(d.coach){ leaveTo('/lha-coach.html'); return; }
      st.email=email; st.token=d.token; st.client=d.client;
      st.in=!!d.coached; st.coached=!!d.coached;            /* coached tier only for actual coaching clients */
      st.plus=!!d.plus;
      if(!st.in){ st.mode='free'; st.quizDone=true; if(!st.tab||st.tab==='signin') st.tab='ladder'; }
      save(); render(); loadEntitlement();
      if(st.in){ loadProgramme(); loadProgress(); loadThread(); }
      /* a code typed on the wall before signing in was parked and only ever
         picked up on a cold start, so signing in landed them back on the
         wall with nothing said */
      loadLadder(); loadState(); loadTrack(); codeResume(); })
    .catch(code=>{ const m=$('#authMsg');
      if(m) m.textContent = code===429 ? 'Too many tries. Wait a few minutes.'
                                       : 'That email and password did not match.'; });
}
function requestCode(){
  const v=($('#emailIn')||{}).value||'';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ $('#authMsg').textContent='That does not look like an email address.'; return; }
  st.email=v.trim().toLowerCase();
  $('#authMsg').textContent='Sending…';
  fetch(AUTH.request,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:st.email})})
    .then(r=>{ if(!r.ok) throw 0; st.codeSent=true; save(); render(); })
    .catch(()=>{ const m=$('#authMsg');
      if(m) m.textContent='Could not send that just now. Try again in a moment.'; });
}
function verifyCode(){
  const c=(($('#codeIn')||{}).value||'').trim();
  if(c.length<4){ $('#authMsg').textContent='Enter the six digits from the email.'; return; }
  $('#authMsg').textContent='Checking…';
  fetch(AUTH.verify,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:st.email,code:c})})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{
      if(d.coach){ leaveTo('/lha-coach.html'); return; }
      st.token=d.token; st.client=d.client||nameFrom(st.email);
      /* this set st.in on everyone who came through the code door, so a
         coach was shown a coached client's screens with no programme behind
         them. The server says which they are. */
      st.in = (d.coached!==undefined) ? !!d.coached : true; st.coached=st.in;
      st.plus=!!d.plus;
      if(!st.in){ st.mode='free'; st.quizDone=true; if(!st.tab||st.tab==='signin') st.tab='ladder'; }
      save(); render(); loadEntitlement();
      if(st.in){ loadProgramme(); loadProgress(); loadThread(); }
      loadLadder(); loadState(); loadTrack(); })
    .catch(()=>{
      const m=$('#authMsg'); if(m) m.textContent='That code did not work. Check it, or send a new one.';
    });
}
const nameFrom=e=>{const n=(e||'').split('@')[0].split(/[._-]/)[0]; return n.charAt(0).toUpperCase()+n.slice(1);};

/* The homepage runs this whole app inside an iframe, and Stripe refuses to
   be framed, so sending checkout to location.href left the button saying
   "Opening checkout…" for ever. Break out of the frame when there is one,
   and open a tab if the browser will not let us. */
function leaveTo(url){
  try{
    if(window.top && window.top!==window.self){ window.top.location.href=url; return true; }
  }catch(e){
    /* a cross-origin parent will not let us read it, let alone set it */
    const w=window.open(url,'_blank','noopener'); if(w) return true; return false;
  }
  location.href=url; return true;
}

/* ── programme delivery ────────────────────────────────────────────
   The plan used to be baked into this file, so every client saw the
   same one. It now comes from the server, chosen by the token, and is
   cached so the app still opens on a gym floor with no signal. */
function libraryDrills(){
  /* prefer the full library; fall back to whatever the plan contains
     so the screen is never empty on a cold first load */
  const base = (LIBRARY && LIBRARY.length) ? LIBRARY : (function(){
    const out=[];
    DATA.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{
      if(!out.some(x=>x.v===it.v)) out.push(it); })));
    return out;
  })();
  /* A coached client has a written programme, and anyone who has paid has
     the ladder, so both see the lot. On free it was every drill in every
     stage, which gave away the material the paid stages are for. */
  if (isPlus()) return base;
  const open = new Set();
  for (let i = 0; i < FREE_STAGES && i < STAGES.length; i++) {
    (STAGE_SECTIONS[i] || []).forEach(sec =>
      (sec.items || []).forEach(it => open.add(it.v)));
    ((STAGES[i] || {}).drillIds || []).forEach(v => open.add(v));
  }
  if (typeof WRIST_DAY !== 'undefined') (WRIST_DAY.drills || []).forEach(v => open.add(v));
  return base.filter(d => open.has(d.v));
}
function libToArray(lib){
  if(!lib || !lib.names) return [];
  return Object.keys(lib.names).map(v=>({
    v:v, n:lib.names[v]||v, url:(lib.video||{})[v]||'', d:'', nt:'',
    cues:(lib.cues||{})[v]||[], desc:(lib.desc||{})[v]||''
  }));
}
function applyProgramme(d){
  if(d && d.plan && d.plan.days && d.plan.days.length) DATA = d.plan;
  /* The server works out which block they are on, when it started and when
     the test is due, and sends it on every load. This threw it away, so the
     app guessed from the client's first ever session instead: the header
     said week six of six for ever and the test countdown had nothing to do
     with the coach's block. */
  if(d && d.cycle && d.cycle.start) { st.cycle = d.cycle; save(); }
  /* the one line the coach wrote to this person about this week */
  if(d && Object.prototype.hasOwnProperty.call(d,'week')) { st.week = d.week || null; save(); }
  const arr = libToArray(d && d.library);
  if(arr.length) LIBRARY = arr;
  if(d && d.ladderExtra) { st.ladderExtra = d.ladderExtra; save(); }
  if(d && d.timing) { st.timing = d.timing; save(); }
  if(d && d.ladderBands) { st.ladderBands = d.ladderBands; save(); }
  if(d && d.ladderMix)   { st.ladderMix = d.ladderMix; save(); }
  if(d && d.bandTiming)  { st.bandTiming = d.bandTiming; save(); }
  if(d && d.ladderCps)   { st.ladderCps = d.ladderCps; save(); }
  if(st.day >= DATA.days.length) st.day = 0;
}
function cacheProgramme(d){
  try { localStorage.setItem('lha_plan', JSON.stringify(
    {at:Date.now(), email:st.email, plan:d.plan, library:d.library,
     cycle:d.cycle, week:d.week, ladderExtra:d.ladderExtra, timing:d.timing})); } catch(e){}
}
function loadCachedProgramme(){
  try {
    const c = JSON.parse(localStorage.getItem('lha_plan')||'null');
    /* a cached plan belongs to one address — never show it to someone else */
    if(c && c.email === st.email) { applyProgramme(c); return true; }
  } catch(e){}
  return false;
}
/* the app's own copy of what the server has recorded — the Progress screen
   used to show invented numbers because nothing real was available */
function loadProgress(){
  if(!st.token) return Promise.resolve();
  return fetch(AUTH.progress,{headers:authed()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){
      st.prog=d;
      /* the account holds the rep history, derived from its own sessions, so
         it follows the client to a new phone. The local copy is only what has
         not reached the server yet. */
      if(d.repsLog) st.repsLog=d.repsLog;
      /* the best of each shape is derived from the account's own holds, so a
         new phone knows what they have already done */
      save(); render();
    } })
    .catch(()=>{});
}
function sessionsDone(){ return ((st.prog&&st.prog.sessions)||[]).filter(x=>x.done); }
/* The block the coach is running: which one, when it started, when the test
   in it is due. It comes from the server with the programme. Before there is
   one, fall back to the client's first session so a brand new client is not
   shown a blank. */
function blockStart(){
  const c=st.cycle;
  if(c && c.start) return c.start;
  const p=st.prog||{};
  return (p.sessions&&p.sessions.length&&p.sessions[0].at)
    || (p.opens&&p.opens.length&&new Date(p.opens[0]+'T00:00:00').getTime())
    || null;
}
function blockNo(){ return (st.cycle && st.cycle.n) || 1; }
/* uncapped: "week 6 of 6" for ever was the old lie, and a block runs until
   the coach starts the next one rather than for a fixed six weeks */
function weekNow(){
  const st0=blockStart(); if(!st0) return 1;
  return Math.max(1, Math.floor((Date.now()-st0)/(7*86400000))+1);
}
/* days until the test, negative once it is overdue. null when we do not know
   yet, which is not the same as zero. */
function testIn(){
  const c=st.cycle;
  const due = (c && c.dueAt) ? c.dueAt
    : (blockStart() ? blockStart() + ((c&&c.days)||14)*864e5 : 0);
  if(!due) return null;
  return Math.ceil((due-Date.now())/864e5);
}
/* completed sessions bucketed into the six weeks of a block */
function weekGrid(){
  const st0=blockStart(); const out=[[],[],[],[],[],[]];
  if(!st0) return out;
  sessionsDone().forEach(function(x){
    const w=Math.floor((x.at-st0)/(7*86400000));
    if(w>=0&&w<6) out[w].push(x);
  });
  return out;
}

function loadProgramme(){

/* ── what gets reported back ───────────────────────────────────────
   Ticks, ratings and hold times already lived in this browser and went
   nowhere. Elliott can only coach what he can see, so a summary goes to
   the server. Nothing here is sent for a free-tier user — no token, no
   report. */
let progQueued=null;
/* one visit per load, stamped on first touch and closed out on the way out */
let visitStart=0, visitSent=false;
function watchVisit(){
  const begin=()=>{
    if(visitSent || !st.token) return;
    visitSent=true; visitStart=Date.now();
    reportProgress({visit:{ms:0}});
    ['pointerdown','keydown'].forEach(e=>document.removeEventListener(e,begin,true));
  };
  ['pointerdown','keydown'].forEach(e=>document.addEventListener(e,begin,true));
  /* how long they actually stayed, sent once, on the way out. keepalive so a
     closing tab still gets it away. */
  const close=()=>{
    if(!visitSent || !visitStart) return;
    const ms=Date.now()-visitStart; visitStart=0;
    try{
      fetch(AUTH.progress,{method:'POST',headers:authed(),keepalive:true,
        body:JSON.stringify({visit:{ms}})});
    }catch(e){}
  };
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) close(); });
  window.addEventListener('pagehide', close);
}

function reportProgress(extra){
  if(!st.token) return Promise.resolve();
  const flags={};
  Object.keys(st.rate||{}).forEach(function(v){
    if(st.rate[v]==='easy'||st.rate[v]==='hard')
      flags[v]={rate:st.rate[v], note:(st.note||{})[v]||''};
  });
  /* hold used to be on every payload "for the coach's older reads", so the
     server appended a row for the same number on every visit and every flag
     change, and the hundred-row cap pushed the real history out. The old hold timer
     sends it on its own, with the shape it was held in. */
  const payload=Object.assign({flags:flags}, extra||{});
  return fetch(AUTH.progress,{method:'POST',headers:authed(),body:JSON.stringify(payload)})
    .catch(function(){});   /* never let reporting break the session */
}
/* one call a minute at most — this is a summary, not a telemetry feed */
function reportSoon(extra){
  if(progQueued) clearTimeout(progQueued);
  progQueued=setTimeout(function(){ progQueued=null; reportProgress(extra); }, 1500);
}

function signOut(){
  closeMenu();

     looked like nothing had happened. Drop right back to the free app. */
  if(typeof tick_!=='undefined' && tick_){ clearInterval(tick_); tick_=null; }
  if(typeof stopHold==='function') stopHold();
  /* this is usually tapped from inside the account overlay, which sits over
     everything — leave it open and signing out looks like a dead button */
  st.ov=null;
  const ov=$('#ov'); if(ov){ ov.classList.remove('on'); ov.innerHTML=''; }
  document.querySelectorAll('video').forEach(v=>{try{v.pause()}catch(e){}});
  /* Clearing the token and the name left everything else behind: the stage
     the last person reached, their check point log, their quiz answers,
     their email, and st.plus — so the next person to pick up a shared phone
     opened a fully unlocked ladder showing somebody else's 7 of 7, and a
     reload did not shift it. Signing out is a clean device now. Anyone
     signing back in gets it all again from the server, which is where it
     actually lives. */
  const keep={
    sound: st.sound,                 /* a device preference, not a person */
    ref:   st.ref,                   /* where this device first came from */
  };
  try{ localStorage.removeItem('lha_plan'); }catch(e){}
  try{ localStorage.removeItem(K); }catch(e){}
  st={};
  Object.keys(keep).forEach(k=>{ if(keep[k]!=null && keep[k]!==undefined) st[k]=keep[k]; });
  st.day=0; st.tick={}; st.rate={}; st.note={}; st.open={}; st.why={};
  st.mode='free';                    // skip the welcome gate on the way out
  st.tab='ladder';                   // a screen they can actually use

     DATA.something and a null would throw on the way out */
  DATA={days:[{id:'1',label:'Day 1',sub:'',title:'Day 1',when:'',mins:'0',groups:[]}],

/* ── flags, tests, and anything else that reaches Elliott ── */
const FORM='https://formspree.io/f/xvzjawjv';
function post(payload){
  /* email is still the alert; the dashboard is the record */
  /* _reported means the caller already filed the detailed version */
  if(st.in&&st.token&&payload&&payload.type&&!payload._reported){
    reportProgress({feedback:{kind:payload.type,
      text:[payload.text,payload.results,payload.flags,payload.reasons]
        .filter(Boolean).join(' · ').slice(0,900)}});
  }
  return fetch(FORM,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(Object.assign({client:st.client||'',email:st.email||''},payload))}).catch(()=>{});
}
function tick(k){

/* ticking a drill off in the list. Kept apart from the coached plan's own
   ticks, which are keyed by day and group rather than by queue position. */
/* A card is a drill now, not a set, so the box has to move all of its sets
   at once. Partly ticked is still a state the card can show, because the
   player writes the ticks one set at a time. */
function qTickAll(keys,el){
  const list=String(keys||'').split(',').filter(Boolean);

     stepper you were using and where you had scrolled to. */

/* the header line and the Done button, kept in step without a redraw */
/* how many different drills, which is what a card is. Counting queue entries
   called a nine drill session twenty five drills. */
function qDrills(){
  const seen=[]; (Q||[]).forEach(q=>{ if(seen.indexOf(q.it.v)<0) seen.push(q.it.v); });
  return seen.length;
}
/* How long the built session takes, counted the same way in both places
   that say it. The rest after the very last set was being counted, and
   nobody rests after they have finished. */
function qMins(){
  const q=(Q||[]);
  const secs=q.reduce((a,x,i)=>a+work(x.it,x.g||x.grp)+(i<q.length-1?rest(x,i,q):0),0);
  return Math.max(1,Math.round(secs/60));
}
