/* the list is a way of training, so finishing it has to count the same as
   finishing the player — the same session record, marked as worked through
   rather than followed along. */
function finishChecklist(){
  const ticked=(Q||[]).filter((_,i)=>(st.qTick||{})['q'+i]).length;
  if(!ticked) return;
  const done=ticked>=(Q||[]).length;
  const mins=Math.round((Q||[]).reduce((a,x,_i)=>a+work(x.it)+rest(x,_i,Q),0)/60);
  reportProgress({session:{
    day:st.day, name:((Q[0]&&Q[0].grp)||''), done, mode:'list',
    drills:Q.length, mins, actual:0, got:ticked, of:Q.length,
    items:(Q||[]).map((q,i)=>{
      const a=doseAmount(q.it), got=(st.qTick||{})['q'+i]?1:0;
      const adj=(st.reps||{})['q'+i]||0;
      return {v:q.it.v, n:q.it.n, of:1, got,
        /* what they did. Only an adjusted number was recorded before, so a
           drill done exactly as asked counted for nothing at all. */
        reps: got ? (adj||a.n) : 0, unit:a.unit, per:a.n,
        secs: got ? (work(q.it)||0) : 0,
        /* what was asked for, so short of it or past it is visible on both
           sides rather than a bare number with nothing to read it against */
        want:a.n||recommendedReps(q.it)||0, dose:String(q.it.d||'').slice(0,40),
        rate:(st.rate||{})[q.it.v]||''};
    }).slice(0,40)
  }});
  st.prog=st.prog||{}; st.prog.sessions=st.prog.sessions||[];
  st.prog.sessions.push({at:Date.now(), done:true, mins, mode:'list'});
  logReps();
  if(done) track('finish');
  fixSessionDone(done);
  st.qTick={}; st.reps={}; save(); closeOv(); openOv('summary');
}

/* the list's own flag toggle: state, then the two buttons and the note box
   that belong to this row */
/* What this drill's grouping is running at, and what a rating will do to
   it. Said out loud, because a session that quietly gets harder reads as
   the app being inconsistent rather than the person getting better. */
function levelLine(v){
  if(typeof poolRow!=='function') return '';
  const row=poolRow(curStage(), v);
  return (row && row.g!=='Warm-up') ? row.g : '';
}

function rateRow(v,k,r){
  st.rate=st.rate||{}; st.note=st.note||{};
  const now = st.rate[v]===r ? '' : r;
  st.rate[v]=now;
  if(now!=='easy'&&now!=='hard') delete st.note[v];
  /* a rating is only a flag to a coach if there is one; on the ladder it is
     the thing that moves the work */
  /* on a coached plan this is a flag for the coach and nothing else; the
     ladder's difficulty is one dial on the ladder screen now */
  save(); reportSoon();
  const e=document.getElementById('easy-'+k), h=document.getElementById('hard-'+k);
  if(e) e.classList.toggle('on', now==='easy');
  if(h) h.classList.toggle('on', now==='hard');
  const ll=document.getElementById('lvl-'+k);
  if(ll) ll.textContent = levelLine(v);
  const box=document.getElementById('note-'+k);
  if(box){
    box.hidden = !now;
    const lbl=document.getElementById('notelbl-'+k);
    if(lbl && now) lbl.textContent = now==='hard' ? 'TOO HARD' : 'TOO EASY';
  }
}

function rate(v,r){ st.rate[v]=st.rate[v]===r?'':r; if(st.rate[v]!=='easy'&&st.rate[v]!=='hard') delete st.note[v]; save(); reportSoon(); render(); }
function sendFlags(){
  const f=Object.keys(st.rate).filter(v=>st.rate[v]==='easy'||st.rate[v]==='hard');
  if(!f.length) return;
  const names={}; DATA.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(i=>names[i.v]=i.n)));
  post({type:'Drill flags',flags:f.map(v=>st.rate[v].toUpperCase()+': '+(names[v]||v)+(st.note[v]?' ("'+st.note[v]+'")':'')).join('\n')});
  st.flagSent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}); save(); render();
}
function filmTest(id,name){
  if(upBusy) return;
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
    const say=m=>{ const el=$('#tc-'+id); if(el) el.textContent=m; };
    upBusy=true;
    uploadClip(f,say)
      .then(uid=>{ st.testClips=st.testClips||{}; st.testClips[id]={uid,name}; save();
                   upBusy=false; say(''); drawOv(); })
      .catch(e=>{ upBusy=false; say(String(e)); });
  };
  inp.click();
}

/* numbers and clips go together — that pairing is the review */
function sendTest(){
  const vals=st.testDraft||{};
  const clips=Object.entries(st.testClips||{}).map(([id,c])=>({drill:id,name:c.name,uid:c.uid}));
  const named={}; DATA.test.items.forEach(t=>{ if(vals[t.id]) named[t.n]=vals[t.id]+' '+t.u; });
  if(!clips.length && !Object.keys(named).length){
    const m=$('#testMsg'); if(m) m.textContent='Add a number or a clip first.'; return;
  }
  const m=$('#testMsg'); if(m) m.textContent='Sending…';
  fetch(AUTH.submission,{method:'POST',headers:authed(),
    body:JSON.stringify({kind:'test',numbers:named,clips})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that')))
    .then(()=>{
      st.tests=(st.tests||[]).concat([vals]); st.testDraft={}; st.testClips={};
      /* the countdown read this and nothing ever wrote it, so sending a test
         never changed the number on the card */
      st.testAt=Date.now();
      st.awaitingReview=Date.now(); save();
      reportProgress({test:vals}); closeOv(); loadThread(); render();
    })
    .catch(e=>{ const el=$('#testMsg'); if(el) el.textContent=String(e); });
}

with bent legs. Open the legs out to the side and circle them to centre, keeping the gaze down and elevating the scapula to push up into position."}, {"v": "tuck-entries", "n": "Tuck Entries", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/1215255521e9da9fd966e8b6d7ec128b/downloads/default.mp4", "d": "", "nt": "", "cues": ["Stack the shoulders over the hands.", "Keep knees together throughout.", "Jump up to a tuck handstand.", "Extend the legs and push the pelvis through to straight."], "desc": "Once the shoulders are stacked, keep the knees together and jump up to a tuck handstand. Extend the legs and push the pelvis through to bring the body into a straight line."}, {"v": "p-pike-pushups", "n": "Pike Push Ups", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/1d49ef13267f7b9516df86a406c3412a/downloads/default.mp4", "d": "", "nt": "", "cues": ["Feet a little wider than hips, knees bent, hips high.", "Look forward to a point between the hands.", "Lower the forehead to that point, elbows tucked.", "Push back up keeping the diagonal line."], "desc": "Front deltoid strength — the fix if you end up collapsing in the take-off. Build the pressing strength the take-off demands."}, {"v": "p-pike-pushup-negs", "n": "Pike Push Up Negatives", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5fc1575443b323abd17a824d634ddb41/downloads/default.mp4", "d": "", "nt": "", "cues": ["Lower under control.", "Keep the shoulders elevated throughout."], "desc": "A progression on the pike push up — load the lowering phase to build pressing strength."}, {"v": "p-pike-pushups-knees", "n": "Pike Push Ups on Knees", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/990e81ff459d2a428966d1cfc75d868c/downloads/default.mp4", "d": "", "nt": "", "cues": ["Same shape, less load.", "Build to the full pike push up."], "desc": "A regression — the same pressing pattern made more accessible. Build the strength from your knees first."}, {"v": "p-l-handstand", "n": "L-Shaped Handstand", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/ae64c76e183bb5191aaf6856240a3eab/downloads/default.mp4", "d": "", "nt": "", "cues": ["Stack the hips over the shoulders.", "Push tall through the shoulders.", "Build to 30 seconds — rest as you need, but get there.", "Hold at about 70% of your max: a challenge, not impossible."], "desc": "Helps you learn to get the hips stacked over the shoulders — the position the take-off has to find."}, {"v": "p-tuck-handstand", "n": "Tuck Handstand", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/823cfe703e74214ad84ddba54a386bbe/downloads/default.mp4", "d": "", "nt": "", "cues": ["Engage the hip flexors to pull the knees down.", "Let the lower back draw the hips into anterior pelvic tilt.", "Push tall — actively elevate the scapula.", "Avoid posterior tilt — it becomes a tuck planche."], "desc": "HERO DRILL. The scapula needs to be elevated to properly take off, and the tuck handstand is the best teacher — it shows you how to move the hips and elevate the scapula at the same time. The lower centre of mass makes balancing easier but you feel it far more in the shoulders."}, {"v": "p-tuck-slides", "n": "Tuck Handstand Slides", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/b8566b45406a58ad0824b1af38a4ea85/downloads/default.mp4", "d": "", "nt": "", "cues": ["Same start, hands 1.5 feet from the wall.", "Knees together, lower them down.", "The harder version — both legs at once."], "desc": "Movement patterning for the take-off — learn to get the hips stacked over the shoulders."}, {"v": "p-single-leg-tuck-slides", "n": "Single Leg Tuck Slides", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/b8566b45406a58ad0824b1af38a4ea85/downloads/default.mp4", "d": "", "nt": "", "cues": ["Chest to wall, hands about 1.5 feet from the wall, feet pointed.", "One foot stays on the wall.", "Take the other knee down towards your chest."], "desc": "A single-leg variation to build control and hip stacking one side at a time."}, {"v": "p-plank-slides", "n": "Plank Slides to Pike", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/7e7ebd3d88d2a9fc610a62d556d01ec4/downloads/default.mp4", "d": "", "nt": "", "cues": ["Move as one connected chain.", "Control the slide both ways."], "desc": "Conditioning — builds the connected-chain strength the compression demands."}, {"v": "p-bench-zombies", "n": "Bench Zombies", "url": "", "d": "", "nt": "", "cues": ["Point the feet on a gym bench.", "Hands on the floor.", "Slide the feet as close to the edge of the bench as you can.", "Get stacked, keep the back rounded."], "desc": "Plank with your feet on a bench, toes pointed. Pull yourself up until the hips are stacked over the shoulders."}, {"v": "p-bench-zombies-lowers", "n": "Bench Zombies Lowers", "url": "", "d": "", "nt": "", "cues": ["Start on the edge of the bench.", "Step off and lower slowly to the floor."], "desc": "Start on the edge of the bench, step off and slowly lower down to the floor — adds the eccentric to build strength through the position."}, {"v": "p-pancake", "n": "Pancake Training", "url": "", "d": "", "nt": "", "cues": ["Reach long through the chest.", "Build active range, not just passive."], "desc": "Flexibility — builds the active compression range in the straddle that the press relies on."}, {"v": "p-dd-toe-taps", "n": "Downward Dog Toe Taps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/097aa6b7a61129cdaf8a78e64ba389bb/downloads/default.mp4", "d": "", "nt": "", "cues": ["Push the hips up and back.", "Keep the shoulders open."], "desc": "Trains compression and shoulder position while keeping the wrists happy."}, {"v": "p-pelvis-glute", "n": "Pelvis & Glute Engagement Drill", "url": "", "d": "", "nt": "", "cues": ["Find the hip position on the floor first.", "Take it to the wall."], "desc": "On the floor and at the wall — trains the hip positioning that keeps the unroll organised."}, {"v": "p-solo-press-circles", "n": "Solo Press Circles", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/7ab907d930c9749d32486003184bcf23/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hold the handstand, open the legs.", "Start with small circles.", "Grow them as you get stronger.", "Both directions — speed doesn't matter."], "desc": "In a handstand, open the legs and make small circles. Grow the circles bigger over time, working towards the press position. Speed doesn't matter — work both directions."}, {"v": "p-back-to-wall", "n": "Back to Wall Press", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/7fdd9f7cceba8dcb31544af7550a0154/downloads/default.mp4", "d": "", "nt": "", "cues": ["Full upper back AND head on the wall.", "Focus on engaging the hip flexors.", "Keep the back rounded.", "If heavy on the wrists, turn the hands out to the side."], "desc": "HERO DRILL. Teaches the shape and compression with the wall taking some of the load. Make sure your full upper back as well as head is on the wall — this takes more of the weight so you can focus on engaging the hip flexors and keeping the back rounded."}, {"v": "p-chest-to-wall", "n": "Chest to Wall Press", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/eef15d6792347cd1aaeb0be71f222aeb/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands about 1.5 to 2 feet from the wall — you should only just feel you can touch it.", "Start in balance if you can.", "Bring the feet towards the wall and open out into a straddle.", "Come down the wall, rounding the upper back.", "Then push back up into a full handstand."], "desc": "THE ULTIMATE HERO. Trains all three stages — take-off, compression and unrolling — in a single movement. Your feet cannot go anywhere, so your shoulders cannot either: you either compress and unroll correctly, or the wall rejects you."}, {"v": "p-chest-to-wall-negs", "n": "Chest to Wall Negatives", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/900bba4d79fa55bd8e3db4d369e0157b/downloads/default.mp4", "d": "", "nt": "", "cues": ["Lower slowly and with control.", "Feel the path you will reverse on the way up."], "desc": "Lower under control from the wall handstand to break the ice and feel the descending path of the press."}, {"v": "shoulder-circles", "n": "Shoulder Circles", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/9ad6108b534d2c6375d629bd2f2363ea/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hold just above the chest.", "Circle the arm 10 times each side.", "Both directions."], "desc": ""}, {"v": "shoulder-pulses", "n": "Shoulder Pulses", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/c812fa2fff981dd17bb93580619601f8/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands above the head, or out to one side.", "Pulse in that direction without opening through the chest.", "Also try pulling the hands into fists with the thumbs pointing back.", "That gets a different stretch."], "desc": "Small pulses through the shoulders to open them up before load."}, {"v": "forward-fold-pulses", "n": "Forward Fold Pulses", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "plank-fingertip-lifts", "n": "Plank Fingertip Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5e23544c8db4eac5b2377f400d7ceb8a/downloads/default.mp4", "d": "", "nt": "", "cues": ["A plank, but up on the fingertips instead of flat palms.", "Spread the fingers wide before you take any weight.", "Lift one finger at a time and keep the rest planted.", "Stop if the wrists ache rather than work."], "desc": "A plank, but up on the fingertips instead of flat palms."}, {"v": "kneeling-scapula-engagement", "n": "Kneeling Scapula Engagement", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "chest-to-wall-toe-taps", "n": "Chest to Wall Toe Taps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/da4144ad54ec886963a8e09a8050c7c6/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands about 2 feet from the wall.", "One leg stays on the wall.", "Pull the other knee or toe towards the floor.", "Control it down, don't drop."], "desc": "Hands about 2 feet from the wall, one leg on the wall. Take the other leg off and pull the knee or toe down towards the floor."}, {"v": "press-eccentrics", "n": "Press Eccentrics", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/29ccefcc5c0dfb837de6272309d647cd/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start in the handstand.", "Lower slowly through the compression.", "Same path you'll press back up."], "desc": "The press in reverse. From the handstand, lower under control through the compressed position instead of pushing up out of it."}, {"v": "press-walks", "n": "Press Walks", "url": "", "d": "", "nt": "", "cues": ["Lift the heels and keep the hips high.", "Push into the ground before you look forward.", "Hips high is the real key.", "Hold for a few moments to make it harder.", "There's a full explainer under Why?"], "desc": "Baby hop the feet forward, then press the hips up and back as you lean forward. Walk up and down the mat."}, {"v": "block-reaches", "n": "Block Reaches", "url": "", "d": "", "nt": "", "cues": ["Seated forward fold, block in the hands.", "Reach forward over the feet.", "Engage through the quads.", "Active, not a passive hang."], "desc": "Sit in a forward fold holding a block. Reach forward over the feet, engaging through the quads. An active forward fold, not a passive one."}, {"v": "lolasana-lifts", "n": "Lolasana Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/1d8c3fd87048e4be984c51f8372f16ae/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands in front of the knees to make it harder.", "Fingers facing outwards to make it easier.", "From kneeling, push up into a pike.", "Bring the hands back to make it harder."], "desc": "Straight arms, knees tucked, lift and hold."}, {"v": "tuck-planche-hold", "n": "Tuck Planche Hold", "url": "", "d": "", "nt": "", "cues": [], "desc": "Straight arms, hips level. Strength work."}, {"v": "freestanding-hold", "n": "Freestanding Hold", "url": "", "d": "", "nt": "", "cues": ["Kick up, find it, hold it.", "Stop the set the moment the shape goes.", "Quality over seconds — this isn't a max attempt."], "desc": "A clean hold, not a maximum. Up to 15 seconds, stopping as soon as the line goes."}, {"v": "max-hold-test", "n": "Max Hold Test", "url": "", "d": "", "nt": "", "cues": ["Three attempts, best of three.", "Warm up properly first.", "Film one if you can."], "desc": "The tracked number. Three attempts, log the best."}, {"v": "dd-wrist-taps", "n": "Downward Dog Wrist Taps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/d79ada213578ca1993b4cb4b9f3ec4b1/downloads/default.mp4", "d": "", "nt": "", "cues": ["Set up in downward dog with the fingers spread.", "Tap one hand off the floor and replace it under control.", "Weight through the base of the fingers, not the heel of the hand.", "Alternate hands, even tempo."], "desc": "Load and unload one wrist at a time in downward dog, building tolerance without holding the position."}, {"v": "chair-assisted-knee-lifts", "n": "Chair-Assisted Knee Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/a3f7be549122a3e84dd46e1530724349/downloads/default.mp4", "d": "", "nt": "", "cues": ["Feet on the edge of a chair or sofa, in an assisted plank.", "Lift the knees, taking the hips up towards the sky.", "Keep looking between the palms the whole time."], "desc": ""}, {"v": "chair-assisted-step-ups", "n": "Chair-Assisted Step Ups", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/d5bff0ae8e4f8914cd35d7b906155956/downloads/default.mp4", "d": "", "nt": "", "cues": ["The same as the knee lifts.", "This time lift one leg up into the air."], "desc": ""}, {"v": "straddle-straight-tuck-diamond", "n": "Straddle → Straight → Tuck → Diamond", "url": "", "d": "", cues": ["Lie on your back, arms up as if you were in a handstand.", "Go into a dish shape.", "Pull the knees in towards the chest.", "Keep the back rounded and the lower back on the floor throughout."], "desc": ""}, {"v": "dd-to-crow-jump", "n": "Downward Dog to Crow Jump", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "crow-to-chaturanga", "n": "Crow to Chaturanga Jump Back", "url": "", "d": "", "nt": "", "cues": ["Find the crow first and settle before you jump.", "Shoot the feet back and meet the floor with bent arms.", "Release the weight rather than dropping it.", "Land quiet — noise means it got away from you."], "desc": "Jump back from crow to a bent-arm plank — the control that stops a bail becoming a fall."}, {"v": "chaturanga-to-crow", "n": "Chaturanga to Crow Jump", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "table-top-knee-to-nose", "n": "Table Top Knee to Nose", "url": "", "d": "", "nt": "", "cues": ["Knees lifted off the floor.", "Pull the knees towards the nose.", "Round the spine and press the ground away."], "desc": "Table top with the knees lifted. Take the knees to the nose and round the spine, pressing the ground away."}, {"v": "half-kick-ups", "n": "Half Kick Ups", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "leg-on-chair-puppy-entry", "n": "Leg on Chair Puppy Entry", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "box-step-ups", "n": "Box Step Ups", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "plank-pose", "n": "Plank Pose", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/90a824ed88a1bca051dceb30dfd5e629/downloads/default.mp4", "d": "", "nt": "", "cues": ["Turn the biceps to face forward.", "Start on the knees.", "Push through the base of the palms to round the back.", "Then take one knee back, and maybe the other."], "desc": "A plank held with the shoulders stacked and the ribs down."}, {"v": "chair-assisted-puppy-press", "n": "Chair-Assisted Puppy Press", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/a4e209b649da9c8f63b8784dd42e42e1/downloads/default.mp4", "d": "", "nt": "", "cues": ["The same as the press entries.", "Bend the knee and open through the hip of the lifted leg.", "Keep pulling it up and back to take the leg off.", "Bring the foot slightly off the chair and back on — not all the way up."], "desc": "One foot on the side of a chair, lift the other hip and stack the body. Start with the hips higher than feels necessary."}, {"v": "forearm-massage", "n": "Forearm Massage", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/39baddde2e76b2dd1ef4f33b232d2b2d/downloads/default.mp4", "d": "", "nt": "", "cues": ["Palm-up side: massage the forearm with the bony part of the knee.", "Don't put too much weight through it.", "Other side: use the elbow along the top line of fascia shown in the video."], "desc": ""}, {"v": "plank-knee-to-nose-float-ups", "n": "Plank Knee to Nose, Float Ups", "url": "", "d": "", "nt": "", "cues": ["From plank, knee to nose.", "Round the spine and press the ground away.", "Float up rather than jump."], "desc": ""}, {"v": "palm-lifts-table-top", "n": "Palm Lifts in Table Top", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/ffcc972bba57d4229af54b30e1c208a9/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start in table top.", "Lift the palms and thumb up.", "Lean the shoulders over the hands to increase the difficulty.", "You can also do this in plank pose."], "desc": ""}, {"v": "chair-assisted-handstand-walks", "n": "Chair-Assisted Handstand Walks", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/264342c895cf6befb3ca2bb913f050b0/downloads/default.mp4", "d": "", "nt": "", "cues": ["In the chair-assisted position.", "Walk the hands, keep the shoulders stacked."], "desc": ""}, {"v": "chair-press-entries", "n": "Chair Press Entries", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/f601190534cc4f21c99d05e50e2c1457/downloads/default.mp4", "d": "", "nt": "", "cues": ["One foot onto the side of a chair.", "Hands just in front of the front chair leg.", "Bring the hands closer in to make it harder and more like a press.", "Put the second foot down, then lift it up.", "The hips come up into an assisted handstand."], "desc": ""}, {"v": "wall-shape-changes", "n": "Shape Changes — At the Wall", "url": "", "d": "", "nt": "", "cues": ["Hands about a foot from the wall, feet very lightly touching it.", "Go between straddle and straight.", "Shift the shoulders away from the wall as much as you can.", "Only use the wall if you feel the balance going."], "desc": "Shape changes done chest-to-wall so the wall holds the balance and you can feel the shape."}, {"v": "sideways-press-walks", "n": "Sideways Press Walks", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5dc97917e4f5613ab94e7fad92258860/downloads/default.mp4", "d": "", "nt": "", "cues": ["Less a strength drill, more a shifting one.", "Hands sideways to the feet — going right, the left hand sits in front of the right foot.", "Hop towards the right, keeping the hips high.", "It's press walks, travelling sideways."], "desc": "Press walks travelling sideways rather than forward and back."}, {"v": "straddle-leg-lifts", "n": "Straddle Leg Lifts", "url": "", "d": "", "nt": "", "cues": ["Lift from the hip flexor.", "Don't lean back to make it easier.", "Slow up, slow down."], "desc": ""}, {"v": "pancake-to-wide-standing", "n": "Pancake to Wide Standing Lifts", "url": "", "d": "", "nt": "", "cues": ["From pancake, lift to a wide standing fold.", "Drive through the legs, keep the chest long."], "desc": "From a pancake, lift up to a wide standing forward fold and back down."}, {"v": "hands-together-tuck", "n": "Tuck Handstand — Hands Together", "url": "", "d": "", "nt": "", "cues": ["Bring the hands closer than feels natural.", "Push through the shoulders rather than widening the base.", "Less depth in the tuck is fine — the hand position is the drill."], "desc": "A tuck handstand with the hands closer together, even if that means less depth in the tuck."}, {"v": "knee-to-nose-bounces", "n": "Knee to Nose Bounces", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/8bca83124064e21a1abe84d1a21ac587/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start in table top with the knees off the floor.", "Take the knee to the nose.", "Jump in towards it slightly as you do.", "Keep the bounce as light as you can."], "desc": ""}, {"v": "slow-entries", "n": "Slow Entries", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/a9b6bfa4548b7f62f5242f17eced8c84/downloads/default.mp4", "d": "", "nt": "", "cues": ["Two varieties.", "One: start kneeling with the feet pointed, lift the hips, look between the hands, take one knee into the chest.", "Two: the same, but switch feet, keeping the hips high.", "The second is the beginning of a press — shift between the two feet, holding a second of balance if you can."], "desc": ""}, {"v": "chair-assisted-handstand-extensions", "n": "Chair-Assisted Handstand Extensions", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/94d9a148fa14b218795d9a0947caba3f/downloads/default.mp4", "d": "", "nt": "", "cues": ["Feet on the chair.", "Walk the hands in to about 70–80% of what you can do, hips over shoulders.", "Push through the base of the palms, as far away as you can.", "Look between the hands.", "Walk out and repeat."], "desc": ""}, {"v": "hand-opens", "n": "Hand Opens", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/daf02e6e50d438d07b312bc193d4759a/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start with the hand closed, fingers curled in.", "Open slowly and spread as wide as the hand will go.", "Hold the open position a beat before closing.", "Slow beats forceful — this is circulation, not stretching."], "desc": "Open and close the hand through full range to keep the forearms and fingers moving between loaded sets."}, {"v": "straddle-to-straight-entries", "n": "Straddle to Straight Entries", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/4be7868ac0a11251d92d447367dceef1/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start with the shoulders stacked over the hands.", "Look between the hands.", "Straddle up, then bring the legs together into straight."], "desc": ""}, {"v": "knees-on-box-pushes", "n": "Knees on Box — Palm Pushes", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/3f8d978d6e7c21ae14d376815eb90803/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands at about 70% of the closest they can get to the box.", "Push through the palms as hard as you can for 5 seconds.", "Rest 5 seconds.", "Three rounds."], "desc": ""}, {"v": "lying-back-engagements", "n": "Lower Back Engagement", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/11196300771c8f5829cdc902f7f381e2/downloads/default.mp4", "d": "", "nt": "", "cues": ["Lift from the upper back, not the neck.", "Legs straight, squeeze the glutes.", "Small range held well beats a big lift that collapses.", "Breathe through it."], "desc": "On your front, lift the chest and legs a little and hold the squeeze. The back has to switch on before it can hold a line upside down."}, {"v": "banded-lower-back-engagements", "n": "Banded Lower Back Engagements", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/9bedbb59ede392ff64633ce7d9c0ee57/downloads/default.mp4", "d": "", "nt": "", "cues": ["Set the band before you lift, not after.", "Chest up, ribs down.", "Hold the top for a beat every rep.", "Stop the set when the shape goes."], "desc": "The same engagement with a band adding resistance, so the position has to be held against something."}, {"v": "banded-external-rotations", "n": "Banded External Rotations", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/06fea21e3d30ada849ff99dea4b369df/downloads/default.mp4", "d": "", "nt": "", "cues": ["Elbows stay pinned to the ribs.", "Rotate from the shoulder, not the wrist.", "Slow back in, do not let the band snap you.", "Both sides, even if one is better."], "desc": "Elbows in, rotate the forearms out against the band. Builds the rotation the shoulders need before they take weight overhead."}, {"v": "active-hamstring-stretch", "n": "Active Hamstring Stretch", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/80c16268390a200e16419eec332b90f7/downloads/default.mp4", "d": "", "nt": "", "cues": ["Pull the leg in with the hip, do not push with the hands.", "Knee straight, foot relaxed.", "Hold the top for a few seconds.", "It should feel like work, not a rest."], "desc": "A hamstring stretch you hold with your own strength rather than hanging on the joint. Active range is the range you keep."}, {"v": "pancake-lift-combo", "n": "Pancake Lift Combo", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/63723a2d387cdb8915b9e18baab55933/downloads/default.mp4", "d": "", "nt": "", "cues": ["Open first, then lift.", "Lift from the hip flexors.", "Chest stays long, do not round to reach.", "Small lifts held are the point."], "desc": "Pancake, then lift out of it under your own power. Straight into the range you just opened."}, {"v": "pike-hip-lifts", "n": "Pike Hip Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/9cc457ddf95e3eec257bf689385b3837/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands flat beside the hips.", "Push the floor away, do not shrug.", "Legs stay straight.", "Lift the hips, not just the heels."], "desc": "Sit in a pike, hands down, lift the hips. The compression the press is built on."}, {"v": "floor-press-circles", "n": "Floor Press Circles", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/40d45e5b3b65389faf14c531508ab3e0/downloads/default.mp4", "d": "", "nt": "", "cues": ["Weight moves forward before anything lifts.", "Shoulders travel past the wrists.", "Slow, it is a pattern not a rep.", "Same path back."], "desc": "The press pattern traced on the floor, so the shift of weight is learned before you are upside down."}, {"v": "press-scapula-shrugs", "n": "Press Scapula Shrugs", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5afd92280aa162a40d9fca2acc983280/downloads/default.mp4", "d": "", "nt": "", "cues": ["Push the floor away at the top.", "Ears away from the shoulders.", "Full range, all the way down and all the way up.", "No bend in the elbows."], "desc": "Shrugs in the press position. The push through the shoulders that holds you up at the top."}, {"v": "press-slides", "n": "Press Slides", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/40a509721d745138efbffa2975071e25/downloads/default.mp4", "d": "", "nt": "", "cues": ["Weight forward first, then the feet move.", "Hips lift as the feet come in.", "Slide, do not hop.", "Stop where the shape holds."], "desc": "Slide the feet in towards the hands and back out, keeping the weight forward the whole way."}, {"v": "kneeling-top-of-foot-stretch", "n": "Kneeling Top of Foot Stretch", "url": "", "d": "", "nt": "", "cues": ["Tops of the feet flat, toes pointing back.", "Sit back slowly, hands down to take weight off if it is sharp.", "Build the time, do not force the range.", "Come out of it as slowly as you went in."], "desc": "Kneel with the tops of the feet flat on the floor and sit back. Opens the ankles for anything that loads the tops of the feet."}, {"v": "ytws", "n": "YTWs", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/ccd891c3b845e1155b9a135e87b94b9b/downloads/default.mp4", "d": "", "nt": "", "cues": ["Thumbs up in the Y.", "Squeeze the shoulder blades together in the T.", "Elbows down and back in the W.", "Small lifts, held, not swung."], "desc": "Three shapes on your front, arms making a Y, a T and a W. Wakes up everything across the upper back."}, {"v": "chair-assisted-handstand-scapula-shrugs", "n": "Chair-Assisted Handstand Scapula Shrugs", "url ick-ups", "n": "Knee to Chest Kick Ups", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/2563624790ac1efb8db57988e8594d01/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "basic-bail-outs", "n": "Basic Bail Outs", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/692ed8ab7e701e52ea14fe5e88103585/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": ""}];

/* ── intake ────────────────────────────────────────────────────────
   Four screens. Level is the only one that places anyone — goal never
   touches the stage, because someone who has never been upside down and
   wants a one-arm is still a beginner, and that is exactly the person a
   goal-driven placement would break. Goal earns its place by reframing
   the work ("a one-arm is a handstand you can hold without thinking, so
   that is what we build first") and by ordering the explainers. */
const GOALS=[
  {v:'learn',    t:'Learn to handstand',        d:"I'm starting from the beginning."},
  {v:'hold',     t:'Hold a freestanding handstand', d:"I can get upside down, but can't balance consistently."},
  {v:'improve',  t:'Improve my handstand',      d:'I want a better line, control and technique.'},
  {v:'advanced', t:'Learn advanced skills',     d:'Presses, shapes, one-arm and beyond.'},
];

/* Four rungs. Wrist tissue adapts slower than everything else, which is
   why the cap is physiology rather than a judgement about them — and why
   the copy says so. */
const LEVELS=[
  {v:0, t:'I have never done handstands', d:'Never been upside down.',
   days:[2,3],   def:2, mins:[15,30,45]},
  {v:1, t:"I'm stuck at the wall",        d:"I can kick up, but can't balance.",
   days:[2,3],   def:3, mins:[15,30,45]},
  {v:2, t:'I can briefly balance',        d:'A few seconds, but not consistently.',
   days:[3,4],   def:3, mins:[15,30,45,60]},
  {v:3, t:'I can hold it',                d:'Ten seconds or more.',
   days:[3,4,5], def:4, mins:[15,30,45,60]},
];

const NIGGLES=['Wrists','Shoulders','Neck or back','Elbows','Something else','Nothing right now'];
const MINS=[[15,'Short and focused'],[30,'A proper session'],[45,"I'm ready to put the work in"],[60,'Handstands are a priority']];

const intake = () => (st.intake=st.intake||{});
const levelDef = () => LEVELS.find(l=>l.v===intake().level) || LEVELS[0];

/* ── how well I know you ───────────────────────────────────────────
   It was four things, three of them the quiz, and it opened at twenty per
   cent for having opened the app, which is exactly the lie the comment
   above it warned against. Worse, it only counted what somebody tells
   me. What actually makes the next thing I write better is what they do:
   a clip I can watch, a check point with a number against it, and enough
   sessions to see a pattern.

   So it is six things, each worth what it is worth, starting at nothing
   and reaching a hundred only when all six are in. Every one of them is
   something they can go and do, and the card names the next one. */
function profileBits(){
  const a=intake();
  const cps=Object.keys(cpLog()||{}).length;
  const done=sessionsDone().length;
  return [
    {k:'goal', w:10, got:!!a.goal,
     t:'Say what you are after', d:'One tap, and it changes how everything is explained.',
     go:"st.tab='quiz';st.quizDone=false;st.quizStep=0;save();render()"},
    {k:'level', w:15, got:a.level!=null,
     t:'Say where you are now', d:'This is the one that puts you on a stage.',
     go:"st.tab='quiz';st.quizDone=false;st.quizStep=1;save();render()"},
    {k:'sore', w:10, got:!!(a.niggles&&a.niggles.length),
     t:'Tell me what is sore', d:'Thirty seconds, and it changes what you are given.',
     go:"st.tab='quiz';st.quizDone=false;st.quizStep=2;save();render()"},
    {k:'baseline', w:25, got:!!a.baseline,
     t:'Send a clip', d:'One attempt on film, and I can place you properly rather than taking your word for it.',
     go:"go(coachedView()?'ask':'coaching')"},
    {k:'cp', w:20, got:cps>0,
     t:'Log a check point', d:'A number against one of the check points on your stage, so progress is measured rather than felt.',
     go:"st.tab='ladder';st.ladderTab='ladder';save();render()"},
    {k:'trained', w:20, got:done>=3,
     /* "Train -4 more sessions" once they were past three: the number left
        was worked out without a floor under it */
     t:(done>=3) ? 'Three sessions in'
        : done ? 'Train '+(3-done)+' more session'+((3-done)===1?'':'s')
               : 'Train three sessions',
     d:'Three sessions is the point where what you do starts to say more than what you said.',
     go:"go('home')"}
  ];
}
function profilePct(){
  return profileBits().reduce((n,b)=>n+(b.got?b.w:0), 0);
}

const INTAKE_STEPS=[
  {id:'goal',  kick:'WHAT YOU WANT',  q:'What are you here to achieve?',
   sub:'This shapes how I explain things — not where you start.'},
  {id:'level', kick:'WHERE YOU ARE',  q:'Tell us about your handstand.',
   sub:'This is the one that sets your stage.'},
  {id:'niggles',kick:'ANYTHING SORE', q:'Anything I should know about?',
   sub:'Pick any that apply. It changes what you get given, not whether you can start.'},
  /* "Your week" was the fourth: how long and how hard, before they had seen
     a single drill. Both are asked again by the chooser every time they
     press Start, where the question means something, and the week it was
     really asking about went with the rest of the day allocating. Three
     questions, and the last one is the one that places them. */
];

/* has this step got an answer yet, so Next can be offered rather than sat
   there doing nothing */
function stepAnswered(i){
  const a=intake(), id=(INTAKE_STEPS[i]||{}).id;
  if(id==='goal')    return !!a.goal;
  if(id==='level')   return a.level!=null;
  if(id==='niggles') return true;          /* nothing to flag is an answer */
  return true;
}
function screenQuiz(){
  const i=Math.min(st.quizStep|0, INTAKE_STEPS.length-1), step=INTAKE_STEPS[i], a=intake();
  const rails=INTAKE_STEPS.map((_,n)=>`<i style="flex:1;height:4px;border-radius:99px;
    background:${n<i?'var(--deep)':n===i?'var(--amber)':'rgba(0,64,61,.15)'}"></i>`).join('');
  /* the tick is drawn, so the pressed state has to be said as well */
  const card=(on,body,click)=>`<button onclick="${click}" aria-pressed="${on?'true':'false'}" style="background:#fff;
    border:1.5px solid ${on?'var(--forest)':'rgba(0,64,61,.10)'};border-radius:16px;padding:15px 16px;
    box-shadow:${on?'0 0 0 3px rgba(0,102,99,.08)'
      :'0 1px 2px rgba(0,64,61,.05),0 8px 20px rgba(0,64,61,.06)'};
    color:var(--ink);cursor:pointer;text-align:left;width:100%;
    display:flex;align-items:center;gap:13px">
    <span style="flex:1;min-width:0">${body}</span>
    <span style="flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
      background:${on?'var(--forest)':'transparent'};
      border:${on?'none':'1.5px solid rgba(0,64,61,.2)'};color:#fff;font:700 12px/1 var(--sans)">${
      on?'&check;':''}</span></button>`;
  const two=(t,d)=>`<div style="font:600 16px/1.25 var(--sans);color:var(--ink)">${esc(t)}</div>
    <div style="font:400 13.5px/1.4 var(--sans);color:var(--grey);margin-top:5px">${esc(d)}</div>`;

  let body='';
  if(step.id==='goal') body=GOALS.map(g=>
    card(a.goal===g.v, two(g.t,g.d), `pickIntake('goal','${g.v}')`)).join('');

  if(step.id==='level') body=LEVELS.map(l=>
    card(a.level===l.v, two(l.t,l.d), `pickIntake('level',${l.v})`)).join('');

  if(step.id==='niggles'){
    const sel=a.niggles||[];
    body=`<div style="display:flex;flex-wrap:wrap;gap:9px">${NIGGLES.map(x=>{
      const on=sel.indexOf(x)>=0;
      return `<button onclick="toggleNiggle('${esc(x)}')" style="background:${on?'var(--forest)':'#fff'};
        color:${on?'var(--on-primary)':'var(--ink)'};border:1px solid ${on?'var(--forest)':'rgba(17,17,17,.08)'};
        border-radius:999px;padding:12px 16px;
        font:600 13.5px/1 var(--sans);cursor:pointer">${esc(x)}</button>`;}).join('')}</div>
      ${sel.length && sel.indexOf('Nothing right now')<0 ? `
      <!-- 6c shows a box here saying what each niggle changes. Nothing in the
           free app adapts to a niggle yet, so this says the true thing: it
           reaches Elliott and shapes what he writes. Give me a line per
           niggle and I will say the specific thing instead. -->
      <div style="margin-top:16px;padding:13px 15px;border-left:3px solid var(--forest);
        background:rgba(0,102,99,.05);border-radius:0 12px 12px 0">
        <div style="font:400 14px/1.5 var(--sans)">
          ${esc(sel.filter(x=>x!=='Nothing right now').join(', '))}: noted. It goes to
          Elliott with the rest of your answers and shapes what he suggests. Nothing
          here is off limits because of it.</div>
      </div>`:''}`;
  }

  /* .scroll, because #app is a fixed-height flex column with overflow
     hidden — without it the last step runs past the fold and the button
     that finishes the quiz cannot be reached. */
  return `<div class="scroll s" style="background:transparent;color:var(--ink)">
    <div style="min-height:100%;padding:calc(env(safe-area-inset-top) + 22px) 24px 34px;
    display:flex;flex-direction:column;
    animation:${i%2?'riseB':'rise'} .5s cubic-bezier(.2,.8,.2,1) both">
    <div style="display:flex;gap:5px">${rails}</div>
    <!-- how many are left and how long it takes, said out loud. Three
         questions unannounced is where a cold visitor leaves. -->
    <div style="margin-top:22px;display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span style="font:600 10.5px/1 var(--sans);letter-spacing:.16em;color:var(--grey2)">${
        step.kick} &middot; ${i+1} OF ${INTAKE_STEPS.length}</span>
      <span style="font:400 12.5px/1 var(--sans);color:var(--grey2)">${
        i===0 ? 'About a minute'
        : i===INTAKE_STEPS.length-1 ? 'Last one'
        : (INTAKE_STEPS.length-i-1)+' to go'}</span>
    </div>
    <div style="margin-top:11px;font:400 32px/1.06 var(--serif)">${(()=>{
      const w=String(step.q).trim().split(' ');
      const last=w.pop();
      return esc(w.join(' '))+' <em style="color:var(--forest);font-style:normal">'+esc(last)+'</em>';
    })()}</div>
    <div style="font:400 14.5px/1.5 var(--sans);color:var(--grey);margin-top:9px">${esc(step.sub)}</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:24px">${body}</div>
    <!-- The frames make this a button, not a caption. It names the next
         question, so answering reads as progress rather than as a form. It
         only appears once this step has an answer, because a Next that does
         nothing is worse than no Next. -->
    ${(!INTAKE_STEPS[i+1] && stepAnswered(i))?`<button class="btn" style="width:100%;margin-top:22px"
      onclick="finishIntake()">See where you land</button>`:''}
    ${(INTAKE_STEPS[i+1] && stepAnswered(i))?`<button onclick="nextIntake()"
      style="width:100%;height:56px;margin-top:22px;border:0;border-radius:14px;cursor:pointer;
      background:linear-gradient(180deg,#0a7a76,#006663);color:var(--on-primary);
      box-shadow:0 12px 30px rgba(0,102,99,.3),inset 0 1px 0 rgba(255,255,255,.35);
      font:600 16px/1 var(--sans)">${
        i===INTAKE_STEPS.length-2 ? 'Last one: '+esc(INTAKE_STEPS[i+1].kick.toLowerCase())
                                  : 'Next: '+esc(INTAKE_STEPS[i+1].kick.toLowerCase())} &rarr;</button>`:''}
    ${i>0?`<button onclick="st.quizStep=${i-1};save();render()" style="background:none;border:none;
      color:var(--grey2);font:500 13px/1 var(--sans);cursor:pointer;margin-top:14px;padding:10px">← Back</button>`
      :`<button onclick="skipIntake()" style="background:none;border:none;color:var(--grey2);
        font:500 13px/1.4 var(--sans);cursor:pointer;margin-top:14px;padding:10px">
        Skip and start at Stage 1, ${esc(STAGES[0].n)}</button>`}
    </div></div>`;
}

/* the cap, explained as physiology rather than as a verdict on them */
function capLine(){
  const L=levelDef(), max=L.days[L.days.length-1];
  return max<=3
    ? 'Three sessions of up to 45 minutes is the most that helps at this stage — wrists adapt slower than everything else.'
    : 'More than five stops helping and starts costing you wrists.';
}

/* the days they picked, as weekday indices, Monday first. Until they pick,
   the level's usual spread, so the buttons open with a sensible week on. */
function intakeWhen(){
  const a=intake();
  if(Array.isArray(a.when)) return a.when.slice().sort((x,y)=>x-y);
  const L=levelDef();
  return (DAY_SPREADS[(L&&L.def)||3]||[0,2,4]).slice();
}
function toggleWhen(i){
  const a=intake(); const cur=intakeWhen();
  const next = cur.indexOf(i)>-1 ? cur.filter(x=>x!==i) : cur.concat([i]);
  a.when=next.sort((x,y)=>x-y); a.days=a.when.length; save(); render();
}
function pickIntake(k,v){
  intake()[k]=v; save();
  if(k==='goal'||k==='level'){ nextIntake(); return; }
  render();
}
function toggleNiggle(x){
  const a=intake(); let s2=a.niggles||[];
  if(x==='Nothing right now') s2=s2.indexOf(x)>=0?[]:[x];
  else { s2=s2.filter(y=>y!=='Nothing right now');
         s2 = s2.indexOf(x)>=0 ? s2.filter(y=>y!==x) : s2.concat([x]); }
  a.niggles=s2; save(); render();
}
function nextIntake(){
  const a=intake();
  if(!a.niggles && (st.quizStep|0)===2) a.niggles=[];
  st.quizStep=Math.min((st.quizStep|0)+1, INTAKE_STEPS.length-1); save(); render();
}
/* Some people will not answer three questions and should not be made to. The
   ladder starts at Foundations for everyone anyway, so a skip is a real
   answer: stage one, the default week, and they can retake it from Today. */
function skipIntake(){
  const L=levelDef();
  st.stage=0; st.placed=0; st.time=st.time||30; st.perWeek=st.perWeek||(L&&L.def)||3;
  st.quizDone=true; st.oriented=false;
  st.tab = st.email ? 'home' : 'joinFree';
  save(); saveStateDown(); render();
}
function finishIntake(){
  const a=intake(), L=levelDef();
  /* where the answers place them, which a free account may not be able to
     reach yet. curStage caps it; this is kept so the upgrade can say what
     they were placed at rather than guessing. */
  const when=intakeWhen();
  st.stage=L.v; st.placed=L.v; st.time=a.mins||30; st.perWeek=when.length||L.def;
  st.quizDone=true; st.oriented=false;
  /* how hard, as the stage's own dial */
  if(a.hard){ st.lvl=Object.assign({}, st.lvl||{}); st.lvl[L.v]=Math.max(1,Math.min(3,a.hard|0)); }
  /* Write the week down rather than leaving it to a default computed on
     every read: the sessions on the days they chose, the wrist and
     mobility days in the gaps between them. */
  st.dayMap=weekOn(when);
  track('quiz', L.v);
  st.tab = st.email ? 'home' : 'joinFree';
  /* Placed above the free stage, the next thing is the wall for that
     stage, with the free week on it. It used to land on Foundations and
     say nothing, which read as the quiz having been ignored. */
  const wall = L.v >= FREE_STAGES && !isPlus();
  if(wall){ if(st.email) st.openWallFor=L.v; else { st.joinFor='taste'; st.wantUpgrade=L.v; } }
  save(); saveState(); sendIntake();
  /* The home page runs this whole app inside an iframe, which is a fine
     shop window and a bad place to actually use it: a refresh reloads the
     marketing site instead of the app, the link cannot be bookmarked or
     shared, it cannot be installed to a home screen, and Stripe refuses to
     be framed at all. Finishing the quiz is the first real commitment, so
     that is where the frame ends. Same origin, so everything just answered
     is already in storage when the full page opens. */
  if(inFrame()){ leaveTo(location.pathname + location.search); return; }
  render();
  /* not in the frame: the wall opens now rather than on the next boot */
  if(st.openWallFor!=null && STAGES[st.openWallFor]){
    const w=st.openWallFor; delete st.openWallFor; save();
    setTimeout(()=>{ st.ovStage=w; openOv('stage'); }, 250);
  }
}

/* ── moving up ─────────────────────────────────────────────────────
   st.stage was only ever set by the quiz, so once placed there was no way
   up the ladder at all — and nothing on screen said what moving up would
   even take. The marker is the stage's own hold target, which was already
   written into STAGES and never shown as a thing to aim at. */
/* What a stage asks for, and whether it has been met. It used to be one
   number off a stopwatch. It is the stage's own check points now, which is
   what the app was already collecting and what actually says you are ready. */
/* Two different questions, and the ladder was answering the wrong one.
   "done" is how many have been logged at all; "met" is how many actually
   reached what they ask for. A stage opens on met, because logging a
   20-second hold against a 45-second target is not clearing anything. */
function cpProgress(i){
  /* pass the argument straight through: cpFor() with nothing already knows to
     return a coached client's own list. Substituting curStage() here meant a
     coached client's counts were taken from the ladder stage they happen to
     sit on, so four check points were reported as nought of seven. */
  const list=cpFor(i)||[];
  const done=list.filter(c=>cpLast(c.k)).length;
  const met=list.filter(c=>cpMet(c)).length;
  return {done, met, of:list.length, ready:list.length>0 && met>=list.length};
}
function stageReady(){ return cpProgress().ready; }
/* ── stuck ──────────────────────────────────────────────────────────
   Somebody part way through a stage whose last reached check point was
   weeks ago is the person most likely to quietly stop, and the app was
   already holding every reading and its date without ever saying so. This
   says the true thing and offers the one thing that would actually help,
   which is a coach looking at it. Never for a cleared stage, never for
   somebody who has logged nothing, and never before three weeks. */
const STUCK_DAYS = 21;
function plateau(){
  if(coachedView()) return null;
  const i=curStage(), P=cpProgress(i);
  if(!P.of || P.ready || !P.met) return null;
  const list=cpFor(i)||[];
  const log=cpLog();
  let newest=0;
  list.forEach(c=>{ if(!cpMet(c)) return;
    (log[c.k]||[]).forEach(r=>{ if(r && r.at > newest) newest=r.at; }); });
  if(!newest) return null;
  const days=Math.floor((Date.now()-newest)/86400000);
  if(days < STUCK_DAYS) return null;
  return {met:P.met, of:P.of, days, weeks:Math.floor(days/7)};
}
function plateauHTML(){
  const p=plateau();
  if(!p || st.stuckHid===p.met) return '';
  return `<div style="padding:18px 16px 0"><div class="card" style="padding:20px">
    <div class="kick2" style="color:var(--forest)">STUCK?</div>
    <div style="font:400 20px/1.25 var(--serif);margin-top:9px">
      You have been at ${p.met} of ${p.of} for ${p.weeks>=4?'about a month':p.weeks+' weeks'}.</div>
    <div style="font:400 14px/1.55 var(--sans);color:var(--grey);margin-top:9px">
      That is usually alignment rather than effort, and it is the one thing you
      cannot see from the inside. Send ten seconds and Elliott will tell you what
      is actually happening.</div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="go('coaching')">
      Get him to look at it</button>
    <button onclick="st.stuckHid=${p.met};save();render()" style="width:100%;background:none;border:0;
      cursor:pointer;margin-top:4px;padding:10px;font:500 13px/1 var(--sans);color:var(--grey2)">
      Not now</button>
  </div></div>`;
}
/* Move to a named stage, either way. The sheet's button called advanceStage,
   which always went to the very next one, so opening Press from Wall Work and
   pressing it landed you on Pushing More. */
function goToStage(i){
  i=Math.max(0,Math.min(STAGES.length-1,i|0));
  if(i===curStage()) return;
  /* Moving down into a stage nobody has paid for is the one case that stops
     here. Moving back up never is: it is a stage you have already been on,
     and being stranded on a locked one with no way back is not a paywall,
     it is a trap. */
  if(i>curStage() && stageLocked(i)){
    /* One free session at any stage, on an account, and then the wall.
       It used to be two at the stage the quiz placed you on, which is how
       somebody on Foundations found themselves training Wall Work without
       paying: the placing moved and the free sessions moved with it. */
    if(st.token && !isPlus() && tasteLeft()>0){
      st.stage=i; save();
      try{ sendIntake(); }catch(e){}
      try{ saveState(); }catch(e){}
      render();
      toast('One free session at '+STAGES[i].n+'. After it, the whole ladder is '+PRICE('plus')+' a month.');
      return;
    }
    st.ovStage=i; openOv('stage'); return;
  }
  /* this read i>curStage() and called it "down", so moving up the ladder
     congratulated you on moving down it */
  const goingDown=i<curStage();
  st.stage=i; save();
  /* sendIntake talks to the server, and a throw here used to take the redraw
     with it, so the stage moved in memory and the screen did not */
  try{ sendIntake(); }catch(e){}
  /* moving down is deliberate, so the server is allowed to take the stage
     back rather than keeping the highest it has seen */
  try{ goingDown?saveStateDown():saveState(); }catch(e){}
  render();
  /* No confirm. The screen promises you can move either way whenever you
     like, and stopping to ask every time is the opposite of that. */
  toast((goingDown?'Moved down to ':'Back up to ')+STAGES[i].n+'. Move again whenever you like.');
}
function advanceStage(){
  const next=curStage()+1;
  if(next>=STAGES.length){ alert("You're at the top of the ladder."); return; }
  if(stageLocked(next)){ openOv('stage'); st.ovStage=next; save(); render(); return; }
  if(!confirm('Move up to '+STAGES[next].n+'?\n\nYou can always drop back down.')) return;
  st.stage=next; save(); sendIntake(); render();
}
/* not stepBack — the player already owns that name for rewinding a step,
   and this one being defined later was quietly winning */
function dropStage(){
  if(curStage()<=0) return;
  if(!confirm('Drop back to '+STAGES[curStage()-1].n+'?')) return;
  st.stage=curStage()-1; save(); sendIntake(); render();
}
/* dropping back from a stage sheet, which can go further than one rung */
function dropToStage(i){
  if(i>=curStage()) return;
  if(!confirm('Drop back to '+STAGES[i].n+'?\n\nYour training history stays.')) return;
  st.stage=i; save(); sendIntake(); render();
}
function retakeIntake(){
  if(!confirm('Retake the questions?\n\nYour training history stays — this only changes where you are placed.')) return;
  st.quizDone=false; st.oriented=false; st.quizStep=0; save(); st.tab='quiz'; render();
}

/* ── explainers ────────────────────────────────────────────────────
   The questions that get asked before anyone asks anything else. Three
   are open to everyone; the rest need an account, because an address is
   a fair price for the whole library and no price at all for a taste. */
/* One flat list, built from the per-phase one in ladder-data.js, filmed
   first. The rail is a rail: an unfilmed placeholder at the front of it is
   the first thing a new person sees, and there are eighteen of them. */
/* the shipped list plus the ones the coach has added from the dashboard,
   each of those on every phase it was given */
function explainersFor(si){
  const own=(EXPLAIN[si]||[]).slice();
  ((st&&st.explainExtra)||[]).forEach(x=>{ if(x && x.uid && (x.stages||[]).indexOf(si)>-1) own.push({id:'x-'+x.uid, q:x.q, uid:x.uid, k:x.k||[], sum:x.sum||'', own:true}); });
  return own;
}
let FAQS = [];
function rebuildFaqs(){
  const out=[];
  const stages=Object.keys(EXPLAIN).map(Number);
  ((st&&st.explainExtra)||[]).forEach(x=>(x.stages||[]).forEach(s0=>{ if(stages.indexOf(s0)<0) stages.push(s0); }));
  stages.sort((a,b)=>a-b).forEach(st0=>{
    explainersFor(st0).forEach(x=>{
      /* the same film answers a question in two phases; show it once */
      if(x.uid && out.some(y=>y.uid===x.uid)) return;
      out.push(Object.assign({stage:st0, v:''}, x));
    });
  });
  FAQS = out.filter(x=>x.uid).concat(out.filter(x=>!x.uid));
}
rebuildFaqs();
const FREE_EXPLAINERS=3;
const explainerOpen = i => i < FREE_EXPLAINERS || !!st.token;
/* v is a filename in the R2 bucket the explainers already live in */
/* one a day, rotating, so there is a reason to come back rather than a
   library to binge and forget */
/* ── only offer what can actually be watched ───────────────────────
   An explainer with no clip was still listed, still searchable and still
   openable, and what it gave you was a panel saying it had not been filmed.
   Fourteen of the thirty are in that state. A library that answers half the
   time is worse than a smaller one that always does, so an unfilmed
   explainer is not on the rail, not in the search and not in the count.
   They come back on their own as they are filmed. */
const filmed = f => !!(f && (f.uid || f.v));
const FAQS_READY = () => FAQS.filter(filmed);
const explainerToday = () => {
  const ready=FAQS_READY();
  if(!ready.length) return null;
  return ready[Math.floor(Date.now()/86400000) % ready.length];
};

/* ── today ─────────────────────────────────────────────────────────
   Landing on the ladder meant landing on five stage cards and a choice.
   This is the screen that says what to do now — the ladder is still
   there to browse, it is just no longer the front door. */
/* The quiz asks how many days a week, and on Foundations the answer was
   thrown away: the written week is three days, so everyone got three
   whatever they said. The week is built to the number they chose now,
   cycling the written days when they want more than there are. */
function weekTarget(){
  const n = st.perWeek || (levelDef()||{}).def || 3;
  return Math.max(1, Math.min(7, n));
}
function sessionsThisWeek(){
  const wk=Date.now()-7*864e5;
  return sessionsDone().filter(x=>x.at>wk).length;
}
function trainedToday(){
  const k=new Date().toISOString().slice(0,10);
  return sessionsDone().some(x=>new Date(x.at).toISOString().slice(0,10)===k);
}

/* the ask box filters the explainer list in place. It deliberately does not

function askElliottRow(){

function askFromSearch(){
  const typed=((document.getElementById('askq')||{}).value||'').trim();
  if(!st.token){ st.askDraft=typed; goJoin(); return; }
  if(!typed){ toast('Type the question first.'); return; }
  /* it sends. It used to open the chat with the words typed in, which on a
     phone meant the keyboard, a scroll, and the button hiding under it. */
  pendingMsgs.push({text:typed,sentAt:Date.now()});

}

/* the coach's own words for a film, from the dashboard, keyed on id */
const exKeys = id => ((st.explainKeys||{})[id]||[]);
/* everything this film can be found by: its question, its tag, the words
   shipped with it and the words Elliott has added since */
const exHaystack = f =>
  [f.q, f.tag||''].concat(f.k||[], exKeys(f.id)).join(' ').toLowerCase();

/* Searching the title alone meant "sore wrists" found nothing while
   "Why do my wrists hurt?" sat two rows below the box. Matching is on the
   keywords too, and the best match leads: a film whose own words contain
   the whole phrase beats one that shares a single word with it. */
function exScore(f, q, words){
  const hay=exHaystack(f);
  if(!hay) return 0;
  let n=0;
  if(hay.indexOf(q)>-1) n+=10;
  words.forEach(w=>{
    if(f.q.toLowerCase().indexOf(w)>-1) n+=3;
    else if(hay.indexOf(w)>-1) n+=2;
  });
  /* a film beats a placeholder at the same score: one can be watched */
  if(n && f.uid) n+=1;
  return n;
}
function askMatches(q){
  q=(q||'').trim().toLowerCase();
  if(q.length<3) return '';
  const words=q.split(/\s+/).filter(w=>w.length>2);
  const hits=FAQS.map((f,i)=>({f,i,s:exScore(f,q,words)}))
    .filter(x=>x.s>0 && filmed(x.f)).sort((a,b)=>b.s-a.s).slice(0,6);
  if(!hits.length) return `<div style="margin-top:10px">
    <p style="margin:0 0 8px;font:500 13.5px/1.45 var(--sans);color:var(--grey)">
      No video on that one yet.</p>${askElliottRow()}</div>`;
  return `<div style="margin-top:10px">
    ${askElliottRow()}
    <p style="margin:12px 0 8px;font:600 10px/1 var(--sans);letter-spacing:.13em;color:var(--grey2)">

    ${hits.map(({f,i})=>`<div onclick="${explainerOpen(i)?`openExplainer(${i})`
        :`lockedExplainer(${i})`}"

      border:1px solid rgba(0,102,99,.09);cursor:pointer">
      <span style="width:28px;height:28px;border-radius:9px;background:var(--sand);display:grid;
        place-items:center;flex:none">
        <svg width="10" height="12" viewBox="0 0 17 19" fill="#006663"><path d="M16 8.63a1 1 0 0 1 0
          1.74L1.5 18.6A1 1 0 0 1 0 17.73V1.27A1 1 0 0 1 1.5.4z"></path></svg></span>
      <span style="flex:1;font:500 13.5px/1.3 var(--sans)">${esc(f.q)}</span>
      <span style="font:500 12px/1 var(--sans);color:var(--grey2)">${
        !explainerOpen(i)?'Locked':esc(f.dur||'')}</span>
    </div>`).join('')}</div>
    ${askElliottRow()}</div>`;
}

/* ══ Fixes ════════════════════════════════════════════════════════════
   A fix is a four week programme for one problem, written from the coach
   dashboard: an article that says why, a pool of drills the session builder

function fixBlockHTML(b){

  return '';

/* The fix's own pool, spent the way a stage session is: a warm-up, then six
   to ten drills starting one further down the list each time, easiest
   first, one set each under thirty minutes and the drill's own sets above. */
function buildFixSession(slug, listOnly){
  const f=(st.fixes||{})[slug]; if(!f) return;
  if(f.access==='plus' && !isPlus()){ openStage(FREE_STAGES); return; }
  const mins=st.fixMins||f.mins||20, budget=mins*60;
  const toIt=d=>Object.assign({}, d, {d: d.d || FREE_DOSE[d.v] || '3 × 8'});
  let warm;
  if((f.warmDrills||[]).length){
    const items=f.warmDrills.map(w=>Object.assign({},w,{d:'30s'}));
    warm={items, secs:items.reduce((t,it)=>t+work(it,'Warm-up')+rest({it,grp:'Warm-up',g:'Warm-up'}),0)};
  } else warm=warmupFor(budget, f.stage||0, null);
  const used=new Set(warm.items.map(x=>x.v));
  const pool=(f.drills||[]).filter(d=>!used.has(d.v)).map(toIt);
  if(!pool.length){ alert('Nothing in this fix yet.'); return; }
  const out=warm.items.map((it,i)=>{
    const nn=warm.items.filter(x=>x.v===it.v).length, k=warm.items.slice(0,i+1).filter(x=>x.v===it.v).length;
    return {it,gi:0,ii:i,set:k,sets:nn,grp:'Warm-up'}; });
  let secs=warm.secs;
  const rot=Number((st.fixRot||{})[slug]||0);
  const spin=(list,by)=>list.length?list.slice(by%list.length).concat(list.slice(0,by%list.length)):list;
  const wantN = mins>=45 ? 10 : mins>=30 ? 8 : 6;
  /* A set workout is the fix as written: every drill, in the coach's
     order, the same every time. Otherwise the drills are a pool and the
     session rotates through it, as the fixes have always done. */
  const picked = f.set ? pool.slice()
    : spin(pool, rot).slice(0, wantN).sort((a,b)=>(a.L||1)-(b.L||1));
  const done={};
  const add=it=>{
    const t=work(it,it.g||f.name)+rest({it, grp:f.name, g:it.g});
    if(secs+t>budget) return false;
    done[it.v]=(done[it.v]||0)+1;
    out.push({it,gi:0,ii:out.length,set:done[it.v],sets:done[it.v],grp:f.name,g:it.g}); secs+=t; return true; };
  const oneSetOnly = mins<30;
  const setsWanted = it => { if(oneSetOnly) return 1;
    const m=timed(it), stated=Number(m.sets);
    if(Number.isFinite(stated)&&stated>=1) return Math.min(stated,8);
    const k=setsFor(it); return Math.min(k>1?k:3,4); };
  let more=true;
  while(more && secs<budget){ more=false;
    for(const it of picked){ if((done[it.v]||0)>=setsWanted(it)) continue; if(add(it)) more=true; } }
  if(out.length===warm.items.length) add(picked[0]);
  const tally={}; out.forEach(q=>{ tally[q.it.v]=(tally[q.it.v]||0)+1; }); out.forEach(q=>{ q.sets=tally[q.it.v]; });
  Q=out;
  sessionSpent=false;
  if(listOnly){ st.ovList=false; st.ovRow=null; st.listMode='work'; st.ovFull=true; openOv('list'); return; }
  st.fixRot=Object.assign({}, st.fixRot||{}); st.fixRot[slug]=(rot+1)%997;
  st.fixActive=slug; save(); track('fixstart', null, slug);
  startQueue(0);
}

/* ── ladder home ── */
/* ── the ladder ────────────────────────────────────────────────────
   Six stages down the screen, each one harder than the last, with a spine
   linking them. Where you are is the white card; everything behind you is
   muted teal and everything ahead is grey. Nothing is locked in the sense
   of forbidden: the copy says so, because people arrive at this screen
   expecting a gate and the point is that there is not one.

   The measure throughout is check points reached, not best hold. A single
   number that the whole screen agrees on, rather than a bar counting one
   thing beside a gate counting another. */
/* Sixty is new with the redesign. Easier still stops at thirty, so the
   longer buttons dim rather than promising an hour of the easiest work. */
/* The shipped numbers, and the coach's if he has set any. These are
   training decisions rather than app decisions, so the dashboard writes
   them and /ladder carries them here. */
const SHORT_DEFAULT = { mins:[15,30,45,60], oneSetUnder:30, tail:2, tailSets:3, easyCap:30 };
const shortRules = () => Object.assign({}, SHORT_DEFAULT, st.shortRules||{});
const LADDER_MINS_DEFAULT = [15,30,45,60];
Object.defineProperty(window,'LADDER_MINS',{get(){ const m=shortRules().mins;
  return (Array.isArray(m)&&m.length)?m:LADDER_MINS_DEFAULT; }});

function ladderMins(){
  const opts=LADDER_MINS;
  return opts.indexOf(st.time) > -1 ? st.time : 30;
}
/* Easier tops out at half an hour. Three quarters of an hour of the easiest
   work in the stage is not an easier session, it is a long one, and the
   people who press Easier are the ones who need the shorter day. */
const EASY_CAP_DEFAULT=30;
Object.defineProperty(window,'EASY_CAP',{get(){ return shortRules().easyCap||EASY_CAP_DEFAULT; }});
/* Easier was capped at half an hour, because forty five minutes of the
   gentlest drills in a stage is a longer session rather than an easier one.
   Above Foundations, Easier now means a third of the session is the stage
   below, which is a different thing and does not want capping. */
const easyCapped = stage => stage===0;
function sessionMins(stage){
  const st0=(stage==null?curStage():stage);
  const m=ladderMins();
  return (stageLevel(st0)===1 && easyCapped(st0)) ? Math.min(m, EASY_CAP) : m;
}
/* A sheet is open more often than not when these are pressed, and render()
   bails out while one is, leaving a full rebuild queued for the moment it
   closes. The sheet repaints itself; the screen behind it only needs
   redrawing when there is no sheet in front of it. */
function setMins(m){ st.time=m; save(); saveState(); if(!st.ov) render(); }

/* Choose how long, choose how hard, press start. This is the whole of
   what Today is for, so it lives there rather than on the ladder: the
   ladder is for seeing where you are and what opens next. */
/* Choose how long, choose what kind, press start. This is the whole of what
   Today is for. It sat inside the green header, which made the header a
   third of the screen before anything had been said; it is a card on the
   page now and the header is a header again.

   Mobility is not a difficulty, so it is its own control. It is the short
   day that keeps people training, and it was reachable only by finding the
   right day in a week strip that has since moved to Progress. */
/* ── the in person workshop ───────────────────────────────────────
   A dated thing in an app that is not dated, so it carries its own expiry
   and stops existing the day after: an advert for a workshop that has
   already happened is worse than no advert.

   It arrives as a popup, but not on open. Three minutes of use in, once
   ever, and only while the person is actually looking at the screen. An
   advert in the first second of a session interrupts the thing they came
   for and gets closed without being read. Dismissed is dismissed, and the
   strip on Today is how it stays reachable afterwards, because most people
   reading this are not in London and should be asked exactly once. */
/* ── the workshop, as the dashboard has it ─────────────────────────
   This was a dated block typed into the app: a title, a date, a price and
   a film uid, which had to be edited and deployed for every workshop and
   went on advertising one that had happened. It comes from the same place
   the site takes them from now, which is the Workshops section of the
   dashboard. Nothing written here, nothing to take out again.

   WS is null until the list arrives and null when nothing is on sale, and
   everything below reads it rather than a constant. */
let WS=null, wsAsked=false;
function loadWorkshops(){
  if(wsAsked) return; wsAsked=true;
  fetch('/api/app/workshops').then(r=>r.ok?r.json():null)
    .then(d=>{
      const list=(d&&d.workshops)||[];
      const next=list.filter(w=>w && w.left!==0)[0] || list[0] || null;
      if(!next) return;
      WS={ id:'ws-'+next.slug, slug:next.slug, n:next.title||'Workshop',
           when: next.when ? new Date(next.when).toLocaleString('en-GB',
             {weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) : '',
           where: next.place||'', price: next.priceLabel||'',
           blurb: next.desc||'', uid: next.film||'',
           url: '/workshop.html?slug='+encodeURIComponent(next.slug),
           until: next.when || '' };
      render();
    }).catch(()=>{});
}

const WS_AFTER_MS = 3*60*1000;   /* three minutes of looking at it */
/* Somebody paying for coaching is not a lead, and a workshop advert on the
   page they opened to look at their own programme reads as one. It is a
   funnel for the free tier; the coached tier is the end of the funnel. They
   hear about a workshop from Elliott, in the thread. */
const workshopOn = () => { loadWorkshops();
  return !!WS && !coachedView() && (!WS.until || new Date() < new Date(WS.until)); };

/* Time spent with the app in front of them, not time since it loaded. A
   backgrounded tab must not earn its way to a popup. */
/* And not at any moment it likes. This fired on time-in-app alone, so it
   landed full screen over the sign-up form with a video autoplaying while
   somebody was one tap from creating an account, and pulled them toward a
   £25 workshop in London that nothing had established they could get to.
   It waits for a finished session now, which is also the first moment the
   advert is aimed at somebody who has any reason to want it. */
/* And never on top of a conversation. A £25 workshop landing in the middle
   of somebody writing to their coach is an advert interrupting the thing
   they are paying for, which is true of a free account waiting on a form
   check as well as a coached one. */
const WS_NOT_NOW = ['quiz','joinFree','signin','reset','welcome','ask','coaching'];
const wsMoment = () => !WS_NOT_NOW.includes(st.tab)
  && !(st.tab==='coaching' && st.coTab==='chat')
  && !!st.mode && !!st.quizDone && !!st.oriented
  && sessionsDone().length > 0;
let wsUsed=0, wsTimer=0;
function workshopWatch(){
  if(!workshopOn() || st.wsSeen===WS.id) return;
  clearInterval(wsTimer);
  wsTimer=setInterval(()=>{
    if(document.hidden) return;
    wsUsed+=5000;
    if(wsUsed>=WS_AFTER_MS){
      clearInterval(wsTimer);
      /* never over the top of the player, an open sheet, or somebody in
         the middle of signing up */
      const ov=document.getElementById('ov');
      if(ov && ov.classList.contains('on')) { wsUsed=0; workshopWatch(); return; }
      if((document.getElementById('player')||{}).childElementCount) { wsUsed=0; workshopWatch(); return; }
      if(!wsMoment()) { wsUsed=0; workshopWatch(); return; }
      openWorkshop();
    }
  },5000);
}
function openWorkshop(){
  if(!workshopOn() || !wsMoment()) return;
  const el=wsHost();
  el.innerHTML=workshopPopHTML();
  el.style.display='flex';
  setTimeout(mountCaptions,0);
}
function closeWorkshop(seen){
  const el=document.getElementById('wsPop');
  if(el){ el.style.display='none'; el.innerHTML=''; }
  if(seen && WS){ st.wsSeen=WS.id; save(); render(); }
}
function wsHost(){
  let el=document.getElementById('wsPop');
  if(el) return el;
  el=document.createElement('div');
  el.id='wsPop';
  /* display is set on the element, not by a class: an inline display:none
     beats any rule a stylesheet can offer, so the class version mounted a
     popup that was open and invisible at the same time. */
  el.style.cssText='position:fixed;inset:0;z-index:995;display:none;align-items:center;'
    +'justify-content:center;padding:18px;background:rgba(8,20,18,.74);'
    +'backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)';
  el.onclick=e=>{ if(e.target===el) closeWorkshop(true); };
  document.body.appendChild(el);
  return el;
}
/* The film is shot vertical, so the card is built around a 9:16 box that

function startChosen(day){

     with a difficulty selected offered a mobility day whenever today's cell

function screenLadder(){
  const cur=curStage(), s=STAGES[cur]||STAGES[0];
  const P=cpProgress(cur);
  const pct=P.of?Math.round(P.met/P.of*100):0;
  const mins=ladderMins();

  /* The stages you have not reached, as a spine. They used to be five cards
     identical to each other, each carrying its own £5/MO tag, so the loudest
     thing on the ladder was the price repeated five times and the ladder read
     as a list rather than a climb. The price is stated once, above. */
  /* The whole list sat under one heading reading BELOW YOU, and the first
     thing in it was the stage you had already finished, drawn with a filled
     node and reached by pressing Up. A stage you have cleared is not below
     you, so it is not filed there any more: done and ahead are two lists
     with their own headings. */
  const rung=(x,i,last)=>{
    if(i===cur) return '';
    /* Behind you is a position. Passed is a claim, and it was being made on
       position alone: a brand new account placed at Wall Work by the quiz
       got a green tick against Foundations, having never done a drill.
       A tick now means the check points were actually reached. */
    const behind=i<cur;
    const p=cpProgress(i);
    const passed=behind && p.ready;
    /* and the gate label cleared once the gate is open, rather than still
       reading "Opens at 7 / 7 above" beside a header saying all 7 are done.
       "Above" was a claim about the screen rather than the ladder, and the
       ladder reads the other way: it names the stage now. */
    const opensAt = (i===cur+1 && !(P.of && P.met>=P.of)) ? P.of : 0;
    return `<div style="display:grid;grid-template-columns:40px 1fr;column-gap:14px">

          background:${behind?'#0a7b74':'rgba(17,17,17,.12)'}"></i>`}
      </div>
      <div onclick="openStage(${i})" style="cursor:pointer;padding-bottom:22px;display:flex;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font:400 20px/1.1 var(--serif);color:${behind?'var(--ink)':'var(--grey)'}">${
            esc(x.n)}</div>
          <div style="margin-top:6px;font:400 13.5px/1.45 var(--sans);color:var(--grey)">${
            esc(x.goal)}</div>
          ${opensAt?`<div style="margin-top:8px;font:600 12px/1 var(--sans);color:var(--forest)">
            Opens when you reach ${P.of} of ${P.of} on ${esc((STAGES[cur]||{}).n||'this stage')}</div>`:''}
        </div>
        ${stageLocked(i)?`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5a5a5a"
          stroke-width="2.2" style="flex:none;margin-top:6px"><rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`:''}
      </div>
    </div>`;
  };
  const doneIdx  = STAGES.map((x,i)=>i).filter(i=>i<cur);
  const aheadIdx = STAGES.map((x,i)=>i).filter(i=>i>cur);
  const rungsDone  = doneIdx.map((i,n)=>rung(STAGES[i],i,n===doneIdx.length-1)).join('');

  const nxt=STAGES[cur+1];
  return `<div class="scroll s">

      <div class="card" style="margin-top:22px;padding:20px">

        <div style="display:flex;flex-direction:column;gap:9px;margin-top:14px">

              <span style="color:var(--forest)">&bull;</span><span>${x}</span></div>`).join('')}
        </div>
        <button onclick="st.wantUpgrade=null;st.quizDone=true;goJoin()"

    <div data-tour="checkpoints" style="padding:22px 16px 0">${checkpointsCard()}</div>
