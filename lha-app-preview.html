<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#006663">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handstand Ladder">
<meta name="mobile-web-app-capable" content="yes">
<title>PREVIEW · London Handstand Academy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* an inline display beats the browser's own [hidden] rule, and several of
   these panels carry one */
[hidden]{display:none!important}
:root{
 /* Repainted from the Claude Design Today canvas. Same token names so
    nothing downstream had to change — only what they resolve to. Warm
    neutral ground, deep teal doing the work forest green used to, pale
    blue where sand was, and terracotta kept but retuned: it is the only
    warning colour in the app and teal cannot carry that meaning. */
 --bg:#ece7e2; --page:#e4dfda; --forest:#006663; --forest-d:#00403d; --ink:#111111;
  --sand:#cfe6ec; --sage:#8fbeca; --grey:#5a5a5a; --grey2:#686868;
 --mist:#e3ded8; --red:#a4503c; --line:rgba(17,17,17,.12);
 /* roles the full-app source showed that the Today file alone did not:
    an off-white that sits on teal, an amber accent, and the deep teal
    used for text on pale grounds */
 --on-primary:#f7f4f1; --amber:#f3a949; --deep:#00403d;
 /* sage is a fill colour; as a word on teal it lands near 3:1, so text
    gets its own lighter tint rather than the bar's */
 --sage-t:#d6e9f0;
 --serif:Newsreader,Georgia,serif; --sans:Figtree,system-ui,sans-serif;
}
/* The ground is not flat. Three soft radial washes over the warm neutral:
   teal top left, pale blue right, a little amber low down. It is what makes
   the white cards read as glass sitting on something rather than as boxes
   on a colour, and it was the part of the redesign that got left behind. */
body{margin:0;background:#f4f4f5;font-family:var(--sans);color:var(--ink);
 -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
 /* the page itself never scrolls — only .scroll does, so the tab bar stays put */
 height:100dvh;overflow:hidden}
.s::-webkit-scrollbar{display:none}.s{scrollbar-width:none}
/* the stage you are on breathes, so the eye finds it without a label */
@keyframes lhaNow{0%,100%{box-shadow:0 0 0 0 rgba(243,169,73,0)}
  50%{box-shadow:0 0 0 7px rgba(243,169,73,.22)}}
@keyframes lhaRow{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* #app is where the ground has to live, not body: it is capped at 520px and
   centred, so it paints over whatever body is doing underneath it. The
   gradient was on body and this flat fill sat on top of it, which is why
   the glass never showed. */
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;
 /* The base is #f4f4f5, a cool near white, exactly as the frames have it, not
    the warm --bg cream. That is the whole difference: three washes at .05 to
    .12 read against a near white and vanish into a warm mid tone, which is
    why the gradient kept looking like it was not there. */
 background:
   radial-gradient(circle at 15% 8%,rgba(0,102,99,.07),transparent 40%),
   radial-gradient(circle at 90% 30%,rgba(143,190,202,.12),transparent 45%),
   radial-gradient(circle at 30% 80%,rgba(243,169,73,.05),transparent 40%),
   #f4f4f5;
 overflow:hidden}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:34%;width:7px;height:7px;border-radius:2px;
  opacity:0;transform:rotate(var(--a)) translateY(0);
  animation:pop 900ms cubic-bezier(.2,.7,.3,1) var(--t) 1 both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes riseB{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn,.btn2{transition:background .3s,transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.btn:active,.btn2:active{transform:scale(.98)}
.card{transition:box-shadow .4s,transform .4s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){
 .btn:hover{background:#007a75}
 .btn2:hover{background:rgba(0,102,99,.05)}
 .rail>div:hover{transform:translateY(-3px)}
}
.rail>div{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
}
@keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes riseB{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(101%)}to{transform:none}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
/* one class so a section can be given the design's entrance and its delay */
#app[data-still="1"] .rise,
#app[data-still="1"] [style*="animation:rise"],
#app[data-still="1"] [style*="animation:riseB"]{animation:none!important}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.rise-1{animation-delay:.1s}.rise-2{animation-delay:.16s}
.rise-3{animation-delay:.3s}.rise-4{animation-delay:.36s}
@media (prefers-reduced-motion:reduce){
  .rise,[style*="animation:rise"],[style*="animation:shimmer"]{animation:none!important}
}
@keyframes pop{0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.4)}
  15%{opacity:1}
  100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d)*-1)) scale(1) }}
@media(prefers-reduced-motion:reduce){.burst{display:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
 /* the bar floats over the page, so the last thing on every screen has to
    have room to sit above it rather than under it */
 padding-bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
/* no double tap zoom, and no zoom on focusing a field: iOS zooms into any
   input under 16px, which is how the app kept ending up at 110% */
html,body{touch-action:manipulation}
@supports (-webkit-touch-callout:none){ input,textarea,select{font-size:16px !important} }
/* The top bar is fixed and 67px tall: 10 + a 44px control + 12. Anything
   less than that here puts the first line of the hero underneath it, which
   is how the greeting and the stage title both ended up sliced. */
body[data-tier=free] .btn{background:#0a7b74}
.kick{font:600 10px/1 var(--sans);letter-spacing:.2em;color:var(--sage-t)}
.kick2{font:600 9.5px/1 var(--sans);letter-spacing:.16em;color:var(--grey2)}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400}
.h-xl{font:400 40px/1.02 var(--serif)} .h-lg{font:400 34px/1.06 var(--serif)}
.h-md{font:400 26px/1.1 var(--serif)} .h-sm{font:400 22px/1 var(--serif)}
.card{background:#fff;border-radius:26px;padding:22px 20px;
 border:1px solid rgba(0,64,61,.10);
 box-shadow:0 1px 2px rgba(0,64,61,.05),0 8px 20px rgba(0,64,61,.06)}
.pad{padding:12px 16px 0}
.btn{border:none;width:100%;background:var(--forest);border-radius:18px;padding:18px;cursor:pointer;
 font:700 15px/1 var(--sans);color:var(--on-primary);display:block;
 transition:background .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.btn:hover{background:#007A75}
.btn:active{transform:scale(.98)}
.btn2{transition:background .3s,transform .25s cubic-bezier(.2,.8,.2,1)}
.btn2:hover{background:rgba(0,102,99,.05)}
.btn2:active{transform:scale(.98)}
.card{transition:box-shadow .4s,transform .4s cubic-bezier(.2,.8,.2,1)}
.rail>*{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.rail>*:active{transform:scale(.98)}
.btn small{display:block;font:500 11px/1 var(--sans);letter-spacing:.1em;color:var(--sage-t);margin-top:8px}
.btn2{flex:1;text-align:center;font:600 13px/1 var(--sans);color:var(--forest);padding:14px;cursor:pointer;
 border-radius:16px;border:1.5px solid var(--line);background:none}
.pill{font:600 9.5px/1 var(--sans);letter-spacing:.14em;padding:7px 10px;border-radius:999px}
/* the menu: everything that was on the More tab, slid in from the left.
   Above the top bar, below every sheet, so a password change opens over it. */
.menu{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,30,28,.45);
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.menu.on{display:block;animation:fade .25s both}
.menu .panel{position:absolute;top:0;bottom:0;left:0;width:min(86vw,360px);overflow-y:auto;
 background:#f4f4f5;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 26px);
 box-shadow:24px 0 60px -30px rgba(0,0,0,.45);animation:slideIn .32s cubic-bezier(.2,.9,.2,1) both}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.menu.on,.menu .panel{animation:none!important}}
/* ── the bar at the bottom ─────────────────────────────────────────
   It was a white strip welded to the bottom of the screen with a hairline
   over it, which is how an app looked in 2016. It floats now: a rounded
   bar of frosted glass sitting over the page with the content sliding
   underneath it, the way the bar in WhatsApp and Instagram does. Words,
   not icons, because the four words are the four screens and a picture of
   a ladder is a guess at what Ladder means.

   The blur is the point, so the bar takes its colour from whatever is
   behind it. Where a browser cannot blur, the fallback is a solid bar
   rather than a transparent one you cannot read. */
.tabbar{position:absolute;left:12px;right:12px;z-index:20;display:flex;gap:4px;padding:5px;
 bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
 border-radius:26px;background:rgba(252,252,251,.92);
 border:1px solid rgba(255,255,255,.75);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.85),
   0 18px 40px -20px rgba(0,64,61,.5), 0 3px 12px rgba(0,64,61,.10)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tabbar{background:rgba(252,252,251,.62);
    backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%)}
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
 min-height:46px;padding:13px 4px;cursor:pointer;
 border:none;background:transparent;border-radius:19px;position:relative;
 transition:background .28s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
.tab:active{transform:scale(.96)}
.tab span{transition:color .3s,font-weight .3s}
/* the dot said which tab you were on. The pill says it now. */
.tab i{display:none}
.tab.on{background:#fff;box-shadow:0 1px 3px rgba(0,64,61,.16),0 0 0 .5px rgba(0,64,61,.06)}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}
/* primary navigation: the quiet grey is too quiet for the one control
   that is always on screen */
.tab span{font:600 12.5px/1 var(--sans);color:var(--grey)}
.tab.on span{font-weight:700;color:var(--deep)}
.ov{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,30,28,.45);
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
 align-items:flex-end;justify-content:center}
.ov.on{display:flex;animation:fade .3s both}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
 background:rgba(250,248,246,.94);backdrop-filter:blur(28px) saturate(180%);
 -webkit-backdrop-filter:blur(28px) saturate(180%);
 border-radius:28px 28px 0 0;padding:12px 18px calc(env(safe-area-inset-bottom) + 28px);
 animation:sheetUp .45s cubic-bezier(.2,.9,.2,1) both}
.grab{width:38px;height:4px;border-radius:99px;background:rgba(17,17,17,.18);margin:0 auto 16px}
.sheet.drag{transition:none}
.ov.full{align-items:stretch}
.ov.full .sheet{max-height:100%;height:100%;border-radius:0;
 padding-top:calc(env(safe-area-inset-top) + 10px);animation:fade .25s both}
.fsbtn{position:absolute;top:10px;right:12px;border:none;background:rgba(17,17,17,.06);
 border-radius:999px;padding:7px 12px;font:600 11px/1 var(--sans);color:var(--grey);cursor:pointer}
.sheet{position:relative}
.sheet h2.st{margin:0;padding-right:110px;font:400 24px/1.05 var(--serif);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.ov.on,.sheet{animation:none!important}}
.ovhead{padding:calc(env(safe-area-inset-top) + 18px) 22px 22px;
 border-bottom:1px solid rgba(0,64,61,.10)}
/* text links that are still buttons: padding gives them a target without
   moving them visually */
.back{font:500 13px/1 var(--sans);color:var(--forest);cursor:pointer;background:none;border:none;
 padding:11px 2px;min-height:44px;display:inline-flex;align-items:center}
video{width:100%;display:block;background:#000}
/* ── the in-app player ── */
.vp{position:relative;line-height:0}
.vp-bar{position:absolute;left:0;right:0;bottom:0;z-index:4;
 display:flex;align-items:center;gap:9px;padding:10px 11px 11px;
 background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55) 42%,rgba(0,0,0,.72));
 opacity:1;transition:opacity .25s}
.vp-btn{flex:none;width:34px;height:34px;border:0;border-radius:999px;cursor:pointer;
 background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;padding:0;
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s}
.vp-btn:hover{background:rgba(255,255,255,.26)}
.vp-btn:active{transform:scale(.94)}
.vp-t{flex:none;font:600 11px/1 var(--sans);color:rgba(255,255,255,.82);
 font-variant-numeric:tabular-nums}
.vp-track{flex:1;min-width:0;height:20px;display:flex;align-items:center;cursor:pointer;
 touch-action:none}
.vp-track::before{content:'';position:absolute;left:0;right:0;height:20px}
.vp-track>i{display:block;position:relative;width:0;height:4px;border-radius:3px;background:#fff;
 box-shadow:0 0 0 100vmax rgba(255,255,255,.22) inset}
.vp-track{position:relative;border-radius:3px;background:rgba(255,255,255,.26);height:4px}
.vp-track>i{height:4px}
#theatre{position:fixed;inset:0;z-index:1400;background:#000;display:none;
 align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:contain}
#theatre.on{display:flex}
#vpRoom{position:relative;display:flex;align-items:center;justify-content:center;
 transform-origin:50% 50%}
#vpStage{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
#theatre .vp-bar{background:none;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px)}
#theatre .vp-btn{width:40px;height:40px}
#theatre .vp-t{font-size:12px}
.row{padding:15px 18px;border-bottom:1px solid rgba(0,64,61,.08)}
.row:last-child{border-bottom:none}
.box{width:24px;height:24px;border-radius:8px;border:2px solid rgba(0,64,61,.22);flex:none;
 display:grid;place-items:center;font-size:13px;color:transparent;cursor:pointer;background:#fff}
.box.on{background:var(--forest);border-color:var(--forest);color:#fff}
/* This started life as a label-sized chip and is now the stepper on every
   check point, so it has to take a thumb: 44px, not 25. */
.rt{font:600 12px/1 var(--sans);border-radius:999px;padding:0 14px;cursor:pointer;
 min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;
 border:1px solid var(--line);background:#fff;color:var(--grey)}
.rt.easy.on{background:var(--sage);color:#fff;border-color:transparent}
.rt.hard.on{background:var(--amber);color:#fff;border-color:transparent}
.why{display:inline-flex;align-items:center;gap:9px;margin-top:10px;background:rgba(0,64,61,.06);
 border-radius:999px;padding:9px 14px;min-height:36px;cursor:pointer;border:none}
.why b{font:700 11.5px/1 var(--sans);color:var(--forest)}
.why span{font:500 11.5px/1 var(--sans);color:var(--deep)}
input,textarea{font-family:var(--sans);font-size:16px;color:var(--ink)}
.act{
  border:1px solid var(--line,rgba(0,0,0,.14)); background:#fff; color:var(--ink);
  border-radius:999px; padding:0 18px; cursor:pointer; min-height:44px;
  display:inline-flex; align-items:center; justify-content:center;
  font:600 13px/1 var(--sans); white-space:nowrap;
}
.act:active{transform:translateY(1px)}
.act:focus-visible{outline:2px solid var(--forest); outline-offset:2px}

/* ── follow-along player ─────────────────────────────────────────
   Ported from the programme pages, which read better than the dark
   version this replaced: stone ground, whole video visible rather
   than cropped, cues on screen while you work. */
/* ── the tutorial's glass ──────────────────────────────────────────
   Frosted rather than solid, so the screen it is describing stays
   readable through it. Falls back to a near-opaque panel where
   backdrop-filter is not supported. */
.tour-card{position:absolute;left:12px;right:12px;border-radius:24px;padding:18px 19px 15px;
  background:rgba(246,243,239,.82);border:1px solid rgba(255,255,255,.62);
  box-shadow:0 26px 60px -26px rgba(0,20,19,.75),inset 0 1px 0 rgba(255,255,255,.85);
  animation:tourIn .4s cubic-bezier(.2,.9,.2,1) both;
  transition:top .4s cubic-bezier(.2,.9,.2,1)}
/* the words change, the card does not arrive again */
.tour-card.is-swap .tour-kick,.tour-card.is-swap .tour-h,.tour-card.is-swap .tour-b{
  animation:tourSwap .26s cubic-bezier(.2,.9,.2,1) both}
.tour-card.is-swap .tour-h{animation-delay:.03s}
.tour-card.is-swap .tour-b{animation-delay:.06s}
@keyframes tourSwap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.tour-hole{position:absolute;border-radius:20px;pointer-events:auto;
  box-shadow:0 0 0 9999px rgba(0,42,40,.62),inset 0 1px 0 rgba(255,255,255,.5),
  0 0 40px -8px rgba(207,230,236,.5);border:1.5px solid rgba(255,255,255,.6);
  transition:top .4s cubic-bezier(.2,.9,.2,1),left .4s cubic-bezier(.2,.9,.2,1),
  width .4s cubic-bezier(.2,.9,.2,1),height .4s cubic-bezier(.2,.9,.2,1)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tour-card{background:rgba(246,243,239,.58);backdrop-filter:blur(22px) saturate(1.5);
    -webkit-backdrop-filter:blur(22px) saturate(1.5)}
}
@keyframes tourIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tour-card,.tour-hole{animation:none!important;transition:none!important}
  .tour-card.is-swap .tour-kick,.tour-card.is-swap .tour-h,.tour-card.is-swap .tour-b{animation:none!important}}
.tour-kick{font:600 10px/1 var(--sans);letter-spacing:.14em;color:var(--forest)}
.tour-h{font:400 21px/1.15 var(--serif);color:var(--deep);margin-top:9px}
.tour-b{font:400 14.5px/1.55 var(--sans);color:#4a4a4a;margin-top:8px}
.tour-dots{display:flex;gap:5px;margin-top:14px}
.tour-dots i{width:5px;height:5px;border-radius:99px;background:rgba(17,17,17,.16);
  transition:width .3s ease,background .3s ease}
.tour-dots i.on{width:16px;background:var(--forest)}
.tour-skip{border:0;background:none;cursor:pointer;padding:10px 2px;
  font:600 13.5px/1 var(--sans);color:var(--grey2)}
.tour-back{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.5);
  border-radius:13px;cursor:pointer;padding:11px 16px;font:600 13.5px/1 var(--sans);color:var(--ink)}
.tour-go{border:0;border-radius:13px;cursor:pointer;padding:11px 20px;
  font:600 13.5px/1 var(--sans);background:var(--forest);color:var(--on-primary);
  box-shadow:0 8px 20px -10px rgba(0,102,99,.9)}
#player{position:fixed;inset:0;z-index:990;background:#f4f1ed;color:var(--ink);
 display:none;flex-direction:column;overflow:hidden}
#player.on{display:flex}
#player.resting{background:#ece7e2}
.p-bar{flex:none;height:calc(52px + env(safe-area-inset-top,0px));
 padding:env(safe-area-inset-top,0px) 10px 0 16px;display:flex;align-items:center;
 justify-content:space-between;gap:10px;background:#fff;border-bottom:1px solid rgba(28,32,25,.1)}
.p-idx{font:700 11.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--grey2)}
.p-clock{font:400 21px/1 var(--serif);font-variant-numeric:tabular-nums}
.p-elapsed{font:500 11px/1 var(--sans);color:var(--grey2);font-variant-numeric:tabular-nums}
.p-ctrls{display:flex;align-items:center;gap:7px}
.p-x{width:34px;height:34px;border-radius:999px;border:none;background:var(--mist);
 color:var(--ink);font:600 13px/1 var(--sans);cursor:pointer;display:grid;place-items:center;padding:0}
/* Sound was a speaker glyph in the same grey pill whichever way it was set,
   so there was no telling from the screen whether it was on. It says so. */
.p-sound{height:34px;width:auto;padding:0 12px 0 10px;gap:6px;border-radius:999px;border:none;
 cursor:pointer;display:inline-flex;align-items:center;font:600 11.5px/1 var(--sans);
 background:var(--mist);color:var(--grey);white-space:nowrap}
.p-sound.on{background:var(--forest);color:var(--on-primary)}
.p-track{flex:none;height:3px;background:rgba(28,32,25,.09)}

/* ── what each explainer covers ──────────────────────────────────
   Written from the captions of the film, not from its title, so the line

const EXPLAIN_SUM = {
  'bf9ca9d217d21dbd588318d479d9507c':
    'Most of the fear of falling goes once the body knows, consciously, that it can get out of any position. Elliott and Suryava go through the ways out: drills that start on the floor, the cartwheel out, chest to wall bailouts, and why the forward roll is fine in a gym and painful on a hard floor. Practise falling until it stops needing a thought, and keep the exit low effort so you can go straight back up.',
  '780eb706b9607047da0fd92103f09cf0':
    'The wrists hurt because they have never carried you, and the legs have had decades of practice. Soreness is normal for a while and is not a reason to stop, but it is a reason to be kind to yourself and to know when to. The wrist and forearm routine, forearm massage and the small muscles of the hand all strengthen with regular attention, and Elliott reckons on about eighteen months of regular wrist work before it stops being a thing. Two minutes at a desk with a water bottle counts.',
  'a74fc970945b633f71bc7457893baf25':
    'Two to three half hour sessions a week is the recommendation for a beginner, with recovery in between: every day for an hour fatigues you and the progress stalls. Further up, freestanding and shape changes want three to four sessions of 45 minutes to an hour, and one arm work wants four or five a week at an hour each, plus mobility. The honest answer is how much you can commit and what you want out of it.',
  '7467f41353ab66c13b57543f0a7105d6':
    'Short answer no, long answer it helps, but not the way you think. Gym strength does not carry over much; handstand strength comes from handstands, the way climbing strength comes from climbing. The ladder is built for someone with a small training background. Big strong people usually lack shoulder mobility and very flexible people usually lack strength, so everybody has one limiting factor, and coaching is where it gets found and worked on.',
  'd692864081a3d4976dbafaaaff314213':
    'It depends on you, how much you can commit, and what you mean by a handstand: one lucky ten second hold, or holding it any day, anywhere. Some people get five or ten seconds in ten days, some in six months, Elliott took eighteen. Perfecting it takes years. The time passes anyway, so start now. And it is not zero or one: there are dozens of steps between the wall and a handstand, which is why the ladder exists, so celebrate the small wins along it.',
  'f84f53ba8026f8bd0348cb6836a46aad':
    'Stacked, and relaxed. Suryava describes the shoulders engaging and the rest of the body no longer feeling like weight on the hands, able to breathe and talk. Elliott explains why: standing is effortless because the hips are over the feet, and a handstand gets the same efficiency when the shoulders stack over the hands and the hips over the shoulders. The banana back is a symptom, not the cause: the shoulders cannot open, so the body leans and the back arches to pull the weight back in. Fix the shoulder position and the hold gets lighter.',
  '99806cf5a01e65ef29f786bb4e50453b':
    'Wall work is where you spend real time upside down, with the wall as the assistance. Chest to wall handstands until they are comfortable and relaxed, wall scapular shrugs to build the push through the shoulders, the pike push up taken a step on from wherever you are, and the knee tuck entry so you can kick up in the middle of the room and get most of the way there. The check points for this stage are on the ladder, and you still choose how long and how hard each session is.',
  'e1ff0eb98d4c9721ede040f7db994acf':
    "Between the hands, at the centre point, with a relaxed head rather than a flared one or eyes pushed up. Almost every drill in the programme asks for it, because seeing where you are is how you learn to balance and build coordination in that position. Gaze shifts and looking back are targeted exercises for shoulder positioning and mobility, later. Suryava's rule of thumb: the push is directional, and you push where you look.",
  'a366aa047568153b2db238333eb43e8f':
    "Build to is Elliott's answer to handstands feeling like failure. If the set asks for thirty seconds or eight reps and you come down at ten, that is not the end of the set: rest ten or thirty seconds and go back up until the number is reached. Handstands are learned by time upside down, and coming down early on every set means never getting enough of it. Progress is a jagged line, and your bad balance days a year from now will be better than your good days today.",
  '681e59df476ca15c136c365cbd2cec72':
    'Why not just kick up in the middle of the room once wall work is done? Because wall work teaches you what the line feels like, and Pushing More teaches you to take yourself a little off the wall while keeping it, with the shrug and the scapular elevation most people have not quite got yet. Plenty of people can get their legs off the wall while lying on it with the chest sunk in. This phase is about getting off it properly, so the balance work in the next two phases already has that ability underneath it. Entries still level up alongside, so you keep kicking up and learning to get in and out consistently.',
  '7cca146ef4826328688d1c00693b7b4a':
    'Take-Off is where the fun starts: weight on the hands, balancing it yourself, the wall as a friend rather than a bed. Kicking up and hoping gives one hold in ten and almost no time upside down; here you use the shoulders and the hips to shift your centre of mass away from the wall and create balance, touching back when you fall. Knees on box leg lifts, shape changes against the wall relying on it less each week, and five minutes of freestanding attempts at the start or end so you find out where you are. Aim for a ten second freestanding hold by the end of it.',
  'ea06b266a4ed68ce5f8ee0c180d01827':
    'Easier because the centre of mass is lower, as with crow pose, so there is less to balance. Harder because tucking the knees shifts your mass forward, and a good tuck handstand opens the shoulders even more than a straight one to compensate; most people close the shoulder and planche instead. It needs more strength and more shoulder mobility, which is why this phase adds active and weighted mobility drills, and why the tuck carries into press and one arm later and makes your straight handstand feel easier.',
};

/* drill levels run 1 to 4; the bands above map them onto three workouts */
/* which grouping a drill belongs to on the stage it is being trained on */
/* The coach can add a drill to a stage from the dashboard, which lands in
   settings rather than in this file. Merged in here so every caller sees one
   pool rather than each having to remember there are two. */
/* The shipped pool, plus what the coach has added, plus what they have
   changed about a shipped drill. An extra naming a drill the stage already
   has used to be thrown away, so moving a shipped drill to another grouping
   or another level from the dashboard was saved and then ignored. It now
   replaces the shipped row rather than being dropped beside it. */
function poolFor(stage){
  const base=POOL[stage]||[];
  const extra=((st.ladderExtra||{})[stage]||[])
    .filter(x=>x&&x.v&&drillById(x.v))
    .map(x=>({v:x.v, g:x.g||'Strength', L:Math.max(1,Math.min(4,x.L||1))}));
  if(!extra.length) return base;
  const by={}; extra.forEach(x=>{ by[x.v]=x; });
  const out=base.map(row=>by[row.v] || row);
  const seen=new Set(base.map(x=>x.v));
  return out.concat(extra.filter(x=>!seen.has(x.v)));
}
/* ── the ladder's own check points, as the coach has them ──────────
   CHECKPOINTS is the shipped list. The coach can change a wording, a
   target, the drill the demo comes from, or add and remove one, and it is
   kept as an overlay keyed by the same k so a shipped one that has not been
   touched stays exactly as it shipped. */
function cpsFor(stage){
  const over=((typeof st!=='undefined' && st.ladderCps)||{})[stage];
  const base=(CHECKPOINTS[stage]||[]);
  if(!over) return base;
  const edits=over.edit||{}, gone=over.off||[], extra=over.add||[];
  const out=[];
  base.forEach(c=>{
    if(gone.indexOf(c.k)>-1) return;
    out.push(edits[c.k] ? Object.assign({}, c, edits[c.k]) : c);
  });
  extra.forEach(c=>{ if(c && c.k && !out.some(x=>x.k===c.k)) out.push(c); });
  /* the coach's order where they have set one */
  if(Array.isArray(over.order) && over.order.length){
    const at=v=>{ const i=over.order.indexOf(v); return i<0 ? 999 : i; };
    out.sort((a,b)=>at(a.k)-at(b.k));
  }
  return out;
}
/* the level shares for a stage and a band: the coach's where they have set
   them, otherwise the shipped mix every stage used to share */
function mixFor(stage, band){
  const own=(((typeof st!=='undefined' && st.ladderMix)||{})[stage]||{})[band];
  if(own && Object.keys(own).length) return own;
  return BAND_MIX[band] || BAND_MIX[2];
}
/* Sets and reps for a drill inside one band. Three places can say, and the
   narrower one wins: the whole workout ("*"), everything at one difficulty
   inside it ("*l3"), then the drill itself. Whatever none of them says
   falls back to the drill's own numbers and then to the dose. */
function bandTimingFor(stage, band, v){
  const bt=(typeof st!=='undefined' && st.bandTiming) || {};
  const forStage=bt[stage] || bt[String(stage)] || {};
  const b=forStage[band] || forStage[String(band)] || {};
  /* the dashboard loads this file too, where there is no st for poolFor
     to read, so asking for the row must never take the page down */
  let row=null;
  try{ row=poolRow(stage, v); }catch(e){ row=null; }
  const byLvl=(row && row.L) ? b['*l'+row.L] : null;
  const out=Object.assign({}, b['*']||{}, byLvl||{}, b[v]||{});
  return Object.keys(out).length ? out : null;
}

   three; everywhere else there is one workout and the chooser should not
   pretend otherwise. */

/* How much of an Easier session on a later stage is drawn from the stage

const BACK_SHARE = 0.30;
const BACK_MIN_LEVEL = 3;

   BAND_MIX gives each of the three buttons a share of each difficulty
   level, and the builder spends those shares. It works, and it means the
   only way to change what is in Harder is to move a drill between levels
   and then work out what that did to the other two.

   Where the coach has written the list out instead, that list is the
   session. Returned in the order it was written, because a short session
   takes from the top. Ids that no longer name a drill are dropped rather
   than handed on as holes. */
function bandFor(stage, band){
  const list=(((typeof st!=='undefined' && st.ladderBands)||{})[stage]||{})[band];
  if(!Array.isArray(list) || !list.length) return null;
  const pool=poolFor(stage);
  const out=[];
  list.forEach(v=>{
    const row=pool.find(x=>x.v===v);
    if(row && out.indexOf(row)<0) out.push(row);
  });
  return out.length ? out : null;

<script>/* timing.js, inlined so the preview opens on its own */
/* How long a drill takes, and a session made of them.

   The rules Elliott set: a warm-up is thirty seconds, a timed hold is the
   time asked for plus ten to get into and out of it, a set of reps is
   forty-five, and "build to" is untimed because the point of it is to stop
   when you stop.

   Pure functions, no app state, so the coach dashboard can work out what a
   session actually comes to without a second copy of the arithmetic going
   quietly out of step with the app's. */
const LHA_WARMUP_SECS = 30;
const LHA_SETUP_SECS  = 10;
const LHA_REPS_SECS   = 45;
const LHA_WARM_GRP = /warm|pancake|mobility|wrist/i;
const LHA_HARD_GRP = /^(strength|press)$/i;

const lhaIsHold = d => /max hold|attempts|build to|to failure/i.test(String(d || ''));

/* the seconds named in a dose: "30s" is thirty, "30s each way" is sixty */
function lhaDoseSecs(d){
  const t = String(d || '');
  const m = /(\d+)\s*(?:s\b|sec)/i.exec(t);
  if(!m) return 0;
  const n = +m[1];
  return /each (?:way|side|leg|arm)/i.test(t) ? n * 2 : n;
}
/* how many sets a dose asks for: "3 × 8" is three, "2 sets · ..." is two */
function lhaSets(dose){
  let m = /^\s*(\d+)\s*[×x]/.exec(String(dose || ''));  if(m) return +m[1];
  m = /^\s*(\d+)\s*sets?\b/i.exec(String(dose || ''));  if(m) return +m[1];
  return 1;
}
/* ── stated beats parsed ───────────────────────────────────────────
   A drill can now carry its set count, its amount and its unit as three
   numbers the coach typed, rather than leaving all three to be read back
   out of a sentence. Where they are there they win; where they are not,
   the dose is parsed exactly as it always was, so a drill nobody has
   touched behaves the same as yesterday. */
function lhaSetsOf(it){
  it = it || {};
  const n = Number(it.sets);
  if(Number.isFinite(n) && n >= 1) return Math.round(n);
  return lhaSets(it.d);
}
/* one set's worth: how much, and whether that is reps or seconds */
function lhaAmount(it){
  it = it || {};
  const n = Number(it.amt);
  if(Number.isFinite(n) && n > 0 && (it.unit === 's' || it.unit === '')){
    return { n: Math.round(n), unit: it.unit };
  }
  const d = String(it.d || '');
  const nums = d.match(/\d+/g);
  if(nums && nums.length){
    return { n: Number(nums[nums.length - 1]),
             unit: /\bs(ec|econds)?\b|\d+\s*s\b/i.test(d) ? 's' : '' };
  }
  return { n: 0, unit: '' };
}
/* one set, in seconds. 0 means untimed: they stop when they stop. */
function lhaWork(it, grp){
  it = it || {};
  if(it.w) return it.w;                       /* a coach's own number wins */
  /* a stated amount in seconds is how long one set takes; a stated amount
     in reps says nothing about the clock and falls through to the rules */
  if(it.unit === 's' && Number(it.amt) > 0) return Math.round(Number(it.amt));
  if(it.unit === '' && Number(it.amt) > 0 && !it.w && !it.d) return LHA_REPS_SECS;
  if(LHA_WARM_GRP.test(String(grp || it.grp || ''))) return LHA_WARMUP_SECS;
  const d = String(it.d || '');
  if(lhaIsHold(d)) return 0;
  const held = lhaDoseSecs(d);
  return held ? held + LHA_SETUP_SECS : LHA_REPS_SECS;
}
/* the rest after one set. Decided by the block, never by the drill's name:
   matching names put mobility work on a ninety second strength rest. */
function lhaRest(it, grp, i, list){
  it = it || {};
  if(it.r != null) return it.r;
  const g = String(grp || it.grp || '').trim();
  const t = ((it.n || '') + ' ' + (it.d || '')).toLowerCase();
  if(Array.isArray(list) && i != null && i < 4
     && LHA_WARM_GRP.test(String((list[i] && list[i].grp) || ''))) return 0;
  if(LHA_WARM_GRP.test(g)) return 10;
  if(LHA_HARD_GRP.test(g)) return 90;
  if(/entries|build to/.test(t)) return 60;
  return 35;
}
/* A whole session, in seconds. Takes the blocks as the programme stores
   them, expands each drill by the sets its dose asks for, and counts the
   rest between sets as well as between drills. An untimed drill still
   takes time, so it is counted at the reps figure rather than nothing. */
function lhaSessionSecs(groups){
  let secs = 0;
  const flat = [];
  (groups || []).forEach(g => (g.items || []).forEach(it =>
    flat.push({ it, grp: g.name })));
  flat.forEach((x, i) => {
    const n = lhaSetsOf(x.it);
    const w = lhaWork(x.it, x.grp) || LHA_REPS_SECS;
    const r = lhaRest(x.it, x.grp, i, flat);
    secs += n * w + (n - 1) * r;
    if(i < flat.length - 1) secs += r;
  });
  return secs;
}
const lhaMins = secs => Math.round(secs / 60);

</script>

  if(!m) return d;
  const one=m[1].trim();
  /* "3 × 8" leaves a bare 8, and "2 × 5–8" a bare range; neither is a dose */
  return /^\d+(\s*[–—-]\s*\d+)?$/.test(one) ? one+' reps' : one;
}
/* ── the drill, with what the coach has stated merged on ───────────
   The Workouts tab writes a set count, an amount and a unit per drill.
   They live in st.timing, not on the drill, so every reader of a drill's
   numbers has to look in both places or it reads the dose and ignores
   what was typed. One merge, used by all of them. */
function timed(it){
  const set=(st.timing||{})[it && it.v];
  if(!set) return it||{};
  /* The Workouts tab tunes the free ladder; the builder tunes one client's
     programme. On the ladder the tab is the authority. On a coached plan the
     row the coach wrote for that person is more specific than a ladder
     default, so it wins there. */
  return coachedView() ? Object.assign({}, set, it) : Object.assign({}, it, set);
}
const setsFor = it => lhaSetsOf(timed(it));
function sets(dose){
  let m=/^\s*(\d+)\s*[×x]/.exec(dose); if(m) return +m[1];
  m=/^\s*(\d+)\s*sets?\b/i.exec(dose); if(m) return +m[1];
  return 1;
}
/* ── how long one set takes ────────────────────────────────────────
   There used to be two answers to this. The player counted work(), the
   drill list printed the dose, and a "3 x 8" that ran forty seconds
   matched neither — so the same session read as two different lengths
   depending on which screen you opened. Every screen asks this now.

   The rules, as Elliott set them:
     warm-up          30 seconds, whatever the drill says
     a timed hold     the time asked for, plus ten to get in and out
     reps             45 seconds
     build to / max   untimed, because the point is to stop when you stop */
const WARMUP_SECS = 30;   /* a warm-up is a warm-up, not a set */
const SETUP_SECS  = 10;   /* getting into and out of the shape */
const REPS_SECS   = 45;   /* long enough for a set of reps at any count */

/* the seconds inside a dose: "30s" is thirty, "3 x 30s" is thirty a set,
   "30s each way" is thirty each way, so sixty on the clock */
function doseSecs(d){
  const t=String(d||'');
  const m=/(\d+)\s*(?:s\b|sec)/i.exec(t);
  if(!m) return 0;
  const n=+m[1];
  return /each (?:way|side|leg|arm)/i.test(t) ? n*2 : n;
}
/* Whether this is a warm-up is decided by the block it is sitting in, not
   by the drill. Scapula shrugs warm the shoulders up and they are also the
   stage's strength work, and reading the drill rather than the block gave
   them thirty seconds in both places. */
const isWarm = x => WARM_GRP.test(String((x&&x.grp)||(x&&x.it&&x.it.grp)||''));

function work(it, grp){
  const ov=st.secs&&it.v?st.secs[it.v]:0; if(ov) return ov;
  /* A coached programme carries its own seconds and the ladder tuning is not
     about that client, so on a plan the item wins. On the ladder there is no
     item-level number and the tab is the authority. */
  if(coachedView() && it.w) return it.w;
  /* what the coach set for this drill beats the rule everywhere */
  const set=(st.timing||{})[it.v];
  if(set && set.w) return set.w;
  if(it.w) return it.w;
  if(isWarm({grp:grp, it:it})) return WARMUP_SECS;
  const d=String(it.d||'');
  if(isHoldDose(d)) return 0;               /* untimed, they stop when they stop */
  const held=doseSecs(d);
  if(held) return held + SETUP_SECS;
  return REPS_SECS;
}
/* Rest is not one number, and it is decided by which block a drill sits in,
   not by its name. Matching on names put "Pancake Lift Combo" and "Press
   Scapula Shrugs" on a 90 second strength rest because they contain "lift"
   and "shrug", and put press walks there because the block starts "Press". */
const WARM_GRP = /warm|pancake|mobility|wrist/i;
const HARD_GRP = /^(strength|press)$/i;
function rest(x, i, list){
  /* takes a queue entry {it,grp} or a bare drill, so every caller works */
  const it  = (x && x.it) ? x.it : (x || {});
  /* same order as work(): on a plan the row the coach wrote for this client
     beats the ladder tuning, which is not about them */
  if(coachedView() && it.r!=null) return it.r;
  const set=(st.timing||{})[it.v];
  if(set && set.r!=null) return set.r;
  if(it.r!=null) return it.r;
  /* On the ladder a session is one block named after the day, so the day
     name was deciding the rest for everything in it: a day called Strength
     put ninety seconds between wall walks. The drill's own grouping decides
     it where there is one, and the block name only where there is not. */
  const grp = String((x && x.g) || (x && x.grp) || it.grp || '').trim();
  const t   = ((it.n || '') + ' ' + (it.d || '')).toLowerCase();

  if(Array.isArray(list) && i != null){
    /* the first four of the session run straight through */
    if(i < 4 && WARM_GRP.test(String((list[i] && list[i].grp) || ''))) return 0;
  }
  if(WARM_GRP.test(grp)) return 10;
  if(HARD_GRP.test(grp)) return 90;
  if(/entries|build to/.test(t)) return 60;
  return 35;
}

function queue(){
  const d=day(), q=[];
  d.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    const n=setsFor(it);
    for(let k=0;k<n;k++) q.push({it,gi,ii,set:k+1,sets:n,grp:g.name});
  }));
  return q;
}

/* ── the coached week: what was done, and what was not ───────────────
   Ticking every drill was the only way to record a session, so a week
   where the work happened but the phone stayed in a bag looked identical
   to a week with no training in it. Logging is now its own act. */
const LOG_KIND={all:'all',part:'part',none:'none'};
function loggedFor(dateKey){
  return ((st.prog&&st.prog.sessions)||[]).filter(x=>x&&x.at&&dayKey(x.at)===dateKey);
}
function loggedToday(){ return loggedFor(dayKey(Date.now())); }

function tickedToday(){
  const d=day();
  return d.groups.reduce((a,g,gi)=>a+g.items.filter((_,ii)=>st.tick[key(st.day,gi,ii)]).length,0);
}

let exAskDraft='';

/* Ticks are for the day they were made. At the first sign of a new day,
   write down what was ticked as that day's session and clear the board, so
   every morning starts empty. Nothing is thrown away: what was ticked is
   recorded before it goes, dated to the day it happened, and it reaches the
   coach the same way a check-in does.

   Yesterday with nothing ticked records nothing. A blank on the calendar
   means "we do not know", which is not the same as "they did none of it",
   and only the client saying so makes it a miss. */
function rollTicks(){
  /* the plan has to be loaded before anything can be written down about it,
     so a cold start with no cached programme waits and tries again */
  if(!DATA||!DATA.days||!DATA.days.length) return;
  const today=dayKey(Date.now());
  if(!st.tickDay){ st.tickDay=today; st.tickIdx=st.day; save(); return; }
  if(st.tickDay===today) return;
  const was=st.tickDay, idx=st.tickIdx|0;
  const d=(DATA.days&&DATA.days[idx])||null;
  const on=Object.keys(st.tick||{}).filter(k=>st.tick[k]);
  /* only the ticks that belong to the day being closed */
  const mine=on.filter(k=>k.slice(0, String(idx).length+1)===idx+'-');
  if(d && mine.length && !loggedFor(was).length){
    const of=allItems(d).length, got=Math.min(mine.length, of);
    const at=st.tickAt||(new Date(was+'T18:00:00').getTime());
    const kind=(of && got>=of) ? 'all' : 'part';
    st.prog=st.prog||{}; st.prog.sessions=st.prog.sessions||[];
    st.prog.sessions.push({ at, done:kind==='all', kind, mins:0, mode:'ticks',
      day:idx, name:d.label+(d.sub?', '+d.sub:''), drills:of, got, of });
    reportProgress({session:{ at, day:idx, name:d.label+(d.sub?', '+d.sub:''),
      done:kind==='all', mode:'ticks', kind, drills:of, mins:0, actual:0,
      got, of, items:[] }});
  }
  st.tick={}; st.open={};
  st.tickDay=today; st.tickIdx=st.day; st.tickAt=0;
  save();
}

/* kind is all | part | none. A miss is logged too: a blank on the
   calendar means "we do not know", and that is a different fact. */
function logDay(kind){
  const d=day(), of=totalToday(), ticked=tickedToday();
  const got = kind==='all' ? of : kind==='none' ? 0 : Math.max(ticked, 0);
  /* "some of it" with nothing ticked is not the same as none of it. Without
     this the calendar paints an honest part-session as an empty one. */
  const approx = kind==='part' && !ticked;
  const _q = queue();
  const mins = kind==='none' ? 0 : Math.round((_q.reduce((a,x,_i)=>a+work(x.it)+rest(x,_i,_q),0))/60);
  st.prog=st.prog||{}; st.prog.sessions=st.prog.sessions||[];
  st.prog.sessions.push({
    at:Date.now(), done:kind==='all', kind, mins, mode:'checkin', approx,
    day:st.day, name:d.label+(d.sub?', '+d.sub:''),
    drills:of, got, of
  });
  save();
  reportProgress({session:{
    day:st.day, name:d.label+(d.sub?', '+d.sub:''), done:kind==='all',
    mode:'checkin', kind, approx, drills:of, mins, actual:mins, got, of, items:[]
  }});
  closeOv();
  /* finishing the whole thing is the moment worth asking about */
  if(kind==='all'){ st.fbRate=''; st.fbNote=''; save(); openOv('dayfeedback'); return; }
  render();
}
function setFbRate(r){ st.fbRate = st.fbRate===r ? '' : r; save(); drawOv(); }
function sendDayFeedback(skip){
  const note=(($('#fbNote')||{}).value||'').trim();
  const rate=st.fbRate||'';
  if(!skip && (note||rate)){
    const d=day();
    const text='Session done: '+d.label+(d.sub?', '+d.sub:'')
      + (rate?'. Felt '+rate:'') + (note?'. '+note:'');
    st.msgs=(st.msgs||[]).concat([{from:'me',text,time:'Just now'}]);
    save();
    fetch(AUTH.messages,{method:'POST',headers:authed(),body:JSON.stringify({text})})
      .catch(()=>post({type:'Session feedback',text}));
  }
  st.fbRate=''; st.fbNote=''; save(); closeOv(); render();
}

/* weeks in a row with at least one session logged, counting back from
   this week. It used to say three weeks whatever had happened. */
function weekStreak(){
  const ss=((st.prog&&st.prog.sessions)||[]).filter(x=>x&&x.at&&x.kind!=='none');
  if(!ss.length) return 0;
  const mondayOf=t=>{ const d=new Date(t); d.setHours(0,0,0,0);
    d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); };
  const weeks=new Set(ss.map(x=>mondayOf(x.at)));
  let cur=mondayOf(Date.now()), n=0;
  /* this week not being logged yet does not break a run */
  if(!weeks.has(cur)) cur-=7*864e5;
  while(weeks.has(cur)){ n++; cur-=7*864e5; }
  return n;
}

   It was nine. A six week bar, the session, two buttons, an explainer
   rail, a check in card, the block note, a streak, a test countdown and

   Now: the session first because that is what the screen is for, one
   line of where you are, and one card that changes depending on what is
   actually true for this person today. */

function lastSessionAt(){
  const ss=((st.prog&&st.prog.sessions)||[]).filter(x=>x&&x.at&&x.kind!=='none');
  return ss.length ? Math.max(...ss.map(x=>x.at)) : 0;

function testSent(){ return !!(st.awaitingReview && (!st.testAt || st.testAt<=st.awaitingReview)); }

  const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7));

  return ((st.prog&&st.prog.sessions)||[]).filter(x=>x&&x.at>=from&&x.kind!=='none').length;

const EXPLAINERS='https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/explainer-videos/';
/* The explainers Elliott filmed are on Stream, addressed by uid, not in the
   R2 bucket the first ones went to. Stream makes its own still, so a cover
   image never needs uploading: 37 of them were, as JPGs, and Stream cannot
   ingest a JPG as video so not one of them will ever be ready. */
const STREAM_CDN='https://customer-pns1oongdltmkjwa.cloudflarestream.com/';
/* ── the paid library, signed ────────────────────────────────────
   Locked drills only play with a token in place of the uid. The tokens
   come from /sign for an account that may have them, last six hours, and
   are kept in storage so a reload does not start with a blank library.
   Every URL the app builds goes through sigUid or sig on its way out, and
   the data itself stays unsigned, so uidOfUrl keeps working. */
let SIGN={t:{},exp:0};
try{ const s0=JSON.parse(localStorage.getItem('lha_sign')||'null'); if(s0 && s0.exp>Date.now()) SIGN=s0; }catch(e){}
const sigUid = uid => (SIGN.exp>Date.now() && SIGN.t[uid]) ? SIGN.t[uid] : uid;
const sig = url => { const m=/\/([a-f0-9]{32})\//.exec(String(url||'')); return (m && sigUid(m[1])!==m[1]) ? String(url).replace('/'+m[1]+'/', '/'+sigUid(m[1])+'/') : url; };
let signTimer=null;
function loadSign(){
  if(!st.token || st.preview) return;
  /* tokens last six hours and are kept in storage, so opening the app
     again inside that window is not a reason to ask for a new set. It was
     asking on every single open. */
  if(SIGN && SIGN.exp && Object.keys(SIGN.t||{}).length && SIGN.exp-Date.now() > 3600000){
    clearTimeout(signTimer);
    signTimer=setTimeout(loadSign, Math.max(60000, SIGN.exp-Date.now()-3600000));
    return;
  }
  /* ── in the order they are needed ─────────────────────────────────
     This asked for every film in the library in one request, which was
     fine while the server signed whatever it was handed and is not now:
     a free account is given one session's worth, so the session's own
     films have to be at the front of the list rather than wherever the
     library happens to put them. */
  const uids=[]; const seen=new Set();
  const take=u=>{ const m=/\/([a-f0-9]{32})\//.exec(String(u||''));
    if(m && !seen.has(m[1])){ seen.add(m[1]); uids.push(m[1]); } };
  (Q||[]).forEach(x=>take(x && x.it && x.it.url));          /* the session in hand */
  try{ poolFor(curStage()).forEach(x=>take((drillById(x.v)||{}).url)); }catch(e){}
  Object.values(st.fixes||{}).forEach(f=>(f.drills||[]).forEach(d=>take(d.url)));
  allDrills().forEach(d=>take(d.url));
  (LIBRARY||[]).forEach(d=>take(d.url));
  if(!uids.length) return;
  fetch(AUTH.sign,{method:'POST',headers:authed(),body:JSON.stringify({uids})})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(!d) return;
      const had=Object.keys(SIGN.t).length;
      SIGN={t:d.tokens||{}, exp:Number(d.exp)||0};
      try{ localStorage.setItem('lha_sign', JSON.stringify(SIGN)); }catch(e){}
      if(Object.keys(SIGN.t).length!==had) render();
      clearTimeout(signTimer);
      /* an hour before they run out, quietly */
      if(SIGN.exp) signTimer=setTimeout(loadSign, Math.max(60000, SIGN.exp-Date.now()-3600000));
    }).catch(()=>{});
}

/* The library stores a whole URL for a drill and a bare uid for an

const uidOfUrl = u => { const m=/\/([a-f0-9]{32})\//.exec(String(u||'')); return m?m[1]:''; };
/* ── captions ─────────────────────────────────────────────────────
   Stream generates these and serves a VTT per language. Two things make
   this more than a <track>:

   A cross-origin track only loads on a video marked crossorigin, and
   crossorigin turns the MP4 request into a CORS one, which the download
   URL fails: it answers 302 and the redirect carries no CORS header. So
   the cue sheet is fetched and drawn here instead of handed to the player.

   And the browser's own cue rendering is a white box in a sans face. The
   design Elliott gave is a glass plate low in the frame, the line in the
   display serif, one word lit at a time in #3f8f8c as it is spoken. That
   is the whole reason a person watches a muted clip to the end, so it is
   worth drawing ourselves.

   Captions are an addition. Every failure in here is silent and the film
   still plays. */
const CC_ACCENT = '#3f8f8c';
const CC_LINE   = 7;    /* words per line, broken on natural phrasing */

/* Words the machine hears but does not capitalise. Stream's transcription
   sentence-cases properly and then writes "actually on saturday the 26th
   september", which on a caption plate reads as a typo rather than as a
   transcript. Days, months and the names this business uses are the whole
   of the list: it corrects, it does not rewrite. */
const CC_PROPER = {};
('Monday Tuesday Wednesday Thursday Friday Saturday Sunday '
 +'January February March April May June July August September October November December '
 +'London England English British Elliott Suryava Tamzen OverGravity Shadwell '
 +'Instagram YouTube').split(' ').forEach(w=>{ CC_PROPER[w.toLowerCase()]=w; });
CC_PROPER['lha']='LHA';
function ccCase(w){
  /* keep whatever punctuation is hanging off the word, and use the name's
     own spelling: OverGravity is not Overgravity, which is what capitalising
     the first letter alone gave */
  const m=/^([^A-Za-z]*)([A-Za-z][A-Za-z'-]*)(.*)$/.exec(w);
  if(!m) return w;
  const fix=CC_PROPER[m[2].toLowerCase()];
  return fix ? m[1]+fix+m[3] : w;
}

/* Stream gives cue level timings, not word level, so a word's share of its
   line is taken from its length. Longer words take longer to say, which is
   crude and lands close enough that the highlight tracks the voice. */
function ccParse(text){
  const out=[];
  String(text||'').split(/\r?\n\r?\n/).forEach(block=>{
    const lines=block.split(/\r?\n/).filter(Boolean);
    const ti=lines.findIndex(l=>l.indexOf('-->')>-1);
    if(ti<0) return;
    const m=lines[ti].match(/(\d\d:\d\d:\d\d[.,]\d+)\s*-->\s*(\d\d:\d\d:\d\d[.,]\d+)/);
    if(!m) return;
    const secs=x=>{ const p=x.replace(',','.').split(':');
      return (+p[0])*3600+(+p[1])*60+parseFloat(p[2]); };
    const a=secs(m[1]), b=secs(m[2]);
    const raw=lines.slice(ti+1).join(' ').replace(/<[^>]*>/g,'').trim();
    const words=raw.split(/\s+/).filter(Boolean).map(ccCase);
    if(!words.length) return;

    /* Break on sentences first, then on seven words. Chunking straight to
       seven cut mid-sentence, so plate after plate opened on a lowercase
       word and read like a transcript with the tops sliced off. Sentences
       first means most plates start where a capital already is. */
    const groups=[]; let cur=[];
    words.forEach(w=>{ cur.push(w);
      if(/[.!?]["')\]]?$/.test(w)){ groups.push(cur); cur=[]; } });
    if(cur.length) groups.push(cur);

    const chunks=[];
    groups.forEach((g,gi)=>{
      for(let i=0;i<g.length;i+=CC_LINE)
        chunks.push({w:g.slice(i,i+CC_LINE), starts: i===0});
    });

    /* Stream cases its output properly, so a capital is only added where
       one is missing at the start of a sentence: a plate that opens
       mid-sentence keeps its lower case, which is what it should have. */
    const upper = x => x.charAt(0).toUpperCase()+x.slice(1);
    const shouted = !/[a-z]/.test(raw), whispered = !/[A-Z]/.test(raw);
    let seen=0;
    chunks.forEach(c=>{
      const n0=c.w.length;
      const share=n0/words.length;
      const from=a+(b-a)*(seen/words.length), to=from+(b-a)*share;
      seen+=n0;
      /* a cue with no capital anywhere is an engine that gave up on case;
         give it a sentence capital rather than leave it looking broken */
      if((c.starts || whispered) && !shouted) c.w=[upper(c.w[0])].concat(c.w.slice(1));
      const weight=c.w.reduce((t,w)=>t+w.length+1,0);
      let run=0;
      out.push({a:from, b:to, w:c.w.map(w=>{
        const at=from+(to-from)*(run/weight); run+=w.length+1; return {t:at, x:w};
      })});
    });
  });
  return out;
}

function ccDraw(v, cues){
  const host=v.parentElement; if(!host) return;
  const el=ccPlate();
  if(el.parentElement!==host){ host.style.position='relative'; host.appendChild(el); el.dataset.fit=''; }
  /* The plate is sized from the video, not from the viewport. Sized from the
     viewport it was the same height on a full screen vertical film and on a
     small explainer in a sheet, where it swallowed the picture.

     lives inside the last twenty per cent of the film's height. That is one
     budget covering the gap under it and the pill itself, so a two line cue
     still cannot climb into the picture. It was being broken twice, by a six
     per cent offset under a plate allowed a full fifth on its own, and again
     by the control bar this used to sit above. */
  const CC_BAND = 0.20, CC_GAP = 0.03;
  /* the smallest film the rule can be kept on: eighteen pixels of pill
     inside seventeen per cent of the height */
  const CC_MIN_H = Math.ceil(18/(CC_BAND-CC_GAP));
  /* offsetWidth and offsetHeight are the layout box and ignore transforms.
     getBoundingClientRect returns the painted box, which is swapped once the
     theatre rotates the film, so the plate decided a vertical film had gone
     horizontal the moment it was turned. */
  const rect=v.getBoundingClientRect();
  const box=(v.offsetWidth>40 && v.offsetHeight>40)
    ? {width:v.offsetWidth, height:v.offsetHeight} : rect;
  /* Below about a hundred pixels the smallest legible line will not fit
     inside the fifth, and the floor that keeps it readable would push the
     plate up into the picture. A film that small is a thumbnail: no plate
     rather than a plate that breaks the rule. */
  if(box.height>0 && box.height<CC_MIN_H){ el.style.opacity='0'; return; }
  if(box.height>40){
    const wide=box.width/box.height>1.2;
    const key=Math.round(box.width)+'x'+Math.round(box.height);
    /* the control bar sits at the foot of the film, so the plate has to
       start above it. In the theatre the bar is on the room instead and
       this finds nothing, which is the right answer there. */
    if(el.dataset.fit!==key){
      el.dataset.fit=key;
      /* the gap under the plate and the plate itself share the fifth */
      const gapPx = Math.round(box.height*CC_GAP);
      const roomPx = Math.max(18, Math.round(box.height*(CC_BAND-CC_GAP)));
      el.style.bottom = gapPx+'px';
      const row=el.firstChild;
      /* two lines plus the pill's own padding have to fit inside that room.
         line-height is 1.18 and the padding is one em all told, so the type
         can be at most a third of what is left. */
      const fromRoom = roomPx/3.4;
      row.style.fontSize=Math.max(9.5,
        Math.min(box.height*(wide?0.05:0.042), fromRoom, 22)).toFixed(1)+'px';
      row.style.maxHeight=roomPx+'px';
      row.style.overflow='hidden';
    }
  }
  const t=v.currentTime;
  const cue=cues.find(c=>t>=c.a-0.12 && t<=c.b+0.2);
  if(!cue || v.paused && !v.currentTime){ el.style.opacity='0'; return; }
  el.style.opacity='1';
  const row=el.firstChild;
  if(row.dataset.k!==String(cue.a)){
    row.dataset.k=String(cue.a);
    row.innerHTML=cue.w.map((w,i)=>`<span data-i="${i}" style="display:inline-block;
      color:rgba(255,255,255,.88);text-shadow:0 2px 10px rgba(0,0,0,.55);
      transition:color 120ms linear,transform 120ms ease-out;
      transform-origin:50% 70%">${esc(w.x)}</span>`).join('');
  }
  let active=-1;
  cue.w.forEach((w,i)=>{ if(t>=w.t) active=i; });
  [...row.children].forEach((sp,i)=>{
    const on=i===active;
    const want=on?CC_ACCENT:'rgba(255,255,255,.88)';
    if(sp.dataset.on!==String(on)){
      sp.dataset.on=String(on);
      sp.style.color=want;
      sp.style.transform=on?'scale(1.08)':'scale(1)';
      sp.style.textShadow=on
        ? '0 0 20px '+CC_ACCENT+'4d, 0 2px 10px rgba(0,0,0,.55)'
        : '0 2px 10px rgba(0,0,0,.55)';
      if(on) setTimeout(()=>{ if(sp.dataset.on==='true') sp.style.transform='scale(1)'; },240);
    }
  });
}

/* ── the in-app theatre ────────────────────────────────────────────
   Native fullscreen takes the <video> element and nothing else, so the
   caption plate, which is a sibling of it, is simply not on screen. The
   old answer was to hand over to a real text track for the duration,
   which works but puts the browser's own white box on screen in place of
   the design: a different typeface, a different colour, no lit word.

   So this does not use the Fullscreen API at all. It is a fixed layer,
   and the video is moved into it rather than copied, which means the
   plate travels with it and keeps drawing. It behaves the same on iOS,
   where an arbitrary element cannot be fullscreened anyway.

   Rotating is the other half. A horizontal film on an upright phone is
   the width of a stamp; turning it fills the screen without asking
   anyone to turn their phone over and fight the lock. */
let vpFrom=null, vpMark=null, vpTurn=0, vpHideT=null;

const VP_PLAY='<svg width="15" height="17" viewBox="0 0 17 19" fill="currentColor"><path d="M16 8.63a1 1 0 0 1 0 1.74L1.5 18.6A1 1 0 0 1 0 17.73V1.27A1 1 0 0 1 1.5.4z"/></svg>';
const VP_PAUSE='<svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor"><rect x="1" y="0" width="4" height="16" rx="1.4"/><rect x="9" y="0" width="4" height="16" rx="1.4"/></svg>';
const VP_EXPAND='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M16 21h5v-5"/><path d="M8 21H3v-5"/></svg>';
const VP_CLOSE='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>';
const VP_TURN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="10" rx="2"/><path d="M8 3.5l2-2 2 2"/><path d="M10 1.5A7.5 7.5 0 0 1 17 7"/></svg>';

const vpTime = s => { s=Math.max(0,Math.floor(s||0));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

/* the bar under a captioned film, in place of the browser's own controls.
   The browser's carry a fullscreen button, and that button is the whole
   problem this is here to avoid. */
function vpBar(v, theatre){
  const bar=document.createElement('div');
  bar.className='vp-bar';
  bar.dataset.theatre=theatre?'1':'';
  bar.innerHTML=
    '<button class="vp-btn" data-a="play" aria-label="Play"></button>'
   +'<span class="vp-t" data-a="now">0:00</span>'
   +'<div class="vp-track" data-a="track"><i></i></div>'
   +'<span class="vp-t" data-a="dur">0:00</span>'
   +(theatre?'<button class="vp-btn" data-a="turn" aria-label="Rotate">'+VP_TURN+'</button>':'')
   +'<button class="vp-btn" data-a="full" aria-label="'+(theatre?'Close':'Full screen')+'">'
   +(theatre?VP_CLOSE:VP_EXPAND)+'</button>';
  const q=a=>bar.querySelector('[data-a="'+a+'"]');
  const play=q('play'), now=q('now'), dur=q('dur'), track=q('track'), fill=track.firstChild;
  const paint=()=>{
    play.innerHTML = v.paused ? VP_PLAY : VP_PAUSE;
    play.setAttribute('aria-label', v.paused?'Play':'Pause');
    now.textContent=vpTime(v.currentTime);
    dur.textContent=vpTime(v.duration);
    fill.style.width=(v.duration?(v.currentTime/v.duration*100):0).toFixed(2)+'%';
  };
  play.onclick=e=>{ e.stopPropagation(); v.paused?v.play():v.pause(); paint(); };
  q('full').onclick=e=>{ e.stopPropagation(); theatre?vpClose():vpOpen(v); };
  if(theatre) q('turn').onclick=e=>{ e.stopPropagation(); vpRotate(); };
  /* scrub by pointer, so a drag works as well as a tap */
  const seek=ev=>{
    const r=track.getBoundingClientRect();
    const x=Math.max(0,Math.min(1,(ev.clientX-r.left)/Math.max(1,r.width)));
    if(v.duration) v.currentTime=x*v.duration;
    paint();
  };
  track.addEventListener('pointerdown',ev=>{ ev.stopPropagation();
    track.setPointerCapture(ev.pointerId); seek(ev); });
  track.addEventListener('pointermove',ev=>{ if(track.hasPointerCapture&&
    track.hasPointerCapture(ev.pointerId)) seek(ev); });
  ['timeupdate','play','pause','loadedmetadata','seeked','durationchange']
    .forEach(e=>v.addEventListener(e,paint));
  paint();
  return bar;
}

/* one call per captioned film, on the way in */
function vpBuild(v){
  if(!v || v.dataset.vp) return;
  const host=v.parentElement; if(!host) return;
  v.dataset.vp='1';
  v.removeAttribute('controls'); v.controls=false;
  v.setAttribute('playsinline','');
  host.classList.add('vp');
  const bar=vpBar(v,false);
  host.appendChild(bar);
  /* The captions live in the bottom fifth of the film, and so does this bar,
     so one of them has to move. The bar is the one nobody is reading: it
     fades out a couple of seconds into playback and comes back on a touch,
     a hover or a pause. Fading rather than removing, so nothing reflows and
     the plate never has to be measured twice. */
  let idle=null;
  const show=()=>{ bar.style.opacity='1'; bar.style.pointerEvents='auto';
    clearTimeout(idle);
    if(!v.paused) idle=setTimeout(()=>{
      bar.style.opacity='0'; bar.style.pointerEvents='none'; }, 2200);
  };
  ['pointerdown','pointermove','focusin'].forEach(e=>host.addEventListener(e, show));
  v.addEventListener('pause', show);
  v.addEventListener('play', show);
  v.addEventListener('ended', show);
  show();
  /* tapping the picture plays and pauses, which is what everyone tries */
  v.addEventListener('click',()=>{ v.paused?v.play():v.pause(); });
}

function vpTheatre(){
  let el=document.getElementById('theatre');
  if(el) return el;
  el=document.createElement('div');
  el.id='theatre';
  /* a room inside the layer. The stage and the controls live in it
     together, so turning the film turns the buttons with it rather than
     leaving them lying on their side under a picture that is not. */
  el.innerHTML='<div id="vpRoom"><div id="vpStage"></div></div>';
  el.addEventListener('click', ev=>{ if(ev.target===el) vpClose(); });
  document.body.appendChild(el);
  return el;
}
function vpOpen(v){
  if(vpFrom) return;
  const wrap=v.parentElement; if(!wrap) return;
  const t=vpTheatre(), stage=document.getElementById('vpStage');
  /* a placeholder of the same size, so the page underneath does not jump
     while the film is out of it */
  vpMark=document.createElement('div');
  vpMark.style.height=wrap.offsetHeight+'px';
  vpFrom={wrap, parent:wrap.parentElement, next:wrap.nextSibling,
          css:wrap.getAttribute('style')||'', at:v.currentTime, playing:!v.paused};
  vpFrom.parent.insertBefore(vpMark, wrap);
  stage.appendChild(wrap);
  wrap.setAttribute('style','position:relative;line-height:0;width:100%;max-width:100%');
  /* re-parenting a <video> drops playback in some browsers; put it back */
  try{ v.currentTime=vpFrom.at; }catch(e){}
  if(vpFrom.playing) v.play().catch(()=>{});
  const bar=wrap.querySelector('.vp-bar'); if(bar) bar.remove();
  /* the controls go on the room, not on the film. A three minute explainer
     is a 211px strip on a phone, and a bar pinned to the bottom of that
     strip lands exactly on top of the caption plate. */
  document.getElementById('vpRoom').appendChild(vpBar(v,true));
  vpTurn=0; vpFit();
  /* videoWidth is 0 until metadata lands, so a cold open would size to 16/9
     and then sit wrong for the rest of the film */
  v.addEventListener('loadedmetadata', vpFit);
  t.classList.add('on');
  document.body.style.overflow='hidden';
  document.addEventListener('keydown', vpKeys);
}
function vpClose(){
  if(!vpFrom) return;
  const {wrap,parent,next,css}=vpFrom;
  const v=wrap.querySelector('video');
  const at=v?v.currentTime:0, playing=v?!v.paused:false;
  const room=document.getElementById('vpRoom');
  const tbar=room&&room.querySelector(':scope > .vp-bar'); if(tbar) tbar.remove();
  wrap.style.transform=''; wrap.style.width=''; wrap.style.height='';
  wrap.setAttribute('style', css);
  parent.insertBefore(wrap, next || null);
  if(vpMark && vpMark.parentElement) vpMark.remove();
  wrap.appendChild(vpBar(v,false));
  if(v){ try{ v.currentTime=at; }catch(e){} if(playing) v.play().catch(()=>{}); }
  const t=document.getElementById('theatre'); if(t) t.classList.remove('on');
  document.body.style.overflow='';
  document.removeEventListener('keydown', vpKeys);
  vpFrom=null; vpMark=null; vpTurn=0;
}
function vpKeys(e){
  if(e.key==='Escape'){ vpClose(); return; }
  if(!vpFrom) return;
  const v=vpFrom.wrap.querySelector('video'); if(!v) return;
  if(e.key===' '){ e.preventDefault(); v.paused?v.play():v.pause(); }
  if(e.key==='ArrowRight') v.currentTime=Math.min(v.duration||0, v.currentTime+5);
  if(e.key==='ArrowLeft') v.currentTime=Math.max(0, v.currentTime-5);
}
function vpRotate(){ vpTurn=(vpTurn+90)%180; vpFit(); }
/* size the stage to whichever way round it is, so the film is as large as
   the screen allows and the plate, which is inside it, scales with it */
function vpFit(){
  if(!vpFrom) return;
  const wrap=vpFrom.wrap, v=wrap.querySelector('video');
  const turned=vpTurn===90;
  const W=window.innerWidth, H=window.innerHeight;
  /* the space available, in the orientation the film is being watched in */
  const availW=turned?H:W, availH=turned?W:H;
  const room=document.getElementById('vpRoom');
  if(room){
    room.style.width=availW+'px';
    room.style.height=availH+'px';
    room.style.transform=turned?'rotate(90deg)':'';
  }
  /* Fit the film's own shape into it rather than stretching the wrapper to
     the whole screen. The plate hangs off the bottom of the video box, so a
     letterboxed box means the line floats in the black well below the
     picture, which is exactly where nobody is looking. */
  const ar=(v && v.videoWidth && v.videoHeight) ? v.videoWidth/v.videoHeight : 16/9;
  /* leave the bar its own room at the foot rather than letting it sit on
     the picture, which on a wide film is where the captions are */
  const barH=68;
  let w=availW, h=Math.round(availW/ar);
  if(h>availH-barH){ h=availH-barH; w=Math.round(h*ar); }
  wrap.style.width=w+'px';
  wrap.style.height=h+'px';
  /* the room does the turning; the film only has to fit inside it */
  wrap.style.transform='';
  if(v){ v.style.width='100%'; v.style.height='100%'; v.style.objectFit='contain'; }
  /* the plate measures the video, so let it measure again */
  const el=document.getElementById('ccPlate'); if(el) el.dataset.fit='';
}
window.addEventListener('resize', ()=>{ if(vpFrom) vpFit(); });
window.addEventListener('orientationchange', ()=>{ if(vpFrom) setTimeout(vpFit,120); });

function attachCaptions(v, uid){
  if(!v || !uid || v.dataset.ccDone) return;
  v.dataset.ccDone='1';
  fetch(streamVtt(uid))
    .then(r=>r.ok?r.text():Promise.reject(r.status))
    .then(txt=>{
      const cues=ccParse(txt);
      if(!cues.length) return;

      /* This used to build a real text track and hand over to it whenever
         the film went native fullscreen, because fullscreen takes the
         <video> and nothing else and left the plate behind. It worked, and
         it put the browser's own white box on screen in place of the design:
         wrong face, wrong colour, no lit word. Expanding goes through the
         theatre now, which moves the whole wrapper and keeps the plate with
         it, so there is nothing to hand over to.

         A film can still reach native fullscreen from a context menu or a
         keyboard shortcut. The plate is hidden for the duration rather than
         drawn somewhere nobody can see it. */
      const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
      const inFs=()=>fsEl()===v || !!v.webkitDisplayingFullscreen;
      const sync=()=>{
        const el=document.getElementById('ccPlate');
        if(el && inFs()) el.style.opacity='0';
        if(!inFs()) ccDraw(v, cues);
      };
      ['fullscreenchange','webkitfullscreenchange'].forEach(e=>
        document.addEventListener(e, sync));
      ['webkitbeginfullscreen','webkitendfullscreen'].forEach(e=>
        v.addEventListener(e, sync));

      let raf=0;
      /* the follow-along replaces its <video> at every step, and a loop
         still running against the old one kept dragging the single plate
         back onto a node that is no longer on the page, so the caption on
         the drill you are actually doing disappeared */
      const tick=()=>{
        if(!v.isConnected){ cancelAnimationFrame(raf); raf=0; return; }
        if(!inFs()) ccDraw(v,cues);
        raf=requestAnimationFrame(tick);
      };
      const stop=()=>{ cancelAnimationFrame(raf); raf=0;
        const el=document.getElementById('ccPlate');
        if(el && el.parentElement===v.parentElement) el.style.opacity='0'; };
      v.addEventListener('play', ()=>{ if(!raf) tick(); });
      v.addEventListener('pause', stop);
      v.addEventListener('ended', stop);
      v.addEventListener('seeked', ()=>{ if(!inFs()) ccDraw(v,cues); });
      if(!v.paused) tick();
    })
    .catch(()=>{});
}
/* every explainer video on the page, whenever one is drawn */
function mountCaptions(){
  document.querySelectorAll('video[data-cc]').forEach(v=>{
    /* the player first and unconditionally: a film whose captions fail to
       load still needs controls, and the browser's own carry the fullscreen
       button this exists to replace */
    vpBuild(v);
    attachCaptions(v, v.getAttribute('data-cc'));
  });
}
/* The plate is positioned against the video's own box, so every captioned
   video gets a wrapper that is exactly the video and nothing else. Dropped
   into the card directly it measured against the card and the line floated
   somewhere under the film. */
const ccWrap = (inner, extra) =>
  `<div style="position:relative;line-height:0;${extra||''}">${inner}</div>`;
function qaVideo(a, full){
  const src = a.uid ? streamMp4(a.uid) : (a.v ? EXPLAINERS+encodeURIComponent(a.v) : '');
  if(!src) return '';
  setTimeout(mountCaptions,0);
  /* full: most of the screen, whichever way the film was shot */
  return ccWrap(`<video src="${src}" controls playsinline preload="${full?'metadata':'none'}"
    ${a.uid?`poster="${streamThumb(a.uid)}" data-cc="${esc(a.uid)}"`:''}
    style="width:100%;${full?'max-height:64vh;object-fit:contain;':'border-radius:14px;'}background:#11150f;display:block"></video>`,
    full ? 'background:#11150f' : 'margin-top:11px;border-radius:14px;overflow:hidden');
}

function screenPlan(){

  const total=allItems(d).length;
  const ticked=d.groups.reduce((a,g,gi)=>a+g.items.filter((_,ii)=>st.tick[key(st.day,gi,ii)]).length,0);

            ${flagged?`<div style="margin-top:12px;background:#faf0ed;border:1px solid rgba(164,80,60,.22);

              <input value="${esc(st.note[it.v]||'')}" oninput="st.note['${it.v}']=this.value;save()"
