let tourStep = 0, tourKey = null, tourBound = false;

const tourSeen = () => (st.tourSeen && st.tourSeen.v === TOUR_V) ? st.tourSeen : {v:TOUR_V};
function markTourSeen(key){
  const seen = tourSeen(); seen[key] = 1;
  st.tourSeen = seen; save();
}
/* steps that open something rather than pointing at part of a screen. They
   have no data-tour anywhere, so they must not be filtered out as missing. */
const TOUR_VIRTUAL = ['modesheet','followalong','drilllist'];
/* ── on the home screen ────────────────────────────────────────────
   This is a progressive web app and nothing ever said so. Opened from a
   browser tab it loses the full screen, the icon and half the reason it
   works offline, and most people will never think to install a website.

   Chrome hands us the install prompt and we hold on to it. Safari does
   not, and never will, so there it is the instructions or nothing. */
let installPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installPrompt=e; });
window.addEventListener('appinstalled', ()=>{ installPrompt=null; st.installed=true; save(); track('install'); });
const isStandalone = () => {
  try{ return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone===true; }catch(e){ return false; }
};
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent)
  || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function canInstall(){ return !isStandalone(); }
function installCopy(){
  if(installPrompt) return 'Chrome can do it in one tap. Next puts it on your '+
    'home screen, where it opens full screen and works without signal.';
  if(isIOS()) return 'Tap the share button at the bottom of Safari, then Add to '+
    'Home Screen. It opens full screen from there, and the sessions work without signal.';
  return 'Open your browser menu and choose Install, or Add to Home Screen. It opens '+
    'full screen from there, and the sessions work without signal.';
}
function doInstall(){
  if(!installPrompt) return false;
  const p=installPrompt; installPrompt=null;
  try{ p.prompt(); p.userChoice.then(r=>{ if(r&&r.outcome==='accepted'){ st.installed=true; save(); } }); }
  catch(e){ return false; }
  return true;
}
/* Worked out once, when the tour starts, and then left alone. Recomputing
   it against the live DOM meant a step that changed the screen shrank the
   list under its own feet: the index ran off the end and the tour stalled
   on the previous card. */
let tourList = [];
function tourSteps(){ return tourList; }
function buildTourList(key){
  const def = TOURS[key];
  if(!def) return [];
  return def.steps.filter(x =>
    (!x.when || x.when()) &&
    (x.always || TOUR_VIRTUAL.indexOf(x.t) > -1 || document.querySelector('[data-tour="'+x.t+'"]')));
}
function startTour(key){
  tourKey = key || (coachedView() ? 'today' : 'home');
  tourStep = 0;
  tourList = buildTourList(tourKey);
  if(!TOURS[tourKey] || !tourList.length){ tourKey=null; tourList=[]; return; }
  if(!tourBound){
    tourBound = true;
    window.addEventListener('resize', ()=>{ if(tourKey) paintTour(); });
  }
  drawTour();
}
function endTour(){
  const was = tourKey;
  tourKey = null; tourList = [];
  if(was) markTourSeen(was);
  tourLeaveMode();
  const el = document.getElementById('tour'); if(el) el.remove();
  document.body.style.overflow = '';
}
/* offered, not forced: the next tab's tour is a choice at the end of this
   one, and it runs on its own the first time that tab is opened anyway */
function tourFinish(){
  const def = TOURS[tourKey];
  const nxt = def && def.next;
  const seen = tourSeen();
  if(nxt && TOURS[nxt] && !seen[nxt] && (nxt!=='ladder' || !coachedView())){
    markTourSeen(tourKey);
    tourKey = null; tourList = [];
    return offerNext(nxt);
  }
  endTour();
}
function offerNext(nxt){
  document.body.style.overflow='hidden';
  let box=document.getElementById('tour');
  if(!box){ box=document.createElement('div'); box.id='tour';
    box.style.cssText='position:fixed;inset:0;z-index:1000'; document.body.appendChild(box); }
  box.dataset.built = '';
  box.innerHTML =
    `<div style="position:absolute;inset:0;background:rgba(0,42,40,.62);
       backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)"></div>
     <div class="tour-card" style="bottom:24px">
       <div class="tour-h">That is this screen</div>
       <div class="tour-b">Want the same for ${esc(TOURS[nxt].n)}? It only takes a moment, and it
         will show itself the first time you open that tab anyway.</div>
       <div style="display:flex;align-items:center;gap:9px;margin-top:15px">
         <button onclick="endTour()" class="tour-skip">No thanks</button>
         <span style="flex:1"></span>
         <button onclick="tourJump('${nxt}')" class="tour-go">Show me ${esc(TOURS[nxt].n)}</button>
       </div>
     </div>`;
}
function tourJump(key){
  const el=document.getElementById('tour'); if(el) el.remove();
  document.body.style.overflow='';
  go(key==='today'||key==='home' ? key : key);
  setTimeout(()=>startTour(key), 420);
}
function tourNext(){
  const steps = tourSteps(), step = steps[tourStep];
  /* a step can do something on the way out. The install step fires the
     browser's own prompt, which only Chrome gives us and which must be
     called from inside the tap that asked for it. */
  if(step && step.go){ try{ step.go(); }catch(e){} }
  if(tourStep >= steps.length - 1) return tourFinish();
  tourStep++; drawTour();
}
function tourBack(){ if(tourStep>0){ tourStep--; drawTour(); } }

function drawTour(){
  const steps = tourSteps(), step = steps[tourStep];
  if(!step) return tourFinish();
  if(step.pre){ try{ step.pre(); }catch(e){} }
  const el = tourTarget(step);
  if(!el) return tourNext();

  document.body.style.overflow = 'hidden';
  const scroller = el.closest('.scroll');
  if(scroller){
    const r0 = el.getBoundingClientRect(), s0 = scroller.getBoundingClientRect();
    if(r0.top < s0.top + 70 || r0.bottom > s0.bottom - 220){
      scroller.scrollTop += (r0.top - s0.top) - 90;
    }
  }
  /* Paint straight away rather than waiting on a frame. requestAnimationFrame
     is throttled when the page is not being painted, and a tutorial that
     freezes on step two is worse than no tutorial. The repaints afterwards
     catch the scroll and any sheet settling. */
  paintTour();
  setTimeout(paintTour, 140);
  setTimeout(paintTour, 380);
}
/* the mode sheet is not part of a screen, so it is found by its own hook */
function tourTarget(step){
  if(step.t==='modesheet' || step.t==='drilllist')
    return document.querySelector('#ov .sheet') || document.getElementById('ov');
  if(step.t==='followalong') return document.getElementById('player') || document.body;
  return document.querySelector('[data-tour="'+step.t+'"]');
}
/* Leaving the demonstrated follow-along must not log a session or ask why
   they stopped. Nothing was trained, it was a picture of the screen. */
function tourLeaveMode(){
  try{ if(typeof tick_!=='undefined' && tick_){ clearInterval(tick_); tick_=null; } }catch(e){}
  document.querySelectorAll('#player video').forEach(v=>{ try{ v.pause(); }catch(e){} });
  const pl=document.getElementById('player');
  if(pl){ pl.classList.remove('on'); pl.innerHTML=''; }
  if(st.ov) closeOv();
}
/* Built once, then only moved and retyped. Rebuilding innerHTML on every
   repaint restarted the entrance animation, and paintTour runs three times
   a step to catch the scroll settling, so each step flickered three times. */
function tourDom(){
  let box = document.getElementById('tour');
  if(box && box.dataset.built === '1') return box;
  if(!box){
    box = document.createElement('div');
    box.id = 'tour';
    box.style.cssText = 'position:fixed;inset:0;z-index:1000';
    document.body.appendChild(box);
  }
  box.innerHTML =
    `<div class="tour-hole" id="tourHole" onclick="tourNext()"></div>
     <div class="tour-card" id="tourCard">
       <div class="tour-kick" id="tourKick"></div>
       <div class="tour-h" id="tourH"></div>
       <div class="tour-b" id="tourB"></div>
       <div class="tour-dots" id="tourDots"></div>
       <div style="display:flex;align-items:center;gap:9px;margin-top:13px">
         <button onclick="endTour()" class="tour-skip">Skip</button>
         <span style="flex:1"></span>
         <button onclick="tourBack()" class="tour-back" id="tourBackBtn">Back</button>
         <button onclick="tourNext()" class="tour-go" id="tourGoBtn">Next</button>
       </div>
     </div>`;
  box.dataset.built = '1';
  box.dataset.step = '';
  return box;
}
function paintTour(){
  const steps = tourSteps(), step = steps[tourStep];
  if(!tourKey || !step) return;
  const el = tourTarget(step);
  if(!el) return;

  const box = tourDom();
  const hole = document.getElementById('tourHole');
  const card = document.getElementById('tourCard');
  const r = el.getBoundingClientRect();
  const pad = 6;
  const top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
  const w = Math.min(window.innerWidth - 8, r.width + pad*2);
  const h = Math.min(window.innerHeight - 8, r.height + pad*2);
  const below = top + h + 210 < window.innerHeight;
  const cardTop = below ? top + h + 12 : Math.max(10, Math.min(top - 218, window.innerHeight - 236));

  /* the hole and the card slide; CSS transitions carry them */
  hole.style.top = top + 'px';
  hole.style.left = left + 'px';
  hole.style.width = w + 'px';
  hole.style.height = h + 'px';
  card.style.top = cardTop + 'px';
  card.style.bottom = 'auto';

  const n = tourStep + 1, of = steps.length;
  const def = TOURS[tourKey]||{};
  const id = tourKey + ':' + tourStep;
  if(box.dataset.step === id) return;      /* same step, only the position moved */
  box.dataset.step = id;

  document.getElementById('tourKick').textContent =
    (def.n||'').toUpperCase() + ' · STEP ' + n + ' OF ' + of;
  document.getElementById('tourH').textContent = step.h;
  document.getElementById('tourB').textContent =
    (typeof step.b==='function') ? step.b() : step.b;
  document.getElementById('tourGoBtn').textContent =
    (step.go && installPrompt) ? 'Add it' : (n===of) ? 'Done' : 'Next';
  document.getElementById('tourBackBtn').style.display = tourStep ? '' : 'none';

  const dots = document.getElementById('tourDots');
  if(dots.children.length !== of){
    dots.innerHTML = steps.map(()=>'<i></i>').join('');
  }
  for(let i=0;i<dots.children.length;i++) dots.children[i].classList.toggle('on', i===tourStep);

  /* one short fade on the words, rather than the whole card arriving again */
  card.classList.remove('is-swap');
  void card.offsetWidth;
  card.classList.add('is-swap');
}

/* the screen moved out from under a running tour, so stop pointing at
   things that are no longer there. Not marked as seen: it never finished. */
function abortTour(){
  tourKey = null; tourList = [];
  tourLeaveMode();
  const el = document.getElementById('tour'); if(el) el.remove();
  document.body.style.overflow = '';
}
/* first visit to a tab, and only once whatever it points at is on show */
function maybeTour(){
  if(tourKey && st.tab !== tourKey) abortTour();
  if(tourKey || st.ov || document.getElementById('tour')) return;
  const key = st.tab==='today' ? 'today' : st.tab;
  if(!TOURS[key] || tourSeen()[key]) return;
  setTimeout(()=>{
    if(!tourKey && !st.ov && st.tab===(key==='today'?'today':key)) startTour(key);
  }, 700);
}

function render(){
  /* a sheet covers the page. Redrawing underneath it costs a flash and buys
     nothing — closeOv renders on the way out. */
  if(st.ov && $('#ov') && $('#ov').classList.contains('on')){ renderPending=true; return; }
  renderPending=false;
  const app=$('#app');
  /* swapping innerHTML throws the scroll container back to the top, which
     reads as the page jumping to the top mid-tap. Put it back whenever we
     are redrawing the screen the reader is already on. */
  const was=app.querySelector('.scroll');
  const keepTop=(was && app.dataset.screen===st.tab) ? was.scrollTop : 0;
  const same = app.dataset.screen===st.tab;
  const swap=html=>{
    /* redrawing the screen you are already on is a state change, not an
       arrival — entrance animations replaying on every tap is what made it
       feel choppy. */
    app.dataset.still = same ? '1' : '';
    app.innerHTML=html; app.dataset.screen=st.tab;
    const now=app.querySelector('.scroll'); if(now && keepTop) now.scrollTop=keepTop;
    /* There used to be a requestAnimationFrame here setting still='1' straight
       after an arrival, which killed the entrance animation about sixteen
       milliseconds into its seven hundred: nothing on any screen has animated
       in for months. It is not needed. The next render works out "same" from
       dataset.screen, which the line above has already updated, so a re-render
       of this screen suppresses itself without help. */
  };
  /* accent tells you which product you are in without reading a word:
     sand for the free ladder, amber for coached */
  document.documentElement.style.setProperty('--accent', st.in?'var(--amber)':'var(--sand)');
  document.body.dataset.tier = st.in?'coached':'free';
  if(st.tab==='reset'){ swap(screenReset()); return; }
  if(st.tab==='signin' && !st.in){ swap(screenSignIn()); return; }
  if(!st.mode && !st.in){ swap(screenWelcome()); return; }
  /* Reloading part-way through the intake used to land on Today with half a
     profile filled in and the level question never answered, because resuming
     the quiz was conditional on the tab still being 'quiz'. It is not the tab
     that decides this, it is whether the quiz is finished. */
  if(st.mode==='free' && !st.in && !st.quizDone){ st.tab='quiz'; swap(screenQuiz()); return; }
  /* shown once, between finishing the quiz and the ladder */
  if(st.quizDone && !st.oriented && !st.in && st.intake && st.intake.level!=null){
    swap(screenOriented()); return; }
  if(st.tab==='joinFree' && !st.in){ swap(screenJoin()); return; }
  /* ── one workout first, then the address ─────────────────────────
     The quiz used to hand straight over to a sign-up form, so a stranger
     who had answered three questions honestly was asked for an email
     before the app had done a single thing for them. They get a whole
     session first now. The ask comes when they go back for a second one,
     which is the first moment there is anything worth keeping. */
  if(!st.in && st.quizDone && !st.email && !st.joinSkipped && freeSessionsUsed()>=FREE_NO_ACCOUNT){
    swap(screenJoin()); return; }
  const coached=coachedView();
  /* a fix asked for in the link opens once the list has arrived */
  if(st.fixPending && (st.fixes||{})[st.fixPending]){
    st.fixSlug=st.fixPending; delete st.fixPending; st.tab='fix'; save(); }
  const screens=coached
    ? {today:screenToday,plan:screenPlan,progress:screenProgress,ask:screenAsk,more:screenMore,fix:screenFix}
    : {home:screenHome,ladder:screenLadder,coaching:screenCoaching,more:screenMore,fix:screenFix};
  /* Progress moved inside the ladder. Anyone whose last tab was Progress
     should land on it rather than being dropped back on Today. */
  if(!coached && st.tab==='progress'){ st.tab='ladder'; st.ladderTab='progress'; save(); }
  const tabs=TABS[coached?'coached':'free'].map(([id,l])=>
    (id==='coaching') ? [id, coachTabLabel()] : [id,l]);
  if(!screens[st.tab]) st.tab=tabs[0][0];
  const nCp = ((typeof cpNew==='function') ? cpNew().length : 0)
            + ((typeof clipsNew==='function') ? clipsNew() : 0);
  const bar=tabs.map(([id,l])=>`<button class="tab ${st.tab===id?'on':''}" onclick="go('${id}')"
    aria-label="${esc(l)}" aria-current="${st.tab===id?'page':'false'}"><i></i><span>${l}</span>${
    ((id==='coaching'||id==='ask')&&hasNew())
      ?`<b style="position:absolute;top:3px;left:50%;margin-left:9px;min-width:17px;height:17px;padding:0 5px;
      border-radius:999px;background:var(--amber);color:var(--ink);display:grid;place-items:center;
      font:700 10px/1 var(--sans)">${newCount()}</b>`
    : (((id==='progress'||(id==='ladder'&&!coached))&&nCp)
      ?`<b style="position:absolute;top:6px;left:50%;margin-left:14px;width:7px;height:7px;
      border-radius:99px;background:var(--amber)"></b>`:'')}</button>`).join('');
  swap((st.preview?`<div style="position:fixed;top:0;left:0;right:0;z-index:2000;
      background:#a4503c;color:#fff;text-align:center;padding:5px 10px;
      font:700 10px/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;
      pointer-events:none">Preview &middot; ${esc(st.client||st.email||'client')} &middot; read only</div>`:'')
    +topBar()+screens[st.tab]()+`<nav class="tabbar" data-tour="tabs">${bar}</nav>`);
  /* every film in the app carries the same caption plate. Individual mounts
     called this themselves and one of them always forgot, so it runs after
     any redraw instead: attachCaptions marks what it has done and a second
     call over the same video is free. */
  mountCaptions();
  coRest();
  watchScroll();
  watchPull();
  lazyThumbs();
  if(menuOpen) paintMenu();
  if(!st.preview) maybeTour();
}
document.addEventListener('DOMContentLoaded',function(){
  /* cache first so a signed-in client sees their plan instantly, then
     refresh in the background in case it changed since last time */
  if(st.in && st.token) loadCachedProgramme();
  rollTicks();
  render();
  trackOpen();
  if(st.token){ loadEntitlement(); loadSubmissions(); loadQuestions(); codeResume(); setTimeout(loadSign, 800); }
  /* the quiz placed them on a paid stage: show it, with the free week on it */
  if(st.openWallFor!=null && STAGES[st.openWallFor]){
    const w=st.openWallFor; delete st.openWallFor; save();
    setTimeout(()=>{ if(!st.ov){ st.ovStage=w; openOv('stage'); } }, 500);
  }
  loadLadder();
  loadFixes();
  loadPlans();
  workshopWatch();
  if(st.fbPending){ delete st.fbPending; save(); setTimeout(()=>{ if(st.in||st.token) openOv('feedback'); }, 900); }
  /* The track holds every check point reading and the coach's verdict on
     each clip, and the thread holds what he has said. Neither was loaded on
     a cold start: they were fetched only at the moment of signing in, so
     from the second open onwards the app showed whatever was in local
     storage from the last time somebody happened to sign in. A verdict
     written yesterday did not exist until they signed out and back in. */
  if(st.token){ loadTrack(); loadThread(); }
  if(st.in && st.token){ loadProgramme(); loadProgress(); }
  /* Elliott's reply landed in the thread and nothing went to fetch it: a
     free account loaded the chat only when it tapped the coaching tab, so
     the answer to a form check sat on the server with no dot anywhere.
     Every ten seconds while the chat is open, so a reply lands while they
     are looking at it; once a minute elsewhere, for the dot; nothing while
     the tab is hidden. */
  let lastPoll=0;
  setInterval(()=>{
    if(!st.token || document.hidden || st.preview) return;
    const onChat = st.tab==='ask' || (st.tab==='coaching' && coTab()==='chat');
    if(!onChat && Date.now()-lastPoll<60000) return;
    lastPoll=Date.now(); loadThread(); loadSubmissions();
  },10000);
  /* An open is a person opening the app, not a tab waking up. Wait for a
     real interaction before reporting one, and report how long they stayed
     when they leave. */
  if(st.token) watchVisit();
  /* a phone left open overnight never reloads, so the new day arrives while
     the app is in the background */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) return;
    const before=st.tickDay;
    rollTicks();
    if(st.tickDay!==before) render();
  });
  /* ── offline ──────────────────────────────────────────────────────
     sw.js has existed for months, with its cache version dutifully
     bumped on every deploy, and nothing ever registered it. Only the
     retired handstand-ladder-app.html had the two lines that turn it on,
     so the landing page's "it works offline" and the More tab's "the
     sessions work without signal" were both false: no worker, no caches,
     and a gym with no signal got a browser error.
     The worker is network-first for the shell, so an updated app still
     arrives immediately; the cache is only reached when the network
     cannot be. */
  if('serviceWorker' in navigator
     && (location.protocol==='https:' || location.hostname==='localhost')){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  }
});
render();
</script>
<div id="player"></div>
<div id="ov" class="ov s" onclick="ovScrim(event)"></div>
<div id="menu" class="menu s" onclick="menuScrim(event)"></div>
</body></html>
