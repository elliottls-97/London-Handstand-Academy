const PURPOSE={'Warm-up':'Wrists and shoulders','Entries — build to 6':'The position, every time',
 'Shape changes':'Awareness while upside down','Tuck':'This is press training',
 'Press walks':'Do these differently to normal','Strength':'At the end, when warm',
 'Mobility':'When you are warm','Floats and press walks':'The press pattern at floor level'};
const WHY={'Warm-up':'Four minutes so the first entry is not the warm-up. Wrists get loaded hard today.',
 'Entries — build to 6':'Entries are to practise entering the correct position every single time. Get fully into it, but do not make more than one adjustment before coming back down.',
 'Shape changes':'The key thing that made my handstand consistent. The wall holds the balance so you can feel the shape, then one freestanding set on top.',
 'Tuck':'The tuck handstand is press training in disguise. Hands close, push through the shoulders instead of widening. Less depth is fine.',
 'Press walks':'I want these done slightly differently to normal to get a lot more out of them, and the explainer is the whole drill.',
 'Strength':'Strength last so it never eats into the balance work.',
 'Mobility':'At the end, when you are warm.',
 'Floats and press walks':'The press pattern at floor level, the same shift of weight with no handstand needed.'};
/* Hannah's programme was written with a dash in a block name, and the
   copy here is keyed by that name. Match on the words rather than the
   punctuation so renaming the block in the spec cannot silently drop the
   explanation off her screen. */
const dashless=n=>String(n||'').replace(/\s*[—–]\s*/g,' ').replace(/\s+/g,' ').trim();
const byName=(map,n)=>{ if(map[n]) return map[n];
  const k=dashless(n); for(const x in map) if(dashless(x)===k) return map[x]; return null; };
const purpose=n=>byName(PURPOSE,n)||'Why this is here';
const why=n=>byName(WHY,n)||'';
/* The chip offered an explainer for every block. It only earns its place
   when there is actually a video to show, so it now checks the client's
   own answers for one before appearing. */
function whyVideo(n){
  /* the block's prose lives in WHY; which explainer belongs to it lives in
     the plan, as a question that matches one of their answers */
  const q=((DATA.why||{})[n]||'').trim();
  if(!q) return null;
  return (DATA.answers||[]).find(x=>x && x.v && String(x.q||'').trim()===q) || null;
}

/* ── Progress ── */
/* ── activity, from what is already recorded ───────────────────────
   opens[] is one ISO date per active day, kept for 180 days. sessions[]
   holds up to 200, each with planned and actual minutes. Neither needed
   any new instrumentation — the app has been collecting both all along
   and showing three numbers. */
function dayKey(d){ return new Date(d).toISOString().slice(0,10); }

/* ── how much, and how long ────────────────────────────────────────
   Everything below reads what the account already holds. Nothing new is
   asked of the person and nothing is estimated: a session carries its
   drill rows, a row carries what one set asked for and how many sets were
   finished, and a visit carries how long the app was open.

   Reps and seconds are counted apart all the way through. Adding a
   thirty second hold to ten shoulder taps gives forty of nothing. */
const MONDAY = t => { const d=new Date(t); const w=(d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-w); return d.getTime(); };

/* a row's unit, falling back to the programme for rows logged before the
   unit was carried */
function rowUnit(it){
  if(it && (it.unit==='s'||it.unit==='')) return it.unit;
  const p=(typeof prescribedFor==='function' && it && it.v) ? prescribedFor(it.v) : null;
  return (p && p.unit) || '';
}
function volumeBetween(from, to){
  const ss=((st.prog&&st.prog.sessions)||[])
    .filter(s=>s && (s.at||0)>=from && (s.at||0)<(to||Infinity));
  let reps=0, secs=0, sets=0, mins=0;
  const drills=new Set();
  ss.forEach(s=>{
    mins += Number(s.actual)||Number(s.mins)||0;
    (s.items||[]).forEach(it=>{
      const n=Number(it.reps)||0;
      sets += Number(it.got)||0;
      if(it.v && (Number(it.got)||0)) drills.add(it.v);
      if(!n) return;
      if(rowUnit(it)==='s') secs+=n; else reps+=n;
    });
  });
  return {reps, secs, sets, mins, drills:drills.size, sessions:ss.length};
}
const volumeSince = from => volumeBetween(from, null);

/* time in the app, from the per-day visit record the server keeps */
function appTimeBetween(from, to){
  const v=(st.prog&&st.prog.visits)||{};
  let ms=0, opens=0, days=0;
  Object.keys(v).forEach(k=>{
    const t=new Date(k+'T12:00:00').getTime();
    if(t<from || (to && t>=to)) return;
    const d=v[k]||{}; ms+=Number(d.ms)||0; opens+=Number(d.n)||0; days++;
  });
  return {ms, opens, days};
}
/* eight weeks of both, newest last, for the bars */
function weeklySeries(n){
  const thisWeek=MONDAY(Date.now()), out=[];
  for(let i=n-1;i>=0;i--){
    const from=thisWeek-i*7*864e5, to=from+7*864e5;
    const v=volumeBetween(from,to), a=appTimeBetween(from,to);
    out.push({from, reps:v.reps, secs:v.secs, mins:v.mins, sets:v.sets,
      sessions:v.sessions, appMs:a.ms, opens:a.opens});
  }
  return out;
}
/* "1h 20m", "20m", "40s": a duration nobody has to divide in their head */
function hm(ms){
  const m=Math.round((ms||0)/60000);
  if(m<1) return ms>0 ? 'under a minute' : '0m';
  if(m<60) return m+'m';
  return Math.floor(m/60)+'h '+(m%60?(m%60)+'m':'');
}
function mmss(secs){
  const s=Math.round(secs||0);
  if(s<60) return s+'s';
  const m=Math.floor(s/60);
  return m+'m'+(s%60?' '+(s%60)+'s':'');
}

function panelMonth(p){
  const opens=new Set(((p&&p.opens)||[]));
  const today=new Date(); today.setHours(12,0,0,0);
  /* start on the Monday 4 weeks back so the columns line up under M-S */
  const start=new Date(today); start.setDate(start.getDate()-27);
  start.setDate(start.getDate()-((start.getDay()+6)%7));
  const cells=[]; let active=0, prior=0;
  const d=new Date(start);
  while(d<=today || cells.length%7){
    const k=dayKey(d), on=opens.has(k), future=d>today;
    if(on) active++;
    cells.push(`<div style="aspect-ratio:1;display:grid;place-items:center">
      <span style="width:29px;height:29px;border-radius:999px;display:grid;place-items:center;
        font:${on?'700':'400'} 12px/1 var(--sans);
        background:${on?'var(--forest)':'transparent'};
        color:${on?'var(--bg)':future?'#c9c4be':'var(--grey2)'}">${d.getDate()}</span></div>`);
    d.setDate(d.getDate()+1);
    if(cells.length>42) break;
  }
  const cut=dayKey(new Date(Date.now()-28*864e5));
  const cut2=dayKey(new Date(Date.now()-56*864e5));
  opens.forEach(k=>{ if(k<cut && k>=cut2) prior++; });
  const delta=active-prior;
  const head=['M','T','W','T','F','S','S'].map(x=>
    `<div style="text-align:center;font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${x}</div>`).join('');
  return `<div class="card"><div class="kick2">PAST 4 WEEKS</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:14px 0 6px">${head}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells.join('')}</div>
    <div style="display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(28,32,25,.08)">
      ${[['Active days',String(active),''],
         ['vs prior 4wk',(delta>0?'+':'')+delta, delta>0?'var(--forest)':delta<0?'var(--amber)':''],
        ].map(([n,v,c])=>`<div style="flex:1">
        <div style="font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${n.toUpperCase()}</div>
        <div class="h-sm" style="font-size:19px;margin-top:5px;${c?'color:'+c:''}">${v}</div></div>`).join('')}
    </div></div>`;
}

/* NOT MOUNTED. The coached week-of-bars, replaced by volumeHero and the

function panelWeek(p){
  const ss=((p&&p.sessions)||[]).filter(x=>x&&x.at);
  const now=new Date(); now.setHours(23,59,59,999);
  const mins=[], labels=[];
  let thisWk=0, lastWk=0, drills=0, drillsLast=0;
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    const m=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.actual||x.mins||0),0);
    mins.push(m); thisWk+=m;
    drills+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.drills||0),0);
    labels.push(i===0?'TOD':['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]);
  }
  for(let i=13;i>=7;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    lastWk+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.actual||x.mins||0),0);
    drillsLast+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.drills||0),0);
  }
  const peak=Math.max(30,...mins);
  const bars=mins.map((m,i)=>`<div style="flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:flex-end;gap:7px">
    <div style="width:100%;height:78px;display:flex;align-items:flex-end">
      <div title="${m} min" style="width:100%;border-radius:6px 6px 3px 3px;
        height:${Math.max(m?7:3,Math.round(m/peak*78))}px;
        background:${m?(i===6?'var(--forest)':'var(--sage)'):'rgba(28,32,25,.07)'}"></div></div>
    <span style="font:600 9px/1 var(--sans);letter-spacing:.06em;
      color:${i===6?'var(--forest)':'var(--grey2)'}">${labels[i]}</span></div>`).join('');
  const dm=thisWk-lastWk, dd=drills-drillsLast;
  const hrs=n=>n>=60?(n/60).toFixed(1)+'h':n+'m';
  return `<div class="card"><div class="kick2">THIS WEEK</div>
    <div style="display:flex;gap:5px;align-items:flex-end;margin-top:16px">${bars}</div>
    <div style="display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(28,32,25,.08)">
      ${[['Time',hrs(thisWk)],['Drills',String(drills)],
         ['vs last week',(dm>0?'+':'')+hrs(Math.abs(dm)).replace('-','')+' · '+(dd>0?'+':'')+dd]]
        .map(([n,v])=>`<div style="flex:1">
        <div style="font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${n.toUpperCase()}</div>
        <div class="h-sm" style="font-size:19px;margin-top:5px">${v}</div></div>`).join('')}
    </div>
    ${thisWk?'':`<div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:12px">
      Nothing logged this week yet. Finish a session and it turns up here.</div>`}
    <button class="btn2" style="width:100%;margin-top:12px" onclick="logByHand()">${
      trainedToday()?'Log another session today':'I trained today, log it'}</button></div>`;
}

/* ── the free ladder's own progress ────────────────────────────────
   A ladder client is working on one stage, so this answers that: how
   much of it can you do, are you doing more of it than last week, and
   is the hold going up. The block-shaped stuff below is coached work
   and means nothing here. */
function weeksBack(n){
  const out=[], now=new Date();
  const mon=new Date(now); mon.setHours(0,0,0,0);
  mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  for(let i=n-1;i>=0;i--){
    const a=new Date(mon); a.setDate(mon.getDate()-i*7);
    const b=new Date(a);   b.setDate(a.getDate()+7);
    out.push({from:+a, to:+b, label:i===0?'This':(i===1?'Last':i+'w')});
  }
  return out;
}

function freeProgressBody(){
  const S=STAGES[curStage()]||STAGES[0];

  /* week on week, counted off the sessions the account holds */
  const sess=sessionsDone();
  const wk=weeksBack(8).map(w=>Object.assign(w,{
    n:sess.filter(x=>x.at>=w.from&&x.at<w.to).length }));
  const peak=Math.max(1,...wk.map(w=>w.n));
  const target=weekTarget();

/* ── tracking ──────────────────────────────────────────────────────
   Three things a handstand client can move that the ladder does not
   already measure, plus the daily habit that decides whether their
   wrists survive the month. */
const METRICS=[
  {m:'wall',  n:'Distance from the wall', unit:'cm', lower:true,
   help:'Hands to skirting board on your best chest-to-wall hold. Smaller is better.'},
  {m:'press', n:'Press attempts held',    unit:'reps',
   help:'Out of ten tries, how many came up and stayed up.'},
  {m:'wrist', n:'Wrist discomfort',       unit:'/10', max:10, lower:true,
   help:'Worst it got this week. Zero is nothing, ten is stop training.'},
];
const HABITS=[
  {h:'wrists', n:'Wrist prep',      help:'Two minutes before you load them.'},
  {h:'shoulders', n:'Shoulder opener', help:'The thing that makes the line possible.'},
  {h:'hollow', n:'Hollow hold',     help:'Thirty seconds. It is the shape.'},
];

function loadTrack(){
  if(!st.token) return Promise.resolve();
  return fetch(AUTH.track,{headers:authed()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ st.track=d; save(); render(); } })
    .catch(()=>{});
}
function postTrack(body){
  if(!st.token) return Promise.resolve();
  return fetch(AUTH.track,{method:'POST',headers:authed(),body:JSON.stringify(body)})
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      if(!d || typeof d!=='object') return;
      /* merge rather than replace: the reply is a snapshot from before
         anything logged since, and a partial one would erase the rest */
      const cur=st.track||{};
      st.track={
        metrics:     Object.assign({}, d.metrics||{},     cur.metrics||{}),
        habits:      Object.assign({}, d.habits||{},      cur.habits||{}),
        checkpoints: Object.assign({}, d.checkpoints||{}, cur.checkpoints||{}),
        checkins:    (d.checkins&&d.checkins.length)?d.checkins:(cur.checkins||[]),
        photos:      (d.photos&&d.photos.length)?d.photos:(cur.photos||[]),
      };
      save();
    })
    .catch(()=>{});
}
const todayKey = () => new Date().toISOString().slice(0,10);

/* which metric row is open for entry. A prompt() box is the wrong way to
   ask somebody on a phone for a number, and it cannot say what the unit is
   while they type. */
let mOpen='';
function openMetric(m){ mOpen = (mOpen===m) ? '' : m; render();
  setTimeout(()=>{ const el=document.getElementById('m-'+m); if(el) el.focus(); },30); }
function saveMetric(m){
  const el=document.getElementById('m-'+m); if(!el) return;
  const v=Number(String(el.value).replace(/[^0-9.]/g,''));
  if(!Number.isFinite(v)||el.value===''){ mOpen=''; render(); return; }
  mOpen=''; logMetric(m, v);
}
function logMetric(m, v){
  const def=METRICS.find(x=>x.m===m); if(!def) return;
  if(!Number.isFinite(v)) return;
  st.track=st.track||{metrics:{},habits:{},checkins:[]};
  st.track.metrics=st.track.metrics||{};
  st.track.metrics[m]=(st.track.metrics[m]||[]).concat([{v,at:Date.now()}]).slice(-60);
  save(); render();
  postTrack({metric:{m,v}});
}
function toggleHabit(h){
  const day=todayKey();
  st.track=st.track||{metrics:{},habits:{},checkins:[]};
  st.track.habits=st.track.habits||{};
  const list=st.track.habits[h]||[];
  const on=list.indexOf(day)<0;
  st.track.habits[h]= on ? list.concat([day]).sort() : list.filter(d=>d!==day);
  save(); render();
  postTrack({habit:{h,day,on}});
}
/* the last 28 days, so a streak is visible without counting */
function habitDays(h,n){
  const set=new Set(((st.track&&st.track.habits)||{})[h]||[]);
  const out=[], now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now); d.setDate(now.getDate()-i);
    const k=d.toISOString().slice(0,10);
    out.push({k, on:set.has(k), today:i===0});
  }
  return out;
}
function habitRate(h,n){
  const d=habitDays(h,n);
  return d.length?Math.round(d.filter(x=>x.on).length/d.length*100):0;
}
/* how much of what you said you would do, you did */
function adherence(weeks){
  const target=weekTarget()||1, sess=sessionsDone();
  const ws=weeksBack(weeks);
  const per=ws.map(w=>Math.min(1, sess.filter(x=>x.at>=w.from&&x.at<w.to).length/target));
  return per.length?Math.round(per.reduce((a,b)=>a+b,0)/per.length*100):0;
}

function checkinDue(){
  const c=((st.track&&st.track.checkins)||[]);
  if(!c.length) return true;
  return (Date.now()-c[c.length-1].at) > 14*864e5;
}
function sendCheckin(){
  const g=id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const body={mood:+g('ciMood')||0, soreness:+g('ciSore')||0, sleep:+g('ciSleep')||0, note:g('ciNote')};
  st.track=st.track||{};
  st.track.checkins=(st.track.checkins||[]).concat([Object.assign({at:Date.now()},body)]);
  save();
  postTrack({checkin:body}).then(()=>{ closeOv(); render(); });
  if(st.in) post({type:'Check-in', ...body});
}

/* ── check points ──────────────────────────────────────────────────
   What a stage is actually assessed on. Every fortnight the app asks
   for these, and they can be filled in any time in between — the number
   is the thing that decides whether someone moves up, so it belongs to
   them rather than to a reminder.

   kind decides the control: secs is a hold, count is how many, rate is
   0-10, yn is did it or not, breaks is how many times they came down
   before reaching ten. */
/* moved to ladder-data.js */
/* moved to ladder-data.js */

/* Coached clients get the check points their coach set, not the ladder's.
   The ladder ones are the free product's stage gates and mean nothing to
   someone on a written programme. */
const cpFor = i => {
  if(i==null && coachedView() && Array.isArray(DATA.checkpoints) && DATA.checkpoints.length){
    /* a check point can be written now and scheduled for later, so one with
       a start date does not exist until that date */
    const today=new Date().toISOString().slice(0,10);
    return DATA.checkpoints.filter(c=>!c.from || c.from<=today);
  }
  return cpsFor(i==null?curStage():i) || [];
};
/* ones they have not been shown yet, so the app can say so */
function cpNew(){
  if(!coachedView()) return [];
  const seen=st.cpSeen||{};
  return cpFor().filter(c=>c.addedAt && !seen[c.k]);
}
function cpMarkSeen(){
  const seen=Object.assign({}, st.cpSeen||{});
  cpFor().forEach(c=>{ if(c.addedAt) seen[c.k]=1; });
  st.cpSeen=seen; save();
}
function cpLog(){ return (st.track&&st.track.checkpoints)||{}; }
function cpLast(k){ const h=cpLog()[k]||[]; return h.length?h[h.length-1]:null; }
function cpDue(){
  const all=cpFor().map(c=>cpLast(c.k)).filter(Boolean);
  if(!all.length) return true;
  const newest=Math.max(...all.map(x=>x.at));
  return (Date.now()-newest) > 14*864e5;
}
/* A drill that is one of the stage's check points says so in the workout,
   with the target, and reaching it there logs it there: no separate trip
   to the ladder to drag a slider for a thing they have just done. */
function cpOfDrill(v){
  if(coachedView() || !v) return null;
  return (cpFor(curStage())||[]).find(c=>c && (c.demo===v || c.k===v)) || null;
}
function cpAim(c){
  if(!c || c.target==null || !(Number(c.target)>0)) return '';
  const K=CP_KIND[c.kind]||CP_KIND.count;
  return (K.lower?'in ':'')+c.target+cpUnit(c)+(K.suffix||'');
}
function cpRow(it){
  const c=cpOfDrill(it&&it.v); if(!c) return '';
  const met=cpMet(c), aim=cpAim(c);
  return `<div data-cpin="${esc(c.k)}" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px">
    <span style="font:700 9.5px/1 var(--sans);letter-spacing:.12em;padding:5px 8px;border-radius:999px;
      background:${met?'var(--forest)':'rgba(243,169,73,.22)'};color:${met?'var(--on-primary)':'#7a4a10'}">${met?'&check; CHECK POINT REACHED':'CHECK POINT'}</span>
    ${aim&&!met?`<span style="font:600 12.5px/1 var(--sans);color:var(--grey)">target ${esc(aim)}</span>`:''}
    ${!met&&aim?`<button onclick="event.stopPropagation();cpReach('${esc(c.k)}')" style="margin-left:auto;border:0;cursor:pointer;
      border-radius:999px;padding:8px 12px;background:var(--forest);color:var(--on-primary);font:600 12px/1 var(--sans)">I got ${esc(aim)}</button>`:''}
  </div>`;
}
function cpReach(k){
  const c=(cpFor(curStage())||[]).find(x=>x.k===k); if(!c) return;
  saveCheckpoint(k, Number(c.target)||0);
  const it={v:c.demo||c.k};
  document.querySelectorAll('[data-cpin="'+k+'"]').forEach(el=>{ el.outerHTML=cpRow(it); });
  toast(esc(c.n)+': reached.');
}
function saveCheckpoint(k,v,video){
  /* fix:<slug>:start and :finish are the before and after of a fix. They sit
     in the same history and reach the coach the same way, but no stage owns
     them, so nothing about clearing a stage applies. */
  const isFix=String(k).startsWith('fix:');
  const wasReady = (coachedView()||isFix) ? true : cpProgress(stageOfCp(k)).ready;
  st.track=st.track||{};
  st.track.checkpoints=st.track.checkpoints||{};
  const row=Object.assign({v:Number(v)||0,at:Date.now()}, video?{video}:{});
  const hist=(st.track.checkpoints[k]||[]).slice();
  /* Nudging the slider twice in one session is a correction, not two
     readings. Today's entry is replaced rather than added to, or logging as
     you drag would fill the history with every value it passed through. A
     clip already sent is never dropped by a later bare number. */
  const lastRow=hist[hist.length-1];
  if(lastRow && dayKey(lastRow.at)===dayKey(row.at)){
    if(lastRow.video && !row.video) row.video=lastRow.video;
    hist[hist.length-1]=row;
  } else hist.push(row);
  st.track.checkpoints[k]=hist.slice(-20);
  if(st.cpDraft) delete st.cpDraft[k];
  /* Reaching the last check point on a stage is the whole point of the
     stage, and nothing happened when you did: the counter read 7 of 7 and
     you stayed where you were. */
  const sg = (coachedView()||isFix) ? -1 : stageOfCp(k);
  const clearedNow = sg>-1 && sg===curStage() && !wasReady && cpProgress(sg).ready;
  save();
  /* under an open sheet render() bails out, so logging one used to change
     nothing on screen until the sheet was closed */
  if(document.getElementById('cptop-'+k)) repaintCp(k); else render();
  if(clearedNow) stageCleared(sg);
  postTrack({checkpoint:Object.assign({k, v:Number(v)||0}, video?{video}:{})});
}

/* A number says what happened. A clip says whether it was any good, which is
   the whole reason a coached client has check points at all. Coached only:
   the free tier has no one to send it to. */
let cpUpBusy=null;
function cpFilm(k){
  if(!st.token){ goJoin(); return; }
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) cpSendClip(k,f); };
  inp.click();
}
function cpSay(k,t){
  const el=document.getElementById('cpup-'+k);
  if(el) el.textContent=t||'';
}
function cpSendClip(k,file){
  if(cpUpBusy) return;
  if(file.size > 100*1024*1024){ cpSay(k,'Too large. Keep it under 100MB, about three minutes from a phone.'); return; }
  cpUpBusy=k; cpSay(k,'Getting ready…');
  fetch(AUTH.upload,{method:'POST',headers:authed(),body:'{}'})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
    .then(d=>new Promise((resolve,reject)=>{
      const fd=new FormData(); fd.append('file',file);
      const xhr=new XMLHttpRequest();
      xhr.open('POST',d.uploadURL);
      xhr.upload.onprogress=e=>{ if(e.lengthComputable)
        cpSay(k,'Uploading… '+Math.round(e.loaded/e.total*100)+'%'); };
      xhr.onload=()=> (xhr.status>=200&&xhr.status<300) ? resolve(d.uid)
                    : reject('Upload failed ('+xhr.status+')');
      xhr.onerror=()=>reject('Upload failed, check your signal');
      xhr.send(fd);
    }))
    .then(uid=>{
      /* the number to attach is whatever the slider is holding, then whatever
         was last logged — the old input id this read from no longer exists, so
         every clip was being filed against a zero */
      const draft=(st.cpDraft||{})[k];
      const v = draft!=null ? draft : ((cpLast(k)||{}).v || 0);
      cpUpBusy=null;
      saveCheckpoint(k, v, uid);
    })
    .catch(err=>{ cpUpBusy=null; cpSay(k, String(err&&err.message||err||'Could not send it')); });
}
/* has this one reached what it is asking for */
/* Pass a value to ask "would this one count", which is what the bar needs
   while a finger is still on it. With no value it answers for what is
   logged, which is every other caller. */
function cpMet(c, v){
  const last = (v==null) ? cpLast(c.k) : {v:Number(v)||0};
  if(!last) return false;
  /* the coach has seen the clip and said: that wins over the number either way */
  if(v==null && last.verdict==='reached') return true;
  if(v==null && last.verdict==='notyet') return false;
  if(c.kind==='face') return Number(last.v)>=2;
  if(c.kind==='yn') return !!last.v;
  if(c.target==null) return false;
  const K=CP_KIND[c.kind]||CP_KIND.count;
  /* lower-is-better can belong to the check point, not only its kind:
     distance to the box is a count, and the smaller one is the good one */
  const lower=(c.lower!=null)?c.lower:K.lower;
  return lower ? (last.v>0 && last.v<=c.target) : last.v>=c.target;
}
const cpUnit = c => (c.unit!=null) ? c.unit : ((CP_KIND[c.kind]||CP_KIND.count).unit||'');

/* ── faces ─────────────────────────────────────────────────────────
   Some check points are not a measurement. "How comfortable do you feel
   falling off the wall" has no number in it, and asking for one out of ten
   invites a made-up answer. Three faces: it is honest about being a feeling
   and it takes one tap. The middle one counts as not there yet, because
   "sort of" is not the same as yes. */
const FACES=[
  {v:0, mouth:'M8.4 16.4c1.9-2 5.3-2 7.2 0'},
  {v:1, mouth:'M8.4 15.4h7.2'},
  {v:2, mouth:'M8.4 14.2c1.9 2.3 5.3 2.3 7.2 0'}
];
const FACE_LABELS=['Not really','Getting there','Yes'];
const cpFaceLabels = c => c.faces || FACE_LABELS;
function cpFaceLabel(c,v){
  if(c.kind==='face') return cpFaceLabels(c)[Math.max(0,Math.min(2,Number(v)||0))];
  return v ? 'Yes' : 'Not yet';
}
function faceSVG(i,on){
  const f=FACES[i];
  return `<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"
    style="display:block;margin:0 auto">
    <circle cx="12" cy="12" r="9.4" fill="none" stroke="${on?'#fff':'rgba(17,17,17,.28)'}"
      stroke-width="1.5"/>
    <circle cx="9" cy="10" r="1.15" fill="${on?'#fff':'rgba(17,17,17,.45)'}"/>
    <circle cx="15" cy="10" r="1.15" fill="${on?'#fff':'rgba(17,17,17,.45)'}"/>
    <path d="${f.mouth}" fill="none" stroke="${on?'#fff':'rgba(17,17,17,.45)'}"
      stroke-width="1.5" stroke-linecap="round"/>
  </svg>`;
}
function cpWhen(at){
  const d=new Date(at);
  return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}

/* A slider with the target marked on it, so a number is read against what it
   is aiming at rather than on its own. Drag or tap the track, and the step
   buttons stay for anyone who wants to be exact. */
/* ── how far off, in colour ──────────────────────────────────────────
   Red until you are halfway to the number, amber from there, and the
   green the app already uses when you reach it. Nothing logged is the
   pale track, because no colour is honest about a thing not attempted.
   Lower-is-better runs the other way: a long bar is a bad bar there, so
   the reading is always "how close to the target", never "how full". */
function cpBarColour(c, val, met){
  if(met) return 'linear-gradient(90deg,#0a7b74,#006663)';
  const K=CP_KIND[c.kind]||CP_KIND.count;
  const lower=(c.lower!=null)?c.lower:K.lower;
  const v=Number(val)||0;
  if(!v) return 'linear-gradient(90deg,#cfe6ec,#8fbeca)';
  if(c.target==null) return 'linear-gradient(90deg,#cfe6ec,#8fbeca)';
  const close = lower ? (v <= c.target*2) : (v >= c.target*0.5);
  return close ? 'linear-gradient(90deg,#f3a949,#d98e2a)'
               : 'linear-gradient(90deg,#c9705a,#a4503c)';
}
function cpInput(c){
  const K=CP_KIND[c.kind]||CP_KIND.count;
  const last=cpLast(c.k);
  if(c.kind==='face'){
    const labels=cpFaceLabels(c);
    return `<div style="display:flex;gap:7px">
      ${[0,1,2].map(v=>{
        const on=last&&Number(last.v)===v;
        return `<button onclick="saveCheckpoint('${c.k}',${v})"
          style="flex:1;border-radius:14px;padding:11px 6px 10px;cursor:pointer;min-height:44px;
          display:flex;flex-direction:column;align-items:center;gap:6px;
          border:1px solid ${on?'transparent':'rgba(17,17,17,.14)'};
          background:${on?(v===2?'var(--forest)':v===1?'#b07a2a':'var(--grey)'):'#fff'};
          color:${on?'var(--on-primary)':'var(--ink)'}">
          ${faceSVG(v,on)}
          <span style="font:600 11.5px/1 var(--sans)">${esc(labels[v])}</span></button>`;
      }).join('')}
    </div>`;
  }
  if(c.kind==='yn'){
    return `<div style="display:flex;gap:7px">
      ${[['1','Yes'],['0','Not yet']].map(([v,l])=>`<button onclick="saveCheckpoint('${c.k}',${v})"
        style="flex:1;border-radius:14px;padding:13px;cursor:pointer;min-height:44px;
        font:700 13px/1 var(--sans);
        border:1px solid ${last&&String(last.v)===v?'transparent':'rgba(17,17,17,.14)'};
        background:${last&&String(last.v)===v?'var(--forest)':'#fff'};
        color:${last&&String(last.v)===v?'var(--on-primary)':'var(--ink)'}">${l}</button>`).join('')}
    </div>`;
  }
  /* A target of nought is a target nobody set: it cannot be reached, by
     either rule, and it printed as "90s / 0s" against a real reading.
     Cleared before anything is measured against it. */
  if(c.target!=null && !(Number(c.target)>0)) c=Object.assign({}, c, {target:null});
  const draft=(st.cpDraft||{})[c.k];
  const val=draft!=null?draft:(last?last.v:0);
  const lower=(c.lower!=null)?c.lower:K.lower;
  /* The target sits at the end of the track, not as a notch in the middle
     of an arbitrary scale: you are dragging towards a number. The scale
     only grows past it if someone actually beats it, so the usual case
     reads as "how close am I to the end". Lower-is-better runs the other
     way, from wherever they started down to the target. */
  const max = lower
    ? Math.max(c.from||K.max||25, val, last?last.v:0)
    : Math.max(c.target||K.max||20, val, last?last.v:0);
  const pct=Math.max(0,Math.min(100,(val/max)*100));
  const met = c.target==null ? false : (lower ? (val>0 && val<=c.target) : val>=c.target);
  const notch = (c.target!=null && max>c.target) ? (c.target/max)*100 : null;
  const step=c.kind==='secs'?5:1;
  const unit=cpUnit(c);
  /* The target label used to live inside the right-hand end of the track,
     which meant the thumb had to stop short of it: a check point that was
     reached drew a bar about eighty five per cent full, with a grey strip
     after it. Dragging to the end never looked like getting to the end.
     The end of the bar is the target now and nothing sits in front of it,
     so a full bar is a reached check point. The number itself is on the
     line under the track, which already says how far off it is. */
  const RES = 36;
  const run = `(100% - ${RES}px) * ${(pct/100).toFixed(4)}`;
  return `<div>
    <div id="cptrack-${c.k}" data-res="${RES}" onpointerdown="cpDrag(event,'${c.k}',${max},${RES})"
      style="position:relative;height:40px;border-radius:20px;background:rgba(17,17,17,.07);
      cursor:pointer;touch-action:none;overflow:hidden">
      <i id="cpfill-${c.k}" style="position:absolute;left:0;top:0;bottom:0;border-radius:20px;
        width:calc(${run} + 36px);
        background:${cpBarColour(c,val,met)};
        transition:width .16s,background .35s"></i>
      ${notch!=null?`<i style="position:absolute;left:calc((100% - ${RES}px) * ${
        (notch/100).toFixed(4)} + 18px);top:5px;bottom:5px;width:2px;
        background:rgba(0,64,61,.45)"></i>`:''}
      <i id="cpthumb-${c.k}" style="position:absolute;top:4px;left:calc(${run} + 4px);
        width:32px;height:32px;
        border-radius:50%;background:#fff;box-shadow:0 2px 9px rgba(28,32,25,.3);transition:left .16s"></i>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
      <button class="rt" onclick="cpStep('${c.k}',${-step},${max})" aria-label="Less">−</button>
      <span id="cpstep-${c.k}" data-u="${esc(unit)}"
        style="flex:1;text-align:center;font:700 15px/1 var(--sans)">${val}${esc(unit)}</span>
      <button class="rt" onclick="cpStep('${c.k}',${step},${max})" aria-label="More">+</button>
    </div>
  </div>`;
}
/* ── one check point, as a card ────────────────────────────────────
   The slider carries the target at its right-hand end rather than as a
   notch in the middle, because the target is the whole point of the row:
   you are dragging towards a number, not along a scale.

   The card is deliberately in two halves. Everything above the demo is
   repainted whenever the number changes; the demo container below it is
   never touched, so opening a clip and then nudging the slider does not
   tear the video down and start it again. Redrawing the whole sheet for
   either of those is what made it feel like the page reloading. */
/* A card can be on the Progress tab (the coached list, or the current
   stage's) or inside a stage sheet for some other stage, so it cannot assume
   which list it came from. */
/* ── clearing a stage ──────────────────────────────────────────────
   It moves you, rather than congratulating you and leaving you where you
   were. Moving is the thing that was asked for and it is reversible from
   the foot of the ladder, so it happens first and the sheet says where you
   have landed. If the next one is behind the paywall nothing moves and the
   sheet offers it instead, because pretending otherwise would be worse. */
function stageOfCp(k){
  for(let i=0;i<STAGES.length;i++)
    if((cpsFor(i)||[]).some(c=>c.k===k)) return i;
  return -1;
}
function stageCleared(i){
  const next=STAGES[i+1];
  const blocked = !next || stageLocked(i+1);
  st.clearedFrom=i;
  if(!blocked){
    st.stage=i+1; save();
    try{ sendIntake(); }catch(e){}
    try{ saveState(); }catch(e){}
  }
  closeOv();
  openOv('cleared');
}
function clearedStay(){
  if(st.clearedFrom!=null){ st.stage=st.clearedFrom; save();
    try{ sendIntake(); }catch(e){} try{ saveState(); }catch(e){} }
  st.clearedFrom=null; closeOv();
}
function cpDef(k){
  const here=(cpFor()||[]).find(x=>x.k===k);
  if(here) return here;
  if(st.ov==='stage') return (cpFor(st.ovStage||0)||[]).find(x=>x.k===k)||null;
  for(let i=0;i<STAGES.length;i++){
    const f=(cpFor(i)||[]).find(x=>x.k===k); if(f) return f;
  }
  return null;
}
/* One mark for a form check, used on every check point card and on the
   form check screen itself, so the thing is recognisable before it is read. */
const IC_FORMCHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
  + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'

function cpCard(c, i, total){

    style="border-radius:18px;padding:15px 15px 16px;background:#fff;

    <div id="cptop-${c.k}">${cpCardTop(c,i,total)}</div>

}
function cpCardTop(c, i, total){

/* Somebody who is not a coaching client sends a clip as a form check, which
   is its own screen and knows whether they can send one. Every gate on the
   ladder is self-scored, and the moment somebody drags a slider is the
   moment they wonder whether it counted, so the offer belongs on the card
   rather than on a tab they never open. */
function cpAsk(){ closeOv(); go('coaching'); }
/* whether a form check is there to be sent right now: a coached client or
   the check tier always, everybody else until they have used their one. The
   icon stays on the card either way, because the offer is still real, it
   just costs something once the free one is gone. */
const fcOpen = () => coachedView() || !!st.coached || !!st.canCheck;
/* ── the record ─────────────────────────────────────────────────────
   Every reading, newest first, and beside any with a clip what the coach
   said about it. For a form check client this is the point: not what they
   logged, but what was seen and what was said. A verified one carries the
   coach's tick. */
/* ── everything they have sent, and what came back ────────────────
   A client films a check point, a two week test and whatever else Elliott
   asks for, and then had nowhere to see any of it. The clips lived in the
   thread, scrolled away, and the coach's verdict on one was behind a
   disclosure triangle inside a check point card. This is the record: every
   clip they have ever sent, newest first, with what it was for and what
   came back about it. */
function myClips(){
  const out=[], seen=new Set();
  const add=o=>{ if(!o.uid || seen.has(o.uid)) return; seen.add(o.uid); out.push(o); };

  /* check point clips carry the coach's verdict on the row itself */
  const log=cpLog();
  /* the ones the coach set, then the ladder's own, so a check point from a
     stage they are no longer on still has its name rather than its key */
  const nameOf=k=>{
    const mine=(cpFor()||[]).find(x=>x&&x.k===k); if(mine&&mine.n) return mine.n;
    try{ for(const st0 of Object.keys(CHECKPOINTS||{})){
      const c=(CHECKPOINTS[st0]||[]).find(x=>x&&x.k===k); if(c&&c.n) return c.n; } }catch(e){}
    return k;
  };
  Object.keys(log).forEach(k=>(log[k]||[]).forEach(r=>{
    if(!r||!r.video) return;
    add({uid:r.video, at:r.at||0, what:'Check point', which:nameOf(k),
         value:(r.v!=null?String(r.v):''),
         verdict:r.verdict||'', note:r.note||'', by:r.by||'', answeredAt:r.verdictAt||0});
  }));

  /* a test or a form check is answered as a whole, so the answer hangs off
     every clip in it */
  ((st.subs)||[]).forEach(sb=>{
    const what = sb.kind==='assessment' ? 'Form check'
      : sb.kind==='checkpoint' ? 'Check point' : 'Two-week test';
    (sb.clips||[]).forEach(c=>{
      const uid = typeof c==='string' ? c : (c&&(c.uid||c.video));
      add({uid, at:sb.at||0, what, which:(sb.numbers&&sb.numbers.name)||'',
           answer:(sb.answer&&sb.answer.text)||'', answeredAt:sb.reviewedAt||0,
           waiting:sb.status==='submitted'});
    });
  });

  /* and anything they simply sent in the thread */
  (st.msgs||[]).forEach(m=>{ if(m.from!=='e' && m.video)
    add({uid:m.video, at:m.at||0, what:'Sent to Elliott', which:'', text:m.text||''}); });

  return out.sort((a,b)=>(b.at||0)-(a.at||0));
}

/* answers they have not seen: the dot on the Progress tab */

}

        ${said[2]?`<div style="font:400 13px/1.5 var(--sans);color:var(--ink);margin-top:5px;

  };
  return `<div class="card" style="padding:18px 20px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">

        answered.length?'':' Nothing has been answered yet.'}</div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">${

}

/* how far off it is, said in the units it is measured in */
function cpToGo(c){
  const last=cpLast(c.k);
  const K=CP_KIND[c.kind]||CP_KIND.count;
  const lower=(c.lower!=null)?c.lower:K.lower;
  const unit=cpUnit(c);
  const met=cpMet(c);
  /* the left of this line already says whether it has been logged, so the
     right says nothing rather than saying it twice */
  if(c.kind==='yn'||c.kind==='face') return last ? (met?'Reached':'Not there yet') : '';
  /* the target used to be a label inside the track. Nothing logged yet, so
     say what the end of the bar is worth reaching. */
  if(!last) return c.target==null ? '' : 'Target '+c.target+unit;
  if(met) return 'Target reached';
  if(c.target==null) return '';
  return lower ? (last.v-c.target)+unit+' to lose' : (c.target-last.v)+unit+' to go';
}
/* Repaint one card's numbers without touching its demo, and refresh the
   counts the sheet shows above the list. render() bails out under an open
   sheet, which is why logging a check point used to change nothing on
   screen until you closed it. */
/* render() returns early while a sheet is open, so the chooser has to
   repaint itself. Everything it shows comes from st, so redrawing the
   sheet body is enough and there is nothing in it to lose. */
function repaintMode(){
  if(st.ov!=='mode') return;
  const ov=document.getElementById('ov');
  const host=ov && ov.querySelector('.sheet');
  if(!host) return;
  const keep=host.scrollTop;
  drawOv();
  const now=document.querySelector('#ov .sheet');
  if(now){
    /* .sheet carries a 450ms slide up, and drawOv builds a fresh one, so
       every tap of a time or a difficulty replayed the whole sheet coming in
       from the bottom. That is the "it refreshes when I press it". The sheet
       is already up; only its contents changed. Setting this synchronously
       means the animation never starts rather than being cut off. */
    now.style.animation='none';
    now.scrollTop=keep;
  }
}

function cpStep(k,by,max){
  const cur=(st.cpDraft||{})[k]!=null?st.cpDraft[k]:((cpLast(k)||{}).v||0);
  const next=Math.max(0,Math.min(max,cur+by));
  st.cpDraft=Object.assign({},st.cpDraft,{[k]:next});
  save();
  /* paint the three places the number shows rather than redrawing the sheet */
  const el=document.getElementById('cptrack-'+k);
  if(el){
    const res=Number(el.dataset.res)||36, p=max?next/max:0;
    const run='(100% - '+res+'px) * '+p.toFixed(4);
    const fill=document.getElementById('cpfill-'+k), thumb=document.getElementById('cpthumb-'+k);
    if(fill){ fill.style.width='calc('+run+' + 36px)';
      const c0=cpDef(k);
      if(c0) fill.style.background=cpBarColour(c0, next, cpMet(c0, next)); }
    if(thumb) thumb.style.left='calc('+run+' + 4px)';
  }
  ['cpval-','cpstep-'].forEach(pre=>{
    const n=document.getElementById(pre+k);
    if(n) n.textContent=next+(n.dataset.u||'');
  });
  /* hold off until the tapping stops, so five taps are one reading and one
     trip to the server rather than five */
  clearTimeout(cpStepT_);
  cpStepT_=setTimeout(()=>saveCheckpoint(k,(st.cpDraft||{})[k]), 700);
}
let cpStepT_=null;
/* dragging the track, pointer events so it works with a thumb and a mouse */
function cpDrag(e,k,max,res){
  const el=document.getElementById('cptrack-'+k); if(!el) return;
  const RES=res||36;
  /* ── everything that does not change while a finger is down ─────────
     This looked four elements up, measured the track, searched the check
     point list and wrote a fresh gradient on every pointermove, and the
     fill carries a 350ms transition on background, so each move started
     another one. That is the lag. All of it is resolved once here, the
     geometry is re-measured only if the page moves under the finger, and
     the colour is written only when the band actually changes. */
  const fill=document.getElementById('cpfill-'+k);
  const thumb=document.getElementById('cpthumb-'+k);
  const lab=document.getElementById('cpval-'+k);
  const st2=document.getElementById('cpstep-'+k);
  const c0=cpDef(k);
  const unit=(lab&&lab.dataset.u)||'';
  let r=el.getBoundingClientRect();
  let lastBg = fill ? fill.style.background : '';
  let lastV = null, pending = null, raf = 0;

  const paint=()=>{
    raf=0;
    const p=pending; if(p==null) return;
    const v=Math.round(p*max);
    const run2='(100% - '+RES+'px) * '+p.toFixed(4);
    if(fill){
      fill.style.width='calc('+run2+' + 36px)';
      if(c0){
        const bg=cpBarColour(c0, v, cpMet(c0, v));
        if(bg!==lastBg){ fill.style.background=bg; lastBg=bg; }
      }
    }
    if(thumb) thumb.style.left='calc('+run2+' + 4px)';
    if(v!==lastV){
      lastV=v;
      if(lab) lab.textContent=v+unit;
      if(st2) st2.textContent=v+(st2.dataset.u||'');
      /* one object per changed value, not one per move event */
      st.cpDraft=Object.assign({},st.cpDraft,{[k]:v});
    }
  };
  const set=ev=>{
    const run=Math.max(1, r.width-RES);
    let p=Math.max(0,Math.min(1,(ev.clientX-r.left-16)/run));
    /* The end of this track is the target, so getting there is the whole
       point of dragging it. One unit of a 45 second hold is about six
       pixels, so a finger that stopped a hair short logged 44 and the card
       still said the check point was not reached, which read as the bar
       being broken. The last stretch of the track is the target, and the
       first is nought. Only the two ends snap: everything between them is
       still the number they actually dragged to. */
    const SNAP=0.04;
    if(p>1-SNAP) p=1; else if(p<SNAP) p=0;
    pending=p;
    /* one paint per frame however fast the pointer reports */
    if(!raf) raf=requestAnimationFrame(paint);
  };
  /* The fill and the thumb ease into place, which is right for a tap on
     the plus button and wrong under a finger: the bar arrives a sixth of
     a second after the thumb and the whole thing feels heavy. Off while
     dragging, back on when the finger lifts. */
  if(fill) fill.style.transition='background .35s';
  if(thumb) thumb.style.transition='none';
  const ease=()=>{ if(fill) fill.style.transition='width .16s,background .35s';
                   if(thumb) thumb.style.transition='left .16s'; };
  r=el.getBoundingClientRect();
  set(e); paint();
  /* capture is a nicety: it keeps the drag alive if the finger slides off
     the track. It throws on some synthetic and stale pointer ids, and an
     exception here used to abandon the whole gesture and leave the easing
     switched off. */
  try{ el.setPointerCapture && el.setPointerCapture(e.pointerId); }catch(err){}
  const move=ev=>set(ev);
  const up=()=>{ el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
                 if(raf){ cancelAnimationFrame(raf); raf=0; paint(); }
                 ease();
                 /* Letting go logs it. Dragging all the way to the target and
                    watching the card still say NOT STARTED made the slider look
                    broken: there was no way to finish one without noticing a
                    small pill beside it. */
                 const val=(st.cpDraft||{})[k];
                 if(val!=null) saveCheckpoint(k, val); else save(); };
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',up);
}

const PHOTO_VIEWS=[['side','Side on'],['front','Front on'],['back','From behind']];
function pickProgressPhoto(view){
  if(upBusy) return;
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
    upBusy=true;
    const say=t=>{ const el=document.getElementById('phMsg'); if(el) el.textContent=t; };
    say('Preparing…');
    shrinkPhoto(f)
      .then(data=>fetch(AUTH.image,{method:'POST',headers:authed(),
        body:JSON.stringify({data})}).then(r=>r.ok?r.json():Promise.reject()))
      .then(d=>postTrack({photo:{id:d.id, view}}))
      .then(()=>{ upBusy=false; say(''); render(); })
      .catch(()=>{ upBusy=false; say('That did not upload. Try again.'); });
  };
  inp.click();
}

      Of the ${weekTarget()} sessions a week you set, over the last four weeks.
      ${trend>4?'Up on the four before.':trend<-4?'Down on the four before.':'Steady on the four before.'}</div>
  </div>`;
}

function checkinCard(){
  if(!checkinDue()) return '';
  return `<div class="card" style="padding:18px 20px;border:1.5px solid var(--forest)">
    <div class="kick2" style="color:var(--forest)">CHECK-IN DUE</div>
    <div style="font:400 14px/1.55 var(--sans);color:var(--grey);margin-top:9px">
      Three sliders and a sentence. It is what tells ${st.in?'me':'the plan'} whether to push
      or back off.</div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="openOv('checkin')">Do the check-in</button>
  </div>`;
}

/* ── the month, the way the coach dashboard shows it ─────────────────
   Same reading on both sides of the table: full colour for a session
   finished, weaker for a session part done, and the warning colour only
   for a day logged as not trained. A blank means nothing was logged,
   which is a different fact from a miss. */
function calShift(by){ st.calOff=Math.max(0,Math.min(11,(st.calOff|0)+by)); st.calDay=null; save(); render(); }
function calPick(k){ st.calDay = (st.calDay===k) ? null : k; save(); render(); }
/* what a day actually held. The calendar could say a day was part done and
   then had no way of telling you which part. */
/* Drills where the number they managed was not the number asked for. It is
   the most useful thing in the log and it was buried inside one day's
   breakdown, so neither of us was reading it. */
/* The block note changes when the coach rewrites it, and nothing said so.
   A stamp of what was last read, against what is there now. */
function blockText(){
  return JSON.stringify([(DATA.read||[]), (DATA.changed||[])]);
}
function blockNew(){
  const t=blockText();
  return !!t && t.length>4 && st.readSeen !== t;
}
function markBlockSeen(){ st.readSeen=blockText(); save(); }

/* what the programme asks for, so sessions logged before the app started
   recording it are still readable rather than invisible */
/* Logging by exception: the number is only worth typing when it was not the
   number asked for, so the row shows the target until you say otherwise. */
function planLogged(k){ const r=(st.planReps||{})[k]; return r==null?null:r; }
function planLogBtn(k,it){
  const got=planLogged(k), u=doseUnit(it.d);
  if(got!=null) return `<button class="rt on" onclick="st.repOpen=st.repOpen==='${k}'?null:'${k}';save();render()">${got}${u} done</button>`;
  return `<button class="rt" onclick="planOpenRep('${k}')">Did fewer?</button>`;
}
function planOpenRep(k){ st.repOpen=k; save(); render(); }
function planStepper(k,it){
  const u=doseUnit(it.d), step=u==='s'?5:1;
  const want=recommendedReps(it)||0;
  const v=(st.planReps||{})[k];
  const cur=v==null?want:v;
  return `<div style="display:flex;align-items:center;gap:9px;margin-top:9px;background:#f4efe9;
    border-radius:16px;padding:11px 12px">
    <span style="flex:1;font:400 12.5px/1.35 var(--sans);color:var(--grey)">
      ${u==='s'?'How long did you hold it?':'How many did you do?'}</span>
    <button class="rt" onclick="planRep('${k}',${-step},${want})" aria-label="Fewer">−</button>
    <span style="flex:none;min-width:46px;text-align:center;font:400 19px/1 var(--serif)">${cur}${u}</span>
    <button class="rt" onclick="planRep('${k}',${step},${want})" aria-label="More">+</button>
    <button class="rt on" onclick="planRepDone('${k}')">Done</button>
  </div>`;
}
function planRep(k,by,want){
  st.planReps=st.planReps||{};
  const cur=st.planReps[k]==null?want:st.planReps[k];
  st.planReps[k]=Math.max(0,cur+by);
  save(); render();
}
function planRepDone(k){ st.repOpen=null; save(); render(); sendPlanReps(); }
/* it reaches the coach the same way a flag does */
function sendPlanReps(){
  if(!st.token) return;
  const d=day(), out=[];
  (d.groups||[]).forEach((g,gi)=>(g.items||[]).forEach((it,ii)=>{
    const k=key(st.day,gi,ii), r=(st.planReps||{})[k];
    if(r==null) return;
    const a=doseAmount(it);
    out.push({v:it.v, n:it.n, grp:g.name, got:st.tick[k]?1:0, of:1,
              reps:r, unit:a.unit, per:a.n, secs:0,
              want:a.n||recommendedReps(it)||0, dose:String(it.d||'').slice(0,40),
              rate:(st.rate||{})[it.v]||''});
  }));
  if(!out.length) return;
  reportProgress({session:{day:st.day, name:d.label||'', done:false, mode:'plan',
    drills:out.length, mins:0, actual:0, got:out.filter(x=>x.got).length, of:out.length,
    items:out.slice(0,40)}});
}

function prescribedFor(v){
  const days=(DATA&&DATA.days)||[];
  for(const d of days) for(const g of (d.groups||[])) for(const it of (g.items||[]))
    if(it && it.v===v) return {want:recommendedReps(it), unit:doseUnit(it.d), n:it.n};
  const drill=(typeof drillById==='function') ? drillById(v) : null;
  return drill ? {want:recommendedReps(drill), unit:doseUnit(drill.d), n:drill.n} : null;
}
/* a dose in seconds is not a rep count, and calling it one made the number
   meaningless on every hold in the programme */
function doseUnit(d){ return /\bs(ec|econds)?\b|\d+\s*s\b/i.test(String(d||'')) ? 's' : ''; }

/* repsOffCard lived here. It listed only the drills where what was done
   did not match what was asked, capped at eight, so a drill done exactly as
   prescribed never appeared and the card read as a list of failures rather
   than a record of work. perDrillCard below is the whole log. */

/* ── this week, in the units the training is actually in ───────────
   The Progress tab counted sessions and days and never once said how much
   work was done in them. These three are the answer to "how much": time on
   the floor, reps turned over, and seconds spent upside down. */
function volumeHero(){
  const wk=MONDAY(Date.now()), lastWk=wk-7*864e5;
  const now=volumeBetween(wk,null), was=volumeBetween(lastWk,wk);
  const app=appTimeBetween(wk,null), appWas=appTimeBetween(lastWk,wk);
  const anything = now.sessions||now.reps||now.secs||app.opens;
  const delta=(a,b)=>{
    if(!b || !a) return '';
    const d=a-b; if(!d) return 'level with last week';
    const pct=Math.round(Math.abs(d)/b*100);
    return (d>0?'up ':'down ')+pct+'% on last week';
  };
  const stat=(v,label,sub)=>`<div style="flex:1;min-width:0">
    <div style="font:400 ${String(v).length>5?25:34}px/1 var(--serif);letter-spacing:-.015em;
      color:var(--ink);white-space:nowrap">${v}</div>
    <div style="font:600 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
      color:var(--grey);margin-top:8px">${label}</div>
    ${sub?`<div style="font:400 11.5px/1.35 var(--sans);color:var(--grey2);margin-top:5px">${sub}</div>`:''}
  </div>`;
  if(!anything) return `<div class="card" style="padding:20px">
    <div class="kick2">THE WORK, THIS WEEK</div>
    <div style="font:400 14.5px/1.55 var(--sans);color:var(--grey);margin-top:10px">
      Nothing yet this week. Finish a session and the time, the reps and the
      seconds you held all turn up here on their own.</div></div>`;
  return `<div class="card" style="padding:22px 20px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span class="kick2">THE WORK, THIS WEEK</span>
      <span style="font:400 12.5px/1 var(--sans);color:var(--grey2)">${
        now.sessions} session${now.sessions===1?'':'s'}</span>
    </div>
    <div style="display:flex;gap:14px;margin-top:16px">
      ${stat(now.mins+'m','Training', delta(now.mins,was.mins))}
      ${stat(String(now.reps),'Reps', delta(now.reps,was.reps))}
      ${stat(mmss(now.secs),'Held', delta(now.secs,was.secs))}
    </div>
    <div style="height:1px;background:rgba(0,64,61,.09);margin:18px 0 14px"></div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span style="font:400 13.5px/1.4 var(--sans);color:var(--grey)">
        ${now.sets} set${now.sets===1?'':'s'} across ${now.drills} drill${now.drills===1?'':'s'}</span>
      <span style="font:400 13.5px/1.4 var(--sans);color:var(--grey2)">${
        app.opens? hm(app.ms)+' in the app' : ''}</span>
    </div>
  </div>`;
}

/* ── the same three, eight weeks of them ───────────────────────────
   One bar chart with a switch rather than three charts, because they are
   three readings of one thing and nobody wants to scroll past two of them
   to reach the one they meant. */
function volumeCard(){
  const tab=['reps','secs','mins'].indexOf(st.volTab)>-1?st.volTab:'reps';
  const wks=weeklySeries(8);
  const val=w=>tab==='reps'?w.reps:tab==='secs'?w.secs:w.mins;

  const seg=[['reps','Reps'],['secs','Held'],['mins','Time']].map(([k,l])=>
    `<button onclick="st.volTab='${k}';save();render()" style="flex:1;cursor:pointer;border:0;
      border-radius:10px;padding:9px 6px;min-height:40px;font:600 12.5px/1 var(--sans);
      background:${tab===k?'#fff':'transparent'};
      box-shadow:${tab===k?'0 1px 2px rgba(17,17,17,.08)':'none'};

      <span class="kick2">EIGHT WEEKS</span>

        any?fmt(total)+' in total':'nothing logged yet'}</span>
    </div>
    <div style="display:flex;gap:4px;padding:4px;border-radius:13px;
      background:rgba(0,64,61,.08);margin-top:14px">${seg}</div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:104px;margin-top:18px">
      ${wks.map((w,i)=>{
        const v=val(w), h=any?Math.max(v?4:2,Math.round(v/peak*100)):2;
        const last=i===wks.length-1;

          justify-content:flex-end;height:100%;gap:6px">
          ${v?`<span style="font:600 9px/1 var(--sans);color:${
            last?'var(--ink)':'var(--grey2)'}">${tab==='secs'?Math.round(v):v}</span>`:''}
          <div title="${fmt(v)}" style="width:100%;height:${h}%;border-radius:5px;
            background:${v? (last?'var(--amber)':'var(--deep)') : 'rgba(0,64,61,.1)'}"></div>
        </div>`;}).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-top:8px">

    <div style="font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:14px">${
      tab==='reps' ? 'Every rep of every set you finished, warm-ups included.'

}

/* ── how much they are in here, as opposed to training ─────────────
   Two different habits and they were being read as one. Opening the app

function appUseCard(){

  const trained=volumeBetween(wk,null).sessions;
  const days=[0,1,2,3,4,5,6].map(i=>{
    const t=wk+i*864e5, k=new Date(t).toISOString().slice(0,10);
    const d=v[k]||{}; return {k, ms:Number(d.ms)||0, n:Number(d.n)||0,
      fut:t>Date.now(), today:k===new Date().toISOString().slice(0,10)};

    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">

      <span style="font:400 12.5px/1 var(--sans);color:var(--grey2)">${
        now.opens} visit${now.opens===1?'':'s'}${was.ms?', '+hm(was.ms)+' last week':''}</span>
    </div>
    <div style="font:400 34px/1 var(--serif);letter-spacing:-.015em;margin-top:13px">${hm(now.ms)}</div>
    <div style="display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:16px">
      ${days.map(d=>`<div style="flex:1;height:100%;display:flex;align-items:flex-end">
        <div style="width:100%;height:${d.ms?Math.max(8,Math.round(d.ms/peak*100)):3}%;
          border-radius:4px;opacity:${d.fut?.4:1};

      </div>`).join('')}

    <div style="display:flex;gap:5px;margin-top:7px">
      ${['M','T','W','T','F','S','S'].map((l,i)=>`<span style="flex:1;text-align:center;

/* ── per drill ─────────────────────────────────────────────────────
   This card only ever listed drills where what was done did not match what
   was asked, so everything done as prescribed was invisible and the card
   read as a list of failures. It is the whole log now, best first, with
   what was asked for beside it. */
function perDrillCard(){
  const log=(st.prog&&st.prog.repsLog)||st.repsLog||{};
  const rows=[];
  Object.keys(log).forEach(v=>{
    const h=(log[v]||[]).filter(x=>x && x.reps);
    if(!h.length) return;
    const last=h[0], pre=prescribedFor(v);
    const unit=(last.unit==='s'||last.unit==='') ? last.unit : ((pre&&pre.unit)||'');
    const best=Math.max(...h.map(x=>Number(x.reps)||0));
    rows.push({v, n:last.n||(pre&&pre.n)||v.replace(/-/g,' '),
      reps:Number(last.reps)||0, want:Number(last.want)||(pre&&pre.want)||0,
      best, unit, at:Number(last.at)||0,
      trend:h.length>1 ? (Number(last.reps)||0)-(Number(h[1].reps)||0) : 0});
  });
  if(!rows.length) return '';
  rows.sort((a,b)=>b.at-a.at);
  const open=!!st.drillsOpen;
  const shown=open?rows:rows.slice(0,6);
  return `<div class="card" style="padding:18px 20px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span class="kick2">DRILL BY DRILL</span>
      <span style="font:400 12.5px/1 var(--sans);color:var(--grey2)">${rows.length} logged</span>
    </div>
    <div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:7px">
      The last time you did each, against what it asked for. Short of it is
      information, not a failure.</div>
    <div style="margin-top:12px">
    ${shown.map((r,i)=>`<div style="display:flex;align-items:baseline;gap:10px;
      padding:11px 0;${i?'border-top:1px solid rgba(0,64,61,.08)':''}">
      <span style="flex:1;min-width:0;font:600 14px/1.25 var(--sans)">${esc(r.n)}
        ${r.best>r.reps?`<span style="display:block;font:400 11px/1.3 var(--sans);
          color:var(--grey2);margin-top:3px">best ${r.best}${esc(r.unit)}</span>`:''}</span>
      ${r.trend?`<span style="flex:none;font:600 10.5px/1 var(--sans);
        color:${r.trend>0?'var(--forest)':'var(--grey2)'}">${r.trend>0?'+':''}${r.trend}</span>`:''}
      <span style="flex:none;font:400 17px/1 var(--serif);
        color:${r.want&&r.reps>=r.want?'var(--forest)':'var(--ink)'}">${r.reps}${esc(r.unit)}
        ${r.want?`<span style="font:400 12px/1 var(--sans);color:var(--grey2)">of ${
          r.want}${esc(r.unit)}</span>`:''}</span>
    </div>`).join('')}
    </div>
    ${rows.length>6?`<button class="back" style="font-weight:700;font-size:12.5px;margin-top:10px;padding:0"
      onclick="st.drillsOpen=!st.drillsOpen;save();render()">${
      open?'Show fewer':'All '+rows.length+' drills'}</button>`:''}
    ${repsAreLocal()?`<div style="font:400 11.5px/1.4 var(--sans);color:var(--grey2);margin-top:11px">
      Kept on this phone only until you have an account.</div>`:''}
  </div>`;
}


/* ── the training calendar ─────────────────────────────────────────
   The dashboard's calendar, in the client's own app and in the first
   person. It replaces four panels that between them answered less than
   this one does: a week strip, a collapsed month calendar, an adherence
   bar and a bests list.

   A cell says three things without a legend for any of them: whether it
   was trained, how much of it was got through, and how long it took.
   Tapping one lists the exercises, with what was done against what was
   asked. That last part is the bit nothing else in the app ever showed. */
function calParts(list){
  let got=0, of=0;
  (list||[]).forEach(x=>(x.items||[]).forEach(it=>{
    const o=Number(it.of)||0; if(!o) return;
    of+=o; got+=Math.min(o, Number(it.got)||0);
  }));
  return {got, of};
}
function calDone(list){
  const t=calParts(list);
  if(t.of) return Math.max(0, Math.min(1, t.got/t.of));
  /* sessions logged before the per-drill detail existed carry only a flag */
  return (list||[]).some(x=>x.done || x.kind==='all') ? 1 : 0;
}
function trainingCalendar(){
  const ss=((st.prog&&st.prog.sessions)||[]).filter(x=>x&&x.at);
  const opens=new Set(((st.prog&&st.prog.opens)||[]));
  const byDay={};
  ss.forEach(x=>{ (byDay[dayKey(x.at)]=byDay[dayKey(x.at)]||[]).push(x); });

  const now=new Date(); now.setDate(1);
  now.setMonth(now.getMonth()-(st.calOff|0));
  const y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const lead=(first.getDay()+6)%7;                       /* Monday first */
  const title=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const todayK=dayKey(Date.now());
  const ym=y+'-'+String(m+1).padStart(2,'0');

  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<div></div>');
  for(let dn=1;dn<=last.getDate();dn++){
    const k=dayKey(new Date(y,m,dn,12));
    const list=byDay[k]||[];
    const isToday=k===todayK;
    const future=new Date(y,m,dn)>new Date();
    const done=list.some(x=>x.done || x.kind==='all');
    const miss=list.length && list.every(x=>x.kind==='none');
    const pc=calDone(list);
    const onlyOpened=!list.length && opens.has(k);
    const mins=list.reduce((a,x)=>a+(Number(x.actual)||Number(x.mins)||0),0);
    const vol=list.reduce((a,x)=>a+(x.items||[]).reduce((b,it)=>
      b+((it.unit==='s')?0:(Number(it.got)?Number(it.reps)||0:0)),0),0);

    /* full teal finished, teal weakening with how much was left undone,
       amber only for a day logged as not trained */
    const bg = done ? 'var(--deep)'
      : miss ? 'var(--amber)'
      : list.length ? 'rgba(0,102,99,'+(0.30+0.50*pc).toFixed(2)+')'
      : onlyOpened ? 'rgba(0,64,61,.07)' : 'transparent';
    const on = done || miss || list.length;
    const fg = (done||miss||(list.length&&pc>0.42)) ? 'var(--on-primary)'
      : list.length ? 'var(--deep)'
      : future ? 'rgba(17,17,17,.18)' : 'var(--grey2)';
    const t=calParts(list);
    const tip = done ? 'Whole session'+(t.of?', '+t.got+' of '+t.of+' drills':'')+(mins?', '+mins+' min':'')
      : miss ? 'Logged as not trained'
      : list.length ? (t.of ? t.got+' of '+t.of+' drills' : 'Part of the session')+(mins?', '+mins+' min':'')
      : onlyOpened ? 'Opened the app, nothing logged'
      : future ? '' : 'Nothing logged';
    const sel=st.calDay===k;
    const tap=(list.length||onlyOpened)?"onclick=\"calPick('"+k+"')\"":'';
    cells.push(`<button ${tap} title="${esc(tip)}" style="aspect-ratio:1;padding:0;border-radius:12px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      background:${bg};cursor:${tap?'pointer':'default'};
      border:1px solid ${sel?'var(--deep)':isToday?'var(--forest)':on?'transparent':'rgba(0,64,61,.07)'};
      ${sel?'box-shadow:0 0 0 2px rgba(0,64,61,.18)':''}">
      <span style="font:${on?'700':'400'} 12.5px/1 var(--sans);color:${fg}">${dn}</span>
      ${list.length&&!done&&pc>0&&pc<1
        ? `<span style="width:66%;height:3px;border-radius:2px;background:rgba(255,255,255,.38);
            overflow:hidden"><i style="display:block;height:100%;width:${Math.round(pc*100)}%;
            background:#fff"></i></span>`
        : mins?`<span style="font:600 9px/1 var(--sans);font-variant-numeric:tabular-nums;
            color:${(done||miss)?'rgba(247,244,241,.85)':'var(--grey2)'}">${mins}m</span>`
        : onlyOpened?`<span style="width:12px;height:3px;border-radius:2px;
            background:rgba(0,64,61,.22)"></span>`:''}
    </button>`);
  }
  const head=['M','T','W','T','F','S','S'].map(x=>
    `<div style="text-align:center;font:600 9px/1 var(--sans);letter-spacing:.1em;
      color:var(--grey2)">${x}</div>`).join('');
  const key=(sw,t)=>`<span style="display:inline-flex;align-items:center;gap:6px;
    font:400 11.5px/1 var(--sans);color:var(--grey)">
    <i style="width:11px;height:11px;border-radius:3px;${sw}"></i>${t}</span>`;

  /* the month, as one line */
  const mDays=Object.keys(byDay).filter(k=>k.slice(0,7)===ym);
  const mAll=mDays.flatMap(k=>byDay[k]);
  const mSess=mAll.filter(x=>x.done).length;
  const mPart=mAll.length-mSess;
  const mMins=mDays.reduce((a,k)=>a+byDay[k].reduce((b,x)=>b+(Number(x.actual)||Number(x.mins)||0),0),0);
  const mOpens=[...opens].filter(k=>k.slice(0,7)===ym).length;
  /* drills and sets this month, and everything since the first session */
  const sums=list=>list.reduce((a,x)=>{ a.drills+=(x.drills||new Set((x.items||[]).map(i=>i.v)).size||0);
    a.sets+=(x.items||[]).reduce((b,it)=>b+(Number(it.got)||0),0) || (x.got||0); return a; },{drills:0,sets:0});
  const mS=sums(mAll);
  const allS=sums(ss);
  const allMins=ss.reduce((a,x)=>a+(Number(x.actual)||Number(x.mins)||0),0);
  const firstAt=ss.length?Math.min(...ss.map(x=>x.at)):0;
  const weeks=firstAt?Math.max(1,Math.round((Date.now()-firstAt)/(7*86400000))):0;
  /* "6 sessions" here and "8% sticking to it" two cards away were counting
     two different things and both calling it a session: this counted every
     entry, adherence counts only the ones finished. A screen whose whole job
     is to be believed cannot have two definitions of its own noun. Whole
     sessions are sessions; the rest are named as what they are. */
  const whole=ss.filter(x=>x.done).length, part=ss.length-whole;
  const sinceLine = ss.length
    ? `Since ${new Date(firstAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}: `
      +`${whole} session${whole===1?'':'s'} finished`
      +(part?` &middot; ${part} part`:'')
      +` &middot; ${hm(allMins*60000)} &middot; ${allS.drills} drills &middot; ${allS.sets} sets`
      +(weeks>1?` &middot; ${(whole/weeks).toFixed(1)} a week`:'')
    : '';

  return `<div class="card" style="padding:20px">
    <div style="display:flex;align-items:center;gap:10px">
      <button onclick="calShift(1)" aria-label="Previous month"
        style="flex:none;width:34px;height:34px;border-radius:11px;border:1px solid rgba(0,64,61,.14);
        background:#fff;cursor:pointer;color:var(--deep);font:600 15px/1 var(--sans)">&lsaquo;</button>
      <span style="flex:1;text-align:center">
        <span style="display:block;font:400 19px/1.1 var(--serif)">${esc(title)}</span>
        <span style="display:block;font:400 11.5px/1.4 var(--sans);color:var(--grey2);margin-top:5px">${
          (mSess||mPart)
            ? (mSess?mSess+' session'+(mSess===1?'':'s')+' finished':'')
              +(mPart?(mSess?' &middot; ':'')+mPart+' part':'')
              +(mMins?' &middot; '+hm(mMins*60000):'')
              +(mS.drills?' &middot; '+mS.drills+' drills':'')+(mS.sets?' &middot; '+mS.sets+' sets':'')
            : 'Nothing logged'}</span></span>
      <button onclick="calShift(-1)" aria-label="Next month" ${(st.calOff|0)?'':'disabled'}
        style="flex:none;width:34px;height:34px;border-radius:11px;
        border:1px solid rgba(0,64,61,${(st.calOff|0)?'.14':'.06'});background:#fff;
        cursor:${(st.calOff|0)?'pointer':'default'};font:600 15px/1 var(--sans);
        color:${(st.calOff|0)?'var(--deep)':'rgba(17,17,17,.18)'}">&rsaquo;</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:16px 0 6px">${head}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${cells.join('')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:13px;margin-top:15px">
      ${key('background:var(--deep)','Whole session')}
      ${key('background:rgba(0,102,99,.55)','Part of it')}
      ${key('background:var(--amber)','Not trained')}
      ${key('background:rgba(0,64,61,.07)','Opened only')}
    </div>
    <div style="font:400 12px/1.5 var(--sans);color:var(--grey2);margin-top:11px">
      ${mOpens} day${mOpens===1?'':'s'} opened, ${mDays.filter(k=>byDay[k].some(x=>x.done)).length} with a session finished.
      ${mDays.length?'Tap a day for the exercises.':''}</div>
    ${sinceLine?`<div style="font:500 12px/1.5 var(--sans);color:var(--deep);margin-top:8px;padding-top:10px;
      border-top:1px solid rgba(0,64,61,.1)">${sinceLine}</div>`:''}
    ${st.calDay?calDayDetail(byDay[st.calDay]||[], st.calDay, opens):''}
  </div>`;
}

    ${list.map(x=>{

        </div>
        <div style="font:400 12.5px/1.55 var(--sans);color:var(--grey);margin-top:5px">
          ${t.of?t.got+' of '+t.of+' sets':(x.got||0)+' of '+(x.of||0)+' steps'}${
            mins?' &middot; '+mins+' min':''}
          ${done?'':(x.stoppedAt?'<br>Stopped at '+esc(x.stoppedAt):'')}</div>
        ${items.length?`<div style="display:flex;flex-direction:column;gap:4px;margin-top:10px">
          ${items.map(it=>{
            const got=Number(it.got)||0, of=Number(it.of)||0;

              font:400 12.5px/1.4 var(--sans);padding:7px 10px;border-radius:10px;

              ${none||part?'':'border:1px solid rgba(0,64,61,.08)'}">

      </div>`;}).join('')}
  </div>`;
}
