# netlify.toml — London Handstand Academy
# Pins the functions directory and explicitly protects the serverless
# endpoints so Netlify Form Detection (or path ambiguity) can never
# intercept them and return an HTML page instead of JSON.

[build]
  functions = "netlify/functions"
  publish   = "."

# Force the subscribe function POST to always hit the function directly,
# never a Netlify-generated form-handler HTML response.
[[redirects]]
  from   = "/.netlify/functions/subscribe"
  to     = "/.netlify/functions/subscribe"
  status = 200
  force  = true

# Same protection for the coaching-apply function (when deployed).
[[redirects]]
  from   = "/.netlify/functions/coaching-apply"
  to     = "/.netlify/functions/coaching-apply"
  status = 200
  force  = true

# Same again for the app API — it POSTs JSON, so form detection would
# break sign-in and messaging in exactly the way described above.
[[redirects]]
  from   = "/.netlify/functions/app/*"
  to     = "/.netlify/functions/app/:splat"
  status = 200
  force  = true

# The app and coach view call /api/app/… so the front end never has to
# know it is talking to a function.
[[redirects]]
  from   = "/api/app/*"
  to     = "/.netlify/functions/app/:splat"
  status = 200
  force  = true

# Tidy URLs for the two app pages (publish = "." serves from the root).
[[redirects]]
  from   = "/app"
  to     = "/lha-app.html"
  status = 200

[[redirects]]
  from   = "/coach"
  to     = "/lha-coach.html"
  status = 200

# Client-facing pages should never be indexed.
[[headers]]
  for = "/lha-app.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/lha-coach.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/hannah-mirman-program"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
