# netlify.toml — London Handstand Academy
# Pins the functions directory and explicitly protects the serverless
# endpoints so Netlify Form Detection (or path ambiguity) can never
# intercept them and return an HTML page instead of JSON.

[build]
  functions = "netlify/functions"
  publish   = "."

# The preview build is a development tool: the real app with every API call
# stubbed out and fake data in front of it. It is useful on staging and has
# no business on the live domain, so production strips it before publishing.
# It stays in the repo so it can be regenerated — see tools/make_preview.py.
# The press masterclass draft is unfinished: it is kept in the repo to work
# on and never published. Its address shows a holding page instead.
[context.production]
  command = "rm -f lha-app-preview.html masterclass-wall-press-draft.html"

# Both redirect rules that used to sit here were rejected by every build —
# "Invalid /.netlify path in redirect source". A rule cannot have /.netlify as
# its source, so neither ever ran, and the comment above them claimed a
# protection that did not exist. Forms are not enabled on this project, so
# there is nothing for a form handler to intercept in the first place.

# The retired apps. Each is a whole copy of the ladder from before the
# paywall as it is now: lha-app-backup has four stages free, the old
# handstand-ladder-app opens every level for a newsletter address, and all
# three were still live at their old addresses, one of them linked from the
# footer of old workshop pages. They stay in the repo as history and are
# never served: anybody arriving at one lands in the app.
[[redirects]]
  from = "/handstand-ladder-app"
  to = "/lha-app.html"
  status = 301
  force = true
[[redirects]]
  from = "/handstand-ladder-app.html"
  to = "/lha-app.html"
  status = 301
  force = true
[[redirects]]
  from = "/lha-app-backup"
  to = "/lha-app.html"
  status = 301
  force = true
[[redirects]]
  from = "/lha-app-backup.html"
  to = "/lha-app.html"
  status = 301
  force = true
[[redirects]]
  from = "/lha-app-pre-redesign"
  to = "/lha-app.html"
  status = 301
  force = true
[[redirects]]
  from = "/lha-app-pre-redesign.html"
  to = "/lha-app.html"
  status = 301
  force = true
