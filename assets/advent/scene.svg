<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
<style>
.snow1{animation:fall 14s linear infinite}
.snow2{animation:fall2 24s linear infinite}
.tw{animation:tw 3.4s ease-in-out infinite}
.tw2{animation:tw 4.6s ease-in-out 1.2s infinite}
.fig{transform-box:view-box;transform-origin:210px 478px;animation:sway 3.6s ease-in-out infinite}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(600px)}}
@keyframes fall2{from{transform:translate(0,0)}to{transform:translate(-14px,600px)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
@media (prefers-reduced-motion:reduce){.snow1,.snow2,.tw,.tw2,.fig{animation:none}}
