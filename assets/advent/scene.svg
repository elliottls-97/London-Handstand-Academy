<linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fbfc"/><stop offset="1" stop-color="#d9e9ee"/></linearGradient>
<radialGradient id="glow" cx=".8" cy=".14" r=".35"><stop offset="0" stop-color="#fff6dc" stop-opacity=".35"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></radialGradient>
</defs>
