/* ── intake ────────────────────────────────────────────────────────
   Four screens. Level is the only one that places anyone — goal never
   touches the stage, because someone who has never been upside down and
   wants a one-arm is still a beginner, and that is exactly the person a
   goal-driven placement would break. Goal earns its place by reframing
   the work ("a one-arm is a handstand you can hold without thinking, so
   that is what we build first") and by ordering the explainers. */
const GOALS=[
  {v:'learn',    t:'Learn to handstand',        d:"I'm starting from the beginning."},
  {v:'hold',     t:'Hold a freestanding handstand', d:"I can get upside down, but can't balance consistently."},
  {v:'improve',  t:'Improve my handstand',      d:'I want a better line, control and technique.'},
  {v:'advanced', t:'Learn advanced skills',     d:'Presses, shapes, one-arm and beyond.'},
];

/* Four rungs. Wrist tissue adapts slower than everything else, which is
   why the cap is physiology rather than a judgement about them — and why
   the copy says so. */
const LEVELS=[
  {v:0, t:'I have never done handstands', d:'Never been upside down.',
   days:[2,3],   def:2, mins:[15,30,45]},
  {v:1, t:"I'm stuck at the wall",        d:"I can kick up, but can't balance.",
   days:[2,3],   def:3, mins:[15,30,45]},
  {v:2, t:'I can briefly balance',        d:'A few seconds, but not consistently.',
   days:[3,4],   def:3, mins:[15,30,45,60]},
  {v:3, t:'I can hold it',                d:'Ten seconds or more.',
   days:[3,4,5], def:4, mins:[15,30,45,60]},
];

const NIGGLES=['Wrists','Shoulders','Neck or back','Elbows','Something else','Nothing right now'];
const MINS=[[15,'Short and focused'],[30,'A proper session'],[45,"I'm ready to put the work in"],[60,'Handstands are a priority']];

const intake = () => (st.intake=st.intake||{});
const levelDef = () => LEVELS.find(l=>l.v===intake().level) || LEVELS[0];

/* "How well we know you", never "how far along you are" — a training bar
   that starts above zero is a lie, and one that drops when we add a
   question later is worse than none. */
function profilePct(){
  const a=intake(); let n=20;                 /* opening the app is the first rung */
  if(a.goal) n+=15; if(a.level!=null) n+=20;
  if(a.niggles) n+=15; if(a.mins&&a.days) n+=15;
  if(a.baseline) n+=15;
  return Math.min(100,n);
}

const INTAKE_STEPS=[
  {id:'goal',  kick:'WHAT YOU WANT',  q:'What are you here to achieve?',
   sub:'This shapes how I explain things — not where you start.'},
  {id:'level', kick:'WHERE YOU ARE',  q:'Tell us about your handstand.',
   sub:'This is the one that sets your stage.'},
  {id:'niggles',kick:'ANYTHING SORE', q:'Anything I should know about?',
   sub:'Pick any that apply. It changes what you get given, not whether you can start.'},
  {id:'train', kick:'YOUR WEEK',      q:'How do you want to train?',
   sub:"Nothing binding — it just tells me what's realistic."},
];

function screenQuiz(){
  const i=Math.min(st.quizStep|0, INTAKE_STEPS.length-1), step=INTAKE_STEPS[i], a=intake();
  const rails=INTAKE_STEPS.map((_,n)=>`<i style="flex:1;height:4px;border-radius:99px;
    background:${n<=i?'var(--forest)':'rgba(0,102,99,.14)'}"></i>`).join('');
  const card=(on,body,click)=>`<button onclick="${click}" style="background:#fff;
    border:1px solid ${on?'var(--forest)':'rgba(17,17,17,.08)'};border-radius:16px;padding:15px 16px;
    box-shadow:${on?'0 0 0 3px rgba(0,102,99,.1)':'0 1px 2px rgba(17,17,17,.04)'};
    color:var(--ink);cursor:pointer;text-align:left;width:100%">${body}</button>`;
  const two=(t,d)=>`<div style="font:600 16px/1.25 var(--sans);color:var(--ink)">${esc(t)}</div>
    <div style="font:400 13.5px/1.4 var(--sans);color:var(--grey);margin-top:5px">${esc(d)}</div>`;

  let body='';
  if(step.id==='goal') body=GOALS.map(g=>
    card(a.goal===g.v, two(g.t,g.d), `pickIntake('goal','${g.v}')`)).join('');

  if(step.id==='level') body=LEVELS.map(l=>
    card(a.level===l.v, two(l.t,l.d), `pickIntake('level',${l.v})`)).join('');

  if(step.id==='niggles'){
    const sel=a.niggles||[];
    body=`<div style="display:flex;flex-wrap:wrap;gap:9px">${NIGGLES.map(x=>{
      const on=sel.indexOf(x)>=0;
      return `<button onclick="toggleNiggle('${esc(x)}')" style="background:${on?'var(--forest)':'#fff'};
        color:${on?'var(--on-primary)':'var(--ink)'};border:1px solid ${on?'var(--forest)':'rgba(17,17,17,.08)'};
        border-radius:999px;padding:12px 16px;
        font:600 13.5px/1 var(--sans);cursor:pointer">${esc(x)}</button>`;}).join('')}</div>
      <button class="btn" style="width:100%;margin-top:18px"
        onclick="nextIntake()">${sel.length?'Continue':'Nothing to flag'}</button>`;
  }

  if(step.id==='train'){
    const L=levelDef();
    body=`<div style="font:600 10.5px/1 var(--sans);letter-spacing:.16em;color:var(--grey2)">HOW LONG</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:10px">
        ${MINS.filter(([m])=>L.mins.indexOf(m)>=0)
          .map(([m,d])=>card(a.mins===m, two(m+' minutes',d), `pickIntake('mins',${m})`)).join('')}</div>
      <div style="font:600 10.5px/1 var(--sans);letter-spacing:.16em;color:var(--grey2);margin-top:20px">HOW OFTEN</div>
      <div style="display:flex;gap:9px;margin-top:10px;flex-wrap:wrap">
        ${L.days.map(n=>`<button onclick="pickIntake('days',${n})" style="flex:1;min-width:74px;
          background:${a.days===n?'var(--forest)':'#fff'};
          color:${a.days===n?'var(--on-primary)':'var(--ink)'};
          border:1px solid ${a.days===n?'var(--forest)':'rgba(17,17,17,.08)'};border-radius:16px;padding:16px 8px;
          font:700 16px/1 var(--sans);cursor:pointer">${n}×</button>`).join('')}</div>
      <div style="font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:12px">
        Plus two short wrist and mobility days. ${esc(capLine())}</div>
      ${a.mins&&a.days?`<button class="btn" style="width:100%;margin-top:18px"
        onclick="finishIntake()">See where you land</button>`:''}`;
  }

  /* .scroll, because #app is a fixed-height flex column with overflow
     hidden — without it the last step runs past the fold and the button
     that finishes the quiz cannot be reached. */
  return `<div class="scroll s" style="background:#F2EFEB;color:var(--ink)">
    <div style="min-height:100%;padding:calc(env(safe-area-inset-top) + 22px) 24px 34px;
    display:flex;flex-direction:column;
    animation:${i%2?'riseB':'rise'} .5s cubic-bezier(.2,.8,.2,1) both">
    <div style="display:flex;gap:5px">${rails}</div>
    <div style="margin-top:22px;font:600 10.5px/1 var(--sans);letter-spacing:.16em;
      color:var(--grey2)">${step.kick} · ${i+1} OF ${INTAKE_STEPS.length}</div>
    <div style="margin-top:11px;font:400 30px/1.08 var(--serif);color:var(--deep)">${esc(step.q)}</div>
    <div style="font:400 14.5px/1.5 var(--sans);color:var(--grey);margin-top:9px">${esc(step.sub)}</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:24px">${body}</div>
    ${i>0?`<button onclick="st.quizStep=${i-1};save();render()" style="background:none;border:none;
      color:var(--grey2);font:500 13px/1 var(--sans);cursor:pointer;margin-top:22px;padding:10px">← Back</button>`:''}
    </div></div>`;
}

/* the cap, explained as physiology rather than as a verdict on them */
function capLine(){
  const L=levelDef(), max=L.days[L.days.length-1];
  return max<=3
    ? 'Three sessions of up to 45 minutes is the most that helps at this stage — wrists adapt slower than everything else.'
    : 'More than five stops helping and starts costing you wrists.';
}

function pickIntake(k,v){
  intake()[k]=v; save();
  if(k==='goal'||k==='level'){ nextIntake(); return; }
  /* changing level can invalidate a frequency that is no longer offered */
  const L=levelDef();
  if(L.days.indexOf(intake().days)<0) delete intake().days;
  if(L.mins.indexOf(intake().mins)<0) delete intake().mins;
  render();
}
function toggleNiggle(x){
  const a=intake(); let s2=a.niggles||[];
  if(x==='Nothing right now') s2=s2.indexOf(x)>=0?[]:[x];
  else { s2=s2.filter(y=>y!=='Nothing right now');
         s2 = s2.indexOf(x)>=0 ? s2.filter(y=>y!==x) : s2.concat([x]); }
  a.niggles=s2; save(); render();
}
function nextIntake(){
  const a=intake();
  if(!a.niggles && (st.quizStep|0)===2) a.niggles=[];
  st.quizStep=Math.min((st.quizStep|0)+1, INTAKE_STEPS.length-1); save(); render();
}
function finishIntake(){
  const a=intake(), L=levelDef();
  st.stage=L.v; st.time=a.mins||30; st.perWeek=a.days||L.def;
  st.quizDone=true; st.oriented=false;
  st.tab = st.email ? 'home' : 'joinFree';
  save(); sendIntake(); render();
}
/* the answers are worth having on the coach's side, not just in a browser */
function sendIntake(){
  if(!st.token) return;
  fetch(AUTH.intake,{method:'POST',headers:authed(),
    body:JSON.stringify({intake:st.intake||{},stage:st.stage})}).catch(()=>{});
}

/* ── asking a question ─────────────────────────────────────────────
   Separate from the chat on purpose: a question has one job, it either
   has an answer or it does not, and it should still be findable next to
   its answer months later — which a thread cannot do. */
function loadQuestions(){
  if(!st.token) return;
  fetch(AUTH.questions,{headers:authed()}).then(r=>r.ok?r.json():null)
    .then(d=>{ if(d&&d.questions){ st.qs=d.questions; save();
      if(st.tab==='home'||st.tab==='more') render(); } }).catch(()=>{});
}
function askQuestion(){
  const el=$('#askQ'); const t=((el&&el.value)||'').trim();
  const say=m=>{ const e2=$('#askQMsg'); if(e2) e2.textContent=m; };
  if(!t){ say('Type your question first.'); return; }
  if(!st.token){ say('Create an account and I can answer you.'); return; }
  say('Sending…');
  fetch(AUTH.questions,{method:'POST',headers:authed(),body:JSON.stringify({body:t})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that')))
    .then(()=>{ if(el) el.value=''; st.askDraft=''; save(); loadQuestions();
                say('Sent. I answer these myself, usually within 48 hours.'); })
    .catch(e=>say(String(e)));
}

/* ── moving up ─────────────────────────────────────────────────────
   st.stage was only ever set by the quiz, so once placed there was no way
   up the ladder at all — and nothing on screen said what moving up would
   even take. The marker is the stage's own hold target, which was already
   written into STAGES and never shown as a thing to aim at. */
function stageReady(){
  const s=STAGES[curStage()];
  const goal=parseInt(s.hold,10)||30;
  return (st.bestHold||0) >= goal;
}
function advanceStage(){
  const next=curStage()+1;
  if(next>=STAGES.length){ alert("You're at the top of the ladder."); return; }
  if(stageLocked(next)){ openOv('stage'); st.ovStage=next; save(); render(); return; }
  if(!confirm('Move up to '+STAGES[next].n+'?\n\nYou can always drop back down.')) return;
  st.stage=next; save(); sendIntake(); render();
}
/* not stepBack — the player already owns that name for rewinding a step,
   and this one being defined later was quietly winning */
function dropStage(){
  if(curStage()<=0) return;
  if(!confirm('Drop back to '+STAGES[curStage()-1].n+'?')) return;
  st.stage=curStage()-1; save(); sendIntake(); render();
}
function retakeIntake(){
  if(!confirm('Retake the questions?\n\nYour training history stays — this only changes where you are placed.')) return;
  st.quizDone=false; st.oriented=false; st.quizStep=0; save(); st.tab='quiz'; render();
}

/* what it takes to move up, and the way to do it */
/* how much of you the plan actually knows. It sat on the ladder, where it was
   the first thing between you and the ladder itself. */
function knowCard(){
  const pct=profilePct();
  if(pct>=100) return '';
  return `<div class="card" style="padding:16px 18px;margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <span class="kick2">HOW WELL I KNOW YOU</span>
      <span style="font:700 13px/1 var(--sans)">${pct}%</span></div>
    <div style="height:6px;border-radius:3px;background:var(--mist);margin-top:10px;overflow:hidden">
      <i style="display:block;height:100%;width:${pct}%;background:var(--forest)"></i></div>
    <div style="font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:9px">
      ${st.intake&&st.intake.baseline?'Answer a few more and the plan gets sharper.'
        :'Film a baseline clip and I can place you properly rather than taking your word for it.'}</div></div>`;
}

function nextStageCard(){
  const s=STAGES[curStage()], next=STAGES[curStage()+1];
  const goal=parseInt(s.hold,10)||30, best=st.bestHold||0;
  const pct=Math.min(100,Math.round(best/goal*100));
  const ready=stageReady();
  return `<div class="card" style="padding:20px">
    <div class="kick2">MOVING UP</div>
    <div class="h-md" style="font-size:20px;margin-top:8px">
      ${next?'Next: '+esc(next.n):"You're at the top"}</div>
    <div style="font:400 14px/1.55 var(--sans);color:var(--grey);margin-top:8px">
      ${next
        ? 'The marker for '+esc(s.n)+' is <b>'+esc(s.hold)+'</b> — '+esc((s.goal||'').toLowerCase())
        : 'Nothing above this one. Keep sharpening what you have.'}</div>
    ${next?`
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px">
        <span style="font:600 11px/1 var(--sans);letter-spacing:.12em;color:var(--grey2)">YOUR BEST</span>
        <span style="font:700 13px/1 var(--sans)">${best}s of ${goal}s</span></div>
      <div style="height:6px;border-radius:3px;background:var(--mist);margin-top:9px;overflow:hidden">
        <i style="display:block;height:100%;width:${pct}%;background:${ready?'var(--forest)':'var(--amber)'}"></i></div>
      <div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:10px">
        ${ready ? "You've hit the marker. Move up whenever you're ready."
                : 'Use the hold timer to log an attempt — that is what fills this bar.'}</div>
      <button class="btn" style="width:100%;margin-top:14px;${ready?'':'background:var(--mist);color:var(--forest)'}"
        onclick="advanceStage()">${ready?'Move up to '+esc(next.n):"Move up anyway"}</button>
      <div style="font:400 11.5px/1.5 var(--sans);color:var(--grey2);text-align:center;margin-top:8px">
        Nothing is locked by the marker — it is a guide, and you can drop back.</div>`:''}
    </div>`;
}

/* the two escape hatches, small and at the foot of the page rather than
   inside a card that has been taken off both screens */
function placementLinks(){
  return `<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:18px 16px 4px">
    ${curStage()>0?`<button onclick="dropStage()" style="background:none;border:none;cursor:pointer;
      font:500 12px/1 var(--sans);color:var(--grey2);text-decoration:underline;
      text-underline-offset:3px;padding:4px">Drop back a stage</button>`:''}
    <button onclick="retakeIntake()" style="background:none;border:none;cursor:pointer;
      font:500 12px/1 var(--sans);color:var(--grey2);text-decoration:underline;
      text-underline-offset:3px;padding:4px">Retake the questions</button>
  </div>`;
}

/* ── explainers ────────────────────────────────────────────────────
   The questions that get asked before anyone asks anything else. Three
   are open to everyone; the rest need an account, because an address is
   a fair price for the whole library and no price at all for a taste. */
const FAQS=[
  {q:'Why do my wrists hurt?',                      v:'', dur:'3 min', tag:'Wrists'},
  {q:'How often should I practise handstands?',     v:'', dur:'4 min', tag:'Programming'},
  {q:'Do I need to be strong to start?',            v:'', dur:'3 min', tag:'Strength'},
  {q:'How to safely fall out of a handstand',       v:'', dur:'4 min', tag:'Bailing'},
  {q:'How long does it take to learn a handstand?', v:'', dur:'3 min', tag:'Progress'},
  {q:'What alignment really feels like',            v:'', dur:'4 min', tag:'Shapes'},
];
const FREE_EXPLAINERS=3;
const explainerOpen = i => i < FREE_EXPLAINERS || !!st.token;
/* v is a filename in the R2 bucket the explainers already live in */
/* one a day, rotating, so there is a reason to come back rather than a
   library to binge and forget */
const explainerToday = () =>
  FAQS[Math.floor(Date.now()/86400000) % FAQS.length];

/* ── today ─────────────────────────────────────────────────────────
   Landing on the ladder meant landing on five stage cards and a choice.
   This is the screen that says what to do now — the ladder is still
   there to browse, it is just no longer the front door. */
function weekTarget(){ return st.perWeek || levelDef().def; }
function sessionsThisWeek(){
  const wk=Date.now()-7*864e5;
  return sessionsDone().filter(x=>x.at>wk).length;
}
function trainedToday(){
  const k=new Date().toISOString().slice(0,10);
  return sessionsDone().some(x=>new Date(x.at).toISOString().slice(0,10)===k);
}

/* the ask box filters the explainer list in place. It deliberately does not
   call render(): that swaps #app's innerHTML and the caret goes with it. */
function askMatches(q){
  q=(q||'').trim().toLowerCase();
  if(q.length<3) return '';
  const words=q.split(/\s+/).filter(w=>w.length>2);
  const hits=FAQS.map((f,i)=>({f,i})).filter(({f})=>words.some(w=>f.q.toLowerCase().includes(w)));
  if(!hits.length) return `<div style="margin-top:10px;padding:12px 14px;border-radius:13px;
    background:rgba(0,102,99,.07)">
    <p style="margin:0;font:500 13.5px/1.45 var(--sans);color:var(--forest)">No video on that yet.
      ${st.token?'Ask me and I answer it myself.':'Add an email and you can ask me directly.'}</p>
    <button class="btn2" style="width:100%;margin-top:10px"
      onclick="${st.token?"go('coaching')":"st.tab='joinFree';save();render()"}">
      ${st.token?'Ask Elliott':'Create an account'}</button></div>`;
  return `<div style="margin-top:10px">
    <p style="margin:0 0 8px;font:600 10px/1 var(--sans);letter-spacing:.13em;color:var(--grey2)">
      ${hits.length} VIDEO${hits.length===1?'':'S'}</p>
    <div style="display:flex;flex-direction:column;gap:7px">
    ${hits.map(({f,i})=>`<div onclick="${explainerOpen(i)?`openExplainer(${i})`
        :`st.tab='joinFree';save();render()`}"
      style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;background:#fff;
      border:1px solid rgba(0,102,99,.09);cursor:pointer">
      <span style="width:28px;height:28px;border-radius:9px;background:var(--sand);display:grid;
        place-items:center;flex:none">
        <svg width="10" height="12" viewBox="0 0 17 19" fill="#006663"><path d="M16 8.63a1 1 0 0 1 0
          1.74L1.5 18.6A1 1 0 0 1 0 17.73V1.27A1 1 0 0 1 1.5.4z"></path></svg></span>
      <span style="flex:1;font:500 13.5px/1.3 var(--sans)">${esc(f.q)}</span>
      <span style="font:500 12px/1 var(--sans);color:var(--grey2)">${explainerOpen(i)?'':'🔒'}</span>
    </div>`).join('')}</div></div>`;
}
function askFilter(v){
  st.q=v; save();
  const box=document.getElementById('askmatches');
  if(box) box.innerHTML=askMatches(v);
}
function openExplainer(i){ st.exOpen=i; openOv('explainer'); }

function screenHome(){
  const S=STAGES[curStage()]||STAGES[0];
  const done=sessionsThisWeek(), target=weekTarget();
  const didToday=trainedToday();
  const ex=explainerToday();
  const exIdx=FAQS.indexOf(ex);
  const hour=new Date().getHours();
  const hello = hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  const name=(st.client||'').split(' ')[0]||'';

  const cs=curStage();
  const _plan=weekPlan(), _idx=nextDayIdx(), _day=_plan?_plan[_idx]:null;
  const sessTitle=_day?_day.n:S.n;
  const sessCount=(_day?_day.drills:(S.drillIds||[])).length;

  return `<div class="scroll s">
    <div class="hero">
      <div class="h-lg rise" style="max-width:22ch">${hello}. ${didToday

      <!-- the ladder, as five segments. Filled to where you are; the one you
           are on sits slightly taller so it reads without needing a label. -->
      <div class="rise rise-1" style="display:flex;gap:6px;margin-top:15px">
        ${STAGES.map((sg,i)=>`<div onclick="go('ladder')" style="flex:1;cursor:pointer;padding-bottom:2px">
          <div style="height:4px;border-radius:99px;transform:scaleY(${i===cs?1.6:1});
            background:${i<=cs?'var(--on-primary)':'rgba(236,231,226,.2)'}"></div>
          <span style="display:block;margin-top:7px;font:600 9.5px/1 var(--sans);letter-spacing:.1em;
            color:${i===cs?'rgba(236,231,226,.92)':'rgba(236,231,226,.42)'}">${esc(SHORT[i]||'')}</span>
        </div>`).join('')}
      </div>

      <div style="height:1px;background:rgba(236,231,226,.16);margin:14px 0 12px"></div>

      <div class="rise rise-2" style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
        <div style="font:400 20px/1.1 var(--serif)">${esc(sessTitle)}</div>
        <span style="flex:none;font:500 11.5px/1 var(--sans);color:rgba(236,231,226,.6)">
          ${st.time||30} min · ${sessCount} drill${sessCount===1?'':'s'}</span>
      </div>

      <button onclick="openOv('mode')" style="margin-top:11px;width:100%;border:0;border-radius:14px;
        padding:13px;background:var(--bg);color:var(--deep);font:600 15px/1 var(--sans);cursor:pointer">
        ${didToday?'Go again':'Start the session'}</button>

      <button onclick="st.introOpen=!st.introOpen;save();render()" style="margin-top:10px;width:100%;
        display:flex;align-items:center;gap:10px;border:1px solid rgba(236,231,226,${done?0.2:0.4});
        border-radius:12px;padding:9px 12px;background:rgba(236,231,226,${done?0.05:0.13});cursor:pointer">
        <span style="width:26px;height:26px;flex:none;border-radius:50%;background:rgba(236,231,226,.9);
          display:grid;place-items:center">
          <svg width="9" height="11" viewBox="0 0 17 19" fill="#00403D"><path d="M16 8.63a1 1 0 0 1 0
            1.74L1.5 18.6A1 1 0 0 1 0 17.73V1.27A1 1 0 0 1 1.5.4z"></path></svg></span>
        <span style="flex:1;text-align:left;font:600 13.5px/1.2 var(--sans);color:var(--on-primary)">
          ${st.introOpen?'Hide the intro':done?'How the ladder works':'New here? Watch this first'}</span>
        <span style="font:400 12px/1 var(--sans);color:rgba(236,231,226,.6)">2 min</span>
        <span style="font:400 13px/1 var(--sans);color:rgba(236,231,226,.6);
          transform:rotate(${st.introOpen?180:0}deg)">⌄</span>
      </button>
      ${st.introOpen?(LADDER_INTRO_VIDEO
        ? `<video src="${LADDER_INTRO_VIDEO}" controls playsinline preload="none"
             style="width:100%;border-radius:16px;margin-top:14px;background:#11150f;display:block"></video>`
        : videoPlaceholder('How the handstand ladder works','2 min',true)):''}
    </div>

    <div style="padding:16px 16px 26px;display:flex;flex-direction:column;gap:11px">

      <!-- the week, collapsed to a strip. Tapping it opens the same day list
           that used to sit in its own card. -->
      ${(function(){
        const plan=weekPlan();
        const idx=plan?nextDayIdx():-1;
        /* seven days, Monday first, from this week's actual dates — so a chip
           is filled because you trained that day, not because of a counter. */
        const now=new Date();
        const mon=new Date(now); mon.setHours(0,0,0,0);
        mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
        const trained=new Set(sessionsDone().map(x=>new Date(x.at).toDateString()));
        const chips=['M','T','W','T','F','S','S'].map((L,i)=>{
          const dt=new Date(mon); dt.setDate(mon.getDate()+i);
          const isToday=dt.toDateString()===now.toDateString();
          const did=trained.has(dt.toDateString());
          return `<div onclick="st.weekOpen=!st.weekOpen;save();render()" style="flex:1;min-width:0;
            height:30px;border-radius:9px;display:grid;place-items:center;cursor:pointer;
            font:600 11.5px/1 var(--sans);
            background:${isToday?'var(--forest)':did?'var(--sage)':'rgba(17,17,17,.05)'};
            color:${isToday?'var(--on-primary)':did?'var(--deep)':'var(--grey2)'}">${L}</div>`;
        }).join('');
        return `<div style="border-radius:18px;background:rgba(255,255,255,.5);
          border:1px solid rgba(17,17,17,.08)">
          <div onclick="st.weekOpen=!st.weekOpen;save();render()"
            style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer">
            <span style="flex:none;font:600 10.5px/1 var(--sans);letter-spacing:.12em;
              color:var(--grey)">WEEK</span>
            <div style="flex:1;display:flex;gap:5px;min-width:0">${chips}</div>
            <span style="flex:none;font:600 10.5px/1 var(--sans);letter-spacing:.1em;
              color:var(--grey2)">${done}/${target}</span>
            <span style="flex:none;font:400 13px/1 var(--sans);color:var(--grey2);
              transform:rotate(${st.weekOpen?180:0}deg)">⌄</span>
          </div>
          ${st.weekOpen&&plan?`<div class="rail" style="display:flex;gap:9px;overflow-x:auto;
            scroll-snap-type:x mandatory;padding:2px 14px 14px;-webkit-overflow-scrolling:touch">
            ${plan.map((dd,n)=>{
              const on=n===idx, past=n<idx, rest=/wrist|mobility|rest/i.test(dd.n+' '+(dd.sub||''));
              return `<div onclick="st.weekOpen=false;save();render()" style="flex:none;width:128px;
                scroll-snap-align:start;padding:13px;border-radius:18px;cursor:pointer;
                border:1px solid ${on?'transparent':'rgba(17,17,17,.1)'};
                background:${on?'var(--forest)':rest?'rgba(255,255,255,.45)':'#fff'};

                </div>
                <p style="margin:8px 0 0;font:400 16px/1.18 var(--serif);
                  color:${on?'var(--on-primary)':rest?'var(--grey2)':'var(--ink)'}">${esc(dd.n)}</p>
                <span style="display:block;margin-top:7px;font:500 12px/1 var(--sans);
                  color:${on?'rgba(236,231,226,.55)':'var(--grey2)'}">${esc(dd.sub||'')}</span>
              </div>`;}).join('')}
          </div>`:''}
        </div>`;})()}


    </div>

    <!-- the explainers, as the design has them: one question box, then a rail
         of video cards. The accordion this replaces held the same list; the
         lock is unchanged — the first few are open, an account opens the rest. -->
    <section class="rise rise-3" style="padding:4px 0 0">
      <div style="padding:0 16px 12px">
        <input id="askq" value="${esc(st.q||'')}" oninput="askFilter(this.value)"
          placeholder="Ask anything — I check the videos first"
          style="width:100%;border:1px solid rgba(17,17,17,.13);border-radius:14px;padding:13px 14px;
          background:#fff;font:400 14.5px/1.3 var(--sans)">
        <div id="askmatches">${askMatches(st.q||'')}</div>
      </div>

      <div class="rail" style="display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
        padding:4px 16px 8px;-webkit-overflow-scrolling:touch">
        ${FAQS.map((q,i)=>{
          const open=explainerOpen(i);
          const grad = i%2 ? '#DCECF0,#9FC9D4' : '#CFE6EC,#5E9DB2';
          return `<div onclick="${open?`openExplainer(${i})`:`st.tab='joinFree';save();render()`}"
            style="flex:none;width:214px;scroll-snap-align:center;cursor:pointer">
            <div style="position:relative;aspect-ratio:16/10;border-radius:20px;overflow:hidden;
              opacity:${open?1:.74};background:linear-gradient(150deg,${grad})">

              <div style="position:absolute;right:11px;bottom:11px;width:34px;height:34px;border-radius:50%;
                background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.65);display:grid;
                place-items:center">
                <svg width="11" height="13" viewBox="0 0 17 19" fill="#111"><path d="M16 8.63a1 1 0 0 1 0
                  1.74L1.5 18.6A1 1 0 0 1 0 17.73V1.27A1 1 0 0 1 1.5.4z"></path></svg></div>
            </div>
            <p style="margin:11px 2px 0;font:400 16px/1.25 var(--serif);color:var(--ink)">${esc(q.q)}</p>
            <div style="display:flex;align-items:center;gap:8px;padding:7px 2px 0">
              <span style="font:500 12px/1 var(--sans);color:var(--grey)">${esc(q.dur||'')}</span>
              <span style="width:3px;height:3px;border-radius:99px;background:rgba(17,17,17,.2)"></span>

    <!-- keep your progress. Replaces the create-an-account button that used to

    ${st.token?'':`<section class="rise rise-4" style="padding:26px 16px 0">
      <div style="border-radius:22px;padding:18px;background:rgba(0,102,99,.055);

          Add an email and your stage, holds and finished sessions come back on any device.</p>
        <button class="btn" style="width:100%;margin-top:14px"
          onclick="st.tab='joinFree';save();render()">Save my progress</button>
      </div>
    </section>`}

    ${placementLinks()}
    <div style="height:26px"></div></div>`;
}

/* ── ladder home ── */
function screenLadder(){
  const s=STAGES[curStage()];
  const best=st.bestHold||0;
  const goal=parseInt(s.hold,10)||30;
  const pct=Math.min(100,Math.round(best/goal*100));
  const knowPct=profilePct();
  const profileBar = knowPct>=100 ? '' : `<div style="background:rgba(255,255,255,.08);border-radius:18px;
    padding:14px 16px;margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <span style="font:600 11px/1 var(--sans);letter-spacing:.13em;color:var(--sage)">HOW WELL I KNOW YOU</span>
      <span style="font:700 13px/1 var(--sans)">${knowPct}%</span></div>
    <div style="height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:10px;overflow:hidden">
      <i style="display:block;height:100%;width:${knowPct}%;background:var(--sand)"></i></div>
    <div style="font:400 12.5px/1.5 var(--sans);color:var(--sage);margin-top:9px">
      ${st.intake&&st.intake.baseline?'Answer a few more and the plan gets sharper.'
        :'Film a baseline clip and I can place you properly rather than taking your word for it.'}</div></div>`;
  const cards=STAGES.map((x,i)=>{
    const state=i<curStage()?'done':i===curStage()?'current':'locked';
    const bg=state==='current'?'#fff':state==='done'?'rgba(255,255,255,.55)':'rgba(255,255,255,.4)';
    return `<button onclick="openStage(${i})" style="border:none;text-align:left;background:${bg};border-radius:22px;
      padding:16px 18px;cursor:pointer;width:100%;${state==='current'?'box-shadow:0 2px 20px rgba(28,32,25,.08)':''}">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:34px;height:34px;border-radius:999px;flex:none;display:grid;place-items:center;
          font:700 13px/1 var(--sans);background:${state==='locked'?'var(--mist)':'var(--forest)'};
          color:${state==='locked'?'var(--grey2)':'var(--bg)'}">${state==='done'?'✓':i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font:600 15px/1.2 var(--sans);color:${state==='locked'?'var(--grey2)':'var(--ink)'}">${esc(x.n)}</div>
          <div style="font:400 12.5px/1.4 var(--sans);color:var(--grey);margin-top:5px">${esc(x.goal)}</div></div>
        <span class="pill" style="flex:none;background:${
            stageLocked(i)?'rgba(200,122,86,.14)':state==='current'?'rgba(200,122,86,.14)':'transparent'};
          color:${stageLocked(i)||state==='current'?'var(--amber)':'var(--grey2)'}">${
          stageLocked(i)?'£5/MO':state==='current'?'NOW':state==='done'?'DONE':'LOCKED'}</span>
      </div></button>`;
  }).join('');
  return `<div class="scroll s">
    <div class="hero">

/* ── the week, for Foundations ─────────────────────────────────────
   Until now every free session drew from the whole stage pool, so three
   sessions a week were three shuffles of the same bag. A week should have
   a shape: get upside down, build the shapes, then the assisted work —
   plus two short wrist days, which is where the tissue actually adapts.

   Only Foundations has a written week so far. Other stages fall back to
   the whole pool, which is what they did before. */
const WEEK = {
  0: [
    {n:'Getting upside down', sub:'Kick ups and the wall',
     drills:['wall-kick-ups','chest-to-wall-handstand','chest-to-wall-bailouts','kick-up-bounces','wall-walks']},
    {n:'Shapes and strength', sub:'The pushing underneath it',
     drills:['chaturganga-push-ups','p-pike-pushups-knees','dd-float-drills','p-dd-toe-taps','palm-lifts-table-top']},
    {n:'Assisted work', sub:'Chair and wall, learning the line',
     drills:['p-l-handstand','chair-assisted-knee-lifts','chair-assisted-step-ups','wall-walks','chest-to-wall-handstand']},
  ],
};
const WRIST_DAY = {n:'Wrists and mobility', sub:'Short — this is the one that keeps you training',
  drills:['forearm-massage','wrist-circles-mob','dd-wrist-taps','palm-lifts-table-top',
          'shoulder-circles','heart-melting-pose']};

const weekPlan = () => WEEK[curStage()] || null;
/* which session is next: they rotate, and finishing one advances it */
function nextDayIdx(){
  const plan=weekPlan(); if(!plan) return 0;
  return ((st.planDay|0) % plan.length + plan.length) % plan.length;
}
function advanceDay(){
  const plan=weekPlan(); if(!plan) return;
  st.planDay=((st.planDay|0)+1)%plan.length; save();
}

/* ── how a session is ordered ──────────────────────────────────────
   Every session used to be the stage's drill list round-robined, which
   meant a wrist drill, then a wall walk, then back to a wrist drill —
   and stages 2 to 5 carry no prep drills at all, so they opened cold on
   shoulder shrugs or knees-on-box.

   Marina's and Hannah's programmes are built the way a session actually
   runs: wrists, then shoulders and general mobility, then the skill work
   with the easier drills first. That order is now the app's too, for the
   free ladder as well as a written plan. */
const RAMP = {
  wrists:    ['forearm-massage','wrist-circles-mob','wrist-flexion-ext',
              'wrist-weight-shift','plank-fingertip-lifts'],
  shoulders: ['shoulder-circles','scapula-shrugs','heart-melting-pose',
              'wall-shoulder-opener','downward-dog-pulses'],
  general:   ['upward-dog-to-plank','plank-pose','dolphin-lean-forwards',
              'downward-dog-elbow-lowers','wall-front-side-opener','floor-lateral-stretch'],
};
const RAMP_ALL = [].concat(RAMP.wrists, RAMP.shoulders, RAMP.general);

/* wrists always, then two from the shoulder and general pools. Kept to
   one set each and about a fifth of the session, so choosing 10 minutes
   still leaves time for the thing they came to train. */
function warmupFor(budgetSecs){
  const take=(list,n)=>list.map(drillById).filter(Boolean).slice(0,n);
  const picks=[].concat(take(RAMP.wrists,2), take(RAMP.shoulders,2), take(RAMP.general,1));
  const cap=budgetSecs*0.22;
  const out=[]; let secs=0;
  for(const d of picks){
    const it=Object.assign({},d,{d:d.d||FREE_DOSE[d.v]||'1 × 30s'});
    const t=work(it)+rest(it);
    if(out.length && secs+t>cap) break;
    out.push(it); secs+=t;
  }
  return {items:out, secs};
}

/* a session built from the current stage's drills, to fit the time chosen */
function buildFreeSession(wristDay,listOnly){
  const mins=st.time||30, s=STAGES[curStage()];
  /* prep drills belong in the warm-up, not scattered through the skill work */
  const plan=weekPlan();
  const dayDef = wristDay ? WRIST_DAY : (plan ? plan[nextDayIdx()] : null);
  const ids = dayDef ? dayDef.drills : s.drillIds;
  const pool=ids.filter(v=>RAMP_ALL.indexOf(v)<0).map(drillById).filter(Boolean)
    .map(d=>Object.assign({},d,{d:d.d||FREE_DOSE[d.v]||'3 × 8'}));
  if(!pool.length){ alert('Nothing filmed for this stage yet.'); return; }

  const budget=mins*60;
  const warm=warmupFor(budget);
  const out=warm.items.map((it,i)=>({it,gi:0,ii:i,set:1,sets:1,grp:'Warm-up'}));
  let secs=warm.secs;

  /* Then the skill work, easiest first — one set from each in turn, so a
     short session still covers the stage rather than three sets of the
     first thing and nothing else. */
  let round=0, added=true;
  while(added && secs<budget){
    added=false;
    for(const it of pool){
      const n=sets(it.d); if(round>=n) continue;
      const t=work(it)+rest(it);
      if(secs+t>budget){ added=false; break; }
      out.push({it,gi:0,ii:out.length,set:round+1,sets:n,grp:(dayDef&&dayDef.n)||s.n});
      secs+=t; added=true;
    }
    round++;
    if(round>6) break;
  }
  if(!out.length) out.push({it:pool[0],gi:0,ii:0,set:1,sets:1,grp:s.n});
  Q=out;
  if(listOnly){ st.ovList=!!wristDay; openOv('list'); return; }
  startQueue(0);
}

/* ── free sign-up, after the quiz ────────────────────────────────

let joinErr='';

/* ── forgotten password ────────────────────────────────────────── */
let resetStep=0, resetMsg='', resetEmail='';
function screenReset(){
  return `<div style="min-height:100dvh;background:linear-gradient(180deg,var(--forest),var(--ink));
    padding:calc(env(safe-area-inset-top) + 40px) 26px 30px;color:var(--bg);
    display:flex;flex-direction:column">
    <button class="back" style="color:rgba(242,239,231,.6);align-self:flex-start"
      onclick="resetStep=0;resetMsg='';st.tab='signin';save();render()">← Back</button>
    <div class="h-xl" style="font-size:36px;margin-top:auto">${resetStep?'Check your email':'Forgotten it?'}</div>
    <div style="font:400 15px/1.55 var(--sans);color:var(--sage);margin-top:12px">${
      resetStep ? 'I have sent a six digit code to '+esc(resetEmail)+'. It works for 15 minutes.'
                : 'Pop your email in and I will send you a code to set a new password.'}</div>
    <form onsubmit="${resetStep?'doResetConfirm':'doResetRequest'}(event)"
      style="display:flex;flex-direction:column;gap:10px;margin-top:22px">
      ${resetStep?`
        <input id="rsCode" inputmode="numeric" autocomplete="one-time-code" required
          placeholder="Six digit code"
          style="background:rgba(255,255,255,.08);border:none;border-radius:18px;padding:18px;
          font:400 18px/1 var(--sans);letter-spacing:.3em;color:var(--bg);outline:none">
        <input id="rsPw" type="password" autocomplete="new-password" required minlength="8"
          placeholder="New password (8+ characters)"
          style="background:rgba(255,255,255,.08);border:none;border-radius:18px;padding:18px;
          font:400 15px/1 var(--sans);color:var(--bg);outline:none">`
      :`<input id="rsEm" type="email" inputmode="email" autocomplete="email" required
          placeholder="you@example.com" value="${esc(st.email||'')}"
          style="background:rgba(255,255,255,.08);border:none;border-radius:18px;padding:18px;
          font:400 15px/1 var(--sans);color:var(--bg);outline:none">`}
      <button class="btn" type="submit" style="background:var(--bg);color:var(--ink);margin-top:4px">
        ${resetStep?'Set new password':'Send me a code'}</button>
      <div id="rsMsg" style="font:500 12.5px/1.5 var(--sans);color:var(--sand);
        text-align:center;min-height:18px">${esc(resetMsg)}</div>
    </form>
    ${resetStep?`<button onclick="resetStep=0;resetMsg='';render()"
      style="width:100%;background:none;border:none;margin-top:6px;font:500 13px/1 var(--sans);
      color:#8fbeca;cursor:pointer;padding:12px">Use a different email</button>`:''}
  </div>`;
}
function rsSay(m){ resetMsg=m; const el=$('#rsMsg'); if(el) el.textContent=m; }
function doResetRequest(ev){
  if(ev) ev.preventDefault();
  const em=(($('#rsEm')||{}).value||'').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ rsSay('That does not look like an email address.'); return; }
  rsSay('Sending…');
  fetch(AUTH.resetReq,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:em})})
    .then(()=>{ resetEmail=em; resetStep=1; resetMsg=''; render(); })
    /* the server answers the same either way, so a failure here is the
       network rather than a wrong address */
    .catch(()=>rsSay('Could not reach the server. Try again in a moment.'));
}
function doResetConfirm(ev){
  if(ev) ev.preventDefault();
  const code=(($('#rsCode')||{}).value||'').trim();
  const pw=($('#rsPw')||{}).value||'';
  if(pw.length<8){ rsSay('Password needs at least 8 characters.'); return; }
  rsSay('Setting it…');
  fetch(AUTH.resetGo,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:resetEmail,code:code,password:pw})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'That did not work')))
    .then(d=>{ st.email=resetEmail; st.token=d.token||null; resetStep=0; resetMsg='';
      st.tab='ladder'; save(); render(); loadEntitlement(); })
    .catch(e=>rsSay(String(e)));
}

/* never re-render on a validation error — it rebuilds the form and throws
   away what they typed */
function joinSay(msg){ joinErr=msg; const m=$('#joinMsg'); if(m) m.textContent=msg; }
function doJoin(ev){
  if(ev) ev.preventDefault();
  const em=(($('#joinEm')||{}).value||'').trim().toLowerCase();
  const pw=($('#joinPw')||{}).value||'';
  const mk=!!(($('#joinMk')||{}).checked);
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ joinSay('That does not look like an email address.'); return; }
  if(pw.length<8){ joinSay('Password needs at least 8 characters.'); return; }
  joinSay('Creating your account…');
  fetch(AUTH.signup,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:em,password:pw,marketing:mk,stage:curStage()})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not create that account')))
    .then(d=>{ joinErr=''; st.email=em; st.marketing=mk; st.plus=!!d.plus;
      if(d.token){ st.token=d.token; }          /* signed in, but not a coached client */
      st.tab='ladder'; save(); render(); })
    .catch(e=>{ joinSay(String(e)); });
}
/* letting them skip costs one address and keeps the app usable —
   they get asked again when they hit the paid stages */
/* A beginner can get going without giving us anything — three explainers
   and the ladder are enough to be useful. From stage 2 up we ask, because
   by then the app is tracking something worth not losing. */
const emailOptional = () => curStage() === 0;
function skipJoin(){ st.joinSkipped=true; st.tab='home'; save(); render(); }

function startFree(){ st.mode='free'; st.tab=st.quizDone?'home':'quiz'; st.quizStep=0; st.quizAns=[]; save(); render(); }

/* ── max hold timer (free tier) ── */
let holdT=null,holdS=0;
function drawHold(){
  const mm=String(Math.floor(holdS/60)),ss=String(holdS%60).padStart(2,'0');
  $('#ov').innerHTML=`<div class="ovhead"><button class="back" onclick="stopHold();closeOv()">← Back</button>
    <div class="h-lg" style="margin-top:16px">Max hold</div>
    <div style="font:400 14px/1.5 var(--sans);color:var(--sage);margin-top:8px">
      Best so far ${st.bestHold||0}s. Start it, kick up, stop it when you come down.</div></div>
    <div style="padding:40px 18px;text-align:center">
      <div class="h-xl" style="font-size:96px;color:var(--forest)">${holdS>=60?mm+':'+ss:holdS}</div>
      <div class="kick2" style="margin-top:12px">SECONDS</div>
      <button class="btn" style="margin-top:30px" onclick="toggleHold()">${holdT?'Stop':'Start'}</button>
      ${holdS&&!holdT?`<button class="btn2" style="width:100%;margin-top:10px" onclick="saveHold()">Save ${holdS}s as my best</button>`:''}
    </div>`;
}
function toggleHold(){ if(holdT){ clearInterval(holdT); holdT=null; } else { holdS=0; holdT=setInterval(()=>{holdS++;drawHold();},1000); } drawHold(); }
function stopHold(){ if(holdT){clearInterval(holdT);holdT=null;} holdS=0; }
function saveHold(){ if(holdS>(st.bestHold||0)) st.bestHold=holdS;
  save(); reportProgress({hold:st.bestHold||0}); stopHold(); closeOv(); }

    backdrop-filter:blur(${sc?22:0}px) saturate(180%);-webkit-backdrop-filter:blur(${sc?22:0}px) saturate(180%);
    border-bottom:1px solid rgba(17,17,17,${sc?.08:0})">
    <span style="flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
      transition:background .45s,color .45s;background:${sc?'var(--forest)':'var(--on-primary)'};
      color:${sc?'var(--on-primary)':'var(--forest)'};font:800 11px/1 var(--sans)">LHA</span>
    <span style="flex:1;font:600 12px/1 var(--sans);letter-spacing:.18em;
      transition:color .45s;color:${sc?'var(--grey)':'rgba(247,244,241,.75)'}">${label}</span>
    <button onclick="openChat()" aria-label="Messages"
      style="${chip};position:relative;width:34px;height:34px;border-radius:999px;
      color:${sc?'var(--forest)':'var(--on-primary)'};display:grid;place-items:center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0
        1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0
        0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
      ${waiting?`<span style="position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:999px;
        background:var(--amber);border:2px solid var(--forest)"></span>`:''}
    </button>
    ${st.token?`<button onclick="openOv('account')" aria-label="Your account"
      style="${chip};border-radius:999px;padding:4px 12px 4px 4px;display:flex;align-items:center;gap:8px">
      <span style="width:26px;height:26px;border-radius:999px;transition:background .45s,color .45s;
        background:${sc?'var(--forest)':'var(--on-primary)'};color:${sc?'var(--on-primary)':'var(--forest)'};
        display:grid;place-items:center;font:800 10px/1 var(--sans)">${esc(initials)}</span>
      <span style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
        <span style="font:600 12.5px/1 var(--sans);transition:color .45s;
          color:${sc?'var(--ink)':'var(--on-primary)'}">${esc(name||'You')}</span>
        <span style="font:600 8.5px/1 var(--sans);letter-spacing:.12em;
          transition:color .45s;color:${sc?'var(--grey2)':'rgba(247,244,241,.6)'}">${sub}</span></span></button>`
    :`<button onclick="st.tab='signin';save();render()" style="${chip};border-radius:999px;padding:8px 14px;
      color:${sc?'var(--forest)':'var(--on-primary)'};font:600 12px/1 var(--sans)">Sign in</button>`}
  </div>`;
}

/* the bar sits over the hero and inverts once you scroll past it. Rendering
   from st.scrolled would redraw the whole screen on every scroll tick, so the
   bar is restyled in place and only the flag is kept. */
function watchScroll(){
  const sc=$('#app .scroll'); if(!sc) return;
  const apply=()=>{
    const on=sc.scrollTop>20;
    if(on===!!st.scrolled) return;
    st.scrolled=on;
    const bar=document.getElementById('topbar'); if(!bar) return;
    const old=bar.outerHTML; const next=topBar();
    if(old!==next) bar.outerHTML=next;
  };
  sc.addEventListener('scroll', apply, {passive:true});
  apply();
}

function render(){
  const app=$('#app');
  /* swapping innerHTML throws the scroll container back to the top, which
     reads as the page jumping to the top mid-tap. Put it back whenever we
     are redrawing the screen the reader is already on. */
  const was=app.querySelector('.scroll');
  const keepTop=(was && app.dataset.screen===st.tab) ? was.scrollTop : 0;
  const swap=html=>{
    app.innerHTML=html; app.dataset.screen=st.tab;
    const now=app.querySelector('.scroll'); if(now && keepTop) now.scrollTop=keepTop;
  };
  /* accent tells you which product you are in without reading a word:
     sand for the free ladder, amber for coached */
  document.documentElement.style.setProperty('--accent', st.in?'var(--amber)':'var(--sand)');
  document.body.dataset.tier = st.in?'coached':'free';
  if(st.tab==='reset'){ swap(screenReset()); return; }
  if(st.tab==='signin' && !st.in){ swap(screenSignIn()); return; }
  if(!st.mode && !st.in){ swap(screenWelcome()); return; }
  if(st.mode==='free' && !st.quizDone && st.tab==='quiz'){ swap(screenQuiz()); return; }
  /* shown once, between finishing the quiz and the ladder */
  if(st.quizDone && !st.oriented && !st.in && st.intake && st.intake.level!=null){
    swap(screenOriented()); return; }
  if(!st.in && st.quizDone && !st.email && !(st.joinSkipped && emailOptional())){
    swap(screenJoin()); return; }
  const coached=coachedView();
  const screens=coached
    ? {today:screenToday,plan:screenPlan,progress:screenProgress,ask:screenAsk,more:screenMore}
    : {home:screenHome,ladder:screenLadder,progress:screenProgress,coaching:screenCoaching,more:screenMore};
  const tabs=TABS[coached?'coached':'free'];
  if(!screens[st.tab]) st.tab=tabs[0][0];
  const bar=tabs.map(([id,l])=>`<button class="tab ${st.tab===id?'on':''}" onclick="go('${id}')"><i></i><span>${l}</span></button>`).join('');
  swap(topBar()+screens[st.tab]()+`<nav class="tabbar">${bar}</nav>`);
  watchScroll();
  lazyThumbs();
}
document.addEventListener('DOMContentLoaded',function(){
  /* cache first so a signed-in client sees their plan instantly, then
     refresh in the background in case it changed since last time */
  if(st.in && st.token) loadCachedProgramme();
  render();
  if(st.token){ loadEntitlement(); loadSubmissions(); loadQuestions(); }
  if(st.in && st.token){ loadProgramme(); loadProgress(); }
  if(st.token) reportProgress();
});
render();
</script>
