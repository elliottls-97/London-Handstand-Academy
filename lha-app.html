<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* an inline display beats the browser's own [hidden] rule, and several of
   these panels carry one */
[hidden]{display:none!important}
:root{
 /* Repainted from the Claude Design Today canvas. Same token names so
    nothing downstream had to change — only what they resolve to. Warm
    neutral ground, deep teal doing the work forest green used to, pale
    blue where sand was, and terracotta kept but retuned: it is the only
    warning colour in the app and teal cannot carry that meaning. */
 --bg:#ece7e2; --page:#e4dfda; --forest:#006663; --forest-d:#00403d; --ink:#111111;
  --sand:#cfe6ec; --sage:#8fbeca; --grey:#5a5a5a; --grey2:#686868;
 --mist:#e3ded8; --red:#a4503c; --line:rgba(17,17,17,.12);
 /* roles the full-app source showed that the Today file alone did not:
    an off-white that sits on teal, an amber accent, and the deep teal
    used for text on pale grounds */
 --on-primary:#f7f4f1; --amber:#f3a949; --deep:#00403d;
 /* sage is a fill colour; as a word on teal it lands near 3:1, so text
    gets its own lighter tint rather than the bar's */
 --sage-t:#d6e9f0;
 --serif:Newsreader,Georgia,serif; --sans:Figtree,system-ui,sans-serif;
}
body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--ink);
 -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
 /* the page itself never scrolls — only .scroll does, so the tab bar stays put */
 height:100dvh;overflow:hidden}
.s::-webkit-scrollbar{display:none}.s{scrollbar-width:none}
/* the stage you are on breathes, so the eye finds it without a label */
@keyframes lhaNow{0%,100%{box-shadow:0 0 0 0 rgba(243,169,73,0)}
  50%{box-shadow:0 0 0 7px rgba(243,169,73,.22)}}
@keyframes lhaRow{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
 background:var(--bg);overflow:hidden}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:34%;width:7px;height:7px;border-radius:2px;
  opacity:0;transform:rotate(var(--a)) translateY(0);
  animation:pop 900ms cubic-bezier(.2,.7,.3,1) var(--t) 1 both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes riseB{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn,.btn2{transition:background .3s,transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.btn:active,.btn2:active{transform:scale(.98)}
.card{transition:box-shadow .4s,transform .4s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){
 .btn:hover{background:#007a75}
 .btn2:hover{background:rgba(0,102,99,.05)}
 .rail>div:hover{transform:translateY(-3px)}
}
.rail>div{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
}
@keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes riseB{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(101%)}to{transform:none}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
/* one class so a section can be given the design's entrance and its delay */
#app[data-still="1"] .rise,
#app[data-still="1"] [style*="animation:rise"],
#app[data-still="1"] [style*="animation:riseB"]{animation:none!important}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.rise-1{animation-delay:.1s}.rise-2{animation-delay:.16s}
.rise-3{animation-delay:.3s}.rise-4{animation-delay:.36s}
@media (prefers-reduced-motion:reduce){
  .rise,[style*="animation:rise"],[style*="animation:shimmer"]{animation:none!important}
}
@keyframes pop{0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.4)}
  15%{opacity:1}
  100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d)*-1)) scale(1) }}
@media(prefers-reduced-motion:reduce){.burst{display:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px}
/* The top bar is fixed and 67px tall: 10 + a 44px control + 12. Anything
   less than that here puts the first line of the hero underneath it, which
   is how the greeting and the stage title both ended up sliced. */
.hero{position:relative;overflow:hidden;
 padding:calc(env(safe-area-inset-top) + 79px) 22px 16px;
 background:linear-gradient(178deg,#0a7b74,#046e68);color:var(--bg);border-radius:0 0 30px 30px}
.hero::before{content:'';position:absolute;top:-120px;right:-90px;width:280px;height:280px;
 border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,rgba(143,190,202,.22),transparent 70%)}
.hero>*{position:relative}
body[data-tier=free] .hero{background:linear-gradient(180deg,#0a7b74,#006663)}
body[data-tier=free] .btn{background:#0a7b74}
.kick{font:600 10px/1 var(--sans);letter-spacing:.2em;color:var(--sage-t)}
.kick2{font:600 9.5px/1 var(--sans);letter-spacing:.16em;color:var(--grey2)}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400}
.h-xl{font:400 40px/1.02 var(--serif)} .h-lg{font:400 34px/1.06 var(--serif)}
.h-md{font:400 26px/1.1 var(--serif)} .h-sm{font:400 22px/1 var(--serif)}
.card{background:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 2px 20px rgba(28,32,25,.06)}
.pad{padding:12px 16px 0}
.btn{border:none;width:100%;background:var(--forest);border-radius:18px;padding:18px;cursor:pointer;
 font:700 15px/1 var(--sans);color:var(--on-primary);display:block;
 transition:background .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.btn:hover{background:#007A75}
.btn:active{transform:scale(.98)}
.btn2{transition:background .3s,transform .25s cubic-bezier(.2,.8,.2,1)}
.btn2:hover{background:rgba(0,102,99,.05)}
.btn2:active{transform:scale(.98)}
.card{transition:box-shadow .4s,transform .4s cubic-bezier(.2,.8,.2,1)}
.rail>*{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.rail>*:active{transform:scale(.98)}
.btn small{display:block;font:500 11px/1 var(--sans);letter-spacing:.1em;color:var(--sage-t);margin-top:8px}
.btn2{flex:1;text-align:center;font:600 13px/1 var(--sans);color:var(--forest);padding:14px;cursor:pointer;
 border-radius:16px;border:1.5px solid var(--line);background:none}
.pill{font:600 9.5px/1 var(--sans);letter-spacing:.14em;padding:7px 10px;border-radius:999px}
.tabbar{flex:none;display:flex;background:#fff;border-top:1px solid rgba(28,32,25,.08);
 padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 12px;cursor:pointer;
 border:none;background:none;position:relative;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tab:active{transform:scale(.94)}
.tab i{transition:background .35s}
.tab span{transition:color .35s,font-weight .35s}
.tab i{width:7px;height:7px;border-radius:999px;background:transparent;display:block}
.tab.on i{background:var(--amber)}
body[data-tier=free] .tab.on i{background:var(--sand)}
/* primary navigation: the quiet grey is too quiet for the one control
   that is always on screen */
.tab span{font:500 11.5px/1 var(--sans);color:var(--grey)}
.tab.on span{font-weight:700;color:var(--ink)}
.ov{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,30,28,.45);
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
 align-items:flex-end;justify-content:center}
.ov.on{display:flex;animation:fade .3s both}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
 background:rgba(250,248,246,.94);backdrop-filter:blur(28px) saturate(180%);
 -webkit-backdrop-filter:blur(28px) saturate(180%);
 border-radius:28px 28px 0 0;padding:12px 18px calc(env(safe-area-inset-bottom) + 28px);
 animation:sheetUp .45s cubic-bezier(.2,.9,.2,1) both}
.grab{width:38px;height:4px;border-radius:99px;background:rgba(17,17,17,.18);margin:0 auto 16px}
.sheet.drag{transition:none}
.ov.full{align-items:stretch}
.ov.full .sheet{max-height:100%;height:100%;border-radius:0;
 padding-top:calc(env(safe-area-inset-top) + 10px);animation:fade .25s both}
.fsbtn{position:absolute;top:10px;right:12px;border:none;background:rgba(17,17,17,.06);
 border-radius:999px;padding:7px 12px;font:600 11px/1 var(--sans);color:var(--grey);cursor:pointer}
.sheet{position:relative}
.sheet h2.st{margin:0;padding-right:110px;font:400 24px/1.05 var(--serif);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.ov.on,.sheet{animation:none!important}}
.ovhead{background:var(--forest);padding:calc(env(safe-area-inset-top) + 18px) 22px 22px;color:var(--bg)}
/* text links that are still buttons: padding gives them a target without
   moving them visually */
.back{font:500 13px/1 var(--sans);color:var(--sage-t);cursor:pointer;background:none;border:none;
 padding:11px 2px;min-height:44px;display:inline-flex;align-items:center}
video{width:100%;display:block;background:#000}
.row{padding:15px 18px;border-bottom:1px solid rgba(28,32,25,.07)}
.row:last-child{border-bottom:none}
.box{width:24px;height:24px;border-radius:8px;border:2px solid rgba(28,32,25,.2);flex:none;
 display:grid;place-items:center;font-size:13px;color:transparent;cursor:pointer;background:#fff}
.box.on{background:var(--forest);border-color:var(--forest);color:#fff}
/* This started life as a label-sized chip and is now the stepper on every
   check point, so it has to take a thumb: 44px, not 25. */
.rt{font:600 12px/1 var(--sans);border-radius:999px;padding:0 14px;cursor:pointer;
 min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;
 border:1px solid var(--line);background:#fff;color:var(--grey)}
.rt.easy.on{background:var(--sage);color:#fff;border-color:transparent}
.rt.hard.on{background:var(--amber);color:#fff;border-color:transparent}
.why{display:inline-flex;align-items:center;gap:9px;margin-top:10px;background:var(--mist);
 border-radius:999px;padding:8px 13px;cursor:pointer;border:none}
.why b{font:700 11.5px/1 var(--sans);color:var(--forest)}
.why span{font:500 11.5px/1 var(--sans);color:#007a75}
input,textarea{font-family:var(--sans);font-size:16px;color:var(--ink)}
.act{
  border:1px solid var(--line,rgba(0,0,0,.14)); background:#fff; color:var(--ink);
  border-radius:999px; padding:0 18px; cursor:pointer; min-height:44px;
  display:inline-flex; align-items:center; justify-content:center;
  font:600 13px/1 var(--sans); white-space:nowrap;
}
.act:active{transform:translateY(1px)}
.act:focus-visible{outline:2px solid var(--forest); outline-offset:2px}

/* ── follow-along player ─────────────────────────────────────────
   Ported from the programme pages, which read better than the dark
   version this replaced: stone ground, whole video visible rather
   than cropped, cues on screen while you work. */
/* ── the tutorial's glass ──────────────────────────────────────────
   Frosted rather than solid, so the screen it is describing stays
   readable through it. Falls back to a near-opaque panel where
   backdrop-filter is not supported. */
.tour-card{position:absolute;left:12px;right:12px;border-radius:24px;padding:18px 19px 15px;
  background:rgba(246,243,239,.82);border:1px solid rgba(255,255,255,.62);
  box-shadow:0 26px 60px -26px rgba(0,20,19,.75),inset 0 1px 0 rgba(255,255,255,.85);
  animation:tourIn .4s cubic-bezier(.2,.9,.2,1) both;
  transition:top .4s cubic-bezier(.2,.9,.2,1)}
/* the words change, the card does not arrive again */
.tour-card.is-swap .tour-kick,.tour-card.is-swap .tour-h,.tour-card.is-swap .tour-b{
  animation:tourSwap .26s cubic-bezier(.2,.9,.2,1) both}
.tour-card.is-swap .tour-h{animation-delay:.03s}
.tour-card.is-swap .tour-b{animation-delay:.06s}
@keyframes tourSwap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.tour-hole{position:absolute;border-radius:20px;pointer-events:auto;
  box-shadow:0 0 0 9999px rgba(0,42,40,.62),inset 0 1px 0 rgba(255,255,255,.5),
  0 0 40px -8px rgba(207,230,236,.5);border:1.5px solid rgba(255,255,255,.6);
  transition:top .4s cubic-bezier(.2,.9,.2,1),left .4s cubic-bezier(.2,.9,.2,1),
  width .4s cubic-bezier(.2,.9,.2,1),height .4s cubic-bezier(.2,.9,.2,1)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tour-card{background:rgba(246,243,239,.58);backdrop-filter:blur(22px) saturate(1.5);
    -webkit-backdrop-filter:blur(22px) saturate(1.5)}
}
@keyframes tourIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tour-card,.tour-hole{animation:none!important;transition:none!important}
  .tour-card.is-swap .tour-kick,.tour-card.is-swap .tour-h,.tour-card.is-swap .tour-b{animation:none!important}}
.tour-kick{font:600 10px/1 var(--sans);letter-spacing:.14em;color:var(--forest)}
.tour-h{font:400 21px/1.15 var(--serif);color:var(--deep);margin-top:9px}
.tour-b{font:400 14.5px/1.55 var(--sans);color:#4a4a4a;margin-top:8px}
.tour-dots{display:flex;gap:5px;margin-top:14px}
.tour-dots i{width:5px;height:5px;border-radius:99px;background:rgba(17,17,17,.16);
  transition:width .3s ease,background .3s ease}
.tour-dots i.on{width:16px;background:var(--forest)}
.tour-skip{border:0;background:none;cursor:pointer;padding:10px 2px;
  font:600 13.5px/1 var(--sans);color:var(--grey2)}
.tour-back{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.5);
  border-radius:13px;cursor:pointer;padding:11px 16px;font:600 13.5px/1 var(--sans);color:var(--ink)}
.tour-go{border:0;border-radius:13px;cursor:pointer;padding:11px 20px;
  font:600 13.5px/1 var(--sans);background:var(--forest);color:var(--on-primary);
  box-shadow:0 8px 20px -10px rgba(0,102,99,.9)}
#player{position:fixed;inset:0;z-index:990;background:#f4f1ed;color:var(--ink);
 display:none;flex-direction:column;overflow:hidden}
#player.on{display:flex}
#player.resting{background:#ece7e2}
.p-bar{flex:none;height:calc(52px + env(safe-area-inset-top,0px));
 padding:env(safe-area-inset-top,0px) 10px 0 16px;display:flex;align-items:center;
 justify-content:space-between;gap:10px;background:#fff;border-bottom:1px solid rgba(28,32,25,.1)}
.p-idx{font:700 11.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--grey2)}
.p-clock{font:400 21px/1 var(--serif);font-variant-numeric:tabular-nums}

.p-track{flex:none;height:3px;background:rgba(28,32,25,.09)}

.p-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

.dr-d{display:block;font:500 11.5px/1 var(--sans);color:var(--grey2);margin-top:6px}

<script>
let DATA={
  /* Deliberately empty. Plans arrive from /api/app/programme, chosen by the
     signed-in client's token. A real plan used to sit here, which meant one
     client's programme — and the personal note at the top of it — shipped to
     everyone who opened this file. */
  days:[{id:'1',label:'Day 1',sub:'',title:'Day 1',when:'',mins:'0',groups:[]}],
  read:[], test:{blurb:'',items:[]}

/* ── session queue ── */
/* One row is one set, so a row must not print the whole dose. Three rows
   each reading "3 x 8" and "set 1 of 3" is nine sets of eight to anyone
   reading it, and it was counted as nine. A row shows what one set is. */
function perSet(dose, nSets){
  const d=String(dose||'');
  if(!(nSets>1)) return d;
  let m=/^\s*\d+\s*[×x]\s*(.+)$/.exec(d);
  if(!m) m=/^\s*\d+\s*sets?\s*(?:·|,|-)?\s*(.+)$/i.exec(d);
  if(!m) return d;
  const one=m[1].trim();
  /* "3 × 8" leaves a bare 8, and "2 × 5–8" a bare range; neither is a dose */
  return /^\d+(\s*[–—-]\s*\d+)?$/.test(one) ? one+' reps' : one;
}
function sets(dose){
  let m=/^\s*(\d+)\s*[×x]/.exec(dose); if(m) return +m[1];
  m=/^\s*(\d+)\s*sets?\b/i.exec(dose); if(m) return +m[1];
  return 1;
}
/* ── how long one set takes ────────────────────────────────────────
   There used to be two answers to this. The player counted work(), the
   drill list printed the dose, and a "3 x 8" that ran forty seconds
   matched neither — so the same session read as two different lengths
   depending on which screen you opened. Every screen asks this now.

   The rules, as Elliott set them:
     warm-up          30 seconds, whatever the drill says
     a timed hold     the time asked for, plus ten to get in and out
     reps             45 seconds
     build to / max   untimed, because the point is to stop when you stop */
const WARMUP_SECS = 30;   /* a warm-up is a warm-up, not a set */
const SETUP_SECS  = 10;   /* getting into and out of the shape */
const REPS_SECS   = 45;   /* long enough for a set of reps at any count */

/* the seconds inside a dose: "30s" is thirty, "3 x 30s" is thirty a set,
   "30s each way" is thirty each way, so sixty on the clock */
function doseSecs(d){
  const t=String(d||'');
  const m=/(\d+)\s*(?:s\b|sec)/i.exec(t);
  if(!m) return 0;
  const n=+m[1];
  return /each (?:way|side|leg|arm)/i.test(t) ? n*2 : n;
}
/* Whether this is a warm-up is decided by the block it is sitting in, not
   by the drill. Scapula shrugs warm the shoulders up and they are also the
   stage's strength work, and reading the drill rather than the block gave
   them thirty seconds in both places. */
const isWarm = x => WARM_GRP.test(String((x&&x.grp)||(x&&x.it&&x.it.grp)||''));

function work(it, grp){
  const ov=st.secs&&it.v?st.secs[it.v]:0; if(ov) return ov;
  /* what the coach set for this drill beats the rule everywhere */
  const set=(st.timing||{})[it.v];
  if(set && set.w) return set.w;
  /* a coached programme carries its own seconds, and the coach outranks
     the rules — this is only the ladder's default */
  if(it.w) return it.w;
  if(isWarm({grp:grp, it:it})) return WARMUP_SECS;
  const d=String(it.d||'');
  if(isHoldDose(d)) return 0;               /* untimed, they stop when they stop */
  const held=doseSecs(d);
  if(held) return held + SETUP_SECS;
  return REPS_SECS;
}
/* Rest is not one number, and it is decided by which block a drill sits in,
   not by its name. Matching on names put "Pancake Lift Combo" and "Press
   Scapula Shrugs" on a 90 second strength rest because they contain "lift"
   and "shrug", and put press walks there because the block starts "Press". */
const WARM_GRP = /warm|pancake|mobility|wrist/i;
const HARD_GRP = /^(strength|press)$/i;
function rest(x, i, list){
  /* takes a queue entry {it,grp} or a bare drill, so every caller works */
  const it  = (x && x.it) ? x.it : (x || {});
  const set=(st.timing||{})[it.v];
  if(set && set.r!=null) return set.r;
  /* On the ladder a session is one block named after the day, so the day
     name was deciding the rest for everything in it: a day called Strength
     put ninety seconds between wall walks. The drill's own grouping decides
     it where there is one, and the block name only where there is not. */
  const grp = String((x && x.g) || (x && x.grp) || it.grp || '').trim();
  const t   = ((it.n || '') + ' ' + (it.d || '')).toLowerCase();

  if(Array.isArray(list) && i != null){
    /* the first four of the session run straight through */
    if(i < 4 && WARM_GRP.test(String((list[i] && list[i].grp) || ''))) return 0;
  }
  if(WARM_GRP.test(grp)) return 10;
  if(HARD_GRP.test(grp)) return 90;
  if(/entries|build to/.test(t)) return 60;
  return 35;
}

function queue(){
  const d=day(), q=[];
  d.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    const n=sets(it.d);
    for(let k=0;k<n;k++) q.push({it,gi,ii,set:k+1,sets:n,grp:g.name});
  }));
  return q;
}

/* weeks in a row with at least one session logged, counting back from
   this week. It used to say three weeks whatever had happened. */
function weekStreak(){
  const ss=((st.prog&&st.prog.sessions)||[]).filter(x=>x&&x.at&&x.kind!=='none');
  if(!ss.length) return 0;
  const mondayOf=t=>{ const d=new Date(t); d.setHours(0,0,0,0);
    d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); };
  const weeks=new Set(ss.map(x=>mondayOf(x.at)));
  let cur=mondayOf(Date.now()), n=0;
  /* this week not being logged yet does not break a run */
  if(!weeks.has(cur)) cur-=7*864e5;
  while(weeks.has(cur)){ n++; cur-=7*864e5; }
  return n;
}

/* The explainers Elliott filmed are on Stream, addressed by uid, not in the
   R2 bucket the first ones went to. Stream makes its own still, so a cover
   image never needs uploading: 37 of them were, as JPGs, and Stream cannot
   ingest a JPG as video so not one of them will ever be ready. */
const STREAM_CDN='https://customer-pns1oongdltmkjwa.cloudflarestream.com/';
const streamMp4   = uid => STREAM_CDN+uid+'/downloads/default.mp4';
const streamThumb = uid => STREAM_CDN+uid+'/thumbnails/thumbnail.jpg?time=3s&height=320';
/* no extension on this one: /captions/en.vtt is a 404 and /captions/en is
   the file. An hour went into that difference. */
const streamVtt   = uid => STREAM_CDN+uid+'/captions/en';
/* ── captions ─────────────────────────────────────────────────────
   Stream generates these and serves a VTT per language. Two things make
   this more than a <track>:

   A cross-origin track only loads on a video marked crossorigin, and
   crossorigin turns the MP4 request into a CORS one, which the download
   URL fails: it answers 302 and the redirect carries no CORS header. So
   the cue sheet is fetched and drawn here instead of handed to the player.

   And the browser's own cue rendering is a white box in a sans face. The
   design Elliott gave is a glass plate low in the frame, the line in the
   display serif, one word lit at a time in #3f8f8c as it is spoken. That
   is the whole reason a person watches a muted clip to the end, so it is
   worth drawing ourselves.

   Captions are an addition. Every failure in here is silent and the film
   still plays. */
const CC_ACCENT = '#3f8f8c';
const CC_LINE   = 7;    /* words per line, broken on natural phrasing */

/* Words the machine hears but does not capitalise. Stream's transcription
   sentence-cases properly and then writes "actually on saturday the 26th
   september", which on a caption plate reads as a typo rather than as a
   transcript. Days, months and the names this business uses are the whole
   of the list: it corrects, it does not rewrite. */
const CC_PROPER = {};
('Monday Tuesday Wednesday Thursday Friday Saturday Sunday '
 +'January February March April May June July August September October November December '
 +'London England English British Elliott Suryava Tamzen OverGravity Shadwell '
 +'Instagram YouTube').split(' ').forEach(w=>{ CC_PROPER[w.toLowerCase()]=w; });
CC_PROPER['lha']='LHA';
function ccCase(w){
  /* keep whatever punctuation is hanging off the word, and use the name's
     own spelling: OverGravity is not Overgravity, which is what capitalising
     the first letter alone gave */
  const m=/^([^A-Za-z]*)([A-Za-z][A-Za-z'-]*)(.*)$/.exec(w);
  if(!m) return w;
  const fix=CC_PROPER[m[2].toLowerCase()];
  return fix ? m[1]+fix+m[3] : w;
}

/* Stream gives cue level timings, not word level, so a word's share of its
   line is taken from its length. Longer words take longer to say, which is
   crude and lands close enough that the highlight tracks the voice. */
function ccParse(text){
  const out=[];
  String(text||'').split(/\r?\n\r?\n/).forEach(block=>{
    const lines=block.split(/\r?\n/).filter(Boolean);
    const ti=lines.findIndex(l=>l.indexOf('-->')>-1);
    if(ti<0) return;
    const m=lines[ti].match(/(\d\d:\d\d:\d\d[.,]\d+)\s*-->\s*(\d\d:\d\d:\d\d[.,]\d+)/);
    if(!m) return;
    const secs=x=>{ const p=x.replace(',','.').split(':');
      return (+p[0])*3600+(+p[1])*60+parseFloat(p[2]); };
    const a=secs(m[1]), b=secs(m[2]);
    const raw=lines.slice(ti+1).join(' ').replace(/<[^>]*>/g,'').trim();
    const words=raw.split(/\s+/).filter(Boolean).map(ccCase);
    if(!words.length) return;

    /* Break on sentences first, then on seven words. Chunking straight to
       seven cut mid-sentence, so plate after plate opened on a lowercase
       word and read like a transcript with the tops sliced off. Sentences
       first means most plates start where a capital already is. */
    const groups=[]; let cur=[];
    words.forEach(w=>{ cur.push(w);
      if(/[.!?]["')\]]?$/.test(w)){ groups.push(cur); cur=[]; } });
    if(cur.length) groups.push(cur);

    const chunks=[];
    groups.forEach((g,gi)=>{
      for(let i=0;i<g.length;i+=CC_LINE)
        chunks.push({w:g.slice(i,i+CC_LINE), starts: i===0});
    });

    /* Stream cases its output properly, so a capital is only added where
       one is missing at the start of a sentence: a plate that opens
       mid-sentence keeps its lower case, which is what it should have. */
    const upper = x => x.charAt(0).toUpperCase()+x.slice(1);
    const shouted = !/[a-z]/.test(raw), whispered = !/[A-Z]/.test(raw);
    let seen=0;
    chunks.forEach(c=>{
      const n0=c.w.length;
      const share=n0/words.length;
      const from=a+(b-a)*(seen/words.length), to=from+(b-a)*share;
      seen+=n0;
      /* a cue with no capital anywhere is an engine that gave up on case;
         give it a sentence capital rather than leave it looking broken */
      if((c.starts || whispered) && !shouted) c.w=[upper(c.w[0])].concat(c.w.slice(1));
      const weight=c.w.reduce((t,w)=>t+w.length+1,0);
      let run=0;
      out.push({a:from, b:to, w:c.w.map(w=>{
        const at=from+(to-from)*(run/weight); run+=w.length+1; return {t:at, x:w};
      })});
    });
  });
  return out;
}

function ccPlate(){
  let el=document.getElementById('ccPlate');
  if(el) return el;
  el=document.createElement('div');
  el.id='ccPlate';
  el.style.cssText='position:absolute;left:50%;transform:translateX(-50%);bottom:11%;'
    +'width:calc(100% - 22px);display:flex;justify-content:center;pointer-events:none;'
    +'z-index:3;opacity:0;transition:opacity 160ms linear';
  el.innerHTML='<div id="ccRow" style="display:flex;flex-wrap:wrap;justify-content:center;'
    +'column-gap:.32em;row-gap:.08em;padding:.5em .92em;border-radius:999px;max-width:100%;'
    +'min-width:0;background:rgba(255,255,255,.10);backdrop-filter:blur(18px) saturate(160%);'
    +'-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.22);'
    +'box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.08),'
    +'0 12px 40px rgba(0,0,0,.35);font:600 16px/1.18 var(--serif);'
    +'letter-spacing:-.005em"></div>';
  return el;
}
/* one plate, moved to whichever video is playing, because two captioned
   videos on one screen is not a thing that happens and two plates is */
function ccDraw(v, cues){
  const host=v.parentElement; if(!host) return;
  const el=ccPlate();
  if(el.parentElement!==host){ host.style.position='relative'; host.appendChild(el); el.dataset.fit=''; }
  /* The plate is sized from the video, not from the viewport. Sized from the
     viewport it was the same height on a full screen vertical film and on a
     small explainer in a sheet, where it swallowed the picture. A horizontal
     film gets a fifth of its height at most, and sits inside the bottom
     fifth; a vertical one can afford a little more. */
  const box=v.getBoundingClientRect();
  if(box.height>40){
    const wide=box.width/box.height>1.2;
    const key=Math.round(box.width)+'x'+Math.round(box.height);
    if(el.dataset.fit!==key){
      el.dataset.fit=key;
      el.style.bottom=(wide?'6%':'10%');
      const row=el.firstChild;
      row.style.fontSize=Math.max(10, Math.min(box.height*(wide?0.062:0.05), 22)).toFixed(1)+'px';
      row.style.maxHeight=Math.round(box.height*0.2)+'px';
      row.style.overflow='hidden';
    }
  }
  const t=v.currentTime;
  const cue=cues.find(c=>t>=c.a-0.12 && t<=c.b+0.2);
  if(!cue || v.paused && !v.currentTime){ el.style.opacity='0'; return; }
  el.style.opacity='1';
  const row=el.firstChild;
  if(row.dataset.k!==String(cue.a)){
    row.dataset.k=String(cue.a);
    row.innerHTML=cue.w.map((w,i)=>`<span data-i="${i}" style="display:inline-block;
      color:rgba(255,255,255,.88);text-shadow:0 2px 10px rgba(0,0,0,.55);
      transition:color 120ms linear,transform 120ms ease-out;
      transform-origin:50% 70%">${esc(w.x)}</span>`).join('');
  }
  let active=-1;
  cue.w.forEach((w,i)=>{ if(t>=w.t) active=i; });
  [...row.children].forEach((sp,i)=>{
    const on=i===active;
    const want=on?CC_ACCENT:'rgba(255,255,255,.88)';
    if(sp.dataset.on!==String(on)){
      sp.dataset.on=String(on);
      sp.style.color=want;
      sp.style.transform=on?'scale(1.08)':'scale(1)';
      sp.style.textShadow=on
        ? '0 0 20px '+CC_ACCENT+'4d, 0 2px 10px rgba(0,0,0,.55)'
        : '0 2px 10px rgba(0,0,0,.55)';
      if(on) setTimeout(()=>{ if(sp.dataset.on==='true') sp.style.transform='scale(1)'; },240);
    }
  });
}
function attachCaptions(v, uid){
  if(!v || !uid || v.dataset.ccDone) return;
  v.dataset.ccDone='1';
  fetch(streamVtt(uid))
    .then(r=>r.ok?r.text():Promise.reject(r.status))
    .then(txt=>{
      const cues=ccParse(txt);
      if(!cues.length) return;
      let raf=0;
      const tick=()=>{ ccDraw(v,cues); raf=requestAnimationFrame(tick); };
      const stop=()=>{ cancelAnimationFrame(raf); raf=0;
        const el=document.getElementById('ccPlate');
        if(el && el.parentElement===v.parentElement) el.style.opacity='0'; };
      v.addEventListener('play', ()=>{ if(!raf) tick(); });
      v.addEventListener('pause', stop);
      v.addEventListener('ended', stop);
      v.addEventListener('seeked', ()=>ccDraw(v,cues));
      if(!v.paused) tick();
    })
    .catch(()=>{});
}
/* every explainer video on the page, whenever one is drawn */
function mountCaptions(){
  document.querySelectorAll('video[data-cc]').forEach(v=>attachCaptions(v, v.getAttribute('data-cc')));
}
/* The plate is positioned against the video's own box, so every captioned
   video gets a wrapper that is exactly the video and nothing else. Dropped
   into the card directly it measured against the card and the line floated
   somewhere under the film. */
const ccWrap = (inner, extra) =>
  `<div style="position:relative;line-height:0;${extra||''}">${inner}</div>`;
function qaVideo(a){
  const src = a.uid ? streamMp4(a.uid) : (a.v ? EXPLAINERS+encodeURIComponent(a.v) : '');
  if(!src) return '';
  setTimeout(mountCaptions,0);
  return ccWrap(`<video src="${src}" controls playsinline preload="none"
    ${a.uid?`poster="${streamThumb(a.uid)}" data-cc="${esc(a.uid)}"`:''}
    style="width:100%;border-radius:14px;background:#11150f;display:block"></video>`,
    'margin-top:11px;border-radius:14px;overflow:hidden');
}

const PURPOSE={'Warm-up':'Wrists and shoulders','Entries — build to 6':'The position, every time',
 'Shape changes':'Awareness while upside down','Tuck':'This is press training',
 'Press walks':'Do these differently to normal','Strength':'At the end, when warm',
 'Mobility':'When you are warm','Floats and press walks':'The press pattern at floor level'};
const WHY={'Warm-up':'Four minutes so the first entry is not the warm-up. Wrists get loaded hard today.',
 'Entries — build to 6':'Entries are to practise entering the correct position every single time. Get fully into it, but do not make more than one adjustment before coming back down.',
 'Shape changes':'The key thing that made my handstand consistent. The wall holds the balance so you can feel the shape — then one freestanding set on top.',
 'Tuck':'The tuck handstand is press training in disguise. Hands close, push through the shoulders instead of widening. Less depth is fine.',
 'Press walks':'I want these done slightly differently to normal to get a lot more out of them — the explainer is the whole drill.',
 'Strength':'Strength last so it never eats into the balance work.',
 'Mobility':'At the end, when you are warm.',
 'Floats and press walks':'The press pattern at floor level — same shift of weight, no handstand needed.'};
const purpose=n=>PURPOSE[n]||'Why this is here';
const why=n=>WHY[n]||'';
/* The chip offered an explainer for every block. It only earns its place
   when there is actually a video to show, so it now checks the client's
   own answers for one before appearing. */
function whyVideo(n){
  /* the block's prose lives in WHY; which explainer belongs to it lives in
     the plan, as a question that matches one of their answers */
  const q=((DATA.why||{})[n]||'').trim();
  if(!q) return null;
  return (DATA.answers||[]).find(x=>x && x.v && String(x.q||'').trim()===q) || null;
}

/* ── Progress ── */
/* ── activity, from what is already recorded ───────────────────────
   opens[] is one ISO date per active day, kept for 180 days. sessions[]
   holds up to 200, each with planned and actual minutes. Neither needed
   any new instrumentation — the app has been collecting both all along
   and showing three numbers. */
function dayKey(d){ return new Date(d).toISOString().slice(0,10); }

function panelMonth(p){
  const opens=new Set(((p&&p.opens)||[]));
  const today=new Date(); today.setHours(12,0,0,0);
  /* start on the Monday 4 weeks back so the columns line up under M-S */
  const start=new Date(today); start.setDate(start.getDate()-27);
  start.setDate(start.getDate()-((start.getDay()+6)%7));
  const cells=[]; let active=0, prior=0;
  const d=new Date(start);
  while(d<=today || cells.length%7){
    const k=dayKey(d), on=opens.has(k), future=d>today;
    if(on) active++;
    cells.push(`<div style="aspect-ratio:1;display:grid;place-items:center">
      <span style="width:29px;height:29px;border-radius:999px;display:grid;place-items:center;
        font:${on?'700':'400'} 12px/1 var(--sans);
        background:${on?'var(--forest)':'transparent'};
        color:${on?'var(--bg)':future?'#c9c4be':'var(--grey2)'}">${d.getDate()}</span></div>`);
    d.setDate(d.getDate()+1);
    if(cells.length>42) break;
  }
  const cut=dayKey(new Date(Date.now()-28*864e5));
  const cut2=dayKey(new Date(Date.now()-56*864e5));
  opens.forEach(k=>{ if(k<cut && k>=cut2) prior++; });
  const delta=active-prior;
  const head=['M','T','W','T','F','S','S'].map(x=>
    `<div style="text-align:center;font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${x}</div>`).join('');
  return `<div class="card"><div class="kick2">PAST 4 WEEKS</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:14px 0 6px">${head}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells.join('')}</div>
    <div style="display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(28,32,25,.08)">
      ${[['Active days',String(active),''],
         ['vs prior 4wk',(delta>0?'+':'')+delta, delta>0?'var(--forest)':delta<0?'var(--amber)':''],
        ].map(([n,v,c])=>`<div style="flex:1">
        <div style="font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${n.toUpperCase()}</div>
        <div class="h-sm" style="font-size:19px;margin-top:5px;${c?'color:'+c:''}">${v}</div></div>`).join('')}
    </div></div>`;
}

function panelWeek(p){
  const ss=((p&&p.sessions)||[]).filter(x=>x&&x.at);
  const now=new Date(); now.setHours(23,59,59,999);
  const mins=[], labels=[];
  let thisWk=0, lastWk=0, drills=0, drillsLast=0;
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    const m=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.actual||x.mins||0),0);
    mins.push(m); thisWk+=m;
    drills+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.drills||0),0);
    labels.push(i===0?'TOD':['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]);
  }
  for(let i=13;i>=7;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    lastWk+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.actual||x.mins||0),0);
    drillsLast+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.drills||0),0);
  }
  const peak=Math.max(30,...mins);
  const bars=mins.map((m,i)=>`<div style="flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:flex-end;gap:7px">
    <div style="width:100%;height:78px;display:flex;align-items:flex-end">
      <div title="${m} min" style="width:100%;border-radius:6px 6px 3px 3px;
        height:${Math.max(m?7:3,Math.round(m/peak*78))}px;
        background:${m?(i===6?'var(--forest)':'var(--sage)'):'rgba(28,32,25,.07)'}"></div></div>
    <span style="font:600 9px/1 var(--sans);letter-spacing:.06em;
      color:${i===6?'var(--forest)':'var(--grey2)'}">${labels[i]}</span></div>`).join('');
  const dm=thisWk-lastWk, dd=drills-drillsLast;
  const hrs=n=>n>=60?(n/60).toFixed(1)+'h':n+'m';
  return `<div class="card"><div class="kick2">THIS WEEK</div>
    <div style="display:flex;gap:5px;align-items:flex-end;margin-top:16px">${bars}</div>
    <div style="display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(28,32,25,.08)">
      ${[['Time',hrs(thisWk)],['Drills',String(drills)],
         ['vs last week',(dm>0?'+':'')+hrs(Math.abs(dm)).replace('-','')+' · '+(dd>0?'+':'')+dd]]
        .map(([n,v])=>`<div style="flex:1">
        <div style="font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${n.toUpperCase()}</div>
        <div class="h-sm" style="font-size:19px;margin-top:5px">${v}</div></div>`).join('')}
    </div>
    ${thisWk?'':`<div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:12px">
      Nothing logged this week yet. Finish a session and it turns up here.</div>`}</div>`;
}

/* ── the free ladder's own progress ────────────────────────────────
   A ladder client is working on one stage, so this answers that: how
   much of it can you do, are you doing more of it than last week, and
   is the hold going up. The block-shaped stuff below is coached work
   and means nothing here. */
function weeksBack(n){
  const out=[], now=new Date();
  const mon=new Date(now); mon.setHours(0,0,0,0);
  mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  for(let i=n-1;i>=0;i--){
    const a=new Date(mon); a.setDate(mon.getDate()-i*7);
    const b=new Date(a);   b.setDate(a.getDate()+7);
    out.push({from:+a, to:+b, label:i===0?'This':(i===1?'Last':i+'w')});
  }
  return out;
}

function freeProgressBody(){
  const S=STAGES[curStage()]||STAGES[0];
  const done=st.ladderDone||{};
  const secs=STAGE_SECTIONS[curStage()]||[];

  /* week on week, counted off the sessions the account holds */
  const sess=sessionsDone();
  const wk=weeksBack(8).map(w=>Object.assign(w,{

  const kind=holdKind();
  const holds=(((st.prog||{}).holds)||[])

        ${secs.map(sec=>{
          const n=(sec.items||[]).length, d=(sec.items||[]).filter(it=>done[it.v]).length;

/* ── tracking ──────────────────────────────────────────────────────
   Three things a handstand client can move that the ladder does not
   already measure, plus the daily habit that decides whether their
   wrists survive the month. */
const METRICS=[
  {m:'wall',  n:'Distance from the wall', unit:'cm', lower:true,
   help:'Hands to skirting board on your best chest-to-wall hold. Smaller is better.'},
  {m:'press', n:'Press attempts held',    unit:'reps',
   help:'Out of ten tries, how many came up and stayed up.'},
  {m:'wrist', n:'Wrist discomfort',       unit:'/10', max:10, lower:true,
   help:'Worst it got this week. Zero is nothing, ten is stop training.'},
];
const HABITS=[
  {h:'wrists', n:'Wrist prep',      help:'Two minutes before you load them.'},
  {h:'shoulders', n:'Shoulder opener', help:'The thing that makes the line possible.'},
  {h:'hollow', n:'Hollow hold',     help:'Thirty seconds. It is the shape.'},
];

function loadTrack(){
  if(!st.token) return Promise.resolve();
  return fetch(AUTH.track,{headers:authed()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ st.track=d; save(); render(); } })
    .catch(()=>{});
}
function postTrack(body){
  if(!st.token) return Promise.resolve();
  return fetch(AUTH.track,{method:'POST',headers:authed(),body:JSON.stringify(body)})
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      if(!d || typeof d!=='object') return;
      /* merge rather than replace: the reply is a snapshot from before
         anything logged since, and a partial one would erase the rest */
      const cur=st.track||{};
      st.track={
        metrics:     Object.assign({}, d.metrics||{},     cur.metrics||{}),
        habits:      Object.assign({}, d.habits||{},      cur.habits||{}),
        checkpoints: Object.assign({}, d.checkpoints||{}, cur.checkpoints||{}),
        checkins:    (d.checkins&&d.checkins.length)?d.checkins:(cur.checkins||[]),
        photos:      (d.photos&&d.photos.length)?d.photos:(cur.photos||[]),
      };
      save();
    })
    .catch(()=>{});
}
const todayKey = () => new Date().toISOString().slice(0,10);

function logMetric(m){
  const def=METRICS.find(x=>x.m===m); if(!def) return;
  const raw=prompt(def.n+' ('+def.unit+')\n\n'+def.help);
  if(raw==null) return;
  const v=Number(String(raw).replace(/[^0-9.]/g,''));
  if(!Number.isFinite(v)){ return; }
  st.track=st.track||{metrics:{},habits:{},checkins:[]};
  st.track.metrics=st.track.metrics||{};
  st.track.metrics[m]=(st.track.metrics[m]||[]).concat([{v,at:Date.now()}]).slice(-60);
  save(); render();
  postTrack({metric:{m,v}});
}
function toggleHabit(h){
  const day=todayKey();
  st.track=st.track||{metrics:{},habits:{},checkins:[]};
  st.track.habits=st.track.habits||{};
  const list=st.track.habits[h]||[];
  const on=list.indexOf(day)<0;
  st.track.habits[h]= on ? list.concat([day]).sort() : list.filter(d=>d!==day);
  save(); render();

/* the last 28 days, so a streak is visible without counting */
function habitDays(h,n){
  const set=new Set(((st.track&&st.track.habits)||{})[h]||[]);
  const out=[], now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now); d.setDate(now.getDate()-i);
    const k=d.toISOString().slice(0,10);
    out.push({k, on:set.has(k), today:i===0});
  }
  return out;
}
function habitRate(h,n){
  const d=habitDays(h,n);
  return d.length?Math.round(d.filter(x=>x.on).length/d.length*100):0;
}
/* how much of what you said you would do, you did */
function adherence(weeks){
  const target=weekTarget()||1, sess=sessionsDone();
  const ws=weeksBack(weeks);
  const per=ws.map(w=>Math.min(1, sess.filter(x=>x.at>=w.from&&x.at<w.to).length/target));
  return per.length?Math.round(per.reduce((a,b)=>a+b,0)/per.length*100):0;
}

function checkinDue(){
  const c=((st.track&&st.track.checkins)||[]);
  if(!c.length) return true;
  return (Date.now()-c[c.length-1].at) > 14*864e5;

function sendCheckin(){

/* ── check points ──────────────────────────────────────────────────
   What a stage is actually assessed on. Every fortnight the app asks
   for these, and they can be filled in any time in between — the number
   is the thing that decides whether someone moves up, so it belongs to
   them rather than to a reminder.

   kind decides the control: secs is a hold, count is how many, rate is
   0-10, yn is did it or not, breaks is how many times they came down
   before reaching ten. */

/* Coached clients get the check points their coach set, not the ladder's.
   The ladder ones are the free product's stage gates and mean nothing to
   someone on a written programme. */
const cpFor = i => {
  if(i==null && coachedView() && Array.isArray(DATA.checkpoints) && DATA.checkpoints.length){
    /* a check point can be written now and scheduled for later, so one with
       a start date does not exist until that date */
    const today=new Date().toISOString().slice(0,10);
    return DATA.checkpoints.filter(c=>!c.from || c.from<=today);
  }
  return CHECKPOINTS[i==null?curStage():i] || [];
};
/* ones they have not been shown yet, so the app can say so */
function cpNew(){
  if(!coachedView()) return [];
  const seen=st.cpSeen||{};
  return cpFor().filter(c=>c.addedAt && !seen[c.k]);
}
function cpMarkSeen(){
  const seen=Object.assign({}, st.cpSeen||{});
  cpFor().forEach(c=>{ if(c.addedAt) seen[c.k]=1; });
  st.cpSeen=seen; save();
}
function cpLog(){ return (st.track&&st.track.checkpoints)||{}; }
function cpLast(k){ const h=cpLog()[k]||[]; return h.length?h[h.length-1]:null; }
function cpDue(){
  const all=cpFor().map(c=>cpLast(c.k)).filter(Boolean);
  if(!all.length) return true;
  const newest=Math.max(...all.map(x=>x.at));
  return (Date.now()-newest) > 14*864e5;
}
function saveCheckpoint(k,v,video){
  const wasReady = coachedView() ? true : cpProgress(stageOfCp(k)).ready;
  st.track=st.track||{};
  st.track.checkpoints=st.track.checkpoints||{};
  const row=Object.assign({v:Number(v)||0,at:Date.now()}, video?{video}:{});
  const hist=(st.track.checkpoints[k]||[]).slice();
  /* Nudging the slider twice in one session is a correction, not two
     readings. Today's entry is replaced rather than added to, or logging as
     you drag would fill the history with every value it passed through. A
     clip already sent is never dropped by a later bare number. */
  const lastRow=hist[hist.length-1];
  if(lastRow && dayKey(lastRow.at)===dayKey(row.at)){
    if(lastRow.video && !row.video) row.video=lastRow.video;
    hist[hist.length-1]=row;
  } else hist.push(row);
  st.track.checkpoints[k]=hist.slice(-20);
  if(st.cpDraft) delete st.cpDraft[k];
  /* Reaching the last check point on a stage is the whole point of the
     stage, and nothing happened when you did: the counter read 7 of 7 and
     you stayed where you were. */
  const sg = coachedView() ? -1 : stageOfCp(k);
  const clearedNow = sg>-1 && sg===curStage() && !wasReady && cpProgress(sg).ready;
  save();
  /* under an open sheet render() bails out, so logging one used to change
     nothing on screen until the sheet was closed */
  if(document.getElementById('cptop-'+k)) repaintCp(k); else render();
  if(clearedNow) stageCleared(sg);
  postTrack({checkpoint:Object.assign({k, v:Number(v)||0}, video?{video}:{})});
}

/* A number says what happened. A clip says whether it was any good, which is
   the whole reason a coached client has check points at all. Coached only:
   the free tier has no one to send it to. */
let cpUpBusy=null;
function cpFilm(k){
  if(!st.token){ st.tab='joinFree'; save(); render(); return; }
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) cpSendClip(k,f); };
  inp.click();
}
function cpSay(k,t){
  const el=document.getElementById('cpup-'+k);
  if(el) el.textContent=t||'';
}
function cpSendClip(k,file){
  if(cpUpBusy) return;
  if(file.size > 220*1024*1024){ cpSay(k,'Too large. Trim it to under three minutes.'); return; }
  cpUpBusy=k; cpSay(k,'Getting ready…');
  fetch(AUTH.upload,{method:'POST',headers:authed(),body:'{}'})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
    .then(d=>new Promise((resolve,reject)=>{
      const fd=new FormData(); fd.append('file',file);
      const xhr=new XMLHttpRequest();
      xhr.open('POST',d.uploadURL);
      xhr.upload.onprogress=e=>{ if(e.lengthComputable)
        cpSay(k,'Uploading… '+Math.round(e.loaded/e.total*100)+'%'); };
      xhr.onload=()=> (xhr.status>=200&&xhr.status<300) ? resolve(d.uid)
                    : reject('Upload failed ('+xhr.status+')');
      xhr.onerror=()=>reject('Upload failed, check your signal');
      xhr.send(fd);
    }))
    .then(uid=>{
      /* the number to attach is whatever the slider is holding, then whatever
         was last logged — the old input id this read from no longer exists, so
         every clip was being filed against a zero */
      const draft=(st.cpDraft||{})[k];
      const v = draft!=null ? draft : ((cpLast(k)||{}).v || 0);
      cpUpBusy=null;
      saveCheckpoint(k, v, uid);
    })
    .catch(err=>{ cpUpBusy=null; cpSay(k, String(err&&err.message||err||'Could not send it')); });
}
/* has this one reached what it is asking for */
function cpMet(c){
  const last=cpLast(c.k); if(!last) return false;
  if(c.kind==='face') return Number(last.v)>=2;
  if(c.kind==='yn') return !!last.v;
  if(c.target==null) return false;
  const K=CP_KIND[c.kind]||CP_KIND.count;
  /* lower-is-better can belong to the check point, not only its kind:
     distance to the box is a count, and the smaller one is the good one */
  const lower=(c.lower!=null)?c.lower:K.lower;
  return lower ? (last.v>0 && last.v<=c.target) : last.v>=c.target;
}
const cpUnit = c => (c.unit!=null) ? c.unit : ((CP_KIND[c.kind]||CP_KIND.count).unit||'');

/* ── faces ─────────────────────────────────────────────────────────
   Some check points are not a measurement. "How comfortable do you feel
   falling off the wall" has no number in it, and asking for one out of ten
   invites a made-up answer. Three faces: it is honest about being a feeling
   and it takes one tap. The middle one counts as not there yet, because

const FACES=[

  {v:2, mouth:'M8.4 14.2c1.9 2.3 5.3 2.3 7.2 0'}

const FACE_LABELS=['Not really','Getting there','Yes'];
const cpFaceLabels = c => c.faces || FACE_LABELS;
function cpFaceLabel(c,v){
  if(c.kind==='face') return cpFaceLabels(c)[Math.max(0,Math.min(2,Number(v)||0))];
  return v ? 'Yes' : 'Not yet';
}
function faceSVG(i,on){
  const f=FACES[i];
  return `<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"
    style="display:block;margin:0 auto">
    <circle cx="12" cy="12" r="9.4" fill="none" stroke="${on?'#fff':'rgba(17,17,17,.28)'}"

function cpWhen(at){

  return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}

/* A slider with the target marked on it, so a number is read against what it
   is aiming at rather than on its own. Drag or tap the track, and the step
   buttons stay for anyone who wants to be exact. */
function cpInput(c){
  const K=CP_KIND[c.kind]||CP_KIND.count;
  const last=cpLast(c.k);
  if(c.kind==='face'){
    const labels=cpFaceLabels(c);
    return `<div style="display:flex;gap:7px">
      ${[0,1,2].map(v=>{
        const on=last&&Number(last.v)===v;
        return `<button onclick="saveCheckpoint('${c.k}',${v})"

          color:${on?'var(--on-primary)':'var(--ink)'}">
          ${faceSVG(v,on)}
          <span style="font:600 11.5px/1 var(--sans)">${esc(labels[v])}</span></button>`;
      }).join('')}
    </div>`;
  }
  if(c.kind==='yn'){
    return `<div style="display:flex;gap:7px">
      ${[['1','Yes'],['0','Not yet']].map(([v,l])=>`<button onclick="saveCheckpoint('${c.k}',${v})"
        style="flex:1;border-radius:14px;padding:13px;cursor:pointer;min-height:44px;
        font:700 13px/1 var(--sans);
        border:1px solid ${last&&String(last.v)===v?'transparent':'rgba(17,17,17,.14)'};
        background:${last&&String(last.v)===v?'var(--forest)':'#fff'};
        color:${last&&String(last.v)===v?'var(--on-primary)':'var(--ink)'}">${l}</button>`).join('')}
    </div>`;
  }
  const draft=(st.cpDraft||{})[c.k];
  const val=draft!=null?draft:(last?last.v:0);
  const lower=(c.lower!=null)?c.lower:K.lower;
  /* The target sits at the end of the track, not as a notch in the middle
     of an arbitrary scale: you are dragging towards a number. The scale
     only grows past it if someone actually beats it, so the usual case
     reads as "how close am I to the end". Lower-is-better runs the other
     way, from wherever they started down to the target. */
  const max = lower
    ? Math.max(c.from||K.max||25, val, last?last.v:0)
    : Math.max(c.target||K.max||20, val, last?last.v:0);
  const pct=Math.max(0,Math.min(100,(val/max)*100));
  const met = c.target==null ? false : (lower ? (val>0 && val<=c.target) : val>=c.target);
  const notch = (c.target!=null && max>c.target) ? (c.target/max)*100 : null;
  const step=c.kind==='secs'?5:1;
  const unit=cpUnit(c);
  /* The target label lives at the right-hand end of the track, so the thumb
     has to stop short of it: at a full bar the two sat on top of each other
     and the number you are aiming at was the one you could not read. */
  const RES = c.target!=null ? 88 : 36;
  const run = `(100% - ${RES}px) * ${(pct/100).toFixed(4)}`;
  return `<div>
    <div id="cptrack-${c.k}" data-res="${RES}" onpointerdown="cpDrag(event,'${c.k}',${max},${RES})"
      style="position:relative;height:40px;border-radius:20px;background:rgba(17,17,17,.07);
      cursor:pointer;touch-action:none;overflow:hidden">
      <i id="cpfill-${c.k}" style="position:absolute;left:0;top:0;bottom:0;border-radius:20px;
        width:calc(${run} + 36px);
        background:${met?'linear-gradient(90deg,#0a7b74,#006663)':'linear-gradient(90deg,#cfe6ec,#8fbeca)'};
        transition:width .16s,background .35s"></i>
      ${c.target!=null?`<span style="position:absolute;right:0;top:0;bottom:0;width:52px;display:flex;
        align-items:center;justify-content:center;font:700 10.5px/1 var(--sans);color:var(--deep);
        pointer-events:none">${c.target}${esc(unit)}</span>`:''}
      ${notch!=null?`<i style="position:absolute;left:calc((100% - ${RES}px) * ${
        (notch/100).toFixed(4)} + 18px);top:5px;bottom:5px;width:2px;
        background:rgba(0,64,61,.45)"></i>`:''}
      <i id="cpthumb-${c.k}" style="position:absolute;top:4px;left:calc(${run} + 4px);
        width:32px;height:32px;
        border-radius:50%;background:#fff;box-shadow:0 2px 9px rgba(28,32,25,.3);transition:left .16s"></i>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
      <button class="rt" onclick="cpStep('${c.k}',${-step},${max})" aria-label="Less">−</button>
      <span id="cpstep-${c.k}" data-u="${esc(unit)}"
        style="flex:1;text-align:center;font:700 15px/1 var(--sans)">${val}${esc(unit)}</span>
      <button class="rt" onclick="cpStep('${c.k}',${step},${max})" aria-label="More">+</button>
    </div>
  </div>`;
}
/* ── one check point, as a card ────────────────────────────────────

   notch in the middle, because the target is the whole point of the row:
   you are dragging towards a number, not along a scale.

   The card is deliberately in two halves. Everything above the demo is
   repainted whenever the number changes; the demo container below it is
   never touched, so opening a clip and then nudging the slider does not

function stageOfCp(k){

/* how far off it is, said in the units it is measured in */
function cpToGo(c){
  const last=cpLast(c.k);
  const K=CP_KIND[c.kind]||CP_KIND.count;
  const lower=(c.lower!=null)?c.lower:K.lower;
  const unit=cpUnit(c);
  const met=cpMet(c);
  /* the left of this line already says whether it has been logged, so the
     right says nothing rather than saying it twice */
  if(c.kind==='yn'||c.kind==='face') return last ? (met?'Reached':'Not there yet') : '';
  if(!last) return '';
  if(met) return 'Target reached';
  if(c.target==null) return '';
  return lower ? (last.v-c.target)+unit+' to lose' : (c.target-last.v)+unit+' to go';
}

function cpStep(k,by,max){
  const cur=(st.cpDraft||{})[k]!=null?st.cpDraft[k]:((cpLast(k)||{}).v||0);
  const next=Math.max(0,Math.min(max,cur+by));
  st.cpDraft=Object.assign({},st.cpDraft,{[k]:next});
  save();
  /* paint the three places the number shows rather than redrawing the sheet */
  const el=document.getElementById('cptrack-'+k);
  if(el){
    const res=Number(el.dataset.res)||36, p=max?next/max:0;
    const run='(100% - '+res+'px) * '+p.toFixed(4);
    const fill=document.getElementById('cpfill-'+k), thumb=document.getElementById('cpthumb-'+k);
    if(fill) fill.style.width='calc('+run+' + 36px)';
    if(thumb) thumb.style.left='calc('+run+' + 4px)';
  }
  ['cpval-','cpstep-'].forEach(pre=>{
    const n=document.getElementById(pre+k);
    if(n) n.textContent=next+(n.dataset.u||'');
  });
  /* hold off until the tapping stops, so five taps are one reading and one
     trip to the server rather than five */
  clearTimeout(cpStepT_);
  cpStepT_=setTimeout(()=>saveCheckpoint(k,(st.cpDraft||{})[k]), 700);
}
let cpStepT_=null;
/* dragging the track, pointer events so it works with a thumb and a mouse */
function cpDrag(e,k,max,res){
  const el=document.getElementById('cptrack-'+k); if(!el) return;
  const RES=res||36;
  const set=ev=>{
    const r=el.getBoundingClientRect();
    const run=Math.max(1, r.width-RES);
    const p=Math.max(0,Math.min(1,(ev.clientX-r.left-16)/run));
    st.cpDraft=Object.assign({},st.cpDraft,{[k]:Math.round(p*max)});
    /* paint without a full render, or the drag stutters. Addressed by id
       rather than by position: the track has a target label in it now, and
       counting children put the thumb on the wrong element. */
    const fill=document.getElementById('cpfill-'+k), thumb=document.getElementById('cpthumb-'+k);
    const run2='(100% - '+RES+'px) * '+p.toFixed(4);
    if(fill) fill.style.width='calc('+run2+' + 36px)';
    if(thumb) thumb.style.left='calc('+run2+' + 4px)';
    const lab=document.getElementById('cpval-'+k);
    if(lab) lab.textContent=Math.round(p*max)+(lab.dataset.u||'');
    const st2=document.getElementById('cpstep-'+k);
    if(st2) st2.textContent=Math.round(p*max)+(st2.dataset.u||'');
  };
  set(e);
  el.setPointerCapture&&el.setPointerCapture(e.pointerId);
  const move=ev=>set(ev);
  const up=()=>{ el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
                 /* Letting go logs it. Dragging all the way to the target and
                    watching the card still say NOT STARTED made the slider look
                    broken: there was no way to finish one without noticing a
                    small pill beside it. */
                 const val=(st.cpDraft||{})[k];
                 if(val!=null) saveCheckpoint(k, val); else save(); };
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',up);
}

const PHOTO_VIEWS=[['side','Side on'],['front','Front on'],['back','From behind']];
function pickProgressPhoto(view){
  if(upBusy) return;
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
    upBusy=true;
    const say=t=>{ const el=document.getElementById('phMsg'); if(el) el.textContent=t; };
    say('Preparing…');
    shrinkPhoto(f)
      .then(data=>fetch(AUTH.image,{method:'POST',headers:authed(),
        body:JSON.stringify({data})}).then(r=>r.ok?r.json():Promise.reject()))
      .then(d=>postTrack({photo:{id:d.id, view}}))
      .then(()=>{ upBusy=false; say(''); render(); })
      .catch(()=>{ upBusy=false; say('That did not upload. Try again.'); });
  };
  inp.click();
}

  return (((st.track||{}).photos)||[]).filter(p=>(p.view||'side')===view)

/* ── the month, the way the coach dashboard shows it ─────────────────
   Same reading on both sides of the table: full colour for a session

   which is a different fact from a miss. */
function calShift(by){ st.calOff=Math.max(0,Math.min(11,(st.calOff|0)+by)); st.calDay=null; save(); render(); }
function calPick(k){ st.calDay = (st.calDay===k) ? null : k; save(); render(); }
/* what a day actually held. The calendar could say a day was part done and
   then had no way of telling you which part. */
/* Drills where the number they managed was not the number asked for. It is
   the most useful thing in the log and it was buried inside one day's
   breakdown, so neither of us was reading it. */
/* The block note changes when the coach rewrites it, and nothing said so.
   A stamp of what was last read, against what is there now. */
function blockText(){
  return JSON.stringify([(DATA.read||[]), (DATA.changed||[])]);
}
function blockNew(){
  const t=blockText();
  return !!t && t.length>4 && st.readSeen !== t;
}
function markBlockSeen(){ st.readSeen=blockText(); save(); }

/* what the programme asks for, so sessions logged before the app started
   recording it are still readable rather than invisible */
/* Logging by exception: the number is only worth typing when it was not the
   number asked for, so the row shows the target until you say otherwise. */
function planLogged(k){ const r=(st.planReps||{})[k]; return r==null?null:r; }
function planLogBtn(k,it){
  const got=planLogged(k), u=doseUnit(it.d);
  if(got!=null) return `<button class="rt on" onclick="st.repOpen=st.repOpen==='${k}'?null:'${k}';save();render()">${got}${u} done</button>`;
  return `<button class="rt" onclick="planOpenRep('${k}')">Did fewer?</button>`;
}
function planOpenRep(k){ st.repOpen=k; save(); render(); }
function planStepper(k,it){
  const u=doseUnit(it.d), step=u==='s'?5:1;
  const want=recommendedReps(it)||0;
  const v=(st.planReps||{})[k];
  const cur=v==null?want:v;
  return `<div style="display:flex;align-items:center;gap:9px;margin-top:9px;background:#f4efe9;
    border-radius:16px;padding:11px 12px">
    <span style="flex:1;font:400 12.5px/1.35 var(--sans);color:var(--grey)">
      ${u==='s'?'How long did you hold it?':'How many did you do?'}</span>
    <button class="rt" onclick="planRep('${k}',${-step},${want})" aria-label="Fewer">−</button>
    <span style="flex:none;min-width:46px;text-align:center;font:400 19px/1 var(--serif)">${cur}${u}</span>
    <button class="rt" onclick="planRep('${k}',${step},${want})" aria-label="More">+</button>
    <button class="rt on" onclick="planRepDone('${k}')">Done</button>
  </div>`;
}
function planRep(k,by,want){
  st.planReps=st.planReps||{};
  const cur=st.planReps[k]==null?want:st.planReps[k];
  st.planReps[k]=Math.max(0,cur+by);
  save(); render();
}
function planRepDone(k){ st.repOpen=null; save(); render(); sendPlanReps(); }
/* it reaches the coach the same way a flag does */
function sendPlanReps(){
  if(!st.token) return;
  const d=day(), out=[];
  (d.groups||[]).forEach((g,gi)=>(g.items||[]).forEach((it,ii)=>{
    const k=key(st.day,gi,ii), r=(st.planReps||{})[k];
    if(r==null) return;
    out.push({v:it.v, n:it.n, grp:g.name, got:st.tick[k]?1:0, of:1,
              reps:r, want:recommendedReps(it)||0, dose:String(it.d||'').slice(0,40),
              rate:(st.rate||{})[it.v]||''});
  }));
  if(!out.length) return;
  reportProgress({session:{day:st.day, name:d.label||'', done:false, mode:'plan',
    drills:out.length, mins:0, actual:0, got:out.filter(x=>x.got).length, of:out.length,
    items:out.slice(0,40)}});
}

function prescribedFor(v){
  const days=(DATA&&DATA.days)||[];
  for(const d of days) for(const g of (d.groups||[])) for(const it of (g.items||[]))
    if(it && it.v===v) return {want:recommendedReps(it), unit:doseUnit(it.d), n:it.n};
  const drill=(typeof drillById==='function') ? drillById(v) : null;
  return drill ? {want:recommendedReps(drill), unit:doseUnit(drill.d), n:drill.n} : null;
}
/* a dose in seconds is not a rep count, and calling it one made the number
   meaningless on every hold in the programme */
function doseUnit(d){ return /\bs(ec|econds)?\b|\d+\s*s\b/i.test(String(d||'')) ? 's' : ''; }

function repsOffCard(){
  const log=(st.prog&&st.prog.repsLog)||{};
  const rows=[];
  Object.keys(log).forEach(v=>{
    const h=(log[v]||[]).filter(x=>x && x.reps);
    if(!h.length) return;
    const last=h[0];
    const pre=prescribedFor(v);
    const want=last.want || (pre&&pre.want) || 0;
    if(!want || last.reps===want) return;
    rows.push({v, n:last.n||(pre&&pre.n)||v.replace(/-/g,' '), reps:last.reps, want,
               unit:(pre&&pre.unit)||'', at:last.at,
               trend:h.length>1?last.reps-h[1].reps:0});
  });
  if(!rows.length) return '';
  rows.sort((a,b)=>b.at-a.at);
  return `<div class="card" style="padding:18px 20px">
    <div class="kick2">WHAT YOU ACTUALLY MANAGED</div>
    <div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:7px">
      Reps and seconds, where what you did was not what was asked for. Short of it is
      information, not a failure.</div>
    <div style="margin-top:12px">
    ${rows.slice(0,8).map((r,i)=>`<div style="display:flex;align-items:baseline;gap:10px;
      padding:10px 0;${i?'border-top:1px solid rgba(17,17,17,.07)':''}">
      <span style="flex:1;min-width:0;font:600 14px/1.25 var(--sans)">${esc(r.n)}</span>
      ${r.trend?`<span style="flex:none;font:600 10.5px/1 var(--sans);
        color:${r.trend>0?'var(--forest)':'var(--grey2)'}">${r.trend>0?'+':''}${r.trend}</span>`:''}
      <span style="flex:none;font:400 17px/1 var(--serif);
        color:${r.reps>=r.want?'var(--forest)':'var(--ink)'}">${r.reps}${esc(r.unit)}
        <span style="font:400 12px/1 var(--sans);color:var(--grey2)">of ${r.want}${esc(r.unit)}</span></span>
    </div>`).join('')}
    </div>
  </div>`;
}

function dayBreakdown(byDay, opens){
  const k=st.calDay; if(!k) return '';
  const list=byDay[k]||[];
  const d=new Date(k+'T12:00:00');
  const title=d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
  if(!list.length){
    return `<div style="margin-top:14px;padding:14px 15px;border-radius:16px;background:var(--mist)">

  const body=list.map(x=>{
    const label = x.kind==='all'||x.done ? 'Whole session'

    const items=(x.items||[]).filter(it=>it && it.n);
    return `<div style="padding:11px 0;border-top:1px solid rgba(17,17,17,.08)">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <span style="flex:1;font:600 14px/1.3 var(--sans)">${esc(x.name||label)}</span>
        <span style="flex:none;font:400 12px/1 var(--sans);color:var(--grey2)">${when}</span>
      </div>
      <div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:5px">
        ${esc(label)}${x.of?', '+(x.approx?'':x.got+' of '+x.of+' drills'):''}${
          x.mins?' · '+x.mins+' min':''}</div>
      ${items.length?`<div style="margin-top:8px;display:flex;flex-direction:column;gap:5px">
        ${items.map(it=>`<div style="display:flex;gap:9px;align-items:baseline;
          font:400 13px/1.4 var(--sans)">
          <span style="flex:none;width:14px;color:${it.got?'var(--forest)':'var(--grey2)'}">${it.got?'✓':'·'}</span>
          <span style="flex:1;${it.got?'':'color:var(--grey2)'}">${esc(it.n)}</span>
          ${it.reps?`<span style="flex:none;color:${
            it.want&&it.reps<it.want?'var(--red)':'var(--grey2)'}">${esc(String(it.reps))}${
            it.want&&it.reps!==it.want?' of '+it.want:''}</span>`:''}
          ${it.rate?`<span style="flex:none;font:600 9px/1 var(--sans);letter-spacing:.1em;
            color:var(--red)">${esc(String(it.rate).toUpperCase())}</span>`:''}
        </div>`).join('')}</div>`:''}
    </div>`;}).join('');
  return `<div style="margin-top:14px;padding:14px 15px 4px;border-radius:16px;background:var(--mist)">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span style="font:400 16px/1.2 var(--serif)">${esc(title)}</span>
      <button class="back" onclick="calPick('${k}')" style="color:var(--grey2);font-size:11.5px">Close</button>
    </div>
    ${body}
  </div>`;
}
/* The week, as a strip of days with the sessions under it. It sat on Today,
   where it competed with the one thing Today is for: choosing a session and
   starting it. It lives on Progress now, which is where someone goes to look
   at their week rather than to train. */
function weekCard(){
  /* it read `done` and `target` out of Today's scope, which is fine while it
     lives inside Today and a crash the moment it does not */
  const cells=weekCells();
  const trainedDays=new Set(sessionsDone().map(x=>new Date(x.at).toDateString()));
  const mon=new Date(); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const done=cells.filter((c,n)=>{
    const dt=new Date(mon); dt.setDate(mon.getDate()+dayFor(n));
    return !isRestCell(c) && trainedDays.has(dt.toDateString());
  }).length;
  const target=weekTarget();
  return (function(){
        /* the card that lifts is the one today holds, not the one a counter
           happens to be pointing at */
        const idx=todayCellIdx();
        /* seven days, Monday first, from this week's actual dates — so a chip
           is filled because you trained that day, not because of a counter. */
        const now=new Date();
        const mon=new Date(now); mon.setHours(0,0,0,0);
        mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
        const trained=new Set(sessionsDone().map(x=>new Date(x.at).toDateString()));
        const cells=weekCells();
        /* wrist and mobility days are a different kind of day, not a
           quieter version of a training day, so they get their own colour
           rather than the same green at less opacity */
        const kindOn={};
        cells.forEach((c,k)=>{ const d=dayFor(k);
          if(kindOn[d]!=='work') kindOn[d]=isRestCell(c)?'rest':'work'; });
        const chips=['M','T','W','T','F','S','S'].map((L,i)=>{
          const dt=new Date(mon); dt.setDate(mon.getDate()+i);
          const isToday=dt.toDateString()===now.toDateString();
          const did=trained.has(dt.toDateString());
          const kind=kindOn[i];
          /* Today is a ring around whichever day it happens to be, so a rest
             day today cannot look like a training day. */
          const bg = kind==='rest' ? 'var(--sage)' : kind==='work' ? 'var(--forest)'
                                                                  : 'rgba(17,17,17,.05)';
          const fg = kind==='rest' ? 'var(--deep)' : kind==='work' ? 'var(--on-primary)'
                                                                  : 'var(--grey2)';
          return `<div onclick="st.weekOpen=!st.weekOpen;save();render()" style="flex:1;min-width:0;
            height:30px;border-radius:9px;display:grid;place-items:center;cursor:pointer;position:relative;
            font:600 11.5px/1 var(--sans);background:${bg};color:${fg};
            box-shadow:${isToday?'0 0 0 2px var(--bg),0 0 0 3.5px var(--forest)':'none'}">${L}
            ${did?`<span style="position:absolute;bottom:3px;font:700 7px/1 var(--sans)">✓</span>`:''}</div>`;
        }).join('');
        return `<div data-tour="week" style="border-radius:18px;background:rgba(255,255,255,.5);
          border:1px solid rgba(17,17,17,.08)">
          <div onclick="st.weekOpen=!st.weekOpen;save();render()"
            style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer">
            <span style="flex:none;font:600 10.5px/1 var(--sans);letter-spacing:.12em;
              color:var(--grey)">WEEK</span>
            <div style="flex:1;display:flex;gap:5px;min-width:0">${chips}</div>
            <span style="flex:none;font:600 10.5px/1 var(--sans);letter-spacing:.1em;
              color:var(--grey2)">${done}/${target}</span>
            <span style="flex:none;font:400 13px/1 var(--sans);color:var(--grey2);
              transform:rotate(${st.weekOpen?180:0}deg)">⌄</span>
          </div>
          ${st.weekOpen?`<div style="padding:0 14px 14px">
            <div class="rail" style="display:flex;gap:9px;overflow-x:auto;
              scroll-snap-type:x mandatory;padding:2px 0;-webkit-overflow-scrolling:touch">
            ${cells.map((dd,n)=>{
              const on=n===idx;
              const rest=isRestCell(dd);
              const wd=dayFor(n);
              /* done means that day's date was actually trained, not that a
                 counter has moved past it */
              const cd=new Date(mon); cd.setDate(mon.getDate()+wd);
              const past=trained.has(cd.toDateString());
              /* the two kinds of day read as two kinds of day, whether or
                 not one of them happens to be today */
              const tint = rest ? 'var(--sage)' : 'var(--forest)';
              return `<div style="flex:none;width:138px;scroll-snap-align:start;padding:13px;
                border-radius:18px;
                border:1px solid ${on?'transparent':rest?'rgba(143,190,202,.65)':'rgba(17,17,17,.1)'};
                background:${on?tint:rest?'rgba(143,190,202,.16)':'#fff'};
                box-shadow:${on?'0 14px 30px -18px rgba(17,17,17,.85)':'0 1px 2px rgba(17,17,17,.04)'};
                transform:translateY(${on?-3:0}px)">
                <div style="display:flex;align-items:center;justify-content:space-between;min-height:20px">
                  <button onclick="event.stopPropagation();moveWorkout(${n},-1)" aria-label="Earlier in the week"
                    style="border:none;background:none;cursor:pointer;width:40px;height:40px;margin:-10px 0;
                    display:grid;place-items:center;font:600 17px/1 var(--sans);
                    color:${on&&!rest?'rgba(236,231,226,.85)':'var(--grey)'}">‹</button>
                  <span style="font:700 10px/1 var(--sans);letter-spacing:.14em;
                    color:${on?(rest?'var(--deep)':'var(--on-primary)'):rest?'#3d7b8c':'var(--forest)'}">${DAYL[wd]}</span>

                  ${rest?`<span style="display:inline-block;margin-top:8px;padding:3px 7px;border-radius:5px;
                    background:${on?'rgba(0,64,61,.16)':'rgba(61,123,140,.16)'};
                    font:700 8.5px/1 var(--sans);letter-spacing:.13em;
                    color:${on?'var(--deep)':'#3d7b8c'}">MOBILITY</span>`:''}
                  <p style="margin:8px 0 0;font:400 16px/1.18 var(--serif);
                    color:${on?(rest?'var(--deep)':'var(--on-primary)'):'var(--ink)'}">${esc(dd.n)}</p>
                  <span style="display:block;margin-top:7px;font:500 12px/1.3 var(--sans);
                    color:${on?(rest?'rgba(0,64,61,.6)':'rgba(236,231,226,1)'):'var(--grey2)'}">${esc(dd.sub||'')}</span>
                  ${past?`<span style="display:block;margin-top:8px;font:600 10px/1 var(--sans);
                    color:${on?(rest?'var(--deep)':'var(--on-primary)'):'var(--forest)'}">✓ DONE</span>`:''}
                </div>
              </div>`;}).join('')}
            </div>
            <div style="display:flex;gap:14px;padding-top:11px">
              <span style="display:inline-flex;align-items:center;gap:6px;font:400 11.5px/1 var(--sans);
                color:var(--grey2)"><i style="width:9px;height:9px;border-radius:3px;
                background:var(--forest)"></i>Session</span>
              <span style="display:inline-flex;align-items:center;gap:6px;font:400 11.5px/1 var(--sans);
                color:var(--grey2)"><i style="width:9px;height:9px;border-radius:3px;
                background:var(--sage)"></i>Mobility day</span>
            </div>
            <div style="font:400 11.5px/1.5 var(--sans);color:var(--grey2);padding-top:8px">
              Tap a day to see its drills. The arrows move it to another day of the week.</div>
          </div>`:''}
        </div>`;})();
}
function sessionCalendar(){
  const ss=((st.prog&&st.prog.sessions)||[]).filter(x=>x&&x.at);
  /* days the app was opened but nothing was logged. Turning up is worth
     seeing next to training: it is the difference between a quiet week and
     a week you disappeared. */
  const opens=new Set(((st.prog&&st.prog.opens)||[]));
  const byDay={};
  ss.forEach(x=>{ (byDay[dayKey(x.at)]=byDay[dayKey(x.at)]||[]).push(x); });

  const now=new Date(); now.setDate(1);
  now.setMonth(now.getMonth()-(st.calOff|0));
  const y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const lead=(first.getDay()+6)%7;                       /* Monday first */
  const title=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const todayK=dayKey(Date.now());

  let full=0, part=0, missed=0, opened=0;
  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<div></div>');
  for(let dn=1;dn<=last.getDate();dn++){
    const k=dayKey(new Date(y,m,dn,12));
    const list=byDay[k]||[];
    const isToday=k===todayK;
    const future=new Date(y,m,dn)>new Date();
    const done=list.some(x=>x.done || x.kind==='all');
    const miss=list.length && list.every(x=>x.kind==='none');
    const of=list.reduce((a,x)=>a+(Number(x.of)||0),0);
    const got=list.reduce((a,x)=>a+Math.min(Number(x.of)||0,Number(x.got)||0),0);
    const approx=list.some(x=>x.approx);
    const pc=approx?0.5:(of?Math.max(0,Math.min(1,got/of)):(done?1:0));
    const onlyOpened = !list.length && opens.has(k);
    if(done) full++; else if(miss) missed++; else if(list.length) part++;
    if(onlyOpened) opened++;

    const bg = done ? 'var(--forest)'
      : miss ? 'var(--amber)'
      : list.length ? `rgba(0,102,99,${(0.28+0.5*pc).toFixed(2)})`
      : 'transparent';
    const fg = (done||miss||(list.length&&pc>0.45)) ? 'var(--bg)'
      : future ? '#c9c4be' : 'var(--grey2)';
    const tip = done ? 'Whole session done' : miss ? 'Logged as not trained'
      : list.length ? (approx||!of ? 'Part of the session' : got+' of '+of+' drills')
      : onlyOpened ? 'Opened the app, nothing logged'
      : future ? '' : 'Nothing logged';
    const sel = st.calDay===k;
    const ring = sel ? '0 0 0 2px var(--deep)'
      : isToday ? '0 0 0 1.5px var(--forest)'
      : onlyOpened ? 'inset 0 0 0 1.5px rgba(0,102,99,.32)' : 'none';
    const tap = (list.length||onlyOpened) ? `onclick="calPick('${k}')"` : '';
    cells.push(`<div style="aspect-ratio:1;display:grid;place-items:center">
      <span ${tap} title="${esc(tip)}" style="width:29px;height:29px;border-radius:9px;display:grid;
        place-items:center;font:${done||miss?'700':'400'} 12px/1 var(--sans);background:${bg};color:${fg};
        box-shadow:${ring};${tap?'cursor:pointer':''}">${dn}</span></div>`);
  }
  const head=['M','T','W','T','F','S','S'].map(x=>
    `<div style="text-align:center;font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${x}</div>`).join('');
  const key=(c,t)=>`<span style="display:inline-flex;align-items:center;gap:6px;
    font:400 11.5px/1 var(--sans);color:var(--grey)">
    <i style="width:10px;height:10px;border-radius:3px;background:${c}"></i>${t}</span>`;
  return `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <span class="kick2">WHAT YOU ACTUALLY DID</span>
      <span style="display:flex;gap:4px">
        <button class="back" onclick="calShift(1)" style="padding:2px 8px;color:var(--grey2)">‹</button>
        <span style="font:600 11.5px/1.6 var(--sans);color:var(--ink)">${esc(title)}</span>
        <button class="back" onclick="calShift(-1)" style="padding:2px 8px;
          color:${(st.calOff|0)?'var(--grey2)':'rgba(17,17,17,.18)'}">›</button>
      </span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:14px 0 6px">${head}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${cells.join('')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:13px;margin-top:15px;padding-top:13px;
      border-top:1px solid rgba(28,32,25,.08)">
      ${key('var(--forest)','Whole session')}
      ${key('rgba(0,102,99,.5)','Part of it')}
      ${key('var(--amber)','Not trained')}
      <span style="display:inline-flex;align-items:center;gap:6px;font:400 11.5px/1 var(--sans);
        color:var(--grey)"><i style="width:10px;height:10px;border-radius:3px;
        box-shadow:inset 0 0 0 1.5px rgba(0,102,99,.32)"></i>Opened only</span>
    </div>
    ${(function(){
      /* the two numbers this screen exists for */
      const wkStart=new Date(); wkStart.setHours(0,0,0,0);
