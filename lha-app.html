 {n:'Wall Work',goal:'Hold chest-to-wall 45–60s and start moving against the wall.',hold:'45s',drills:16,
  intro:'Now you own the wall, get strong and mobile on it. Scapular strength, longer holds, and the first movements that take weight off the wall.',
  ch:'Slide away & hold',chSub:'Slide off the wall and hold your balance as long as you can. Aim for 15 seconds.',
  drillIds:['scapula-shrugs','wall-walks','tuck-slides','single-leg-tuck-slides','lateral-slide-outs','slide-away','pike-press-ups','knees-on-box']},
 {n:'Take-Off',goal:'Leave the wall into brief moments of freestanding balance.',hold:'5s',drills:15,
  intro:'This is where the wall disappears. Single-leg take-offs, box work and tuck take-offs build the control to leave on your own terms.',
  ch:'Free handstand attempt',chSub:'Take off and catch your balance. Hold whatever you find.',
  drillIds:['knees-on-box','single-leg-take-off','single-leg-wall-removals','slide-away-2','tuck-take-offs']},
 {n:'Freestanding',goal:'Kick up and balance freestanding, consistently.',hold:'30s',drills:18,
  intro:'Entries, shapes and corrections. The stage where a handstand becomes something you can repeat rather than catch.',
  ch:'Freestanding hold',chSub:'Kick up and hold freestanding. Aim for 30 seconds clean.',
  drillIds:['tuck-entries','straight-entries','straddle-entries','straddle-to-straight','straight-to-tuck-back','straddle-to-diamond']},
 {n:'Press',goal:'Compress, unroll and press to handstand.',hold:'20s',drills:17,
  intro:'The press is strength, compression and patience in one skill. Part of the Press Masterclass.',
  ch:'Chest-to-wall press',chSub:'One clean press attempt from the wall. Compress, unroll, hold.',
  drillIds:['press-walks','p-pancake','knees-on-box','p-bench-zombies','chest-to-wall-toe-taps']}];
const QUIZ=[
 {q:'Can you hold a chest-to-wall handstand for 15 seconds?',opts:['Not yet — still building up to it','Just about, not consistently','Yes, comfortably']},
 {q:'Do you feel stuck at the wall?',opts:["Yes — I can't get off it yet",'Tapping a foot off, but no balance','No — I can balance away from it']},
 {q:'Can you kick up and balance freestanding on your own?',opts:['Not yet','Sometimes, briefly','Yes — refining entries and shapes']}];
const TIERS=[['The five-stage ladder','✓','✓'],['Level-finder quiz','✓','—'],['Quick session builder','✓','✓'],
 ['Guided follow-along player','✓','✓'],['Drill library','Stage-gated','All drills'],['Max hold timer','✓','✓'],
 ['Offline use','✓','✓'],['Programme written for you','—','✓'],["Coach's read on the block",'—','✓'],
 ['Too easy / too hard flags','Self only','To Elliott'],['Chat with Elliott','—','✓'],
 ['Form check on your footage','One free','Unlimited'],['Two-week test reviewed','Self-scored','By Elliott'],
 ['Session summary to coach','—','✓'],['Workshops','Book','Member price']];

/* every drill the app knows about, from the programme data */
function allDrills(){ const out=[];
  DATA.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{ if(!out.some(x=>x.v===it.v)) out.push(it); })));
  return out; }
const drillById=v=>allDrills().find(d=>d.v===v)||LIBRARY.find(d=>d.v===v);
/* free-tier doses: the ladder is drills, not a written prescription */
const FREE_DOSE={'wrist-circles-mob':'30s each way','scapula-shrugs':'3 × 10','wall-walks':'3 × 3 walks in',
 'chest-to-wall-bailouts':'3 × 3 each way','tuck-slides':'build to 5','single-leg-tuck-slides':'build to 5 each',
 'lateral-slide-outs':'3 × 6 each','slide-away':'3 × build to 5','pike-press-ups':'3 × 8',
 'knees-on-box':'2 sets · build to 30s','kick-up-bounces':'3 × 10','plank-fingertip-lifts':'10 reps',
 'shoulder-circles':'10 each way','downward-dog-pulses':'10 reps','single-leg-take-off':'build to 5',
 'single-leg-wall-removals':'build to 5','slide-away-2':'build to 5','tuck-take-offs':'build to 5',
 'tuck-entries':'10 reps','straight-entries':'10 reps','straddle-entries':'10 reps',
 'straddle-to-straight':'build to 6','straight-to-tuck-back':'build to 6','straddle-to-diamond':'build to 6',
 'press-walks':'1 × up and down the mat','p-pancake':'3 × 60s','p-bench-zombies':'2 × 5–8',
 'chest-to-wall-toe-taps':'3 × 8','chest-to-wall-handstand':'3 × 30s'};
const curStage=()=>st.stage==null?1:st.stage;

/* ── level-finder quiz ── */
function screenQuiz(){
  const i=st.quizStep|0, q=QUIZ[i];
  const rails=QUIZ.map((_,n)=>`<i style="flex:1;height:4px;border-radius:2px;background:${n<=i?'var(--sand)':'rgba(255,255,255,.2)'}"></i>`).join('');
  return `<div style="min-height:100dvh;background:var(--forest);padding:calc(env(safe-area-inset-top) + 22px) 24px 30px;
    color:var(--bg);display:flex;flex-direction:column">
    <div style="display:flex;gap:5px">${rails}</div>
    <div class="kick" style="margin-top:26px">FIND YOUR LEVEL · ${i+1} OF ${QUIZ.length}</div>
    <div class="h-lg" style="margin-top:16px">${esc(q.q)}</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:auto">
      ${q.opts.map((o,oi)=>`<button onclick="answerQuiz(${oi})" style="background:rgba(255,255,255,.08);border:none;
        border-radius:18px;padding:18px;font:500 15px/1.3 var(--sans);color:var(--bg);cursor:pointer;text-align:left">
        ${esc(o)}</button>`).join('')}
    </div></div>`;
}
function answerQuiz(oi){
  st.quizAns=(st.quizAns||[]).concat([oi]);
  if(st.quizAns.length<QUIZ.length){ st.quizStep=st.quizAns.length; save(); render(); return; }
  const score=st.quizAns.reduce((a,b)=>a+b,0);
  st.stage=score<=1?0:score<=3?1:score<=5?2:3;
  st.quizDone=true; st.tab='ladder'; save(); render();
}

/* ── ladder home ── */
function screenLadder(){
  const s=STAGES[curStage()];
  const best=st.bestHold||0;
  const goal=parseInt(s.hold,10)||30;
  const pct=Math.min(100,Math.round(best/goal*100));
  const cards=STAGES.map((x,i)=>{
    const state=i<curStage()?'done':i===curStage()?'current':'locked';
    const bg=state==='current'?'#fff':state==='done'?'rgba(255,255,255,.55)':'rgba(255,255,255,.4)';
    return `<button onclick="openStage(${i})" style="border:none;text-align:left;background:${bg};border-radius:22px;
      padding:16px 18px;cursor:pointer;width:100%;${state==='current'?'box-shadow:0 2px 20px rgba(28,32,25,.08)':''}">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:34px;height:34px;border-radius:999px;flex:none;display:grid;place-items:center;
          font:700 13px/1 var(--sans);background:${state==='locked'?'var(--mist)':'var(--forest)'};
          color:${state==='locked'?'var(--grey2)':'var(--bg)'}">${state==='done'?'✓':i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font:600 15px/1.2 var(--sans);color:${state==='locked'?'var(--grey2)':'var(--ink)'}">${esc(x.n)}</div>
          <div style="font:400 12.5px/1.4 var(--sans);color:var(--grey);margin-top:5px">${esc(x.goal)}</div></div>
        <span class="pill" style="flex:none;background:${state==='current'?'rgba(200,122,86,.14)':'transparent'};
          color:${state==='current'?'var(--terra)':'var(--grey2)'}">${state==='current'?'NOW':state==='done'?'DONE':'LOCKED'}</span>
      </div></button>`;
  }).join('');
  return `<div class="scroll s">
    <div class="hero">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="kick">THE HANDSTAND LADDER</span>
        <span class="pill" style="color:var(--ink);background:var(--sand)">FREE</span></div>
      <div class="h-xl" style="font-size:38px;margin-top:18px">Stage ${curStage()+1} — ${esc(s.n)}</div>
      <div style="font:400 14.5px/1.5 var(--sans);color:var(--sage);margin-top:10px">${esc(s.goal)}</div>
      <div style="height:6px;border-radius:999px;background:rgba(255,255,255,.15);margin-top:18px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:var(--sand);border-radius:999px"></div></div>
      <div style="display:flex;justify-content:space-between;font:500 11px/1 var(--sans);color:var(--sage);margin-top:9px">
        <span>${pct}% of this stage</span><span>Best hold ${best}s · goal ${esc(s.hold)}</span></div>
    </div>
    <div class="pad" style="padding-top:18px">
      <div class="card">
        <div class="kick2">TRAIN NOW</div>
        <div class="h-lg" style="font-size:30px;margin-top:12px">How long have you got?</div>
        <div style="display:flex;gap:8px;margin-top:16px">
          ${[15,30,45].map(t=>`<button onclick="st.time=${t};save();render()" style="flex:1;border:none;cursor:pointer;
            border-radius:14px;padding:14px 0;font:700 14px/1 var(--sans);
            background:${(st.time||30)===t?'var(--forest)':'var(--mist)'};
            color:${(st.time||30)===t?'var(--bg)':'var(--forest)'}">${t} min</button>`).join('')}
        </div>
        <button class="btn" style="margin-top:18px" onclick="buildFreeSession()">Build my session
          <small>${(st.time||30)} MIN · STAGE ${curStage()+1}</small></button>
        <button class="btn2" style="width:100%;margin-top:9px" onclick="openOv('hold')">Max hold timer</button>
      </div>
    </div>
    <div class="pad">
      <div class="h-sm" style="padding:0 4px 12px">The ladder</div>
      <div style="display:flex;flex-direction:column;gap:9px">${cards}</div>
    </div>
    <div style="padding:16px 16px 26px">
      <button onclick="go('coaching')" style="width:100%;text-align:left;border:none;background:var(--terra);
        border-radius:26px;padding:22px 20px;color:#fff;cursor:pointer">
        <div class="kick2" style="color:rgba(255,255,255,.8)">WANT ELLIOTT'S EYES ON IT</div>
        <div class="h-md" style="margin-top:12px">The ladder is the map. Coaching is someone reading it with you.</div>
        <div style="font:400 13.5px/1.5 var(--sans);color:rgba(255,255,255,.85);margin-top:10px">
          A programme built for you, form checks on your own footage, and adjustments every fortnight.</div>
        <div style="margin-top:16px;background:#fff;border-radius:14px;padding:14px;text-align:center;
          font:600 13px/1 var(--sans);color:var(--ink)">See what coaching adds</div>
      </button>
    </div></div>`;
}
function ladderTick(v){ st.ladderDone=st.ladderDone||{}; st.ladderDone[v]=!st.ladderDone[v]; save(); drawOv(); }
function openStage(i){ st.ovStage=i; openOv('stage'); }

/* a session built from the current stage's drills, to fit the time chosen */
function buildFreeSession(){
  const mins=st.time||30, s=STAGES[curStage()];
  const pool=s.drillIds.map(drillById).filter(Boolean)
    .map(d=>Object.assign({},d,{d:d.d||FREE_DOSE[d.v]||'3 × 8'}));
  if(!pool.length){ alert('Nothing filmed for this stage yet.'); return; }
  /* Expand each drill into its sets, then fill the time chosen — one set
     from each drill in turn, so a short session still covers the stage
     rather than doing three sets of the first thing and stopping. */
  const budget=mins*60; const out=[]; let secs=0, round=0, added=true;
  while(added && secs<budget){
    added=false;
    for(const it of pool){
      const n=sets(it.d); if(round>=n) continue;
      const t=work(it)+rest(it);
      if(secs+t>budget){ added=false; break; }
      out.push({it,gi:0,ii:out.length,set:round+1,sets:n,grp:s.n});
      secs+=t; added=true;
    }
    round++;
    if(round>6) break;
  }
  if(!out.length) out.push({it:pool[0],gi:0,ii:0,set:1,sets:1,grp:s.n});
  Q=out; qi=0; phase='work'; paused=false;
  $('#player').classList.add('on');
  $('#player').innerHTML=playerShell();
  showStep();
}

/* ── coaching pitch (free tier's 4th tab) ── */
function screenCoaching(){
  const rows=TIERS.map(([n,f,c])=>`<div style="background:#fff;padding:11px 13px;display:flex;align-items:center;gap:8px">
    <span style="flex:1;font:500 12.5px/1.3 var(--sans)">${esc(n)}</span>
    <span style="flex:none;width:62px;text-align:center;font:500 11px/1.2 var(--sans);color:${f==='—'?'#c2c5b9':'var(--grey)'}">${f}</span>
    <span style="flex:none;width:62px;text-align:center;font:600 11px/1.2 var(--sans);color:${c==='—'?'#c2c5b9':'var(--terra)'}">${c}</span>
  </div>`).join('');
  const faqs=[['What actually changes?','You stop guessing. The programme is written for your body and your week, and it changes every fortnight based on what you send me.'],
   ['Do I need to be at a certain level?','No. Most people start somewhere between "can kick up" and "can\'t hold it". Complete beginners are welcome.'],
   ['Can I do it fully online?','Yes. Programming and form checks work anywhere. In-person in London is an optional add-on.'],
   ['What if I have a niggle?','Tell me at the start. We build around it, and Beth — our Chartered Physio — is on the team.']]
   .map(([q,a],i)=>`<div style="padding:14px 0;border-top:1px solid rgba(28,32,25,.08);cursor:pointer"
      onclick="st.faq=st.faq||{};st.faq[${i}]=!st.faq[${i}];save();render()">
      <div style="display:flex;justify-content:space-between;gap:10px">
        <span style="font:500 14.5px/1.3 var(--sans)">${esc(q)}</span>
        <span style="font:400 15px/1 var(--serif);color:var(--terra)">${(st.faq||{})[i]?'−':'+'}</span></div>
      ${(st.faq||{})[i]?`<div style="font:400 14px/1.55 var(--sans);color:var(--grey);margin-top:9px">${esc(a)}</div>`:''}
    </div>`).join('');
  return `<div class="scroll s">
    <div style="background:var(--forest);padding:calc(env(safe-area-inset-top) + 10px) 22px 22px;color:var(--bg)">
      <div class="h-md" style="font-size:30px">Get Elliott's eyes on it</div>
      <div style="font:400 14px/1.5 var(--sans);color:var(--sage);margin-top:10px">
        One filmed attempt, one written answer. Free once — after that it comes with coaching.</div></div>
    <div style="padding:16px 16px 30px;display:flex;flex-direction:column;gap:11px">
      <div class="card" style="padding:20px">
        <div class="kick2">YOUR FREE FORM CHECK</div>
        <button onclick="post({type:'Free form check'});this.textContent='Sent — I\\'ll be in touch'"
          style="width:100%;border:1.5px dashed rgba(28,32,25,.2);background:none;border-radius:20px;padding:30px;
          text-align:center;margin-top:14px;cursor:pointer">
          <div class="h-md">Film or upload</div>
          <div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:8px">
            Side on, phone vertical, whole body in frame. Don't crop the hands out.</div></button>
        <div style="font:500 12px/1.5 var(--sans);color:var(--grey2);margin-top:12px">
          One clean attempt is more use than five scrappy ones.</div>
      </div>
      <div class="card" style="padding:20px">
        <div class="kick2">WHAT EACH TIER GETS</div>
        <div style="margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid rgba(28,32,25,.08)">
          <div style="background:var(--mist);padding:10px 13px;display:flex;gap:8px">
            <span style="flex:1"></span>
            <span style="flex:none;width:62px;text-align:center;font:700 9.5px/1 var(--sans);letter-spacing:.12em;color:var(--grey)">FREE</span>
            <span style="flex:none;width:62px;text-align:center;font:700 9.5px/1 var(--sans);letter-spacing:.12em;color:var(--terra)">COACHED</span>
          </div>${rows}</div>
      </div>
      <div class="card" style="padding:20px">
        <div class="kick2">COMMON QUESTIONS</div><div style="margin-top:12px">${faqs}</div></div>
      <button class="btn" onclick="post({type:'Coaching enquiry'});alert('Sent — Elliott will be in touch.')">Apply for coaching</button>
      <button class="btn2" style="width:100%" onclick="st.tab='signin';save();render()">Coaching client? Sign in</button>
    </div></div>`;
}

/* ── the welcome gate: free by default, coached with a code ── */
function screenWelcome(){
  return `<div style="min-height:100dvh;background:linear-gradient(180deg,var(--forest),var(--ink));
    padding:calc(env(safe-area-inset-top) + 40px) 26px 30px;color:var(--bg);display:flex;flex-direction:column">
    <div class="kick">LONDON HANDSTAND ACADEMY</div>
    <div class="h-xl" style="font-size:44px;margin-top:auto">The Handstand Ladder</div>
    <div style="font:400 15px/1.55 var(--sans);color:var(--sage);margin-top:14px">
      Five stages, from your first wall hold to a freestanding press. Free, and it works offline.</div>
    <div style="margin-top:26px;display:flex;flex-direction:column;gap:10px">
      <button class="btn" style="background:var(--bg);color:var(--ink)" onclick="startFree()">Start free</button>
      <button class="btn" style="background:none;border:1.5px solid rgba(242,239,231,.28);color:var(--bg);font-weight:600"
        onclick="st.tab='signin';save();render()">Coaching client? Sign in</button>
    </div>
    <div style="font:400 12.5px/1.6 var(--sans);color:#7d8b74;margin-top:20px;text-align:center">
      No account needed to train. Signing in only saves your progress across devices.</div></div>`;
}
function startFree(){ st.mode='free'; st.tab=st.quizDone?'ladder':'quiz'; st.quizStep=0; st.quizAns=[]; save(); render(); }

/* ── max hold timer (free tier) ── */
let holdT=null,holdS=0;
function drawHold(){
  const mm=String(Math.floor(holdS/60)),ss=String(holdS%60).padStart(2,'0');
  $('#ov').innerHTML=`<div class="ovhead"><button class="back" onclick="stopHold();closeOv()">← Back</button>
    <div class="h-lg" style="margin-top:16px">Max hold</div>
    <div style="font:400 14px/1.5 var(--sans);color:var(--sage);margin-top:8px">
      Best so far ${st.bestHold||0}s. Start it, kick up, stop it when you come down.</div></div>
    <div style="padding:40px 18px;text-align:center">
      <div class="h-xl" style="font-size:96px;color:var(--terra)">${holdS>=60?mm+':'+ss:holdS}</div>
      <div class="kick2" style="margin-top:12px">SECONDS</div>
      <button class="btn" style="margin-top:30px" onclick="toggleHold()">${holdT?'Stop':'Start'}</button>
      ${holdS&&!holdT?`<button class="btn2" style="width:100%;margin-top:10px" onclick="saveHold()">Save ${holdS}s as my best</button>`:''}
    </div>`;
}
function toggleHold(){ if(holdT){ clearInterval(holdT); holdT=null; } else { holdS=0; holdT=setInterval(()=>{holdS++;drawHold();},1000); } drawHold(); }
function stopHold(){ if(holdT){clearInterval(holdT);holdT=null;} holdS=0; }
function saveHold(){ if(holdS>(st.bestHold||0)) st.bestHold=holdS;
  save(); reportProgress({hold:st.bestHold||0}); stopHold(); closeOv(); }

/* ── shell ─────────────────────────────────────────────────── */
const TABS={
  coached:[['today','Today'],['plan','Plan'],['progress','Progress'],['ask','Ask'],['more','More']],
  free:[['ladder','Ladder'],['progress','Progress'],['coaching','Coaching'],['more','More']]
};
function go(t){ st.tab=t; save(); render(); if(t==='ask') loadThread(); }
function render(){
  const app=$('#app');
  /* accent tells you which product you are in without reading a word:
     sand for the free ladder, terracotta for coached */
  document.documentElement.style.setProperty('--accent', st.in?'var(--terra)':'var(--sand)');
  document.body.dataset.tier = st.in?'coached':'free';
  if(st.tab==='signin' && !st.in){ app.innerHTML=screenSignIn(); return; }
  if(!st.mode && !st.in){ app.innerHTML=screenWelcome(); return; }
  if(st.mode==='free' && !st.quizDone && st.tab==='quiz'){ app.innerHTML=screenQuiz(); return; }
  const coached=!!st.in;
  const screens=coached
    ? {today:screenToday,plan:screenPlan,progress:screenProgress,ask:screenAsk,more:screenMore}
    : {ladder:screenLadder,progress:screenProgress,coaching:screenCoaching,more:screenMore};
  const tabs=TABS[coached?'coached':'free'];
  if(!screens[st.tab]) st.tab=tabs[0][0];
  const bar=tabs.map(([id,l])=>`<button class="tab ${st.tab===id?'on':''}" onclick="go('${id}')"><i></i><span>${l}</span></button>`).join('');
  app.innerHTML=screens[st.tab]()+`<nav class="tabbar">${bar}</nav>`;
  lazyThumbs();
}
document.addEventListener('DOMContentLoaded',function(){
  /* cache first so a signed-in client sees their plan instantly, then
     refresh in the background in case it changed since last time */
  if(st.in && st.token) loadCachedProgramme();
  render();
  if(st.in && st.token){ loadProgramme(); reportProgress(); }
});
render();
</script>
