<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">

<title>London Handstand Academy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 /* Repainted from the Claude Design Today canvas. Same token names so
    nothing downstream had to change — only what they resolve to. Warm
    neutral ground, deep teal doing the work forest green used to, pale
    blue where sand was, and terracotta kept but retuned: it is the only
    warning colour in the app and teal cannot carry that meaning. */
 --bg:#ece7e2; --page:#e4dfda; --forest:#006663; --forest-d:#00403d; --ink:#111111;
  --sand:#cfe6ec; --sage:#8fbeca; --grey:#6b6b6b; --grey2:#8a8a8a;
 --mist:#e3ded8; --red:#a4503c; --line:rgba(17,17,17,.12);
 /* roles the full-app source showed that the Today file alone did not:
    an off-white that sits on teal, an amber accent, and the deep teal
    used for text on pale grounds */
 --on-primary:#f7f4f1; --amber:#f3a949; --deep:#00403d;
 --serif:Newsreader,Georgia,serif; --sans:Figtree,system-ui,sans-serif;
}
body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--ink);
 -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
 /* the page itself never scrolls — only .scroll does, so the tab bar stays put */
 height:100dvh;overflow:hidden}
.s::-webkit-scrollbar{display:none}.s{scrollbar-width:none}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
 background:var(--bg);overflow:hidden}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:34%;width:7px;height:7px;border-radius:2px;
  opacity:0;transform:rotate(var(--a)) translateY(0);
  animation:pop 900ms cubic-bezier(.2,.7,.3,1) var(--t) 1 both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes riseB{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn,.btn2{transition:background .3s,transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.btn:active,.btn2:active{transform:scale(.98)}
.card{transition:box-shadow .4s,transform .4s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){
 .btn:hover{background:#007a75}
 .btn2:hover{background:rgba(0,102,99,.05)}
 .rail>div:hover{transform:translateY(-3px)}
}
.rail>div{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
}
@keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes riseB{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(101%)}to{transform:none}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
/* one class so a section can be given the design's entrance and its delay */
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.rise-1{animation-delay:.1s}.rise-2{animation-delay:.16s}
.rise-3{animation-delay:.3s}.rise-4{animation-delay:.36s}
@media (prefers-reduced-motion:reduce){
  .rise,[style*="animation:rise"],[style*="animation:shimmer"]{animation:none!important}
}
@keyframes pop{0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.4)}
  15%{opacity:1}
  100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d)*-1)) scale(1) }}
@media(prefers-reduced-motion:reduce){.burst{display:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.hero{position:relative;overflow:hidden;

 background:linear-gradient(178deg,#0a7b74,#046e68);color:var(--bg);border-radius:0 0 30px 30px}
.hero::before{content:'';position:absolute;top:-120px;right:-90px;width:280px;height:280px;
 border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,rgba(143,190,202,.22),transparent 70%)}
.hero>*{position:relative}
body[data-tier=free] .hero{background:linear-gradient(180deg,#0a7b74,#006663)}
body[data-tier=free] .btn{background:#0a7b74}
.kick{font:600 10px/1 var(--sans);letter-spacing:.2em;color:var(--sage)}
.kick2{font:600 9.5px/1 var(--sans);letter-spacing:.16em;color:var(--grey2)}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400}
.h-xl{font:400 40px/1.02 var(--serif)} .h-lg{font:400 34px/1.06 var(--serif)}
.h-md{font:400 26px/1.1 var(--serif)} .h-sm{font:400 22px/1 var(--serif)}
.card{background:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 2px 20px rgba(28,32,25,.06)}
.pad{padding:12px 16px 0}
.btn{border:none;width:100%;background:var(--forest);border-radius:18px;padding:18px;cursor:pointer;
 font:700 15px/1 var(--sans);color:var(--on-primary);display:block;
 transition:background .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.btn:hover{background:#007A75}
.btn:active{transform:scale(.98)}
.btn2{transition:background .3s,transform .25s cubic-bezier(.2,.8,.2,1)}
.btn2:hover{background:rgba(0,102,99,.05)}
.btn2:active{transform:scale(.98)}
.card{transition:box-shadow .4s,transform .4s cubic-bezier(.2,.8,.2,1)}
.rail>*{transition:transform .4s cubic-bezier(.2,.8,.2,1)}

video{width:100%;display:block;background:#000}
.row{padding:15px 18px;border-bottom:1px solid rgba(28,32,25,.07)}
.row:last-child{border-bottom:none}

 display:grid;place-items:center;font-size:13px;color:transparent;cursor:pointer;background:#fff}

 border:1px solid var(--line);background:#fff;color:var(--grey2)}

}

.act:focus-visible{outline:2px solid var(--forest); outline-offset:2px}

/* ── follow-along player ─────────────────────────────────────────
   Ported from the programme pages, which read better than the dark
   version this replaced: stone ground, whole video visible rather
   than cropped, cues on screen while you work. */
#player{position:fixed;inset:0;z-index:990;background:#f4f1ed;color:var(--ink);
 display:none;flex-direction:column;overflow:hidden}
#player.on{display:flex}
#player.resting{background:#ece7e2}
.p-bar{flex:none;height:calc(52px + env(safe-area-inset-top,0px));
 padding:env(safe-area-inset-top,0px) 10px 0 16px;display:flex;align-items:center;
 justify-content:space-between;gap:10px;background:#fff;border-bottom:1px solid rgba(28,32,25,.1)}
.p-idx{font:700 11.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--grey2)}
.p-clock{font:400 21px/1 var(--serif);font-variant-numeric:tabular-nums}

 color:var(--ink);font:600 13px/1 var(--sans);cursor:pointer;display:grid;place-items:center;padding:0}

 color:var(--forest);background:rgba(47,61,47,.09);border-radius:999px;padding:7px 13px}

.p-main{display:flex;gap:18px;margin-top:16px;align-items:flex-start}

 color:var(--grey2);margin-top:8px}

.p-info{flex:1;min-width:0}
.p-name{font:400 clamp(21px,5.5vw,29px)/1.08 var(--serif)}

.p-cues{display:flex;flex-direction:column;gap:8px}

 background:#fff;border-top:1px solid rgba(28,32,25,.1)}

 font:600 14.5px/1 var(--sans)}

 cursor:pointer;text-decoration:underline;padding:6px 0}
.p-extend{display:flex;gap:7px}

 font:600 12px/1 var(--sans);color:var(--ink);cursor:pointer}
.dr{border-bottom:1px solid rgba(28,32,25,.07)}
.dr:last-child{border-bottom:none}
.dr-head{display:flex;align-items:center;gap:12px;padding:13px 15px}

 color:#fff;font-size:12px;cursor:pointer;display:grid;place-items:center;padding:0}
.dr-mid{flex:1;min-width:0}
.dr-n{display:block;font:600 14.5px/1.25 var(--sans)}

.dr-demo{flex:none;background:none;border:1px solid rgba(28,32,25,.16);border-radius:999px;
 padding:8px 13px;font:600 12px/1 var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap}

.dr.open .dr-body{display:block}

.p-upblock{margin-top:9px}

 font:600 12px/1 var(--sans);display:grid;place-items:center;flex:none}

</style></head><body><div id="app"></div>
<script>
let DATA={
  /* Deliberately empty. Plans arrive from /api/app/programme, chosen by the
     signed-in client's token. A real plan used to sit here, which meant one
     client's programme — and the personal note at the top of it — shipped to
     everyone who opened this file. */
  days:[{id:'1',label:'Day 1',sub:'',title:'Day 1',when:'',mins:'0',groups:[]}],
  read:[], test:{blurb:'',items:[]}
};

/* ── London Handstand Academy — coached tier ─────────────────────
   Built from the Claude Design handoff. Coached client only for now;
   the free ladder tier shares this shell and lands next.

   Auth is a passwordless email code. The UI is real; the two calls it
   makes are documented in AUTH below and land on the existing worker
   (lha-worker.js already does magic links + Resend). Until those routes
   are deployed, DEV_CODE lets the flow be walked end to end. */
const AUTH = {
  request: '/api/app/code',    // POST {email} → emails a 6-digit code
  verify:  '/api/app/verify',  // POST {email, code} → {token, client}
  messages:'/api/app/messages',// GET → thread · POST {text} → send
  login:   '/api/app/login',   // POST {email,password} → {token, client}
  programme:'/api/app/programme', // GET → {client, plan, library} for the token
  password:'/api/app/password',  // POST {current,next}
  progress:'/api/app/progress',  // POST a summary · GET it back
  signup:'/api/app/signup',      // POST {email,password?,marketing}
  me:'/api/app/me',              // GET  {plus, coached, canManage}
  checkout:'/api/app/checkout',  // POST → Stripe Checkout url
  portal:'/api/app/portal',      // POST → Stripe billing portal url
  cancel:'/api/app/cancel',      // POST {undo?} → stop or resume renewal
  resetReq:'/api/app/reset/request',   // POST {email} → emails a code
  resetGo:'/api/app/reset/confirm',    // POST {email,code,password}
  subscription:'/api/app/subscription',// GET → live status and dates
  upload:'/api/app/upload',            // POST → a one-time Stream upload link
  image:'/api/app/image',              // POST a data URL → {id}; GET /image/{id} serves it
  prefs:'/api/app/prefs',              // GET|POST what they want emailing about
  questions:'/api/app/questions',      // GET yours, POST a new one
  intake:'/api/app/intake',            // POST the quiz answers so the coach can see them
  application:'/api/app/application',  // POST a coaching application
  submission:'/api/app/submission',    // POST numbers + clips as one review
  submissions:'/api/app/submissions',  // GET → what has been sent, and its status
  cycle:'/api/app/cycle'               // GET → where the client is in the block
};
const authed = () => ({'Content-Type':'application/json','Authorization':'Bearer '+(st.token||'')});
const DEV_CODE = '123456';

const K='lha_app';
let st={};
try{ st=JSON.parse(localStorage.getItem(K)||'{}')||{}; }catch(e){ st={}; }
function save(){ try{ localStorage.setItem(K,JSON.stringify(st)); }catch(e){} }
st.tab=st.tab||'today'; st.day=st.day|0; st.tick=st.tick||{}; st.rate=st.rate||{};
st.note=st.note||{}; st.open=st.open||{}; st.why=st.why||{};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=()=>DATA.days[st.day]||DATA.days[0];
const allItems=d=>d.groups.flatMap(g=>g.items);
const key=(di,gi,ii)=>di+'-'+gi+'-'+ii;

/* ── session queue ── */
function sets(dose){
  let m=/^\s*(\d+)\s*[×x]/.exec(dose); if(m) return +m[1];
  m=/^\s*(\d+)\s*sets?\b/i.exec(dose); if(m) return +m[1];
  return 1;
}
function work(it){
  const ov=st.secs&&it.v?st.secs[it.v]:0; if(ov) return ov;
  const d=it.d.toLowerCase(), n=it.n.toLowerCase();
  let m=/(\d+)\s*s\b/.exec(d); if(m) return +m[1];
  if(n.includes('entries')&&/^\s*\d+\s*reps/.test(d)) return 150;
  if(n.includes('entries')||/build to 6/.test(d)) return 150;
  if(/build to 10/.test(d)) return 210;
  if(n.includes('tuck slides')) return 120;
  if(n.includes('press walks')) return 90;
  if(n.includes('pancake')) return 90;
  return 40;
}
const rest=it=>/entries|build to/.test((it.n+it.d).toLowerCase())?60:35;
function queue(){
  const d=day(), q=[];
  d.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    const n=sets(it.d);
    for(let k=0;k<n;k++) q.push({it,gi,ii,set:k+1,sets:n,grp:g.name});
  }));
  return q;
}

/* ── screens ───────────────────────────────────────────────── */
function screenToday(){
  const d=day(), q=queue(), done=allItems(d).filter((_,i)=>false).length;
  const total=allItems(d).length;
  const ticked=d.groups.reduce((a,g,gi)=>a+g.items.filter((_,ii)=>st.tick[key(st.day,gi,ii)]).length,0);
  const mins=q.reduce((a,s)=>a+work(s.it)+rest(s.it),0);
  const hGrid=weekGrid(), hWeek=weekNow();
  const weeks=[1,2,3,4,5,6].map(w=>{
    const days=[0,1,2].map(i=>{
      const doneW = hGrid[w-1].length>i;
      return `<i style="flex:1;height:26px;border-radius:5px;background:${doneW?'var(--sand)':'rgba(255,255,255,.16)'}"></i>`;
    }).join('');
    return `<div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;gap:3px">${days}</div>
      <span style="font:600 9.5px/1 var(--sans);color:${w===3?'var(--bg)':'var(--sage)'};text-align:center">W${w}</span></div>`;
  }).join('');
  const pts=[['Stack early','Shoulders and hands aligned at the start of the entry, not fixed once you are up.'],

const PURPOSE={'Warm-up':'Wrists and shoulders','Entries — build to 6':'The position, every time',

const WHY={'Warm-up':'Four minutes so the first entry is not the warm-up. Wrists get loaded hard today.',
 'Entries — build to 6':'Entries are to practise entering the correct position every single time. Get fully into it, but do not make more than one adjustment before coming back down.',

 'Mobility':'At the end, when you are warm.',
 'Floats and press walks':'The press pattern at floor level — same shift of weight, no handstand needed.'};

/* ── Progress ── */
/* ── activity, from what is already recorded ───────────────────────
   opens[] is one ISO date per active day, kept for 180 days. sessions[]
   holds up to 200, each with planned and actual minutes. Neither needed
   any new instrumentation — the app has been collecting both all along
   and showing three numbers. */
function dayKey(d){ return new Date(d).toISOString().slice(0,10); }

function panelMonth(p){
  const opens=new Set(((p&&p.opens)||[]));
  const today=new Date(); today.setHours(12,0,0,0);
  /* start on the Monday 4 weeks back so the columns line up under M-S */
  const start=new Date(today); start.setDate(start.getDate()-27);
  start.setDate(start.getDate()-((start.getDay()+6)%7));
  const cells=[]; let active=0, prior=0;
  const d=new Date(start);
  while(d<=today || cells.length%7){
    const k=dayKey(d), on=opens.has(k), future=d>today;
    if(on) active++;
    cells.push(`<div style="aspect-ratio:1;display:grid;place-items:center">
      <span style="width:29px;height:29px;border-radius:999px;display:grid;place-items:center;
        font:${on?'700':'400'} 12px/1 var(--sans);
        background:${on?'var(--forest)':'transparent'};
        color:${on?'var(--bg)':future?'#c9c4be':'var(--grey2)'}">${d.getDate()}</span></div>`);
    d.setDate(d.getDate()+1);
    if(cells.length>42) break;
  }
  const cut=dayKey(new Date(Date.now()-28*864e5));
  const cut2=dayKey(new Date(Date.now()-56*864e5));
  opens.forEach(k=>{ if(k<cut && k>=cut2) prior++; });
  const delta=active-prior;
  const head=['M','T','W','T','F','S','S'].map(x=>
    `<div style="text-align:center;font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${x}</div>`).join('');
  return `<div class="card"><div class="kick2">PAST 4 WEEKS</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:14px 0 6px">${head}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells.join('')}</div>
    <div style="display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(28,32,25,.08)">
      ${[['Active days',String(active),''],
         ['vs prior 4wk',(delta>0?'+':'')+delta, delta>0?'var(--forest)':delta<0?'var(--amber)':''],
        ].map(([n,v,c])=>`<div style="flex:1">
        <div style="font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${n.toUpperCase()}</div>
        <div class="h-sm" style="font-size:19px;margin-top:5px;${c?'color:'+c:''}">${v}</div></div>`).join('')}
    </div></div>`;
}

function panelWeek(p){
  const ss=((p&&p.sessions)||[]).filter(x=>x&&x.at);
  const now=new Date(); now.setHours(23,59,59,999);
  const mins=[], labels=[];
  let thisWk=0, lastWk=0, drills=0, drillsLast=0;
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    const m=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.actual||x.mins||0),0);
    mins.push(m); thisWk+=m;
    drills+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.drills||0),0);
    labels.push(i===0?'TOD':['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]);
  }
  for(let i=13;i>=7;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    lastWk+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.actual||x.mins||0),0);
    drillsLast+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.drills||0),0);
  }
  const peak=Math.max(30,...mins);
  const bars=mins.map((m,i)=>`<div style="flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:flex-end;gap:7px">
    <div style="width:100%;height:78px;display:flex;align-items:flex-end">
      <div title="${m} min" style="width:100%;border-radius:6px 6px 3px 3px;
        height:${Math.max(m?7:3,Math.round(m/peak*78))}px;
        background:${m?(i===6?'var(--forest)':'var(--sage)'):'rgba(28,32,25,.07)'}"></div></div>
    <span style="font:600 9px/1 var(--sans);letter-spacing:.06em;
      color:${i===6?'var(--forest)':'var(--grey2)'}">${labels[i]}</span></div>`).join('');
  const dm=thisWk-lastWk, dd=drills-drillsLast;
  const hrs=n=>n>=60?(n/60).toFixed(1)+'h':n+'m';
  return `<div class="card"><div class="kick2">THIS WEEK</div>
    <div style="display:flex;gap:5px;align-items:flex-end;margin-top:16px">${bars}</div>
    <div style="display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(28,32,25,.08)">
      ${[['Time',hrs(thisWk)],['Drills',String(drills)],
         ['vs last week',(dm>0?'+':'')+hrs(Math.abs(dm)).replace('-','')+' · '+(dd>0?'+':'')+dd]]
        .map(([n,v])=>`<div style="flex:1">
        <div style="font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${n.toUpperCase()}</div>
        <div class="h-sm" style="font-size:19px;margin-top:5px">${v}</div></div>`).join('')}
    </div>
    ${thisWk?'':`<div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:12px">
      Nothing logged this week yet. Finish a session and it turns up here.</div>`}</div>`;
}

/* ── Ask ── */
/* pull the thread from the worker; harmless if it isn't deployed yet */
/* what we have sent but the server has not echoed back yet. Blobs takes up
   to ~15s to propagate, so a read a second after a write legitimately comes
   back without the new message — and replacing the thread with that answer
   is what made a client's own video disappear out of their chat. */
let pendingMsgs=[];
const msgKey=m=>(m.video?'v:'+m.video:m.image?'i:'+m.image:'t:'+String(m.text||'').trim());
function loadThread(){
  if(!st.token) return;
  fetch(AUTH.messages,{headers:authed()}).then(r=>r.ok?r.json():null).then(d=>{
    if(!d||!d.messages) return;
    const next=d.messages.map(m=>({from:m.from==='coach'?'e':'me',text:m.text,
      ...(m.video?{video:m.video}:{}),...(m.image?{image:m.image}:{}),time:when(m.at)}));
    /* forget the ones the server has caught up on, keep the rest on screen */
    const seen=new Set(next.map(msgKey));
    pendingMsgs=pendingMsgs.filter(p=>!seen.has(msgKey(p)) && Date.now()-p.sentAt<600000);
    const merged=next.concat(pendingMsgs.map(p=>({from:'me',text:p.text,
      ...(p.video?{video:p.video}:{}),...(p.image?{image:p.image}:{}),time:when(p.sentAt)})));
    /* a redraw rebuilds the input and loses half-typed text, reloads every
       video iframe and drops the scroll to the top — so only redraw when
       something was actually said. Relative times change on their own and
       must not count as a change. */
    const shape=a=>JSON.stringify((a||[]).map(m=>[m.from,m.text||'',m.video||'',m.image||'']));
    const same=shape(merged)===shape(st.msgs);
    st.msgs=merged; save();
    if((st.tab==='ask'||st.tab==='coaching') && !same) render();
  }).catch(()=>{});
}
function when(t){
  if(!t) return '';
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'Just now';
  if(m<60) return m+' min ago';
  const h=Math.round(m/60);
  return h<24 ? h+' hr ago' : Math.round(h/24)+' days ago';
}

/* ── sending a photo ───────────────────────────────────────────────
   Shrunk here rather than sent whole: a phone photo is 4MB of detail
   nobody needs to judge a shoulder angle, and small enough to go
   through the function means no second storage provider. */
async function shrinkPhoto(file, max=1600, quality=0.82){
  let src;
  try{ src=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){
    src=await new Promise((res,rej)=>{
      const i=new Image(), u=URL.createObjectURL(file);
      i.onload=()=>{ URL.revokeObjectURL(u); res(i); };
      i.onerror=()=>{ URL.revokeObjectURL(u); rej('Could not read that photo'); };
      i.src=u;
    });
  }
  const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight;
  if(!w||!h) throw 'Could not read that photo';
  const s=Math.min(1, max/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  return c.toDataURL('image/jpeg',quality);
}

/* one uploader, three callers: the chat, the free assessment, and the
   two-week test. The file goes phone → Cloudflare directly either way. */
function uploadClip(file, say){
  say=say||upSay;
  if(file.size > 220*1024*1024) return Promise.reject('That file is very large. Trim it to under three minutes.');
  say('Getting ready…');
  return fetch(AUTH.upload,{method:'POST',headers:authed(),body:'{}'})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
    .then(d=>new Promise((resolve,reject)=>{
      const fd=new FormData(); fd.append('file',file);
      const xhr=new XMLHttpRequest();
      xhr.open('POST',d.uploadURL);
      xhr.upload.onprogress=e=>{ if(e.lengthComputable)
        say('Uploading… '+Math.round(e.loaded/e.total*100)+'%'); };
      xhr.onload=()=> (xhr.status>=200&&xhr.status<300) ? resolve(d.uid)
                    : reject('Upload failed ('+xhr.status+')');
      xhr.onerror=()=>reject('Upload failed — check your signal');
      xhr.send(fd);
    }));
}

function pickAssessment(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*,image/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove(); if(f) sendAssessment(f); };
  inp.click();
}
function sendAssessment(file){
  if(upBusy) return;
  upBusy=true;
  const photo=(file.type||'').startsWith('image/');
  const go = photo
    ? shrinkPhoto(file).then(data=>{ upSay('Sending…');
        return fetch(AUTH.image,{method:'POST',headers:authed(),body:JSON.stringify({data})})
          .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that photo')))
          .then(d=>({image:d.id})); })
    : uploadClip(file).then(uid=>({uid}));

  go.then(got=>{
    upSay('Sending…');
    return fetch(AUTH.submission,{method:'POST',headers:authed(),
      body:JSON.stringify({kind:'assessment',
        clips:[got.uid?{uid:got.uid,name:'Assessment clip'}
                      :{image:got.image,name:'Assessment photo'}],
        numbers:{}})})
      .then(gateCheck);
  })
  .then(()=>{ upBusy=false; upSay(''); st.freeCheckUsed=true; st.awaitingReview=Date.now();
              save(); loadSubmissions(); loadThread(); render(); })
  .catch(e=>{ upBusy=false; upSay(String(e)); });
}

/* the server is what rations the free form check; the app only reports it */
function gateCheck(r){
  if(r.ok) return r;
  return r.json().catch(()=>({})).then(d=>{
    if(d && d.gated){
      st.freeCheckUsed=true;
      /* only roll back an optimistic chat bubble if one was actually added */
      if(pendingMsgs.length){ pendingMsgs.pop(); st.msgs=(st.msgs||[]).slice(0,-1); }
      save(); render();
    }
    return Promise.reject((d&&d.error)||'Could not send that');
  });
}

/* 88 thumbnails is 88 video downloads if you let it. Only the ones coming
   into view get a src, which keeps the library scrollable on mobile data. */
let lazyObs=null;
function lazyThumbs(){
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('video[data-lazy]').forEach(v=>{
      v.src=v.dataset.lazy; v.removeAttribute('data-lazy'); });
    return;
  }
  if(lazyObs) lazyObs.disconnect();
  lazyObs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      const v=e.target;
      if(e.isIntersecting){
        if(v.dataset.lazy){ v.src=v.dataset.lazy; v.removeAttribute('data-lazy'); v.load(); }
      } else if(!v.paused){
        /* off screen is off — no point burning battery and data on a clip
           nobody can see */
        try{ v.pause(); }catch(err){}
      }
    });
  },{rootMargin:'300px'});
  document.querySelectorAll('.scroll video').forEach(v=>lazyObs.observe(v));
}

/* ── the guided player ── */
let Q=[],qi=0,left=0,tTotal=0,phase='work',paused=false,tick_=null,lastT=0,sessionStart=0;

/* always m:ss — a bare '4' on a big clock reads as four minutes */
function fmtT(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60;
  return m+':'+String(r).padStart(2,'0'); }
const isHoldDose = d => /max hold|attempts|build to/i.test(String(d||''));

/* the big number is the dose, not a countdown — a set of ten reps should
   say TEN, not however many seconds we guessed it would take */
function repOf(it){
  const d=String(it.d||'');
  let m=d.match(/^\s*\d+\s*[×x]\s*(\d+)\s*(?:each|per)?/i);   if(m) return {n:m[1],u:'reps'};
  m=d.match(/(\d+)\s*reps/i);                                  if(m) return {n:m[1],u:'reps'};
  m=d.match(/(\d+)\s*s\b/);                                    if(m) return {n:m[1],u:'seconds'};
  m=d.match(/build to\s*(\d+)/i);                              if(m) return {n:m[1],u:'build to'};
  m=d.match(/^\s*(\d+)\s*$/);                                  if(m) return {n:m[1],u:'reps'};
  return {n:d||'—',u:'',small:true};
}

function startPlayer(){

}
function playerShell(){

function bindPlayer(){
  $('#p-pause').onclick=togglePause;

  $('#p-prev').onclick=stepBack;
  $('#p-skip').onclick=()=>{ clearInterval(tick_); tick_=null; phase='work'; qi++; showStep(); };
  document.querySelectorAll('.p-extend button').forEach(b=>{
    b.onclick=()=>{ left+=+b.dataset.ext; tTotal+=+b.dataset.ext; paintClock(); };

}
function togglePause(){
  paused=!paused; lastT=Date.now();
  const b=$('#p-pause'); if(b) b.textContent=paused?'▶':'II';
  document.querySelectorAll('#player video').forEach(v=>{ try{ paused?v.pause():v.play(); }catch(e){} });
}
function paintPause(){ const b=$('#p-pause'); if(b) b.textContent=paused?'▶':'II'; }
function stepBack(){
  clearInterval(tick_); tick_=null;
  if(phase==='rest'){ phase='work'; }
  else if(qi>0){ qi--; phase='work'; }
  showStep();
}
function paintClock(){
  const c=$('#p-clock'); if(c) c.textContent = tTotal>0 ? fmtT(left) : 'Hold';
  const f=$('#p-timefill');
  if(f) f.style.width = (tTotal>0 ? (1-left/tTotal)*100 : 0).toFixed(1)+'%';
  const e=$('#p-elapsed');
  if(e&&sessionStart) e.textContent = fmtT((Date.now()-sessionStart)/1000)+' / ~'+
    Math.round(Q.reduce((a,x)=>a+work(x.it)+rest(x.it),0)/60)+' min';
}


/* what is coming, and tappable — rest is the natural moment to look at
   the next drill's video and cues rather than being told a name */
function upNextHTML(){
  const rest=Q.slice(qi+1, qi+5);
  if(!rest.length) return `<div class="p-up"><div class="p-uphead">Up next</div>
    <div class="p-uprow"><span style="font:400 14px/1.4 var(--sans);color:var(--grey)">Last one — that is the session.</span></div></div>`;
  return `<div class="p-up">
    <div class="p-uphead">Up next · ${Q.length-qi-1} to go
      <span style="float:right;font-weight:500;letter-spacing:0;text-transform:none">tap to preview</span></div>
    ${rest.map((q,i)=>{
      const it=q.it, cues=it.cues||[];
      return `<div class="p-upblock" data-up="${i}">
        <button class="p-uprow p-upbtn" onclick="toggleUp(${i})">
          <span class="p-upnum">${qi+2+i}</span>
          ${it.url?`<span class="p-upthumb"><video src="${it.url}#t=0.6" muted playsinline preload="metadata"></video></span>`
                  :'<span class="p-upthumb"></span>'}
          <span style="flex:1;min-width:0;text-align:left">
            <span style="display:block;font:600 14.5px/1.2 var(--sans)">${esc(it.n)}</span>
            <span style="display:block;font:400 12.5px/1 var(--sans);color:var(--grey2);margin-top:6px">${
              esc(it.d)}${q.sets>1?' · set '+q.set+' of '+q.sets:''}</span>
          </span>
          <span class="p-upchev">▾</span>
        </button>
        <div class="p-updetail">
          ${it.url?`<div class="p-upvid">${vidBlock(it.url,'16/10','contain')}</div>`
                  :'<div class="p-vfail">Filming soon — the cues are the drill</div>'}
          ${it.desc?`<p style="font:600 14px/1.5 var(--sans);margin:12px 0 0">${esc(it.desc)}</p>`:''}
          ${cues.length?`<ul style="margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
            ${cues.map(c=>`<li style="font:400 13.5px/1.45 var(--sans);color:var(--grey)">${esc(c)}</li>`).join('')}
          </ul>`:''}
        </div></div>`;
    }).join('')}</div>`;
}
function toggleUp(i){
  const b=document.querySelector(`.p-upblock[data-up="${i}"]`);
  if(!b) return;
  const opening=!b.classList.contains('open');
  b.classList.toggle('open');
  /* one open at a time, and stop any clip the closing one was playing */
  document.querySelectorAll('.p-upblock').forEach(x=>{
    if(x!==b){ x.classList.remove('open');
      x.querySelectorAll('.p-upvid video').forEach(v=>{try{v.pause()}catch(e){}}); }
  });
  if(!opening) b.querySelectorAll('.p-upvid video').forEach(v=>{try{v.pause()}catch(e){}});
}

function showStep(){
  if(qi>=Q.length) return endPlayer(true);
  const s=Q[qi], it=s.it, resting=phase==='rest';
  document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}});
  $('#player').classList.toggle('resting',resting);
  $('#p-idx').textContent = resting ? 'REST' : 'EXERCISE '+(qi+1)+'/'+Q.length;

  const vw=$('#p-vwrap'), body=$('#p-body');
  if(resting){
    tTotal=left=rest(it);
    vw.className='p-vwrap novideo'; vw.innerHTML='';
    /* only preview a genuinely different drill — the line above already
       names the next set of the current one */
    const nx=Q[qi+1];
    const n=(nx && nx.it!==it) ? nx : null;
    body.innerHTML=`<span class="p-phase">Rest</span>
      <div class="p-main">
        <div class="p-repcol"><div class="p-repnum" id="p-repnum">${Math.round(left)}</div>
          <div class="p-repunit">remaining</div></div>
        <div class="p-info"><h2 class="p-name">Rest</h2>
          <div class="p-rule"></div>
          <div class="p-cues"><span class="cl">${
            s.set<s.sets ? 'Next: set '+(s.set+1)+' of '+s.sets+' · '+esc(it.n)
            : nx ? 'Next: '+esc(nx.it.n) : 'Last one done.'}</span></div></div>
      </div>
      ${upNextHTML()}`;
    $('#p-next').textContent='Skip rest →';
  } else {
    const hold=isHoldDose(it.d);
    tTotal=left=hold?0:work(it);
    if(it.url){ vw.className='p-vwrap'; vw.innerHTML=
      `<video src="${it.url}" autoplay loop muted playsinline></video>`; }
    else { vw.className='p-vwrap novideo';
      vw.innerHTML='<div class="p-vfail">Filming soon — the cues are the drill</div>'; }
    const rp=repOf(it), cues=it.cues||[];
    body.innerHTML=`<span class="p-phase">${s.sets>1?'Set '+s.set+' of '+s.sets:esc(s.grp||'Exercise')}</span>
      <div class="p-main">
        <div class="p-repcol"><div class="p-repnum${rp.small?' small':''}">${esc(rp.n)}</div>
          ${rp.u?`<div class="p-repunit">${rp.u}</div>`:''}</div>
        <div class="p-info"><h2 class="p-name">${esc(it.n)}</h2>
          <div class="p-rule"></div>
          <div class="p-cues">
            ${it.desc?`<b>${esc(it.desc)}</b>`:''}
            ${cues.map(c=>`<span class="cl">${esc(c)}</span>`).join('')}
            ${it.nt?`<span class="cl">${esc(it.nt)}</span>`:''}
          </div></div>
      </div>`;
    $('#p-next').textContent = s.sets>1 ? 'Set done →' : 'Done →';
  }

  $('#p-prev').style.visibility = (qi===0&&phase==='work') ? 'hidden' : '';
  $('#p-fill').style.width=((qi/Q.length)*100).toFixed(1)+'%';
  $('#p-scroll').scrollTop=0;
  paintClock(); paintPause();
  clearInterval(tick_); tick_=null;
  if(tTotal>0 && !paused){ lastT=Date.now(); tick_=setInterval(step,250); }
}

/* wall-clock delta, so a backgrounded phone does not lose seconds */
function step(){
  if(paused){ lastT=Date.now(); return; }
  const now=Date.now(); left-=(now-lastT)/1000; lastT=now;
  paintClock();
  const rn=$('#p-repnum'); if(rn&&phase==='rest') rn.textContent=Math.max(0,Math.round(left));
  if(left>0) return;
  clearInterval(tick_); tick_=null; beep(); advance();
}
function advance(){
  if(phase==='work'){
    const s=Q[qi];
    st.tick[key(st.day,s.gi,s.ii)]=true; save();
    if(qi<Q.length-1){ phase='rest'; showStep(); return; }
  }
  phase='work'; qi++;
  if(qi>=Q.length){ endPlayer(true); return; }
  showStep();
}
function skip(){ clearInterval(tick_); tick_=null; advance(); }
function endPlayer(done){ clearInterval(tick_); tick_=null;
  document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}});
  $('#player').classList.remove('on'); $('#player').innerHTML='';
  const d=day();
  const partWay = !done && qi>0 && qi<Q.length-1;
  if(partWay) whyStopContext=(Q[qi]&&Q[qi].it&&Q[qi].it.n)||'';
  /* The player has known the drill-by-drill all along — every set in Q
     carries its drill, its block and its position — and threw it away at
     the end, reporting only a count. Without it a coach can see that a
     session was abandoned but not which drill it died on, or how far
     into it. */
  const rows=(function(){
    const m=new Map();
    Q.forEach((x,idx)=>{
      const k=(x.it&&x.it.v)||(x.it&&x.it.n)||('#'+idx);
      if(!m.has(k)) m.set(k,{v:(x.it&&x.it.v)||'',n:(x.it&&x.it.n)||'',grp:x.grp||'',got:0,of:0});
      const r=m.get(k); r.of++; if(idx<qi||done) r.got++;
    });
    return [...m.values()].slice(0,40)
      .map(r=>Object.assign(r,{rate:(st.rate||{})[r.v]||''}));
  })();
  reportProgress({session:{day:st.day, name:(d&&d.label)||'', done:!!done, items:rows,
    drills:Q.length,
    mins:Math.round(Q.reduce((a,x)=>a+work(x.it)+rest(x.it),0)/60),
    actual: sessionStart?Math.round((Date.now()-sessionStart)/60000):0,
    got: done?Q.length:qi, of: Q.length,
    /* where they stopped is the useful half of an abandoned session */
    stoppedAt: done?'':((Q[qi]&&Q[qi].it&&Q[qi].it.n)||''),
    block: done?'':((Q[qi]&&Q[qi].grp)||'')}});
  st.lastSessionMins = sessionStart ? Math.round((Date.now()-sessionStart)/60000) : 0;
  if(done && !st.in) advanceDay();
  save();
  if(done){ st.ovSummary=true; openOv('summary'); }
  else if(partWay){ render(); openOv('why'); }
  else render(); }
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
  o.frequency.value=660;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.2,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);
  o.start();o.stop(a.currentTime+.31);}catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&tick_){ paused=true;
  document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}}); paintPause(); }});

/* ── overlays ── */
function openOv(kind){ st.ov=kind; save(); drawOv(); $('#ov').classList.add('on');
  if(kind==='account' && st.token){ subInfo=null; loadSubscription(); } }

/* ── video block ───────────────────────────────────────────────────
   Native controls put a black bar over the clip and a three-dot menu
   offering Download on paid footage. This is the same loop with our own
   chrome: tap to play/pause, a scrub line, and a sound toggle. */
const VB_SPK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const VB_MUTED='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
function vidBlock(url, ratio, fit){
  return `<div class="vb" data-vb style="position:relative;border-radius:22px;overflow:hidden;
    background:#000;margin-bottom:18px;cursor:pointer">
    <video src="${url}#t=0.6" muted loop playsinline preload="metadata" autoplay
      style="display:block;width:100%;aspect-ratio:${ratio||'4/3'};object-fit:${fit||'cover'};background:#11150f"></video>
    <div data-vb-play style="position:absolute;inset:0;display:grid;place-items:center;
      background:rgba(0,0,0,.18);opacity:0;transition:opacity .18s;pointer-events:none">
      <span style="width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.92);
        display:grid;place-items:center;font-size:19px;color:#111111">&#9654;</span></div>
    <div style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;
      padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.55))">
      <div data-vb-track style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)">
        <div data-vb-fill style="height:100%;width:0;border-radius:2px;background:#fff"></div></div>
      <button data-vb-sound aria-label="Unmute" style="flex:none;width:30px;height:30px;border:none;
        border-radius:50%;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;
        display:grid;place-items:center;padding:0">${VB_MUTED}</button>
    </div></div>`;
}
document.addEventListener('click',function(e){
  const box=e.target.closest('[data-vb]'); if(!box) return;
  const v=box.querySelector('video'); if(!v) return;
  const sound=e.target.closest('[data-vb-sound]');
  if(sound){
    v.muted=!v.muted;
    sound.innerHTML = v.muted ? VB_MUTED : VB_SPK;
    sound.setAttribute('aria-label', v.muted?'Unmute':'Mute');
    if(!v.muted && v.paused) v.play().catch(()=>{});
    return;
  }
  const track=e.target.closest('[data-vb-track]');
  if(track && v.duration){
    const r=track.getBoundingClientRect();
    v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v.duration;
    return;
  }
  if(v.paused) v.play().catch(()=>{}); else v.pause();
},true);
/* one loop keeps every visible scrub line in sync — cheaper than a
   timeupdate listener per clip, and it stops when nothing is on screen */
(function vbLoop(){
  document.querySelectorAll('[data-vb]').forEach(function(box){
    const v=box.querySelector('video'); if(!v) return;
    const f=box.querySelector('[data-vb-fill]');
    if(f && v.duration) f.style.width=((v.currentTime/v.duration)*100).toFixed(1)+'%';
    const pl=box.querySelector('[data-vb-play]');
    if(pl) pl.style.opacity = v.paused ? '1' : '0';
  });
  requestAnimationFrame(vbLoop);
})();

function drawOv(){
  if(st.ov==='hold'){ drawHold(); return; }
  const S=(typeof STAGES!=='undefined')?STAGES[st.ovStage||0]:null;
  const T={drill:st.ovDrill?st.ovDrill.n:'Drill',test:'Two-week test',adjust:"Can't train?",
           password:'Change password', account:'Your account',
           why:'Why are you stopping?',apply:'Apply for coaching',
           summary:'Session complete',stage:S?S.n:'Stage',
           mode:'Start the session',list:'Every drill',explainer:'Explainer'};
  let body='';

function screenSignIn(){

        font:400 15px/1 var(--sans);color:var(--bg);outline:none">

        <button type="button" id="pwEye" onclick="togglePw()" aria-label="Show password"

          display:flex;align-items:center;justify-content:center;background:none;border:none;

            <circle cx="12" cy="12" r="2.8"></circle>
            <line id="pwEyeSlash" x1="4" y1="20" x2="20" y2="4" style="display:none"></line>
          </svg>

      <div id="authMsg" style="font:500 12.5px/1.5 var(--sans);color:var(--sand);text-align:center;min-height:18px"></div>
    </form>
    <div style="font:400 12.5px/1.6 var(--sans);color:#8fbeca;margin-top:20px;text-align:center">
      <button onclick="st.tab='reset';resetStep=0;resetMsg='';save();render()"
        style="background:none;border:none;color:var(--sand);font:600 13px/1 var(--sans);

/* let people read what they typed — most sign-in failures here are just a
   fat-fingered password on a phone keyboard */
function togglePw(){
  const i=$('#pwIn'), b=$('#pwEye'), sl=$('#pwEyeSlash');
  if(!i) return;
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  if(sl) sl.style.display = show ? '' : 'none';
  if(b){ b.setAttribute('aria-pressed', show ? 'true' : 'false');
         b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); }
  i.focus();
  // keep the caret at the end rather than jumping to the start on type-swap
  try { const n=i.value.length; i.setSelectionRange(n,n); } catch(e){}
}

function doLogin(ev){
  if(ev) ev.preventDefault();
  const email=(($('#emailIn')||{}).value||'').trim().toLowerCase();
  const password=($('#pwIn')||{}).value||'';
  const msg=$('#authMsg');
  if(!email||!password){ if(msg) msg.textContent='Both fields, please.'; return; }
  if(msg) msg.textContent='Checking…';
  fetch(AUTH.login,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password})})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{
      /* a coach signing in here wants the coach view, not a client screen */
      if(d.coach){ location.href='/lha-coach.html'; return; }
      st.email=email; st.token=d.token; st.client=d.client;
      st.in=!!d.coached;            /* coached tier only for actual coaching clients */
      st.plus=!!d.plus;
      if(!st.in){ st.mode='free'; st.quizDone=true; if(!st.tab||st.tab==='signin') st.tab='ladder'; }
      save(); render(); loadEntitlement();
      if(st.in){ loadProgramme(); loadProgress(); loadThread(); } })
    .catch(code=>{ const m=$('#authMsg');
      if(m) m.textContent = code===429 ? 'Too many tries. Wait a few minutes.'
                                       : 'That email and password did not match.'; });
}
function requestCode(){
  const v=($('#emailIn')||{}).value||'';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ $('#authMsg').textContent='That does not look like an email address.'; return; }
  st.email=v.trim().toLowerCase();
  $('#authMsg').textContent='Sending…';
  fetch(AUTH.request,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:st.email})})
    .then(r=>{ if(!r.ok) throw 0; st.codeSent=true; save(); render(); })
    .catch(()=>{ /* routes not deployed yet — let the flow be walked anyway */
      st.codeSent=true; save(); render();
      const m=$('#authMsg'); if(m) m.textContent='Dev mode: the code is '+DEV_CODE; });
}
function verifyCode(){
  const c=(($('#codeIn')||{}).value||'').trim();
  if(c.length<4){ $('#authMsg').textContent='Enter the six digits from the email.'; return; }
  $('#authMsg').textContent='Checking…';
  fetch(AUTH.verify,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:st.email,code:c})})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{ st.token=d.token; st.client=d.client||nameFrom(st.email); st.in=true;
               save(); render(); loadEntitlement(); loadProgramme(); loadProgress(); loadThread(); })
    .catch(()=>{
      if(c===DEV_CODE){ st.in=true; st.client=nameFrom(st.email); save(); render(); return; }
      const m=$('#authMsg'); if(m) m.textContent='That code did not work. Check it, or send a new one.';
    });
}
const nameFrom=e=>{const n=(e||'').split('@')[0].split(/[._-]/)[0]; return n.charAt(0).toUpperCase()+n.slice(1);};

/* ── programme delivery ────────────────────────────────────────────
   The plan used to be baked into this file, so every client saw the
   same one. It now comes from the server, chosen by the token, and is
   cached so the app still opens on a gym floor with no signal. */
function libraryDrills(){
  /* prefer the full library; fall back to whatever the plan contains
     so the screen is never empty on a cold first load */
  if (LIBRARY && LIBRARY.length) return LIBRARY;
  const out=[];
  DATA.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{
    if(!out.some(x=>x.v===it.v)) out.push(it); })));
  return out;
}
function libToArray(lib){
  if(!lib || !lib.names) return [];
  return Object.keys(lib.names).map(v=>({
    v:v, n:lib.names[v]||v, url:(lib.video||{})[v]||'', d:'', nt:'',
    cues:(lib.cues||{})[v]||[], desc:(lib.desc||{})[v]||''
  }));
}
function applyProgramme(d){
  if(d && d.plan && d.plan.days && d.plan.days.length) DATA = d.plan;
  const arr = libToArray(d && d.library);
  if(arr.length) LIBRARY = arr;
  if(st.day >= DATA.days.length) st.day = 0;
}
function cacheProgramme(d){
  try { localStorage.setItem('lha_plan', JSON.stringify(
    {at:Date.now(), email:st.email, plan:d.plan, library:d.library})); } catch(e){}
}
function loadCachedProgramme(){
  try {
    const c = JSON.parse(localStorage.getItem('lha_plan')||'null');
    /* a cached plan belongs to one address — never show it to someone else */
    if(c && c.email === st.email) { applyProgramme(c); return true; }
  } catch(e){}
  return false;
}
/* the app's own copy of what the server has recorded — the Progress screen
   used to show invented numbers because nothing real was available */
function loadProgress(){
  if(!st.token) return Promise.resolve();
  return fetch(AUTH.progress,{headers:authed()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ st.prog=d; save(); render(); } })
    .catch(()=>{});
}
function sessionsDone(){ return ((st.prog&&st.prog.sessions)||[]).filter(x=>x.done); }
function blockStart(){
  const p=st.prog||{};
  const first=(p.sessions&&p.sessions.length&&p.sessions[0].at)
    || (p.opens&&p.opens.length&&new Date(p.opens[0]+'T00:00:00').getTime());
  return first||null;
}
function weekNow(){
  const st0=blockStart(); if(!st0) return 1;
  return Math.min(6, Math.floor((Date.now()-st0)/(7*86400000))+1);
}
/* completed sessions bucketed into the six weeks of a block */
function weekGrid(){
  const st0=blockStart(); const out=[[],[],[],[],[],[]];
  if(!st0) return out;
  sessionsDone().forEach(function(x){
    const w=Math.floor((x.at-st0)/(7*86400000));
    if(w>=0&&w<6) out[w].push(x);
  });
  return out;
}

function loadProgramme(){
  if(!st.token) return Promise.resolve(false);
  return fetch(AUTH.programme,{headers:authed()})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{ applyProgramme(d); cacheProgramme(d);
               if(d.client) st.client=d.client;
               save(); render(); return true; })
    .catch(code=>{
      /* an expired token is the one failure worth acting on */
      if(code===401){ signOut(); return false; }
      loadCachedProgramme(); render(); return false;
    });
}

function savePassword(ev){
  if(ev) ev.preventDefault();
  const cur=($('#pwCur')||{}).value||'', next=($('#pwNew')||{}).value||'';
  const msg=$('#pwMsg');
  if(!cur||!next){ if(msg) msg.textContent='Fill in both boxes.'; return; }
  if(next.length<8){ if(msg) msg.textContent='At least 8 characters, please.'; return; }
  if(msg) msg.textContent='Saving…';
  fetch(AUTH.password,{method:'POST',headers:authed(),
    body:JSON.stringify({current:cur,next:next})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'That did not work')))
    .then(()=>{ const m=$('#pwMsg');
      if(m){ m.style.color='var(--forest)'; m.textContent='Saved. Use the new one next time.'; }
      const a=$('#pwCur'), b=$('#pwNew'); if(a) a.value=''; if(b) b.value='';
    })
    .catch(e=>{ const m=$('#pwMsg'); if(m) m.textContent=String(e); });
}


/* ── what gets reported back ───────────────────────────────────────
   Ticks, ratings and hold times already lived in this browser and went
   nowhere. Elliott can only coach what he can see, so a summary goes to
   the server. Nothing here is sent for a free-tier user — no token, no
   report. */
let progQueued=null;
function reportProgress(extra){
  if(!st.in || !st.token) return Promise.resolve();
  const flags={};
  Object.keys(st.rate||{}).forEach(function(v){
    if(st.rate[v]==='easy'||st.rate[v]==='hard')
      flags[v]={rate:st.rate[v], note:(st.note||{})[v]||''};
  });
  const payload=Object.assign({flags:flags, hold:st.bestHold||0}, extra||{});
  return fetch(AUTH.progress,{method:'POST',headers:authed(),body:JSON.stringify(payload)})
    .catch(function(){});   /* never let reporting break the session */
}
/* one call a minute at most — this is a summary, not a telemetry feed */
function reportSoon(extra){
  if(progQueued) clearTimeout(progQueued);
  progQueued=setTimeout(function(){ progQueued=null; reportProgress(extra); }, 1500);
}


/* Abandoning a session is the most informative thing a client does and the
   thing we currently learn least from. Asked once, optional, and only when
   they actually stop part-way. */
const WHY_REASONS=['Too long','Too hard','Too easy','Ran out of time',
  'Equipment not available','Not what I expected','Just browsing','Something else'];
let whyPicked=[];
function screenWhyBody(){

        border:1.5px solid ${whyPicked.includes(r)?'var(--forest)':'transparent'};
        background:${whyPicked.includes(r)?'rgba(47,61,47,.07)':'var(--mist)'};

    </div>
    <textarea id="whyText" rows="3" placeholder="Anything else? (optional)"

function toggleWhy(r){
  whyPicked = whyPicked.includes(r) ? whyPicked.filter(x=>x!==r) : whyPicked.concat([r]);
  drawOv();
}
function closeWhy(send){
  if(send){
    const t=($('#whyText')||{}).value||'';
    if(whyPicked.length||t.trim()){
      reportProgress({feedback:{kind:'Stopped early',reasons:whyPicked,text:t,
        context:whyStopContext}});
      post({type:'Stopped early',reasons:whyPicked.join(', '),text:t,
            where:whyStopContext,_reported:true});
    }
  }
  whyPicked=[]; closeOv();
}
let whyStopContext='';

function signOut(){
  /* clearing the token alone left the old tab on screen, so signing out
     looked like nothing had happened. Drop right back to the free app. */
  if(typeof tick_!=='undefined' && tick_){ clearInterval(tick_); tick_=null; }
  if(typeof stopHold==='function') stopHold();
  /* this is usually tapped from inside the account overlay, which sits over
     everything — leave it open and signing out looks like a dead button */
  st.ov=null;
  const ov=$('#ov'); if(ov){ ov.classList.remove('on'); ov.innerHTML=''; }
  document.querySelectorAll('video').forEach(v=>{try{v.pause()}catch(e){}});
  st.in=false; st.codeSent=false; st.token=null;
  st.client=null; st.msgs=null;      // nobody else's name or thread left behind
  try{ localStorage.removeItem('lha_plan'); }catch(e){}
  st.mode='free';                    // skip the welcome gate on the way out
  st.tab='ladder';                   // a screen they can actually use
  save(); render();
  window.scrollTo(0,0);
}

/* ── flags, tests, and anything else that reaches Elliott ── */
const FORM='https://formspree.io/f/xvzjawjv';
function post(payload){
  /* email is still the alert; the dashboard is the record */
  /* _reported means the caller already filed the detailed version */
  if(st.in&&st.token&&payload&&payload.type&&!payload._reported){
    reportProgress({feedback:{kind:payload.type,
      text:[payload.text,payload.results,payload.flags,payload.reasons]
        .filter(Boolean).join(' · ').slice(0,900)}});
  }
  return fetch(FORM,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(Object.assign({client:st.client||'',email:st.email||''},payload))}).catch(()=>{});
}
function tick(k){ st.tick[k]=!st.tick[k]; save(); render(); }
/* 'Good' was doing nothing useful — it is the default state, and it made
   every drill row carry three buttons. Only the two exceptions are worth
   a tap. Clear any that were already saved. */
Object.keys(st.rate||{}).forEach(function(k){ if(st.rate[k]==='good') delete st.rate[k]; });
function rate(v,r){ st.rate[v]=st.rate[v]===r?'':r; if(st.rate[v]!=='easy'&&st.rate[v]!=='hard') delete st.note[v]; save(); reportSoon(); render(); }
function sendFlags(){
  const f=Object.keys(st.rate).filter(v=>st.rate[v]==='easy'||st.rate[v]==='hard');
  if(!f.length) return;
  const names={}; DATA.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(i=>names[i.v]=i.n)));
  post({type:'Drill flags',flags:f.map(v=>st.rate[v].toUpperCase()+' — '+(names[v]||v)+(st.note[v]?' ("'+st.note[v]+'")':'')).join('\n')});
  st.flagSent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}); save(); render();
}
function filmTest(id,name){
  if(upBusy) return;
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
    const say=m=>{ const el=$('#tc-'+id); if(el) el.textContent=m; };
    upBusy=true;
    uploadClip(f,say)
      .then(uid=>{ st.testClips=st.testClips||{}; st.testClips[id]={uid,name}; save();
                   upBusy=false; say(''); drawOv(); })
      .catch(e=>{ upBusy=false; say(String(e)); });
  };
  inp.click();
}

/* numbers and clips go together — that pairing is the review */
function sendTest(){
  const vals=st.testDraft||{};
  const clips=Object.entries(st.testClips||{}).map(([id,c])=>({drill:id,name:c.name,uid:c.uid}));
  const named={}; DATA.test.items.forEach(t=>{ if(vals[t.id]) named[t.n]=vals[t.id]+' '+t.u; });
  if(!clips.length && !Object.keys(named).length){
    const m=$('#testMsg'); if(m) m.textContent='Add a number or a clip first.'; return;
  }
  const m=$('#testMsg'); if(m) m.textContent='Sending…';
  fetch(AUTH.submission,{method:'POST',headers:authed(),
    body:JSON.stringify({kind:'test',numbers:named,clips})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that')))
    .then(()=>{
      st.tests=(st.tests||[]).concat([vals]); st.testDraft={}; st.testClips={};
      st.awaitingReview=Date.now(); save();
      reportProgress({test:vals}); closeOv(); loadThread(); render();
    })
    .catch(e=>{ const el=$('#testMsg'); if(el) el.textContent=String(e); });
}

, "Take one leg off the wall.", "Float the second leg just off and hold 1-2 seconds.", "Place back on the wall before you over-balance."], "desc": "With hands about 1.5 feet from the wall, take one leg off, then the other just slightly off, hold 1-2 seconds, then place back. Go too far and you fall out."}, {"v": "single-leg-wall-removals", "n": "Single Leg Wall Removals", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/97a793aeb7268ea61159163eb5a0c30e/downloads/default.mp4", "d": "", "nt": "", "cues": ["Move from the hip slowly.", "Stay long through both legs.", "Use the fingertips to steer.", "Return to the wall with control."], "desc": "Take one leg away from the wall to build balance confidence and ownership of your line."}, {"v": "slide-away", "n": "Slide Away", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/0011bde2e0f70364712159d9442d4803/downloads/default.mp4", "d": "", "nt": "", "cues": ["Lean the shoulders forward.", "Push back actively through the arms.", "Let the feet slide back up the wall.", "Keep the movement smooth and controlled."], "desc": "Lean the shoulders forward and push back, letting the feet slide back up the wall. This version is about grooving the shoulder movement — the feet stay on the wall throughout."}, {"v": "slide-away-2", "n": "Slide Away — Off the Wall", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/0011bde2e0f70364712159d9442d4803/downloads/default.mp4", "d": "", "nt": "", "cues": ["Stay aligned and hollow throughout.", "Move the shoulders off with control.", "Let the feet leave the wall as the shoulders move.", "Find a brief balance, then return."], "desc": "The progression: keep the body aligned and hollow as you move. Now the aim is for the feet to come off the wall as the shoulders move off — finding a brief moment of balance before returning."}, {"v": "single-leg-tuck-take-offs", "n": "Single Leg Tuck Take-Offs", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/bed0e1e90176e790569dc82e8060e158/downloads/default.mp4", "d": "", "nt": "", "cues": ["Walk up the wall, one leg in the air, toes pointed.", "Slide the second leg down to tuck.", "Lean and look slightly forward as you pull the foot in.", "Hold a moment, then place it back."], "desc": "Walk up the wall with one leg in the air, slide the second leg down into a tuck. Lean and look slightly forward as you pull the second foot in. Hold, then replace. The gap can grow over time."}, {"v": "tuck-take-offs", "n": "Tuck Take-Offs", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/b173a66d935153d532b2748227f253bc/downloads/default.mp4", "d": "", "nt": "", "cues": ["Slide into a tuck against the wall.", "Keep knees tucked tightly, touching.", "Look forward and lean forward.", "Bring the knees off the wall with control."], "desc": "Slide into tuck against the wall, knees tucked tightly together. Look forward and lean forward to bring your knees off the wall."}, {"v": "straddle-to-straight", "n": "Straddle to Straight", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/195e5344c3399b8ce0bc91931633ab9f/downloads/default.mp4", "d": "", "nt": "", "cues": ["Kick up, option against the wall first.", "Lightly touch, then come away.", "Move freestanding once you get a couple of reps.", "Keep the straddle moderate, not excessive."], "desc": "Kick up into handstand (option against the wall), taking the body away from the wall. Lightly touch at first, then not at all. Keep the straddle moderate so it does not throw your balance."}, {"v": "straight-to-tuck-back", "n": "Straight to Tuck & Back", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/e461fca19fb288c2a004edaa65df8a21/downloads/default.mp4", "d": "", "nt": "", "cues": ["Kick up with knees together.", "Use hip flexors to pull knees down.", "Keep pushing tall through the shoulders.", "Gradually increase the depth of the tuck."], "desc": "Once kicked up with knees together, actively use the hip flexor , "nt": "", "cues": ["Stack the shoulders over the hands.", "Keep knees together throughout.", "Jump up to a tuck handstand.", "Extend the legs and push the pelvis through to straight."], "desc": "Once the shoulders are stacked, keep the knees together and jump up to a tuck handstand. Extend the legs and push the pelvis through to bring the body into a straight line."}, {"v": "p-pike-pushups", "n": "Pike Push Ups", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/1d49ef13267f7b9516df86a406c3412a/downloads/default.mp4", "d": "", "nt": "", "cues": ["Feet a little wider than hips, knees bent, hips high.", "Look forward to a point between the hands.", "Lower the forehead to that point, elbows tucked.", "Push back up keeping the diagonal line."], "desc": "Front deltoid strength — the fix if you end up collapsing in the take-off. Build the pressing strength the take-off demands."}, {"v": "p-pike-pushup-negs", "n": "Pike Push Up Negatives", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5fc1575443b323abd17a824d634ddb41/downloads/default.mp4", "d": "", "nt": "", "cues": ["Lower under control.", "Keep the shoulders elevated throughout."], "desc": "A progression on the pike push up — load the lowering phase to build pressing strength."}, {"v": "p-pike-pushups-knees", "n": "Pike Push Ups on Knees", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/990e81ff459d2a428966d1cfc75d868c/downloads/default.mp4", "d": "", "nt": "", "cues": ["Same shape, less load.", "Build to the full pike push up."], "desc": "A regression — the same pressing pattern made more accessible. Build the strength from your knees first."}, {"v": "p-l-handstand", "n": "L-Shaped Handstand", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/ae64c76e183bb5191aaf6856240a3eab/downloads/default.mp4", "d": "", "nt": "", "cues": ["Stack the hips over the shoulders.", "Push tall through the shoulders."], "desc": "Helps you learn to get the hips stacked over the shoulders — the position the take-off has to find."}, {"v": "p-tuck-handstand", "n": "Tuck Handstand", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/823cfe703e74214ad84ddba54a386bbe/downloads/default.mp4", "d": "", "nt": "", "cues": ["Engage the hip flexors to pull the knees down.", "Let the lower back draw the hips into anterior pelvic tilt.", "Push tall — actively elevate the scapula.", "Avoid posterior tilt — it becomes a tuck planche."], "desc": "HERO DRILL. The scapula needs to be elevated to properly take off, and the tuck handstand is the best teacher — it shows you how to move the hips and elevate the scapula at the same time. The lower centre of mass makes balancing easier but you feel it far more in the shoulders."}, {"v": "p-tuck-slides", "n": "Tuck Handstand Slides", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/b8566b45406a58ad0824b1af38a4ea85/downloads/default.mp4", "d": "", "nt": "", "cues": ["Same start, hands 1.5 feet from the wall.", "Knees together, lower them down.", "The harder version — both legs at once."], "desc": "Movement patterning for the take-off — learn to get the hips stacked over the shoulders."}, {"v": "p-single-leg-tuck-slides", "n": "Single Leg Tuck Slides", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/b8566b45406a58ad0824b1af38a4ea85/downloads/default.mp4", "d": "", "nt": "", "cues": ["Chest to wall, hands about 1.5 feet from the wall, feet pointed.", "One foot stays on the wall.", "Take the other knee down towards your chest."], "desc": "A single-leg variation to build control and hip stacking one side at a time."}, {"v": "p-plank-slides", "n": "Plank Slides to Pike", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/7e7ebd3d88d2a9fc610a62d556d01ec4/downloads/default.mp4", "d": "", "nt": "", "cues": ["Move as one connected chain.", "Control the slide both ways."], "desc": "Conditioning — builds the connected-chain strength the compression demands."}, {"v": "p-bench-zombies", "n": "Bench Zombies", "url": "", "d": "", "nt": "", "cues": ["Feet on the bench, toes pointed.", "Pull up until the hips stack over the shoulders.", "Keep the lower back engaged."], "desc": "Plank with your feet on a bench, toes pointed. Pull yourself up until the hips are stacked over the shoulders."}, {"v": "p-bench-zombies-lowers", "n": "Bench Zombies Lowers", "url": "", "d": "", "nt": "", "cues": ["Start on the edge of the bench.", "Step off and lower slowly to the floor."], "desc": "Start on the edge of the bench, step off and slowly lower down to the floor — adds the eccentric to build strength through the position."}, {"v": "p-pancake", "n": "Pancake Training", "url": "", "d": "", "nt": "", "cues": ["Reach long through the chest.", "Build active range, not just passive."], "desc": "Flexibility — builds the active compression range in the straddle that the press relies on."}, {"v": "p-dd-toe-taps", "n": "Downward Dog Toe Taps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/097aa6b7a61129cdaf8a78e64ba389bb/downloads/default.mp4", "d": "", "nt": "", "cues": ["Push the hips up and back.", "Keep the shoulders open."], "desc": "Trains compression and shoulder position while keeping the wrists happy."}, {"v": "p-pelvis-glute", "n": "Pelvis & Glute Engagement Drill", "url": "", "d": "", "nt": "", "cues": ["Find the hip position on the floor first.", "Take it to the wall."], "desc": "On the floor and at the wall — trains the hip positioning that keeps the unroll organised."}, {"v": "p-solo-press-circles", "n": "Solo Press Circles", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/7ab907d930c9749d32486003184bcf23/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hold the handstand, open the legs.", "Start with small circles.", "Grow them as you get stronger.", "Both directions — speed doesn't matter."], "desc": "In a handstand, open the legs and make small circles. Grow the circles bigger over time, working towards the press position. Speed doesn't matter — work both directions."}, {"v": "p-back-to-wall", "n": "Back to Wall Press", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/7fdd9f7cceba8dcb31544af7550a0154/downloads/default.mp4", "d": "", "nt": "", "cues": ["Full upper back AND head on the wall.", "Focus on engaging the hip flexors.", "Keep the back rounded.", "If heavy on the wrists, turn the hands out to the side."], "desc": "HERO DRILL. Teaches the shape and compression with the wall taking some of the load. Make sure your full upper back as well as head is on the wall — this takes more of the weight so you can focus on engaging the hip flexors and keeping the back rounded."}, {"v": "p-chest-to-wall", "n": "Chest to Wall Press", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/eef15d6792347cd1aaeb0be71f222aeb/downloads/default.mp4", "d": "", "nt": "", "cues": ["Take-off into the line.", "Compress with the chain connected.", "Unroll with the shoulders opening first."], "desc": "THE ULTIMATE HERO. Trains all three stages — take-off, compression and unrolling — in a single movement. Your feet cannot go anywhere, so your shoulders cannot either: you either compress and unroll correctly, or the wall rejects you."}, {"v": "p-chest-to-wall-negs", "n": "Chest to Wall Negatives", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/900bba4d79fa55bd8e3db4d369e0157b/downloads/default.mp4", "d": "", "nt": "", "cues": ["Lower slowly and with control.", "Feel the path you will reverse on the way up."], "desc": "Lower under control from the wall handstand to break the ice and feel the descending path of the press."}, {"v": "shoulder-circles", "n": "Shoulder Circles", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/9ad6108b534d2c6375d629bd2f2363ea/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "shoulder-pulses", "n": "Shoulder Pulses", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/c812fa2fff981dd17bb93580619601f8/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": "Small pulses through the shoulders to open them up before load."}, {"v": "plank-fingertip-lifts", "n": "Plank Fingertip Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5e23544c8db4eac5b2377f400d7ceb8a/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": "A plank, but up on the fingertips instead of flat palms."}, {"v": "chest-to-wall-toe-taps", "n": "Chest to Wall Toe Taps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/da4144ad54ec886963a8e09a8050c7c6/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands about 2 feet from the wall.", "One leg stays on the wall.", "Pull the other knee or toe towards the floor.", "Control it down, don't drop."], "desc": "Hands about 2 feet from the wall, one leg on the wall. Take the other leg off and pull the knee or toe down towards the floor."}, {"v": "press-eccentrics", "n": "Press Eccentrics", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/29ccefcc5c0dfb837de6272309d647cd/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start in the handstand.", "Lower slowly through the compression.", "Same path you'll press back up."], "desc": "The press in reverse. From the handstand, lower under control through the compressed position instead of pushing up out of it."}, {"v": "press-walks", "n": "Press Walks", "url": "", "d": "", "nt": "", "cues": ["Baby hop the feet forward.", "Press the hips up and back as you lean forward.", "Up and down the mat."], "desc": "Baby hop the feet forward, then press the hips up and back as you lean forward. Walk up and down the mat."}, {"v": "block-reaches", "n": "Block Reaches", "url": "", "d": "", "nt": "", "cues": ["Seated forward fold, block in the hands.", "Reach forward over the feet.", "Engage through the quads.", "Active, not a passive hang."], "desc": "Sit in a forward fold holding a block. Reach forward over the feet, engaging through the quads. An active forward fold, not a passive one."}, {"v": "lolasana-lifts", "n": "Lolasana Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/1d8c3fd87048e4be984c51f8372f16ae/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": "Straight arms, knees tucked, lift and hold."}, {"v": "freestanding-hold", "n": "Freestanding Hold", "url": "", "d": "", "nt": "", "cues": ["Kick up, find it, hold it.", "Stop the set the moment the shape goes.", "Quality over seconds — this isn't a max attempt."], "desc": "A clean hold, not a maximum. Up to 15 seconds, stopping as soon as the line goes."}, {"v": "max-hold-test", "n": "Max Hold Test", "url": "", "d": "", "nt": "", "cues": ["Three attempts, best of three.", "Warm up properly first.", "Film one if you can."], "desc": "The tracked number. Three attempts, log the best."}, {"v": "dd-wrist-taps", "n": "Downward Dog Wrist Taps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/d79ada213578ca1993b4cb4b9f3ec4b1/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "chair-assisted-knee-lifts", "n": "Chair-Assisted Knee Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/a3f7be549122a3e84dd46e1530724349/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "chair-assisted-step-ups", "n": "Chair-Assisted Step Ups", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/d5bff0ae8e4f8914cd35d7b906155956/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "dd-float-drills", "n": "Downward Dog Floats", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/e6b63c7852f82ba17a727fd8002700c9/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start in downward facing dog.", "Look forward and lean forward.", "Jump with the hips coming as high as you can.", "Bend the knees to help slow yourself down."], "desc": "From downward facing dog, look and lean forward and jump, hips as high as you can. Bend the knees to slow the landing — the aim is a quiet forward fold, then jump back to dog."}, {"v": "lying-crunch-and-contract", "n": "Lying Crunch and Contract", "url": "", "d": "", "nt": "", "cues": ["On your back.", "Crunch and hold the contraction.", "Same shape you need in the air, without the wrist load."], "desc": ""}, {"v": "table-top-knee-to-nose", "n": "Table Top Knee to Nose", "url": "", "d": "", "nt": "", "cues": ["Knees lifted off the floor.", "Pull the knees towards the nose.", "Round the spine and press the ground away."], "desc": "Table top with the knees lifted. Take the knees to the nose and round the spine, pressing the ground away."}, {"v": "plank-pose", "n": "Plank Pose", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/90a824ed88a1bca051dceb30dfd5e629/downloads/default.mp4", "d": "", "nt": "", "cues": ["Shoulders stacked over the hands.", "Ribs down, glutes on.", "Push the floor away — don't sag between the shoulder blades."], "desc": "A plank held with the shoulders stacked and the ribs down."}, {"v": "chair-assisted-puppy-press", "n": "Chair-Assisted Puppy Press", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/a4e209b649da9c8f63b8784dd42e42e1/downloads/default.mp4", "d": "", "nt": "", "cues": ["One foot on the chair, hips high.", "Start higher than feels necessary.", "Lift the other hip and stack the body.", "Option to take it fully off into a handstand."], "desc": "One foot on the side of a chair, lift the other hip and stack the body. Start with the hips higher than feels necessary."}, {"v": "forearm-massage", "n": "Forearm Massage", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/39baddde2e76b2dd1ef4f33b232d2b2d/downloads/default.mp4", "d": "", "nt": "", "cues": ["Work the forearms before you load the wrists.", "Both sides, thumbs into the belly of the muscle."], "desc": ""}, {"v": "plank-knee-to-nose-float-ups", "n": "Plank Knee to Nose, Float Ups", "url": "", "d": "", "nt": "", "cues": ["From plank, knee to nose.", "Round the spine and press the ground away.", "Float up rather than jump."], "desc": ""}, {"v": "palm-lifts-table-top", "n": "Palm Lifts in Table Top", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/ffcc972bba57d4229af54b30e1c208a9/downloads/default.mp4", "d": "", "nt": "", "cues": ["Table top, hands flat.", "Lift the palms, keep the fingers down.", "Slow — this is wrist prep, not a rep."], "desc": ""}, {"v": "chair-assisted-handstand-walks", "n": "Chair-Assisted Handstand Walks", "url": "", "d": "", "nt": "", "cues": ["In the chair-assisted position.", "Walk the hands, keep the shoulders stacked."], "desc": ""}, {"v": "chair-press-entries", "n": "Chair Press Entries", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/f601190534cc4f21c99d05e50e2c1457/downloads/default.mp4", "d": "", "nt": "", "cues": ["From the chair, press the hips up and over.", "Shoulders stay stacked as the hips travel."], "desc": ""}, {"v": "wall-shape-changes", "n": "Shape Changes — At the Wall", "url": "", "d": "", "nt": "", "cues": ["Chest to wall, hands close.", "Change shape with the wall taking the balance.", "Build the awareness first — freestanding comes after."], "desc": "Shape changes done chest-to-wall so the wall holds the balance and you can feel the shape."}, {"v": "sideways-press-walks", "n": "Sideways Press Walks", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5dc97917e4f5613ab94e7fad92258860/downloads/default.mp4", "d": "", "nt": "", "cues": ["Press walks, travelling sideways.", "Hips up and back as you lean.", "Same push, different direction."], "desc": "Press walks travelling sideways rather than forward and back."}, {"v": "straddle-leg-lifts", "n": "Straddle Leg Lifts", "url": "", "d": "", "nt": "", "cues": ["Lift from the hip flexor.", "Don't lean back to make it easier.", "Slow up, slow down."], "desc": ""}, {"v": "pancake-to-wide-standing", "n": "Pancake to Wide Standing Lifts", "url": "", "d": "", "nt": "", "cues": ["From pancake, lift to a wide standing fold.", "Drive through the legs, keep the chest long."], "desc": "From a pancake, lift up to a wide standing forward fold and back down."}, {"v": "hands-together-tuck", "n": "Tuck Handstand — Hands Together", "url": "", "d": "", "nt": "", "cues": ["Bring the hands closer than feels natural.", "Push through the shoulders rather than widening the base.", "Less depth in the tuck is fine — the hand position is the drill."], "desc": "A tuck handstand with the hands closer together, even if that means less depth in the tuck."}];
const STAGE_SECTIONS={"0": [{"title": "Wrist Mobilisation", "sub": "Essential prep before any handstand work", "items": [{"v": "wrist-circles-mob", "n": "Wrist Circles", "d": "30s each way", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/a7cd457020f580093be946524a84c3af/downloads/default.mp4", "cues": ["Spread fingers wide.", "Keep pressure light at first.", "Move slowly through the full circle.", "Match both directions evenly."], "desc": "Gently warm and lubricate the wrists through their full range of motion before loading.", "nt": ""}, {"v": "wrist-flexion-ext", "n": "Wrist Flexion and Extension", "d": "2 × 10", "url": "", "cues": ["Use the other hand to assist gently.", "Hold briefly at end range.", "Never force into pain.", "Breathe steadily."], "desc": "Build active range through the wrist joint in both directions to reduce injury risk.", "nt": ""}, {"v": "wrist-weight-shift", "n": "Wrist Weight Shifting", "d": "2 × 30s", "url": "", "cues": ["On all fours, fingers facing forward.", "Shift weight slowly side to side.", "Then front to back.", "Increase pressure gradually."], "desc": "Progressively load the wrists on all fours with gentle shifts to build tolerance for handstand work.", "nt": ""}, {"v": "plank-fingertip-lifts", "n": "Plank Fingertip Lifts", "d": "10 reps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5e23544c8db4eac5b2377f400d7ceb8a/downloads/default.mp4", "cues": [], "desc": "A plank, but up on the fingertips instead of flat palms.", "nt": ""}]}, {"title": "Warm-Up", "sub": "Same opening every session", "items": [{"v": "shoulder-circles", "n": "Shoulder Circles", "d": "10 each way", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/9ad6108b534d2c6375d629bd2f2363ea/downloads/default.mp4", "cues": [], "desc": "", "nt": ""}, {"v": "shoulder-pulses", "n": "Shoulder Pulses", "d": "10 reps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/c812fa2fff981dd17bb93580619601f8/downloads/default.mp
