/* pull the thread from the worker; harmless if it isn't deployed yet */
/* what we have sent but the server has not echoed back yet. Blobs takes up
   to ~15s to propagate, so a read a second after a write legitimately comes
   back without the new message — and replacing the thread with that answer
   is what made a client's own video disappear out of their chat. */
let pendingMsgs=[];
const msgKey=m=>(m.video?'v:'+m.video:m.image?'i:'+m.image:'t:'+String(m.text||'').trim());
function loadThread(){
  if(!st.token) return;
  fetch(AUTH.messages,{headers:authed()}).then(r=>r.ok?r.json():null).then(d=>{
    if(!d||!d.messages) return;
    const next=d.messages.map(m=>({from:m.from==='coach'?'e':'me',text:m.text,
      ...(m.video?{video:m.video}:{}),...(m.image?{image:m.image}:{}),time:when(m.at)}));
    /* forget the ones the server has caught up on, keep the rest on screen */
    const seen=new Set(next.map(msgKey));
    pendingMsgs=pendingMsgs.filter(p=>!seen.has(msgKey(p)) && Date.now()-p.sentAt<600000);
    const merged=next.concat(pendingMsgs.map(p=>({from:'me',text:p.text,
      ...(p.video?{video:p.video}:{}),...(p.image?{image:p.image}:{}),time:when(p.sentAt)})));
    /* a redraw rebuilds the input and loses half-typed text, reloads every
       video iframe and drops the scroll to the top — so only redraw when
       something was actually said. Relative times change on their own and
       must not count as a change. */
    const shape=a=>JSON.stringify((a||[]).map(m=>[m.from,m.text||'',m.video||'',m.image||'']));
    const same=shape(merged)===shape(st.msgs);
    st.msgs=merged; save();
    if((st.tab==='ask'||st.tab==='coaching') && !same) render();
  }).catch(()=>{});
}
function when(t){
  if(!t) return '';
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'Just now';
  if(m<60) return m+' min ago';
  const h=Math.round(m/60);
  return h<24 ? h+' hr ago' : Math.round(h/24)+' days ago';
}

/* ── sending a photo ───────────────────────────────────────────────
   Shrunk here rather than sent whole: a phone photo is 4MB of detail
   nobody needs to judge a shoulder angle, and small enough to go
   through the function means no second storage provider. */
async function shrinkPhoto(file, max=1600, quality=0.82){
  let src;
  try{ src=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){
    src=await new Promise((res,rej)=>{
      const i=new Image(), u=URL.createObjectURL(file);
      i.onload=()=>{ URL.revokeObjectURL(u); res(i); };
      i.onerror=()=>{ URL.revokeObjectURL(u); rej('Could not read that photo'); };
      i.src=u;
    });
  }
  const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight;
  if(!w||!h) throw 'Could not read that photo';
  const s=Math.min(1, max/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  return c.toDataURL('image/jpeg',quality);
}

/* one uploader, three callers: the chat, the free assessment, and the
   two-week test. The file goes phone → Cloudflare directly either way. */
function uploadClip(file, say){
  say=say||upSay;
  if(file.size > 220*1024*1024) return Promise.reject('That file is very large. Trim it to under three minutes.');
  say('Getting ready…');
  return fetch(AUTH.upload,{method:'POST',headers:authed(),body:'{}'})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
    .then(d=>new Promise((resolve,reject)=>{
      const fd=new FormData(); fd.append('file',file);
      const xhr=new XMLHttpRequest();
      xhr.open('POST',d.uploadURL);
      xhr.upload.onprogress=e=>{ if(e.lengthComputable)
        say('Uploading… '+Math.round(e.loaded/e.total*100)+'%'); };
      xhr.onload=()=> (xhr.status>=200&&xhr.status<300) ? resolve(d.uid)
                    : reject('Upload failed ('+xhr.status+')');
      xhr.onerror=()=>reject('Upload failed — check your signal');
      xhr.send(fd);
    }));
}

  if(!a.goal||!a.level){ say('Pick a goal and where you are now.'); return; }

               injuries:a.injuries||'',notes:a.notes||''}})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that')))
    .then(()=>{ st.applyDraft={}; st.applied=Date.now(); save(); closeOv(); render(); })
    .catch(e=>say(String(e)));
}

/* the server is what rations the free form check; the app only reports it */
function gateCheck(r){
  if(r.ok) return r;
  return r.json().catch(()=>({})).then(d=>{
    if(d && d.gated){
      st.freeCheckUsed=true;
      st.intake=st.intake||{}; st.intake.baseline=st.intake.baseline||Date.now();
      /* only roll back an optimistic chat bubble if one was actually added */
      if(pendingMsgs.length){ pendingMsgs.pop(); st.msgs=(st.msgs||[]).slice(0,-1); }
      save(); render();
    }
    return Promise.reject((d&&d.error)||'Could not send that');
  });
}

function sendClip(file){
  if(upBusy) return;
  /* 180s is the cap the server sets on the upload link, so say so before
     they wait through an upload that will be rejected */
  if(file.size > 220*1024*1024){ upSay('That file is very large. Trim it to under three minutes.'); return; }
  upBusy=true; upPct=0; upSay('Getting ready…');

  fetch(AUTH.upload,{method:'POST',headers:authed(),body:'{}'})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
    .then(d=>new Promise((resolve,reject)=>{
      const fd=new FormData(); fd.append('file',file);
      const xhr=new XMLHttpRequest();
      xhr.open('POST',d.uploadURL);
      xhr.upload.onprogress=e=>{ if(e.lengthComputable){
        upPct=Math.round(e.loaded/e.total*100); upSay('Uploading… '+upPct+'%'); } };
      xhr.onload=()=> (xhr.status>=200&&xhr.status<300) ? resolve(d.uid)
                    : reject('Upload failed ('+xhr.status+')');
      xhr.onerror=()=>reject('Upload failed — check your signal');
      xhr.send(fd);
    }))
    .then(uid=>{
      upSay('Sending…');
      const text=(($('#askIn')||{}).value||'').trim();
      askDraft=''; const el=$('#askIn'); if(el) el.value='';

/* 88 thumbnails is 88 video downloads if you let it. Only the ones coming
   into view get a src, which keeps the library scrollable on mobile data. */
let lazyObs=null;
function lazyThumbs(){
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('video[data-lazy]').forEach(v=>{
      v.src=v.dataset.lazy; v.removeAttribute('data-lazy'); });
    return;
  }
  if(lazyObs) lazyObs.disconnect();
  lazyObs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      const v=e.target;
      if(e.isIntersecting){
        if(v.dataset.lazy){ v.src=v.dataset.lazy; v.removeAttribute('data-lazy'); v.load(); }
      } else if(!v.paused){
        /* off screen is off — no point burning battery and data on a clip
           nobody can see */
        try{ v.pause(); }catch(err){}
      }
    });
  },{rootMargin:'300px'});
  document.querySelectorAll('.scroll video').forEach(v=>lazyObs.observe(v));
}

/* ── the guided player ── */
let Q=[],qi=0,left=0,tTotal=0,phase='work',paused=false,tick_=null,lastT=0,sessionStart=0;

/* always m:ss — a bare '4' on a big clock reads as four minutes */
function fmtT(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60;
  return m+':'+String(r).padStart(2,'0'); }
const isHoldDose = d => /max hold|attempts|build to/i.test(String(d||''));

/* what a row says it will take, in the same seconds the player counts.
   A dose is the prescription ("3 x 8"); this is the clock. */
function lenLabel(it, grp){
  const w=work(it, grp);
  if(!w) return 'until you stop';
  return w<90 ? w+'s' : fmtT(w);
}

/* the big number is the dose, not a countdown — a set of ten reps should
   say TEN, not however many seconds we guessed it would take */
function repOf(it){
  const d=String(it.d||'');
  let m=d.match(/^\s*\d+\s*[×x]\s*(\d+)\s*(?:each|per)?/i);   if(m) return {n:m[1],u:'reps'};
  m=d.match(/(\d+)\s*reps/i);                                  if(m) return {n:m[1],u:'reps'};
  m=d.match(/(\d+)\s*s\b/);                                    if(m) return {n:m[1],u:'seconds'};
  m=d.match(/build to\s*(\d+)/i);                              if(m) return {n:m[1],u:'build to'};
  m=d.match(/^\s*(\d+)\s*$/);                                  if(m) return {n:m[1],u:'reps'};
  return {n:d||'—',u:'',small:true};
}

function toggleUp(i){
  const b=document.querySelector(`.p-upblock[data-up="${i}"]`);
  if(!b) return;
  const opening=!b.classList.contains('open');
  b.classList.toggle('open');
  /* one open at a time, and stop any clip the closing one was playing */
  document.querySelectorAll('.p-upblock').forEach(x=>{
    if(x!==b){ x.classList.remove('open');
      x.querySelectorAll('.p-upvid video').forEach(v=>{try{v.pause()}catch(e){}}); }
  });
  if(!opening) b.querySelectorAll('.p-upvid video').forEach(v=>{try{v.pause()}catch(e){}});
}

function showStep(){
  if(qi>=Q.length) return endPlayer(true);
  const s=Q[qi], it=s.it, resting=phase==='rest';
  document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}});
  $('#player').classList.toggle('resting',resting);
  $('#p-idx').textContent = resting ? 'REST' : 'EXERCISE '+(qi+1)+'/'+Q.length;

  const vw=$('#p-vwrap'), body=$('#p-body');
  if(resting){
    tTotal=left=rest(Q[qi], qi, Q);
    vw.className='p-vwrap novideo'; vw.innerHTML='';
    /* only preview a genuinely different drill — the line above already
       names the next set of the current one */
    const nx=Q[qi+1];
    const n=(nx && nx.it!==it) ? nx : null;
    body.innerHTML=`<span class="p-phase">Rest</span>
      <div class="p-main">
        <div class="p-repcol"><div class="p-repnum" id="p-repnum">${Math.round(left)}</div>
          <div class="p-repunit">remaining</div></div>
        <div class="p-info"><h2 class="p-name">Rest</h2>
          <div class="p-rule"></div>
          <div class="p-cues"><span class="cl">${
            s.set<s.sets ? 'Next: set '+(s.set+1)+' of '+s.sets+' · '+esc(it.n)
            : nx ? 'Next: '+esc(nx.it.n) : 'Last one done.'}</span></div></div>
      </div>
      ${upNextHTML()}`;
    $('#p-next').textContent='Skip rest →';
  } else {
    tTotal=left=work(it, s.g||s.grp);
    if(it.url){ vw.className='p-vwrap'; vw.innerHTML=
      `<video src="${it.url}" autoplay loop playsinline ${soundOn()?'':'muted'}></video>`; }
    else { vw.className='p-vwrap novideo';
      vw.innerHTML='<div class="p-vfail">Filming soon — the cues are the drill</div>'; }
    const rp=repOf(it), cues=it.cues||[];
    body.innerHTML=`<span class="p-phase">${s.sets>1?'Set '+s.set+' of '+s.sets:esc(s.grp||'Exercise')}</span>
      <div class="p-main">
        <div class="p-repcol"><div class="p-repnum${rp.small?' small':''}">${esc(rp.n)}</div>
          ${rp.u?`<div class="p-repunit">${rp.u}</div>`:''}</div>
        <div class="p-info"><h2 class="p-name">${esc(it.n)}</h2>
          <div class="p-rule"></div>
          <div class="p-cues">
            ${it.desc?`<b>${esc(it.desc)}</b>`:''}
            ${cues.map(c=>`<span class="cl">${esc(c)}</span>`).join('')}
            ${it.nt?`<span class="cl">${esc(it.nt)}</span>`:''}
          </div></div>
      </div>`;
    $('#p-next').textContent = s.sets>1 ? 'Set done →' : 'Done →';
  }

  $('#p-prev').style.visibility = (qi===0&&phase==='work') ? 'hidden' : '';
  $('#p-fill').style.width=((qi/Q.length)*100).toFixed(1)+'%';
  $('#p-scroll').scrollTop=0;
  paintClock(); paintPause();
  const sb=$('#p-sound');
  if(sb){ sb.innerHTML=soundOn()?VB_SPK:VB_MUTED;
          sb.setAttribute('aria-label', soundOn()?'Sound on':'Sound off'); }
  clearInterval(tick_); tick_=null;
  if(tTotal>0 && !paused){ lastT=Date.now(); tick_=setInterval(step,250); }
}

/* wall-clock delta, so a backgrounded phone does not lose seconds */
function step(){
  if(paused){ lastT=Date.now(); return; }
  const now=Date.now(); left-=(now-lastT)/1000; lastT=now;
  paintClock();
  const rn=$('#p-repnum'); if(rn&&phase==='rest') rn.textContent=Math.max(0,Math.round(left));
  if(left>0) return;
  clearInterval(tick_); tick_=null; beep(); advance();
}
function advance(){
  if(phase==='work'){
    const s=Q[qi];
    st.tick[key(st.day,s.gi,s.ii)]=true; save();
    /* the early warm-up drills run straight through, and a rest of zero
       used to leave the player sat on a Rest card with no timer to end it */
    if(qi<Q.length-1 && rest(Q[qi], qi, Q) > 0){ phase='rest'; showStep(); return; }
  }
  phase='work'; qi++;
  if(qi>=Q.length){ endPlayer(true); return; }
  showStep();
}
function skip(){ clearInterval(tick_); tick_=null; advance(); }
/* A line that says what just happened and then goes away. There was no
   such thing in here, and alert() stops the app dead to say one sentence. */
let toast_=null;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){
    el=document.createElement('div'); el.id='toast';
    el.style.cssText='position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;'+
      'background:var(--forest,#003b38);color:#fff;border-radius:999px;padding:11px 19px;'+
      'font:600 13.5px/1.2 var(--sans);box-shadow:0 8px 26px rgba(0,0,0,.22);'+
      'max-width:calc(100vw - 40px);text-align:center;opacity:0;transition:opacity .18s ease';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  el.style.opacity='1';
  clearTimeout(toast_);
  toast_=setTimeout(()=>{ el.style.opacity='0'; }, 2600);
}

/* The only place a follow-along ever gets asked. Rating a single drill
   needs the drill list open, and someone who only ever presses play would
   have stayed on level one forever, so the answer here moves every
   grouping the session touched. */
function sessionFeel(f){
  if(st.in) post({type:'Session feel',feel:f});
  const dir = f==='Too easy' ? +1 : f==='Too hard' ? -1 : 0;
  const moved = dir ? nudgeStage(dir) : null;
  closeOv();
  /* say what it did, or the session quietly changing next week reads as the
     app being inconsistent rather than as the thing they just asked for */
  if(moved) toast((dir>0?'Harder workouts from now on.':'Easier workouts from now on.')
    +' You can change it on the ladder.');
  else if(dir>0) toast('Already on the hardest workouts for this stage.');
  else if(dir<0) toast('Already on the easiest workouts for this stage.');
}

function endPlayer(done){ clearInterval(tick_); tick_=null;
  document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}});
  $('#player').classList.remove('on'); $('#player').innerHTML='';
  const d=day();
  const partWay = !done && qi>0 && qi<Q.length-1;
  if(partWay) whyStopContext=(Q[qi]&&Q[qi].it&&Q[qi].it.n)||'';
  /* The player has known the drill-by-drill all along — every set in Q
     carries its drill, its block and its position — and threw it away at
     the end, reporting only a count. Without it a coach can see that a
     session was abandoned but not which drill it died on, or how far
     into it. */
  const rows=(function(){
    const m=new Map();
    Q.forEach((x,idx)=>{
      const k=(x.it&&x.it.v)||(x.it&&x.it.n)||('#'+idx);
      if(!m.has(k)) m.set(k,{v:(x.it&&x.it.v)||'',n:(x.it&&x.it.n)||'',grp:x.grp||'',got:0,of:0});
      const r=m.get(k); r.of++; if(idx<qi||done) r.got++;
    });
    return [...m.values()].slice(0,40)
      .map(r=>Object.assign(r,{rate:(st.rate||{})[r.v]||''}));
  })();
  reportProgress({session:{day:st.day, name:(d&&d.label)||'', done:!!done, items:rows,
    drills:Q.length,
    mins:Math.round(Q.reduce((a,x,_i)=>a+work(x.it,x.g||x.grp)+rest(x,_i,Q),0)/60),
    actual: sessionStart?Math.round((Date.now()-sessionStart)/60000):0,
    got: done?Q.length:qi, of: Q.length,
    /* where they stopped is the useful half of an abandoned session */
    stoppedAt: done?'':((Q[qi]&&Q[qi].it&&Q[qi].it.n)||''),
    block: done?'':((Q[qi]&&Q[qi].grp)||'')}});
  st.lastSessionMins = sessionStart ? Math.round((Date.now()-sessionStart)/60000) : 0;
  if(done && !st.in) advanceDay();
  save();
  if(done){ st.ovSummary=true; openOv('summary'); }
  else if(partWay){ render(); openOv('why'); }
  else render(); }
/* One switch for the lot: the rest chime, the follow-along clip and every
   demo. It was per video and reset on each render, so turning sound on was
   something you did over and over. */
const soundOn = () => st.sound !== false;
function toggleSound(){
  st.sound = !soundOn(); save();
  document.querySelectorAll('#player video, .vb video').forEach(v=>{
    try{ v.muted = !soundOn(); }catch(e){}
  });
  document.querySelectorAll('[data-vb-sound]').forEach(b=>{
    b.innerHTML = soundOn()?VB_SPK:VB_MUTED;
    b.setAttribute('aria-label', soundOn()?'Sound on':'Sound off');
  });
  ['#p-sound','#l-sound'].forEach(sel=>{
    const b=document.querySelector(sel);
    if(b){ b.innerHTML = soundOn()?VB_SPK:VB_MUTED;
           b.setAttribute('aria-label', soundOn()?'Sound on':'Sound off'); }
  });
}
function beep(){ if(!soundOn()) return; try{ const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
  o.frequency.value=660;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.2,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);
  o.start();o.stop(a.currentTime+.31);}catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&tick_){ paused=true;
  document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}}); paintPause(); }});

/* ── video block ───────────────────────────────────────────────────
   Native controls put a black bar over the clip and a three-dot menu
   offering Download on paid footage. This is the same loop with our own
   chrome: tap to play/pause, a scrub line, and a sound toggle. */
const VB_SPK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const VB_MUTED='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
function vidBlock(url, ratio, fit){
  return `<div class="vb" data-vb style="position:relative;border-radius:22px;overflow:hidden;
    background:#000;margin-bottom:18px;cursor:pointer">
    <video src="${url}#t=0.6" ${soundOn()?'':'muted'} loop playsinline preload="metadata" autoplay
      style="display:block;width:100%;aspect-ratio:${ratio||'4/3'};object-fit:${fit||'cover'};background:#11150f"></video>
    <div data-vb-play style="position:absolute;inset:0;display:grid;place-items:center;
      background:rgba(0,0,0,.18);opacity:0;transition:opacity .18s;pointer-events:none">
      <span style="width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.92);
        display:grid;place-items:center;font-size:19px;color:#111111">&#9654;</span></div>
    <div style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;
      padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.55))">
      <div data-vb-track style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)">
        <div data-vb-fill style="height:100%;width:0;border-radius:2px;background:#fff"></div></div>
      <button data-vb-sound aria-label="Sound" style="flex:none;width:30px;height:30px;border:none;
        border-radius:50%;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;
        display:grid;place-items:center;padding:0">${soundOn()?VB_SPK:VB_MUTED}</button>
    </div></div>`;
}
document.addEventListener('click',function(e){
  const box=e.target.closest('[data-vb]'); if(!box) return;
  const v=box.querySelector('video'); if(!v) return;
  const sound=e.target.closest('[data-vb-sound]');
  if(sound){
    /* the toggle is the app's setting, not this one clip's, so it holds
       across drills and across sessions */
    toggleSound();
    if(soundOn() && v.paused) v.play().catch(()=>{});
    return;
  }
  const track=e.target.closest('[data-vb-track]');
  if(track && v.duration){
    const r=track.getBoundingClientRect();
    v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v.duration;
    return;
  }
  if(v.paused) v.play().catch(()=>{}); else v.pause();
},true);
/* one loop keeps every visible scrub line in sync — cheaper than a
   timeupdate listener per clip, and it stops when nothing is on screen */
(function vbLoop(){
  document.querySelectorAll('[data-vb]').forEach(function(box){
    const v=box.querySelector('video'); if(!v) return;
    const f=box.querySelector('[data-vb-fill]');
    if(f && v.duration) f.style.width=((v.currentTime/v.duration)*100).toFixed(1)+'%';
    const pl=box.querySelector('[data-vb-play]');
    if(pl) pl.style.opacity = v.paused ? '1' : '0';
  });
  requestAnimationFrame(vbLoop);
})();

/* Drag the sheet down to dismiss it. Only starts when the sheet is already
   scrolled to the top, so a downward swipe through a long list still scrolls
   the list rather than throwing it away. */
function bindSheetDrag(sheet){
  let y0=null, dy=0, live=false;
  const start=e=>{
    if(sheet.scrollTop>0) return;
    y0=e.touches?e.touches[0].clientY:e.clientY; dy=0; live=true;
    sheet.classList.add('drag');
  };
  const move=e=>{
    if(!live||y0==null) return;
    const y=e.touches?e.touches[0].clientY:e.clientY;
    dy=y-y0;
    if(dy<=0){ sheet.style.transform=''; return; }
    if(e.cancelable) e.preventDefault();
    sheet.style.transform='translateY('+dy+'px)';
    sheet.style.opacity=String(Math.max(.4, 1-dy/500));
  };
  const end=()=>{
    if(!live) return;
    live=false; sheet.classList.remove('drag');
    sheet.style.transform=''; sheet.style.opacity='';
    if(dy>110) closeOv();
    y0=null; dy=0;
  };
  sheet.addEventListener('touchstart',start,{passive:true});
  sheet.addEventListener('touchmove',move,{passive:false});
  sheet.addEventListener('touchend',end);
  sheet.addEventListener('touchcancel',end);
  sheet.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
}

/* a sheet that is really a screen — the drill list, mostly */
function toggleFull(){
  st.ovFull=!st.ovFull; save();
  $('#ov').classList.toggle('full', !!st.ovFull);
  /* Full screen is a class on the sheet, not a different sheet. Redrawing it
     tore down whatever you were in the middle of: a demo you had open closed
     itself and the list jumped, which is the "it refreshed on me" everybody
     reports. Only the button's own label needs to change. */
  const b=document.getElementById('ovFullBtn');
  if(b) b.textContent = st.ovFull ? 'Shrink' : 'Full screen';
}

/* let people read what they typed — most sign-in failures here are just a
   fat-fingered password on a phone keyboard */
function togglePw(){
  const i=$('#pwIn'), b=$('#pwEye'), sl=$('#pwEyeSlash');
  if(!i) return;
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  if(sl) sl.style.display = show ? '' : 'none';
  if(b){ b.setAttribute('aria-pressed', show ? 'true' : 'false');
         b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); }
  i.focus();
  // keep the caret at the end rather than jumping to the start on type-swap
  try { const n=i.value.length; i.setSelectionRange(n,n); } catch(e){}
}

function doLogin(ev){
  if(ev) ev.preventDefault();
  const email=(($('#emailIn')||{}).value||'').trim().toLowerCase();
  const password=($('#pwIn')||{}).value||'';
  const msg=$('#authMsg');
  if(!email||!password){ if(msg) msg.textContent='Both fields, please.'; return; }
  if(msg) msg.textContent='Checking…';
  fetch(AUTH.login,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password})})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{
      /* a coach signing in here wants the coach view, not a client screen */
      if(d.coach){ location.href='/lha-coach.html'; return; }
      st.email=email; st.token=d.token; st.client=d.client;
      st.in=!!d.coached;            /* coached tier only for actual coaching clients */
      st.plus=!!d.plus;
      if(!st.in){ st.mode='free'; st.quizDone=true; if(!st.tab||st.tab==='signin') st.tab='ladder'; }
      save(); render(); loadEntitlement();
      if(st.in){ loadProgramme(); loadProgress(); loadThread(); }
      loadLadder(); loadState(); loadTrack(); })
    .catch(code=>{ const m=$('#authMsg');
      if(m) m.textContent = code===429 ? 'Too many tries. Wait a few minutes.'
                                       : 'That email and password did not match.'; });
}
function requestCode(){
  const v=($('#emailIn')||{}).value||'';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ $('#authMsg').textContent='That does not look like an email address.'; return; }
  st.email=v.trim().toLowerCase();
  $('#authMsg').textContent='Sending…';
  fetch(AUTH.request,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:st.email})})
    .then(r=>{ if(!r.ok) throw 0; st.codeSent=true; save(); render(); })
    .catch(()=>{ /* routes not deployed yet — let the flow be walked anyway */
      st.codeSent=true; save(); render();
      const m=$('#authMsg'); if(m) m.textContent='Dev mode: the code is '+DEV_CODE; });
}
function verifyCode(){
  const c=(($('#codeIn')||{}).value||'').trim();
  if(c.length<4){ $('#authMsg').textContent='Enter the six digits from the email.'; return; }
  $('#authMsg').textContent='Checking…';
  fetch(AUTH.verify,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:st.email,code:c})})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{ st.token=d.token; st.client=d.client||nameFrom(st.email); st.in=true;
               save(); render(); loadEntitlement(); loadProgramme(); loadProgress(); loadThread(); loadState(); loadTrack(); })
    .catch(()=>{
      if(c===DEV_CODE){ st.in=true; st.client=nameFrom(st.email); save(); render(); return; }
      const m=$('#authMsg'); if(m) m.textContent='That code did not work. Check it, or send a new one.';
    });
}
const nameFrom=e=>{const n=(e||'').split('@')[0].split(/[._-]/)[0]; return n.charAt(0).toUpperCase()+n.slice(1);};

/* ── programme delivery ────────────────────────────────────────────
   The plan used to be baked into this file, so every client saw the
   same one. It now comes from the server, chosen by the token, and is
   cached so the app still opens on a gym floor with no signal. */
function libraryDrills(){
  /* prefer the full library; fall back to whatever the plan contains
     so the screen is never empty on a cold first load */
  const base = (LIBRARY && LIBRARY.length) ? LIBRARY : (function(){
    const out=[];
    DATA.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{
      if(!out.some(x=>x.v===it.v)) out.push(it); })));
    return out;
  })();
  /* A coached client has a written programme, and anyone who has paid has
     the ladder, so both see the lot. On free it was every drill in every
     stage, which gave away the material the paid stages are for. */
  if (isPlus()) return base;
  const open = new Set();
  for (let i = 0; i < FREE_STAGES && i < STAGES.length; i++) {
    (STAGE_SECTIONS[i] || []).forEach(sec =>
      (sec.items || []).forEach(it => open.add(it.v)));
    ((STAGES[i] || {}).drillIds || []).forEach(v => open.add(v));
  }
  if (typeof WRIST_DAY !== 'undefined') (WRIST_DAY.drills || []).forEach(v => open.add(v));
  return base.filter(d => open.has(d.v));
}
function libToArray(lib){
  if(!lib || !lib.names) return [];
  return Object.keys(lib.names).map(v=>({
    v:v, n:lib.names[v]||v, url:(lib.video||{})[v]||'', d:'', nt:'',
    cues:(lib.cues||{})[v]||[], desc:(lib.desc||{})[v]||''
  }));
}
function applyProgramme(d){
  if(d && d.plan && d.plan.days && d.plan.days.length) DATA = d.plan;
  const arr = libToArray(d && d.library);
  if(arr.length) LIBRARY = arr;
  if(d && d.ladderExtra) { st.ladderExtra = d.ladderExtra; save(); }
  if(d && d.timing) { st.timing = d.timing; save(); }
  if(st.day >= DATA.days.length) st.day = 0;
}
function cacheProgramme(d){
  try { localStorage.setItem('lha_plan', JSON.stringify(
    {at:Date.now(), email:st.email, plan:d.plan, library:d.library,
     ladderExtra:d.ladderExtra, timing:d.timing})); } catch(e){}
}
function loadCachedProgramme(){
  try {
    const c = JSON.parse(localStorage.getItem('lha_plan')||'null');
    /* a cached plan belongs to one address — never show it to someone else */
    if(c && c.email === st.email) { applyProgramme(c); return true; }
  } catch(e){}
  return false;
}
/* the app's own copy of what the server has recorded — the Progress screen
   used to show invented numbers because nothing real was available */
function loadProgress(){
  if(!st.token) return Promise.resolve();
  return fetch(AUTH.progress,{headers:authed()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){
      st.prog=d;
      /* the account holds the rep history, derived from its own sessions, so
         it follows the client to a new phone. The local copy is only what has
         not reached the server yet. */
      if(d.repsLog) st.repsLog=d.repsLog;
      /* the best of each shape is derived from the account's own holds, so a
         new phone knows what they have already done */
      if(d.bestHolds) st.bestHolds=Object.assign({}, d.bestHolds, st.bestHolds||{});
      save(); render();
    } })
    .catch(()=>{});
}
function sessionsDone(){ return ((st.prog&&st.prog.sessions)||[]).filter(x=>x.done); }
function blockStart(){
  const p=st.prog||{};
  const first=(p.sessions&&p.sessions.length&&p.sessions[0].at)
    || (p.opens&&p.opens.length&&new Date(p.opens[0]+'T00:00:00').getTime());
  return first||null;
}
function weekNow(){
  const st0=blockStart(); if(!st0) return 1;
  return Math.min(6, Math.floor((Date.now()-st0)/(7*86400000))+1);
}
/* completed sessions bucketed into the six weeks of a block */
function weekGrid(){
  const st0=blockStart(); const out=[[],[],[],[],[],[]];
  if(!st0) return out;
  sessionsDone().forEach(function(x){
    const w=Math.floor((x.at-st0)/(7*86400000));
    if(w>=0&&w<6) out[w].push(x);
  });
  return out;
}

/* The coach's changes to the free ladder, which every account needs and not
   only the coached ones. These rode on /programme, and /programme 404s for
   anyone without a written programme, so the Workouts tab in the dashboard
   saved happily and changed nothing about the app's own workouts. */
function loadLadder(){
  return fetch(AUTH.ladder)
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{
      let moved=false;
      if(d && d.timing)      { st.timing=d.timing;           moved=true; }
      if(d && d.explainKeys) { st.explainKeys=d.explainKeys;   moved=true; }
      if(d && d.ladderExtra) { st.ladderExtra=d.ladderExtra; moved=true; }
      if(moved){ save(); render(); }
      return true;
    })
    .catch(()=>false);
}
function loadProgramme(){
  if(!st.token) return Promise.resolve(false);
  return fetch(AUTH.programme,{headers:authed()})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{ applyProgramme(d); cacheProgramme(d);
               if(d.client) st.client=d.client;
               save(); render(); return true; })
    .catch(code=>{
      /* an expired token is the one failure worth acting on */
      if(code===401){ signOut(); return false; }
      loadCachedProgramme(); render(); return false;
    });
}

function savePassword(ev){

/* ── what gets reported back ───────────────────────────────────────
   Ticks, ratings and hold times already lived in this browser and went
   nowhere. Elliott can only coach what he can see, so a summary goes to
   the server. Nothing here is sent for a free-tier user — no token, no
   report. */
let progQueued=null;
/* one visit per load, stamped on first touch and closed out on the way out */
let visitStart=0, visitSent=false;
function watchVisit(){
  const begin=()=>{
    if(visitSent || !st.token) return;
    visitSent=true; visitStart=Date.now();
    reportProgress({visit:{ms:0}});
    ['pointerdown','keydown'].forEach(e=>document.removeEventListener(e,begin,true));
  };
  ['pointerdown','keydown'].forEach(e=>document.addEventListener(e,begin,true));
  /* how long they actually stayed, sent once, on the way out. keepalive so a
     closing tab still gets it away. */
  const close=()=>{
    if(!visitSent || !visitStart) return;
    const ms=Date.now()-visitStart; visitStart=0;
    try{
      fetch(AUTH.progress,{method:'POST',headers:authed(),keepalive:true,
        body:JSON.stringify({visit:{ms}})});
    }catch(e){}
  };
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) close(); });
  window.addEventListener('pagehide', close);
}

function reportProgress(extra){
  if(!st.token) return Promise.resolve();
  const flags={};
  Object.keys(st.rate||{}).forEach(function(v){
    if(st.rate[v]==='easy'||st.rate[v]==='hard')
      flags[v]={rate:st.rate[v], note:(st.note||{})[v]||''};
  });
  const payload=Object.assign({flags:flags, hold:st.bestHold||0}, extra||{});
  return fetch(AUTH.progress,{method:'POST',headers:authed(),body:JSON.stringify(payload)})
    .catch(function(){});   /* never let reporting break the session */
}
/* one call a minute at most — this is a summary, not a telemetry feed */
function reportSoon(extra){
  if(progQueued) clearTimeout(progQueued);
  progQueued=setTimeout(function(){ progQueued=null; reportProgress(extra); }, 1500);
}


/* Abandoning a session is the most informative thing a client does and the
   thing we currently learn least from. Asked once, optional, and only when
   they actually stop part-way. */
const WHY_REASONS=['Too long','Too hard','Too easy','Ran out of time',
  'Equipment not available','Not what I expected','Just browsing','Something else'];
let whyPicked=[];
function screenWhyBody(){
  return `<div style="font:400 14.5px/1.55 var(--sans);color:var(--grey)">
      Optional — it tells me what to change.</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">
      ${WHY_REASONS.map(r=>`<button onclick="toggleWhy('${esc(r)}')"
        style="display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;
        border:1.5px solid ${whyPicked.includes(r)?'var(--forest)':'transparent'};
        background:${whyPicked.includes(r)?'rgba(47,61,47,.07)':'var(--mist)'};
        border-radius:14px;padding:14px 15px;font:500 14.5px/1.2 var(--sans);color:var(--ink)">
        <span style="width:20px;height:20px;border-radius:6px;flex:none;
          border:2px solid ${whyPicked.includes(r)?'var(--forest)':'rgba(28,32,25,.25)'};
          background:${whyPicked.includes(r)?'var(--forest)':'#fff'};color:#fff;
          display:grid;place-items:center;font-size:11px">${whyPicked.includes(r)?'✓':''}</span>
        ${esc(r)}</button>`).join('')}
    </div>
    <textarea id="whyText" rows="3" placeholder="Anything else? (optional)"
      style="width:100%;margin-top:12px;border:1px solid rgba(28,32,25,.16);border-radius:14px;
      padding:13px;font:400 14px/1.5 var(--sans);resize:vertical;box-sizing:border-box;outline:none"></textarea>
    <div style="display:flex;gap:9px;margin-top:14px">
      <button class="btn2" style="flex:1" onclick="closeWhy(false)">Skip</button>
      <button class="btn" style="flex:1.4" onclick="closeWhy(true)">Send</button>
    </div>`;
}
function toggleWhy(r){
  whyPicked = whyPicked.includes(r) ? whyPicked.filter(x=>x!==r) : whyPicked.concat([r]);
  drawOv();
}
function closeWhy(send){
  if(send){
    const t=($('#whyText')||{}).value||'';
    if(whyPicked.length||t.trim()){
      reportProgress({feedback:{kind:'Stopped early',reasons:whyPicked,text:t,
        context:whyStopContext}});
      post({type:'Stopped early',reasons:whyPicked.join(', '),text:t,
            where:whyStopContext,_reported:true});
    }
  }
  whyPicked=[]; closeOv();
}
let whyStopContext='';

function signOut(){
  /* clearing the token alone left the old tab on screen, so signing out
     looked like nothing had happened. Drop right back to the free app. */
  if(typeof tick_!=='undefined' && tick_){ clearInterval(tick_); tick_=null; }
  if(typeof stopHold==='function') stopHold();
  /* this is usually tapped from inside the account overlay, which sits over
     everything — leave it open and signing out looks like a dead button */
  st.ov=null;
  const ov=$('#ov'); if(ov){ ov.classList.remove('on'); ov.innerHTML=''; }
  document.querySelectorAll('video').forEach(v=>{try{v.pause()}catch(e){}});
  st.in=false; st.codeSent=false; st.token=null;
  st.client=null; st.msgs=null;      // nobody else's name or thread left behind
  try{ localStorage.removeItem('lha_plan'); }catch(e){}
  st.mode='free';                    // skip the welcome gate on the way out
  st.tab='ladder';                   // a screen they can actually use
  save(); render();
  window.scrollTo(0,0);
}

/* ── flags, tests, and anything else that reaches Elliott ── */
const FORM='https://formspree.io/f/xvzjawjv';
function post(payload){
  /* email is still the alert; the dashboard is the record */
  /* _reported means the caller already filed the detailed version */
  if(st.in&&st.token&&payload&&payload.type&&!payload._reported){
    reportProgress({feedback:{kind:payload.type,
      text:[payload.text,payload.results,payload.flags,payload.reasons]
        .filter(Boolean).join(' · ').slice(0,900)}});
  }
  return fetch(FORM,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(Object.assign({client:st.client||'',email:st.email||''},payload))}).catch(()=>{});
}
function tick(k){ st.tick[k]=!st.tick[k]; save(); render(); }
/* 'Good' was doing nothing useful — it is the default state, and it made
   every drill row carry three buttons. Only the two exceptions are worth
   a tap. Clear any that were already saved. */
Object.keys(st.rate||{}).forEach(function(k){ if(st.rate[k]==='good') delete st.rate[k]; });
/* ticking a drill off in the list. Kept apart from the coached plan's own
   ticks, which are keyed by day and group rather than by queue position. */
function qTick(k,el){
  st.qTick=st.qTick||{};
  const on = st.qTick[k] = !st.qTick[k];
  save();
  /* touch this row only. Redrawing the sheet threw away open demos, the
     stepper you were using and where you had scrolled to. */
  if(el) el.classList.toggle('on', on);
  const row=el&&el.closest('div[style*="border-radius:16px"]');
  if(row) row.style.background = on ? '#faf8f5' : '#fff';
  const nm=document.getElementById('name-'+k);
  if(nm){ nm.style.color = on?'var(--grey2)':''; nm.style.textDecoration = on?'line-through':''; }
  qCount();
}

/* the header line and the Done button, kept in step without a redraw */
function qCount(){

  if(el) el.textContent = (Q||[]).length+' drills · '+
    Math.max(1,Math.round((Q||[]).reduce((a,q,_i)=>a+work(q.it,q.g||q.grp)+rest(q,_i,Q),0)/60))+' minutes'+(n?' · '+n+' done':'');
  const fin=document.getElementById('qdone');

/* the list is a way of training, so finishing it has to count the same as
   finishing the player — the same session record, marked as worked through
   rather than followed along. */
function finishChecklist(){
  const ticked=(Q||[]).filter((_,i)=>(st.qTick||{})['q'+i]).length;
  if(!ticked) return;
  const done=ticked>=(Q||[]).length;
  const mins=Math.round((Q||[]).reduce((a,x,_i)=>a+work(x.it)+rest(x,_i,Q),0)/60);
  reportProgress({session:{
    day:st.day, name:((Q[0]&&Q[0].grp)||''), done, mode:'list',
    drills:Q.length, mins, actual:0, got:ticked, of:Q.length,
    items:(Q||[]).map((q,i)=>({v:q.it.v, n:q.it.n, of:1,
      got:(st.qTick||{})['q'+i]?1:0, reps:(st.reps||{})['q'+i]||0,
      /* what was asked for, so short of it or past it is visible on both
         sides rather than a bare number with nothing to read it against */
      want:recommendedReps(q.it)||0, dose:String(q.it.d||'').slice(0,40),
      rate:(st.rate||{})[q.it.v]||''})).slice(0,40)
  }});
  st.prog=st.prog||{}; st.prog.sessions=st.prog.sessions||[];
  st.prog.sessions.push({at:Date.now(), done:true, mins, mode:'list'});
  logReps();
  st.qTick={}; st.reps={}; save(); closeOv(); openOv('summary');
}

/* the list's own flag toggle: state, then the two buttons and the note box
   that belong to this row */
/* What this drill's grouping is running at, and what a rating will do to
   it. Said out loud, because a session that quietly gets harder reads as
   the app being inconsistent rather than the person getting better. */
function levelLine(v){
  if(typeof poolRow!=='function') return '';
  const row=poolRow(curStage(), v);
  return (row && row.g!=='Warm-up') ? row.g : '';
}

function rateRow(v,k,r){
  st.rate=st.rate||{}; st.note=st.note||{};
  const now = st.rate[v]===r ? '' : r;
  st.rate[v]=now;
  if(now!=='easy'&&now!=='hard') delete st.note[v];
  /* a rating is only a flag to a coach if there is one; on the ladder it is
     the thing that moves the work */
  /* on a coached plan this is a flag for the coach and nothing else; the
     ladder's difficulty is one dial on the ladder screen now */
  save(); reportSoon();
  const e=document.getElementById('easy-'+k), h=document.getElementById('hard-'+k);
  if(e) e.classList.toggle('on', now==='easy');
  if(h) h.classList.toggle('on', now==='hard');
  const ll=document.getElementById('lvl-'+k);
  if(ll) ll.textContent = levelLine(v);
  const box=document.getElementById('note-'+k);
  if(box){
    box.hidden = !now;
    const lbl=document.getElementById('notelbl-'+k);
    if(lbl && now) lbl.textContent = now==='hard' ? 'TOO HARD' : 'TOO EASY';
  }
}

function rate(v,r){ st.rate[v]=st.rate[v]===r?'':r; if(st.rate[v]!=='easy'&&st.rate[v]!=='hard') delete st.note[v]; save(); reportSoon(); render(); }
function sendFlags(){
  const f=Object.keys(st.rate).filter(v=>st.rate[v]==='easy'||st.rate[v]==='hard');
  if(!f.length) return;
  const names={}; DATA.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(i=>names[i.v]=i.n)));
  post({type:'Drill flags',flags:f.map(v=>st.rate[v].toUpperCase()+' — '+(names[v]||v)+(st.note[v]?' ("'+st.note[v]+'")':'')).join('\n')});
  st.flagSent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}); save(); render();
}
function filmTest(id,name){
  if(upBusy) return;
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
    const say=m=>{ const el=$('#tc-'+id); if(el) el.textContent=m; };
    upBusy=true;
    uploadClip(f,say)
      .then(uid=>{ st.testClips=st.testClips||{}; st.testClips[id]={uid,name}; save();
                   upBusy=false; say(''); drawOv(); })
      .catch(e=>{ upBusy=false; say(String(e)); });
  };
  inp.click();
}

/* numbers and clips go together — that pairing is the review */
function sendTest(){
  const vals=st.testDraft||{};
  const clips=Object.entries(st.testClips||{}).map(([id,c])=>({drill:id,name:c.name,uid:c.uid}));
  const named={}; DATA.test.items.forEach(t=>{ if(vals[t.id]) named[t.n]=vals[t.id]+' '+t.u; });
  if(!clips.length && !Object.keys(named).length){
    const m=$('#testMsg'); if(m) m.textContent='Add a number or a clip first.'; return;
  }
  const m=$('#testMsg'); if(m) m.textContent='Sending…';
  fetch(AUTH.submission,{method:'POST',headers:authed(),
    body:JSON.stringify({kind:'test',numbers:named,clips})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that')))
    .then(()=>{
      st.tests=(st.tests||[]).concat([vals]); st.testDraft={}; st.testClips={};
      st.awaitingReview=Date.now(); save();
      reportProgress({test:vals}); closeOv(); loadThread(); render();
    })
    .catch(e=>{ const el=$('#testMsg'); if(el) el.textContent=String(e); });
}

with bent legs. Open the legs out to the side and circle them to centre, keeping the gaze down and elevating the scapula to push up into position."}, {"v": "tuck-entries", "n": "Tuck Entries", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/1215255521e9da9fd966e8b6d7ec128b/downloads/default.mp4", "d": "", "nt": "", "cues": ["Stack the shoulders over the hands.", "Keep knees together throughout.", "Jump up to a tuck handstand.", "Extend the legs and push the pelvis through to straight."], "desc": "Once the shoulders are stacked, keep the knees together and jump up to a tuck handstand. Extend the legs and push the pelvis through to bring the body into a straight line."}, {"v": "p-pike-pushups", "n": "Pike Push Ups", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/1d49ef13267f7b9516df86a406c3412a/downloads/default.mp4", "d": "", "nt": "", "cues": ["Feet a little wider than hips, knees bent, hips high.", "Look forward to a point between the hands.", "Lower the forehead to that point, elbows tucked.", "Push back up keeping the diagonal line."], "desc": "Front deltoid strength — the fix if you end up collapsing in the take-off. Build the pressing strength the take-off demands."}, {"v": "p-pike-pushup-negs", "n": "Pike Push Up Negatives", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5fc1575443b323abd17a824d634ddb41/downloads/default.mp4", "d": "", "nt": "", "cues": ["Lower under control.", "Keep the shoulders elevated throughout."], "desc": "A progression on the pike push up — load the lowering phase to build pressing strength."}, {"v": "p-pike-pushups-knees", "n": "Pike Push Ups on Knees", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/990e81ff459d2a428966d1cfc75d868c/downloads/default.mp4", "d": "", "nt": "", "cues": ["Same shape, less load.", "Build to the full pike push up."], "desc": "A regression — the same pressing pattern made more accessible. Build the strength from your knees first."}, {"v": "p-l-handstand", "n": "L-Shaped Handstand", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/ae64c76e183bb5191aaf6856240a3eab/downloads/default.mp4", "d": "", "nt": "", "cues": ["Stack the hips over the shoulders.", "Push tall through the shoulders.", "Build to 30 seconds — rest as you need, but get there.", "Hold at about 70% of your max: a challenge, not impossible."], "desc": "Helps you learn to get the hips stacked over the shoulders — the position the take-off has to find."}, {"v": "p-tuck-handstand", "n": "Tuck Handstand", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/823cfe703e74214ad84ddba54a386bbe/downloads/default.mp4", "d": "", "nt": "", "cues": ["Engage the hip flexors to pull the knees down.", "Let the lower back draw the hips into anterior pelvic tilt.", "Push tall — actively elevate the scapula.", "Avoid posterior tilt — it becomes a tuck planche."], "desc": "HERO DRILL. The scapula needs to be elevated to properly take off, and the tuck handstand is the best teacher — it shows you how to move the hips and elevate the scapula at the same time. The lower centre of mass makes balancing easier but you feel it far more in the shoulders."}, {"v": "p-tuck-slides", "n": "Tuck Handstand Slides", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/b8566b45406a58ad0824b1af38a4ea85/downloads/default.mp4", "d": "", "nt": "", "cues": ["Same start, hands 1.5 feet from the wall.", "Knees together, lower them down.", "The harder version — both legs at once."], "desc": "Movement patterning for the take-off — learn to get the hips stacked over the shoulders."}, {"v": "p-single-leg-tuck-slides", "n": "Single Leg Tuck Slides", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/b8566b45406a58ad0824b1af38a4ea85/downloads/default.mp4", "d": "", "nt": "", "cues": ["Chest to wall, hands about 1.5 feet from the wall, feet pointed.", "One foot stays on the wall.", "Take the other knee down towards your chest."], "desc": "A single-leg variation to build control and hip stacking one side at a time."}, {"v": "p-plank-slides", "n": "Plank Slides to Pike", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/7e7ebd3d88d2a9fc610a62d556d01ec4/downloads/default.mp4", "d": "", "nt": "", "cues": ["Move as one connected chain.", "Control the slide both ways."], "desc": "Conditioning — builds the connected-chain strength the compression demands."}, {"v": "p-bench-zombies", "n": "Bench Zombies", "url": "", "d": "", "nt": "", "cues": ["Point the feet on a gym bench.", "Hands on the floor.", "Slide the feet as close to the edge of the bench as you can.", "Get stacked, keep the back rounded."], "desc": "Plank with your feet on a bench, toes pointed. Pull yourself up until the hips are stacked over the shoulders."}, {"v": "p-bench-zombies-lowers", "n": "Bench Zombies Lowers", "url": "", "d": "", "nt": "", "cues": ["Start on the edge of the bench.", "Step off and lower slowly to the floor."], "desc": "Start on the edge of the bench, step off and slowly lower down to the floor — adds the eccentric to build strength through the position."}, {"v": "p-pancake", "n": "Pancake Training", "url": "", "d": "", "nt": "", "cues": ["Reach long through the chest.", "Build active range, not just passive."], "desc": "Flexibility — builds the active compression range in the straddle that the press relies on."}, {"v": "p-dd-toe-taps", "n": "Downward Dog Toe Taps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/097aa6b7a61129cdaf8a78e64ba389bb/downloads/default.mp4", "d": "", "nt": "", "cues": ["Push the hips up and back.", "Keep the shoulders open."], "desc": "Trains compression and shoulder position while keeping the wrists happy."}, {"v": "p-pelvis-glute", "n": "Pelvis & Glute Engagement Drill", "url": "", "d": "", "nt": "", "cues": ["Find the hip position on the floor first.", "Take it to the wall."], "desc": "On the floor and at the wall — trains the hip positioning that keeps the unroll organised."}, {"v": "p-solo-press-circles", "n": "Solo Press Circles", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/7ab907d930c9749d32486003184bcf23/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hold the handstand, open the legs.", "Start with small circles.", "Grow them as you get stronger.", "Both directions — speed doesn't matter."], "desc": "In a handstand, open the legs and make small circles. Grow the circles bigger over time, working towards the press position. Speed doesn't matter — work both directions."}, {"v": "p-back-to-wall", "n": "Back to Wall Press", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/7fdd9f7cceba8dcb31544af7550a0154/downloads/default.mp4", "d": "", "nt": "", "cues": ["Full upper back AND head on the wall.", "Focus on engaging the hip flexors.", "Keep the back rounded.", "If heavy on the wrists, turn the hands out to the side."], "desc": "HERO DRILL. Teaches the shape and compression with the wall taking some of the load. Make sure your full upper back as well as head is on the wall — this takes more of the weight so you can focus on engaging the hip flexors and keeping the back rounded."}, {"v": "p-chest-to-wall", "n": "Chest to Wall Press", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/eef15d6792347cd1aaeb0be71f222aeb/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands about 1.5 to 2 feet from the wall — you should only just feel you can touch it.", "Start in balance if you can.", "Bring the feet towards the wall and open out into a straddle.", "Come down the wall, rounding the upper back.", "Then push back up into a full handstand."], "desc": "THE ULTIMATE HERO. Trains all three stages — take-off, compression and unrolling — in a single movement. Your feet cannot go anywhere, so your shoulders cannot either: you either compress and unroll correctly, or the wall rejects you."}, {"v": "p-chest-to-wall-negs", "n": "Chest to Wall Negatives", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/900bba4d79fa55bd8e3db4d369e0157b/downloads/default.mp4", "d": "", "nt": "", "cues": ["Lower slowly and with control.", "Feel the path you will reverse on the way up."], "desc": "Lower under control from the wall handstand to break the ice and feel the descending path of the press."}, {"v": "shoulder-circles", "n": "Shoulder Circles", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/9ad6108b534d2c6375d629bd2f2363ea/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hold just above the chest.", "Circle the arm 10 times each side.", "Both directions."], "desc": ""}, {"v": "shoulder-pulses", "n": "Shoulder Pulses", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/c812fa2fff981dd17bb93580619601f8/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands above the head, or out to one side.", "Pulse in that direction without opening through the chest.", "Also try pulling the hands into fists with the thumbs pointing back.", "That gets a different stretch."], "desc": "Small pulses through the shoulders to open them up before load."}, {"v": "forward-fold-pulses", "n": "Forward Fold Pulses", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "plank-fingertip-lifts", "n": "Plank Fingertip Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5e23544c8db4eac5b2377f400d7ceb8a/downloads/default.mp4", "d": "", "nt": "", "cues": ["A plank, but up on the fingertips instead of flat palms.", "Spread the fingers wide before you take any weight.", "Lift one finger at a time and keep the rest planted.", "Stop if the wrists ache rather than work."], "desc": "A plank, but up on the fingertips instead of flat palms."}, {"v": "kneeling-scapula-engagement", "n": "Kneeling Scapula Engagement", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "chest-to-wall-toe-taps", "n": "Chest to Wall Toe Taps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/da4144ad54ec886963a8e09a8050c7c6/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands about 2 feet from the wall.", "One leg stays on the wall.", "Pull the other knee or toe towards the floor.", "Control it down, don't drop."], "desc": "Hands about 2 feet from the wall, one leg on the wall. Take the other leg off and pull the knee or toe down towards the floor."}, {"v": "press-eccentrics", "n": "Press Eccentrics", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/29ccefcc5c0dfb837de6272309d647cd/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start in the handstand.", "Lower slowly through the compression.", "Same path you'll press back up."], "desc": "The press in reverse. From the handstand, lower under control through the compressed position instead of pushing up out of it."}, {"v": "press-walks", "n": "Press Walks", "url": "", "d": "", "nt": "", "cues": ["Lift the heels and keep the hips high.", "Push into the ground before you look forward.", "Hips high is the real key.", "Hold for a few moments to make it harder.", "There's a full explainer under Why?"], "desc": "Baby hop the feet forward, then press the hips up and back as you lean forward. Walk up and down the mat."}, {"v": "block-reaches", "n": "Block Reaches", "url": "", "d": "", "nt": "", "cues": ["Seated forward fold, block in the hands.", "Reach forward over the feet.", "Engage through the quads.", "Active, not a passive hang."], "desc": "Sit in a forward fold holding a block. Reach forward over the feet, engaging through the quads. An active forward fold, not a passive one."}, {"v": "lolasana-lifts", "n": "Lolasana Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/1d8c3fd87048e4be984c51f8372f16ae/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands in front of the knees to make it harder.", "Fingers facing outwards to make it easier.", "From kneeling, push up into a pike.", "Bring the hands back to make it harder."], "desc": "Straight arms, knees tucked, lift and hold."}, {"v": "tuck-planche-hold", "n": "Tuck Planche Hold", "url": "", "d": "", "nt": "", "cues": [], "desc": "Straight arms, hips level. Strength work."}, {"v": "freestanding-hold", "n": "Freestanding Hold", "url": "", "d": "", "nt": "", "cues": ["Kick up, find it, hold it.", "Stop the set the moment the shape goes.", "Quality over seconds — this isn't a max attempt."], "desc": "A clean hold, not a maximum. Up to 15 seconds, stopping as soon as the line goes."}, {"v": "max-hold-test", "n": "Max Hold Test", "url": "", "d": "", "nt": "", "cues": ["Three attempts, best of three.", "Warm up properly first.", "Film one if you can."], "desc": "The tracked number. Three attempts, log the best."}, {"v": "dd-wrist-taps", "n": "Downward Dog Wrist Taps", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/d79ada213578ca1993b4cb4b9f3ec4b1/downloads/default.mp4", "d": "", "nt": "", "cues": ["Set up in downward dog with the fingers spread.", "Tap one hand off the floor and replace it under control.", "Weight through the base of the fingers, not the heel of the hand.", "Alternate hands, even tempo."], "desc": "Load and unload one wrist at a time in downward dog, building tolerance without holding the position."}, {"v": "chair-assisted-knee-lifts", "n": "Chair-Assisted Knee Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/a3f7be549122a3e84dd46e1530724349/downloads/default.mp4", "d": "", "nt": "", "cues": ["Feet on the edge of a chair or sofa, in an assisted plank.", "Lift the knees, taking the hips up towards the sky.", "Keep looking between the palms the whole time."], "desc": ""}, {"v": "chair-assisted-step-ups", "n": "Chair-Assisted Step Ups", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/d5bff0ae8e4f8914cd35d7b906155956/downloads/default.mp4", "d": "", "nt": "", "cues": ["The same as the knee lifts.", "This time lift one leg up into the air."], "desc": ""}, {"v": "straddle-straight-tuck-diamond", "n": "Straddle → Straight → Tuck → Diamond", "url": "", "d": "", cues": ["Lie on your back, arms up as if you were in a handstand.", "Go into a dish shape.", "Pull the knees in towards the chest.", "Keep the back rounded and the lower back on the floor throughout."], "desc": ""}, {"v": "dd-to-crow-jump", "n": "Downward Dog to Crow Jump", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "crow-to-chaturanga", "n": "Crow to Chaturanga Jump Back", "url": "", "d": "", "nt": "", "cues": ["Find the crow first and settle before you jump.", "Shoot the feet back and meet the floor with bent arms.", "Release the weight rather than dropping it.", "Land quiet — noise means it got away from you."], "desc": "Jump back from crow to a bent-arm plank — the control that stops a bail becoming a fall."}, {"v": "chaturanga-to-crow", "n": "Chaturanga to Crow Jump", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "table-top-knee-to-nose", "n": "Table Top Knee to Nose", "url": "", "d": "", "nt": "", "cues": ["Knees lifted off the floor.", "Pull the knees towards the nose.", "Round the spine and press the ground away."], "desc": "Table top with the knees lifted. Take the knees to the nose and round the spine, pressing the ground away."}, {"v": "half-kick-ups", "n": "Half Kick Ups", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "leg-on-chair-puppy-entry", "n": "Leg on Chair Puppy Entry", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "box-step-ups", "n": "Box Step Ups", "url": "", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "plank-pose", "n": "Plank Pose", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/90a824ed88a1bca051dceb30dfd5e629/downloads/default.mp4", "d": "", "nt": "", "cues": ["Turn the biceps to face forward.", "Start on the knees.", "Push through the base of the palms to round the back.", "Then take one knee back, and maybe the other."], "desc": "A plank held with the shoulders stacked and the ribs down."}, {"v": "chair-assisted-puppy-press", "n": "Chair-Assisted Puppy Press", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/a4e209b649da9c8f63b8784dd42e42e1/downloads/default.mp4", "d": "", "nt": "", "cues": ["The same as the press entries.", "Bend the knee and open through the hip of the lifted leg.", "Keep pulling it up and back to take the leg off.", "Bring the foot slightly off the chair and back on — not all the way up."], "desc": "One foot on the side of a chair, lift the other hip and stack the body. Start with the hips higher than feels necessary."}, {"v": "forearm-massage", "n": "Forearm Massage", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/39baddde2e76b2dd1ef4f33b232d2b2d/downloads/default.mp4", "d": "", "nt": "", "cues": ["Palm-up side: massage the forearm with the bony part of the knee.", "Don't put too much weight through it.", "Other side: use the elbow along the top line of fascia shown in the video."], "desc": ""}, {"v": "plank-knee-to-nose-float-ups", "n": "Plank Knee to Nose, Float Ups", "url": "", "d": "", "nt": "", "cues": ["From plank, knee to nose.", "Round the spine and press the ground away.", "Float up rather than jump."], "desc": ""}, {"v": "palm-lifts-table-top", "n": "Palm Lifts in Table Top", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/ffcc972bba57d4229af54b30e1c208a9/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start in table top.", "Lift the palms and thumb up.", "Lean the shoulders over the hands to increase the difficulty.", "You can also do this in plank pose."], "desc": ""}, {"v": "chair-assisted-handstand-walks", "n": "Chair-Assisted Handstand Walks", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/264342c895cf6befb3ca2bb913f050b0/downloads/default.mp4", "d": "", "nt": "", "cues": ["In the chair-assisted position.", "Walk the hands, keep the shoulders stacked."], "desc": ""}, {"v": "chair-press-entries", "n": "Chair Press Entries", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/f601190534cc4f21c99d05e50e2c1457/downloads/default.mp4", "d": "", "nt": "", "cues": ["One foot onto the side of a chair.", "Hands just in front of the front chair leg.", "Bring the hands closer in to make it harder and more like a press.", "Put the second foot down, then lift it up.", "The hips come up into an assisted handstand."], "desc": ""}, {"v": "wall-shape-changes", "n": "Shape Changes — At the Wall", "url": "", "d": "", "nt": "", "cues": ["Hands about a foot from the wall, feet very lightly touching it.", "Go between straddle and straight.", "Shift the shoulders away from the wall as much as you can.", "Only use the wall if you feel the balance going."], "desc": "Shape changes done chest-to-wall so the wall holds the balance and you can feel the shape."}, {"v": "sideways-press-walks", "n": "Sideways Press Walks", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5dc97917e4f5613ab94e7fad92258860/downloads/default.mp4", "d": "", "nt": "", "cues": ["Less a strength drill, more a shifting one.", "Hands sideways to the feet — going right, the left hand sits in front of the right foot.", "Hop towards the right, keeping the hips high.", "It's press walks, travelling sideways."], "desc": "Press walks travelling sideways rather than forward and back."}, {"v": "straddle-leg-lifts", "n": "Straddle Leg Lifts", "url": "", "d": "", "nt": "", "cues": ["Lift from the hip flexor.", "Don't lean back to make it easier.", "Slow up, slow down."], "desc": ""}, {"v": "pancake-to-wide-standing", "n": "Pancake to Wide Standing Lifts", "url": "", "d": "", "nt": "", "cues": ["From pancake, lift to a wide standing fold.", "Drive through the legs, keep the chest long."], "desc": "From a pancake, lift up to a wide standing forward fold and back down."}, {"v": "hands-together-tuck", "n": "Tuck Handstand — Hands Together", "url": "", "d": "", "nt": "", "cues": ["Bring the hands closer than feels natural.", "Push through the shoulders rather than widening the base.", "Less depth in the tuck is fine — the hand position is the drill."], "desc": "A tuck handstand with the hands closer together, even if that means less depth in the tuck."}, {"v": "knee-to-nose-bounces", "n": "Knee to Nose Bounces", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/8bca83124064e21a1abe84d1a21ac587/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start in table top with the knees off the floor.", "Take the knee to the nose.", "Jump in towards it slightly as you do.", "Keep the bounce as light as you can."], "desc": ""}, {"v": "slow-entries", "n": "Slow Entries", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/a9b6bfa4548b7f62f5242f17eced8c84/downloads/default.mp4", "d": "", "nt": "", "cues": ["Two varieties.", "One: start kneeling with the feet pointed, lift the hips, look between the hands, take one knee into the chest.", "Two: the same, but switch feet, keeping the hips high.", "The second is the beginning of a press — shift between the two feet, holding a second of balance if you can."], "desc": ""}, {"v": "chair-assisted-handstand-extensions", "n": "Chair-Assisted Handstand Extensions", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/94d9a148fa14b218795d9a0947caba3f/downloads/default.mp4", "d": "", "nt": "", "cues": ["Feet on the chair.", "Walk the hands in to about 70–80% of what you can do, hips over shoulders.", "Push through the base of the palms, as far away as you can.", "Look between the hands.", "Walk out and repeat."], "desc": ""}, {"v": "hand-opens", "n": "Hand Opens", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/daf02e6e50d438d07b312bc193d4759a/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start with the hand closed, fingers curled in.", "Open slowly and spread as wide as the hand will go.", "Hold the open position a beat before closing.", "Slow beats forceful — this is circulation, not stretching."], "desc": "Open and close the hand through full range to keep the forearms and fingers moving between loaded sets."}, {"v": "straddle-to-straight-entries", "n": "Straddle to Straight Entries", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/4be7868ac0a11251d92d447367dceef1/downloads/default.mp4", "d": "", "nt": "", "cues": ["Start with the shoulders stacked over the hands.", "Look between the hands.", "Straddle up, then bring the legs together into straight."], "desc": ""}, {"v": "knees-on-box-pushes", "n": "Knees on Box — Palm Pushes", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/3f8d978d6e7c21ae14d376815eb90803/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands at about 70% of the closest they can get to the box.", "Push through the palms as hard as you can for 5 seconds.", "Rest 5 seconds.", "Three rounds."], "desc": ""}, {"v": "lying-back-engagements", "n": "Lower Back Engagement", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/11196300771c8f5829cdc902f7f381e2/downloads/default.mp4", "d": "", "nt": "", "cues": ["Lift from the upper back, not the neck.", "Legs straight, squeeze the glutes.", "Small range held well beats a big lift that collapses.", "Breathe through it."], "desc": "On your front, lift the chest and legs a little and hold the squeeze. The back has to switch on before it can hold a line upside down."}, {"v": "banded-lower-back-engagements", "n": "Banded Lower Back Engagements", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/9bedbb59ede392ff64633ce7d9c0ee57/downloads/default.mp4", "d": "", "nt": "", "cues": ["Set the band before you lift, not after.", "Chest up, ribs down.", "Hold the top for a beat every rep.", "Stop the set when the shape goes."], "desc": "The same engagement with a band adding resistance, so the position has to be held against something."}, {"v": "banded-external-rotations", "n": "Banded External Rotations", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/06fea21e3d30ada849ff99dea4b369df/downloads/default.mp4", "d": "", "nt": "", "cues": ["Elbows stay pinned to the ribs.", "Rotate from the shoulder, not the wrist.", "Slow back in, do not let the band snap you.", "Both sides, even if one is better."], "desc": "Elbows in, rotate the forearms out against the band. Builds the rotation the shoulders need before they take weight overhead."}, {"v": "active-hamstring-stretch", "n": "Active Hamstring Stretch", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/80c16268390a200e16419eec332b90f7/downloads/default.mp4", "d": "", "nt": "", "cues": ["Pull the leg in with the hip, do not push with the hands.", "Knee straight, foot relaxed.", "Hold the top for a few seconds.", "It should feel like work, not a rest."], "desc": "A hamstring stretch you hold with your own strength rather than hanging on the joint. Active range is the range you keep."}, {"v": "pancake-lift-combo", "n": "Pancake Lift Combo", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/63723a2d387cdb8915b9e18baab55933/downloads/default.mp4", "d": "", "nt": "", "cues": ["Open first, then lift.", "Lift from the hip flexors.", "Chest stays long, do not round to reach.", "Small lifts held are the point."], "desc": "Pancake, then lift out of it under your own power. Straight into the range you just opened."}, {"v": "pike-hip-lifts", "n": "Pike Hip Lifts", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/9cc457ddf95e3eec257bf689385b3837/downloads/default.mp4", "d": "", "nt": "", "cues": ["Hands flat beside the hips.", "Push the floor away, do not shrug.", "Legs stay straight.", "Lift the hips, not just the heels."], "desc": "Sit in a pike, hands down, lift the hips. The compression the press is built on."}, {"v": "floor-press-circles", "n": "Floor Press Circles", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/40d45e5b3b65389faf14c531508ab3e0/downloads/default.mp4", "d": "", "nt": "", "cues": ["Weight moves forward before anything lifts.", "Shoulders travel past the wrists.", "Slow, it is a pattern not a rep.", "Same path back."], "desc": "The press pattern traced on the floor, so the shift of weight is learned before you are upside down."}, {"v": "press-scapula-shrugs", "n": "Press Scapula Shrugs", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/5afd92280aa162a40d9fca2acc983280/downloads/default.mp4", "d": "", "nt": "", "cues": ["Push the floor away at the top.", "Ears away from the shoulders.", "Full range, all the way down and all the way up.", "No bend in the elbows."], "desc": "Shrugs in the press position. The push through the shoulders that holds you up at the top."}, {"v": "press-slides", "n": "Press Slides", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/40a509721d745138efbffa2975071e25/downloads/default.mp4", "d": "", "nt": "", "cues": ["Weight forward first, then the feet move.", "Hips lift as the feet come in.", "Slide, do not hop.", "Stop where the shape holds."], "desc": "Slide the feet in towards the hands and back out, keeping the weight forward the whole way."}, {"v": "kneeling-top-of-foot-stretch", "n": "Kneeling Top of Foot Stretch", "url": "", "d": "", "nt": "", "cues": ["Tops of the feet flat, toes pointing back.", "Sit back slowly, hands down to take weight off if it is sharp.", "Build the time, do not force the range.", "Come out of it as slowly as you went in."], "desc": "Kneel with the tops of the feet flat on the floor and sit back. Opens the ankles for anything that loads the tops of the feet."}, {"v": "ytws", "n": "YTWs", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/ccd891c3b845e1155b9a135e87b94b9b/downloads/default.mp4", "d": "", "nt": "", "cues": ["Thumbs up in the Y.", "Squeeze the shoulder blades together in the T.", "Elbows down and back in the W.", "Small lifts, held, not swung."], "desc": "Three shapes on your front, arms making a Y, a T and a W. Wakes up everything across the upper back."}, {"v": "chair-assisted-handstand-scapula-shrugs", "n": "Chair-Assisted Handstand Scapula Shrugs", "url ick-ups", "n": "Knee to Chest Kick Ups", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/2563624790ac1efb8db57988e8594d01/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "basic-bail-outs", "n": "Basic Bail Outs", "url": "https://customer-pns1oongdltmkjwa.cloudflarestream.com/692ed8ab7e701e52ea14fe5e88103585/downloads/default.mp4", "d": "", "nt": "", "cues": [], "desc": ""}];

/* ── intake ────────────────────────────────────────────────────────
   Four screens. Level is the only one that places anyone — goal never
   touches the stage, because someone who has never been upside down and
   wants a one-arm is still a beginner, and that is exactly the person a
   goal-driven placement would break. Goal earns its place by reframing
   the work ("a one-arm is a handstand you can hold without thinking, so
   that is what we build first") and by ordering the explainers. */
const GOALS=[
  {v:'learn',    t:'Learn to handstand',        d:"I'm starting from the beginning."},
  {v:'hold',     t:'Hold a freestanding handstand', d:"I can get upside down, but can't balance consistently."},
  {v:'improve',  t:'Improve my handstand',      d:'I want a better line, control and technique.'},
  {v:'advanced', t:'Learn advanced skills',     d:'Presses, shapes, one-arm and beyond.'},
];

/* Four rungs. Wrist tissue adapts slower than everything else, which is
   why the cap is physiology rather than a judgement about them — and why
   the copy says so. */
const LEVELS=[
  {v:0, t:'I have never done handstands', d:'Never been upside down.',
   days:[2,3],   def:2, mins:[15,30,45]},
  {v:1, t:"I'm stuck at the wall",        d:"I can kick up, but can't balance.",
   days:[2,3],   def:3, mins:[15,30,45]},
  {v:2, t:'I can briefly balance',        d:'A few seconds, but not consistently.',
   days:[3,4],   def:3, mins:[15,30,45,60]},
  {v:3, t:'I can hold it',                d:'Ten seconds or more.',
   days:[3,4,5], def:4, mins:[15,30,45,60]},
];

const NIGGLES=['Wrists','Shoulders','Neck or back','Elbows','Something else','Nothing right now'];
const MINS=[[15,'Short and focused'],[30,'A proper session'],[45,"I'm ready to put the work in"],[60,'Handstands are a priority']];

const intake = () => (st.intake=st.intake||{});
const levelDef = () => LEVELS.find(l=>l.v===intake().level) || LEVELS[0];

/* "How well we know you", never "how far along you are" — a training bar
   that starts above zero is a lie, and one that drops when we add a
   question later is worse than none. */
function profilePct(){
  const a=intake(); let n=20;                 /* opening the app is the first rung */
  if(a.goal) n+=15; if(a.level!=null) n+=20;
  if(a.niggles) n+=15; if(a.mins&&a.days) n+=15;
  if(a.baseline) n+=15;
  return Math.min(100,n);
}

const INTAKE_STEPS=[
  {id:'goal',  kick:'WHAT YOU WANT',  q:'What are you here to achieve?',
   sub:'This shapes how I explain things — not where you start.'},
  {id:'level', kick:'WHERE YOU ARE',  q:'Tell us about your handstand.',
   sub:'This is the one that sets your stage.'},
  {id:'niggles',kick:'ANYTHING SORE', q:'Anything I should know about?',
   sub:'Pick any that apply. It changes what you get given, not whether you can start.'},
