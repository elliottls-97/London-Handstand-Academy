<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f3d2f">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>London Handstand Academy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#f2efe7; --page:#e3e0d6; --forest:#2f3d2f; --forest-d:#26311f; --ink:#1c2019;
 --terra:#c87a56; --sand:#c8b48a; --sage:#9fb098; --grey:#61655a; --grey2:#8a8d80;
 --mist:#e8ece3; --red:#a4503c; --line:rgba(28,32,25,.14);
 --serif:'Instrument Serif',Georgia,serif; --sans:Manrope,system-ui,sans-serif;
}
body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--ink);
 -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
 /* the page itself never scrolls — only .scroll does, so the tab bar stays put */
 height:100dvh;overflow:hidden}
.s::-webkit-scrollbar{display:none}.s{scrollbar-width:none}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
 background:var(--bg);overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.hero{padding:calc(env(safe-area-inset-top) + 14px) 22px 26px;
 background:linear-gradient(180deg,var(--forest),var(--forest-d));color:var(--bg);border-radius:0 0 30px 30px}
body[data-tier=free] .hero{background:linear-gradient(180deg,#3a4a37,#2f3d2f)}
body[data-tier=free] .btn{background:#3a4a37}
.kick{font:600 10px/1 var(--sans);letter-spacing:.2em;color:var(--sage)}
.kick2{font:600 9.5px/1 var(--sans);letter-spacing:.16em;color:var(--grey2)}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400}
.h-xl{font:400 40px/1.02 var(--serif)} .h-lg{font:400 34px/1.06 var(--serif)}
.h-md{font:400 26px/1.1 var(--serif)} .h-sm{font:400 22px/1 var(--serif)}
.card{background:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 2px 20px rgba(28,32,25,.06)}
.pad{padding:12px 16px 0}
.btn{border:none;width:100%;background:var(--forest);border-radius:18px;padding:18px;cursor:pointer;
 font:700 15px/1 var(--sans);color:var(--bg);display:block}
.btn small{display:block;font:500 11px/1 var(--sans);letter-spacing:.1em;color:var(--sage);margin-top:8px}
.btn2{flex:1;text-align:center;font:600 13px/1 var(--sans);color:var(--forest);padding:14px;cursor:pointer;
 border-radius:16px;border:1.5px solid var(--line);background:none}
.pill{font:600 9.5px/1 var(--sans);letter-spacing:.14em;padding:7px 10px;border-radius:999px}
.tabbar{flex:none;display:flex;background:#fff;border-top:1px solid rgba(28,32,25,.08);
 padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 12px;cursor:pointer;
 border:none;background:none}
.tab i{width:7px;height:7px;border-radius:999px;background:transparent;display:block}
.tab.on i{background:var(--terra)}
body[data-tier=free] .tab.on i{background:var(--sand)}
.tab span{font:500 11.5px/1 var(--sans);color:var(--grey2)}
.tab.on span{font-weight:700;color:var(--ink)}
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none}
.ov.on{display:block}
.ovhead{background:var(--forest);padding:calc(env(safe-area-inset-top) + 18px) 22px 22px;color:var(--bg)}
.back{font:500 13px/1 var(--sans);color:var(--sage);cursor:pointer;background:none;border:none;padding:0}
video{width:100%;display:block;background:#000}
.row{padding:15px 18px;border-bottom:1px solid rgba(28,32,25,.07)}
.row:last-child{border-bottom:none}
.box{width:24px;height:24px;border-radius:8px;border:2px solid rgba(28,32,25,.2);flex:none;
 display:grid;place-items:center;font-size:13px;color:transparent;cursor:pointer;background:#fff}
.box.on{background:var(--forest);border-color:var(--forest);color:#fff}
.rt{font:600 10.5px/1 var(--sans);border-radius:999px;padding:6px 10px;cursor:pointer;
 border:1px solid var(--line);background:#fff;color:var(--grey2)}
.rt.easy.on{background:var(--sage);color:#fff;border-color:transparent}
.rt.hard.on{background:var(--terra);color:#fff;border-color:transparent}
.why{display:inline-flex;align-items:center;gap:9px;margin-top:10px;background:var(--mist);
 border-radius:999px;padding:8px 13px;cursor:pointer;border:none}
.why b{font:700 11.5px/1 var(--sans);color:var(--terra)}
.why span{font:500 11.5px/1 var(--sans);color:#3f5240}
input,textarea{font-family:var(--sans);font-size:16px;color:var(--ink)}
.act{
  border:1px solid var(--line,rgba(0,0,0,.14)); background:#fff; color:var(--ink);
  border-radius:999px; padding:11px 17px; cursor:pointer;
  font:600 13px/1 var(--sans); white-space:nowrap;
}
.act:active{transform:translateY(1px)}
.act:focus-visible{outline:2px solid var(--forest); outline-offset:2px}
</style></head><body><div id="app"></div>
<script>
let DATA={
  /* Deliberately empty. Plans arrive from /api/app/programme, chosen by the
     signed-in client's token. A real plan used to sit here, which meant one
     client's programme — and the personal note at the top of it — shipped to
     everyone who opened this file. */
  days:[{id:'1',label:'Day 1',sub:'',title:'Day 1',when:'',mins:'0',groups:[]}],
  read:[], test:{blurb:'',items:[]}
};

/* ── London Handstand Academy — coached tier ─────────────────────
   Built from the Claude Design handoff. Coached client only for now;
   the free ladder tier shares this shell and lands next.

   Auth is a passwordless email code. The UI is real; the two calls it
   makes are documented in AUTH below and land on the existing worker
   (lha-worker.js already does magic links + Resend). Until those routes
   are deployed, DEV_CODE lets the flow be walked end to end. */
const AUTH = {
  request: '/api/app/code',    // POST {email} → emails a 6-digit code
  verify:  '/api/app/verify',  // POST {email, code} → {token, client}
  messages:'/api/app/messages',// GET → thread · POST {text} → send
  login:   '/api/app/login',   // POST {email,password} → {token, client}
  programme:'/api/app/programme', // GET → {client, plan, library} for the token
  password:'/api/app/password',  // POST {current,next}
  progress:'/api/app/progress'   // POST a summary · GET it back
};
const authed = () => ({'Content-Type':'application/json','Authorization':'Bearer '+(st.token||'')});
const DEV_CODE = '123456';

const K='lha_app';
let st={};
try{ st=JSON.parse(localStorage.getItem(K)||'{}')||{}; }catch(e){ st={}; }
function save(){ try{ localStorage.setItem(K,JSON.stringify(st)); }catch(e){} }
st.tab=st.tab||'today'; st.day=st.day|0; st.tick=st.tick||{}; st.rate=st.rate||{};
st.note=st.note||{}; st.open=st.open||{}; st.why=st.why||{};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=()=>DATA.days[st.day]||DATA.days[0];
const allItems=d=>d.groups.flatMap(g=>g.items);
const key=(di,gi,ii)=>di+'-'+gi+'-'+ii;

/* ── session queue ── */
function sets(dose){
  let m=/^\s*(\d+)\s*[×x]/.exec(dose); if(m) return +m[1];
  m=/^\s*(\d+)\s*sets?\b/i.exec(dose); if(m) return +m[1];
  return 1;
}
function work(it){
  const d=it.d.toLowerCase(), n=it.n.toLowerCase();
  let m=/(\d+)\s*s\b/.exec(d); if(m) return +m[1];
  if(n.includes('entries')&&/^\s*\d+\s*reps/.test(d)) return 150;
  if(n.includes('entries')||/build to 6/.test(d)) return 150;
  if(/build to 10/.test(d)) return 210;
  if(n.includes('tuck slides')) return 120;
  if(n.includes('press walks')) return 90;
  if(n.includes('pancake')) return 90;
  return 40;
}
const rest=it=>/entries|build to/.test((it.n+it.d).toLowerCase())?60:35;
function queue(){
  const d=day(), q=[];
  d.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    const n=sets(it.d);
    for(let k=0;k<n;k++) q.push({it,gi,ii,set:k+1,sets:n,grp:g.name});
  }));
  return q;
}

/* ── screens ───────────────────────────────────────────────── */
function screenToday(){
  const d=day(), q=queue(), done=allItems(d).filter((_,i)=>false).length;
  const total=allItems(d).length;
  const ticked=d.groups.reduce((a,g,gi)=>a+g.items.filter((_,ii)=>st.tick[key(st.day,gi,ii)]).length,0);
  const mins=q.reduce((a,s)=>a+work(s.it)+rest(s.it),0);
  const weeks=[1,2,3,4,5,6].map(w=>{
    const days=[0,1,2].map(i=>{
      const doneW = w<3 || (w===3&&i===0);
      return `<i style="flex:1;height:26px;border-radius:5px;background:${doneW?'var(--sand)':'rgba(255,255,255,.16)'}"></i>`;
    }).join('');
    return `<div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;gap:3px">${days}</div>
      <span style="font:600 9.5px/1 var(--sans);color:${w===3?'var(--bg)':'var(--sage)'};text-align:center">W${w}</span></div>`;
  }).join('');
  const pts=[['Stack early','Shoulders and hands aligned at the start of the entry, not fixed once you are up.'],
             ['Hands closer','You widen to make up for pushing less through the shoulders. You are strong enough not to.'],
             ['Hips','Engage them and get to the open position rather than letting the shape close.']];
  return `<div class="scroll s">
  <div class="hero">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="kick">BLOCK 1 · WEEK 3 OF SIX</span>
      <button onclick="openOv('account')" aria-label="Your account"
        style="width:34px;height:34px;border-radius:999px;background:var(--terra);border:none;padding:0;
        display:grid;place-items:center;font:700 12px/1 var(--sans);color:#fff;cursor:pointer">${
        esc((st.client||'H')[0].toUpperCase())}</button>
    </div>
    <div class="h-xl" style="margin-top:20px">Good ${greeting()},<br>${esc(st.client||'Hannah')}.</div>
    <div style="font:400 15px/1.5 var(--sans);color:var(--sage);margin-top:10px">Seven sessions in, eleven to go.</div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:22px">${weeks}</div>
  </div>

  <div class="pad" style="padding-top:18px">
    <div class="card">
      <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
        <span class="pill" style="color:var(--red);background:rgba(164,80,60,.1)">${esc(d.sub.toUpperCase())}</span>
        <span style="font:600 11px/1 var(--sans);letter-spacing:.12em;color:var(--grey2)">TODAY · ${today()}</span>
      </div>
      <div class="h-lg" style="margin-top:16px">${esc(d.label)} — ${esc(d.sub)}</div>
      <div style="font:400 15px/1.5 var(--sans);color:var(--grey);margin-top:9px">${esc(d.when)}</div>
      <div style="display:flex;gap:22px;margin-top:18px">
        ${[[total,'DRILLS'],[q.length,'SETS'],[Math.round(mins/60)+' min','GUIDED']].map(([v,k])=>
          `<div><div class="h-sm" style="font-size:24px">${v}</div>
           <div class="kick2" style="margin-top:6px">${k}</div></div>`).join('')}
      </div>
      <button class="btn" style="margin-top:20px" onclick="startPlayer()">Start session
        <small>GUIDED · EVERY SET AND REST TIMED</small></button>
      <div style="display:flex;gap:9px;margin-top:9px">
        <button class="btn2" onclick="go('plan')">See the drills</button>
        <button class="btn2" onclick="openOv('adjust')">Can't train?</button>
      </div>
      ${ticked?`<div style="font:500 12px/1 var(--sans);color:var(--grey2);text-align:center;margin-top:12px">${ticked} of ${total} ticked off today</div>`:''}
    </div>
  </div>

  <div class="pad">
    <div class="card" style="padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="kick2">ELLIOTT ON THIS BLOCK</span>
        <button class="back" style="color:var(--terra);font-weight:700;font-size:11.5px" onclick="st.readOpen=!st.readOpen;save();render()">${st.readOpen?'Less':'Read it'}</button>
      </div>
      <div class="h-md" style="margin-top:12px">Three things changed</div>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:15px">
        ${pts.map(([t,x])=>`<div style="display:flex;gap:12px;align-items:baseline">
          <span style="font:italic 400 15px/1.2 var(--serif);color:var(--terra);min-width:74px">${t}</span>
          <span style="font:400 14px/1.45 var(--sans);flex:1">${x}</span></div>`).join('')}
      </div>
      ${st.readOpen?`<div style="margin-top:16px;border-top:1px solid rgba(28,32,25,.1);padding-top:15px;display:flex;flex-direction:column;gap:12px">
        ${DATA.read.map(p=>`<div style="font:400 14.5px/1.55 var(--sans);color:var(--grey)">${p.replace(/<[^>]+>/g,'')}</div>`).join('')}
      </div>`:''}
    </div>
  </div>

  <div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="card" style="border-radius:22px;padding:18px">
      <div class="kick2">STREAK</div>
      <div class="h-md" style="font-size:32px;margin-top:10px">3 weeks</div>
      <div style="font:400 12.5px/1.4 var(--sans);color:var(--grey);margin-top:5px">Nothing missed.</div>
    </div>
    <div class="card" style="border-radius:22px;padding:18px;background:var(--terra);color:#fff;cursor:pointer" onclick="openOv('test')">
      <div class="kick2" style="color:rgba(255,255,255,.75)">TWO-WEEK TEST</div>
      <div class="h-md" style="font-size:32px;margin-top:10px">4 days</div>
      <div style="font:400 12.5px/1.4 var(--sans);color:rgba(255,255,255,.85);margin-top:5px">Five drills, one honest go.</div>
    </div>
  </div>
  <div style="padding:10px 16px 26px">
    <div class="card" style="border-radius:22px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer" onclick="go('ask')">
      <div><div class="kick2">${(()=>{const m=(st.msgs||[]).filter(x=>x.from==='e').pop();
        return m?('ELLIOTT · '+String(m.time||'').toUpperCase()):'ASK ELLIOTT';})()}</div>
      <div style="font:400 14px/1.45 var(--sans);margin-top:7px">${(()=>{const m=(st.msgs||[]).filter(x=>x.from==='e').pop();
        return esc(m?m.text.slice(0,90)+(m.text.length>90?'…':''):'A question, a niggle, a week you cannot train — send it over.');})()}</div></div>
      <span style="font:400 22px/1 var(--serif);color:var(--terra)">→</span>
    </div>
  </div></div>`;
}
const greeting=()=>{const h=new Date().getHours();return h<12?'morning':h<18?'afternoon':'evening';};
const today=()=>new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();

/* ── Plan ── */
function screenPlan(){
  const d=day();
  const total=allItems(d).length;
  const ticked=d.groups.reduce((a,g,gi)=>a+g.items.filter((_,ii)=>st.tick[key(st.day,gi,ii)]).length,0);
  const tabs=DATA.days.map((x,i)=>`<button onclick="st.day=${i};save();render()" style="flex:1;border:none;cursor:pointer;
    border-radius:14px;padding:10px 6px;background:${i===st.day?'rgba(255,255,255,.14)':'transparent'};
    font:${i===st.day?'700':'500'} 12.5px/1 var(--sans);color:${i===st.day?'var(--bg)':'var(--sage)'}">
    ${esc(x.label)}<span style="display:block;font:500 9.5px/1 var(--sans);letter-spacing:.1em;margin-top:5px;
    color:${i===st.day?'var(--sage)':'rgba(159,176,152,.6)'}">${esc(x.sub.toUpperCase())}</span></button>`).join('');

  const groups=d.groups.map((g,gi)=>{
    const wk=st.why[st.day+'-'+gi];
    const rows=g.items.map((it,ii)=>{
      const k=key(st.day,gi,ii), on=st.tick[k], rate=st.rate[it.v]||'', openD=st.open[k];
      const flagged=rate==='easy'||rate==='hard';
      return `<div class="row" style="${on?'background:#fbfaf7':''}">
        <div style="display:flex;gap:13px;align-items:flex-start">
          <div class="box ${on?'on':''}" onclick="tick('${k}')">✓</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
              <div style="font:600 15px/1.25 var(--sans);${on?'color:var(--grey2);text-decoration:line-through':''}"
                   onclick="openDrill(${gi},${ii})">${esc(it.n)}</div>
              ${it.url?`<button class="rt" style="flex:none" onclick="st.open['${k}']=!st.open['${k}'];save();render()">${openD?'Hide':'▶ Demo'}</button>`
                      :`<span class="rt" style="flex:none;opacity:.55">Soon</span>`}
            </div>
            <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px">
              <span style="font:700 13px/1 var(--sans);color:var(--terra)">${esc(it.d)}</span>
              <button class="rt easy ${rate==='easy'?'on':''}" onclick="rate('${it.v}','easy')">Too easy</button>
              <button class="rt hard ${rate==='hard'?'on':''}" onclick="rate('${it.v}','hard')">Too hard</button>
            </div>
            ${it.nt?`<div style="font:400 13.5px/1.45 var(--sans);color:var(--grey);margin-top:8px">${esc(it.nt)}</div>`:''}
            ${openD&&it.url?`<div style="margin-top:11px">${vidBlock(it.url,'16/10')}</div>`:''}
            ${flagged?`<div style="margin-top:12px;background:#f7f0ec;border-radius:18px;padding:14px">
              <div style="font:600 9.5px/1 var(--sans);letter-spacing:.16em;color:var(--red)">${rate==='hard'?'TOO HARD':'TOO EASY'} — TELL ELLIOTT</div>
              <input value="${esc(st.note[it.v]||'')}" oninput="st.note['${it.v}']=this.value;save()"
                placeholder="What happened? (optional)"
                style="width:100%;background:#fff;border:none;border-radius:14px;padding:12px;margin-top:10px;
                font:400 13.5px/1.45 var(--sans);color:var(--grey)">
              <div style="display:flex;gap:9px;margin-top:10px">
                <button onclick="sendFlags()" style="flex:1;border:none;background:var(--forest);color:var(--bg);
                  border-radius:999px;padding:12px;font:600 12px/1 var(--sans);cursor:pointer">Send to Elliott</button>
              </div></div>`:''}
          </div></div></div>`;
    }).join('');
    return `<div style="padding:20px 16px 0">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
        <span class="h-sm">${esc(g.name)}</span>
        <span style="font:600 11px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${g.items.length} DRILLS</span>
      </div>
      <button class="why" onclick="st.why['${st.day+'-'+gi}']=!st.why['${st.day+'-'+gi}'];save();render()">
        <span>${esc(purpose(g.name))}</span><b>${wk?'Less':'Why?'}</b></button>
      ${wk?`<div style="margin-top:11px;background:#fff;border-radius:20px;padding:16px">
        <div style="font:400 14.5px/1.55 var(--sans);color:var(--grey)">${esc(why(g.name))}</div></div>`:''}
    </div>
    <div style="margin:12px 12px 0;background:#fff;border-radius:24px;overflow:hidden">${rows}</div>`;
  }).join('');

  return `<div class="scroll s">
    <div style="background:var(--forest);padding:calc(env(safe-area-inset-top) + 10px) 18px 16px;color:var(--bg);position:sticky;top:0;z-index:2">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="h-md" style="font-size:26px">${esc(d.label)}</span>
        <span style="font:600 11.5px/1 var(--sans);color:var(--sage)">${ticked} / ${total}</span>
      </div>
      <div style="height:4px;border-radius:999px;background:rgba(255,255,255,.15);margin-top:12px;overflow:hidden">
        <div style="height:100%;width:${total?Math.round(ticked/total*100):0}%;background:var(--sand);border-radius:999px"></div></div>
      <div style="display:flex;gap:7px;margin-top:13px">${tabs}</div>
    </div>
    ${groups}<div style="height:26px"></div></div>`;
}
const PURPOSE={'Warm-up':'Wrists and shoulders','Entries — build to 6':'The position, every time',
 'Shape changes':'Awareness while upside down','Tuck':'This is press training',
 'Press walks':'Do these differently to normal','Strength':'At the end, when warm',
 'Mobility':'When you are warm','Floats and press walks':'The press pattern at floor level'};
const WHY={'Warm-up':'Four minutes so the first entry is not the warm-up. Wrists get loaded hard today.',
 'Entries — build to 6':'Entries are to practise entering the correct position every single time. Get fully into it, but do not make more than one adjustment before coming back down.',
 'Shape changes':'The key thing that made my handstand consistent. The wall holds the balance so you can feel the shape — then one freestanding set on top.',
 'Tuck':'The tuck handstand is press training in disguise. Hands close, push through the shoulders instead of widening. Less depth is fine.',
 'Press walks':'I want these done slightly differently to normal to get a lot more out of them — the explainer is the whole drill.',
 'Strength':'Strength last so it never eats into the balance work.',
 'Mobility':'At the end, when you are warm.',
 'Floats and press walks':'The press pattern at floor level — same shift of weight, no handstand needed.'};
const purpose=n=>PURPOSE[n]||'Why this is here';

/* pull the thread from the worker; harmless if it isn't deployed yet */
function loadThread(){
  if(!st.token) return;
  fetch(AUTH.messages,{headers:authed()}).then(r=>r.ok?r.json():null).then(d=>{
    if(!d||!d.messages) return;
    const next=d.messages.map(m=>({from:m.from==='coach'?'e':'me',text:m.text,time:when(m.at)}));
    /* re-rendering rebuilds the input and throws away whatever is half-typed,
       so only redraw when the thread has actually changed */
    const same=JSON.stringify(next)===JSON.stringify(st.msgs||[]);
    st.msgs=next; save();
    if(st.tab==='ask' && !same) render();
  }).catch(()=>{});
}
function when(t){
  if(!t) return '';
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'Just now';
  if(m<60) return m+' min ago';
  const h=Math.round(m/60);
  return h<24 ? h+' hr ago' : Math.round(h/24)+' days ago';
}

/* 88 thumbnails is 88 video downloads if you let it. Only the ones coming
   into view get a src, which keeps the library scrollable on mobile data. */
let lazyObs=null;
function lazyThumbs(){
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('video[data-lazy]').forEach(v=>{
      v.src=v.dataset.lazy; v.removeAttribute('data-lazy'); });
    return;
  }
  if(lazyObs) lazyObs.disconnect();
  lazyObs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      const v=e.target;
      if(e.isIntersecting){
        if(v.dataset.lazy){ v.src=v.dataset.lazy; v.removeAttribute('data-lazy'); v.load(); }
      } else if(!v.paused){
        /* off screen is off — no point burning battery and data on a clip
           nobody can see */
        try{ v.pause(); }catch(err){}
      }
    });
  },{rootMargin:'300px'});
  document.querySelectorAll('.scroll video').forEach(v=>lazyObs.observe(v));
}

/* ── the guided player ── */
let Q=[],qi=0,left=0,tTotal=0,phase='work',paused=false,tick_=null,lastT=0;

/* The player used to re-render the whole panel once a second, which tore the
   <video> down and rebuilt it on every tick — the clip never got past its
   first frame. Shell is built once, the step body only when the step changes,
   and the clock is the only thing the timer touches. */
function startPlayer(){
  Q=queue(); if(!Q.length) return;

function playerShell(){

function paintRails(){
  const r=$('#p-rails'); if(!r) return;
  r.innerHTML=Q.map((_,i)=>`<i style="flex:1;height:3px;border-radius:2px;background:${
    i<qi?(st.in?'var(--sand)':'#9fb098'):i===qi?'#fff':'rgba(255,255,255,.2)'}"></i>`).join('');

function clockText(){ const l=Math.max(0,Math.round(left));

function showStep(){
  if(qi>=Q.length) return endPlayer(true);
  const s=Q[qi], n=Q[qi+1], resting=phase==='rest';
  tTotal=left=resting?rest(s.it):work(s.it);

      ${s.it.url?`<div style="border-radius:26px;overflow:hidden;background:#000;flex:none">

          style="display:block;width:100%;aspect-ratio:4/3;object-fit:cover"></video></div>`
        :`<div style="aspect-ratio:4/3;border-radius:26px;background:rgba(255,255,255,.08);

/* wall-clock delta, so a backgrounded tab does not silently lose seconds */
function step(){
  if(paused){ lastT=Date.now(); return; }
  const now=Date.now(); left-=(now-lastT)/1000; lastT=now;
  const c=$('#p-clock'); if(c) c.textContent=clockText();
  if(left>0) return;
  clearInterval(tick_); tick_=null; beep();
  advance();
}
function advance(){
  if(phase==='work'){
    const s=Q[qi];
    st.tick[key(st.day,s.gi,s.ii)]=true; save();
    if(qi<Q.length-1){ phase='rest'; showStep(); return; }
  }
  phase='work'; qi++;
  if(qi>=Q.length){ endPlayer(true); return; }
  showStep();
}
function skip(){ clearInterval(tick_); tick_=null; advance(); }
function endPlayer(done){ clearInterval(tick_); tick_=null;
  document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}});
  $('#player').classList.remove('on'); $('#player').innerHTML='';
  const d=day();
  reportProgress({session:{day:st.day, name:(d&&d.label)||'', done:!!done,
    drills:Q.length, mins:Math.round(Q.reduce((a,x)=>a+work(x.it)+rest(x.it),0)/60)}});
  save(); if(done){ st.ovSummary=true; openOv('summary'); } else render(); }
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
  o.frequency.value=660;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.2,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);
  o.start();o.stop(a.currentTime+.31);}catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&tick_){ paused=true;
  document.querySelectorAll('#player video').forEach(v=>{try{v.pause()}catch(e){}}); paintPause(); }});

/* ── video block ───────────────────────────────────────────────────
   Native controls put a black bar over the clip and a three-dot menu
   offering Download on paid footage. This is the same loop with our own
   chrome: tap to play/pause, a scrub line, and a sound toggle. */
const VB_SPK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const VB_MUTED='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
function vidBlock(url, ratio){
  return `<div class="vb" data-vb style="position:relative;border-radius:22px;overflow:hidden;
    background:#000;margin-bottom:18px;cursor:pointer">
    <video src="${url}#t=0.6" muted loop playsinline preload="metadata" autoplay
      style="display:block;width:100%;aspect-ratio:${ratio||'4/3'};object-fit:cover"></video>
    <div data-vb-play style="position:absolute;inset:0;display:grid;place-items:center;
      background:rgba(0,0,0,.18);opacity:0;transition:opacity .18s;pointer-events:none">
      <span style="width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.92);
        display:grid;place-items:center;font-size:19px;color:#1c2019">&#9654;</span></div>
    <div style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;
      padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.55))">
      <div data-vb-track style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)">
        <div data-vb-fill style="height:100%;width:0;border-radius:2px;background:#fff"></div></div>
      <button data-vb-sound aria-label="Unmute" style="flex:none;width:30px;height:30px;border:none;
        border-radius:50%;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;
        display:grid;place-items:center;padding:0">${VB_MUTED}</button>
    </div></div>`;
}
document.addEventListener('click',function(e){
  const box=e.target.closest('[data-vb]'); if(!box) return;
  const v=box.querySelector('video'); if(!v) return;
  const sound=e.target.closest('[data-vb-sound]');
  if(sound){
    v.muted=!v.muted;
    sound.innerHTML = v.muted ? VB_MUTED : VB_SPK;
    sound.setAttribute('aria-label', v.muted?'Unmute':'Mute');
    if(!v.muted && v.paused) v.play().catch(()=>{});
    return;
  }
  const track=e.target.closest('[data-vb-track]');
  if(track && v.duration){
    const r=track.getBoundingClientRect();
    v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v.duration;
    return;
  }
  if(v.paused) v.play().catch(()=>{}); else v.pause();
},true);
/* one loop keeps every visible scrub line in sync — cheaper than a
   timeupdate listener per clip, and it stops when nothing is on screen */
(function vbLoop(){
  document.querySelectorAll('[data-vb]').forEach(function(box){
    const v=box.querySelector('video'); if(!v) return;
    const f=box.querySelector('[data-vb-fill]');
    if(f && v.duration) f.style.width=((v.currentTime/v.duration)*100).toFixed(1)+'%';
    const pl=box.querySelector('[data-vb-play]');
    if(pl) pl.style.opacity = v.paused ? '1' : '0';
  });
  requestAnimationFrame(vbLoop);
})();

    body=`${it.url?vidBlock(it.url)

/* ── sign in: passwordless email code ─────────────────────────
   Elliott sends a client their email; they get a 6-digit code back.
   No passwords to reset, no accounts to create — the same mechanism
   lha-worker.js already runs for the masterclass. */
function screenSignIn(){
  return `<div style="min-height:100dvh;background:linear-gradient(180deg,var(--forest),var(--ink));
    padding:calc(env(safe-area-inset-top) + 40px) 26px 30px;color:var(--bg);display:flex;flex-direction:column">
    <div class="kick">LONDON HANDSTAND ACADEMY</div>
    <div class="h-xl" style="font-size:44px;margin-top:auto">Your programme</div>
    <div style="font:400 15px/1.55 var(--sans);color:var(--sage);margin-top:14px">
      Sign in with the email and password Elliott sent you.</div>
    <form onsubmit="doLogin(event)" style="margin-top:26px;display:flex;flex-direction:column;gap:10px">
      <input id="emailIn" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com"
        value="${esc(st.email||'')}"
        style="background:rgba(255,255,255,.08);border:none;border-radius:18px;padding:18px;
        font:400 15px/1 var(--sans);color:var(--bg);outline:none">
      <div style="position:relative;display:flex">
        <input id="pwIn" type="password" autocomplete="current-password" placeholder="Password"
          style="flex:1;background:rgba(255,255,255,.08);border:none;border-radius:18px;
          padding:18px 54px 18px 18px;font:400 15px/1 var(--sans);color:var(--bg);outline:none">
        <button type="button" id="pwEye" onclick="togglePw()" aria-label="Show password"
          aria-pressed="false"
          style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;
          display:flex;align-items:center;justify-content:center;background:none;border:none;
          border-radius:14px;cursor:pointer;color:var(--sage);padding:0">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="2.8"></circle>
            <line id="pwEyeSlash" x1="4" y1="20" x2="20" y2="4" style="display:none"></line>
          </svg>
        </button>
      </div>
      <button class="btn" style="background:var(--bg);color:var(--ink)" type="submit">Sign in</button>
      <div id="authMsg" style="font:500 12.5px/1.5 var(--sans);color:var(--sand);text-align:center;min-height:18px"></div>
    </form>
    <div style="font:400 12.5px/1.6 var(--sans);color:#7d8b74;margin-top:20px;text-align:center">
      Lost it? Message Elliott and he'll send you a new one.</div></div>`;
}
/* let people read what they typed — most sign-in failures here are just a
   fat-fingered password on a phone keyboard */
function togglePw(){
  const i=$('#pwIn'), b=$('#pwEye'), sl=$('#pwEyeSlash');
  if(!i) return;
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  if(sl) sl.style.display = show ? '' : 'none';
  if(b){ b.setAttribute('aria-pressed', show ? 'true' : 'false');
         b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); }
  i.focus();
  // keep the caret at the end rather than jumping to the start on type-swap
  try { const n=i.value.length; i.setSelectionRange(n,n); } catch(e){}
}

function doLogin(ev){
  if(ev) ev.preventDefault();
  const email=(($('#emailIn')||{}).value||'').trim().toLowerCase();
  const password=($('#pwIn')||{}).value||'';
  const msg=$('#authMsg');
  if(!email||!password){ if(msg) msg.textContent='Both fields, please.'; return; }
  if(msg) msg.textContent='Checking…';
  fetch(AUTH.login,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password})})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{
      /* a coach signing in here wants the coach view, not a client screen */
      if(d.coach){ location.href='/lha-coach.html'; return; }
      st.email=email; st.token=d.token; st.client=d.client; st.in=true;
      save(); render(); loadProgramme(); loadThread(); })
    .catch(code=>{ const m=$('#authMsg');
      if(m) m.textContent = code===429 ? 'Too many tries. Wait a few minutes.'
                                       : 'That email and password did not match.'; });
}
function requestCode(){
  const v=($('#emailIn')||{}).value||'';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ $('#authMsg').textContent='That does not look like an email address.'; return; }
  st.email=v.trim().toLowerCase();
  $('#authMsg').textContent='Sending…';
  fetch(AUTH.request,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:st.email})})
    .then(r=>{ if(!r.ok) throw 0; st.codeSent=true; save(); render(); })
    .catch(()=>{ /* routes not deployed yet — let the flow be walked anyway */
      st.codeSent=true; save(); render();
      const m=$('#authMsg'); if(m) m.textContent='Dev mode: the code is '+DEV_CODE; });
}
function verifyCode(){
  const c=(($('#codeIn')||{}).value||'').trim();
  if(c.length<4){ $('#authMsg').textContent='Enter the six digits from the email.'; return; }
  $('#authMsg').textContent='Checking…';
  fetch(AUTH.verify,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:st.email,code:c})})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{ st.token=d.token; st.client=d.client||nameFrom(st.email); st.in=true;
               save(); render(); loadProgramme(); loadThread(); })
    .catch(()=>{
      if(c===DEV_CODE){ st.in=true; st.client=nameFrom(st.email); save(); render(); return; }
      const m=$('#authMsg'); if(m) m.textContent='That code did not work. Check it, or send a new one.';
    });
}
const nameFrom=e=>{const n=(e||'').split('@')[0].split(/[._-]/)[0]; return n.charAt(0).toUpperCase()+n.slice(1);};

/* ── programme delivery ────────────────────────────────────────────
   The plan used to be baked into this file, so every client saw the
   same one. It now comes from the server, chosen by the token, and is
   cached so the app still opens on a gym floor with no signal. */
function libraryDrills(){
  /* prefer the full library; fall back to whatever the plan contains
     so the screen is never empty on a cold first load */
  if (LIBRARY && LIBRARY.length) return LIBRARY;
  const out=[];
  DATA.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{
    if(!out.some(x=>x.v===it.v)) out.push(it); })));
  return out;
}
function libToArray(lib){
  if(!lib || !lib.names) return [];
  return Object.keys(lib.names).map(v=>({
    v:v, n:lib.names[v]||v, url:(lib.video||{})[v]||'', d:'', nt:'',
    cues:(lib.cues||{})[v]||[], desc:(lib.desc||{})[v]||''
  }));
}
function applyProgramme(d){
  if(d && d.plan && d.plan.days && d.plan.days.length) DATA = d.plan;
  const arr = libToArray(d && d.library);
  if(arr.length) LIBRARY = arr;
  if(st.day >= DATA.days.length) st.day = 0;
}
function cacheProgramme(d){
  try { localStorage.setItem('lha_plan', JSON.stringify(
    {at:Date.now(), email:st.email, plan:d.plan, library:d.library})); } catch(e){}
}
function loadCachedProgramme(){
  try {
    const c = JSON.parse(localStorage.getItem('lha_plan')||'null');
    /* a cached plan belongs to one address — never show it to someone else */
    if(c && c.email === st.email) { applyProgramme(c); return true; }
  } catch(e){}
  return false;
}
function loadProgramme(){
  if(!st.token) return Promise.resolve(false);
  return fetch(AUTH.programme,{headers:authed()})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{ applyProgramme(d); cacheProgramme(d);
               if(d.client) st.client=d.client;
               save(); render(); return true; })
    .catch(code=>{
      /* an expired token is the one failure worth acting on */
      if(code===401){ signOut(); return false; }
      loadCachedProgramme(); render(); return false;
    });
}

function savePassword(ev){
  if(ev) ev.preventDefault();
  const cur=($('#pwCur')||{}).value||'', next=($('#pwNew')||{}).value||'';
  const msg=$('#pwMsg');
  if(!cur||!next){ if(msg) msg.textContent='Fill in both boxes.'; return; }
  if(next.length<8){ if(msg) msg.textContent='At least 8 characters, please.'; return; }
  if(msg) msg.textContent='Saving…';
  fetch(AUTH.password,{method:'POST',headers:authed(),
    body:JSON.stringify({current:cur,next:next})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'That did not work')))
    .then(()=>{ const m=$('#pwMsg');
      if(m){ m.style.color='var(--forest)'; m.textContent='Saved. Use the new one next time.'; }
      const a=$('#pwCur'), b=$('#pwNew'); if(a) a.value=''; if(b) b.value='';
    })
    .catch(e=>{ const m=$('#pwMsg'); if(m) m.textContent=String(e); });
}


/* ── what gets reported back ───────────────────────────────────────
   Ticks, ratings and hold times already lived in this browser and went
   nowhere. Elliott can only coach what he can see, so a summary goes to
   the server. Nothing here is sent for a free-tier user — no token, no
   report. */
let progQueued=null;
function reportProgress(extra){
  if(!st.in || !st.token) return Promise.resolve();
  const flags={};
  Object.keys(st.rate||{}).forEach(function(v){
    if(st.rate[v]==='easy'||st.rate[v]==='hard')
      flags[v]={rate:st.rate[v], note:(st.note||{})[v]||''};
  });
  const payload=Object.assign({flags:flags, hold:st.bestHold||0}, extra||{});
  return fetch(AUTH.progress,{method:'POST',headers:authed(),body:JSON.stringify(payload)})
    .catch(function(){});   /* never let reporting break the session */
}
/* one call a minute at most — this is a summary, not a telemetry feed */
function reportSoon(extra){
  if(progQueued) clearTimeout(progQueued);
  progQueued=setTimeout(function(){ progQueued=null; reportProgress(extra); }, 1500);
}

function signOut(){
  /* clearing the token alone left the old tab on screen, so signing out
     looked like nothing had happened. Drop right back to the free app. */
  if(typeof tick_!=='undefined' && tick_){ clearInterval(tick_); tick_=null; }
  if(typeof stopHold==='function') stopHold();
  /* this is usually tapped from inside the account overlay, which sits over
     everything — leave it open and signing out looks like a dead button */
  st.ov=null;
  const ov=$('#ov'); if(ov){ ov.classList.remove('on'); ov.innerHTML=''; }
  document.querySelectorAll('video').forEach(v=>{try{v.pause()}catch(e){}});
  st.in=false; st.codeSent=false; st.token=null;
  st.client=null; st.msgs=null;      // nobody else's name or thread left behind
  try{ localStorage.removeItem('lha_plan'); }catch(e){}
  st.mode='free';                    // skip the welcome gate on the way out
  st.tab='ladder';                   // a screen they can actually use
  save(); render();
  window.scrollTo(0,0);
}

/* ── flags, tests, and anything else that reaches Elliott ── */
const FORM='https://formspree.io/f/xvzjawjv';
function post(payload){
  return fetch(FORM,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(Object.assign({client:st.client||'',email:st.email||''},payload))}).catch(()=>{});
}
function tick(k){ st.tick[k]=!st.tick[k]; save(); render(); }
/* 'Good' was doing nothing useful — it is the default state, and it made
   every drill row carry three buttons. Only the two exceptions are worth
   a tap. Clear any that were already saved. */
Object.keys(st.rate||{}).forEach(function(k){ if(st.rate[k]==='good') delete st.rate[k]; });
function rate(v,r){ st.rate[v]=st.rate[v]===r?'':r; if(st.rate[v]!=='easy'&&st.rate[v]!=='hard') delete st.note[v]; save(); reportSoon(); render(); }
function sendFlags(){
  const f=Object.keys(st.rate).filter(v=>st.rate[v]==='easy'||st.rate[v]==='hard');
  if(!f.length) return;
  const names={}; DATA.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(i=>names[i.v]=i.n)));
  post({type:'Drill flags',flags:f.map(v=>st.rate[v].toUpperCase()+' — '+(names[v]||v)+(st.note[v]?' ("'+st.note[v]+'")':'')).join('\n')});
  st.flagSent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}); save(); render();
}
function sendTest(){
  const vals=st.testDraft||{};
  const lines=DATA.test.items.map(t=>t.n+': '+(vals[t.id]||'not done')+' '+t.u).join('\n');
  post({type:'Two-week test',results:lines});
  st.tests=(st.tests||[]).concat([vals]); st.testDraft={}; save();
  reportProgress({test:vals}); closeOv();
}


/* ══════════════════════════════════════════════════════════════
   FREE TIER — the Handstand Ladder
   Same shell, same player. A coaching code swaps the tabs and
