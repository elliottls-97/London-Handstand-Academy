let LIBRARY=[{"v": "wrist-circles-mob", "n": "Wrist Circles", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wrist-mobility.mp4", "d": "", "nt": "", "cues": ["Spread fingers wide.", "Keep pressure light at first.", "Move slowly through the full circle.", "Match both directions evenly."], "desc": "Gently warm and lubricate the wrists through their full range of motion before loading."}, {"v": "wrist-flexion-ext", "n": "Wrist Flexion and Extension", "url": "", "d": "", "nt": "", "cues": ["Use the other hand to assist gently.", "Hold briefly at end range.", "Never force into pain.", "Breathe steadily."], "desc": "Build active range through the wrist joint in both directions to reduce injury risk."}, {"v": "wrist-weight-shift", "n": "Wrist Weight Shifting", "url": "", "d": "", "nt": "", "cues": ["On all fours, fingers facing forward.", "Shift weight slowly side to side.", "Then front to back.", "Increase pressure gradually."], "desc": "Progressively load the wrists on all fours with gentle shifts to build tolerance for handstand work."}, {"v": "upward-dog-to-plank", "n": "Upward Dog to Plank", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/upward-facing-dog-lowers.mp4", "d": "", "nt": "", "cues": ["Biceps rotate forward in upward dog.", "Keep arms straight throughout.", "Look forward in the dog position.", "Flow between positions smoothly."], "desc": "Start in upward facing dog with feet pointed, biceps turned forward looking forward. Keeping arms straight push up into plank."}, {"v": "wall-front-side-opener", "n": "Wall Front Side Opener", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wall-front-side-opener.mp4", "d": "", "nt": "", "cues": ["Face the wall a soft arms length away.", "Place palms high on the wall.", "Sink the chest forward and down.", "Hold for the full 30 seconds."], "desc": "Start facing the wall a soft arms distance away. Palms on wall above you, sink chest towards and down the wall."}, {"v": "dolphin-lean-forwards", "n": "Dolphin Lean Forwards", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/dolphin-lean-forwards.mp4", "d": "", "nt": "", "cues": ["Keep forearms parallel on the floor.", "Shift forward with control.", "Touch nose gently to the floor.", "Push back actively through the shoulders."], "desc": "Start in Dolphin pose with legs bent while arms are as parallel as possible. Shift forwards to touch your nose to the floor between the hands. Push back."}, {"v": "floor-lateral-stretch", "n": "Floor Lateral Stretch", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/floor-lateral-stretch.mp4", "d": "", "nt": "", "cues": ["Get on your knees.", "Place back of palms and forearms on the floor in parallel.", "Pull the body back.", "Focus on stretching the lats."], "desc": "Get on your knees, place the back of your palms and forearms on the floor in parallel, then pull the body back focusing on stretching the lats."}, {"v": "heart-melting-pose", "n": "Heart Melting Pose", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/heart-melting-pose.mp4", "d": "", "nt": "", "cues": ["Get on your knees.", "Place back of palms and forearms on the floor.", "Pull body back actively.", "Feel the stretch through the entire shoulder girdle."], "desc": "Get on your knees, place the back of your palms and forearms on the floor in parallel, pull the body back focusing on stretching the lats."}, {"v": "downward-dog-elbow-lowers", "n": "Downward Dog Elbow Lowers", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/downward-dog-elbow-lowers.mp4", "d": "", "nt": "", "cues": ["Start in Downward Facing Dog.", "Lower elbows toward the floor.", "Keep elbows tucked in throughout.", "Hold 5 seconds at the bottom."], "desc": "Start in Downward Facing Dog, lower the elbows towards the floor. Keep elbows tucked in throughout. Hold for 5 seconds at the bottom of each one."}, {"v": "wall-shoulder-opener", "n": "Wall Shoulder Opener", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wall-shoulder-opener.mp4", "d": "", "nt": "", "cues": ["Place hands on wall at chest level.", "Lower body to horizontal.", "Look at the floor.", "Try hollowing the body out and keeping it straight."], "desc": "Place hands on the wall at chest level. Lower the body to horizontal, look at the floor. Try both hollowing out the body and keeping it straight."}, {"v": "downward-dog-pulses", "n": "Downward Dog Pulses", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/downward-dog-pulses.mp4", "d": "", "nt": "", "cues": ["Start in Downward Facing Dog.", "Look back between your legs.", "Bend the knees slightly.", "Pulse the chest toward the back of the room."], "desc": "Start in downward facing dog, look back, bend the knees. Pulse the chest towards the back of the room."}, {"v": "chaturganga-push-ups", "n": "Chaturanga Push Ups", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/Chaturangua-push-ups.mp4", "d": "", "nt": "", "cues": ["Start in Downward Dog.", "Walk hands forward into plank.", "Walk them back and repeat.", "Raise legs on a box to progress."], "desc": "Start in Downward Dog, walk your hands forward into a plank pose, walk them back and repeat. To make it harder raise your legs up on a box or bench."}, {"v": "crow-pose", "n": "Crow Pose", "url": "", "d": "", "nt": "", "cues": ["Place knees on your elbows.", "Use blocks or a pillow in front for your head.", "Lean forward and down gently.", "Lift one or both feet and hold."], "desc": "Place knees on elbows. Place head on blocks or a pillow in a triangle between your hands. Lean forward and down, set head on the blocks. Lift one or both feet off the floor and hold."}, {"v": "kick-up-bounces", "n": "Kick Up Bounces", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/kick-up-bounces.mp4", "d": "", "nt": "", "cues": ["Fingers close to the wall.", "Right leg up, straight and engaged.", "Look between hands, shoulders over hips.", "Bounce quickly keeping all engagement points."], "desc": "Start with fingers close to the wall. Right leg up in the air, straight and engaged. Look between hands, shoulders stacked over hips. Bounce on the left foot in quick succession."}, {"v": "wall-kick-ups", "n": "Wall Kick Ups", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wall-kick-ups.mp4", "d": "", "nt": "", "cues": ["Stack shoulders above hands.", "Stack hips above shoulders.", "Jump up, throw hips toward the wall.", "Claw through the hands to exit."], "desc": "Stack shoulders above hands, hips above shoulders. Jump up and throw your hips towards the wall. Claw through the hands to come off the wall."}, {"v": "wall-kick-ups-progressions", "n": "Wall Kick Ups Progressions", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wall-kick-ups-additional-cues.mp4", "d": "", "nt": "", "cues": ["Foam block between hip and floor leg prevents back arch.", "Block behind one hand keeps shoulders stacked over hands.", "Use a chair close to wall to reduce jump height.", "Progress each aid as you get stronger."], "desc": "Use a foam block tucked between the hip and the floor leg to prevent back arching. A block behind one hand keeps shoulders stacked. A chair near the wall reduces the height to jump."}, {"v": "wrist-circles-prep", "n": "Wrist Circles and Prep", "url": "", "d": "", "nt": "", "cues": ["Spread the fingers evenly.", "Keep pressure light at first.", "Move through full wrist circles.", "Match both sides with control."], "desc": "Prepare the wrists with controlled circles and gentle loading before going upside down."}, {"v": "shoulder-cars", "n": "Shoulder CARs", "url": "", "d": "", "nt": "", "cues": ["Stay tall through the ribs.", "Move slowly through the full arc.", "Keep the rest of the body quiet.", "Control both directions evenly."], "desc": "Take the shoulders through active full-range circles to warm the joint and improve awareness."}, {"v": "sprinter-warm-up", "n": "Sprinter Warm-Up", "url": "", "d": "", "nt": "", "cues": ["Push the floor away.", "Keep the front foot grounded.", "Switch sides smoothly.", "Breathe steadily throughout."], "desc": "Prime the hips, ankles and lower body with dynamic sprinter-position switching."}, {"v": "chest-to-wall-bailouts", "n": "Chest-to-Wall Bailouts", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chest-to-wall-bailouts.mp4", "d": "", "nt": "", "cues": ["Look between the hands.", "Step one hand slightly forward to twist out.", "Keep the exit soft and controlled.", "Practice both sides."], "desc": "Learn to exit safely from the wall with control so handstand practice feels confident and repeatable."}, {"v": "wall-walks", "n": "Wall Walks", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wall-walks.mp4", "d": "", "nt": "", "cues": ["Walk the feet up smoothly.", "Push tall through the shoulders.", "Keep the core lightly braced.", "Come down with control."], "desc": "Build confidence upside down while opening the shoulders and learning stacked alignment."}, {"v": "chest-to-wall-handstand", "n": "Chest-to-Wall Handstand", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chest-to-wall.mp4", "d": "", "nt": "", "cues": ["Squeeze legs together.", "Reach tall through the toes.", "Push the floor away constantly.", "Keep ribs gently in."], "desc": "Own a straight wall-supported handstand with strong shoulder push and midline control."}, {"v": "scapula-shrugs", "n": "Scapula Shrugs", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/scapula-shrugs.mp4", "d": "", "nt": "", "cues": ["Keep elbows straight.", "Move only through the shoulders.", "Push tall at the top.", "Lower with control."], "desc": "Strengthen upward rotation and elevation through the scapula for a more stable overhead shape."}, {"v": "one-leg-scapula-extensions", "n": "1-Leg Scapula Extensions", "url": "", "d": "", "nt": "", "cues": ["Keep hips level.", "Push evenly through both hands.", "Move slowly through each rep.", "Stay long through the standing leg."], "desc": "Challenge scapular control with asymmetry to build strength that transfers to balancing."}, {"v": "pike-press-ups", "n": "Pike Press-Ups", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/pike-press-ups.mp4", "d": "", "nt": "", "cues": ["Shift weight into the hands.", "Lower the head forward slightly.", "Press the floor away.", "Keep reps smooth and strong."], "desc": "Develop pressing strength and overhead pushing mechanics in a scalable shape."}, {"v": "single-leg-tuck-slides", "n": "Single Leg Tuck Slides", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/single-leg-tuck-slides.mp4", "d": "", "nt": "", "cues": ["Chest to wall, hands about 1.5 feet from the wall, feet pointed.", "One foot stays on the wall.", "Take the other knee down towards your chest."], "desc": "Chest to wall, hands 1.5 feet from the wall. One foot stays on the wall, take the other knee down towards your chest."}, {"v": "lateral-slide-outs", "n": "Lateral Slide Outs", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/lateral-leg-slide-outs.mp4", "d": "", "nt": "", "cues": ["Shift slowly into the hand.", "Stay active through the shoulders.", "Keep legs long.", "Come back with control."], "desc": "Train side-to-side corrections and stronger fingertip awareness during balance changes."}, {"v": "tuck-slides", "n": "Tuck Slides", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/tuck-slides.mp4", "d": "", "nt": "", "cues": ["Same start, hands about 1.5 feet from the wall.", "Knees together, lower them both down.", "Don't worry about the rest of the body at first — it's about the movement."], "desc": "Same start, but both knees come down together. The harder version."}, {"v": "knees-on-box", "n": "Knees on Box", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/knees-on-box.mp4", "d": "", "nt": "", "cues": ["Box about hip height, knees near the edge.", "Hands right to the edge of the box.", "Push into the ground, look between the hands."], "desc": "Use the box to build overhead loading tolerance and a cleaner stacked shape."}, {"v": "knees-on-box-single-leg-lifts", "n": "Knees on Box - Single Leg Lifts", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/knees-on-box-leg-lifts.mp4", "d": "", "nt": "", "cues": ["Lift only as high as you can control.", "Keep hips square.", "Push tall continuously.", "Alternate smoothly."], "desc": "Add small leg lifts to challenge balance while keeping strong support through the shoulders."}, {"v": "knees-on-box-knee-lift-offs", "n": "Knees on Box - Knee Lift-Offs", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/knees-on-box-leg-lifts.mp4", "d": "", "nt": "", "cues": ["Lean forward gradually.", "Stay active in the fingertips.", "Lift for a brief clean moment.", "Reset before the next rep."], "desc": "Progress toward full support by briefly unweighting the box with both knees."}, {"v": "single-leg-take-off", "n": "Single Leg Take Off", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/single-leg-take-offs.mp4", "d": "", "nt": "", "cues": ["Hands about 1.5 feet from the wall.", "Take one leg off the wall.", "Float the second leg just off and hold 1-2 seconds.", "Place back on the wall before you over-balance."], "desc": "With hands about 1.5 feet from the wall, take one leg off, then the other just slightly off, hold 1-2 seconds, then place back. Go too far and you fall out."}, {"v": "single-leg-wall-removals", "n": "Single Leg Wall Removals", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/single-leg-wall-switches.mp4", "d": "", "nt": "", "cues": ["Move from the hip slowly.", "Stay long through both legs.", "Use the fingertips to steer.", "Return to the wall with control."], "desc": "Take one leg away from the wall to build balance confidence and ownership of your line."}, {"v": "slide-away", "n": "Slide Away", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/slide-downs.mp4", "d": "", "nt": "", "cues": ["Lean the shoulders forward.", "Push back actively through the arms.", "Let the feet slide back up the wall.", "Keep the movement smooth and controlled."], "desc": "Lean the shoulders forward and push back, letting the feet slide back up the wall. This version is about grooving the shoulder movement — the feet stay on the wall throughout."}, {"v": "slide-away-2", "n": "Slide Away — Off the Wall", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/slide-downs.mp4", "d": "", "nt": "", "cues": ["Stay aligned and hollow throughout.", "Move the shoulders off with control.", "Let the feet leave the wall as the shoulders move.", "Find a brief balance, then return."], "desc": "The progression: keep the body aligned and hollow as you move. Now the aim is for the feet to come off the wall as the shoulders move off — finding a brief moment of balance before returning."}, {"v": "single-leg-tuck-take-offs", "n": "Single Leg Tuck Take-Offs", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/single-leg-take-offs.mp4", "d": "", "nt": "", "cues": ["Walk up the wall, one leg in the air, toes pointed.", "Slide the second leg down to tuck.", "Lean and look slightly forward as you pull the foot in.", "Hold a moment, then place it back."], "desc": "Walk up the wall with one leg in the air, slide the second leg down into a tuck. Lean and look slightly forward as you pull the second foot in. Hold, then replace. The gap can grow over time."}, {"v": "tuck-take-offs", "n": "Tuck Take-Offs", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/tuck-take-offs.mp4", "d": "", "nt": "", "cues": ["Slide into a tuck against the wall.", "Keep knees tucked tightly, touching.", "Look forward and lean forward.", "Bring the knees off the wall with control."], "desc": "Slide into tuck against the wall, knees tucked tightly together. Look forward and lean forward to bring your knees off the wall."}, {"v": "straddle-to-straight", "n": "Straddle to Straight", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shape-changes-straddle-to-straight.mp4", "d": "", "nt": "", "cues": ["Kick up, option against the wall first.", "Lightly touch, then come away.", "Move freestanding once you get a couple of reps.", "Keep the straddle moderate, not excessive."], "desc": "Kick up into handstand (option against the wall), taking the body away from the wall. Lightly touch at first, then not at all. Keep the straddle moderate so it does not throw your balance."}, {"v": "straight-to-tuck-back", "n": "Straight to Tuck & Back", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/tuck-extensions.mp4", "d": "", "nt": "", "cues": ["Kick up with knees together.", "Use hip flexors to pull knees down.", "Keep pushing tall through the shoulders.", "Gradually increase the depth of the tuck."], "desc": "Once kicked up with knees together, actively use the hip flexors to pull the knees down towards you, then back. This needs anterior deltoid and scapular elevation strength to stay up."}, {"v": "straddle-to-diamond", "n": "Straddle to Diamond", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shape-changes-straddle-to-diamond.mp4", "d": "", "nt": "", "cues": ["Start in straddle handstand.", "Bring toes together into a diamond.", "Externally rotate the hips to keep it neat.", "Point the toes; option to tuck after."], "desc": "From a straddle handstand, bring the toes together into a diamond, externally rotating the hips to keep it neat. Option to come into tuck after."}, {"v": "straight-entries", "n": "Straight Entries", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/straight-entries.mp4", "d": "", "nt": "", "cues": ["Right leg up, straight and pointed.", "Shoulders stacked over hands, hips high.", "Bounce the lower leg to kick up.", "Bring the legs together, hold 1 second."], "desc": "Start with the right leg in the air, straight with pointed foot, shoulders stacked over hands and hips high. Bounce on the lower leg to kick up, bringing the left leg to meet the right. Hold a second before coming down."}, {"v": "straddle-entries", "n": "Straddle Entries", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/straddle-entries.mp4", "d": "", "nt": "", "cues": ["Shoulders over hands, hips high.", "Start in a forward fold, legs bent.", "Open legs to the side, circle to centre.", "Keep looking down; elevate the scapula to push up."], "desc": "Shoulders stacked over hands, hips high in a forward fold with bent legs. Open the legs out to the side and circle them to centre, keeping the gaze down and elevating the scapula to push up into position."}, {"v": "tuck-entries", "n": "Tuck Entries", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/tuck-entries.mp4", "d": "", "nt": "", "cues": ["Stack the shoulders over the hands.", "Keep knees together throughout.", "Jump up to a tuck handstand.", "Extend the legs and push the pelvis through to straight."], "desc": "Once the shoulders are stacked, keep the knees together and jump up to a tuck handstand. Extend the legs and push the pelvis through to bring the body into a straight line."}, {"v": "p-pike-pushups", "n": "Pike Push Ups", "url": "", "d": "", "nt": "", "cues": ["Feet a little wider than hips, knees bent, hips high.", "Look forward to a point between the hands.", "Lower the forehead to that point, elbows tucked.", "Push back up keeping the diagonal line."], "desc": "Front deltoid strength — the fix if you end up collapsing in the take-off. Build the pressing strength the take-off demands."}, {"v": "p-pike-pushup-negs", "n": "Pike Push Up Negatives", "url": "", "d": "", "nt": "", "cues": ["Lower under control.", "Keep the shoulders elevated throughout."], "desc": "A progression on the pike push up — load the lowering phase to build pressing strength."}, {"v": "p-pike-pushups-knees", "n": "Pike Push Ups on Knees", "url": "", "d": "", "nt": "", "cues": ["Same shape, less load.", "Build to the full pike push up."], "desc": "A regression — the same pressing pattern made more accessible. Build the strength from your knees first."}, {"v": "p-l-handstand", "n": "L-Shaped Handstand", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chair-assisted-handstand.mp4", "d": "", "nt": "", "cues": ["Stack the hips over the shoulders.", "Push tall through the shoulders."], "desc": "Helps you learn to get the hips stacked over the shoulders — the position the take-off has to find."}, {"v": "p-tuck-handstand", "n": "Tuck Handstand", "url": "", "d": "", "nt": "", "cues": ["Engage the hip flexors to pull the knees down.", "Let the lower back draw the hips into anterior pelvic tilt.", "Push tall — actively elevate the scapula.", "Avoid posterior tilt — it becomes a tuck planche."], "desc": "HERO DRILL. The scapula needs to be elevated to properly take off, and the tuck handstand is the best teacher — it shows you how to move the hips and elevate the scapula at the same time. The lower centre of mass makes balancing easier but you feel it far more in the shoulders."}, {"v": "p-tuck-slides", "n": "Tuck Handstand Slides", "url": "", "d": "", "nt": "", "cues": ["Same start, hands 1.5 feet from the wall.", "Knees together, lower them down.", "The harder version — both legs at once."], "desc": "Movement patterning for the take-off — learn to get the hips stacked over the shoulders."}, {"v": "p-single-leg-tuck-slides", "n": "Single Leg Tuck Slides", "url": "", "d": "", "nt": "", "cues": ["Chest to wall, hands about 1.5 feet from the wall, feet pointed.", "One foot stays on the wall.", "Take the other knee down towards your chest."], "desc": "A single-leg variation to build control and hip stacking one side at a time."}, {"v": "p-plank-slides", "n": "Plank Slides to Pike", "url": "", "d": "", "nt": "", "cues": ["Move as one connected chain.", "Control the slide both ways."], "desc": "Conditioning — builds the connected-chain strength the compression demands."}, {"v": "p-bench-zombies", "n": "Bench Zombies", "url": "", "d": "", "nt": "", "cues": ["Feet on the bench, toes pointed.", "Pull up until the hips stack over the shoulders.", "Keep the lower back engaged."], "desc": "Plank with your feet on a bench, toes pointed. Pull yourself up until the hips are stacked over the shoulders."}, {"v": "p-bench-zombies-lowers", "n": "Bench Zombies Lowers", "url": "", "d": "", "nt": "", "cues": ["Start on the edge of the bench.", "Step off and lower slowly to the floor."], "desc": "Start on the edge of the bench, step off and slowly lower down to the floor — adds the eccentric to build strength through the position."}, {"v": "p-pancake", "n": "Pancake Training", "url": "", "d": "", "nt": "", "cues": ["Reach long through the chest.", "Build active range, not just passive."], "desc": "Flexibility — builds the active compression range in the straddle that the press relies on."}, {"v": "p-dd-toe-taps", "n": "Downward Dog Toe Taps", "url": "", "d": "", "nt": "", "cues": ["Push the hips up and back.", "Keep the shoulders open."], "desc": "Trains compression and shoulder position while keeping the wrists happy."}, {"v": "p-pelvis-glute", "n": "Pelvis & Glute Engagement Drill", "url": "", "d": "", "nt": "", "cues": ["Find the hip position on the floor first.", "Take it to the wall."], "desc": "On the floor and at the wall — trains the hip positioning that keeps the unroll organised."}, {"v": "p-solo-press-circles", "n": "Solo Press Circles", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/press-circles-vertical.mp4", "d": "", "nt": "", "cues": ["Hold the handstand, open the legs.", "Start with small circles.", "Grow them as you get stronger.", "Both directions — speed doesn't matter."], "desc": "In a handstand, open the legs and make small circles. Grow the circles bigger over time, working towards the press position. Speed doesn't matter — work both directions."}, {"v": "p-back-to-wall", "n": "Back to Wall Press", "url": "", "d": "", "nt": "", "cues": ["Full upper back AND head on the wall.", "Focus on engaging the hip flexors.", "Keep the back rounded.", "If heavy on the wrists, turn the hands out to the side."], "desc": "HERO DRILL. Teaches the shape and compression with the wall taking some of the load. Make sure your full upper back as well as head is on the wall — this takes more of the weight so you can focus on engaging the hip flexors and keeping the back rounded."}, {"v": "p-chest-to-wall", "n": "Chest to Wall Press", "url": "", "d": "", "nt": "", "cues": ["Take-off into the line.", "Compress with the chain connected.", "Unroll with the shoulders opening first."], "desc": "THE ULTIMATE HERO. Trains all three stages — take-off, compression and unrolling — in a single movement. Your feet cannot go anywhere, so your shoulders cannot either: you either compress and unroll correctly, or the wall rejects you."}, {"v": "p-chest-to-wall-negs", "n": "Chest to Wall Negatives", "url": "", "d": "", "nt": "", "cues": ["Lower slowly and with control.", "Feel the path you will reverse on the way up."], "desc": "Lower under control from the wall handstand to break the ice and feel the descending path of the press."}, {"v": "shoulder-circles", "n": "Shoulder Circles", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shoulder-circles.mp4", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "shoulder-pulses", "n": "Shoulder Pulses", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shoulder-pulses.mp4", "d": "", "nt": "", "cues": [], "desc": "Small pulses through the shoulders to open them up before load."}, {"v": "plank-fingertip-lifts", "n": "Plank Fingertip Lifts", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/finger-tip-plank-raises.mp4", "d": "", "nt": "", "cues": [], "desc": "A plank, but up on the fingertips instead of flat palms."}, {"v": "chest-to-wall-toe-taps", "n": "Chest to Wall Toe Taps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chest-to-wall-floor-toe-taps-vertical.mp4", "d": "", "nt": "", "cues": ["Hands about 2 feet from the wall.", "One leg stays on the wall.", "Pull the other knee or toe towards the floor.", "Control it down, don't drop."], "desc": "Hands about 2 feet from the wall, one leg on the wall. Take the other leg off and pull the knee or toe down towards the floor."}, {"v": "press-eccentrics", "n": "Press Eccentrics", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/press-eccentrics-vertical.mp4", "d": "", "nt": "", "cues": ["Start in the handstand.", "Lower slowly through the compression.", "Same path you'll press back up."], "desc": "The press in reverse. From the handstand, lower under control through the compressed position instead of pushing up out of it."}, {"v": "press-walks", "n": "Press Walks", "url": "", "d": "", "nt": "", "cues": ["Baby hop the feet forward.", "Press the hips up and back as you lean forward.", "Up and down the mat."], "desc": "Baby hop the feet forward, then press the hips up and back as you lean forward. Walk up and down the mat."}, {"v": "block-reaches", "n": "Block Reaches", "url": "", "d": "", "nt": "", "cues": ["Seated forward fold, block in the hands.", "Reach forward over the feet.", "Engage through the quads.", "Active, not a passive hang."], "desc": "Sit in a forward fold holding a block. Reach forward over the feet, engaging through the quads. An active forward fold, not a passive one."}, {"v": "lolasana-lifts", "n": "Lolasana Lifts", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/lolasona-lifts.mp4", "d": "", "nt": "", "cues": [], "desc": "Straight arms, knees tucked, lift and hold."}, {"v": "freestanding-hold", "n": "Freestanding Hold", "url": "", "d": "", "nt": "", "cues": ["Kick up, find it, hold it.", "Stop the set the moment the shape goes.", "Quality over seconds — this isn't a max attempt."], "desc": "A clean hold, not a maximum. Up to 15 seconds, stopping as soon as the line goes."}, {"v": "max-hold-test", "n": "Max Hold Test", "url": "", "d": "", "nt": "", "cues": ["Three attempts, best of three.", "Warm up properly first.", "Film one if you can."], "desc": "The tracked number. Three attempts, log the best."}, {"v": "dd-wrist-taps", "n": "Downward Dog Wrist Taps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/downward-facing-dog-wrist-taps.mp4", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "chair-assisted-knee-lifts", "n": "Chair-Assisted Knee Lifts", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chair-assisted-knee-lifts-vertical.mp4", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "chair-assisted-step-ups", "n": "Chair-Assisted Step Ups", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chair-assited-step-ups-vertical.mp4", "d": "", "nt": "", "cues": [], "desc": ""}, {"v": "dd-float-drills", "n": "Downward Dog Floats", "url": "", "d": "", "nt": "", "cues": ["Start in downward facing dog.", "Look forward and lean forward.", "Jump with the hips coming as high as you can.", "Bend the knees to help slow yourself down."], "desc": "From downward facing dog, look and lean forward and jump, hips as high as you can. Bend the knees to slow the landing — the aim is a quiet forward fold, then jump back to dog."}, {"v": "lying-crunch-and-contract", "n": "Lying Crunch and Contract", "url": "", "d": "", "nt": "", "cues": ["On your back.", "Crunch and hold the contraction.", "Same shape you need in the air, without the wrist load."], "desc": ""}, {"v": "table-top-knee-to-nose", "n": "Table Top Knee to Nose", "url": "", "d": "", "nt": "", "cues": ["Knees lifted off the floor.", "Pull the knees towards the nose.", "Round the spine and press the ground away."], "desc": "Table top with the knees lifted. Take the knees to the nose and round the spine, pressing the ground away."}, {"v": "plank-pose", "n": "Plank Pose", "url": "", "d": "", "nt": "", "cues": ["Shoulders stacked over the hands.", "Ribs down, glutes on.", "Push the floor away — don't sag between the shoulder blades."], "desc": "A plank held with the shoulders stacked and the ribs down."}, {"v": "chair-assisted-puppy-press", "n": "Chair-Assisted Puppy Press", "url": "", "d": "", "nt": "", "cues": ["One foot on the chair, hips high.", "Start higher than feels necessary.", "Lift the other hip and stack the body.", "Option to take it fully off into a handstand."], "desc": "One foot on the side of a chair, lift the other hip and stack the body. Start with the hips higher than feels necessary."}, {"v": "forearm-massage", "n": "Forearm Massage", "url": "", "d": "", "nt": "", "cues": ["Work the forearms before you load the wrists.", "Both sides, thumbs into the belly of the muscle."], "desc": ""}, {"v": "plank-knee-to-nose-float-ups", "n": "Plank Knee to Nose, Float Ups", "url": "", "d": "", "nt": "", "cues": ["From plank, knee to nose.", "Round the spine and press the ground away.", "Float up rather than jump."], "desc": ""}, {"v": "palm-lifts-table-top", "n": "Palm Lifts in Table Top", "url": "", "d": "", "nt": "", "cues": ["Table top, hands flat.", "Lift the palms, keep the fingers down.", "Slow — this is wrist prep, not a rep."], "desc": ""}, {"v": "chair-assisted-handstand-walks", "n": "Chair-Assisted Handstand Walks", "url": "", "d": "", "nt": "", "cues": ["In the chair-assisted position.", "Walk the hands, keep the shoulders stacked."], "desc": ""}, {"v": "chair-press-entries", "n": "Chair Press Entries", "url": "", "d": "", "nt": "", "cues": ["From the chair, press the hips up and over.", "Shoulders stay stacked as the hips travel."], "desc": ""}, {"v": "wall-shape-changes", "n": "Shape Changes — At the Wall", "url": "", "d": "", "nt": "", "cues": ["Chest to wall, hands close.", "Change shape with the wall taking the balance.", "Build the awareness first — freestanding comes after."], "desc": "Shape changes done chest-to-wall so the wall holds the balance and you can feel the shape."}, {"v": "sideways-press-walks", "n": "Sideways Press Walks", "url": "", "d": "", "nt": "", "cues": ["Press walks, travelling sideways.", "Hips up and back as you lean.", "Same push, different direction."], "desc": "Press walks travelling sideways rather than forward and back."}, {"v": "straddle-leg-lifts", "n": "Straddle Leg Lifts", "url": "", "d": "", "nt": "", "cues": ["Lift from the hip flexor.", "Don't lean back to make it easier.", "Slow up, slow down."], "desc": ""}, {"v": "pancake-to-wide-standing", "n": "Pancake to Wide Standing Lifts", "url": "", "d": "", "nt": "", "cues": ["From pancake, lift to a wide standing fold.", "Drive through the legs, keep the chest long."], "desc": "From a pancake, lift up to a wide standing forward fold and back down."}, {"v": "hands-together-tuck", "n": "Tuck Handstand — Hands Together", "url": "", "d": "", "nt": "", "cues": ["Bring the hands closer than feels natural.", "Push through the shoulders rather than widening the base.", "Less depth in the tuck is fine — the hand position is the drill."], "desc": "A tuck handstand with the hands closer together, even if that means less depth in the tuck."}];
const STAGE_SECTIONS={"0": [{"title": "Wrist Mobilisation", "sub": "Essential prep before any handstand work", "items": [{"v": "wrist-circles-mob", "n": "Wrist Circles", "d": "30s each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wrist-mobility.mp4", "cues": ["Spread fingers wide.", "Keep pressure light at first.", "Move slowly through the full circle.", "Match both directions evenly."], "desc": "Gently warm and lubricate the wrists through their full range of motion before loading.", "nt": ""}, {"v": "wrist-flexion-ext", "n": "Wrist Flexion and Extension", "d": "2 × 10", "url": "", "cues": ["Use the other hand to assist gently.", "Hold briefly at end range.", "Never force into pain.", "Breathe steadily."], "desc": "Build active range through the wrist joint in both directions to reduce injury risk.", "nt": ""}, {"v": "wrist-weight-shift", "n": "Wrist Weight Shifting", "d": "2 × 30s", "url": "", "cues": ["On all fours, fingers facing forward.", "Shift weight slowly side to side.", "Then front to back.", "Increase pressure gradually."], "desc": "Progressively load the wrists on all fours with gentle shifts to build tolerance for handstand work.", "nt": ""}, {"v": "plank-fingertip-lifts", "n": "Plank Fingertip Lifts", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/finger-tip-plank-raises.mp4", "cues": [], "desc": "A plank, but up on the fingertips instead of flat palms.", "nt": ""}]}, {"title": "Warm-Up", "sub": "Wrists, shoulders and lower body prep", "items": [{"v": "shoulder-circles", "n": "Shoulder Circles", "d": "10 each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shoulder-circles.mp4", "cues": [], "desc": "", "nt": ""}, {"v": "shoulder-pulses", "n": "Shoulder Pulses", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shoulder-pulses.mp4", "cues": [], "desc": "Small pulses through the shoulders to open them up before load.", "nt": ""}, {"v": "downward-dog-pulses", "n": "Downward Dog Pulses", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/downward-dog-pulses.mp4", "cues": ["Start in Downward Facing Dog.", "Look back between your legs.", "Bend the knees slightly.", "Pulse the chest toward the back of the room."], "desc": "Start in downward facing dog, look back, bend the knees. Pulse the chest towards the back of the room.", "nt": ""}, {"v": "dolphin-lean-forwards", "n": "Dolphin Lean Forwards", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/dolphin-lean-forwards.mp4", "cues": ["Keep forearms parallel on the floor.", "Shift forward with control.", "Touch nose gently to the floor.", "Push back actively through the shoulders."], "desc": "Start in Dolphin pose with legs bent while arms are as parallel as possible. Shift forwards to touch your nose to the floor between the hands. Push back.", "nt": ""}, {"v": "upward-dog-to-plank", "n": "Upward Dog to Plank", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/upward-facing-dog-lowers.mp4", "cues": ["Biceps rotate forward in upward dog.", "Keep arms straight throughout.", "Look forward in the dog position.", "Flow between positions smoothly."], "desc": "Start in upward facing dog with feet pointed, biceps turned forward looking forward. Keeping arms straight push up into plank.", "nt": ""}]}, {"title": "Shoulder Openers", "sub": "Build overhead range from the ground up", "items": [{"v": "wall-front-side-opener", "n": "Wall Front Side Opener", "d": "30s each side", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wall-front-side-opener.mp4", "cues": ["Face the wall a soft arms length away.", "Place palms high on the wall.", "Sink the chest forward and down.", "Hold for the full 30 seconds."], "desc": "Start facing the wall a soft arms distance away. Palms on wall above you, sink chest towards and down the wall.", "nt": ""}, {"v": "wall-shoulder-opener", "n": "Wall Shoulder Opener", "d": "10 pulses", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wall-shoulder-opener.mp4", "cues": ["Place hands on wall at chest level.", "Lower body to horizontal.", "Look at the floor.", "Try hollowing the body out and keeping it straight."], "desc": "Place hands on the wall at chest level. Lower the body to horizontal, look at the floor. Try both hollowing out the body and keeping it straight.", "nt": ""}, {"v": "heart-melting-pose", "n": "Heart Melting Pose", "d": "60s", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/heart-melting-pose.mp4", "cues": ["Get on your knees.", "Place back of palms and forearms on the floor.", "Pull body back actively.", "Feel the stretch through the entire shoulder girdle."], "desc": "Get on your knees, place the back of your palms and forearms on the floor in parallel, pull the body back focusing on stretching the lats.", "nt": ""}, {"v": "floor-lateral-stretch", "n": "Floor Lateral Stretch", "d": "60s", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/floor-lateral-stretch.mp4", "cues": ["Get on your knees.", "Place back of palms and forearms on the floor in parallel.", "Pull the body back.", "Focus on stretching the lats."], "desc": "Get on your knees, place the back of your palms and forearms on the floor in parallel, then pull the body back focusing on stretching the lats.", "nt": ""}]}, {"title": "Kick Ups to the Wall", "sub": "Your first steps upside down", "items": [{"v": "wall-kick-ups", "n": "Wall Kick Ups", "d": "10 each side", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wall-kick-ups.mp4", "cues": ["Stack shoulders above hands.", "Stack hips above shoulders.", "Jump up, throw hips toward the wall.", "Claw through the hands to exit."], "desc": "Stack shoulders above hands, hips above shoulders. Jump up and throw your hips towards the wall. Claw through the hands to come off the wall.", "nt": ""}, {"v": "wall-kick-ups-progressions", "n": "Wall Kick Ups Progressions", "d": "10 each side", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wall-kick-ups-additional-cues.mp4", "cues": ["Foam block between hip and floor leg prevents back arch.", "Block behind one hand keeps shoulders stacked over hands.", "Use a chair close to wall to reduce jump height.", "Progress each aid as you get stronger."], "desc": "Use a foam block tucked between the hip and the floor leg to prevent back arching. A block behind one hand keeps shoulders stacked. A chair near the wall reduces the height to jump.", "nt": ""}, {"v": "kick-up-bounces", "n": "Kick Up Bounces", "d": "3 × 10", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/kick-up-bounces.mp4", "cues": ["Fingers close to the wall.", "Right leg up, straight and engaged.", "Look between hands, shoulders over hips.", "Bounce quickly keeping all engagement points."], "desc": "Start with fingers close to the wall. Right leg up in the air, straight and engaged. Look between hands, shoulders stacked over hips. Bounce on the left foot in quick succession.", "nt": ""}, {"v": "chest-to-wall-bailouts", "n": "Chest-to-Wall Bailouts", "d": "3 × 3 each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chest-to-wall-bailouts.mp4", "cues": ["Look between the hands.", "Step one hand slightly forward to twist out.", "Keep the exit soft and controlled.", "Practice both sides."], "desc": "Learn to exit safely from the wall with control so handstand practice feels confident and repeatable.", "nt": ""}]}], "1": [{"title": "Warm-Up", "sub": "Same opening every session", "items": [{"v": "wrist-circles-mob", "n": "Wrist Circles", "d": "30s each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wrist-mobility.mp4", "cues": ["Spread fingers wide.", "Keep pressure light at first.", "Move slowly through the full circle.", "Match both directions evenly."], "desc": "Gently warm and lubricate the wrists through their full range of motion before loading.", "nt": ""}, {"v": "plank-fingertip-lifts", "n": "Plank Fingertip Lifts", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/finger-tip-plank-raises.mp4", "cues": [], "desc": "A plank, but up on the fingertips instead of flat palms.", "nt": ""}, {"v": "shoulder-circles", "n": "Shoulder Circles", "d": "10 each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shoulder-circles.mp4", "cues": [], "desc": "", "nt": ""}, {"v": "downward-dog-pulses", "n": "Downward Dog Pulses", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/downward-dog-pulses.mp4", "cues": ["Start in Downward Facing Dog.", "Look back between your legs.", "Bend the knees slightly.", "Pulse the chest toward the back of the room."], "desc": "Start in downward facing dog, look back, bend the knees. Pulse the chest towards the back of the room.", "nt": ""}]}, {"title": "Wall Foundations", "sub": "Getting upside down safely", "items": [{"v": "wall-walks", "n": "Wall Walks", "d": "3 × 3 walks in", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wall-walks.mp4", "cues": ["Walk the feet up smoothly.", "Push tall through the shoulders.", "Keep the core lightly braced.", "Come down with control."], "desc": "Build confidence upside down while opening the shoulders and learning stacked alignment.", "nt": ""}, {"v": "chest-to-wall-handstand", "n": "Chest-to-Wall Handstand", "d": "3 × 20–30s", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chest-to-wall.mp4", "cues": ["Squeeze legs together.", "Reach tall through the toes.", "Push the floor away constantly.", "Keep ribs gently in."], "desc": "Own a straight wall-supported handstand with strong shoulder push and midline control.", "nt": ""}, {"v": "chest-to-wall-bailouts", "n": "Chest-to-Wall Bailouts", "d": "3 × 3 each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chest-to-wall-bailouts.mp4", "cues": ["Look between the hands.", "Step one hand slightly forward to twist out.", "Keep the exit soft and controlled.", "Practice both sides."], "desc": "Learn to exit safely from the wall with control so handstand practice feels confident and repeatable.", "nt": ""}]}, {"title": "Scapular Strength", "sub": "The foundation of a stable handstand", "items": [{"v": "scapula-shrugs", "n": "Scapula Shrugs", "d": "3 × 10", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/scapula-shrugs.mp4", "cues": ["Keep elbows straight.", "Move only through the shoulders.", "Push tall at the top.", "Lower with control."], "desc": "Strengthen upward rotation and elevation through the scapula for a more stable overhead shape.", "nt": ""}, {"v": "one-leg-scapula-extensions", "n": "1-Leg Scapula Extensions", "d": "3 × 8 each", "url": "", "cues": ["Keep hips level.", "Push evenly through both hands.", "Move slowly through each rep.", "Stay long through the standing leg."], "desc": "Challenge scapular control with asymmetry to build strength that transfers to balancing.", "nt": ""}, {"v": "pike-press-ups", "n": "Pike Press-Ups", "d": "3 × 8", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/pike-press-ups.mp4", "cues": ["Shift weight into the hands.", "Lower the head forward slightly.", "Press the floor away.", "Keep reps smooth and strong."], "desc": "Develop pressing strength and overhead pushing mechanics in a scalable shape.", "nt": ""}]}, {"title": "Balance Drills", "sub": "Building time and confidence", "items": [{"v": "tuck-slides", "n": "Tuck Slides", "d": "build to 5", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/tuck-slides.mp4", "cues": ["Same start, hands about 1.5 feet from the wall.", "Knees together, lower them both down.", "Don't worry about the rest of the body at first — it's about the movement."], "desc": "Same start, but both knees come down together. The harder version.", "nt": ""}, {"v": "single-leg-tuck-slides", "n": "Single Leg Tuck Slides", "d": "build to 5 each", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/single-leg-tuck-slides.mp4", "cues": ["Chest to wall, hands about 1.5 feet from the wall, feet pointed.", "One foot stays on the wall.", "Take the other knee down towards your chest."], "desc": "Chest to wall, hands 1.5 feet from the wall. One foot stays on the wall, take the other knee down towards your chest.", "nt": ""}, {"v": "lateral-slide-outs", "n": "Lateral Slide Outs", "d": "3 × 6 each", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/lateral-leg-slide-outs.mp4", "cues": ["Shift slowly into the hand.", "Stay active through the shoulders.", "Keep legs long.", "Come back with control."], "desc": "Train side-to-side corrections and stronger fingertip awareness during balance changes.", "nt": ""}, {"v": "slide-away", "n": "Slide Away", "d": "build to 5", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/slide-downs.mp4", "cues": ["Lean the shoulders forward.", "Push back actively through the arms.", "Let the feet slide back up the wall.", "Keep the movement smooth and controlled."], "desc": "Lean the shoulders forward and push back, letting the feet slide back up the wall. This version is about grooving the shoulder movement — the feet stay on the wall throughout.", "nt": ""}]}], "2": [{"title": "Warm-Up", "sub": "Wrists and shoulders first", "items": [{"v": "wrist-circles-mob", "n": "Wrist Circles", "d": "30s each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wrist-mobility.mp4", "cues": ["Spread fingers wide.", "Keep pressure light at first.", "Move slowly through the full circle.", "Match both directions evenly."], "desc": "Gently warm and lubricate the wrists through their full range of motion before loading.", "nt": ""}, {"v": "plank-fingertip-lifts", "n": "Plank Fingertip Lifts", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/finger-tip-plank-raises.mp4", "cues": [], "desc": "A plank, but up on the fingertips instead of flat palms.", "nt": ""}, {"v": "shoulder-circles", "n": "Shoulder Circles", "d": "10 each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shoulder-circles.mp4", "cues": [], "desc": "", "nt": ""}, {"v": "dolphin-lean-forwards", "n": "Dolphin Lean Forwards", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/dolphin-lean-forwards.mp4", "cues": ["Keep forearms parallel on the floor.", "Shift forward with control.", "Touch nose gently to the floor.", "Push back actively through the shoulders."], "desc": "Start in Dolphin pose with legs bent while arms are as parallel as possible. Shift forwards to touch your nose to the floor between the hands. Push back.", "nt": ""}]}, {"title": "Box Progressions", "sub": "Controlled overhead loading", "items": [{"v": "knees-on-box", "n": "Knees on Box", "d": "2 sets · build to 30s", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/knees-on-box.mp4", "cues": ["Box about hip height, knees near the edge.", "Hands right to the edge of the box.", "Push into the ground, look between the hands."], "desc": "Use the box to build overhead loading tolerance and a cleaner stacked shape.", "nt": ""}, {"v": "knees-on-box-single-leg-lifts", "n": "Knees on Box - Single Leg Lifts", "d": "3 × 8 each", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/knees-on-box-leg-lifts.mp4", "cues": ["Lift only as high as you can control.", "Keep hips square.", "Push tall continuously.", "Alternate smoothly."], "desc": "Add small leg lifts to challenge balance while keeping strong support through the shoulders.", "nt": ""}, {"v": "knees-on-box-knee-lift-offs", "n": "Knees on Box - Knee Lift-Offs", "d": "3 × 5–8", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/knees-on-box-leg-lifts.mp4", "cues": ["Lean forward gradually.", "Stay active in the fingertips.", "Lift for a brief clean moment.", "Reset before the next rep."], "desc": "Progress toward full support by briefly unweighting the box with both knees.", "nt": ""}]}, {"title": "Hover & Take-Off", "sub": "Controlled entries into balance", "items": [{"v": "single-leg-take-off", "n": "Single Leg Take Off", "d": "build to 5", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/single-leg-take-offs.mp4", "cues": ["Hands about 1.5 feet from the wall.", "Take one leg off the wall.", "Float the second leg just off and hold 1-2 seconds.", "Place back on the wall before you over-balance."], "desc": "With hands about 1.5 feet from the wall, take one leg off, then the other just slightly off, hold 1-2 seconds, then place back. Go too far and you fall out.", "nt": ""}, {"v": "single-leg-wall-removals", "n": "Single Leg Wall Removals", "d": "build to 5", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/single-leg-wall-switches.mp4", "cues": ["Move from the hip slowly.", "Stay long through both legs.", "Use the fingertips to steer.", "Return to the wall with control."], "desc": "Take one leg away from the wall to build balance confidence and ownership of your line.", "nt": ""}, {"v": "slide-away-2", "n": "Slide Away — Off the Wall", "d": "build to 5", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/slide-downs.mp4", "cues": ["Stay aligned and hollow throughout.", "Move the shoulders off with control.", "Let the feet leave the wall as the shoulders move.", "Find a brief balance, then return."], "desc": "The progression: keep the body aligned and hollow as you move. Now the aim is for the feet to come off the wall as the shoulders move off — finding a brief moment of balance before returning.", "nt": ""}]}, {"title": "Tuck Take-Offs", "sub": "Freestanding entry drills", "items": [{"v": "tuck-take-offs", "n": "Tuck Take-Offs", "d": "build to 5", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/tuck-take-offs.mp4", "cues": ["Slide into a tuck against the wall.", "Keep knees tucked tightly, touching.", "Look forward and lean forward.", "Bring the knees off the wall with control."], "desc": "Slide into tuck against the wall, knees tucked tightly together. Look forward and lean forward to bring your knees off the wall.", "nt": ""}, {"v": "single-leg-tuck-take-offs", "n": "Single Leg Tuck Take-Offs", "d": "build to 5", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/single-leg-take-offs.mp4", "cues": ["Walk up the wall, one leg in the air, toes pointed.", "Slide the second leg down to tuck.", "Lean and look slightly forward as you pull the foot in.", "Hold a moment, then place it back."], "desc": "Walk up the wall with one leg in the air, slide the second leg down into a tuck. Lean and look slightly forward as you pull the second foot in. Hold, then replace. The gap can grow over time.", "nt": ""}]}], "3": [{"title": "Warm-Up", "sub": "Wrists and shoulders first", "items": [{"v": "wrist-circles-mob", "n": "Wrist Circles", "d": "30s each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wrist-mobility.mp4", "cues": ["Spread fingers wide.", "Keep pressure light at first.", "Move slowly through the full circle.", "Match both directions evenly."], "desc": "Gently warm and lubricate the wrists through their full range of motion before loading.", "nt": ""}, {"v": "plank-fingertip-lifts", "n": "Plank Fingertip Lifts", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/finger-tip-plank-raises.mp4", "cues": [], "desc": "A plank, but up on the fingertips instead of flat palms.", "nt": ""}, {"v": "shoulder-circles", "n": "Shoulder Circles", "d": "10 each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shoulder-circles.mp4", "cues": [], "desc": "", "nt": ""}, {"v": "downward-dog-pulses", "n": "Downward Dog Pulses", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/downward-dog-pulses.mp4", "cues": ["Start in Downward Facing Dog.", "Look back between your legs.", "Bend the knees slightly.", "Pulse the chest toward the back of the room."], "desc": "Start in downward facing dog, look back, bend the knees. Pulse the chest towards the back of the room.", "nt": ""}]}, {"title": "Entries", "sub": "Consistent ways into a handstand", "items": [{"v": "tuck-entries", "n": "Tuck Entries", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/tuck-entries.mp4", "cues": ["Stack the shoulders over the hands.", "Keep knees together throughout.", "Jump up to a tuck handstand.", "Extend the legs and push the pelvis through to straight."], "desc": "Once the shoulders are stacked, keep the knees together and jump up to a tuck handstand. Extend the legs and push the pelvis through to bring the body into a straight line.", "nt": ""}, {"v": "straight-entries", "n": "Straight Entries", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/straight-entries.mp4", "cues": ["Right leg up, straight and pointed.", "Shoulders stacked over hands, hips high.", "Bounce the lower leg to kick up.", "Bring the legs together, hold 1 second."], "desc": "Start with the right leg in the air, straight with pointed foot, shoulders stacked over hands and hips high. Bounce on the lower leg to kick up, bringing the left leg to meet the right. Hold a second before coming down.", "nt": ""}, {"v": "straddle-entries", "n": "Straddle Entries", "d": "10 reps", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/straddle-entries.mp4", "cues": ["Shoulders over hands, hips high.", "Start in a forward fold, legs bent.", "Open legs to the side, circle to centre.", "Keep looking down; elevate the scapula to push up."], "desc": "Shoulders stacked over hands, hips high in a forward fold with bent legs. Open the legs out to the side and circle them to centre, keeping the gaze down and elevating the scapula to push up into position.", "nt": ""}]}, {"title": "Shape Changes", "sub": "Correcting movement once off the wall", "items": [{"v": "straddle-to-straight", "n": "Straddle to Straight", "d": "build to 6", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shape-changes-straddle-to-straight.mp4", "cues": ["Kick up, option against the wall first.", "Lightly touch, then come away.", "Move freestanding once you get a couple of reps.", "Keep the straddle moderate, not excessive."], "desc": "Kick up into handstand (option against the wall), taking the body away from the wall. Lightly touch at first, then not at all. Keep the straddle moderate so it does not throw your balance.", "nt": ""}, {"v": "straight-to-tuck-back", "n": "Straight to Tuck & Back", "d": "build to 6", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/tuck-extensions.mp4", "cues": ["Kick up with knees together.", "Use hip flexors to pull knees down.", "Keep pushing tall through the shoulders.", "Gradually increase the depth of the tuck."], "desc": "Once kicked up with knees together, actively use the hip flexors to pull the knees down towards you, then back. This needs anterior deltoid and scapular elevation strength to stay up.", "nt": ""}, {"v": "straddle-to-diamond", "n": "Straddle to Diamond", "d": "build to 6", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/shape-changes-straddle-to-diamond.mp4", "cues": ["Start in straddle handstand.", "Bring toes together into a diamond.", "Externally rotate the hips to keep it neat.", "Point the toes; option to tuck after."], "desc": "From a straddle handstand, bring the toes together into a diamond, externally rotating the hips to keep it neat. Option to come into tuck after.", "nt": ""}]}, {"title": "Holding It", "sub": "Time upside down", "items": [{"v": "chest-to-wall-handstand", "n": "Chest-to-Wall Handstand", "d": "3 × 20–30s", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chest-to-wall.mp4", "cues": ["Squeeze legs together.", "Reach tall through the toes.", "Push the floor away constantly.", "Keep ribs gently in."], "desc": "Own a straight wall-supported handstand with strong shoulder push and midline control.", "nt": ""}, {"v": "tuck-slides", "n": "Tuck Slides", "d": "build to 5", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/tuck-slides.mp4", "cues": ["Same start, hands about 1.5 feet from the wall.", "Knees together, lower them both down.", "Don't worry about the rest of the body at first — it's about the movement."], "desc": "Same start, but both knees come down together. The harder version.", "nt": ""}, {"v": "knees-on-box", "n": "Knees on Box", "d": "2 sets · build to 30s", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/knees-on-box.mp4", "cues": ["Box about hip height, knees near the edge.", "Hands right to the edge of the box.", "Push into the ground, look between the hands."], "desc": "Use the box to build overhead loading tolerance and a cleaner stacked shape.", "nt": ""}]}], "4": [{"title": "Press · Prep", "sub": "Wrists, shoulders and compression", "items": [{"v": "wrist-circles-mob", "n": "Wrist Circles", "d": "30s each way", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/wrist-mobility.mp4", "cues": ["Spread fingers wide.", "Keep pressure light at first.", "Move slowly through the full circle.", "Match both directions evenly."], "desc": "Gently warm and lubricate the wrists through their full range of motion before loading.", "nt": ""}, {"v": "p-pancake", "n": "Pancake Training", "d": "3 × 60s", "url": "", "cues": ["Reach long through the chest.", "Build active range, not just passive."], "desc": "Flexibility — builds the active compression range in the straddle that the press relies on.", "nt": ""}, {"v": "dd-wrist-taps", "n": "Downward Dog Wrist Taps", "d": "2 × 10", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/downward-facing-dog-wrist-taps.mp4", "cues": [], "desc": "", "nt": ""}]}, {"title": "Press · Take-Off", "sub": "Scapula elevation and strength", "items": [{"v": "knees-on-box", "n": "Knees on Box", "d": "2 sets · build to 30s", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/knees-on-box.mp4", "cues": ["Box about hip height, knees near the edge.", "Hands right to the edge of the box.", "Push into the ground, look between the hands."], "desc": "Use the box to build overhead loading tolerance and a cleaner stacked shape.", "nt": ""}, {"v": "p-pike-pushups", "n": "Pike Push Ups", "d": "3 × 8", "url": "", "cues": ["Feet a little wider than hips, knees bent, hips high.", "Look forward to a point between the hands.", "Lower the forehead to that point, elbows tucked.", "Push back up keeping the diagonal line."], "desc": "Front deltoid strength — the fix if you end up collapsing in the take-off. Build the pressing strength the take-off demands.", "nt": ""}, {"v": "p-bench-zombies", "n": "Bench Zombies", "d": "2 × 5–8", "url": "", "cues": ["Feet on the bench, toes pointed.", "Pull up until the hips stack over the shoulders.", "Keep the lower back engaged."], "desc": "Plank with your feet on a bench, toes pointed. Pull yourself up until the hips are stacked over the shoulders.", "nt": ""}]}, {"title": "Press · Compression", "sub": "Feet, shoulders and hips as one chain", "items": [{"v": "press-walks", "n": "Press Walks", "d": "1 × mat", "url": "", "cues": ["Baby hop the feet forward.", "Press the hips up and back as you lean forward.", "Up and down the mat."], "desc": "Baby hop the feet forward, then press the hips up and back as you lean forward. Walk up and down the mat.", "nt": ""}, {"v": "p-solo-press-circles", "n": "Solo Press Circles", "d": "3 × 6", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/press-circles-vertical.mp4", "cues": ["Hold the handstand, open the legs.", "Start with small circles.", "Grow them as you get stronger.", "Both directions — speed doesn't matter."], "desc": "In a handstand, open the legs and make small circles. Grow the circles bigger over time, working towards the press position. Speed doesn't matter — work both directions.", "nt": ""}, {"v": "p-plank-slides", "n": "Plank Slides to Pike", "d": "3 × 8", "url": "", "cues": ["Move as one connected chain.", "Control the slide both ways."], "desc": "Conditioning — builds the connected-chain strength the compression demands.", "nt": ""}]}, {"title": "Press · Wall Presses", "sub": "All three stages together", "items": [{"v": "chest-to-wall-toe-taps", "n": "Chest to Wall Toe Taps", "d": "3 × 8", "url": "https://pub-a41021d2de574a8ab55c29a1e5d7dd88.r2.dev/app/chest-to-wall-floor-toe-taps-vertical.mp4", "cues": ["Hands about 2 feet from the wall.", "One leg stays on the wall.", "Pull the other knee or toe towards the floor.", "Control it down, don't drop."], "desc": "Hands about 2 feet from the wall, one leg on the wall. Take the other leg off and pull the knee or toe down towards the floor.", "nt": ""}, {"v": "p-back-to-wall", "n": "Back to Wall Press", "d": "3 × 5", "url": "", "cues": ["Full upper back AND head on the wall.", "Focus on engaging the hip flexors.", "Keep the back rounded.", "If heavy on the wrists, turn the hands out to the side."], "desc": "HERO DRILL. Teaches the shape and compression with the wall taking some of the load. Make sure your full upper back as well as head is on the wall — this takes more of the weight so you can focus on engaging the hip flexors and keeping the back rounded.", "nt": ""}, {"v": "p-chest-to-wall", "n": "Chest to Wall Press", "d": "3 × 3", "url": "", "cues": ["Take-off into the line.", "Compress with the chain connected.", "Unroll with the shoulders opening first."], "desc": "THE ULTIMATE HERO. Trains all three stages — take-off, compression and unrolling — in a single movement. Your feet cannot go anywhere, so your shoulders cannot either: you either compress and unroll correctly, or the wall rejects you.", "nt": ""}]}]};
