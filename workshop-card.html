<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handstand Ladder, the card for a workshop</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#006663;--ink:#111;--body:#4c5654;--mute:#79837f;--serif:Newsreader,Georgia,serif;--sans:Figtree,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#f4f4f5;color:var(--ink);font-family:var(--sans);display:grid;place-items:center}
.card{width:min(92vw,880px);background:#fff;border-radius:34px;padding:clamp(28px,5vw,56px);
  display:grid;grid-template-columns:1fr auto;gap:clamp(24px,5vw,56px);align-items:center;
  box-shadow:0 30px 70px -30px rgba(0,64,61,.4)}
@media(max-width:700px){.card{grid-template-columns:1fr;text-align:center}}
.k{font:600 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--forest)}
h1{margin:12px 0 0;font:400 clamp(36px,5.2vw,58px)/1.02 var(--serif);letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--forest)}
.steps{margin:22px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:baseline;font:400 clamp(17px,2.2vw,22px)/1.4 var(--sans);color:var(--body)}
.steps b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;font:600 14px/1 var(--sans)}
.code{margin-top:22px;display:inline-block;border:2px dashed rgba(0,102,99,.4);border-radius:16px;padding:14px 22px;
  font:700 clamp(28px,4vw,40px)/1 var(--sans);letter-spacing:.14em;color:var(--forest)}
.small{margin:12px 0 0;font:400 14px/1.5 var(--sans);color:var(--mute)}
.qr{background:#fff;padding:14px;border-radius:22px;border:1px solid rgba(0,64,61,.13)}
#qr canvas,#qr img{display:block;width:min(56vw,300px);height:auto}
.url{margin-top:10px;text-align:center;font:600 13px/1 var(--sans);color:var(--body)}
.print{position:fixed;top:16px;right:16px;border:1px solid rgba(0,64,61,.2);background:#fff;border-radius:999px;
  padding:10px 16px;font:600 13px/1 var(--sans);cursor:pointer;color:var(--forest)}
@media print{.print{display:none} body{background:#fff} .card{box-shadow:none;width:100%}}
</style>
</head>
<body>
<button class="print" onclick="print()">Print</button>
<div class="card">
  <div>
    <div class="k">London Handstand Academy</div>
    <h1>Take the ladder <em>home with you.</em></h1>
    <ol class="steps">
      <li><b>1</b><span>Scan the code, or go to <strong>londonhandstandacademy.com/app</strong></span></li>
      <li><b>2</b><span>Add it to your home screen when it asks</span></li>
      <li><b>3</b><span>Make an account and type the code below</span></li>
    </ol>
    <div class="code" id="codeTxt">WORKSHOP26</div>
    <p class="small" id="what">The whole ladder, free for 30 days. No card.</p>
  </div>
  <div>
    <div class="qr"><div id="qr"></div></div>
    <div class="url" id="urlTxt">londonhandstandacademy.com/app</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  /* ?code=X&days=N makes a card for any code, so one page serves every workshop */
  var q=new URLSearchParams(location.search);
  var code=(q.get('code')||'WORKSHOP26').toUpperCase().replace(/[^A-Z0-9-]/g,'');
  var days=Number(q.get('days'))||30;
  document.getElementById('codeTxt').textContent=code;
  document.getElementById('what').textContent='The whole ladder, free for '+days+' days. No card.';
  var url='https://londonhandstandacademy.com/app?code='+code;
  new QRCode(document.getElementById('qr'),{text:url,width:300,height:300,colorDark:'#00403d',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
</script>
</body>
</html>
