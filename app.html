<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "The Handstand Ladder",
  "url": "https://londonhandstandacademy.com/app.html",

<script>
  (function(){
    var q=new URLSearchParams(location.search),
        c=(q.get('code')||'').toUpperCase().replace(/[^A-Z0-9-]/g,''),
        r=(q.get('ref')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,20)||'app-page',
        parts=['start=quiz','ref='+encodeURIComponent(r)];
    if(c) parts.push('code='+encodeURIComponent(c));
    location.replace('/lha-app.html?'+parts.join('&'));
  })();
