<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workshop · London Handstand Academy</title>
<meta name="description" content="Book a handstand workshop in London with London Handstand Academy.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* One workshop, one button. Name and email, then Stripe, then back here
   with a confirmation. No account, no login wall, nothing to remember. */
:root{--bg:#f4f4f5;--forest:#006663;--deep:#00403d;--ink:#111111;--sand:#cfe6ec;--amber:#f3a949;--terra:#a4503c;
 --grey:#5c6660;--grey2:#8a8f8c;--mist:#e6e3de;--line:rgba(17,17,17,.12);
 --serif:Newsreader,Georgia,serif;--sans:Figtree,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.6 var(--sans)}
.wrap{max-width:620px;margin:0 auto;padding:28px 20px 90px}
.brand{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--forest);text-decoration:none}
.kick{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--forest);margin-top:34px}
h1{font:400 40px/1.04 var(--serif);letter-spacing:-.015em;margin:10px 0 0;text-wrap:balance}
.when{font:400 20px/1.4 var(--sans);color:var(--ink);margin:16px 0 0}
.meta{font:400 15px/1.6 var(--sans);color:var(--grey);margin:6px 0 0}
p{margin:14px 0 0;max-width:62ch;white-space:pre-wrap}
.card{margin:26px 0 0;padding:20px;border-radius:22px;background:#fff;box-shadow:0 18px 40px -26px rgba(28,32,25,.5)}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.price b{font:400 30px/1 var(--serif)}
.price span{font:400 13.5px/1.4 var(--sans);color:var(--grey)}
label{display:block;font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--grey2);margin:16px 0 6px}
input{width:100%;min-height:48px;padding:12px 14px;font:400 16px/1.4 var(--sans);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px}
input:focus{outline:2px solid var(--forest);outline-offset:0;border-color:var(--forest)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:16px;min-height:56px;border:0;border-radius:16px;cursor:pointer;
 background:linear-gradient(180deg,#0a7a76,#006663);color:#f7f4f1;font:600 17px/1 var(--sans);box-shadow:0 12px 30px rgba(0,102,99,.3)}
.btn:disabled{opacity:.6;cursor:default}
.msg{font:500 13.5px/1.5 var(--sans);color:var(--terra);margin-top:10px;min-height:20px}
.fine{font:400 12.5px/1.6 var(--sans);color:var(--grey2);margin-top:12px}
.list a{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:#fff;text-decoration:none;color:inherit;margin-top:10px}
.list .n{font:600 15px/1.3 var(--sans)}.list .m{font:400 13px/1.4 var(--sans);color:var(--grey);margin-top:3px}
.list .p{font:400 20px/1 var(--serif);color:var(--forest);white-space:nowrap}
.done{text-align:center;padding:30px 0 10px}
.done .tick{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:rgba(0,102,99,.1);color:var(--forest);font-size:30px}
.foot{font:400 12.5px/1.6 var(--sans);color:var(--grey2);margin-top:30px}.foot a{color:var(--forest)}
@media (max-width:520px){h1{font-size:33px}.wrap{padding:22px 16px 80px}}
</style></head><body>
<div class="wrap">
  <a class="brand" href="/">London Handstand Academy</a>
  <div id="ws"><p style="color:var(--grey)">Loading…</p></div>
</div>
<script>
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const q=new URLSearchParams(location.search);
  const slug=(q.get('slug')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24);
  const booked=q.get('booked')==='1';
  const box=document.getElementById('ws');
  const beacon=n=>{ try{ navigator.sendBeacon('/api/app/event', JSON.stringify({n})); }catch(e){} };
  beacon('siteworkshoppage');
  const when=w=>w.when?new Date(w.when).toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'Date to be confirmed';
  fetch('/api/app/workshops').then(r=>r.json()).then(d=>{
    const list=(d&&d.workshops)||[];
    const w=list.find(x=>x.slug===slug);
    if(!w){
      box.innerHTML='<div class="kick">Workshops</div><h1>Coming up.</h1>'+(list.length
        ?'<div class="list">'+list.map(x=>'<a href="/workshop.html?slug='+esc(x.slug)+'"><div><div class="n">'+esc(x.title)+'</div><div class="m">'+esc(when(x))+(x.place?' · '+esc(x.place):'')+'</div></div><div class="p">'+esc(x.priceLabel)+'</div></a>').join('')+'</div>'
        :'<p style="color:var(--grey)">Nothing on the calendar right now. The next dates go out by email first: <a href="/#newsletter" style="color:var(--forest)">join the list</a>.</p>');
      return;
    }
    document.title=w.title+' · London Handstand Academy';
    if(booked){
      box.innerHTML='<div class="done"><div class="tick">&#10003;</div><h1 style="font-size:34px;margin-top:18px">You are booked.</h1>'
        +'<p style="margin:14px auto 0;max-width:40ch;text-align:center">'+esc(w.title)+', '+esc(when(w))+(w.place?', at '+esc(w.place):'')+'. A confirmation is on its way to your email, and a reminder comes the day before.</p>'
        +'<p style="margin:14px auto 0;max-width:40ch;text-align:center"><a href="/api/app/workshop/ics?slug='+esc(w.slug)+'" style="color:var(--forest)">Add it to your calendar</a>. Sign in to the app with the same email to see the booking or cancel it; more than 48 hours before, it is refunded in full.</p>'
        +(w.appDays>0?'<p style="margin:14px auto 0;max-width:40ch;text-align:center">The Handstand Ladder app is open for you for '+esc(w.appDays)+' days, every stage. Sign in with the same email.</p><a class="btn" href="/lha-app.html" style="text-decoration:none">Open the app</a>':'<a class="btn" href="/" style="text-decoration:none">Back to the site</a>')
        +'</div>';
      return;
    }
    const full=w.places>0&&w.left<=0;
    let price=w.price, priceLabel=w.priceLabel, code='';
    box.innerHTML='<div class="kick">Workshop'+(w.who?' · '+esc(w.who):'')+'</div><h1>'+esc(w.title)+'</h1>'
      +'<div class="when">'+esc(when(w))+'</div>'
      +(w.place?'<div class="meta">'+esc(w.place)+'</div>':'')
      +(w.desc?'<p>'+esc(w.desc)+'</p>':'')
      +'<div class="card"><div class="price"><b>'+esc(w.priceLabel)+'</b><span>'+(full?'Full':(w.places>0?w.left+' of '+w.places+' places left':'Places available'))+'</span></div>'
      +(full?'<p style="color:var(--grey)">This one is full. Leave your name and if a place opens up you are emailed first.</p>'
        +'<label for="nm">Your name</label><input id="nm" autocomplete="name" placeholder="First and last">'
        +'<label for="em">Email</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com">'
        +'<button class="btn" id="wait">Put me on the list</button><div class="msg" id="msg"></div>'
        :'<label for="nm">Your name</label><input id="nm" autocomplete="name" placeholder="First and last">'
        +'<label for="em">Email</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com">'
        +'<label for="ex">Where you are with handstands, optional</label><input id="ex" placeholder="Never tried, or wall only, or a few seconds free">'
        +'<label for="qq">Anything you want to ask, optional</label><input id="qq" placeholder="Injuries, what to bring, whether it is right for you">'
        +(w.price>0?'<label for="cd">Discount code, optional</label><div style="display:flex;gap:8px"><input id="cd" placeholder="CODE" style="text-transform:uppercase"><button type="button" id="apply" style="flex:none;min-height:48px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font:600 14px/1 var(--sans)">Apply</button></div><div class="msg" id="cmsg" style="color:var(--forest)"></div>':'')
        +'<button class="btn" id="go">'+(w.price>0?'Book, '+esc(w.priceLabel):'Book my place')+'</button>'
        +'<div class="msg" id="msg"></div>'
        +'<div class="fine">'+(w.price>0?'Card payment on the next page, through Stripe. ':'')+'You get a confirmation by email and a reminder the day before'+(w.appDays>0?', and the Handstand Ladder app open for '+esc(w.appDays)+' days':'')+'. Cancel more than 48 hours before and it is refunded in full.</div>')
      +'</div>'
      +'<div class="foot">Questions? <a href="mailto:info@londonhandstandacademy.com">info@londonhandstandacademy.com</a></div>';
    const wait=document.getElementById('wait');
    if(wait){ wait.onclick=()=>{
      const name=(document.getElementById('nm').value||'').trim(), email=(document.getElementById('em').value||'').trim(); const msg=document.getElementById('msg');
      if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent='Your name and a real email address, please.'; return; }
      wait.disabled=true;
      fetch('/api/app/workshop/wait',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug,name,email})})
        .then(r=>r.json().then(d=>r.ok?d:Promise.reject(d.error||'Could not add you')))
        .then(d=>{ wait.textContent='You are number '+d.position+' on the list'; msg.style.color='var(--forest)'; msg.textContent='If a place opens up, you are emailed first.'; })
        .catch(e=>{ wait.disabled=false; msg.textContent=String(e); }); }; return; }
    const go=document.getElementById('go'); if(!go) return;
    const apply=document.getElementById('apply');
    if(apply){ apply.onclick=()=>{
      const c=(document.getElementById('cd').value||'').trim().toUpperCase(); const cm=document.getElementById('cmsg');
      if(!c){ code=''; price=w.price; priceLabel=w.priceLabel; go.textContent='Book, '+priceLabel; cm.textContent=''; return; }
      fetch('/api/app/workshop/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug,code:c})})
        .then(r=>r.json().then(d=>r.ok?d:Promise.reject(d.error||'That code did not work')))
        .then(d=>{ code=c; price=d.price; priceLabel=d.label; cm.style.color='var(--forest)'; cm.textContent=c+' applied: '+w.priceLabel+' becomes '+d.label+'.'; go.textContent=price>0?'Book, '+priceLabel:'Book my place'; })
        .catch(e=>{ code=''; price=w.price; priceLabel=w.priceLabel; cm.style.color='var(--terra)'; cm.textContent=String(e); go.textContent='Book, '+priceLabel; }); }; }
    go.onclick=()=>{
      const name=(document.getElementById('nm').value||'').trim(), email=(document.getElementById('em').value||'').trim();
      const exp=((document.getElementById('ex')||{}).value||'').trim(), q=((document.getElementById('qq')||{}).value||'').trim();
      const msg=document.getElementById('msg');
      if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent='Your name and a real email address, please.'; return; }
      go.disabled=true; go.textContent='One moment…'; msg.textContent='';
      beacon('workshopbook');
      fetch('/api/app/workshop/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug,name,email,q,exp,code})})
        .then(r=>r.json().then(d=>r.ok?d:Promise.reject(d.error||'Could not start the booking')))
        .then(d=>{ if(d.url){ location.href=d.url; return; } if(d.free){ location.href='/workshop.html?slug='+slug+'&booked=1'; return; } throw 'Something went wrong'; })
        .catch(e=>{ go.disabled=false; go.textContent=price>0?'Book, '+priceLabel:'Book my place'; msg.textContent=String(e); });
    };
  }).catch(()=>{ box.innerHTML='<p style="color:var(--grey)">Could not load this. Try again in a moment.</p>'; });
})();
</script>
</body></html>
