      ${wks.map((w,i)=>`<div style="flex:1;height:100%;display:flex;flex-direction:column;
        justify-content:flex-end;gap:2px" title="${new Date(w.from).toLocaleDateString('en-GB',
        {day:'numeric',month:'short'})}: ${w.reps} reps, ${mmss(w.secs)} held, ${w.mins}m">
        <div style="width:100%;height:${Math.round(w.secs/peakS*46)}%;border-radius:3px;
          background:${i===wks.length-1?'var(--amber)':'var(--sage)'}"></div>
        <div style="width:100%;height:${Math.round(w.reps/peakR*46)}%;border-radius:3px;
          background:${i===wks.length-1?'var(--forest)':'var(--deep)'};opacity:${

      <span style="display:flex;align-items:center;gap:6px"><i style="width:9px;height:9px;
        border-radius:2px;background:var(--sage);display:block"></i>Seconds held</span>
      <span style="margin-left:auto">Eight weeks, this one last</span>
    </div>`
    :`<div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:11px">
      No rep or second counts yet. They arrive with the next finished session.</div>`}
    <div style="display:flex;gap:14px;margin-top:16px;padding-top:14px;
      border-top:1px solid rgba(28,32,25,.08)">
      ${stat(hm(appNow.ms),'IN THE APP', appWas.ms?hm(appWas.ms)+' last week':'')}
      ${stat(String(appNow.opens),'VISITS', appNow.days+' day'+(appNow.days===1?'':'s'))}
      ${stat(now.sessions?String(now.sessions):'0','SESSIONS',
        appNow.opens&&!now.sessions?'opened, not trained':'')}

}
function panelWeek(p){
  const ss=((p&&p.sessions)||[]).filter(x=>x&&x.at);
  const now=new Date(); now.setHours(23,59,59,999);
  const mins=[], labels=[];
  let thisWk=0, lastWk=0, drills=0, drillsLast=0;
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    const m=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.actual||x.mins||0),0);
    mins.push(m); thisWk+=m;
    drills+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.drills||0),0);
    labels.push(i===0?'TOD':['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]);
  }
  for(let i=13;i>=7;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    lastWk+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.actual||x.mins||0),0);
    drillsLast+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.drills||0),0);
  }

  const bars=mins.map((m,i)=>`<div style="flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:flex-end;gap:7px">
    <div style="width:100%;height:78px;display:flex;align-items:flex-end">
      <div title="${m} min" style="width:100%;border-radius:6px 6px 3px 3px;
        height:${Math.max(m?7:3,Math.round(m/peak*78))}px;
        background:${m?(i===6?'var(--forest)':'var(--sage)'):'rgba(28,32,25,.07)'}"></div></div>
    <span style="font:600 9px/1 var(--sans);letter-spacing:.06em;
      color:${i===6?'var(--forest)':'var(--grey2)'}">${labels[i]}</span></div>`).join('');
  const dm=thisWk-lastWk, dd=drills-drillsLast;
  const hrs=n=>n>=60?(n/60).toFixed(1)+'h':n+'m';
  return `<div class="card"><div class="kick2">THIS WEEK</div>
    <div style="display:flex;gap:5px;align-items:flex-end;margin-top:16px">${bars}</div>
    <div style="display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(28,32,25,.08)">
      ${[['Time',hrs(thisWk)],['Drills',String(drills)],
         ['vs last week',(dm>0?'+':'')+hrs(Math.abs(dm)).replace('-','')+' · '+(dd>0?'+':'')+dd]]
        .map(([n,v])=>`<div style="flex:1">
        <div style="font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${n.toUpperCase()}</div>
        <div class="h-sm" style="font-size:19px;margin-top:5px">${v}</div></div>`).join('')}
    </div>
    ${thisWk?'':`<div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:12px">
      Nothing logged this week yet. Finish a session and it turns up here.</div>`}</div>`;
}

/* ── what they told us ────────────────────────────────────────────
   The quiz answers were reaching the database and stopping there. Goal,
   level, what hurts and how often they said they would train — none of
   it was visible to the person writing their programme. The injuries
   line is the one that matters: someone declares a bad wrist and the
   coach could not see it. */
const GOAL_LABEL={learn:'Learn to handstand',hold:'Hold a freestanding handstand',
  improve:'Improve my handstand',advanced:'Advanced skills — press, one-arm'};
const LEVEL_LABEL=['Never done handstands',"Stuck at the wall",
  'Can briefly balance','Can hold ten seconds or more'];

/* ── what the client has been tracking ─────────────────────────────
   Habits, the three numbers, and the fortnightly check-in. Read-only:
   this is what they said, and the point is to see it before writing the
   next block. */
/* ── the programme builder ─────────────────────────────────────────
   A programme was a generated file, so every change to Hannah's Tuesday
   was a code deploy. This writes it. Drills are stored as an id and a
   dose; the name, clip and cues come from the library when it is read,
   so nothing can drift out of sync again. */
let builder=null;          /* {email, plan, dirty} while a programme is open */
let libIndex=null;         /* id → name, for the picker */

function openBuilder(email){
  fetch(API+'/programme?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{
      noteLibrary(d.library);
      builder={email, plan:d.plan||{days:[]}, dirty:false, edited:d.edited, day:0, grp:0,
               exLib:d.explainerLib||{}, exOn:(d.explainersOn||[]).slice()};
      draw();
    })
    .catch(()=>{ builder={email, plan:{days:[]}, dirty:false, error:true}; draw(); });
}
function closeBuilder(){
  if(builder&&builder.dirty&&!confirm('Close without saving?')) return;
  builder=null; draw();
}
function bMark(){ builder.dirty=true; }
function bDays(){ return (builder.plan.days=builder.plan.days||[]); }

/* Which day and which block are open. The builder was one long column and
   a five day block meant scrolling past everything to reach the end of it. */
function bDay(){
  const n=bDays().length;
  if(!n) return 0;
  builder.day = Math.max(0, Math.min(n-1, builder.day|0));
  return builder.day;
}
function bGrp(){
  const d=bDays()[bDay()]; const n=((d&&d.groups)||[]).length;
  if(!n) return 0;
  builder.grp = Math.max(0, Math.min(n-1, builder.grp|0));
  return builder.grp;
}
/* ── what the day says versus what it comes to ────────────────────
   The minutes box is a promise and the drills are the thing. They drift:
   a block gets another two drills and the label still says forty-five.
   Both numbers, side by side, worked out with the same arithmetic the app
   counts down with, so the two cannot disagree. */
function dayActualSecs(d){
  return (typeof lhaSessionSecs==='function') ? lhaSessionSecs(d.groups||[]) : 0;
}
function lengthLine(d){
  const secs=dayActualSecs(d);
  if(!secs) return '';
  const actual=lhaMins(secs);
  /* the minutes field is written by hand and is often a range, "35-40".
     Stripping the punctuation turned that into thirty-five thousand. */
  const nums=(String(d.mins||'').match(/\d+/g)||[]).map(Number).filter(n=>n>0&&n<=240);
  const lo=nums[0], hi=nums.length>1?nums[nums.length-1]:nums[0];
  const drills=(d.groups||[]).reduce((n,g)=>n+((g.items||[]).length),0);
  const sets=(d.groups||[]).reduce((n,g)=>n+(g.items||[]).reduce((m,it)=>m+lhaSets(it.d),0),0);
  let verdict='', colour='var(--grey2)';
  if(lo){
    /* inside the range counts as right, so a day written as 35 to 40 is not
       reported as five minutes wrong for landing on either end */
    const diff = actual>hi ? actual-hi : actual<lo ? actual-lo : 0;
    const pct = Math.abs(diff)/hi;
    colour = diff===0 ? 'var(--forest)' : pct<=0.2 ? '#8a6524' : 'var(--terra)';
    verdict = diff===0 ? 'about right'
      : (diff>0 ? '+'+diff+' min over' : diff+' min under');
  }
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;
    padding:9px 11px;border-radius:11px;background:rgba(17,17,17,.04)">
    <span style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">LENGTH</span>
    <span style="font:500 12.5px/1 var(--sans);color:var(--grey)">
      says <b style="color:var(--ink)">${lo?(lo===hi?lo:lo+'\u2013'+hi)+' min':'—'}</b></span>
    <span style="font:500 12.5px/1 var(--sans);color:var(--grey)">
      actually <b style="color:${colour}">${actual} min</b></span>
    ${verdict?`<span style="font:700 10.5px/1 var(--sans);padding:4px 8px;border-radius:999px;
      background:${colour==='var(--forest)'?'rgba(0,102,99,.12)':colour==='var(--terra)'
        ?'rgba(164,80,60,.14)':'rgba(243,169,73,.18)'};color:${colour}">${verdict}</span>`:''}
    <span style="flex:1"></span>
    <span style="font:400 11.5px/1 var(--sans);color:var(--grey2)">${drills} drills · ${sets} sets</span>
  </div>`;
}

/* ── the app's own workouts ────────────────────────────────────────
   A coached client's days are edited in the builder. The free ladder's
   were not editable at all: the seconds came out of a rule, and a rule
   cannot know that one hold wants longer to set up than another.

   Every drill a stage uses, with the dose, the seconds it runs and the
   rest after it. Blank means the rule decides. Saved per drill, so a
   change follows the drill into every workout it appears in. */
let wkStage=0, wkLevel=0, wkTiming=null, wkEdits={}, wkBusy=false;
function wkLoad(){
  if(wkTiming) return;
  wkTiming={};
  fetch(API+'/timing',{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ wkTiming=(d&&d.timing)||{}; draw(); })
    .catch(()=>{ wkTiming={}; });
}
function wkPick(i){ wkStage=i; wkLevel=0; wkAdd=false; wkAddQ=''; draw(); }
function wkBandPick(n){ wkBand=n; wkAdd=false; wkAddQ=''; draw(); }
/* 0 is every level, 1 to 4 is that difficulty on its own */
function wkLvl(n){ wkLevel=n; draw(); }
/* which of the three buttons in the app ever reach this difficulty. A level
   no band asks for is work nobody is given, which is worth seeing while you
   are tuning it. */
function wkBandsFor(L){
  return [1,2,3].filter(b=>((BAND_MIX[b]||{})[L]||0)>0).map(b=>BAND_NAME[b]);
}
/* Sets and reps inside one band. A drill can be two sets in Easier and four
   in Harder, and with one set of numbers per drill there was no way to say
   so. Editing a band writes here; editing Every drill writes the drill's own
   numbers, which is what a band with nothing of its own falls back to. */
let wkBandTiming={}, wkBandEdits={}, wkMix={}, wkMixEdits={}, wkNewLvl={};
const wkBandKey=(stage,band)=>stage+':'+band;
/* ── the level shares ──────────────────────────────────────────────
   One shipped set of percentages served every stage, so tuning Foundations
   moved Wall Work with it. They are per stage and per band now, and the
   shipped mix is what a stage falls back to. */
let wkMixVals={};
function wkMixNow(stage, band){
  const pend=((wkMixVals[stage]||{})[band]);
  if(pend) return pend;
  const saved=((wkMix[stage]||wkMix[String(stage)]||{})[band]);
  if(saved && Object.keys(saved).length) return saved;
  return BAND_MIX[band] || BAND_MIX[2];
}
function wkMixSet(stage, band, L, val){
  const now=Object.assign({}, wkMixNow(stage,band));
  const n=Math.round(Number(val));
  if(!Number.isFinite(n) || n<=0) delete now[L]; else now[L]=Math.min(100,n);
  wkMixVals[stage]=wkMixVals[stage]||{};
  wkMixVals[stage][band]=now;
  wkMixEdits[wkBandKey(stage,band)]=true;
  draw();
}
function wkMixFor(stage){
  const out={};
  [1,2,3].forEach(b=>{ out[b]=wkMixNow(stage,b); });
  return out;
}
/* what those shares come to in drills, which is the thing being decided */
function wkMixCounts(stage, band, n){
  const mix=wkMixNow(stage,band);
  const lvls=Object.keys(mix).map(Number).sort((a,b)=>a-b);
  const total=lvls.reduce((t,L)=>t+mix[L],0) || 1;
  const raw={}, q={};
  lvls.forEach(L=>{ raw[L]=n*mix[L]/total; q[L]=Math.floor(raw[L]); });
  let spare=n-lvls.reduce((t,L)=>t+q[L],0);
  lvls.slice().sort((a,b)=>(raw[b]-q[b])-(raw[a]-q[a]))
      .forEach(L=>{ if(spare>0){ q[L]++; spare--; } });
  if(!q[lvls[0]]) q[lvls[0]]=1;
  return lvls.map(L=>'L'+L+' × '+q[L]).join(', ');
}
/* Three places can set a number inside one workout, and the narrower one
   wins: the whole workout ("*"), everything at one difficulty in it
   ("*l3"), then the drill's own row. */
function wkBandNums(stage,band,v){
  const key=wkBandKey(stage,band);
  const store=((wkBandTiming[stage]||wkBandTiming[String(stage)]||{})[band])||{};
  const one=k=>Object.assign({}, store[k]||{}, ((wkBandEdits[key]||{})[k])||{});
  if(String(v).charAt(0)==='*') return one(v);
  const L=wkLvlOf(stage,v);
  return Object.assign({}, one('*'), L?one('*l'+L):{}, one(v));
}
/* what one key says on its own, with nothing inherited folded in. Editing a
   row seeds it from this: seeding from the cascade instead copied the
   workout's numbers onto the row, and the row then stopped following it. */
function wkBandOwn(stage,band,v){
  const store=((wkBandTiming[stage]||wkBandTiming[String(stage)]||{})[band])||{};
  return Object.assign({}, store[v]||{}, ((wkBandEdits[wkBandKey(stage,band)]||{})[v])||{});
}
function wkSet(v,f,val){
  /* a band selected means the numbers belong to that band */
  if(wkBand){
    const k=wkBandKey(wkStage,wkBand);
    wkBandEdits[k]=wkBandEdits[k]||{};
    wkBandEdits[k][v]=wkBandOwn(wkStage,wkBand,v);
    /* an empty box is "go back to the rule", except the unit, where the
       empty string is reps and deleting it lost the choice */
    if((val===''||val==null) && f!=='unit') delete wkBandEdits[k][v][f];
    else if(f==='d' || f==='dx' || f==='unit' || f==='style') wkBandEdits[k][v][f]=val;
    else wkBandEdits[k][v][f]=Number(val);
    wkRepaintRow(v); return;
  }
  wkEdits[v]=Object.assign({}, wkTiming[v]||{}, wkEdits[v]||{});
  if((val===''||val==null) && f!=='unit') delete wkEdits[v][f];
  else if(f==='d' || f==='dx' || f==='unit' || f==='style') wkEdits[v][f] = val;
  else wkEdits[v][f] = Number(val);
  wkRepaintRow(v);
}
/* repaint only the lines that changed, or the field loses focus mid-type */
function wkRepaintRow(v){
  /* a number set across the whole workout changes every line in it */
  if(String(v).charAt(0)==='*'){
    const all=document.querySelectorAll('[id^="wk-"]');
    for(let i=0;i<all.length;i++){
      const id=all[i].id.slice(3);
      if(id && id.charAt(0)!=='*') all[i].textContent=wkRowLen(id);
    }
  }
  const row=document.getElementById('wk-'+v);
  if(row) row.textContent=wkRowLen(v);
  const tot=document.getElementById('wkTotal');
  if(tot) tot.textContent=wkStageLine();
  const bt=document.getElementById('wkBandTotal');
  if(bt && wkBand) bt.innerHTML=wkBandLengths(wkStage, wkBandNow(wkStage,wkBand).list);
  /* the Save button has to know there is something to save */
  const sv=document.getElementById('wkSaveBtn');
  if(sv){ const n=wkPending();
    sv.disabled=false; sv.style.opacity=1;
    sv.textContent='Save '+n+' change'+(n===1?'':'s'); }
}
function wkMerged(v){
  const base=Object.assign({}, (wkTiming||{})[v]||{}, wkEdits[v]||{});
  return wkBand ? Object.assign(base, wkBandNums(wkStage, wkBand, v)) : base;
}
/* everything waiting to be saved, wherever it is being held */
function wkPending(){
  let n=Object.keys(wkEdits).length + Object.keys(wkBandDirty).length
      + Object.keys(wkMixEdits).length;
  Object.keys(wkBandEdits).forEach(k=>{ n+=Object.keys(wkBandEdits[k]).length; });
  return n;
}
function wkDrill(v){
  const d=wkMerged(v);
  return { v, n:(libIndex||{})[v]||v, d:d.d||FREE_DOSE[v]||'3 × 8',
           w:d.w, r:d.r, sets:d.sets, amt:d.amt, unit:d.unit };
}
/* what a row is running at, stated where stated and read off the dose where
   not, so the fields open showing the truth rather than empty */
function wkNums(v, grp){
  const it=wkDrill(v);
  const a=lhaAmount(it);
  const warm=/warm|mobility|wrist/i.test(String(grp||''));
  return {
    it,
    sets: (it.sets!=null) ? it.sets : (warm ? 1 : (lhaSets(it.d)>1?lhaSets(it.d):3)),
    amt:  a.n, unit: a.unit,
    w:    (it.w!=null) ? it.w : lhaWork(it, grp||''),
    r:    (it.r!=null) ? it.r : lhaRest(it, grp||''),
    warm
  };
}
/* one row's contribution, in seconds */
/* A warm-up was pinned to one pass here and in the app, so the set count was
   shown as a locked 1. The app gives a stated number now, up to four, so this
   counts what it will actually give. */
function wkSetsOf(n){
  const stated=Number(n.it.sets);
  if(Number.isFinite(stated) && stated>=1) return Math.min(Math.round(stated), n.warm?4:8);
  return n.warm ? 1 : Math.max(1, n.sets);
}
function wkRowSecs(v, grp){
  const n=wkNums(v, grp);
  const sets=wkSetsOf(n);
  return sets*n.w + Math.max(0, sets-1)*n.r;
}
function wkRowLen(v){
  const grp=(wkPoolFor(wkStage).find(x=>x.v===v)||{}).g||'';
  const n=wkNums(v, grp);
  const sets=wkSetsOf(n);
  const mins=Math.round(wkRowSecs(v, grp)/60*10)/10;
  return (n.w?`${sets} × ${n.w}s`:`${sets} × untimed`)
    + ` · ${n.r}s rest · ${mins} min`;
}
function wkStageLine(){
  const week=WEEK[wkStage];
  if(!week) return 'This stage has no written week yet, so a session is built from the whole pool.';
  return week.map((day,i)=>{
    const ids=[]; (day.focus||[]).forEach(g=>(POOL[wkStage]||[]).filter(x=>x.g===g)
      .forEach(x=>{ if(ids.indexOf(x.v)<0) ids.push(x.v); }));
    const groups=[{name:day.n, items:ids.map(v=>wkDrill(v))}];
    return `${day.n}: ${lhaMins(lhaSessionSecs(groups))} min`;
  }).join('  ·  ');
}
function wkSave(){
  if(wkBusy) return;
  /* the line they read is written from the numbers and sent with them, so
     nothing downstream has to know how it was worded */
  const grpOf=v=>(wkPoolFor(wkStage).find(x=>x.v===v)||{}).g||'';
  const rows=Object.keys(wkEdits).map(v=>
    Object.assign({v}, wkMerged(v), {d:wkDoseText(v, grpOf(v))}));
  if(!rows.length) return;
  wkBusy=true; draw();
  fetch(API+'/timing',{method:'POST',headers:hdr(),body:JSON.stringify({timing:rows})})
    .then(r=>r.ok?r.json():Promise.reject('the server said '+r.status))
    .then(d=>{ wkTiming=d.timing||{}; wkEdits={}; wkBusy=false; draw(); })
    .catch(e=>{ wkBusy=false; alert(String(e)); draw(); });
}
/* ── the review tool ─────────────────────────────────────────────
   Elliott's own tool, kept as its own file and mounted in a same-origin
   iframe rather than folded into this one. It is 1,700 lines with its own
   CSS and a full-screen layout, and this page is one inline script where a
   single syntax error takes the whole dashboard down. An iframe also means
   the tool still works on its own, which is how it was built.

   Clips reach it by postMessage. A clip a client sent is a Cloudflare
   Stream uid, and the tool needs a URL it can paint onto a canvas without
   tainting it, which /coach/clip works out. */
let reviewQueue=[], reviewReady=false, reviewBusy='';

function reviewFrame(){ const f=document.getElementById('reviewFrame'); return f&&f.contentWindow; }
function reviewPost(clip){
  const w=reviewFrame(); if(!w) return false;
  w.postMessage({type:'lha-review-clip', url:clip.src, title:clip.title}, location.origin);
  return true;
}
window.addEventListener('message', e=>{
  if(e.origin!==location.origin || !e.data || e.data.type!=='lha-review-ready') return;
  reviewReady=true;
  /* anything queued while the tool was still parsing */
  reviewQueue.filter(c=>c.src && !c.sent).forEach(c=>{ if(reviewPost(c)) c.sent=true; });
});

/* Send a client's clip to the tool. The uid is all the dashboard has; the
   server turns it into something the canvas can read. */
/* several at once: every clip in a submission, or everything a client has
   sent, loaded into the review tool together so one recording can walk
   through all of them and go back as one reply */
function reviewClips(email, uids, name, titles){
  const list=(uids||[]).filter(Boolean);
  if(!list.length) return;
  reviewFor=email;
  /* name each one by what it is. "clip 4 of 6" is no help at all when you
     are six clips into a recording trying to remember which is which. */
  list.forEach((u,i)=>reviewClip(u, (titles&&titles[u])
    || ((name||'Client')+' · clip '+(i+1)+' of '+list.length)));
}
/* This built its own list from submissions and the thread and never looked
   at check point clips, which is most of what a client actually films.
   clipRows knows about all three. */
function reviewAllFrom(email){
  const name=(clients.find(c=>c.email===email)||{}).name||'Client';
  const rows=clipRows(email);
  if(!rows.length) return alert('Nothing from them yet.');
  const first=(name||'').split(' ')[0]||'Client';
  const titles={};
  rows.forEach(r=>{ titles[r.uid]=first+' · '+(r.which||r.what)+' · '+dayLabel(dayKey(r.at||0)); });
  const uids=rows.slice().sort((a,b)=>(a.at||0)-(b.at||0)).map(r=>r.uid);
  reviewClips(email, uids, name, titles);
}
/* who the recording goes back to */
let reviewFor='';
function reviewClip(uid, title){
  uid=String(uid||''); if(!uid) return;
  const have=reviewQueue.find(c=>c.uid===uid);
  if(have && have.src){ view='review'; draw(); setTimeout(()=>reviewPost(have),0); return; }
  const row={uid, title:title||'Client clip', src:'', sent:false};
  if(!have) reviewQueue.push(row);
  reviewBusy=uid; view='review'; draw();
  fetch(API+'/clip?uid='+encodeURIComponent(uid),{headers:hdr()})
    .then(r=>r.json().then(d=>r.ok?d:Promise.reject(d.error||('the server said '+r.status))))
    .then(d=>{
      const c=reviewQueue.find(x=>x.uid===uid)||row;
      c.src=d.src; reviewBusy='';
      if(reviewReady && reviewPost(c)) c.sent=true;
      draw();
    })
    .catch(err=>{ reviewBusy=''; const c=reviewQueue.find(x=>x.uid===uid);
      if(c) c.error=String(err); draw(); });
}
function reviewDrop(uid){
  reviewQueue=reviewQueue.filter(c=>c.uid!==uid); draw();
}

/* ── their app, as they see it ───────────────────────────────────────
   Describing a bug on somebody's screen is slower than looking at it, and
   half the faults in this app only appear for one person's data. This is
   their own app, in an iframe, running on a token that names them and can
   only read: the server refuses it on anything that is not a GET, so
   nothing here can touch their account.
   Anything the page logs to the console comes back out to the panel, so a
   script error on their data is visible rather than silent. */

      const f=document.getElementById('prevFrame');

      paintPreview();

}
function closePreview(){

function previewHost(){

    +'gap:10px;background:var(--surface,#f7f4f1);border-bottom:1px solid var(--line)"></div>'
    +'<div style="flex:1;display:flex;justify-content:center;align-items:stretch;padding:14px;overflow:auto">'
    +'<iframe id="prevFrame" title="Their app" style="width:390px;max-width:100%;border:0;'
    +'border-radius:22px;background:#fff;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)"></iframe></div>'
    +'<div id="prevLog" style="flex:none;max-height:26vh;overflow:auto;background:#12100f;color:#f0d8d2;'
    +'font:400 11.5px/1.6 ui-monospace,monospace;padding:10px 14px"></div>';
  document.body.appendChild(w);
  /* anything the app logs while it is in there */
  window.addEventListener('message', e=>{
    if(e.origin!==location.origin || !e.data || e.data.type!=='lha-preview-error') return;
    prevErrs.push(String(e.data.text||'').slice(0,400));

}
function paintPreview(){
  const bar=document.getElementById('prevBar');
  if(bar) bar.innerHTML=`<button onclick="closePreview()" style="cursor:pointer;border:1px solid var(--line);
      background:#fff;border-radius:9px;padding:6px 11px;font:600 12px/1 var(--sans)">← Back</button>
    <span style="font:600 11px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">THEIR APP</span>
    <span style="font:600 13px/1 var(--sans)">${esc((clients.find(c=>c.email===prevEmail)||{}).name||prevEmail)}</span>
    <span style="font:400 12px/1 var(--sans);color:var(--grey2)">read only, nothing you do in here reaches them</span>
    <span style="flex:1"></span>

/* ── picking a client's clips, from inside the review tool ──────────
   Loading a review used to mean finding the client, scrolling their
   thread and their check points, and pressing Review on each clip one at
   a time. A client who films six check points in an evening is six trips
   through that, and the clips are in three different places: submissions,
   check point readings and the thread. This is the same job in one sheet:
   pick a client, tick a day, load the lot. */
let revPick={open:false, email:'', loading:false, chosen:{}};

/* every clip a client has sent, wherever it came from, newest first */
function clipRows(email){
  const out=[], seen={};
  const add=r=>{ if(!r.uid || seen[r.uid]) return; seen[r.uid]=1; out.push(r); };
  const defs=(cpDefs[email]||[]);
  const cpName=k=>{ const d=defs.find(x=>x&&x.k===k); return (d&&d.n)||k; };
  /* check point clips: what a client films most, and the one source the
     old "everything from them" button did not look at */
  const cps=((tracks[email]||{}).checkpoints)||{};
  Object.keys(cps).forEach(k=>(cps[k]||[]).forEach(r=>{
    if(r && r.video) add({uid:r.video, at:r.at||0, what:'Check point',
      which:cpName(k), done:!!r.verdict}); }));
  (subs[email]||[]).forEach(sb=>{
    const what = sb.kind==='assessment' ? 'Form check'
      : sb.kind==='checkpoint' ? 'Check point' : 'Two-week test';
    (sb.clips||[]).forEach(c=>{
      const uid = typeof c==='string' ? c : (c&&(c.uid||c.video));
      add({uid, at:sb.at||0, what, which:(sb.numbers&&sb.numbers.name)||'',
           done:sb.status==='reviewed'}); }); });
  /* and anything they simply sent in the thread, which is only loaded for
     whoever is open, so it is a bonus rather than the basis */
  if(email===sel) thread.forEach(m=>{ if(m.from!=='coach' && m.video)
    add({uid:m.video, at:m.at||0, what:'Sent in the thread', which:'', done:false}); });
  return out.sort((a,b)=>(b.at||0)-(a.at||0));
}
/* dayKey is already defined above, for the calendar */
function dayLabel(k){
  const d=new Date(k+'T12:00:00'), now=new Date();
  const days=Math.round((new Date(dayKey(now)+'T12:00:00')-d)/86400000);
  if(days===0) return 'Today';
  if(days===1) return 'Yesterday';
  const when=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  return days<7 ? when : d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:
    d.getFullYear()===now.getFullYear()?undefined:'numeric'});
}
function revPickOpen(email){
  revPick={open:true, email:email||'', loading:false, chosen:{}};
  if(email) revPickLoad(email);
  revPickPaint();
}
function revPickClose(){ revPick.open=false; revPickPaint(); }
/* a client the coach has not opened this session has none of their data
   cached, so fetch the two that hold clips before drawing the list */
function revPickLoad(email){
  revPick.email=email; revPick.chosen={};
  const need=[];
  if(!subs[email]) need.push(fetch(API+'/submissions?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():null).then(d=>{ if(d) subs[email]=d.submissions||[]; }));
  if(!tracks[email]) need.push(fetch(API+'/progress?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():null).then(d=>{ if(d){ tracks[email]=d.track||null;
      if(!cpDefs[email]) cpDefs[email]=d.checkpoints||[]; } }));
  if(!need.length){ revPickPaint(); return; }
  revPick.loading=true; revPickPaint();
  Promise.all(need).catch(()=>{}).then(()=>{ revPick.loading=false; revPickPaint(); });
}
function revPickToggle(uid){
  if(revPick.chosen[uid]) delete revPick.chosen[uid]; else revPick.chosen[uid]=1;
  revPickPaint();
}
/* the whole day at once, which is the thing he is actually trying to do */
function revPickDay(key){
  const rows=clipRows(revPick.email).filter(r=>dayKey(r.at||0)===key);
  const allOn=rows.every(r=>revPick.chosen[r.uid]);
  rows.forEach(r=>{ if(allOn) delete revPick.chosen[r.uid]; else revPick.chosen[r.uid]=1; });
  revPickPaint();
}
function revPickGo(){
  const rows=clipRows(revPick.email).filter(r=>revPick.chosen[r.uid]);
  if(!rows.length) return;
  const name=(clients.find(c=>c.email===revPick.email)||{}).name||'Client';
  const first=(name||'').split(' ')[0]||'Client';
  const titles={};
  rows.forEach(r=>{ titles[r.uid]=first+' · '+(r.which||r.what)+' · '+dayLabel(dayKey(r.at||0)); });
  revPick.open=false; revPickPaint();
  /* oldest first, so a recording walks forwards through what they sent */
  const uids=rows.slice().sort((a,b)=>(a.at||0)-(b.at||0)).map(r=>r.uid);
  reviewClips(revPick.email, uids, name, titles);
}
function revPickHost(){
  const wrap=document.getElementById('reviewWrap');
  if(!wrap) return null;
  let host=document.getElementById('pickHost');
  if(host) return host;
  host=document.createElement('div');
  host.id='pickHost';

     frame reloads it and takes the clips and any recording with it */
  host.style.cssText='position:absolute;inset:0;z-index:5;display:none';
  wrap.style.position='fixed';
  wrap.appendChild(host);
  return host;
}
function revPickPaint(){

  host.style.display='block';

  } else if(revPick.loading){

  } else {
    const rows=clipRows(revPick.email);
    const days=[]; const by={};
    rows.forEach(r=>{ const k=dayKey(r.at||0); if(!by[k]){ by[k]=[]; days.push(k); } by[k].push(r); });
    const n=Object.keys(revPick.chosen).length;
    body = !rows.length
      ? `<div style="font:400 13px/1.5 var(--sans);color:var(--grey);padding:20px 0">
          Nothing from them yet.</div>`
      : `<div style="display:flex;flex-direction:column;gap:14px">
        ${days.map(k=>{
          const all=by[k].every(r=>revPick.chosen[r.uid]);
          return `<div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;
              padding-bottom:6px;border-bottom:1px solid var(--line)">

                text-transform:uppercase">${esc(dayLabel(k))} · ${by[k].length}</span>
              <button onclick="revPickDay('${k}')" style="cursor:pointer;border:0;background:none;
                padding:2px 0;font:600 12px/1 var(--sans);color:var(--forest)">${
                all?'Clear the day':'Select the day'}</button>
            </div>
            ${by[k].map(r=>`<button onclick="revPickToggle('${esc(r.uid)}')"
              style="cursor:pointer;width:100%;text-align:left;border:0;background:none;padding:9px 0;
              display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)">
              <span style="flex:none;width:19px;height:19px;border-radius:6px;display:grid;
                place-items:center;font:700 11px/1 var(--sans);color:#fff;
                background:${revPick.chosen[r.uid]?'var(--forest)':'transparent'};
                border:1.5px solid ${revPick.chosen[r.uid]?'var(--forest)':'var(--line)'}">${
                revPick.chosen[r.uid]?'✓':''}</span>
              <span style="flex:1;min-width:0">

                    .toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}))}${

          </div>`;}).join('')}
      </div>`;
    body += `<div style="position:sticky;bottom:0;padding-top:12px;background:var(--bg)">
      <button onclick="revPickGo()" ${n?'':'disabled'} style="width:100%;cursor:${n?'pointer':'default'};

  }
  host.innerHTML=`<div onclick="if(event.target===this)revPickClose()"
      style="position:absolute;inset:0;background:rgba(10,20,18,.5);display:flex;

      <div style="width:100%;max-width:520px;background:var(--bg);border-radius:16px;
        padding:16px 18px 18px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="font:400 19px/1.15 var(--serif)">${revPick.email
            ? esc((clients.find(c=>c.email===revPick.email)||{}).name||revPick.email)+'&rsquo;s clips'
            : 'Add clips'}</div>
          <div style="display:flex;gap:8px;align-items:center">
            ${revPick.email?`<button onclick="revPick.email='';revPick.chosen={};revPickPaint()"
              style="cursor:pointer;border:0;background:none;padding:4px;font:600 12px/1 var(--sans);
              color:var(--forest)">Someone else</button>`:''}
            <button onclick="revPickClose()" style="cursor:pointer;border:0;background:none;padding:4px;
              font-size:20px;line-height:1;color:var(--grey2)">×</button>

/* The iframe is mounted once, outside #v, and never moves. draw() replaces
   the whole of #v on every keystroke, and an iframe that is re-created, or

let exKeyEdits={}, exKeyStore=null, exKeyBusy=false;

/* ── the three workouts, as lists ──────────────────────────────────
   The tab tuned dose and rest, and what was actually in a session came
   from each drill's level and the share BAND_MIX gives that level. So the
   only way to change what was in Harder was to move a drill between levels
   and then work out what that did to Easier and Standard.

   These are the three sessions written out instead. A list wins over the
   shares for that stage and that band, and a stage with no list carries on
   as it did, so they can be done one at a time.

   Order is the coach's: a short session takes from the top. */
let wkBands={}, wkBand=0, wkBandDirty={}, wkBandBusy=false, wkAdd=false, wkAddQ='';
/* a drill added from the wider library is not on the stage, and the app
   builds a session out of the stage's pool, so it has to be put there or it
   is dropped on the way through without a word. The grouping decides the
   rest between sets, so it is asked for rather than assumed. */
let wkNewGrp={};
/* POOL is the shipped file. The coach can add a drill to a stage, which lands
   in settings, and the app merges the two before it builds anything. This tab
   has to see the same pool or it will keep calling a drill new. */
let wkExtra={};
function wkPoolFor(stage){
  /* POOL is the level and grouping table, and it was only ever written for
     the first three stages. Take-Off, Freestanding and Press have drills,
     they simply have no levels: this tab read POOL alone and so showed those
     three stages as empty when the app was building sessions from them.
     They come in with no level, which is the truth and is now something that
     can be set here row by row. */
  let base=POOL[stage]||[];
  if(!base.length){
    base=(((typeof STAGES!=='undefined' && STAGES[stage])||{}).drillIds||[])
      .map(v=>({v, g:'Strength', L:0}));
  }
  const extra=(wkExtra[stage]||wkExtra[String(stage)]||[])
    .filter(x=>x&&x.v).map(x=>({v:x.v, g:x.g||'Strength', L:Math.max(1,Math.min(4,x.L||1))}));
  if(!extra.length) return base;
  const by={}; extra.forEach(x=>{ by[x.v]=x; });
  const out=base.map(row=>by[row.v]||row);
  const seen=new Set(base.map(x=>x.v));
  return out.concat(extra.filter(x=>!seen.has(x.v)));
}
/* ── one row at a time ─────────────────────────────────────────────

   select the 3 in, and type a 4 over. The arrows do it in one tap, the
   box is still there to type into, and 16px is the size iOS stops
   zooming the page in to reach. */
const WK_STEP={sets:1, amt:1, w:5, r:5};
function wkNumBox(v,f,val,ph,w,grp){
  const id='wkf-'+f+'-'+String(v).replace(/[^a-z0-9*-]/g,'');
  const b='width:30px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line);'

      placeholder="${ph}" oninput="wkSet('${v}','${f}',this.value)"
      style="border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;
      font:600 16px/1 var(--sans);background:#fff;width:${Math.max(56,w)}px">

      style="${b}">&plus;</button></span>`;
}
/* one tap up or down, from whatever the row is running at now, stated or
   inherited, so the first tap never jumps to a number nobody chose */
function wkStep(v,f,dir,grp){
  const step=WK_STEP[f]||1;
  let cur;
  if(String(v).charAt(0)==='*'){
    const own=wkBandNums(wkStage, wkBand, v)[f];
    cur = own!=null ? Number(own)
      : (f==='sets'?3 : f==='amt'?8 : f==='w'?30 : 45);
  }else{
    const n=wkNums(v, grp||'');
    cur = f==='sets' ? wkSetsOf(n) : f==='amt' ? n.amt : f==='w' ? n.w : n.r;
  }
  const lo=(f==='sets'||f==='amt')?1:0;
  const next=Math.max(lo, Math.round((Number(cur)||0) + step*dir));
  wkSet(v,f,String(next));
  const box=document.getElementById('wkf-'+f+'-'+String(v).replace(/[^a-z0-9*-]/g,''));
  if(box) box.value=next;

/* ── dragging ──────────────────────────────────────────────────────
   Arrows move a drill one place at a time, which is fine for a nudge and
   hopeless for moving something from the bottom to the top of thirty. */
let wkDragV=null;
function wkDragStart(e,v){
  wkDragV=v;
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',v); }catch(err){}
}
function wkDragOver(e,v){
  if(!wkDragV || v===wkDragV) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect='move'; }catch(err){}
  const el=e.currentTarget;
  if(el) el.style.boxShadow='inset 0 3px 0 var(--forest)';
}
function wkDragLeave(e){ const el=e.currentTarget; if(el) el.style.boxShadow=''; }
function wkDragEnd(){
  wkDragV=null;

}
function wkDropOn(e,v){
  e.preventDefault();

  const cur=wkBandNow(wkStage,wkBand).list;
  const i=cur.indexOf(from), j=cur.indexOf(v);
  if(i<0||j<0) return;
  cur.splice(i,1);
  cur.splice(cur.indexOf(v) + (i<j?1:0), 0, from);
  wkBandEdit(wkStage,wkBand,cur);
}
/* ── how a dose is said ────────────────────────────────────────────
   There were two ways to say the same thing: five numbers, and a free text
   box the numbers were also parsed out of when they were blank. You could
   type 1 in SETS and leave the text reading "3 × 8", and the app would give
   one set while telling the person three. The numbers are the fact now and
   the sentence is written from them. */
const DOSE_STYLES=[
  ['straight','Straight sets'],
  ['buildto','Build to'],
  ['failure','To failure'],
  ['eachside','Each side'],
  ['maxhold','Max hold']
];
function wkStyleOf(v, n){
  if(n.it.style) return n.it.style;
  /* what an existing hand-typed dose was trying to say */
  const d=String(n.it.d||'');
  if(/max hold/i.test(d)) return 'maxhold';
  if(/failure/i.test(d)) return 'failure';
  if(/build to/i.test(d)) return 'buildto';
  if(/each (way|side|leg|arm)/i.test(d)) return 'eachside';
  return 'straight';

/* the line the person in the app reads: the coach's own words where they
   have written any, otherwise written from the numbers */
function wkDoseText(v, grp){
  const own=String((wkNums(v,grp).it.dx)||'').trim();
  if(own) return own;
  return wkDoseAuto(v, grp);
}
function wkDoseAuto(v, grp){
  const n=wkNums(v, grp);
  const sets=wkSetsOf(n);
  const unit=(n.it.unit!=null)?n.it.unit:n.unit;
  const amt=(n.it.amt!=null)?n.it.amt:n.amt;
  const style=wkStyleOf(v,n);
  const each = unit==='s' ? (amt||30)+'s' : String(amt||8);
  if(unit==='f' || style==='failure') return sets>1 ? sets+' × to failure' : 'To failure';
  if(style==='maxhold') return sets>1 ? sets+' × max hold' : 'Max hold';
  if(style==='buildto') return 'Build to '+each;
  const straight = sets>1 ? sets+' × '+each : each;
  return style==='eachside' ? straight+' each side' : straight;
}
/* Nobody has written a dose for this one, so it is running on the fallback,

  const saved=(wkTiming||{})[v]||{};
  const pend=wkEdits[v]||{};
  if(saved.d || pend.d || saved.amt!=null || pend.amt!=null) return false;
  return !(typeof FREE_DOSE!=='undefined' && FREE_DOSE[v]);
}
/* ── the ladder's own check points ─────────────────────────────────

   before the next stage opens. The list shipped in a file and the only way
   to change a target, a wording, or the drill the demo comes from was a

let wkCpsData=null, wkCpWork={}, wkCpBusy=false;
function wkCpsLoad(){
  if(wkCpsData) return;

const wkCpShipped = stage => (CHECKPOINTS[stage]||[]);
function wkCpsMerged(stage){
  const over=(wkCpsData||{})[stage]||(wkCpsData||{})[String(stage)]||{};
  const edits=over.edit||{}, gone=over.off||[], extra=over.add||[];
  const out=[];
  wkCpShipped(stage).forEach(c=>{
    if(gone.indexOf(c.k)>-1) return;
    out.push(Object.assign({}, c, edits[c.k]||{}));
  });
  extra.forEach(c=>{ if(c&&c.k&&!out.some(x=>x.k===c.k)) out.push(Object.assign({},c)); });
  if(Array.isArray(over.order)&&over.order.length){
    const at=v=>{ const i=over.order.indexOf(v); return i<0?999:i; };

}

function wkCpSave(stage){

  const byK={}; shipped.forEach(c=>{ byK[c.k]=c; });
  const edit=[], add=[], off=[], order=list.map(c=>c.k);
  list.forEach(c=>{
    const base=byK[c.k];

    /* only what differs from the shipped one, so a later change to the file
       still reaches anything the coach has not touched */
    const diff={k:c.k};

function wkGrpSet(v,g){ wkNewGrp[v]=g; draw(); }
/* The level a drill sits at inside this stage. It decides which share picks
   it up, so a drill added to a stage with no level was invisible to the
   shares and only ever turned up as a spare. */
function wkLvlSet(v,L){ if(!L) return; wkNewLvl[v]=Number(L)||1; draw(); }
function wkLvlOf(stage, v){
  if(wkNewLvl[v]) return Number(wkNewLvl[v]);
  return Number((wkPoolFor(stage).find(x=>x.v===v)||{}).L) || 0;
}
function wkStageGroups(stage){
  const out=[];
  wkPoolFor(stage).forEach(x=>{ if(x.g && out.indexOf(x.g)<0) out.push(x.g); });
  ['Warm-up','Strength','Mobility'].forEach(g=>{ if(out.indexOf(g)<0) out.push(g); });
  return out;
}
let wkBandsLoaded=false, wkBandsErr='';
/* This used to swallow a failure whole: one bad response and the tab drew
   rows whose drill picker had nothing in it, with nothing anywhere saying
   why. It now says so, and a redraw tries again rather than latching. */
function wkBandsLoad(){
  if(wkBandsLoaded) return; wkBandsLoaded=true;
  fetch(API+'/bands',{headers:hdr()})
    .then(r=>r.ok?r.json():Promise.reject('the server said '+r.status))
    .then(d=>{ if(!d) return; wkBandsErr='';
      if(d.bands) wkBands=d.bands;
      if(d.ladderExtra) wkExtra=d.ladderExtra;
      if(d.ladderMix) wkMix=d.ladderMix;
      if(d.bandTiming) wkBandTiming=d.bandTiming;
      /* the picker shows names, and libIndex was only ever filled by opening
         a client's programme, so this tab showed raw ids until you had */
      noteLibrary(d.library);
      draw(); })
    .catch(e=>{ wkBandsErr=String(e); draw(); });
}
function wkBandsRetry(){ wkBandsLoaded=false; wkBandsErr=''; draw(); }
/* what is in this band right now: the coach's list where there is one,
   otherwise what the shares would build, so the first thing they see is
   the session the app is giving today rather than an empty box */
function wkBandList(stage, band){
  const own=((wkBands[String(stage)]||{})[String(band)]);
  if(Array.isArray(own) && own.length) return {list:own.slice(), written:true};
  const pool=wkPoolFor(stage);
  const mix=wkMixNow(stage,band)||{};
  const levelled=pool.filter(x=>x.L && (mix[x.L]||0)>0);
  /* a stage with no levels yet would otherwise show nothing at all, which is
     what it did, so the whole of it stands in until the levels are set */
  const out=(levelled.length?levelled.slice().sort((a,b)=>a.L-b.L):pool.slice())
    .map(x=>x.v);
  return {list:out, written:false};
}
function wkBandNow(stage, band){
  const k=stage+':'+band;
  if(wkBandDirty[k]) return {list:wkBandDirty[k].slice(), written:true, dirty:true};
  return wkBandList(stage, band);
}
function wkBandEdit(stage, band, list){
  wkBandDirty[stage+':'+band]=list; draw();
}
function wkBandMove(stage, band, v, by){
  const cur=wkBandNow(stage,band).list;
  const i=cur.indexOf(v), j=i+by;
  if(i<0 || j<0 || j>=cur.length) return;
  cur.splice(j,0,cur.splice(i,1)[0]);
  wkBandEdit(stage,band,cur);
}
/* swap one exercise for another, keeping its place in the order. The
   numbers belong to the drill, not the slot, so the new one arrives with
   its own and the old one keeps whatever it had for wherever else it is
   used. */
function wkSwap(stage, band, from, to){
  if(!to || to===from) return;
  const cur=wkBandNow(stage,band).list;
  const i=cur.indexOf(from);
  if(i<0) return;
  if(cur.indexOf(to)>-1 && cur.indexOf(to)!==i){ alert('That drill is already in this workout.'); draw(); return; }
  /* A drill swapped into a slot takes the grouping of the one it replaced.
     Everything new defaulted to Strength, so putting one warm-up in place of
     another filed it as strength work: the app's warm-up never touched it and
     the session opened exactly as before. The grouping decides the rest
     between sets as well, so it was wrong twice. */
  const pool=wkPoolFor(stage);
  const was=(pool.find(x=>x.v===from)||{}).g;
  const has=pool.find(x=>x.v===to);
  if(was && (!has || wkIsExtra(stage,to))) wkNewGrp[to]=was;
  cur[i]=to;
  wkBandEdit(stage,band,cur);
}
/* a drill the coach put on this stage, as opposed to one the workbook ships:
   its grouping is theirs to change, the shipped ones are not */
function wkIsExtra(stage, v){
  return (wkExtra[stage]||wkExtra[String(stage)]||[]).some(x=>x&&x.v===v);
}
function wkBandDrop(stage, band, v){
  wkBandEdit(stage, band, wkBandNow(stage,band).list.filter(x=>x!==v));
}
function wkBandAdd(stage, band, v){
  const cur=wkBandNow(stage,band).list;
  if(cur.indexOf(v)<0) cur.push(v);
  wkAdd=false; wkAddQ='';
  wkBandEdit(stage,band,cur);
}
function wkBandReset(stage, band){
  if(!confirm('Put '+BAND_NAME[band]+' back to the levels?\n\nThe list you wrote is deleted and the app builds this one from the difficulty shares again.')) return;
  wkBandDirty[stage+':'+band]=[];
  wkBandSave();
}
/* the list and the numbers, in that order, because a drill swapped into a
   list has to exist on the stage before its numbers mean anything */
function wkSaveAll(){
  if(wkBandBusy||wkBusy) return;
  if(wkBandKeys().length) wkBandSave(); else wkSave();
}
/* every stage and band with something waiting: a changed list, changed
   numbers of its own, or changed shares */
function wkBandKeys(){
  const out=[];
  const add=k=>{ if(out.indexOf(k)<0) out.push(k); };
  Object.keys(wkBandDirty).forEach(add);
  Object.keys(wkBandEdits).forEach(k=>{
    if(Object.keys(wkBandEdits[k]||{}).length) add(k); });
  Object.keys(wkMixEdits).forEach(add);
  return out;
}
function wkBandSave(){
  if(wkBandBusy) return;
  if(!wkBandKeys().length) return;
  wkBandBusy=true; draw();
  const next=()=>{
    const k=wkBandKeys()[0];
    if(!k){ wkBandBusy=false;
      /* the numbers go next, so one press clears the whole row */
      if(Object.keys(wkEdits).length) wkSave(); else draw();
      return; }
    const [stage,band]=k.split(':');
    /* a list is only sent when it has been changed: sending the one on
       screen would turn a stage still built from the shares into a written
       one just because its shares were nudged */
    const list=wkBandDirty[k] || null;
    const pool=wkPoolFor(Number(stage));
    const here=new Set(pool.map(x=>x.v));
    const grpOf=v=>(pool.find(x=>x.v===v)||{}).g;
    /* anything in the list the stage does not already have goes onto it, and
       anything already on it whose grouping has been changed goes with them,
       or moving a drill into the warm-up saved the list and lost the move */
    const lvlOf=v=>(pool.find(x=>x.v===v)||{}).L;
    const onStage=(list||[])
      .filter(v=>!here.has(v)
        || (wkNewGrp[v] && wkNewGrp[v]!==grpOf(v))
        || (wkNewLvl[v] && Number(wkNewLvl[v])!==lvlOf(v)))
      .map(v=>({v, g:wkNewGrp[v]||grpOf(v)||'Strength',
                L:Number(wkNewLvl[v]||lvlOf(v)||2)}));
    const body={stage:Number(stage), band:Number(band), onStage};
    if(list) body.list=list;
    if(wkBandEdits[k] && Object.keys(wkBandEdits[k]).length){
      const bt={};
      Object.keys(wkBandEdits[k]).forEach(v=>{
        bt[v]= v.charAt(0)==='*'
          ? Object.assign({}, wkBandEdits[k][v])
          : Object.assign({}, wkBandEdits[k][v], {d:wkDoseText(v, grpOf(v))});
      });
      body.bandTiming=bt;
    }
    if(wkMixEdits[k]) body.mix=wkMixFor(Number(stage));
    fetch(API+'/bands',{method:'POST',headers:hdr(),body:JSON.stringify(body)})
      .then(r=>r.ok?r.json():Promise.reject('the server said '+r.status))
      .then(d=>{ wkBands=d.bands||wkBands;
        /* POOL is the shipped file; ladderExtra is what the coach has added.
           Fold it in so the row stops saying the drill is not on the stage. */
        if(d.ladderExtra) wkExtra=d.ladderExtra;
        if(d.ladderMix) wkMix=d.ladderMix;
        if(d.bandTiming) wkBandTiming=d.bandTiming;
        delete wkBandDirty[k]; delete wkBandEdits[k]; delete wkMixEdits[k];
        next(); })
      .catch(e=>{ wkBandBusy=false; alert(String(e)); draw(); });
  };
  next();
}
/* what a session of each length actually takes from this list */
/* What each length actually comes to, from the rows as they now stand.
   It used to hand the drills to the shared session clock, which does not
   know about a row whose seconds or rest the coach has just changed and
   not yet saved. This adds the same numbers the rows are showing. */
/* What a session of each length takes out of this list. The list is a pool,
   so a session is a handful of it, not all of it: the shares and the spread
   decide which handful, and the time decides how many and how many sets.
   A quarter of an hour is one set of each whatever the numbers say. */
function wkBandLengths(stage, list){
  const pool=wkPoolFor(stage);
  const warmish=v=>/warm|mobility|wrist/i.test(String((pool.find(x=>x.v===v)||{}).g||''));
  const skill=list.filter(v=>!warmish(v));
  const grpOf=v=>(pool.find(x=>x.v===v)||{}).g||'';
  /* one set of a drill, and the rest after it */
  const oneSet=v=>{ const n=wkNums(v, grpOf(v)); return n.w + n.r; };
  const setsOf=v=>wkSetsOf(wkNums(v, grpOf(v)));
  const warmSecs=list.filter(warmish).reduce((t,v)=>t+wkRowSecs(v, grpOf(v)),0);
  const avg = arr => arr.length ? arr.reduce((t,x)=>t+x,0)/arr.length : 0;
  return [15,30,45].map(mins=>{
    const wantN = mins>=45 ? 10 : mins>=30 ? 8 : 6;
    const n=Math.min(wantN, skill.length);
    const per=avg(skill.map(oneSet));
    const sets=mins<30 ? 1 : avg(skill.map(setsOf));
    const secs=warmSecs + n*per*sets;
    const over=secs > mins*60*1.12;
    return '<span style="white-space:nowrap;'+(over?'color:var(--terra)':'')+'">'
      + mins + ' min: ' + n + ' drill' + (n===1?'':'s')
      + (mins<30 ? ', one set each' : ', ' + (Math.round(sets*10)/10) + ' sets each')
      + ', about ' + Math.round(secs/60) + ' min' + (over?' (over)':'') + '</span>';
  }).join('<span style="color:var(--grey2)">  ·  </span>');
}

              style="${btn};color:var(--forest)">${open?'&minus;':'&plus;'}</button>
            <button onclick="wkBandDrop(${wkStage},${wkBand},'${v}')" aria-label="Remove"
              style="${btn};color:var(--terra)">&times;</button>
          </span>
        </div>
        ${!open?'':`
        <div style="display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin-top:9px">
          ${fld('SETS', num(v,'sets',it.sets!=null?it.sets:n.sets,n.warm?'1':'3',62,row?row.g:''))}
          ${fld('BUILD TO', num(v,'amt',it.amt!=null?it.amt:n.amt,'8',72,row?row.g:''))}
          ${fld('IN', (function(){ const u=(it.unit!=null?it.unit:n.unit);
            return `<select onchange="wkSet('${v}','unit',this.value)"
              style="${inp};width:110px">
              <option value=""${u===''?' selected':''}>reps</option>
              <option value="s"${u==='s'?' selected':''}>seconds</option>
              <option value="f"${u==='f'?' selected':''}>to failure</option>
            </select>`; })())}
          ${fld('SECONDS TO DO IT', num(v,'w',it.w!=null?it.w:n.w,String(n.w),86,row?row.g:''))}
          ${fld('REST', num(v,'r',it.r!=null?it.r:n.r,String(n.r),66,row?row.g:''))}
          <span style="flex:1;min-width:120px;text-align:right;font:500 11.5px/1.4 var(--sans);
            color:var(--grey)" id="wk-${v}">${wkRowLen(v)}</span>
        </div>
        <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:8px">
          <span style="font:600 8.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">
            SAID AS</span>
          <select onchange="wkSet('${v}','style',this.value)"
            style="${inp};flex:none;width:auto;padding:6px 8px;font-size:11.5px">
            ${DOSE_STYLES.map(([k,lab])=>`<option value="${k}"${
              wkStyleOf(v,n)===k?' selected':''}>${esc(lab)}</option>`).join('')}
          </select>
          <input value="${esc(it.dx||'')}" oninput="wkSet('${v}','dx',this.value)"
            title="Leave it empty and the line is written from the numbers"
            placeholder="${esc(wkDoseAuto(v, row?row.g:''))}"
            style="${inp};flex:1;min-width:150px">
          <select onchange="wkGrpSet('${v}',this.value)" title="Which part of the session"
            style="${inp};flex:none;width:auto;padding:6px 8px;font-size:11.5px">
            ${wkStageGroups(wkStage).map(g=>`<option value="${esc(g)}"${
              (wkNewGrp[v]||(row&&row.g)||'Strength')===g?' selected':''}>${esc(g)}</option>`).join('')}
          </select>
          ${(function(){ const L0=wkLvlOf(wkStage,v);
            return `<select onchange="wkLvlSet('${v}',this.value)" title="How hard, inside this stage"
              style="${inp};flex:none;width:auto;padding:6px 8px;font-size:11.5px;${
                L0?'':'border-color:var(--terra);color:var(--terra)'}">
              ${L0?'':'<option value="" selected>no level yet</option>'}
              ${[1,2,3,4].map(L=>`<option value="${L}"${
                L0===L?' selected':''}>level ${L}</option>`).join('')}
            </select>`; })()}
          ${gone?`<span style="flex:none;font:400 11px/1.3 var(--sans);color:var(--terra)">
            not in the library</span>`:''}
          <span style="flex:none;display:flex;gap:4px;margin-left:auto">
            <button onclick="wkBandMove(${wkStage},${wkBand},'${v}',-1)" aria-label="Up"
              ${i?'':'disabled'} style="${btn};opacity:${i?1:.3}">&uarr;</button>
            <button onclick="wkBandMove(${wkStage},${wkBand},'${v}',1)" aria-label="Down"
              ${i<list.length-1?'':'disabled'} style="${btn};opacity:${i<list.length-1?1:.3}">&darr;</button>
          </span>
        </div>`}
      </div>`;}).join('');

    /* anything on this stage, then anything in the library at all, because
       a drill that belongs in a workout is not always already on the stage */
    const q=wkAddQ.trim().toLowerCase();
    const already=new Set(list);
    const grpIn={}; all.forEach(x=>{ grpIn[x.v]=x.g||'Strength'; });
    const cands=Object.keys(libIndex||{})
      .filter(v=>!already.has(v))
      .map(v=>({v, n:(libIndex||{})[v]||v, here:inPool.has(v),
                cat: grpIn[v] || 'Not on this stage yet'}))
      .filter(x=>!q || x.n.toLowerCase().indexOf(q)>-1 || x.v.indexOf(q)>-1)
      .sort((a,b)=>(b.here-a.here) || a.n.localeCompare(b.n))
      .slice(0, q?60:40);
    /* grouped, because "add an exercise" is nearly always "add another
       warm-up" or "add another strength drill", and one flat wall of pills
       makes you read all of them to find out which */
    const catOrder=wkStageGroups(wkStage).concat(['Not on this stage yet']);
    const cats=catOrder.filter(c=>cands.some(x=>x.cat===c));

    return `<div class="glass" style="padding:16px 18px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div>
          <div style="font:400 21px/1.1 var(--serif)">${esc(BAND_NAME[wkBand])}, ${esc(STAGES[wkStage].n)}</div>
          <div style="font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:4px;max-width:64ch">
            The pool this workout draws on, in your order. A session takes six
            to ten of them, keeping to the shares below and spreading across
            the groupings, and starts further down the list each time so
            nobody gets the same session twice running.
            ${st0.written
              ? 'This list is yours, and it is what the app draws on.'
              : 'Nothing written for this one yet, so what you see is the whole stage. Change anything and it becomes your list.'}
            It reaches the app on its next load. No deploy.</div>
        </div>
        ${(function(){
          /* a row carries the list it is in and the drill's own numbers, and
             they are stored in two different places. One button saves both,
             because nobody editing a workout thinks of them as two jobs. */
          const n=wkPending();
          const busy=wkBandBusy||wkBusy;
          return `<button id="wkSaveBtn" class="send" onclick="wkSaveAll()"${n&&!busy?'':' disabled'}
            style="${n&&!busy?'':'opacity:.5'}">${
            busy?'Saving…':n?`Save ${n} change${n===1?'':'s'}`:'Saved'}</button>`;})()}
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:14px">${tabs}</div>
      ${levelTabs}${libNote}
      <div style="margin-top:12px;padding:10px 12px;border-radius:11px;background:rgba(0,102,99,.06)">
        <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">${
          st0.written?'WHAT EACH LENGTH TAKES':'NOT WRITTEN YET'}</div>
        <div id="wkBandTotal" style="font:500 12.5px/1.6 var(--sans);color:var(--ink);margin-top:6px">${
          !st0.written
            ? 'These '+list.length+' drills are the whole stage, which is what the shares draw on '
              +'until you write this workout out. Change anything below and it becomes your list, '
              +'and the shares draw on that instead. A set workout that never changes is a fix, under Fixes.'
            : list.length?wkBandLengths(wkStage,list):'Nothing in it yet.'}</div>
        ${(function(){ const n=list.filter(wkNoDose).length;
          if(!n) return '';
          return `<div style="font:500 12px/1.5 var(--sans);color:#8a5a12;margin-top:8px">
            ${n} of these ${n===1?'has':'have'} no dose written, so ${n===1?'it falls':'they fall'}
            back to three sets of eight, which calls a hold eight reps. They are marked below.</div>`;
        })()}
      </div>
      ${(function(){
        /* ── the shares ────────────────────────────────────────────
           They decide the make-up of a session: how much of it is level one
           work and how much is level three. One shipped set served every
           stage, so there was no way to say that Wall Work should sit harder
           than Foundations without moving both. */
        const mix=wkMixNow(wkStage, wkBand);
        const num=(L)=>`<label style="display:flex;flex-direction:column;gap:5px;flex:none">
          <span style="font:600 8.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">LEVEL ${L}</span>
          <span style="display:flex;align-items:center;gap:4px">
            <input type="number" min="0" max="100" value="${mix[L]==null?'':mix[L]}" placeholder="0"
              oninput="wkMixSet(${wkStage},${wkBand},${L},this.value)"
              style="${inp};width:64px;font-weight:600">
            <span style="font:500 12px/1 var(--sans);color:var(--grey2)">%</span></span>
        </label>`;
        const total=[1,2,3,4].reduce((t,L)=>t+(Number(mix[L])||0),0);
        return `<div style="margin-top:12px;padding:12px 14px;border-radius:13px;
          border:1px solid var(--line);background:#fff">
          <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">
            THE MIX OF A SESSION</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px">
            ${[1,2,3,4].map(num).join('')}
            <div style="flex:1;min-width:190px;font:400 11.5px/1.5 var(--sans);color:var(--grey);
              text-align:right">
              <div>A six drill session: ${esc(wkMixCounts(wkStage,wkBand,6))}</div>
              <div>A ten drill session: ${esc(wkMixCounts(wkStage,wkBand,10))}</div>
            </div>
          </div>
          <div style="font:400 11.5px/1.5 var(--sans);color:${total?'var(--grey2)':'var(--terra)'};
            margin-top:9px;max-width:70ch">
            ${total
              ? 'Shares, not a total, so they do not have to add to a hundred. A level with no share '
                +'is never drawn on. Nobody gets three drills out of one grouping while another one '
                +'at the same level is untouched.'
              : 'Every level is at zero, so there is nothing for a session to draw on.'}</div>
        </div>`;})()}
      ${(function(){
        /* ── the numbers for the whole workout ──────────────────────
           Easier meant an easier pick of drills and nothing else: the same
           three sets of eight, on easier work. Sets and reps belong to the
           workout as much as the list does, so they are set here, once,
           and a row below only has to say where it differs. The levels in
           between are for "everything hard in this one drops a set". */
        const lvls=[];
        list.forEach(v=>{ const L=wkLvlOf(wkStage,v); if(L && lvls.indexOf(L)<0) lvls.push(L); });
        lvls.sort();
        const wide=wkBandNums(wkStage,wkBand,'*');
        const said=['sets','amt','w','r'].filter(f=>wide[f]!=null).length;
        const lvlSaid=lvls.filter(L=>{ const o=wkBandNums(wkStage,wkBand,'*l'+L);
          return ['sets','amt','w','r'].some(f=>o[f]!=null); }).length;
        const sum = said||lvlSaid
          ? said+' set across the workout'+(lvlSaid?', '+lvlSaid+' level'+(lvlSaid===1?'':'s')+' of its own':'')
          : 'Nothing set, so every drill runs at its own numbers';
        const ph=f=>{ const n=wide[f]; return n==null ? 'per drill' : String(n); };
        const fld=(lab,html)=>`<label style="flex:none;display:flex;flex-direction:column;gap:4px">
          <span style="font:600 8.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${lab}</span>
          ${html}</label>`;
        if(!wkDefOpen) return `<div style="margin-top:12px;padding:11px 13px;border-radius:13px;
          border:1px solid var(--line);background:#fff;display:flex;gap:10px;align-items:center;
          flex-wrap:wrap">
          <span style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">
            SETS AND REPS FOR THIS WORKOUT</span>
          <span style="flex:1;min-width:150px;font:400 12px/1.4 var(--sans);color:var(--grey)">${
            esc(sum)}</span>
          <button class="quiet" style="flex:none" onclick="wkDefOpen=true;draw()">Set them</button>
        </div>`;
        return `<div style="margin-top:12px;padding:12px 14px;border-radius:13px;
          border:1px solid var(--line);background:#fff">
          <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
            <span style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">
              SETS AND REPS FOR THIS WORKOUT</span>
            <button class="quiet" style="margin-left:auto" onclick="wkDefOpen=false;draw()">Done</button>
          </div>
          <div style="font:400 12px/1.6 var(--sans);color:var(--grey);margin-top:6px;max-width:66ch">
            Every drill in ${esc(BAND_NAME[wkBand])} runs at these, whatever it does in the
            other two. Leave one empty and that drill keeps its own number. A row below
            beats both.</div>
          <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-top:10px">
            ${fld('SETS', wkNumBox('*','sets',wide.sets==null?'':wide.sets,'per drill',56))}
            ${fld('BUILD TO', wkNumBox('*','amt',wide.amt==null?'':wide.amt,'per drill',56))}
            ${fld('SECONDS', wkNumBox('*','w',wide.w==null?'':wide.w,'per drill',56))}
            ${fld('REST', wkNumBox('*','r',wide.r==null?'':wide.r,'per drill',56))}
          </div>
          ${!lvls.length?'':`
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
            <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">
              AND BY DIFFICULTY, INSIDE IT</div>
            <div style="font:400 12px/1.6 var(--sans);color:var(--grey);margin-top:6px;max-width:66ch">
              The level is how hard a drill is inside this phase, one to four. Anything
              here beats the line above for drills at that level.</div>
            ${lvls.map(L=>{ const o=wkBandNums(wkStage,wkBand,'*l'+L);
              const n=list.filter(v=>wkLvlOf(wkStage,v)===L).length;
              return `<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-top:10px">
                <span style="flex:none;width:96px;font:600 11.5px/1.3 var(--sans);color:var(--ink)">
                  Level ${L}<span style="display:block;font:400 10.5px/1.3 var(--sans);
                  color:var(--grey2)">${n} drill${n===1?'':'s'}</span></span>
                ${fld('SETS', wkNumBox('*l'+L,'sets',o.sets==null?'':o.sets,ph('sets'),56))}
                ${fld('BUILD TO', wkNumBox('*l'+L,'amt',o.amt==null?'':o.amt,ph('amt'),56))}
                ${fld('SECONDS', wkNumBox('*l'+L,'w',o.w==null?'':o.w,ph('w'),56))}
                ${fld('REST', wkNumBox('*l'+L,'r',o.r==null?'':o.r,ph('r'),56))}
              </div>`; }).join('')}
          </div>`}
        </div>`; })()}
      ${rows||`<div style="font:400 13.5px/1.6 var(--sans);color:var(--grey);margin-top:16px">
        Nothing in this workout. Add a drill below and it becomes the session.</div>`}
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
        ${wkAdd
          ? `<input autofocus value="${esc(wkAddQ)}" oninput="wkAddQ=this.value;draw()"
               placeholder="Search the library…" style="${inp};max-width:320px">
             ${cats.map(cat=>`<div style="margin-top:12px">
               <div style="font:700 9.5px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">${
                 esc(cat.toUpperCase())}</div>
               <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
               ${cands.filter(c=>c.cat===cat).map(c=>`<button onclick="wkBandAdd(${wkStage},${wkBand},'${c.v}')"
                 title="${c.here?'Already on this stage':'From the wider library'}"
                 style="cursor:pointer;border-radius:999px;padding:7px 12px;
                 font:600 11.5px/1 var(--sans);background:#fff;
                 border:1.5px solid ${c.here?'var(--forest)':'var(--line)'};
                 color:${c.here?'var(--forest)':'var(--grey)'}">${esc(c.n)}</button>`).join('')}
               </div></div>`).join('')
               || '<div style="margin-top:10px;font:400 12.5px/1 var(--sans);color:var(--grey2)">Nothing matches.</div>'}
             <button class="quiet" style="margin-top:10px" onclick="wkAdd=false;wkAddQ='';draw()">Cancel</button>`
          : `<button class="send" onclick="wkAdd=true;draw()">Add an exercise</button>
             ${st0.written?`<button class="quiet" style="margin-left:12px;color:var(--terra)"
               onclick="wkBandReset(${wkStage},${wkBand})">Back to the levels</button>`:''}`}
      </div>
    </div>`;
  }

  const pool=all;
  const groups=[];
  pool.forEach(x=>{ if(groups.indexOf(x.g)<0) groups.push(x.g); });
  const body = groups.length ? groups.map(g=>`
    <div style="margin-top:16px">
      <div style="font:700 9.5px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">${esc(g)}</div>
      ${pool.filter(x=>x.g===g).sort((a,b)=>a.L-b.L).map(x=>{
        const it=wkDrill(x.v), edited=!!wkEdits[x.v];
        return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;
          padding:9px 10px;border-radius:12px;background:${edited?'rgba(243,169,73,.1)':'#fff'};
          border:1px solid var(--line)">
          <span style="flex:1;min-width:150px">
            <b style="font:600 13px/1.25 var(--sans)">${esc(it.n)}</b>
            <span style="display:block;font:400 11px/1.3 var(--sans);color:var(--grey2);margin-top:3px">
              level ${x.L}${/warm|mobility|wrist/i.test(g)
                ? ' · warm-up, so one pass at 30s and the dose does not set the sets'
                : ''}${(libIndex||{})[x.v]?'':' · not in the library'}</span>
          </span>
          <label style="flex:0 0 116px"><span style="font:600 9px/1 var(--sans);letter-spacing:.1em;
            color:var(--grey2)">DOSE</span>
            <input value="${esc(it.d||'')}" oninput="wkSet('${x.v}','d',this.value)"
              style="${inp};margin-top:4px;font-size:16px"></label>
          <label style="flex:0 0 132px"><span style="font:600 9px/1 var(--sans);letter-spacing:.1em;
            color:var(--grey2)">SETS</span>
            <span style="display:block;margin-top:4px">${
              wkNumBox(x.v,'sets',it.sets==null?'':it.sets,String(wkNums(x.v,g).sets),56,g)}</span></label>
          <label style="flex:0 0 132px"><span style="font:600 9px/1 var(--sans);letter-spacing:.1em;
            color:var(--grey2)">SECONDS</span>
            <span style="display:block;margin-top:4px">${
              wkNumBox(x.v,'w',it.w==null?'':it.w,String(wkNums(x.v,g).w),56,g)}</span></label>
          <label style="flex:0 0 132px"><span style="font:600 9px/1 var(--sans);letter-spacing:.1em;
            color:var(--grey2)">REST</span>
            <span style="display:block;margin-top:4px">${
              wkNumBox(x.v,'r',it.r==null?'':it.r,String(wkNums(x.v,g).r),56,g)}</span></label>
          <span id="wk-${x.v}" style="flex:0 0 168px;text-align:right;font:500 11.5px/1.3 var(--sans);
            color:var(--grey)">${wkRowLen(x.v)}</span>
        </div>`;}).join('')}
    </div>`).join('')
    : `<div style="font:400 13.5px/1.6 var(--sans);color:var(--grey);margin-top:16px">
        This stage has no groupings written yet, so its sessions come from the whole
        drill pool and there is nothing here to tune.</div>`;

  const dirty=Object.keys(wkEdits).length;
  return `<div class="glass" style="padding:16px 18px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font:400 21px/1.1 var(--serif)">The app's workouts</div>
        <div style="font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:4px;max-width:62ch">
          Every drill the ladder uses. The dose sets how many sets a drill gets,
          so "3 × 8" is three of them; blank seconds means the rule works the
          length out. A warm-up is the exception, always one pass at 30 seconds.
          A change here follows the drill into every workout it appears in, and
          it reaches the app on its next load. No deploy.</div>
      </div>
      <button class="send" onclick="wkSave()"${dirty&&!wkBusy?'':' disabled'}
        style="${dirty&&!wkBusy?'':'opacity:.5'}">${
        wkBusy?'Saving…':dirty?`Save ${dirty} change${dirty===1?'':'s'}`:'Saved'}</button>
    </div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:14px">${tabs}</div>
    ${levelTabs}${libNote}
    <div style="margin-top:12px;padding:10px 12px;border-radius:11px;
      background:rgba(0,102,99,.06)">
      <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">
        THE WHOLE POOL, NOT ONE SESSION</div>
      <div id="wkTotal" style="font:500 12.5px/1.5 var(--sans);color:var(--forest);margin-top:6px">${
        wkStageLine()}</div>
      <div style="font:400 11.5px/1.5 var(--sans);color:var(--grey2);margin-top:5px">
        Every drill the day's groupings hold, at three sets each. Nobody is given
        this: a session takes as much of it as the time they picked allows, and
        which part it takes depends on whether they chose Easier, Standard or
        Harder. Read it as the size of the pool you are tuning, not as a session
        length.</div>
    </div>
    ${body}
  </div>`;
}

function bPickDay(i){ builder.day=i; builder.grp=0; draw(); }
function bPickGrp(g){ builder.grp=g; draw(); }

function bAddDay(){
  bDays().push({id:String(bDays().length+1),label:'Day '+(bDays().length+1),
    sub:'',title:'',when:'',mins:'45',groups:[]});
  builder.day=bDays().length-1; builder.grp=0;
  bMark(); draw();
}
function bDelDay(i){
  if(!confirm('Remove '+(bDays()[i].label||'this day')+'?')) return;
  bDays().splice(i,1);
  if(builder.day>=bDays().length) builder.day=Math.max(0,bDays().length-1);
  builder.grp=0;
  bMark(); draw();
}
function bField(i,f,v){ bDays()[i][f]=v; bMark(); }
function bAddGroup(i){
  (bDays()[i].groups=bDays()[i].groups||[]).push({name:'New block',items:[]});
  builder.grp=bDays()[i].groups.length-1;
  bMark(); draw();
}
function bDelGroup(i,g){
  if(!confirm('Remove this block and its drills?')) return;
  bDays()[i].groups.splice(g,1);
  if(builder.grp>=bDays()[i].groups.length) builder.grp=Math.max(0,bDays()[i].groups.length-1);
  bMark(); draw();
}
function bGroupName(i,g,v){ bDays()[i].groups[g].name=v; bMark(); }
function bAddItem(i,g){
  bDays()[i].groups[g].items.push({v:'',d:'',nt:''}); bMark(); draw();
}
function bDelItem(i,g,k){ bDays()[i].groups[g].items.splice(k,1); bMark(); draw(); }
/* what a programme row is running at, stated where stated and read off the
   dose where not, so the fields open showing the truth rather than empty.
   The ladder's version of this is wkNums; a programme row's numbers are on
   the row itself rather than in the ladder tuning. */
function bNums(it, grp){
  const a=lhaAmount(it);
  const warm=/warm|mobility|wrist/i.test(String(grp||''));
  return {
    sets: (it.sets!=null) ? it.sets : (warm ? 1 : (lhaSets(it.d)>1?lhaSets(it.d):3)),
    amt:  a.n, unit: a.unit,
    w:    (it.w!=null) ? it.w : lhaWork(it, grp||''),
    r:    (it.r!=null) ? it.r : lhaRest(it, grp||''),
    warm
  };
}
function bRowLen(it, grp){
  const n=bNums(it, grp);
  const sets=n.warm ? 1 : Math.max(1, n.sets);
  const secs=sets*n.w + Math.max(0, sets-1)*n.r;
  return (n.w?`${sets} × ${n.w}s`:`${sets} × untimed`)
    + ` · ${n.r}s rest · ${Math.round(secs/60*10)/10} min`;
}
function bItem(i,g,k,f,v){
  const it=bDays()[i].groups[g].items[k];
  /* the numbers are numbers, the text is text, and an emptied field means
     "go back to the rule" rather than zero */
  if(f==='sets'||f==='amt'||f==='w'||f==='r'){
    if(v===''||v==null) delete it[f]; else it[f]=Number(v);
  } else if(f==='unit'){
    it.unit=v;
  } else {
    it[f]=v;
    /* picking a drill with no dose set yet takes the library's default */
    if(f==='v' && !it.d) it.d='';
  }
  bMark();
  if(f==='v'||f==='unit') draw();
  else {
    /* repaint the one line, or the field loses focus mid-type */
    const row=document.querySelector('[data-brow="'+i+'-'+g+'-'+k+'"]');
    if(row){ const gname=((bDays()[i].groups[g])||{}).name||'';
      row.textContent=bRowLen(it, gname); }
  }
}

/* ── a drill the coach makes, on the spot ──────────────────────────
   Everything in the library came out of a build, so adding a drill meant
   a developer and a deploy. This uploads the clip to Stream and writes the
   drill into settings, where the server folds it into the library for both
   the app and this dashboard. It can go straight onto a ladder stage, or
   nowhere, in which case it is just available to drop into a programme. */
/* ── putting a clip on a drill that already exists ─────────────────
   Filming was only reachable through New drill, so a drill already in a
   programme, or already named by a check point, could only be given a clip
   by making a second drill with the same movement in it.

   One control, used in the builder and in the check points editor. The
   upload is Cloudflare's direct one: ask for a URL, PUT the file at it,
   then tell the server which uid landed. */
let libVideo = {};            /* slug -> mp4 url, so a row can say filmed */
let clipBusy = '';            /* the slug being uploaded right now */
let clipMsg = {};             /* slug -> what to show under the button */

function noteLibrary(lib){
  if(!lib) return;
  if(lib.names) libIndex=Object.assign({}, libIndex||{}, lib.names);
  if(lib.video) libVideo=Object.assign({}, libVideo, lib.video);
}
const hasClip = v => !!(v && libVideo[v]);

function clipPick(v, after){
  if(!v || clipBusy) return;
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove();
    if(f) clipUpload(v, f, after); };
  inp.click();
}
function clipSay(v, t){ clipMsg[v]=t;
  const el=document.getElementById('clip-'+v);
  if(el) el.textContent=t; else draw();
}
function clipUpload(v, file, after){
  clipBusy=v; clipSay(v,'Starting…'); draw();
  fetch(APP+'/upload',{method:'POST',headers:hdr(),body:'{}'})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
    .then(d=>new Promise((res,rej)=>{
      const fd=new FormData(); fd.append('file',file);
      const x=new XMLHttpRequest(); x.open('POST',d.uploadURL);
      x.upload.onprogress=e=>{ if(e.lengthComputable)
        clipSay(v,'Uploading '+Math.round(e.loaded/e.total*100)+'%'); };
      x.onload=()=> (x.status>=200&&x.status<300)?res(d.uid):rej('Upload failed ('+x.status+')');
      x.onerror=()=>rej('Upload failed, check your signal');
      x.send(fd);
    }))
    .then(uid=>{ clipSay(v,'Attaching…');
      return fetch(API+'/drill',{method:'POST',headers:hdr(),
        body:JSON.stringify({v, uid, clipOnly:true})})
        .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||('the server said '+r.status))));
    })
    .then(d=>{
      clipBusy='';
      if(d && d.drill && d.drill.url) libVideo[v]=d.drill.url;
      /* Stream builds the MP4 in the background, so a clip attached this
         second can 404 for a minute. Say so rather than let it look broken. */
      clipSay(v,'Filmed. Give Cloudflare a minute to finish encoding.');
      if(typeof after==='function') after(v);
      draw();
    })
    .catch(e=>{ clipBusy=''; clipSay(v,String(e&&e.message||e)); draw(); });
}
/* the control itself, small enough to sit on a row */
function clipBtn(v){
  if(!v) return '';
  const busy=clipBusy===v, on=hasClip(v), msg=clipMsg[v];
  return `<span style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px">
    <button onclick="clipPick('${esc(v)}')" ${busy?'disabled':''}
      title="${on?'Replace the clip on this drill':'Attach a clip to this drill'}"
      style="border:1px solid ${on?'var(--forest)':'var(--line)'};border-radius:10px;
      background:${on?'rgba(0,102,99,.08)':'#fff'};cursor:${busy?'default':'pointer'};
      min-height:38px;padding:0 11px;font:600 11.5px/1 var(--sans);
      color:${on?'var(--forest)':'var(--grey)'};opacity:${busy?.6:1};
      display:inline-flex;align-items:center;gap:6px">

        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 10.5V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3.5"/>
        <path d="m15 12 6-3.5v11L15 16"/></svg>

    ${msg?`<span id="clip-${esc(v)}" style="font:400 10px/1.3 var(--sans);color:var(--grey2);

  </span>`;
}

function ndSlug(n){ return String(n||'').toLowerCase()
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }
