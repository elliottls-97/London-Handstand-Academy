        return `<div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:14px;
          padding-top:12px;border-top:1px solid var(--line)">
          ${gs.map((x,k)=>tab(k===gi, x.name||('Block '+(k+1)),
              ((x.items||[]).length)+' drill'+((x.items||[]).length===1?'':'s'),
              'bPickGrp('+k+')', 'bDelGroup('+di+','+k+')')).join('')}
          <button onclick="bAddGroup(${di})" style="${bGhost}">+ Block</button>
        </div>
        <div style="margin-top:13px">
          <input value="${esc(g.name||'')}" oninput="bGroupName(${di},${gi},this.value)"
            placeholder="Warm-up" style="width:100%;${bInput};font-weight:600">
          ${(g.items||[]).map((it,k)=>`
            <div style="display:flex;gap:7px;align-items:center;margin-top:7px">
              <span style="flex:none;display:flex;flex-direction:column;gap:2px">
                <button onclick="bMove(${di},${gi},${k},-1)" style="${bTiny}" aria-label="Up">▲</button>
                <button onclick="bMove(${di},${gi},${k},1)" style="${bTiny}" aria-label="Down">▼</button>
              </span>
              <select onchange="bItem(${di},${gi},${k},'v',this.value)"
                style="flex:1;min-width:0;${bInput}">${drillOptions(it.v)}</select>
              <button title="Make a new drill"
                onclick="openNewDrill({kind:'item',day:${di},grp:${gi},idx:${k}})"
                style="flex:none;border:1px solid var(--line);border-radius:10px;background:#fff;
                cursor:pointer;min-width:40px;min-height:40px;font:600 17px/1 var(--sans);
                color:var(--forest)">+</button>
              <input value="${esc(it.d||'')}" oninput="bItem(${di},${gi},${k},'d',this.value)"
                placeholder="3 × 8" style="flex:0 0 108px;${bInput}">
              <button onclick="bDelItem(${di},${gi},${k})" style="${bGhost}">×</button>
            </div>
            <input value="${esc(it.nt||'')}" oninput="bItem(${di},${gi},${k},'nt',this.value)"
              placeholder="A note for this drill, if it needs one"
              style="width:calc(100% - 34px);margin:5px 0 0 34px;${bInput};font-size:12px">
          `).join('')}
          <button onclick="bAddItem(${di},${gi})" style="${bGhost};margin-top:9px">+ Drill</button>
        </div>`;})()}
    </div>`
    : `${dayTabs}
       <div class="glass" style="padding:22px;margin-top:12px;text-align:center;
         font:400 13.5px/1.6 var(--sans);color:var(--grey)">
         No days yet. Add one and start putting blocks in it.</div>`;


  return `<div style="position:fixed;inset:0;z-index:80;background:rgba(0,30,28,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;justify-content:center;overflow-y:auto;padding:22px 14px">
    <div style="width:100%;max-width:760px;height:max-content;background:var(--bg);
      border-radius:22px;padding:20px;box-shadow:0 30px 70px -30px rgba(0,0,0,.5)">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:0">
          <div style="font:400 24px/1.1 var(--serif);color:var(--ink)">${esc(name)}</div>
          <div style="font:500 11px/1.4 var(--sans);color:var(--grey2);margin-top:4px">
            ${builder.edited?'Edited here':'From the original file'}${
            builder.dirty?' · unsaved changes':''}</div>
        </div>
        <button onclick="closeBuilder()" style="${bGhost}">Close</button>
        <button id="bSave" class="send" onclick="saveBuilder()">Save programme</button>
      </div>
      ${body}
      ${bExHTML()}
      ${bCpHTML()}
      <div style="font:400 12px/1.6 var(--sans);color:var(--grey2);margin:14px 0 30px">
        Saving writes the programme the client's app reads. Names, clips and cues come from
        the drill library, so they stay right on their own. You set the drill and the dose.
      </div>
    </div></div>`;
}

const bInput='border:1px solid var(--line);border-radius:9px;padding:8px 10px;'
  +'background:#fff;font:400 13px/1.2 var(--sans);color:var(--ink)';
const bGhost='border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:transparent;'
  +'font:600 11.5px/1 var(--sans);color:var(--grey);cursor:pointer';
const bTiny='border:none;background:none;cursor:pointer;font:400 8px/1 var(--sans);color:var(--grey2);padding:1px';

function trackHTML(email){
  const t=tracks[email]; if(!t) return '';
  const HAB={wrists:'Wrist prep',shoulders:'Shoulder opener',hollow:'Hollow hold'};
  const MET={wall:['Distance from the wall','cm',true],
             press:['Press attempts held','reps',false],
             wrist:['Wrist discomfort','/10',true]};
  const day=i=>{ const d=new Date(); d.setDate(d.getDate()-i); return d.toISOString().slice(0,10); };

  const habits=Object.keys(HAB).map(h=>{
    const set=new Set((t.habits||{})[h]||[]);
    const days=[...Array(28).keys()].map(i=>set.has(day(27-i)));
    const rate=Math.round(days.filter(Boolean).length/28*100);
    return `<div style="display:flex;align-items:center;gap:10px;margin-top:9px">
      <span style="flex:none;width:104px;font:600 11.5px/1.2 var(--sans)">${HAB[h]}</span>
      <span style="flex:1;display:flex;gap:1.5px;min-width:0">${
        days.map(on=>`<i style="flex:1;height:13px;border-radius:2px;
          background:${on?'var(--forest)':'var(--mist)'}"></i>`).join('')}</span>
      <span style="flex:none;width:34px;text-align:right;font:700 12px/1 var(--sans);
        color:${rate>=70?'var(--forest)':'var(--grey2)'}">${rate}%</span></div>`;
  }).join('');

  const mets=Object.keys(MET).map(m=>{
    const h=((t.metrics||{})[m]||[]).slice(-8); if(!h.length) return '';
    const last=h[h.length-1], prev=h.length>1?h[h.length-2]:null;
    const [name,unit,lower]=MET[m];
    const better=prev?(lower?last.v<prev.v:last.v>prev.v):null;
    return `<div style="display:flex;align-items:baseline;gap:10px;margin-top:9px">
      <span style="flex:1;font:500 12.5px/1.2 var(--sans)">${name}</span>
      <span style="flex:none;font:700 14px/1 var(--sans);color:var(--forest)">${last.v}</span>
      <span style="flex:none;width:26px;font:600 10px/1 var(--sans);color:var(--grey2)">${unit}</span>
      <span style="flex:none;width:44px;text-align:right;font:600 10px/1 var(--sans);
        color:${better===null?'var(--grey2)':better?'var(--forest)':'var(--terra)'}">${
        prev?(better?'better':'worse'):'first'}</span></div>`;
  }).join('');

  const CPN={
    'ch-assist':'Chair-assisted handstand','fall-comfort':'Falling off the wall','wall-45':'45° wall hold',
    plank:'Plank pose',crow:'Crow pose',chaturanga:'Chaturanga push-ups','kickup-rate':'Kick up to wall',
    'ctw-hold':'Chest-to-wall','scap-shrugs':'Wall scapula shrugs','sl-tuck':'Single-leg tuck slides',
    'pike-neg':'Pike negatives','pike-full':'Pike push-ups','nose-toes':'Nose to toes',
    'assist-entry':'Assisted entries','tuck-depth':'Tuck slides stacked','slide-count':'Slide aways',
    'slide-off':'Comes off the wall','box-dist':'Box distance','box-time':'Box hold','step-ups':'Step ups',
    'entry-clean':'Entries to eight','side-away':'Full slide away','tuck-takeoff':'Tuck take-offs',
    'box-lifts-l':'Box lifts, left','box-lifts-r':'Box lifts, right','shape-wall':'Shape changes on wall',
    'free-attempt':'Freestanding attempts','tuck-entries':'Tuck entries','straight-entries':'Straight entries',
    'straddle-entries':'Straddle entries','straddle-to-straight':'Straddle to straight',
    'straight-to-tuck-back':'Straight to tuck','straddle-to-diamond':'Straddle to diamond',
    'press-wall':'Chest-to-wall press',compression:'Compression','press-ecc':'Press eccentrics'};
  /* a check point the coach set for this client wins over the ladder's name */
  const own={};
  (cpDefs[email]||[]).forEach(c=>{ own[c.k]=c.n; });
  /* Every check point set for this client, not only the ones they have got
     round to: an untouched one used to be invisible here, so "nothing logged"
     and "nothing set" looked identical. */
  const defs=(cpDefs[email]||[]);
  const keys=[...new Set(defs.map(c=>c.k).concat(Object.keys(t.checkpoints||{})))];
  const cps=keys.map(k=>{
    const def=defs.find(c=>c.k===k)||null;
    const h=(t.checkpoints||{})[k]||[];
    const last=h.length?h[h.length-1]:null, prev=h.length>1?h[h.length-2]:null;
    const clips=h.filter(x=>x.video).slice(-3).reverse();
    const tgt=def&&def.target!=null?def.target:null;
    const met = last && tgt!=null
      ? (def&&def.lower ? (last.v>0 && last.v<=tgt) : last.v>=tgt)
      : (last && def && (def.kind==='face') ? Number(last.v)>=2
         : last && def && def.kind==='yn' ? !!last.v : false);
    return {k, n:(def&&def.n)||own[k]||CPN[k]||k, last, prev, clips, tgt, met,
            unit:(def&&def.unit)||((def&&def.kind==='secs')?'s':''), kind:def&&def.kind};
  }).filter(c=>c.last||c.tgt!=null||defs.some(d=>d.k===c.k))
    .sort((a,b)=>(b.last?b.last.at:0)-(a.last?a.last.at:0));
  const cpMetN=cps.filter(c=>c.met).length;
  const cpClips=cps.reduce((a,c)=>a+c.clips.length,0);
  const cpBlock=cps.length?`<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">CHECK POINTS</span>
      <span style="font:600 10.5px/1 var(--sans);color:var(--grey2)">${cpMetN} of ${cps.length} reached${
        cpClips?' · '+cpClips+' clip'+(cpClips===1?'':'s'):''}</span>
    </div>
    ${cps.map(c=>{
      const val=c.last ? (c.kind==='face'
          ? ['Not really','Getting there','Yes'][Math.max(0,Math.min(2,Number(c.last.v)||0))]
          : c.kind==='yn' ? (c.last.v?'Yes':'Not yet') : c.last.v+c.unit)
        : 'not logged';
      return `<div style="margin-top:9px">
      <div style="display:flex;align-items:baseline;gap:9px">
        <span style="flex:none;width:15px;height:15px;border-radius:50%;
          background:${c.met?'var(--forest)':c.last?'rgba(243,169,73,.35)':'rgba(17,17,17,.1)'};
          color:#fff;font:700 9px/15px var(--sans);text-align:center">${c.met?'✓':''}</span>
        <span style="flex:1;min-width:0;font:500 12.5px/1.2 var(--sans);
          color:${c.last?'var(--ink)':'var(--grey2)'}">${esc(c.n)}</span>
        ${c.prev?`<span style="flex:none;font:500 11px/1 var(--sans);color:var(--grey2)">${
          c.prev.v}${esc(c.unit)} →</span>`:''}
        <span style="flex:none;font:700 14px/1 var(--sans);
          color:${c.met?'var(--forest)':c.last?'var(--ink)':'var(--grey2)'}">${esc(String(val))}</span>
        ${c.tgt!=null?`<span style="flex:none;font:400 11.5px/1 var(--sans);color:var(--grey2)">/ ${
          c.tgt}${esc(c.unit)}</span>`:''}
        <span style="flex:none;width:52px;text-align:right;font:500 10px/1 var(--sans);
          color:var(--grey2)">${c.last?daysAgo(c.last.at):''}</span>
      </div>
      ${c.clips.length?`<div style="display:flex;gap:7px;margin-top:6px;margin-left:24px;flex-wrap:wrap">
        ${c.clips.map(x=>`<span style="display:inline-flex">
          <button onclick="playCp('${esc(x.video)}')"
          style="border:1px solid rgba(0,102,99,.3);border-right:0;border-radius:8px 0 0 8px;
          background:rgba(0,102,99,.06);
          cursor:pointer;padding:6px 10px;font:600 10.5px/1 var(--sans);color:var(--forest)">
          &#9654; Watch ${daysAgo(x.at)}${x.v!=null?' · '+x.v+esc(c.unit):''}</button>
          <button onclick="reviewClip('${esc(x.video)}','${esc(c.n)} · '+'${esc(daysAgo(x.at))}')"
          title="Open this clip in the review tool"
          style="border:1px solid rgba(0,102,99,.3);border-radius:0 8px 8px 0;
          background:#fff;cursor:pointer;padding:6px 10px;font:600 10.5px/1 var(--sans);
          color:var(--forest)">Review</button></span>`).join('')}
      </div>`:''}
    </div>`;}).join('')}</div>`:'';

  const ci=(t.checkins||[]).slice(-1)[0];
  const check=ci?`<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">
    <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">
      LAST CHECK-IN · ${daysAgo(ci.at)}</div>
    <div style="display:flex;gap:14px;margin-top:8px">
      ${[['Feels',ci.mood],['Sore',ci.soreness],['Sleep',ci.sleep]].map(([k,v])=>
        `<span style="font:600 11.5px/1 var(--sans);color:var(--grey)">${k}
         <b style="color:var(--forest);font-size:14px">${v}</b>/10</span>`).join('')}</div>
    ${ci.note?`<div style="font:400 12.5px/1.5 var(--sans);color:var(--ink);margin-top:8px">
      &ldquo;${esc(ci.note)}&rdquo;</div>`:''}</div>`:'';

  if(!habits && !mets && !check && !cpBlock) return '';
  return `<div class="glass" style="padding:15px 17px;margin-top:11px">
    <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">TRACKING</div>
    ${habits}${mets?`<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">${mets}</div>`:''}
    ${cpBlock}${check}</div>`;
}

function intakeHTML(email){
  const a=intakes[email];
  if(!a) return `<div class="kick" style="margin-top:24px">WHAT THEY SAID</div>
    <div style="font:400 13.5px/1.6 var(--sans);color:var(--grey);margin-top:8px">
      They joined before the intake existed, or have not finished it.</div>`;
  const rows=[
    ['Goal', GOAL_LABEL[a.goal]||a.goal||'—'],
    ['Level at signup', (a.level!=null?LEVEL_LABEL[a.level]:null)||'—'],
    ['Said they would train', a.days?`${a.days}× a week, ${a.mins||'?'} min`:'—'],
  ];
  const hurts=(a.niggles||[]).filter(x=>x&&x!=='Nothing right now');
  return `<div class="kick" style="margin-top:24px">WHAT THEY SAID</div>
    <div style="margin-top:10px">
      ${rows.map(([k,v])=>`<div style="display:flex;gap:12px;padding:5px 0;
        font:400 13.5px/1.6 var(--sans)">
        <span style="flex:none;width:118px;color:var(--grey2)">${k}</span>
        <span style="flex:1">${esc(v)}</span></div>`).join('')}
      ${hurts.length
        ? `<div style="display:flex;gap:12px;padding:9px 12px;margin-top:8px;border-radius:12px;
             background:rgba(200,122,86,.12);border-left:3px solid var(--terra);
             font:400 13.5px/1.5 var(--sans)">
             <span style="flex:none;width:106px;font-weight:700;color:var(--terra)">Told us hurts</span>
             <span style="flex:1">${hurts.map(esc).join(', ')}</span></div>`
        : `<div style="display:flex;gap:12px;padding:5px 0;font:400 13.5px/1.6 var(--sans)">
             <span style="flex:none;width:118px;color:var(--grey2)">Injuries</span>
             <span style="flex:1;color:var(--grey)">Nothing declared</span></div>`}
    </div>`;
}

/* ── the read, three rails ─────────────────────────────────────────
   From the design: Momentum, Friction, Do next. The first two are
   derived; the third is a judgement no amount of data produces, so it
   is the coach's own note promoted to where it will actually be read
   rather than buried at the bottom of the column. */
function readRails(email){
  const lines=summarise(email);
  const isFriction=x=>/too hard|flagged|stopped|abandon|stalled|no sessions|not started/i.test(x);
  const momentum=lines.filter(x=>!isFriction(x));
  const friction=lines.filter(isFriction);
  const note=((notes[email]||{}).text||'').trim();

  const rail=(kicker,text,accent,bg)=>`<div style="display:flex;gap:12px;padding:12px 14px;
    border-radius:16px;background:${bg};border-left:3px solid ${accent};margin-bottom:9px">
    <span style="font:800 9.5px/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;
      width:74px;flex:0 0 74px;color:${accent}">${kicker}</span>
    <span style="font:400 13.5px/1.55 var(--sans);color:#23281f">${text}</span></div>`;

  return `<div style="margin-top:11px">
    ${momentum.length?rail('Momentum', momentum.map(esc).join(' '), '#0a7b74','rgba(159,176,152,.22)'):''}
    ${friction.length?rail('Friction', friction.map(esc).join(' '), '#7d3b28','rgba(200,122,86,.14)'):''}
    ${rail('Do next',
      note ? esc(note)
           : `<span style="color:var(--grey2)">Nothing written yet — this is where your call on
              their next block goes. <button onclick="focusNote()" style="background:none;border:none;
              padding:0;cursor:pointer;font:inherit;color:var(--forest);text-decoration:underline;
              text-underline-offset:2px">Write it</button></span>`,
      '#006663','rgba(232,236,227,.75)')}
  </div>`;
}
function focusNote(){ const el=$('#cnote'); if(el){ el.scrollIntoView({block:'center'}); el.focus(); } }

/* ── where it is hard, where it is easy ────────────────────────────
   The flags with the client's own words next to them. The quote is the
   useful half — "shoulders burn out before the time is up" tells you
   what to change; a count does not. */
function frictionHTML(email){
  const p=prog[email]||{};
  const rows=Object.entries(p.flags||{})
    .map(([v,f])=>({v, rate:f.rate, note:(f.note||'').trim(),
                    n:(drillName(v)||v), times:f.times||f.count||0}))
    .filter(r=>r.rate==='hard'||r.rate==='easy')
    .sort((a,b)=>(a.rate===b.rate?0:a.rate==='hard'?-1:1));
  if(!rows.length) return '';
  return `<div class="kick" style="margin-top:26px">WHERE IT IS HARD, WHERE IT IS EASY</div>
    <div style="display:flex;flex-direction:column;gap:9px;margin-top:11px">
    ${rows.map(r=>{
      const hard=r.rate==='hard';
      return `<div style="padding:13px 15px;border-radius:16px;
        background:${hard?'rgba(200,122,86,.12)':'rgba(159,176,152,.20)'};
        border:1px solid ${hard?'rgba(200,122,86,.30)':'rgba(159,176,152,.42)'}">
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <span style="font:800 9px/1 var(--sans);letter-spacing:.11em;padding:4px 7px;border-radius:6px;
            background:${hard?'rgba(200,122,86,.30)':'rgba(159,176,152,.45)'};
            color:${hard?'#7d3b28':'#0a7b74'}">${hard?'TOO HARD':'TOO EASY'}</span>
          <b style="font:600 14.5px/1.3 var(--sans)">${esc(r.n)}</b>
          ${r.times?`<span style="margin-left:auto;font:400 12px/1 var(--sans);
            color:var(--grey2)">Flagged ${r.times}×</span>`:''}
        </div>
        ${r.note?`<div style="font:italic 400 13px/1.55 var(--sans);color:var(--grey);margin-top:7px">
          &ldquo;${esc(r.note)}&rdquo;</div>`:''}
      </div>`;}).join('')}
    </div>`;
}
const drillName=v=>String(v||'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

let wideActivity=false;   /* activity across the whole width, not a column */
let openSess=null;   /* which session row is expanded */

/* ── sessions, newest first ────────────────────────────────────────
   From the design. A row per session says what happened; tapping one
   opens the drill-by-drill. An abandoned session is the interesting
   case — it names the drill it died on, marks what was never reached,
   and says whether that drill has been flagged before. */
function sessionsHTML(email){
  const p=prog[email]||{};
  const list=(p.sessions||[]).filter(x=>x&&x.at).slice().sort((a,b)=>b.at-a.at).slice(0,12);
  const opens=(p.opens||[]);
  const flags=p.flags||{};
  if(!list.length) return '';
  const dayLabel=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});

  return `<div class="kick" style="margin-top:26px;display:flex;justify-content:space-between;
      align-items:baseline;gap:10px">
      <span>SESSIONS · NEWEST FIRST</span>
      <span style="font:400 11px/1 var(--sans);text-transform:none;letter-spacing:0;
        color:var(--grey2)">Tap one for the drill-by-drill</span></div>
    <div style="display:flex;flex-direction:column;gap:7px;margin-top:11px">
    ${list.map((x,i)=>{
      const open=openSess===i;
      const pct=x.of?Math.round((x.got/x.of)*100):0;
      const glyph = x.done ? {bg:'var(--forest)',fg:'#fff',ch:'&check;'}
                           : {bg:'var(--terra)',fg:'#fff',ch:'!'};
      const summary = x.done
        ? `${esc(x.name||'Session')} · ${x.items&&x.items.length?x.items.length+' drills, ':''}${
            x.got===x.of?'all sets completed':x.got+' of '+x.of+' sets'}`
        : `Stopped in ${esc(x.block||'the session')} — ${esc(x.stoppedAt||'unknown drill')}`;
      return `<div>
        <button onclick="openSess=${open?'null':i};draw()" style="width:100%;text-align:left;
          cursor:pointer;display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:16px;
          background:rgba(255,255,255,.72);border:1px solid ${open?'var(--line)':'transparent'}">
          <span style="flex:none;width:26px;height:26px;border-radius:999px;display:grid;
            place-items:center;font:700 12px/1 var(--sans);background:${glyph.bg};color:${glyph.fg}">${glyph.ch}</span>
          <b style="flex:none;font:700 13.5px/1.3 var(--sans);width:54px">${dayLabel(x.at)}</b>
          <span style="flex:1;min-width:0;font:400 13.5px/1.4 var(--sans);color:var(--grey)">${summary}</span>
          <span style="flex:none;width:74px;height:6px;border-radius:3px;background:rgba(28,32,25,.1);

            background:${x.done?'var(--forest)':'var(--terra)'}"></i></span>
          <b style="flex:none;font:700 12.5px/1 var(--sans);width:78px;text-align:right;
            font-variant-numeric:tabular-nums">${x.actual||0}m / ${x.mins||0}m</b>
        </button>
        ${open?sessionDetail(x,flags):''}
      </div>`;}).join('')}
    ${opens.length>list.length?`<div style="font:400 12px/1.5 var(--sans);color:var(--grey2);padding:4px 2px">
      Days the app was opened without a session logged do not appear here — they are on the calendar.</div>`:''}
    </div>`;
}

function sessionDetail(x,flags){
  const items=x.items||[];
  if(!items.length) return `<div style="background:var(--mist);border-radius:14px;padding:13px 15px;
    margin-top:6px;font:400 13px/1.6 var(--sans);color:var(--grey)">
    No drill-by-drill for this one — it predates the app recording it.</div>`;
  const blocks=[...new Set(items.map(i=>i.grp).filter(Boolean))];
  const stopped=!x.done;
  let hitStop=false;
  return `<div style="background:var(--mist);border-radius:16px;padding:14px 15px;margin-top:6px">
    <div class="kick" style="margin:0 0 10px">${esc(blocks.join(' · ').toUpperCase())}${stopped?' (STOPPED)':''}</div>
    <div style="display:flex;flex-direction:column;gap:6px">
    ${items.map(it=>{
      const partial = it.got>0 && it.got<it.of;
      const none = it.got===0;
      if(partial) hitStop=true;
      /* where they stopped beats how it felt — for this session that is the
         thing you need to see, and the rating still shows on the row that
         was completed elsewhere */
      const tag = partial ? {t:'STOPPED',bg:'var(--terra)',fg:'#fff'}
        : none && hitStop ? {t:'SKIPPED',bg:'rgba(28,32,25,.08)',fg:'var(--grey2)'}
        : it.rate==='hard' ? {t:'HARD',bg:'rgba(200,122,86,.18)',fg:'var(--terra)'}
        : it.rate==='easy' ? {t:'EASY',bg:'rgba(159,176,152,.28)',fg:'var(--forest)'}
        : {t:'DONE',bg:'rgba(28,32,25,.08)',fg:'var(--grey)'};
      return `<div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;
        background:${partial?'rgba(200,122,86,.10)':'#fff'};
        border:1px solid ${partial?'rgba(200,122,86,.4)':'transparent'}">
        <span style="flex:none;width:74px;font:700 9px/1.3 var(--sans);letter-spacing:.1em;
          text-transform:uppercase;color:var(--grey2)">${esc(it.grp||'')}</span>
        <span style="flex:1;min-width:0;font:600 13.5px/1.3 var(--sans)">${esc(it.n||it.v)}</span>
        <span style="flex:none;font:400 12.5px/1 var(--sans);color:var(--grey2);
          font-variant-numeric:tabular-nums">${none&&hitStop?'not reached':it.got+'/'+it.of+' sets'}</span>
        <span style="flex:none;font:800 9px/1 var(--sans);letter-spacing:.1em;padding:5px 8px;
          border-radius:6px;background:${tag.bg};color:${tag.fg}">${tag.t}</span>
      </div>`;}).join('')}
    </div>
    ${stopped?`<div style="margin-top:11px;padding:11px 13px;border-radius:12px;
      background:rgba(200,122,86,.12);border:1px solid rgba(200,122,86,.35);
      font:400 13px/1.55 var(--sans);color:#7b3a22">
      Abandoned at ${esc(x.stoppedAt||'an unknown drill')}, ${x.actual||0} minutes in.${
      (()=>{ const f=flags[(items.find(i=>i.got>0&&i.got<i.of)||{}).v];
             return f&&f.rate==='hard' ? ' Same drill they have flagged too hard.' : ''; })()}
      </div>`:''}
  </div>`;
}

/* one line per drill rather than a table you read sideways — a number
   going up is the thing a coach is looking for, and a chart says it
   without being read */
function testCharts(tests){
  if(!tests.length) return '';
  const drills=[...new Set(tests.flatMap(t=>Object.keys(t.vals||{})))];
  const series=drills.map(k=>({
    name:k,
    pts:tests.map(t=>({at:t.at, s:parseFloat(String((t.vals||{})[k]||'').replace(/[^\d.]/g,''))}))
             .filter(p=>!isNaN(p.s))
  })).filter(x=>x.pts.length);
  if(!series.length) return '';
  return `<div class="kick" style="margin-top:26px">TEST RESULTS</div>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">
    ${series.map(x=>{
      const first=x.pts[0].s, last=x.pts[x.pts.length-1].s;
      const delta=Math.round((last-first)*10)/10;
      const up=delta>0;
      return `<div style="background:rgba(255,255,255,.7);border-radius:14px;padding:12px 14px">
        <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">
          <b style="font:600 13.5px/1.3 var(--sans);flex:1;min-width:0">${esc(x.name)}</b>
          <span class="h-sm" style="font-size:19px">${last}</span>
          ${x.pts.length>1?`<span style="font:700 11px/1 var(--sans);padding:4px 7px;border-radius:5px;
            background:${up?'rgba(159,176,152,.4)':delta<0?'rgba(200,122,86,.2)':'var(--mist)'};
            color:${up?'#0a7b74':delta<0?'#7d3b28':'var(--grey2)'}">
            ${delta>0?'+':''}${delta}</span>`:''}
        </div>
        ${x.pts.length>1?`<div style="margin-top:8px">${lineChart(x.pts,'')}</div>`
          :`<div style="font:400 12px/1.5 var(--sans);color:var(--grey2);margin-top:5px">
             One reading so far — a second one draws the line.</div>`}
      </div>`;}).join('')}
    </div>`;
}

/* Snippets. The design calls for canned replies with no data behind them, so
   these are the openings actually worth having: the ones written fresh every
   time and always roughly the same. They drop into the box to be edited,
   never sent as-is — a reply that reads as a template is worse than a slow
   one, which is why each one ends mid-sentence. */
const SNIPPETS=[
  ['Got it', "Got your clips — watching them today, I'll come back with the one thing to change."],
  ['One change', "One thing to change this block: "],
  ['Looking better', "This is better than last time — specifically, "],
  ['Re-film', "I can't see enough to call it. Could you re-film side on, whole body in frame, hands not cropped?"],
  ['Ease off', "Back off the volume this week. "],
];
function useSnippet(i){
  const el=$('#reply'); if(!el) return;
  const t=SNIPPETS[i][1];
  el.value = el.value ? (el.value.replace(/\s*$/,'') + ' ' + t) : t;
  drafts[sel]=el.value; el.focus();
  try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
}
function snippetsHTML(){
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
    <span style="font:800 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
      color:rgba(28,32,25,.42);margin-right:2px">Snippets</span>
    ${SNIPPETS.map((sn,i)=>`<button onclick="useSnippet(${i})" title="${esc(sn[1])}"
      style="cursor:pointer;padding:6px 11px;border-radius:999px;font:700 11.5px/1 var(--sans);
      border:1px solid rgba(28,32,25,.12);background:rgba(255,255,255,.72);color:var(--ink)">
      ${esc(sn[0])}</button>`).join('')}
  </div>`;
}

   Two of the three steps can happen here. The third cannot: the roster
   lives in the CLIENTS environment variable, so who counts as a coached
   client is decided in Netlify and needs a redeploy. This at least says

function newClientHTML(){
  return `<div class="glass" style="padding:16px 18px;margin-bottom:14px">
    <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">NEW COACHING CLIENT</div>
    <div style="font:400 13px/1.6 var(--sans);color:var(--grey);margin-top:8px">

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">

      <input id="ncName" placeholder="Their name" style="flex:1;min-width:130px;${bInput}">
      <input id="ncPw" placeholder="Password (8+)" style="flex:1;min-width:130px;${bInput}">

function makeClient(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const email=g('ncEmail').trim().toLowerCase(), name=g('ncName').trim(), pw=g('ncPw');
  const say=t=>{ const m=document.getElementById('ncMsg'); if(m) m.textContent=t; };
  if(!email||pw.length<8){ say('An email and a password of at least 8 characters.'); return; }
  say('Creating…');
  const coach=(document.getElementById('ncCoach')||{}).value||'';
  fetch(API+'/setpw',{method:'POST',headers:hdr(),body:JSON.stringify({email,password:pw})})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>fetch(API+'/roster',{method:'POST',headers:hdr(),
      body:JSON.stringify({email,name,coach})})
      .then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(()=>{
        say((d.hadAccount?'Password set on their existing account.':'Account created.')
          +' They are on the roster — open their thread to write a programme.');
        const c=document.getElementById('ncEmail'); if(c) c.value='';
        const n2=document.getElementById('ncName'); if(n2) n2.value='';
        const w=document.getElementById('ncPw'); if(w) w.value='';
        load();
      }))
    .catch(()=>say('Could not set that up.'));
}

function clientRow(c){
    const a=prog[c.email]?analysis(c.email):null;
    const tone=a?a.tone:null;
    const col=tone==='bad'?'var(--terra)':tone==='warn'?'#f3a949':tone==='ok'?'var(--forest)':'transparent';
    const line=a
      ? (a.sinceLast===null?'no sessions yet'
        : a.sinceLast===0?'trained today'
        : a.sinceLast+'d since last · '+a.adherence+'%')
      : ago(c.last);
    const wait=(queue.find(q=>q.email===c.email)||null);
    const wh=wait?Math.round((Date.now()-(wait.at||0))/3600000):0;
    const wr=wait?ringFor(wh):null;
    return `<button class="cli ${c.email===sel?'on':''}" onclick="openThread('${esc(c.email)}')">
    <span class="av">${esc((c.name||'?')[0])}</span>
    <span style="min-width:0"><b>${esc(c.name)}</b>
      <span style="display:block;font:400 11.5px/1.4 var(--sans);color:var(--grey2);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.email)}</span>
      <span>${esc(line)}</span></span>
    <span style="display:flex;align-items:center;gap:7px;margin-left:auto">
      ${c.coach&&COACHES.size>1?`<span title="Coached by ${esc(c.coach)}"
        style="font:600 9px/1 var(--sans);letter-spacing:.08em;padding:4px 6px;border-radius:4px;
        background:var(--mist);color:var(--grey)">${esc((c.coach.split('@')[0]||'').slice(0,8).toUpperCase())}</span>`:''}
    ${c.coached===false?`<span title="Not a coaching client — free account"
        style="font:600 9px/1 var(--sans);letter-spacing:.11em;padding:4px 6px;border-radius:4px;
        background:var(--mist);color:var(--grey)">ENQUIRY</span>`:''}
      ${wait?`<span title="Waiting ${wh} hours — the promise is 48"
        style="font:800 9px/1 var(--sans);letter-spacing:.08em;padding:3px 6px;border-radius:6px;
        background:${wr.ring};color:#fff">${wh}H</span>`:''}
      ${c.unread?`<span class="dot" title="${c.unread} unread message${c.unread===1?'':'s'} from them">${c.unread}</span>`:''}
      <i style="width:8px;height:8px;border-radius:999px;background:${col};flex:none"
        title="${a?esc(a.status)+' — based on how recently and how consistently they have trained':'No activity recorded yet'}"></i>
    </span></button>`;
}

/* Coaching clients and enquiries were one undifferentiated list, which is
   no use when the two need different things from you. */
function clientList(){
  if(!clients.length) return `<div style="font:400 14px/1.5 var(--sans);color:var(--grey);padding:10px">
    Nobody yet.</div>`;
  const coached=clients.filter(c=>c.coached!==false);
  const leads=clients.filter(c=>c.coached===false);
  const unread=a=>a.reduce((t,c)=>t+(c.unread||0),0);
  const group=(label,arr)=>arr.length?`
    <div style="display:flex;align-items:baseline;gap:8px;margin:14px 2px 8px">
      <span class="kick">${label} · ${arr.length}</span>
      ${unread(arr)?`<span class="dot" title="unread">${unread(arr)}</span>`:''}
    </div>${arr.map(clientRow).join('')}`:'';
  const f=rosterFilter;
  const keep=a=>f==='waiting'?a.filter(c=>queue.some(q=>q.email===c.email))
    :f==='unread'?a.filter(c=>c.unread):a;
  const chips=[['all','All'],['waiting','Waiting'],['unread','Unread']].map(([id,l])=>
    `<button onclick="rosterFilter='${id}';draw()" style="cursor:pointer;padding:6px 11px;
      border-radius:999px;font:700 11px/1 var(--sans);
      border:1px solid ${f===id?'transparent':'rgba(28,32,25,.14)'};
      background:${f===id?'var(--forest)':'rgba(255,255,255,.6)'};
      color:${f===id?'#fff':'var(--ink)'}">${l}</button>`).join('');
  const body=group('COACHING',keep(coached))+group('ENQUIRIES',keep(leads));
  return `<div style="display:flex;gap:6px;padding:0 2px 4px">${chips}</div>`
    + (body||`<div style="font:400 13.5px/1.6 var(--sans);color:var(--grey);padding:12px 4px">
        Nobody matches that filter.</div>`);
}

function draw(){
  const list=clientList();
  const msgs=thread.map(m=>`<div style="display:flex;flex-direction:column;align-items:${m.from==='coach'?'flex-end':'flex-start'}">
    ${m.video?`<div style="width:min(260px,80%);border-radius:16px;overflow:hidden;background:#101413;
      margin-bottom:${m.text?'6px':'0'}">
      <iframe src="${streamEmbed(m.video)}" loading="lazy" allow="fullscreen"
        style="display:block;width:100%;aspect-ratio:4/5;border:0"></iframe></div>
    ${m.from!=='coach'?`<button onclick="reviewClip('${esc(m.video)}','${
      esc((clients.find(c=>c.email===sel)||{}).name||'Client')} · ${esc(ago(m.at))}')"
      style="margin-bottom:6px;border:1px solid rgba(0,102,99,.3);border-radius:9px;background:#fff;
      cursor:pointer;padding:5px 10px;font:600 11px/1 var(--sans);color:var(--forest)">
      Review this</button>`:''}
    ${Date.now()-(m.at||0)<180000?`<div style="font:500 11px/1.4 var(--sans);color:var(--grey2);margin:0 0 6px">
      Just uploaded — Cloudflare is still encoding it. If the player errors, give it a minute and reload.</div>`:''}`:''}
    ${m.image?`<a href="/api/app/image/${esc(m.image)}" target="_blank" rel="noopener"
      style="width:min(260px,80%);border-radius:16px;overflow:hidden;background:#101413;
      margin-bottom:${m.text?'6px':'0'};display:block">
      <img src="/api/app/image/${esc(m.image)}" alt="Shared photo" loading="lazy"
        style="display:block;width:100%;max-height:340px;object-fit:contain"></a>`:''}
    ${m.text?`<div style="max-width:76%;padding:11px 15px;border-radius:18px;
      font:400 14px/1.5 var(--sans);
      background:${m.from==='coach'?'var(--forest)':'rgba(255,255,255,.82)'};
      color:${m.from==='coach'?'#fff':'var(--ink)'};
      border:1px solid ${m.from==='coach'?'transparent':'rgba(255,255,255,.9)'};
      box-shadow:inset 0 1px 0 rgba(255,255,255,${m.from==='coach'?'.14':'.6'}),
        0 8px 18px -16px rgba(28,32,25,.6)">${esc(m.text)}</div>`:''}
    <div class="at">${m.from==='coach'?'You':esc((clients.find(c=>c.email===sel)||{}).name||'')} · ${ago(m.at)}</div></div>`).join('')
    || `<div style="font:400 14.5px/1.6 var(--sans);color:var(--grey)">Nothing here yet.</div>`;
  $('#v').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline">
      <h1>Coach</h1>
      <button class="send" style="background:none;color:var(--grey2)" onclick="localStorage.removeItem('lha_coach_token');localStorage.removeItem('lha_coach_email');location.reload()">Sign out</button></div>

    ${urgentHTML()}
    <div style="display:flex;gap:8px;margin-top:18px">
      ${[['clients','Clients'],
         ['free','Form checks'+(freeQ().length?' · '+freeQ().length:'')],
         ['paid','Client reviews'+(paidQ().length?' · '+paidQ().length:'')],
         ['apps','Applications'+(newApps().length?' · '+newApps().length:'')],
         ['workouts','Workouts'],
         ['review','Review'+(reviewQueue.length?' · '+reviewQueue.length:'')],
         ['setup','Settings']].map(([id,label])=>
        `<button onclick="view='${id}';draw()" style="cursor:pointer;border-radius:999px;padding:9px 16px;
          font:600 12.5px/1 var(--sans);border:1.5px solid ${view===id?'var(--forest)':'var(--line)'};
          background:${view===id?'var(--forest)':'#fff'};color:${view===id?'#fff':'var(--ink)'}">
          ${label}</button>`).join('')}
    </div>
    ${wideActivity&&sel&&view==='clients'?`
      <div style="margin-top:16px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
          <button onclick="wideActivity=false;draw()" class="send"
            style="width:auto;padding:0 14px;font-size:12.5px;background:var(--mist);color:var(--ink)">
            ← Back to threads</button>
          <b style="font:600 15px/1 var(--sans)">${esc((clients.find(c=>c.email===sel)||{}).name||sel)}</b>
          <span style="font:400 12px/1 var(--sans);color:var(--grey2)">${esc(sel)}</span>
        </div>
        <div class="wideGrid">${metricsHTML(sel)}</div>
      </div>`:
      view==='setup'?`<div style="margin-top:16px">
        ${newClientHTML()}${mailguardHTML()}${dbHTML()}
        <div style="font:400 12.5px/1.6 var(--sans);color:var(--grey2);margin-top:16px;max-width:60ch">
          The database check and the copy are one-time setup. The copy reads the
          old Blobs store, so running it now would push stale data over live
          records — leave it alone unless something has gone wrong.</div>
      </div>`:
      view==='workouts'?`<div style="margin-top:16px">${workoutsHTML()}</div>`:
      view==='review'?`<div style="margin-top:16px">${reviewHTML()}</div>`:
      view==='questions'?`<div style="margin-top:16px">${questionsHTML()}</div>`:
      view==='apps'?`<div style="margin-top:16px">${appsHTML()}</div>`:
      view==='free'||view==='paid'?`<div style="margin-top:16px">${queueHTML(view)}</div>
      ${sel?`<div style="margin-top:14px">${threadCardHTML(msgs)}</div>`:''}`:`
    <div class="grid">
      <div class="card"><div class="kick">CLIENTS</div><div style="margin-top:10px">${list}</div></div>
      ${threadCardHTML(msgs)}
      ${sel?`<div class="card">${metricsHTML(sel)}</div>`:''}
      </div>`}`+builderHTML()+cpsHTML()+acctHTML()+newDrillHTML();
  syncReview();
}
TOKEN?load():gate('');
</script></body></html>
