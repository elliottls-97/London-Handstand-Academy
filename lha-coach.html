function ndSet(f,val){
  if(!newDrill) return;
  newDrill[f]=val;
  /* the slug follows the name until someone types their own */
  if(f==='n' && !newDrill.slugEdited) newDrill.v=ndSlug(val);
  if(f==='v') newDrill.slugEdited=true;
  const sl=document.getElementById('ndSlug'); if(sl && f==='n') sl.value=newDrill.v;
}
function ndPickFile(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove();
    if(f){ newDrill.file=f; newDrill.msg=f.name; draw(); } };
  inp.click();
}
function ndSay(m){ if(newDrill) newDrill.msg=m;
  const el=document.getElementById('ndMsg'); if(el) el.textContent=m; }
function ndSave(){
  if(!newDrill || ndBusy) return;
  const name=(document.getElementById('ndName')||{}).value||'';
  const slug=ndSlug((document.getElementById('ndSlug')||{}).value||name);
  const desc=(document.getElementById('ndDesc')||{}).value||'';
  const cues=((document.getElementById('ndCues')||{}).value||'')
    .split('\n').map(x=>x.trim()).filter(Boolean);
  if(!name.trim()) return ndSay('It needs a name.');
  if(!slug) return ndSay('That name has no letters in it.');
  Object.assign(newDrill,{n:name,v:slug,desc:desc,cuesArr:cues});
  ndBusy=true; draw();
  const post=uid=>fetch(API+'/drill',{method:'POST',headers:hdr(),
      body:JSON.stringify({v:slug,n:name,desc,cues,uid,
        stage:newDrill.stage===''?null:Number(newDrill.stage),
        group:newDrill.group, level:newDrill.level})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||('the server said '+r.status))));
  const step = newDrill.file
    ? fetch(APP+'/upload',{method:'POST',headers:hdr(),body:'{}'})
        .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
        .then(d=>new Promise((res,rej)=>{
          const fd=new FormData(); fd.append('file',newDrill.file);
          const x=new XMLHttpRequest(); x.open('POST',d.uploadURL);
          x.upload.onprogress=e=>{ if(e.lengthComputable)
            ndSay('Uploading… '+Math.round(e.loaded/e.total*100)+'%'); };
          x.onload=()=> (x.status>=200&&x.status<300)?res(d.uid):rej('Upload failed ('+x.status+')');
          x.onerror=()=>rej('Upload failed, check your signal');
          x.send(fd);
        })).then(uid=>{ ndSay('Saving the drill…'); return post(uid); })
    : (ndSay('Saving the drill…'), post(''));
  step.then(()=>{
      ndBusy=false;
      libIndex[slug]=name;
      /* read the target before clearing it, then drop the drill straight into
         whatever was open when they pressed New drill */
      const t=newDrill.target;
      if(t && t.kind==='item' && builder){
        const it=((bDays()[t.day]||{}).groups||[])[t.grp]
          && bDays()[t.day].groups[t.grp].items[t.idx];
        if(it){ it.drill=slug; it.v=slug; it.n=name; builder.dirty=true; }
      } else if(t && t.kind==='cpdemo' && cpEdit && cpEdit.list){
        const c=cpEdit.list[t.idx]; if(c){ c.demo=slug; cpEdit.dirty=true; }
      }
      newDrill=null; draw();
    })
    .catch(e=>{ ndBusy=false; ndSay(String(e&&e.message||e)); draw(); });
}

    (libIndex[a]||a).localeCompare(libIndex[b]||b));
  return `<option value="">Pick a drill…</option>`+ids.map(v=>
    `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(libIndex[v]||v)}</option>`).join('');
}

function builderHTML(){
  if(!builder) return '';
  const days=bDays();
  const name=((clients.find(c=>c.email===builder.email)||{}).name)||builder.email;
  const di=bDay(), d=days[di];
  const tab=(on,label,sub,click,del)=>`<span style="position:relative;display:inline-flex">
    <button onclick="${click}" style="border:1px solid ${on?'transparent':'var(--line)'};
      border-radius:12px;padding:9px 13px;cursor:pointer;text-align:left;
      background:${on?'var(--forest)':'#fff'};color:${on?'#fff':'var(--ink)'};
      font:600 12.5px/1.2 var(--sans)">${esc(label)}${sub?`<span style="display:block;
      font:500 10px/1.3 var(--sans);margin-top:3px;

    ${del?`<button onclick="${del}" title="Remove" style="position:absolute;top:-6px;right:-6px;
      width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:#fff;
      color:var(--grey2);cursor:pointer;font:600 11px/1 var(--sans);padding:0">×</button>`:''}

  const dayTabs=`<div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:14px">

  const body = days.length ? `${dayTabs}
    <div class="glass" style="padding:15px 17px;margin-top:12px">
      <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
        <input value="${esc(d.label||'')}" oninput="bField(${di},'label',this.value)"

          placeholder="45" style="flex:0 0 54px;${bInput}">

      ${lengthLine(d)}
      <input value="${esc(d.when||'')}" oninput="bField(${di},'when',this.value)"
        placeholder="What they need. Floor and a chair, nothing else."
        style="width:100%;margin-top:8px;${bInput}">

      ${(function(){
        const gs=d.groups||[];
        if(!gs.length) return `<div style="font:400 13px/1.6 var(--sans);color:var(--grey);
          margin-top:14px">No blocks in this day yet.</div>
          <button onclick="bAddGroup(${di})" style="${bGhost};margin-top:10px">+ Block</button>`;
        const gi=bGrp(), g=gs[gi];
        return `<div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:14px;
          padding-top:12px;border-top:1px solid var(--line)">
          ${gs.map((x,k)=>tab(k===gi, x.name||('Block '+(k+1)),
              ((x.items||[]).length)+' drill'+((x.items||[]).length===1?'':'s'),
              'bPickGrp('+k+')', 'bDelGroup('+di+','+k+')')).join('')}
          <button onclick="bAddGroup(${di})" style="${bGhost}">+ Block</button>
        </div>
        <div style="margin-top:13px">
          <input value="${esc(g.name||'')}" oninput="bGroupName(${di},${gi},this.value)"
            placeholder="Warm-up" style="width:100%;${bInput};font-weight:600">
          ${(g.items||[]).map((it,k)=>`
            <div style="display:flex;gap:7px;align-items:center;margin-top:7px;flex-wrap:wrap">
              <span style="flex:none;display:flex;flex-direction:column;gap:2px">
                <button onclick="bMove(${di},${gi},${k},-1)" style="${bTiny}" aria-label="Up">▲</button>
                <button onclick="bMove(${di},${gi},${k},1)" style="${bTiny}" aria-label="Down">▼</button>
              </span>
              <select onchange="bItem(${di},${gi},${k},'v',this.value)"
                style="flex:1;min-width:200px;${bInput}">${drillOptions(it.v)}</select>
              <button title="Make a new drill"
                onclick="openNewDrill({kind:'item',day:${di},grp:${gi},idx:${k}})"
                style="flex:none;border:1px solid var(--line);border-radius:10px;background:#fff;
                cursor:pointer;min-width:40px;min-height:40px;font:600 17px/1 var(--sans);
                color:var(--forest)">+</button>
              ${clipBtn(it.v)}
              <button onclick="bDelItem(${di},${gi},${k})" style="${bGhost}">×</button>
            </div>
            <!-- The row could set the drill, the dose and a note, and nothing
                 else. The specs write seconds and rests onto items and there
                 was no way to see or change them here, which is half of what
                 tuning somebody's programme means. Same five fields as the
                 Workouts tab, on this client's row rather than the ladder. -->
            <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;
              margin:7px 0 0 30px">
              ${(function(){
                const n=bNums(it, g.name||'');
                const f=(lab,html)=>`<label style="flex:none;display:flex;flex-direction:column;gap:4px">
                  <span style="font:600 8.5px/1 var(--sans);letter-spacing:.1em;
                    color:var(--grey2)">${lab}</span>${html}</label>`;
                const num=(fld,val,ph,w)=>`<input type="number" min="0" value="${val==null?'':val}"

                return f('SETS', n.warm
                    ? `<span style="${bInput};width:60px;display:inline-flex;align-items:center;
                         color:var(--grey2);font-weight:600">1</span>`
                    : num('sets', it.sets!=null?it.sets:n.sets, '3', 60))
                  + f('BUILD TO', num('amt', it.amt!=null?it.amt:n.amt, '8', 70))
                  + f('IN', `<select onchange="bItem(${di},${gi},${k},'unit',this.value)"
                      style="${bInput};width:94px">
                      <option value=""${(it.unit!=null?it.unit:n.unit)===''?' selected':''}>reps</option>
                      <option value="s"${(it.unit!=null?it.unit:n.unit)==='s'?' selected':''}>seconds</option>
                    </select>`)
                  + f('SECONDS TO DO IT', num('w', it.w!=null?it.w:n.w, String(n.w), 84))
                  + f('REST', num('r', it.r!=null?it.r:n.r, String(n.r), 64))
                  + f('WHAT THEY READ', `<input value="${esc(it.d||'')}"
                      oninput="bItem(${di},${gi},${k},'d',this.value)"
                      placeholder="60s each arm" style="${bInput};width:140px">`)
                  + `<span data-brow="${di}-${gi}-${k}" style="flex:1;min-width:100px;text-align:right;
                      font:500 11.5px/1.4 var(--sans);color:var(--grey)">${bRowLen(it, g.name||'')}</span>`;
              })()}
            </div>
            <input value="${esc(it.nt||'')}" oninput="bItem(${di},${gi},${k},'nt',this.value)"
              placeholder="A note for this drill, if it needs one"
              style="width:calc(100% - 34px);margin:5px 0 0 34px;${bInput};font-size:12px">
          `).join('')}
          <button onclick="bAddItem(${di},${gi})" style="${bGhost};margin-top:9px">+ Drill</button>
        </div>`;})()}
    </div>`
    : `${dayTabs}
       <div class="glass" style="padding:22px;margin-top:12px;text-align:center;
         font:400 13.5px/1.6 var(--sans);color:var(--grey)">
         No days yet. Add one and start putting blocks in it.</div>`;


  return `<div style="position:fixed;inset:0;z-index:80;background:rgba(0,30,28,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;justify-content:center;overflow-y:auto;padding:22px 14px">
    <div style="width:100%;max-width:940px;height:max-content;background:var(--bg);
      border-radius:22px;padding:22px;box-shadow:0 30px 70px -30px rgba(0,0,0,.5)">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:0">
          <div style="font:400 24px/1.1 var(--serif);color:var(--ink)">${esc(name)}</div>
          <div style="font:500 11px/1.4 var(--sans);color:var(--grey2);margin-top:4px">
            ${builder.edited?'Edited here':'From the original file'}${
            builder.dirty?' · unsaved changes':''}</div>
        </div>
        <button onclick="closeBuilder()" style="${bGhost}">Close</button>
        <button id="bSave" class="send" onclick="saveBuilder()">Save programme</button>
      </div>
      ${body}
      ${bExHTML()}
      ${bCpHTML()}
      <div style="font:400 12px/1.6 var(--sans);color:var(--grey2);margin:14px 0 30px">
        Saving writes the programme the client's app reads. Names, clips and cues come from
        the drill library, so they stay right on their own. You set the drill and the dose.
      </div>

const bInput='border:1px solid var(--line);border-radius:9px;padding:8px 10px;'
  +'background:#fff;font:400 13px/1.2 var(--sans);color:var(--ink)';
const bGhost='border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:transparent;'
  +'font:600 11.5px/1 var(--sans);color:var(--grey);cursor:pointer';
const bTiny='border:none;background:none;cursor:pointer;font:400 8px/1 var(--sans);color:var(--grey2);padding:1px';

/* Two cards, not one. Check points are the thing that gets looked at every
   day, so Progress shows them at the top; the habit squares and the metrics
   sit under the notes where they belong. trackHTML(email,'cp') is the
   check point half, trackHTML(email) is the rest. */
function trackHTML(email, only){
  /* the check point card is drawn from what the coach set, so it has
     something to say before the client has logged anything at all */
  const t=tracks[email]||{}; if(!tracks[email] && only!=='cp') return '';
  const HAB={wrists:'Wrist prep',shoulders:'Shoulder opener',hollow:'Hollow hold'};
  const MET={wall:['Distance from the wall','cm',true],
             press:['Press attempts held','reps',false],
             wrist:['Wrist discomfort','/10',true]};
  const day=i=>{ const d=new Date(); d.setDate(d.getDate()-i); return d.toISOString().slice(0,10); };

  const habits=Object.keys(HAB).map(h=>{
    const set=new Set((t.habits||{})[h]||[]);
    const days=[...Array(28).keys()].map(i=>set.has(day(27-i)));
    const rate=Math.round(days.filter(Boolean).length/28*100);
    return `<div style="display:flex;align-items:center;gap:10px;margin-top:9px">
      <span style="flex:none;width:104px;font:600 11.5px/1.2 var(--sans)">${HAB[h]}</span>
      <span style="flex:1;display:flex;gap:1.5px;min-width:0">${
        days.map(on=>`<i style="flex:1;height:13px;border-radius:2px;
          background:${on?'var(--forest)':'var(--mist)'}"></i>`).join('')}</span>
      <span style="flex:none;width:34px;text-align:right;font:700 12px/1 var(--sans);
        color:${rate>=70?'var(--forest)':'var(--grey2)'}">${rate}%</span></div>`;
  }).join('');

  const mets=Object.keys(MET).map(m=>{
    const h=((t.metrics||{})[m]||[]).slice(-8); if(!h.length) return '';
    const last=h[h.length-1], prev=h.length>1?h[h.length-2]:null;
    const [name,unit,lower]=MET[m];
    const better=prev?(lower?last.v<prev.v:last.v>prev.v):null;
    return `<div style="display:flex;align-items:baseline;gap:10px;margin-top:9px">
      <span style="flex:1;font:500 12.5px/1.2 var(--sans)">${name}</span>
      <span style="flex:none;font:700 14px/1 var(--sans);color:var(--forest)">${last.v}</span>
      <span style="flex:none;width:26px;font:600 10px/1 var(--sans);color:var(--grey2)">${unit}</span>
      <span style="flex:none;width:44px;text-align:right;font:600 10px/1 var(--sans);
        color:${better===null?'var(--grey2)':better?'var(--forest)':'var(--terra)'}">${
        prev?(better?'better':'worse'):'first'}</span></div>`;
  }).join('');

  const CPN={
    'ch-assist':'Chair-assisted handstand','fall-comfort':'Falling off the wall','wall-45':'45° wall hold',
    plank:'Plank pose',crow:'Crow pose',chaturanga:'Chaturanga push-ups','kickup-rate':'Kick up to wall',
    'ctw-hold':'Chest-to-wall','scap-shrugs':'Wall scapula shrugs','sl-tuck':'Single-leg tuck slides',
    'pike-neg':'Pike negatives','pike-full':'Pike push-ups','nose-toes':'Nose to toes',
    'assist-entry':'Assisted entries','tuck-depth':'Tuck slides stacked','slide-count':'Slide aways',
    'slide-off':'Comes off the wall','box-dist':'Box distance','box-time':'Box hold','step-ups':'Step ups',
    'entry-clean':'Entries to eight','side-away':'Full slide away','tuck-takeoff':'Tuck take-offs',
    'box-lifts-l':'Box lifts, left','box-lifts-r':'Box lifts, right','shape-wall':'Shape changes on wall',
    'free-attempt':'Freestanding attempts','tuck-entries':'Tuck entries','straight-entries':'Straight entries',
    'straddle-entries':'Straddle entries','straddle-to-straight':'Straddle to straight',
    'straight-to-tuck-back':'Straight to tuck','straddle-to-diamond':'Straddle to diamond',
    'press-wall':'Chest-to-wall press',compression:'Compression','press-ecc':'Press eccentrics'};
  /* a check point the coach set for this client wins over the ladder's name */
  const own={};
  (cpDefs[email]||[]).forEach(c=>{ own[c.k]=c.n; });
  /* Every check point set for this client, not only the ones they have got
     round to: an untouched one used to be invisible here, so "nothing logged"
     and "nothing set" looked identical. */
  const defs=(cpDefs[email]||[]);
  const keys=[...new Set(defs.map(c=>c.k).concat(Object.keys(t.checkpoints||{})))];
  const cps=keys.map(k=>{
    const def=defs.find(c=>c.k===k)||null;
    const h=(t.checkpoints||{})[k]||[];
    const last=h.length?h[h.length-1]:null, prev=h.length>1?h[h.length-2]:null;
    const clips=h.filter(x=>x.video).slice(-3).reverse();
    /* A target of nought is a target nobody set. It printed as "90s / 0s"
       against a real logged value, and no check point can ever be met
       against it: the app needs a value at or above it, and for the
       lower-is-better ones a value above nought. Unset means unset. */
    const tgt=(def && Number(def.target)>0) ? Number(def.target) : null;
    const met = last && tgt!=null
      ? (def&&def.lower ? (last.v>0 && last.v<=tgt) : last.v>=tgt)
      : (last && def && (def.kind==='face') ? Number(last.v)>=2
         : last && def && def.kind==='yn' ? !!last.v : false);
    return {k, n:(def&&def.n)||own[k]||CPN[k]||k, last, prev, clips, tgt, met,
            unit:(def&&def.unit)||((def&&def.kind==='secs')?'s':''), kind:def&&def.kind};
  }).filter(c=>c.last||c.tgt!=null||defs.some(d=>d.k===c.k))
    .sort((a,b)=>(b.last?b.last.at:0)-(a.last?a.last.at:0));
  const cpMetN=cps.filter(c=>c.met).length;
  const cpClips=cps.reduce((a,c)=>a+c.clips.length,0);
  const cpBlock=cps.length?`<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">CHECK POINTS</span>
      <span style="font:600 10.5px/1 var(--sans);color:var(--grey2)">${cpMetN} of ${cps.length} reached${
        cpClips?' · '+cpClips+' clip'+(cpClips===1?'':'s'):''}</span>
    </div>
    ${cps.map(c=>{
      const val=c.last ? (c.kind==='face'
          ? ['Not really','Getting there','Yes'][Math.max(0,Math.min(2,Number(c.last.v)||0))]
          : c.kind==='yn' ? (c.last.v?'Yes':'Not yet') : c.last.v+c.unit)
        : 'not logged';
      return `<div style="margin-top:9px">
      <div style="display:flex;align-items:baseline;gap:9px">
        <span style="flex:none;width:15px;height:15px;border-radius:50%;
          background:${c.met?'var(--forest)':c.last?'rgba(243,169,73,.35)':'rgba(17,17,17,.1)'};
          color:#fff;font:700 9px/15px var(--sans);text-align:center">${c.met?'✓':''}</span>
        <span style="flex:1;min-width:0;font:500 12.5px/1.2 var(--sans);
          color:${c.last?'var(--ink)':'var(--grey2)'}">${esc(c.n)}</span>
        ${c.prev?`<span style="flex:none;font:500 11px/1 var(--sans);color:var(--grey2)">${
          c.prev.v}${esc(c.unit)} →</span>`:''}
        <span style="flex:none;font:700 14px/1 var(--sans);
          color:${c.met?'var(--forest)':c.last?'var(--ink)':'var(--grey2)'}">${esc(String(val))}</span>
        ${c.tgt!=null?`<span style="flex:none;font:400 11.5px/1 var(--sans);color:var(--grey2)">/ ${
          c.tgt}${esc(c.unit)}</span>`:''}
        <span style="flex:none;width:52px;text-align:right;font:500 10px/1 var(--sans);
          color:var(--grey2)">${c.last?daysAgo(c.last.at):''}</span>
      </div>
      ${c.clips.length?`<div style="display:flex;gap:7px;margin-top:6px;margin-left:24px;flex-wrap:wrap">
        ${c.clips.map(x=>`<span style="display:inline-flex">
          <button onclick="playCp('${esc(x.video)}')"
          style="border:1px solid rgba(0,102,99,.3);border-right:0;border-radius:8px 0 0 8px;
          background:rgba(0,102,99,.06);
          cursor:pointer;padding:6px 10px;font:600 10.5px/1 var(--sans);color:var(--forest)">
          &#9654; Watch ${daysAgo(x.at)}${x.v!=null?' · '+x.v+esc(c.unit):''}</button>
          <button onclick="reviewClip('${esc(x.video)}','${esc(c.n)} · '+'${esc(daysAgo(x.at))}')"
          title="Open this clip in the review tool"
          style="border:1px solid rgba(0,102,99,.3);border-radius:0 8px 8px 0;
          background:#fff;cursor:pointer;padding:6px 10px;font:600 10.5px/1 var(--sans);
          color:var(--forest)">Review</button></span>`).join('')}
      </div>`:''}
    </div>`;}).join('')}</div>`:'';

  const ci=(t.checkins||[]).slice(-1)[0];
  const check=ci?`<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">
    <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">
      LAST CHECK-IN · ${daysAgo(ci.at)}</div>
    <div style="display:flex;gap:14px;margin-top:8px">
      ${[['Feels',ci.mood],['Sore',ci.soreness],['Sleep',ci.sleep]].map(([k,v])=>
        `<span style="font:600 11.5px/1 var(--sans);color:var(--grey)">${k}
         <b style="color:var(--forest);font-size:14px">${v}</b>/10</span>`).join('')}</div>
    ${ci.note?`<div style="font:400 12.5px/1.5 var(--sans);color:var(--ink);margin-top:8px">
      &ldquo;${esc(ci.note)}&rdquo;</div>`:''}</div>`:'';

  if(only==='cp'){
    if(!cps.length) return `<div class="glass" style="padding:15px 17px">
      <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">CHECK POINTS</div>
      <p class="muted" style="font:400 13px/1.5 var(--sans);margin:9px 0 0">Nothing set for them yet.
      Open Check points from the menu on this client to write the ones you want to measure.</p></div>`;
    return `<div class="glass" style="padding:15px 17px">${cpBlock.replace('margin-top:12px;padding-top:11px;border-top:1px solid var(--line)','')}</div>`;
  }
  if(!habits && !mets && !check) return '';
  return `<div class="glass" style="padding:15px 17px;margin-top:11px">
    <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">TRACKING</div>
    ${habits}${mets?`<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">${mets}</div>`:''}
    ${check}</div>`;
}

function intakeHTML(email){
  const a=intakes[email];
  if(!a) return `<div class="kick" style="margin-top:24px">WHAT THEY SAID</div>
    <div style="font:400 13.5px/1.6 var(--sans);color:var(--grey);margin-top:8px">
      They joined before the intake existed, or have not finished it.</div>`;
  const rows=[
    ['Goal', GOAL_LABEL[a.goal]||a.goal||'—'],
    ['Level at signup', (a.level!=null?LEVEL_LABEL[a.level]:null)||'—'],
    ['Said they would train', a.days?`${a.days}× a week, ${a.mins||'?'} min`:'—'],
  ];
  const hurts=(a.niggles||[]).filter(x=>x&&x!=='Nothing right now');
  return `<div class="kick" style="margin-top:24px">WHAT THEY SAID</div>
    <div style="margin-top:10px">
      ${rows.map(([k,v])=>`<div style="display:flex;gap:12px;padding:5px 0;
        font:400 13.5px/1.6 var(--sans)">
        <span style="flex:none;width:118px;color:var(--grey2)">${k}</span>
        <span style="flex:1">${esc(v)}</span></div>`).join('')}
      ${hurts.length
        ? `<div style="display:flex;gap:12px;padding:9px 12px;margin-top:8px;border-radius:12px;
             background:rgba(200,122,86,.12);border-left:3px solid var(--terra);
             font:400 13.5px/1.5 var(--sans)">
             <span style="flex:none;width:106px;font-weight:700;color:var(--terra)">Told us hurts</span>
             <span style="flex:1">${hurts.map(esc).join(', ')}</span></div>`
        : `<div style="display:flex;gap:12px;padding:5px 0;font:400 13.5px/1.6 var(--sans)">
             <span style="flex:none;width:118px;color:var(--grey2)">Injuries</span>
             <span style="flex:1;color:var(--grey)">Nothing declared</span></div>`}
    </div>`;
}

/* ── the read, three rails ─────────────────────────────────────────
   From the design: Momentum, Friction, Do next. The first two are
   derived; the third is a judgement no amount of data produces, so it
   is the coach's own note promoted to where it will actually be read
   rather than buried at the bottom of the column. */
function readRails(email){
  const lines=summarise(email);
  const isFriction=x=>/too hard|flagged|stopped|abandon|stalled|no sessions|not started/i.test(x);
  const momentum=lines.filter(x=>!isFriction(x));
  const friction=lines.filter(isFriction);
  const note=((notes[email]||{}).text||'').trim();

  const rail=(kicker,text,accent,bg)=>`<div style="display:flex;gap:12px;padding:12px 14px;
    border-radius:16px;background:${bg};border-left:3px solid ${accent};margin-bottom:9px">
    <span style="font:800 9.5px/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;
      width:74px;flex:0 0 74px;color:${accent}">${kicker}</span>
    <span style="font:400 13.5px/1.55 var(--sans);color:#23281f">${text}</span></div>`;

  return `<div style="margin-top:11px">
    ${momentum.length?rail('Momentum', momentum.map(esc).join(' '), '#0a7b74','rgba(159,176,152,.22)'):''}
    ${friction.length?rail('Friction', friction.map(esc).join(' '), '#7d3b28','rgba(200,122,86,.14)'):''}
    ${rail('Do next',
      note ? esc(note)
           : `<span style="color:var(--grey2)">Nothing written yet — this is where your call on
              their next block goes. <button onclick="focusNote()" style="background:none;border:none;
              padding:0;cursor:pointer;font:inherit;color:var(--forest);text-decoration:underline;
              text-underline-offset:2px">Write it</button></span>`,
      '#006663','rgba(232,236,227,.75)')}
  </div>`;
}
function focusNote(){ const el=$('#cnote'); if(el){ el.scrollIntoView({block:'center'}); el.focus(); } }

/* ── where it is hard, where it is easy ────────────────────────────
   The flags with the client's own words next to them. The quote is the
   useful half — "shoulders burn out before the time is up" tells you
   what to change; a count does not. */
/* What they have said about this block, which is what you rewrite it from:
   the drills they called too hard or too easy with their own words, and how
   each session felt. frictionHTML was written and then called from nowhere,
   so every one of those flags went into the record and onto no screen. */
/* Which block they are on and how long it has run. The client sees this
   clock on their own Today screen, and nothing here showed it, so the one
   question worth asking, is this block overdue a rewrite, had no answer on
   the screen where you would answer it. */
function blockLineHTML(email){
  const c=cycles[email]; if(!c || !c.start) return '';
  const D=86400000;
  const wk=Math.max(1, Math.floor((Date.now()-c.start)/(7*D))+1);
  const due=Math.ceil(((c.dueAt||0)-Date.now())/D);
  const sent=(subs[email]||[]).some(s=>s.status==='submitted'&&s.kind!=='assessment');
  const late=!sent && due<0;
  const long=wk>=6;
  return `<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:var(--space-4);
    padding:12px 15px;border-radius:14px;
    background:${late||long?'rgba(243,169,73,.14)':'var(--surface)'};
    border:1px solid ${late||long?'rgba(243,169,73,.5)':'var(--line)'}">
    <span style="font:700 9.5px/1.4 var(--sans);letter-spacing:.14em;color:var(--grey2)">BLOCK ${c.n||1}</span>
    <span style="flex:1;min-width:200px;font:400 13.5px/1.55 var(--sans);color:#23281f">
      Week ${wk}. ${sent ? 'Their test is in and waiting on you.'
        : due>0 ? 'Test due in '+due+' day'+(due===1?'':'s')+'.'
        : due===0 ? 'Test due today.'
        : 'Test was due '+(-due)+' day'+(-due===1?'':'s')+' ago and nothing has come in.'}${
        long?' Six weeks in, so this block is due a rewrite.':''}</span>
    <button class="btn btn-ghost btn-sm" onclick="openBuilder('${esc(email)}')">Edit programme</button>
  </div>`;
}

function saidHTML(email){
  const p=prog[email]||{};
  const fric=frictionHTML(email);
  const felt=(p.feedback||[]).filter(f=>f&&(f.kind==='session feel'||f.text)).slice(-6).reverse();
  if(!fric && !felt.length) return '';
  return `<div class="card" style="margin-top:var(--space-4)">
    <div class="kick">WHAT THEY HAVE TOLD YOU</div>
    <p class="muted" style="font:400 13px/1.6 var(--sans);margin:8px 0 0;max-width:66ch">
      Every drill they flagged and every word they left, newest first. This is what the next
      block is written from.</p>
    ${fric}
    ${felt.length?`<div style="display:flex;flex-direction:column;gap:10px;margin-top:var(--space-4)">
      ${felt.map(f=>`<div style="border-left:2px solid var(--mist);padding-left:12px">
        <div style="font:600 9.5px/1 var(--sans);letter-spacing:.12em;color:var(--grey2)">
          ${esc(String(f.kind||'note').toUpperCase())} · ${ago(f.at)}</div>
        ${f.reasons&&f.reasons.length?`<div style="font:500 13.5px/1.5 var(--sans);margin-top:6px;color:var(--terra)">
          ${f.reasons.map(esc).join(' · ')}</div>`:''}
        ${f.text?`<div style="font:400 13.5px/1.5 var(--sans);margin-top:5px">${esc(f.text)}</div>`:''}
      </div>`).join('')}</div>`:''}
  </div>`;
}

function frictionHTML(email){
  const p=prog[email]||{};
  const rows=Object.entries(p.flags||{})
    .map(([v,f])=>({v, rate:f.rate, note:(f.note||'').trim(),
                    n:(drillName(v)||v), times:f.times||f.count||0}))
    .filter(r=>r.rate==='hard'||r.rate==='easy')
    .sort((a,b)=>(a.rate===b.rate?0:a.rate==='hard'?-1:1));
  if(!rows.length) return '';
  return `<div class="kick" style="margin-top:26px">WHERE IT IS HARD, WHERE IT IS EASY</div>
    <div style="display:flex;flex-direction:column;gap:9px;margin-top:11px">
    ${rows.map(r=>{
      const hard=r.rate==='hard';
      return `<div style="padding:13px 15px;border-radius:16px;
        background:${hard?'rgba(200,122,86,.12)':'rgba(159,176,152,.20)'};
        border:1px solid ${hard?'rgba(200,122,86,.30)':'rgba(159,176,152,.42)'}">
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <span style="font:800 9px/1 var(--sans);letter-spacing:.11em;padding:4px 7px;border-radius:6px;
            background:${hard?'rgba(200,122,86,.30)':'rgba(159,176,152,.45)'};
            color:${hard?'#7d3b28':'#0a7b74'}">${hard?'TOO HARD':'TOO EASY'}</span>
          <b style="font:600 14.5px/1.3 var(--sans)">${esc(r.n)}</b>
          ${r.times?`<span style="margin-left:auto;font:400 12px/1 var(--sans);
            color:var(--grey2)">Flagged ${r.times}×</span>`:''}
        </div>
        ${r.note?`<div style="font:italic 400 13px/1.55 var(--sans);color:var(--grey);margin-top:7px">
          &ldquo;${esc(r.note)}&rdquo;</div>`:''}
      </div>`;}).join('')}
    </div>`;
}
const drillName=v=>String(v||'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

let wideActivity=false;   /* activity across the whole width, not a column */
let openSess=null;   /* which session row is expanded */

/* ── sessions, newest first ────────────────────────────────────────
   From the design. A row per session says what happened; tapping one
   opens the drill-by-drill. An abandoned session is the interesting
   case — it names the drill it died on, marks what was never reached,
   and says whether that drill has been flagged before. */
function sessionsHTML(email){
  const p=prog[email]||{};
  const list=(p.sessions||[]).filter(x=>x&&x.at).slice().sort((a,b)=>b.at-a.at).slice(0,12);
  const opens=(p.opens||[]);
  const flags=p.flags||{};
  if(!list.length) return '';
  const dayLabel=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});

  return `<div class="kick" style="margin-top:26px;display:flex;justify-content:space-between;
      align-items:baseline;gap:10px">
      <span>SESSIONS · NEWEST FIRST</span>
      <span style="font:400 11px/1 var(--sans);text-transform:none;letter-spacing:0;
        color:var(--grey2)">Tap one for the drill-by-drill</span></div>
    <div style="display:flex;flex-direction:column;gap:7px;margin-top:11px">
    ${list.map((x,i)=>{
      const open=openSess===i;
      const pct=x.of?Math.round((x.got/x.of)*100):0;
      const glyph = x.done ? {bg:'var(--forest)',fg:'#fff',ch:'&check;'}
                           : {bg:'var(--terra)',fg:'#fff',ch:'!'};
      const summary = x.done
        ? `${esc(x.name||'Session')} · ${x.items&&x.items.length?x.items.length+' drills, ':''}${
            x.got===x.of?'all sets completed':x.got+' of '+x.of+' sets'}`
        : `Stopped in ${esc(x.block||'the session')} — ${esc(x.stoppedAt||'unknown drill')}`;
      return `<div>
        <button onclick="openSess=${open?'null':i};draw()" style="width:100%;text-align:left;
          cursor:pointer;display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:16px;
          background:rgba(255,255,255,.72);border:1px solid ${open?'var(--line)':'transparent'}">
          <span style="flex:none;width:26px;height:26px;border-radius:999px;display:grid;
            place-items:center;font:700 12px/1 var(--sans);background:${glyph.bg};color:${glyph.fg}">${glyph.ch}</span>
          <b style="flex:none;font:700 13.5px/1.3 var(--sans);width:54px">${dayLabel(x.at)}</b>
          <span style="flex:1;min-width:0;font:400 13.5px/1.4 var(--sans);color:var(--grey)">${summary}</span>
          <span style="flex:none;width:74px;height:6px;border-radius:3px;background:rgba(28,32,25,.1);
            overflow:hidden"><i style="display:block;height:100%;width:${pct}%;
            background:${x.done?'var(--forest)':'var(--terra)'}"></i></span>
          <b style="flex:none;font:700 12.5px/1 var(--sans);width:78px;text-align:right;
            font-variant-numeric:tabular-nums">${x.actual||0}m / ${x.mins||0}m</b>
        </button>
        ${open?sessionDetail(x,flags):''}
      </div>`;}).join('')}
    ${opens.length>list.length?`<div style="font:400 12px/1.5 var(--sans);color:var(--grey2);padding:4px 2px">
      Days the app was opened without a session logged do not appear here — they are on the calendar.</div>`:''}
    </div>`;
}

function sessionDetail(x,flags){
  const items=x.items||[];
  if(!items.length) return `<div style="background:var(--mist);border-radius:14px;padding:13px 15px;
    margin-top:6px;font:400 13px/1.6 var(--sans);color:var(--grey)">
    No drill-by-drill for this one — it predates the app recording it.</div>`;
  const blocks=[...new Set(items.map(i=>i.grp).filter(Boolean))];
  const stopped=!x.done;
  let hitStop=false;
  return `<div style="background:var(--mist);border-radius:16px;padding:14px 15px;margin-top:6px">
    <div class="kick" style="margin:0 0 10px">${esc(blocks.join(' · ').toUpperCase())}${stopped?' (STOPPED)':''}</div>
    <div style="display:flex;flex-direction:column;gap:6px">
    ${items.map(it=>{
      const partial = it.got>0 && it.got<it.of;
      const none = it.got===0;
      if(partial) hitStop=true;
      /* where they stopped beats how it felt — for this session that is the
         thing you need to see, and the rating still shows on the row that
         was completed elsewhere */
      const tag = partial ? {t:'STOPPED',bg:'var(--terra)',fg:'#fff'}
        : none && hitStop ? {t:'SKIPPED',bg:'rgba(28,32,25,.08)',fg:'var(--grey2)'}
        : it.rate==='hard' ? {t:'HARD',bg:'rgba(200,122,86,.18)',fg:'var(--terra)'}
        : it.rate==='easy' ? {t:'EASY',bg:'rgba(159,176,152,.28)',fg:'var(--forest)'}
        : {t:'DONE',bg:'rgba(28,32,25,.08)',fg:'var(--grey)'};
      return `<div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;
        background:${partial?'rgba(200,122,86,.10)':'#fff'};
        border:1px solid ${partial?'rgba(200,122,86,.4)':'transparent'}">
        <span style="flex:none;width:74px;font:700 9px/1.3 var(--sans);letter-spacing:.1em;
          text-transform:uppercase;color:var(--grey2)">${esc(it.grp||'')}</span>
        <span style="flex:1;min-width:0;font:600 13.5px/1.3 var(--sans)">${esc(it.n||it.v)}</span>
        <span style="flex:none;font:400 12.5px/1 var(--sans);color:var(--grey2);
          font-variant-numeric:tabular-nums">${none&&hitStop?'not reached':it.got+'/'+it.of+' sets'}</span>
        <span style="flex:none;font:800 9px/1 var(--sans);letter-spacing:.1em;padding:5px 8px;
          border-radius:6px;background:${tag.bg};color:${tag.fg}">${tag.t}</span>
      </div>`;}).join('')}
    </div>
    ${stopped?`<div style="margin-top:11px;padding:11px 13px;border-radius:12px;
      background:rgba(200,122,86,.12);border:1px solid rgba(200,122,86,.35);
      font:400 13px/1.55 var(--sans);color:#7b3a22">
      Abandoned at ${esc(x.stoppedAt||'an unknown drill')}, ${x.actual||0} minutes in.${
      (()=>{ const f=flags[(items.find(i=>i.got>0&&i.got<i.of)||{}).v];
             return f&&f.rate==='hard' ? ' Same drill they have flagged too hard.' : ''; })()}
      </div>`:''}
  </div>`;
}

/* one line per drill rather than a table you read sideways — a number
   going up is the thing a coach is looking for, and a chart says it
   without being read */
function testCharts(tests){
  if(!tests.length) return '';
  const drills=[...new Set(tests.flatMap(t=>Object.keys(t.vals||{})))];
  const series=drills.map(k=>({
    name:k,
    pts:tests.map(t=>({at:t.at, s:parseFloat(String((t.vals||{})[k]||'').replace(/[^\d.]/g,''))}))
             .filter(p=>!isNaN(p.s))
  })).filter(x=>x.pts.length);
  if(!series.length) return '';
  return `<div class="kick" style="margin-top:26px">TEST RESULTS</div>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">
    ${series.map(x=>{
      const first=x.pts[0].s, last=x.pts[x.pts.length-1].s;
      const delta=Math.round((last-first)*10)/10;
      const up=delta>0;
      return `<div style="background:rgba(255,255,255,.7);border-radius:14px;padding:12px 14px">
        <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">
          <b style="font:600 13.5px/1.3 var(--sans);flex:1;min-width:0">${esc(x.name)}</b>
          <span class="h-sm" style="font-size:19px">${last}</span>
          ${x.pts.length>1?`<span style="font:700 11px/1 var(--sans);padding:4px 7px;border-radius:5px;
            background:${up?'rgba(159,176,152,.4)':delta<0?'rgba(200,122,86,.2)':'var(--mist)'};
            color:${up?'#0a7b74':delta<0?'#7d3b28':'var(--grey2)'}">
            ${delta>0?'+':''}${delta}</span>`:''}
        </div>
        ${x.pts.length>1?`<div style="margin-top:8px">${lineChart(x.pts,'')}</div>`
          :`<div style="font:400 12px/1.5 var(--sans);color:var(--grey2);margin-top:5px">
             One reading so far — a second one draws the line.</div>`}
      </div>`;}).join('')}
    </div>`;
}

function metricsHTML(email){
  if(!prog[email]) return `<div class="kick" style="margin-top:22px">ANALYSIS</div>
    <div style="font:400 13.5px/1.6 var(--sans);color:var(--grey);margin-top:8px">Loading…</div>`;

  const a=analysis(email);
  const p=a.p;
  const flags=Object.entries(p.flags||{});
  const hard=flags.filter(([,v])=>v.rate==='hard');
  const tests=(p.tests||[]);

  /* the completed/abandoned split says whether sessions are too long */
  const finishRate=a.all.length?Math.round(a.done.length/a.all.length*100):null;
  const avgActual=a.done.filter(x=>x.actual).length
    ? Math.round(a.done.filter(x=>x.actual).reduce((t,x)=>t+x.actual,0)/a.done.filter(x=>x.actual).length)

  const avgPlanned=a.done.filter(x=>x.mins).length
    ? Math.round(a.done.filter(x=>x.mins).reduce((t,x)=>t+x.mins,0)/a.done.filter(x=>x.mins).length)
    : null;

  const totalMins=a.done.reduce((t,x)=>t+(x.actual||x.mins||0),0);
  const stops=a.all.filter(x=>!x.done&&x.stoppedAt);

  const toneBg = a.tone==='bad'?'rgba(196,122,86,.13)':a.tone==='warn'?'rgba(168,121,47,.13)':'rgba(47,61,47,.09)';
  const toneFg = a.tone==='bad'?'var(--terra)':a.tone==='warn'?'#8a6524':'var(--forest)';

  /* the calendar, the intake and the tracking card all have their own place
     on the client screen now, so this panel is only the charts */
  return `
  ${panelWeek(p)}
  ${panelVolume(p, email)}
  ${panelPhotos(email)}
  <div style="margin-top:11px">
    <button onclick="openBuilder('${esc(email)}')" class="send">Edit programme</button>
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-top:24px">
    <div class="kick" style="margin:0">ANALYSIS</div>
    <span style="font:600 10px/1 var(--sans);letter-spacing:.12em;padding:5px 9px;border-radius:4px;
      background:${toneBg};color:${toneFg}">${a.status.toUpperCase()}</span>
    <span style="font:400 12.5px/1 var(--sans);color:var(--grey2)">${
      a.sinceLast===null?'no sessions yet'
      : a.sinceLast===0?'trained today'
      : 'last session '+a.sinceLast+' day'+(a.sinceLast===1?'':'s')+' ago'}</span>
  </div>

  <div style="background:var(--mist);border-radius:14px;padding:15px 17px;margin-top:14px">
    <div style="font:600 9.5px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">THE READ</div>
    ${readRails(email)}
  </div>

  <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:16px">
    ${statCard(a.adherence+'%','ADHERENCE', a.adherence<50?'warn':'')}
    ${statCard(a.done.length,'SESSIONS DONE')}
    ${statCard(a.perWeek[a.perWeek.length-1]??0,'THIS WEEK')}
    ${statCard(finishRate===null?'—':finishRate+'%','FINISH RATE', finishRate!==null&&finishRate<70?'warn':'')}
    ${statCard(((p.opens||[]).length),'DAYS ON THE APP')}
  </div>
  <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:18px">
    ${statCard(totalMins>=60?Math.round(totalMins/60)+'h':totalMins+'m','TOTAL TRAINED')}
    ${statCard(avgActual?avgActual+'m':'—','AVG SESSION')}
    ${statCard(a.perWeek.length>1?(a.perWeek.reduce((t,v)=>t+v,0)/a.perWeek.length).toFixed(1):'—','AVG PER WEEK')}
    ${statCard(longestStreak(a.opens),'LONGEST STREAK')}
  </div>
  <div style="font:400 12.5px/1.6 var(--sans);color:var(--grey);margin-top:12px">
    ${a.done.length} of ${a.weeks*a.target} sessions across ${a.weeks} week${a.weeks===1?'':'s'} at ${a.target} a week.
    ${a.abandoned?`${a.abandoned} session${a.abandoned===1?'':'s'} started and not finished.`:''}
    ${avgActual&&avgPlanned?`Averaging ${avgActual} min against ${avgPlanned} planned.`:''}
  </div>

  <!-- THIS MONTH and LAST TWELVE WEEKS were rendered here. Both said what
       the browsable calendar above already says, and that one also carries
       how long each day was, so three views of one fact became one. Their
       helpers (monthCal, heatmap) are left defined but unused — removing
       them by brace-matching kept catching braces inside template literals
       and breaking the file. -->

  ${frictionHTML(email)}
  ${sessionsHTML(email)}
  ${a.perWeek.length?`<div class="kick" style="margin-top:26px">SESSIONS PER WEEK</div>
    <div style="margin-top:12px">${barChart(a.perWeek,a.target)}</div>
    <div style="font:400 11.5px/1 var(--sans);color:var(--grey2);margin-top:4px">
      dotted line is the ${a.target}-a-week target</div>`:''}

  ${a.all.length?`<div class="kick" style="margin-top:26px">WHICH DAY GETS DONE</div>
    <div style="margin-top:6px">${dayBreakdown(a.all)}</div>`:''}

  ${a.all.length?`<div class="kick" style="margin-top:26px">WHEN THEY TRAIN</div>
    <div style="margin-top:6px">${timeOfDay(a.all)}</div>`:''}

  ${stops.length?`<div class="kick" style="margin-top:26px">WHERE THEY STOP</div>
    <div style="display:flex;flex-direction:column;gap:7px;margin-top:10px">
    ${stops.slice(-4).reverse().map(x=>`<div style="font:400 13px/1.5 var(--sans);color:var(--grey)">
      Stopped at <b style="color:var(--ink)">${esc(x.stoppedAt)}</b>${x.block?` in ${esc(x.block)}`:''}
      — ${x.got}/${x.of} through, ${x.actual||0} min in</div>`).join('')}</div>`:''}

  ${a.holds.length>1?`<div class="kick" style="margin-top:26px">HOLD OVER TIME</div>
    <div style="margin-top:12px">${lineChart(a.holds,'s')}</div>`:''}



  ${testCharts(tests)}

  ${!a.all.length&&!a.opens.length?`<div style="font:400 13.5px/1.6 var(--sans);color:var(--grey);margin-top:18px">
    Nothing recorded yet. This fills in as they use the app.</div>`:''}

  ${(p.feedback||[]).length?`<div class="kick" style="margin-top:26px">WHAT THEY HAVE TOLD YOU</div>
    <div style="display:flex;flex-direction:column;gap:11px;margin-top:11px">
    ${(p.feedback||[]).slice(-8).reverse().map(f=>`<div style="border-left:2px solid var(--mist);padding-left:12px">
      <div style="font:600 9.5px/1 var(--sans);letter-spacing:.12em;color:var(--grey2)">
        ${esc((f.kind||'note').toUpperCase())} · ${ago(f.at)}</div>
      ${f.reasons&&f.reasons.length?`<div style="font:500 13.5px/1.5 var(--sans);margin-top:6px;color:var(--terra)">
        ${f.reasons.map(esc).join(' · ')}</div>`:''}
      ${f.text?`<div style="font:400 13.5px/1.5 var(--sans);margin-top:5px">"${esc(f.text)}"</div>`:''}
      ${f.context?`<div style="font:400 12px/1.4 var(--sans);color:var(--grey2);margin-top:4px">
        at ${esc(f.context)}</div>`:''}
    </div>`).join('')}</div>`:''}

  <div class="kick" style="margin-top:28px">YOUR NOTES</div>
  <div style="font:400 12px/1.5 var(--sans);color:var(--grey2);margin-top:5px">
    Only you see these. Injuries, what you have tried, what to ask next time.</div>
  <textarea id="cnote" rows="5" oninput="noteDrafts['${esc(email)}']=this.value"

    font:400 13.5px/1.55 var(--sans);color:var(--ink);resize:vertical;background:#fff;

  <div style="display:flex;align-items:center;gap:12px;margin-top:9px">

/* Snippets. The design calls for canned replies with no data behind them, so
   these are the openings actually worth having: the ones written fresh every
   time and always roughly the same. They drop into the box to be edited,
   never sent as-is — a reply that reads as a template is worse than a slow
   one, which is why each one ends mid-sentence. */
const SNIPPETS=[
  ['Got it', "Got your clips — watching them today, I'll come back with the one thing to change."],
  ['One change', "One thing to change this block: "],
  ['Looking better', "This is better than last time — specifically, "],
  ['Re-film', "I can't see enough to call it. Could you re-film side on, whole body in frame, hands not cropped?"],
  ['Ease off', "Back off the volume this week. "],
];
function useSnippet(i){
  const el=$('#reply'); if(!el) return;
  const t=SNIPPETS[i][1];
  el.value = el.value ? (el.value.replace(/\s*$/,'') + ' ' + t) : t;
  drafts[sel]=el.value; el.focus();
  try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
}
function snippetsHTML(){
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
    <span style="font:800 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
      color:rgba(28,32,25,.42);margin-right:2px">Snippets</span>
    ${SNIPPETS.map((sn,i)=>`<button onclick="useSnippet(${i})" title="${esc(sn[1])}"
      style="cursor:pointer;padding:6px 11px;border-radius:999px;font:700 11.5px/1 var(--sans);
      border:1px solid rgba(28,32,25,.12);background:rgba(255,255,255,.72);color:var(--ink)">
      ${esc(sn[0])}</button>`).join('')}
  </div>`;
}

/* ── standing up a new coaching client ────────────────────────────

   lives in the CLIENTS environment variable, so who counts as a coached
   client is decided in Netlify and needs a redeploy. This at least says
   so, and hands over the exact line to paste. */
function newClientHTML(){
  return `<div class="glass" style="padding:16px 18px;margin-bottom:14px">
    <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">NEW COACHING CLIENT</div>
    <div style="font:400 13px/1.6 var(--sans);color:var(--grey);margin-top:8px">

      no deploy. Write their programme from their thread.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <input id="ncEmail" placeholder="them@email.com" style="flex:1;min-width:170px;${bInput}">
      <input id="ncName" placeholder="Their name" style="flex:1;min-width:130px;${bInput}">
      <input id="ncPw" placeholder="Password (8+)" style="flex:1;min-width:130px;${bInput}">

function makeClient(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const email=g('ncEmail').trim().toLowerCase(), name=g('ncName').trim(), pw=g('ncPw');
  const say=t=>{ const m=document.getElementById('ncMsg'); if(m) m.textContent=t; };
  if(!email||pw.length<8){ say('An email and a password of at least 8 characters.'); return; }
  say('Creating…');
  const coach=(document.getElementById('ncCoach')||{}).value||'';
  fetch(API+'/setpw',{method:'POST',headers:hdr(),body:JSON.stringify({email,password:pw})})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>fetch(API+'/roster',{method:'POST',headers:hdr(),
      body:JSON.stringify({email,name,coach})})
      .then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(()=>{
        say((d.hadAccount?'Password set on their existing account.':'Account created.')
          +' They are on the roster — open their thread to write a programme.');
        const c=document.getElementById('ncEmail'); if(c) c.value='';
        const n2=document.getElementById('ncName'); if(n2) n2.value='';
        const w=document.getElementById('ncPw'); if(w) w.value='';
        load();
      }))
    .catch(()=>say('Could not set that up.'));
}



/* Coaching clients and enquiries were one undifferentiated list, which is

/* ══ the four screens ══════════════════════════════════════════════
   Eleven tabs became four. Nothing was thrown away: the five queues are
   one inbox on Today, a client is one screen instead of three columns
   and a row of panels, the ladder and the explainers moved under Library

}
function goBack(){ go(cameFrom==='today'?'today':'clients'); }
function setCtab(t){ ctab=t; moreOpen=false; attachOpen=false; draw(); }
function closeMenus(){ moreOpen=false; attachOpen=false; draw(); }
function flash(t){ toastMsg=t; clearTimeout(toastT);
  toastT=setTimeout(()=>{ toastMsg=''; draw(); },2600); draw(); }

const hrsColor = h => h>=PROMISE_H?'var(--terra)':h>=PROMISE_H*0.6?'var(--amber-d)':'var(--grey)';
const hrsState = h => h>=PROMISE_H?'overdue':h>=PROMISE_H*0.6?'due soon':'in time';

/* ── Today: one inbox ─────────────────────────────────────────────
   Form checks, block tests, check point clips, questions, applications
   and app feedback were five tabs you had to remember to visit. They are
   one list, oldest first, because the oldest is the one closest to
   breaking the 48 hours we promise. */
const INBOX_TYPE={
  check:      {label:'Form check',  cls:'tag-accent',   filter:'checks'},
  review:     {label:'Block test',  cls:'tag-accent',   filter:'reviews'},
  point:      {label:'Check point', cls:'tag-accent',   filter:'reviews'},
  question:   {label:'Question',    cls:'tag-neutral',  filter:'questions'},
  application:{label:'Application', cls:'tag-accent-2', filter:'applications'},
  feedback:   {label:'App feedback',cls:'tag-neutral',  filter:'feedback'},
  session:    {label:'Session',     cls:'tag-accent-2', filter:'sessions'},
};
let inboxRow='';                   /* the row expanded in place, if any */
/* one to one sessions paid for and waiting for a time */
let sessions=[], sessBusy='';
function loadSessions(){ fetch(API+'/sessions',{headers:hdr()}).then(r=>r.ok?r.json():null).then(d=>{ if(d){ sessions=d.sessions||[]; draw(); } }).catch(()=>{}).finally(homeStep); }
const sessOpen = () => sessions.filter(x=>x.status==='toArrange');
function sessSet(id, patch){
  sessBusy=id; draw();
  fetch(API+'/sessions',{method:'POST',headers:hdr(),body:JSON.stringify(Object.assign({id},patch))})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||('the server said '+r.status))))
    .then(d=>{ sessions=d.sessions||sessions; sessBusy=''; draw(); if(patch.when) flash('Confirmed, and they have been told'); })
    .catch(e=>{ sessBusy=''; draw(); alert(String(e)); });
}
function sessConfirm(id){
  const d=(document.getElementById('sd-'+id)||{}).value, t=(document.getElementById('st-'+id)||{}).value||'18:00';
  const place=(document.getElementById('sp-'+id)||{}).value||'', note=(document.getElementById('sn-'+id)||{}).value||'';
  if(!d) return alert('Pick the date first.');
  sessSet(id,{when:new Date(d+'T'+t+':00').toISOString(), place, note, status:'arranged'});
}
let todayDone=false;               /* the history, which is not the job in hand */
function inboxToggle(id){ inboxRow = inboxRow===id?'':id; draw(); }
const clip=(s,n)=>{ s=String(s||'').replace(/\s+/g,' ').trim();
  return s.length>n ? s.slice(0,n-1)+'…' : s; };

function inboxItems(){
  const out=[];
  queue.forEach(q=>{
    const t = q.kind==='assessment'?'check' : q.kind==='checkpoint'?'point' : 'review';
    const nums=Object.entries(q.numbers||{}).filter(([k])=>k!=='photo'&&k!=='k'&&k!=='name')
      .map(([k,v])=>k+' '+v).join(' · ');
    const what = t==='check' ? 'Free form check'
      : t==='point' ? ('Check point: '+((q.numbers||{}).name||''))
      : ('Block '+(q.cycle||1)+' test');
    out.push({id:'q:'+q.id, type:t, email:q.email, name:q.name||q.email, at:q.at,
      action:'Open the thread',
      detail:what+' · '+q.clips+' clip'+(q.clips===1?'':'s')+(nums?' · '+nums:'')});
  });
  qOpen().forEach(q=>out.push({id:'Q:'+q.id, type:'question', email:q.email,
    name:q.name||q.email, at:q.at, action:'Answer', qid:q.id, body:q.body||'',
    detail:'"'+clip(q.body,110)+'"'}));
  fbOpenList().forEach(f=>out.push({id:'F:'+f.id, type:'feedback', email:f.email||'',
    name:f.name||f.email||'Someone not signed in', at:f.at, action:'Read', fb:f,
    detail:((FB_LABEL[f.kind]||FB_LABEL.review)[0])+' · "'+clip(f.text,100)+'"'+(f.kind==='block'&&(f.extra||{}).quote==='Yes'?' · quote OK':'')}));
  sessOpen().forEach(x=>out.push({id:'S:'+x.id, type:'session', email:x.email, name:x.name||x.email, at:x.at,
    action:'Set the time', sess:x,
    detail:x.kind+' minutes, paid'+(x.paid?' £'+(x.paid/100).toFixed(2).replace(/\.00$/,''):'')+(x.prefs?' · prefers: '+clip(x.prefs,80):' · no times given')}));
  newApps().forEach(a=>{ const A=a.answers||{};
    out.push({id:'A:'+a.id, type:'application', email:a.email,
      name:a.name||String(a.email||'').split('@')[0], at:a.at,
      action:'Review the application', app:a,
      detail:'Applied for 1:1 coaching'+(A.level?' · '+A.level:'')
        +(A.days||A.commitment?' · '+(A.days||A.commitment):'')+(A.injuries?' · '+clip(A.injuries,40):'')});
  });
  return out.map(x=>({...x, hrs:Math.round((Date.now()-(x.at||0))/3600000)}))
            .sort((a,b)=>b.hrs-a.hrs);
}

function inboxBodyHTML(r){

      <div class="field"><label>Time</label><input id="st-${esc(x.id)}" class="input" type="time" value="18:00"></div>

      <div class="field" style="grid-column:1/-1"><label>A line for them, optional</label><input id="sn-${esc(x.id)}" class="input" placeholder="Wear something you can move in. See you there."></div>

  }
  if(r.type==='application'){ const a=r.app, A=a.answers||{};

/* One sentence to this person about this week, on the top of their Today
   screen. It is the only thing in the app that nobody but a coach can
   produce: everything else is tailored from state or from the block. Ten
   seconds a client a week, and it is the difference between a programme
   and being coached. */
function weekNoteHTML(email){
  const w=weeks[email]||null;
  const open=weekOpen===email;
  const days=w&&w.at?Math.floor((Date.now()-w.at)/86400000):null;
  const stale=days!=null&&days>=10;
  if(!open) return `<button onclick="weekEdit('${esc(email)}')" style="display:flex;gap:9px;
    align-items:center;width:100%;text-align:left;cursor:pointer;margin-top:var(--space-3);
    border:1px solid ${stale?'rgba(243,169,73,.55)':'var(--line)'};border-radius:14px;
    padding:11px 14px;background:${stale?'rgba(243,169,73,.12)':'var(--surface)'}">
    <span style="flex:none;font:700 9px/1.4 var(--sans);letter-spacing:.14em;color:var(--grey2)">THIS WEEK</span>
    <span style="flex:1;min-width:0;font:400 13.5px/1.5 var(--sans);color:${
      w?'#23281f':'var(--grey2)'}">${w?esc(w.text):'Nothing said yet. One line they read at the top of Today.'}</span>
    ${w?`<span style="flex:none;font:400 11.5px/1 var(--sans);color:${
      stale?'#8a5a12':'var(--grey2)'}">${esc(ago(w.at))}</span>`:''}
  </button>`;
  const val = weekDraft[email]!==undefined ? weekDraft[email] : ((w&&w.text)||'');
  return `<div style="margin-top:var(--space-3);border:1px solid var(--forest);border-radius:14px;
    padding:12px 14px;background:#fff">
    <div style="font:700 9px/1.4 var(--sans);letter-spacing:.14em;color:var(--grey2)">THIS WEEK</div>
    <textarea class="input" rows="2" maxlength="400" placeholder="Four sessions if you can. Day 2 is the one that matters, do not skip it for Day 4."
      oninput="weekDraft['${esc(email)}']=this.value"
      onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey))weekSave('${esc(email)}')"
      style="margin-top:8px;min-height:64px;font-size:14.5px">${esc(val)}</textarea>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="weekSave('${esc(email)}')"${
        weekBusy===email?' disabled':''}>${weekBusy===email?'Saving…':'Save'}</button>
      <button class="btn btn-ghost btn-sm" onclick="weekOpen='';draw()">Cancel</button>
      ${(w&&w.text)?`<button class="btn btn-ghost btn-sm" style="color:var(--terra)"
        onclick="weekDraft['${esc(email)}']='';weekSave('${esc(email)}')">Clear it</button>`:''}
      <span class="muted" style="font-size:12px">They see it at the top of Today until you change it.</span>
    </div></div>`;
}
function weekEdit(email){ weekOpen=email;
  if(weekDraft[email]===undefined) weekDraft[email]=((weeks[email]||{}).text)||'';
  draw(); }
function weekSave(email){
  if(weekBusy) return;
  const text=String(weekDraft[email]||'').trim();
  weekBusy=email; draw();
  fetch(API+'/week',{method:'POST',headers:hdr(),body:JSON.stringify({email,text})})
    .then(r=>r.ok?r.json():Promise.reject('could not save that'))
    .then(d=>{ weeks[email]=d.week||null; delete weekDraft[email];
      weekBusy=''; weekOpen=''; draw(); flash(text?'They will see it on Today':'Cleared'); })
    .catch(e=>{ weekBusy=''; draw(); alert(String(e)); });
}

/* Every clip this person has sent: what came with a form check, a block test
   or a check point, and anything dropped straight into the thread. Newest
   first, each with what it was for, so you can take three of them into the
   review tool and leave the rest. */
function clientClips(email){
  const out=[], seen=new Set();
  const add=(uid,label,at)=>{ if(!uid||seen.has(uid)) return; seen.add(uid); out.push({uid,label,at:at||0}); };
  (subs[email]||[]).forEach(s=>{
    const what=s.kind==='assessment'?'Form check':s.kind==='checkpoint'?('Check point: '+((s.numbers||{}).name||'')):('Block '+(s.cycle||1)+' test');
    (s.clips||[]).forEach((u,i)=>add(u, what+((s.clips||[]).length>1?' · clip '+(i+1):''), s.at));
  });
  /* A check point clip is written to the client's track the moment they send
     it. It becomes a submission later, when the queue is next drawn, so
     reading only the submissions made a clip sent this morning invisible. */
  const tr=(tracks[email]||{}).checkpoints||{};
  const cpName={}; (cpDefs[email]||[]).forEach(c=>{ cpName[c.k]=c.n; });
  Object.keys(tr).forEach(k=>{ (tr[k]||[]).forEach(r=>{
    if(r&&r.video) add(r.video,'Check point: '+(cpName[k]||k),r.at); }); });
  thread.forEach(m=>{ if(m.from!=='coach'&&m.video) add(m.video,'In the thread',m.at); });
  return out.sort((a,b)=>(b.at||0)-(a.at||0));
}

   the top and everything that is a chart or a table waits behind a tap. */
function progressPaneHTML(){
  if(!prog[sel]) return `<p class="muted">Loading…</p>`;
  const a=analysis(sel);

/* ── Fixes: a problem, an article, a workout ──────────────────────────
   Banana back, shoulders that will not open, a kick up that goes over. Each
   fix is a four week programme for one problem, sold by a reel about that
   problem. It has an article the coach lays out in blocks, text and film in
   whatever order, a pool of drills the app's session builder draws on, and
   a clip asked for before and after. All of it is written here and reaches
   the app on its next load. Nothing needs a deploy. */
let fixes=null, fxOpen=null, fx=null, fxDirty=false, fxBusy=false, fxMsg='';
let fxAdd=false, fxAddQ='', fxAddFor='drills', fxDragI=null, fxDragKind='';
const FX_GROUPS=['Warm-up','Mobility','Strength','Balance','Entries','Wall','Chair','Falling','Press','Flexibility'];
const FX_BLOCK_NAMES={h:'Heading',p:'Paragraph',quote:'Pull quote',img:'Photo',vid:'Video',drill:'A drill'};

function fxLoad(){
  if(fixes) return; fixes={};
  fetch(API+'/fixes',{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ fixes=d.fixes||{}; noteLibrary(d.library); draw(); } })
    .catch(()=>{});
}
const fxSlug=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20);
function fxBlank(){
  return {slug:'',name:'',tag:'',goal:'',weeks:4,perWeek:3,mins:20,stage:0,access:'plus',live:false,
    cover:{uid:'',img:''},article:[{t:'h',text:''},{t:'p',text:''}],drills:[],warm:[],
    start:{n:'Film your handstand side on',note:''},finish:{n:'Film it again, same angle',note:''}};
}
function fxNew(){ fx=fxBlank(); fxOpen='new'; fxDirty=false; fxMsg=''; fxAdd=false; draw(); }
function fxEdit(slug){
  const src=(fixes||{})[slug]; if(!src) return;
  fx=JSON.parse(JSON.stringify(src)); fx.was=slug; fxOpen=slug; fxDirty=false; fxMsg=''; fxAdd=false; draw();
}
function fxClose(){
  if(fxDirty && !confirm('Close without saving?')) return;
  fxOpen=null; fx=null; fxDirty=false; draw();
}
function fxSet(k,v){
  if(k==='weeks'||k==='perWeek'||k==='mins'||k==='stage') v=Number(v)||0;
  if(k==='live'||k==='access'){} 
  fx[k]=v;
  if(k==='name' && (!fx.was)) fx.slug=fxSlug(v);
  fxDirty=true;
  const el=document.getElementById('fxSaveBtn'); if(el){ el.disabled=false; el.textContent='Save'; }
  const sl=document.getElementById('fxSlugLine'); if(sl) sl.textContent=fx.slug?('/lha-app.html?fix='+fx.slug):'';
}
function fxSetDeep(a,b,v){ fx[a]=fx[a]||{}; fx[a][b]=v; fxDirty=true; }
function fxSave(){
  if(fxBusy) return;
  if(!fx.name.trim()) return alert('Give the fix a name first.');
  if(!fx.slug) fx.slug=fxSlug(fx.name);
  fxBusy=true; fxMsg='Saving…'; draw();
  fetch(API+'/fixes',{method:'POST',headers:hdr(),body:JSON.stringify({fix:fx, was:fx.was||''})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||('the server said '+r.status))))
    .then(d=>{ fixes=d.fixes||fixes; fxBusy=false; fxDirty=false;
      fx=JSON.parse(JSON.stringify(d.fix)); fx.was=d.fix.slug; fxOpen=d.fix.slug;
      fxMsg='Saved. '+(fx.live?'It is live in the app.':'Still a draft, nobody sees it yet.'); draw(); })
    .catch(e=>{ fxBusy=false; fxMsg=String(e); draw(); });
}
function fxDelete(slug){
  const f=(fixes||{})[slug]||{};
  if(!confirm('Delete '+(f.name||slug)+'?\n\nAnyone part way through it loses the fix, not their sessions.')) return;
  fetch(API+'/fixes',{method:'POST',headers:hdr(),body:JSON.stringify({remove:slug})})
    .then(r=>r.ok?r.json():Promise.reject('could not delete'))
    .then(d=>{ fixes=d.fixes||{}; if(fxOpen===slug){ fxOpen=null; fx=null; } draw(); })
    .catch(e=>alert(String(e)));
}
function fxLiveToggle(slug){
  const f=(fixes||{})[slug]; if(!f) return;
  const next=Object.assign({},f,{live:!f.live});
  fetch(API+'/fixes',{method:'POST',headers:hdr(),body:JSON.stringify({fix:next, was:slug})})
    .then(r=>r.ok?r.json():Promise.reject('could not save'))
    .then(d=>{ fixes=d.fixes||fixes; draw(); flash(next.live?'Live in the app':'Taken off the app'); })
    .catch(e=>alert(String(e)));
}

/* ── the article, block by block ── */
function fxBlockAdd(t){

  if(t==='vid'){ b.uid=''; b.cap=''; } if(t==='drill'){ b.v=''; b.cap=''; fxAdd=true; fxAddFor='block:'+(fx.article.length); fxAddQ=''; }

}
function fxBlockSet(i,k,v){ if(fx.article[i]){ fx.article[i][k]=v; fxDirty=true; } }
function fxBlockDel(i){ fx.article.splice(i,1); fxDirty=true; draw(); }
function fxBlockMove(i,d){ const j=i+d; if(j<0||j>=fx.article.length) return;

function fxCoverImg(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
    fxMsg='Shrinking the photo…'; draw();
    shrinkPhoto(f,1200,.84)
      .then(data=>fetch(APP+'/image',{method:'POST',headers:hdr(),body:JSON.stringify({data})})
        .then(r=>r.ok?r.json():Promise.reject('Could not send that photo')))
      .then(d=>{ fx.cover={uid:'',img:d.id}; fxDirty=true; fxMsg=''; draw(); })
      .catch(e=>{ fxMsg=String(e); draw(); }); };

/* the same direct upload every clip uses */
function fxUpload(file, onPct){
  return fetch(APP+'/upload',{method:'POST',headers:hdr(),body:'{}'})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
    .then(d=>new Promise((res,rej)=>{
      const fd=new FormData(); fd.append('file',file);
      const x=new XMLHttpRequest(); x.open('POST',d.uploadURL);
      x.upload.onprogress=e=>{ if(e.lengthComputable&&onPct) onPct(Math.round(e.loaded/e.total*100)); };
      x.onload=()=> (x.status>=200&&x.status<300)?res(d.uid):rej('Upload failed ('+x.status+')');
      x.onerror=()=>rej('Upload failed, check your signal');
      x.send(fd);
    }));
}
/* drag to reorder, blocks and drills alike */
function fxDragStart(e,kind,i){ fxDragKind=kind; fxDragI=i;
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(i)); }catch(err){} }
function fxDragOver(e,kind,i){ if(fxDragKind!==kind||fxDragI===null||fxDragI===i) return;
  e.preventDefault(); const el=e.currentTarget; if(el) el.style.boxShadow='inset 0 3px 0 var(--forest)'; }
function fxDragLeave(e){ const el=e.currentTarget; if(el) el.style.boxShadow=''; }
function fxDrop(e,kind,i){
  e.preventDefault(); const from=fxDragI; fxDragI=null; fxDragKind='';
  document.querySelectorAll('[data-fxrow]').forEach(el=>{ el.style.boxShadow=''; });
  if(from===null||from===i) return;
  const list=kind==='block'?fx.article:fx.drills;
  const [b]=list.splice(from,1); list.splice(i,0,b); fxDirty=true; draw();
}

/* ── the drills ── */
function fxDrillAdd(v){
  if(fxAddFor.startsWith('block:')){ const i=Number(fxAddFor.split(':')[1]); if(fx.article[i]) fx.article[i].v=v; }
  else if(fxAddFor==='warm'){ if(fx.warm.indexOf(v)<0) fx.warm.push(v); }
  else if(!fx.drills.some(d=>d.v===v)){
    const row=(typeof wkPoolFor==='function') ? [0,1,2,3,4,5].map(i=>wkPoolFor(i).find(x=>x.v===v)).find(Boolean) : null;
    fx.drills.push({v, L:(row&&row.L)||1, g:(row&&row.g)||'Strength', d:''});
  }
  fxAdd=false; fxAddQ=''; fxDirty=true; draw();
}
function fxDrillSet(i,k,v){ if(!fx.drills[i]) return; fx.drills[i][k]=(k==='L')?Number(v)||1:v; fxDirty=true; }
/* sets, the amount and its unit, and the rest, as numbers. The dose the
   rest of the app reads is written from them, so a fix drill with numbers
   typed here prints "3 x 8" or "3 x 30s" everywhere the dose shows. */
function fxDoseSet(i,k,v){
  const d=fx.drills[i]; if(!d) return;
  if(k==='unit') d.unit = v==='s' ? 's' : '';
  else { const n=Number(String(v).replace(/[^0-9.]/g,'')); d[k] = (Number.isFinite(n) && String(v).trim()!=='') ? n : undefined; }
  const sets=Number(d.sets), amt=Number(d.amt);
  if(Number.isFinite(amt) && amt>0){
    d.d = (Number.isFinite(sets)&&sets>=1 ? Math.round(sets)+' x ' : '') + Math.round(amt) + (d.unit==='s'?'s':'');
  }
  fxDirty=true;
  const line=document.getElementById('fxdose-'+i); if(line) line.textContent=d.d||'';
}
function fxDrillDel(i){ fx.drills.splice(i,1); fxDirty=true; draw(); }
function fxWarmDel(v){ fx.warm=fx.warm.filter(x=>x!==v); fxDirty=true; draw(); }
function fxPickerHTML(){

const fxThumb=uid=>uid?`https://${STREAM_SUB}/${uid}/thumbnails/thumbnail.jpg?time=3s&height=160`:'';
/* ── the preview ───────────────────────────────────────────────────
   fix-preview.html is the fix as a page, on its own, so its look can be
   worked on without the app around it. The draft is posted into it as
   it is typed, names and clips filled in from the library the way the
   server does before the app gets a fix. */
let fxPrev=false, fxPrevTimer=null, fxPrevLast='';
function fxHydrated(){
  if(!fx) return null;
  const f=JSON.parse(JSON.stringify(fx));
  f.drills=(f.drills||[]).map(d=>Object.assign({}, d, {n:(libIndex||{})[d.v]||d.n||d.v, url:(libVideo||{})[d.v]||d.url||''}));
  f.warmDrills=(f.warm||[]).map(v=>({v, n:(libIndex||{})[v]||v, url:(libVideo||{})[v]||''}));
  f.article=(f.article||[]).map(b=>b&&b.t==='drill'?Object.assign({},b,{n:(libIndex||{})[b.v]||b.v, url:(libVideo||{})[b.v]||''}):b);
  return f;
}
function fxPreviewPost(){
  const fr=document.getElementById('fxPrevFrame'); if(!fr||!fr.contentWindow) return;
  const f=fxHydrated(); if(!f) return;
  const j=JSON.stringify(f); if(j===fxPrevLast) return; fxPrevLast=j;
  /* the canvas can add explainers and drills itself, so it gets the lists */
  const explainers=[]; Object.keys(EXPLAIN||{}).forEach(s0=>(EXPLAIN[s0]||[]).forEach(x=>{ if(x&&x.uid) explainers.push({uid:x.uid,q:x.q,stage:(STAGES[s0]||{}).n||''}); }));
  const drills=Object.keys(libIndex||{}).sort((a,b)=>(libIndex[a]||a).localeCompare(libIndex[b]||b)).map(v=>({v,n:libIndex[v]||v,url:(libVideo||{})[v]||''}));
  try{ fr.contentWindow.postMessage({type:'lha-fix-draft', fix:f, edit:true, explainers, drills}, location.origin); }catch(e){}
}
/* ── edits made on the canvas ────────────────────────────────────────
   The preview page is the editor for the article: words typed in place,
   blocks dragged, added and removed. It posts the article back and this
   side owns it from there: the form, the dirty flag and Save. */
window.addEventListener('message', e=>{
  if(e.origin!==location.origin || !e.data || !fx) return;
  const d=e.data;
  if(d.type==='lha-fix-edit' && Array.isArray(d.article) && emCanvasKey){
    const k=emCanvasKey; emDraft[k]=emDraft[k]||{}; emDraft[k].blocks=d.article; emMsg='Not saved yet';
    emCanvasLast=JSON.stringify({key:k, subject:emVal(k,'subject'), title:emVal(k,'title'), footnote:emVal(k,'footnote'), blocks:d.article, vars:(emDefs[k]||{}).vars||[], cta:'Open the app'});
    const m=document.getElementById('emMsg'); if(m) m.textContent=emMsg;
    return;
  }
  if(d.type==='lha-fix-photo' && emCanvasKey){ const k=emCanvasKey; const bl=(emBlocks(k)||[]).slice(); const at=Math.max(0,Math.min(bl.length, Number(d.at)||0));
    bl.splice(at,0,{t:'img',id:'',cap:''}); emDraft[k]=emDraft[k]||{}; emDraft[k].blocks=bl;
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.style.display='none'; document.body.appendChild(inp);
    inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
      shrinkPhoto(f,1600,.84).then(data=>fetch(APP+'/image',{method:'POST',headers:hdr(),body:JSON.stringify({data})}).then(r=>r.ok?r.json():Promise.reject('Could not send that photo')))
        .then(x=>{ emDraft[k].blocks[at].id=x.id; emCanvasLast=''; emCanvasPost(); }).catch(e=>alert(String(e))); };
    inp.click(); return; }
  if(d.type==='lha-fix-video' && emCanvasKey){ const k=emCanvasKey; const bl=(emBlocks(k)||[]).slice(); const at=Math.max(0,Math.min(bl.length, Number(d.at)||0));
    bl.splice(at,0,{t:'vid',uid:'',cap:''}); emDraft[k]=emDraft[k]||{}; emDraft[k].blocks=bl;
    const inp=document.createElement('input'); inp.type='file'; inp.accept='video/*'; inp.style.display='none'; document.body.appendChild(inp);
    inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
      fxUpload(f, ()=>{}).then(uid=>{ emDraft[k].blocks[at].uid=uid; emCanvasLast=''; emCanvasPost(); }).catch(e=>alert(String(e))); };
    inp.click(); return; }
  if(d.type==='lha-fix-edit' && Array.isArray(d.article)){
    const structural = JSON.stringify(d.article.map(b=>b&&b.t)) !== JSON.stringify((fx.article||[]).map(b=>b&&b.t));
    fx.article=d.article.map(b=>{ const o=Object.assign({},b); delete o.n; delete o.url; return o; });
    fxDirty=true;
    /* what it holds now is what the canvas shows, so do not post it back
       and take the caret away mid word */
    fxPrevLast=JSON.stringify(fxHydrated());
    if(structural) draw(); else { const b=document.getElementById('fxSaveBtn'); if(b) b.textContent='Save'; }
  }
  if(d.type==='lha-fix-photo'){ const at=Math.max(0,Math.min(fx.article.length, Number(d.at)||0));
    fx.article.splice(at,0,{t:'img',id:'',cap:''}); fxDirty=true; fxBlockImg(at); }
  if(d.type==='lha-fix-video'){ const at=Math.max(0,Math.min(fx.article.length, Number(d.at)||0));
    fx.article.splice(at,0,{t:'vid',uid:'',cap:''}); fxDirty=true; fxBlockVid(at); }
});
function fxPreviewToggle(){
  fxPrev=!fxPrev; fxPrevLast='';
  clearInterval(fxPrevTimer); fxPrevTimer=null;
  let w=document.getElementById('fxPrevWrap');
  if(!fxPrev){ if(w) w.remove(); draw(); return; }
  if(!w){
    w=document.createElement('div'); w.id='fxPrevWrap';
    w.style.cssText='position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100vw;z-index:900;background:#dcdad6;'
      +'box-shadow:-20px 0 50px -30px rgba(0,0,0,.5);display:flex;flex-direction:column';
    w.innerHTML='<div style="flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid rgba(0,0,0,.08)">'
      +'<b style="font:600 13px/1 var(--sans)">The page, as they will see it</b><span class="muted" style="font-size:11.5px">Tap to type, drag to move, + to add</span><span style="flex:1"></span>'
      +'<a href="/fix-preview.html" target="_blank" rel="noopener" style="font:500 12px/1 var(--sans);color:var(--forest)">Open in a tab</a>'
      +'<button class="btn btn-ghost btn-sm" onclick="fxPreviewToggle()">Close</button></div>'
      +'<iframe id="fxPrevFrame" src="/fix-preview.html" title="Fix preview" style="flex:1;width:100%;border:0;background:#dcdad6"></iframe>';
    document.body.appendChild(w);
    const fr=document.getElementById('fxPrevFrame');
    fr.addEventListener('load', ()=>{ fxPrevLast=''; fxPreviewPost(); });
  }
  /* the editor writes into fx without redrawing on every keystroke, so
     the preview looks for itself */
  fxPrevTimer=setInterval(fxPreviewPost, 600);
  draw();
}

          ${(f.drills||[]).some(d=>!hasClip(d.v))?` · <span style="color:var(--terra)">${(f.drills||[]).filter(d=>!hasClip(d.v)).length} unfilmed</span>`:''}</div>

/* ── message several people at once ───────────────────────────────── */
function openBulk(){ bulkOpen=true; bulkText=''; draw(); }
function closeBulk(){ if(bulkBusy) return; bulkOpen=false; draw(); }
function sendBulk(){
  const text=bulkText.trim();
  const who=pickedList();
  if(!text) return alert('Write something first.');
  if(!who.length) return closeBulk();
  bulkBusy=who.length; draw();
  let failed=0;
  Promise.all(who.map(e=>fetch(API+'/thread?email='+encodeURIComponent(e),{method:'POST',
      headers:hdr(),body:JSON.stringify({text})})
    .then(r=>{ if(!r.ok) failed++; })
    .catch(()=>{ failed++; })))
    .then(()=>{ bulkBusy=0; bulkOpen=false; rosterPick={}; draw();
      flash(failed?('Sent to '+(who.length-failed)+', '+failed+' did not go')
        :('Sent to '+who.length+' '+(who.length===1?'person':'people')));
      if(sel&&who.indexOf(sel)>=0) openThread(sel); });
}
function bulkHTML(){
  if(!bulkOpen) return '';
  const who=pickedList();
  return `<div class="dialog-backdrop" onclick="closeBulk()">
    <div class="dialog" onclick="event.stopPropagation()" style="width:min(560px,100%)">
      <div class="dialog-title">Message ${who.length} ${who.length===1?'client':'clients'}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${who.map(e=>`<span class="tag tag-neutral">${
        esc(firstName(e))}</span>`).join('')}</div>

      <div class="dialog-body">Lands in each thread as its own message, so replies come back one to one.
        They also get it by email, unless their email is switched off.</div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" onclick="closeBulk()"${bulkBusy?' disabled':''}>Cancel</button>
        <button class="btn btn-primary" onclick="sendBulk()"${bulkBusy?' disabled':''}>${
          bulkBusy?'Sending…':'Send to '+who.length}</button>

    </div></div>`;
}

/* ── copy a programme from one client to another ──────────────────── */
function openCopy(from,to){ copyOpen=true; copyFrom=from||''; copyTo=to||''; draw(); }
function closeCopy(){ if(copyBusy) return; copyOpen=false; draw(); }
function doCopy(){
  if(!copyFrom||!copyTo) return alert('Pick who it comes from and who it goes to.');
  if(copyFrom===copyTo) return alert('Those are the same person.');
  if(!copyDays&&!copyCps&&!copyEx) return alert('Nothing ticked to copy.');
  const name=(clients.find(c=>c.email===copyTo)||{}).name||copyTo;
  if(!confirm('Copy onto '+name+'?\n\nIt replaces what they have now. Nothing they have already trained is touched.')) return;
  copyBusy=true; draw();
  fetch(API+'/programme?email='+encodeURIComponent(copyFrom),{headers:hdr()})
    .then(r=>r.ok?r.json():Promise.reject('could not read that programme'))
    .then(src=>{
      const body={email:copyTo};
      if(copyDays) body.days=((src.plan||{}).days)||[];
      if(copyCps)  body.checkpoints=((src.plan||{}).checkpoints)||[];
      if(copyEx)   body.explainers=src.explainersOn||[];
      return fetch(API+'/programme',{method:'POST',headers:hdr(),body:JSON.stringify(body)})
        .then(r=>r.ok?r.json():Promise.reject('could not save it'));
    })
    .then(()=>{ copyBusy=false; copyOpen=false; draw();
      flash('Copied onto '+name); openBuilder(copyTo); })
    .catch(e=>{ copyBusy=false; draw(); alert(String(e)); });
}

  const opt=(list,val)=>list.map(c=>`<option value="${esc(c.email)}"${

    + bulkHTML() + copyHTML() + toastHTML()

  syncReview();

/* ── typing has to survive a redraw ────────────────────────────────
   draw() replaces the whole of #v, so the box being typed into is gone
   and a new one stands in its place: on a phone that closes the keyboard
   on every keystroke, which is what "it unclicks" was. The handler a box
   carries names it exactly, so it can be found again afterwards and the
   caret put back where it was. */
function focusKey(el){
  if(!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName||'')) return null;
  if(el.id) return 'id:'+el.id;
  return el.getAttribute('oninput') || el.getAttribute('onchange') || null;
}
function draw(){
  const was=document.activeElement, key=focusKey(was);
  let a=null, b=null;
  if(key){ try{ a=was.selectionStart; b=was.selectionEnd; }catch(e){} }
  const y=window.scrollY;
  drawNow();
  if(!key) return;
  let now=null;
  if(key.slice(0,3)==='id:') now=document.getElementById(key.slice(3));
  else{
    const all=document.querySelectorAll('input,textarea,select');
    for(let i=0;i<all.length;i++){ if(focusKey(all[i])===key){ now=all[i]; break; } }
  }
  if(!now || now===document.activeElement) return;
  try{ now.focus({preventScroll:true}); }catch(e){ try{ now.focus(); }catch(e2){} }
  if(a!=null){ try{ now.setSelectionRange(a,b); }catch(e){} }
  if(window.scrollY!==y) window.scrollTo(0,y);
}
