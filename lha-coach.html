<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Coach · London Handstand Academy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#ece7e2;--page:#e4dfda;--forest:#006663;--forest-d:#00403d;--deep:#00403d;
 --ink:#111111;--sand:#cfe6ec;--sage:#8fbeca;--amber:#f3a949;--on-primary:#f7f4f1;
 --grey:#6b6b6b;--grey2:#8a8a8a;--mist:#e3ded8;--red:#a4503c;
 --terra:#a4503c;                     /* only warnings still reach for it */
 --line:rgba(17,17,17,.12);
 --serif:Newsreader,Georgia,serif;--sans:Figtree,system-ui,sans-serif}
body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--ink)}
/* Ambient ground from the design canvas: three slow washes under everything,
   so the glass surfaces have something to refract. */
.amb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:var(--bg)}
.amb i{position:absolute;border-radius:50%;display:block}
.amb i:nth-child(1){width:62vw;height:62vw;left:-14vw;top:-18vw;filter:blur(18px);
  background:radial-gradient(circle at 40% 40%,rgba(143,190,202,.55),rgba(143,190,202,0) 68%);
  animation:drift 28s ease-in-out infinite}
.amb i:nth-child(2){width:48vw;height:48vw;right:-10vw;top:6vw;filter:blur(22px);
  background:radial-gradient(circle at 50% 50%,rgba(207,230,236,.60),rgba(207,230,236,0) 66%);
  animation:driftB 34s ease-in-out infinite}
.amb i:nth-child(3){width:54vw;height:54vw;left:24vw;bottom:-24vw;filter:blur(26px);
  background:radial-gradient(circle at 50% 50%,rgba(0,102,99,.22),rgba(0,102,99,0) 70%);
  animation:drift 40s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,-4%,0) scale(1.08)}}
@keyframes driftB{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-4%,3%,0) scale(1)}}
@keyframes sheen{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@media(prefers-reduced-motion:reduce){.amb i,.sheen{animation:none}}
.glass{background:rgba(255,255,255,.44);backdrop-filter:blur(26px) saturate(1.6);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 22px 48px -28px rgba(28,32,25,.5)}
.sheen{position:absolute;top:0;left:0;width:30%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 100%);
  animation:sheen 9s ease-in-out infinite}
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 60px;position:relative;z-index:1}
h1{font:400 34px/1 var(--serif);margin:0}
.kick{font:600 9.5px/1 var(--sans);letter-spacing:.16em;color:var(--grey2)}
.grid{display:grid;grid-template-columns:260px minmax(320px,1fr) minmax(340px,1.15fr);
 gap:18px;margin-top:22px;align-items:start}
@media(max-width:1120px){
 .grid{grid-template-columns:250px 1fr}
 /* three children into two columns puts the analysis in the narrow
    client column, where the calendar does not fit — give it the row */
 .grid > :nth-child(3){grid-column:1 / -1}
}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{border-radius:24px;padding:18px;min-width:0;
  background:rgba(255,255,255,.5);backdrop-filter:blur(26px) saturate(1.6);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 22px 48px -30px rgba(28,32,25,.5)}
/* the activity panels are shared verbatim with the app, where they are
   their own cards. Nested in here they should read as sections. */
.card .card{border:none;border-radius:0;padding:0 0 16px;background:none}
/* Activity at full width. Two columns so a wide screen does not turn the
   panels into one very long ribbon; each panel stays whole. */
.wideGrid{column-count:2;column-gap:22px}
.wideGrid > *{break-inside:avoid}
@media(max-width:900px){.wideGrid{column-count:1}}
.card .card + .card{border-top:1px solid var(--line);padding-top:16px}
.cli{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;cursor:pointer;border:none;
 background:none;width:100%;text-align:left}
.cli:hover{background:var(--mist)}
.cli.on{background:var(--forest);color:#fff}
.cli .av{width:34px;height:34px;border-radius:999px;background:var(--terra);color:#fff;flex:none;
 display:grid;place-items:center;font:700 13px/1 var(--sans)}
.cli b{font:600 14.5px/1.2 var(--sans);display:block}
.cli span{font:500 11.5px/1 var(--sans);color:var(--grey2);display:block;margin-top:5px}
.cli.on span{color:var(--sage)}
.dot{margin-left:auto;background:var(--terra);color:#fff;border-radius:999px;padding:3px 8px;
 font:700 10px/1 var(--sans)}
.msg{max-width:76%;padding:13px 15px;border-radius:18px;font:400 14.5px/1.5 var(--sans);white-space:pre-wrap}
.me{margin-left:auto;background:var(--forest);color:var(--bg);border-bottom-right-radius:6px}
.them{background:var(--mist);border-bottom-left-radius:6px}
.at{font:500 10.5px/1 var(--sans);color:var(--grey2);margin-top:5px}
input,textarea{font-family:var(--sans);font-size:15px;border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
button.send{border:none;background:var(--forest);color:var(--on-primary);border-radius:999px;padding:12px 22px;
 font:700 13px/1 var(--sans);cursor:pointer}
/* secondary actions: same shape, a third of the presence */
button.quiet{border:1px solid rgba(28,32,25,.14);background:rgba(255,255,255,.7);color:var(--ink);
 border-radius:999px;padding:9px 15px;font:600 12.5px/1 var(--sans);cursor:pointer}
button.quiet:hover{background:#fff}
.gate{max-width:400px;margin:16vh auto;text-align:center}
</style></head><body><div class="amb"><i></i><i></i><i></i></div><div id="v" class="wrap"></div>
<script src="/ladder-data.js"></script>
<script src="/timing.js"></script>
<script>
const API='/api/app/coach';
let TOKEN=localStorage.getItem('lha_coach_token')||'';
let WHO=localStorage.getItem('lha_coach_email')||'';
let sel=null, clients=[], thread=[];
/* which coaches appear in the list at all — only worth labelling when there is more than one */
const COACHES=new Set();
/* replies sent but not yet echoed back by Blobs — see openThread */
let pendingCoach=[];
const msgKey=m=>(m.video?'v:'+m.video:m.image?'i:'+m.image:'t:'+String(m.text||'').trim());
/* one draft per client, so switching threads never loses what you typed */
let drafts={};
let subs={};      /* what each client has sent for review */
let queue=[];     /* everything waiting on a review, whoever it came from */
let apps=[];      /* coaching applications */
let cpDefs={};    /* the check points each client was set */
let view='clients';
let mailguard=null;   /* null until loaded; {suppress, clients} after */
let dbstate=null;
let migstate=null;
let prog={};
let intakes={};   /* what they said about themselves at signup */
let tracks={};    /* habits, metrics and check-ins they have logged since */
/* names fall back to the address, so a placeholder could read
   "Reply to elliottstaley…" and truncate mid-handle */
const firstName=e=>{
  const c=clients.find(x=>x.email===e)||{};
  const n=(c.name||'').trim();
  /* the roster falls back to the address's local part when there is no
     name, so "elliottstaley" is not a name — it is the handle wearing one */
  const handle=String(e||'').split('@')[0];
  if(!n || n===handle || n.indexOf('@')>=0) return '';
  return n.split(' ')[0];
};
let notes={};
let noteDrafts={};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{ if(!t) return 'no messages'; const m=Math.round((Date.now()-t)/60000);
  if(m<60) return m+' min ago'; const h=Math.round(m/60);
  return h<24? h+' hr ago' : Math.round(h/24)+' days ago'; };
const hdr=()=>({'Content-Type':'application/json','Authorization':'Bearer '+TOKEN});

function gate(msg){
  $('#v').innerHTML=`<div class="gate"><h1>Coach</h1>
    <p style="font:400 14.5px/1.6 var(--sans);color:var(--grey);margin:14px 0 18px">
      Sign in with your London Handstand Academy account.</p>
    <form onsubmit="signIn(event)">
      <input id="em" type="email" autocomplete="username" placeholder="you@londonhandstandacademy.com"
        value="${esc(WHO)}" style="margin-bottom:10px">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
      ${msg?`<p style="color:var(--terra);font:500 13px/1.5 var(--sans);margin-top:10px">${esc(msg)}</p>`:''}
      <button class="send" style="margin-top:14px" type="submit">Sign in</button>
    </form></div>`;
}
function signIn(ev){
  if(ev) ev.preventDefault();
  const em=($('#em').value||'').trim().toLowerCase(), pw=$('#pw').value||'';
  if(!em||!pw) return gate('Both fields, please.');
  gate('Checking…');
  fetch('/api/app/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:em,password:pw})})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{
      if(!d.coach) return gate('That account is not a coach account.');
      TOKEN=d.token; WHO=em;
      localStorage.setItem('lha_coach_token',TOKEN);
      localStorage.setItem('lha_coach_email',WHO);
      load();
    })
    .catch(c=>gate(c===429?'Too many tries. Wait a few minutes.':'That email and password did not match.'));
}

function load(){
  fetch(API+'/clients',{headers:hdr()})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{ clients=d.clients||[];
      loadQueue(); loadApps(); if(mailguard===null) loadMailguard();
      COACHES.clear(); clients.forEach(c=>{ if(c.coach) COACHES.add(c.coach); });
      if(!sel&&clients.length) sel=clients[0].email; draw();
      if(sel) openThread(sel);
      /* fetch everyone so the list can show who needs chasing */
      clients.forEach(c=>fetch(API+'/progress?email='+encodeURIComponent(c.email),{headers:hdr()})
        .then(r=>r.ok?r.json():null)
        .then(x=>{ if(x){ prog[c.email]=x.progress||{}; draw(); } }).catch(()=>{}));
    })
    .catch(e=>gate(e===401?'Sign in again — that session has expired.':'Could not reach the server.'));
}
function openThread(email){
  sel=email; draw();
  fetch(API+'/progress?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ prog[email]=d.progress||{}; intakes[email]=d.intake||null;
                      tracks[email]=d.track||null; cpDefs[email]=d.checkpoints||[];
                      visitsBy[email]=d.visits||{}; draw(); } })
    .catch(()=>{});
  if(!fcState[email]) loadFormCheck(email);
  fetch(API+'/submissions?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ subs[email]=d.submissions||[]; draw(); } })
    .catch(()=>{});
  fetch(API+'/notes?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d&&notes[email]===undefined){ notes[email]=d; draw(); } })
    .catch(()=>{});
  fetch(API+'/thread?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():Promise.reject(r.status)).then(d=>{
      const next=d.messages||[];
      /* Blobs takes up to ~15s to propagate, so a read straight after a reply
         comes back without it. Re-append anything not echoed yet instead of
         letting a stale read wipe it off the screen. */
      const seen=new Set(next.map(msgKey));
      pendingCoach=pendingCoach.filter(p=>Date.now()-p.at<600000
        && !(p.email===email && seen.has(msgKey(p))));
      const mine=pendingCoach.filter(p=>p.email===email);
      const merged=next.concat(mine.map(p=>({from:'coach',text:p.text,
        ...(p.video?{video:p.video}:{}),...(p.image?{image:p.image}:{}),at:p.at})));
      /* redrawing rebuilds the reply box and loses what is half-typed */
      const shape=a=>JSON.stringify((a||[]).map(m=>[m.from,m.text||'',m.video||'',m.image||'']));
      const same=shape(merged)===shape(thread);
      thread=merged;
      const c=clients.find(x=>x.email===email);
      const cleared=!!(c&&c.unread); if(c) c.unread=0;
      if(!same||cleared) draw();
      const p=$('#pane'); if(p) p.scrollTop=p.scrollHeight; })
    /* keep whatever is on screen rather than replacing it with nothing */
    .catch(()=>coachSay('Could not refresh the thread — what you see may be behind.'));
}

/* These routes need the bearer token, so pasting the URL into a browser
   tab can only ever answer "Nope" — it arrives with no auth at all. */
function checkDB(){
  dbstate={checking:true}; draw();
  fetch(API+'/dbcheck',{headers:hdr()})
    .then(r=>r.json())
    .then(d=>{ dbstate=d; draw(); })
    .catch(e=>{ dbstate={ok:false,why:String(e)}; draw(); });
}
/* Dry run first, always. It reports exactly what a real run would copy
   without writing anything, which is the cheapest way to find out that
   something is shaped differently than expected. */
function runMigrate(dry){
  if(!dry && !confirm('Copy everything from Blobs into Supabase?\n\n'
    + 'Safe to run more than once — it updates rather than duplicates. '
    + 'Nothing in Blobs is touched or deleted.')) return;
  migstate={running:true,dry}; draw();
  fetch(API+'/migrate'+(dry?'?dry=1':''),{method:'POST',headers:hdr()})
    .then(r=>r.json())
    .then(d=>{ migstate=d; draw(); })
    .catch(e=>{ migstate={error:String(e)}; draw(); });
}
function migHTML(){
  if(!dbstate||!dbstate.ok) return '';
  const m=migstate;
  const btns=`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
    <button class="send" style="width:auto;padding:0 14px;font-size:12.5px;background:var(--mist);color:var(--ink)"
      onclick="runMigrate(true)">Dry run</button>
    <button class="send" style="width:auto;padding:0 14px;font-size:12.5px"
      onclick="runMigrate(false)">Copy the data across</button></div>`;
  if(!m) return `<div style="margin-top:10px">
    <div style="font:600 9.5px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">MIGRATION</div>
    <div style="font:400 13px/1.6 var(--sans);color:var(--grey);margin-top:7px">
      Nothing has been copied yet. Start with a dry run.</div>${btns}</div>`;
  if(m.running) return `<div style="font:500 12px/1.5 var(--sans);color:var(--grey2);padding:10px 0">
    ${m.dry?'Dry run':'Copying'}… this can take a while.</div>`;
  if(m.error) return `<div style="font:500 13px/1.6 var(--sans);color:var(--terra);padding:10px 0">
    ${esc(m.error)}</div>${btns}`;
  const c=m.copied||{};
  return `<div style="margin-top:10px">
    <div style="font:600 9.5px/1 var(--sans);letter-spacing:.14em;
      color:${m.problems&&m.problems.length?'var(--terra)':'var(--grey2)'}">
      ${m.dry?'DRY RUN — NOTHING WRITTEN':'COPIED'} · ${m.seconds}s</div>
    <div style="font:400 13px/1.6 var(--sans);color:var(--grey);margin-top:7px">
      ${m.people} ${m.people===1?'person':'people'} ·
      ${Object.entries(c).filter(([,v])=>v).map(([k,v])=>v+' '+k).join(' · ')||'nothing to copy'}
      ${m.problems&&m.problems.length?'<br><b style="color:var(--terra)">'+m.problems.length
        +' problem'+(m.problems.length===1?'':'s')+':</b><br>'+m.problems.map(esc).join('<br>'):''}
    </div>${btns}</div>`;
}

function dbHTML(){
  if(!dbstate) return `<button onclick="checkDB()" style="background:none;border:none;cursor:pointer;
    padding:8px 0;font:500 12px/1 var(--sans);color:var(--grey2);text-decoration:underline;
    text-underline-offset:3px">Check the database connection</button>`;
  if(dbstate.checking) return `<div style="font:500 12px/1.5 var(--sans);color:var(--grey2);padding:8px 0">Checking…</div>`;
  const bad=Object.entries(dbstate.tables||{}).filter(([,v])=>v!=='ok');
  return `<div style="background:${dbstate.ok?'var(--mist)':'rgba(200,122,86,.12)'};
    border:1.5px solid ${dbstate.ok?'transparent':'var(--terra)'};border-radius:14px;
    padding:13px 15px;margin-top:12px">
    <div style="font:600 9.5px/1 var(--sans);letter-spacing:.14em;
      color:${dbstate.ok?'var(--grey2)':'var(--terra)'}">
      ${dbstate.ok?'DATABASE REACHABLE':'DATABASE PROBLEM'}</div>
    <div style="font:400 13px/1.6 var(--sans);color:var(--grey);margin-top:8px">
      ${dbstate.why?esc(dbstate.why)+'<br>':''}
      ${dbstate.host?'Host '+esc(dbstate.host)+'<br>':''}
      ${dbstate.keyKind?esc(dbstate.keyKind)+'<br>':''}
      ${dbstate.tables?`${Object.keys(dbstate.tables).length-bad.length} of
        ${Object.keys(dbstate.tables).length} tables reachable.`:''}
      ${bad.length?'<br>'+bad.map(([t,v])=>'<b>'+esc(t)+'</b>: '+esc(v)).join('<br>'):''}
    </div>
    <button onclick="checkDB()" style="background:none;border:none;cursor:pointer;padding:8px 0 0;
      font:500 12px/1 var(--sans);color:var(--grey2);text-decoration:underline;
      text-underline-offset:3px">Check again</button>
    ${migHTML()}</div>`;
}

function loadMailguard(set,email){
  const body = email!==undefined ? {email,off:set} : {suppress:set};
  fetch(API+'/mailguard',set===undefined&&email===undefined?{headers:hdr()}
    :{method:'POST',headers:hdr(),body:JSON.stringify(body)})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ mailguard=d; draw(); } })
    .catch(()=>{});
}

/* Deliberately loud. The failure mode is forgetting it is on and wondering
   for a week why a client never hears back. */
function mailguardHTML(){
  if(!mailguard || !mailguard.clients) return '';
  const off=mailguard.suppress;
  return `<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    background:${off?'rgba(200,122,86,.12)':'var(--mist)'};
    border:1.5px solid ${off?'var(--terra)':'transparent'};
    border-radius:14px;padding:12px 15px;margin-top:16px">
    <span style="font:600 9.5px/1 var(--sans);letter-spacing:.14em;
      color:${off?'var(--terra)':'var(--grey2)'}">
      ${off?'CLIENT EMAIL OFF':'CLIENT EMAIL ON'}</span>
    <span style="flex:1;min-width:200px;font:400 13px/1.5 var(--sans);color:var(--grey)">
      ${off
        ? `Nothing is being emailed to your ${mailguard.clients} coaching client${mailguard.clients===1?'':'s'}. Everyone else — you, testers, form checks — is unaffected.`
        : `Your ${mailguard.clients} coaching client${mailguard.clients===1?'':'s'} will receive email normally.`}
    </span>
    <button onclick="loadMailguard(${off?'false':'true'})" class="send"
      style="width:auto;padding:0 15px;font-size:12.5px;
      background:${off?'var(--forest)':'var(--mist)'};color:${off?'#fff':'var(--ink)'}">
      ${off?'Turn client email on':'Turn it off'}</button>
  </div>`;
}

/* The global switch covers coaching clients as a group. This says what is
   true for the person on screen, and lets you change just them — useful
   when one client is real and the rest are test accounts. */
function mailFor(email){
  const off=(mailguard&&mailguard.off)||{};
  if(off[email]===true) return {on:false,why:'Email off for them specifically'};
  if(off[email]===false) return {on:true,why:'Email on for them specifically'};
  const isClient=(clients.find(c=>c.email===email)||{}).coached!==false;
  if(isClient && mailguard && mailguard.suppress)
    return {on:false,why:'Off — client email is switched off globally'};
  return {on:true,why:isClient?'On — via the global switch':'Not a coaching client, always reachable'};
}
function mailRowHTML(email){
  if(!mailguard) return '';
  const m=mailFor(email);
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;
    padding-top:10px;border-top:1px solid var(--line)">
    <span style="width:8px;height:8px;border-radius:999px;flex:none;
      background:${m.on?'var(--forest)':'var(--terra)'}"></span>
    <span style="font:400 12.5px/1.4 var(--sans);color:var(--grey);flex:1;min-width:150px">
      ${esc(m.why)}</span>
    <button onclick="loadMailguard(${m.on?'true':'false'},'${esc(email)}')"
      style="background:none;border:none;cursor:pointer;padding:4px 0;
      font:500 12px/1 var(--sans);color:var(--grey2);text-decoration:underline;
      text-underline-offset:3px">${m.on?'Stop emailing them':'Start emailing them'}</button>
    ${((mailguard.off||{})[email]!==undefined)?`<button onclick="loadMailguard(null,'${esc(email)}')"
      style="background:none;border:none;cursor:pointer;padding:4px 0;
      font:500 12px/1 var(--sans);color:var(--grey2);text-decoration:underline;
      text-underline-offset:3px">Follow the global setting</button>`:''}
  </div>`;
}

/* The design's answer to "nothing shows the promise as a clock": a conic
   ring that fills as the 48 hours run down, hours in the middle. Fill,
   number and label all carry it, so it never rests on hue alone. */
const PROMISE_H=48;
function ringFor(hrs){
  const pct=Math.max(0,Math.min(1,hrs/PROMISE_H));
  const ring = hrs>=PROMISE_H ? '#a4503c' : hrs>=PROMISE_H*0.6 ? '#f3a949' : '#006663';
  return {pct:Math.round(pct*100)+'%', ring,
    state: hrs>=PROMISE_H?'OVERDUE':hrs>=PROMISE_H*0.6?'DUE SOON':'IN TIME'};
}
function urgentHTML(){
  const items=queue.map(q=>({...q,hrs:Math.round((Date.now()-(q.at||0))/3600000)}))
    .sort((a,b)=>b.hrs-a.hrs);

let fcState={};   /* email -> whether their free form check is spent */
function loadFormCheck(email){
  fetch(API+'/formcheck?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():null).then(d=>{ if(d){ fcState[email]=d; draw(); } })
    .catch(()=>{});
}
function setFormCheck(email,used){
  if(!confirm(used ? 'Mark '+email+' as having used their free form check?'
                   : 'Give '+email+' their free form check back?')) return;
  fetch(API+'/formcheck/reset',{method:'POST',headers:hdr(),
    body:JSON.stringify({email, ...(used?{used:true}:{})})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not save that')))
    .then(d=>{ fcState[email]={used:!!used,at:Date.now()}; draw(); if(d.note) alert(d.note); })
    .catch(e=>alert(String(e)));
}
/* Wiping a client's account is not something to do by accident, so it asks
   twice and says exactly what goes. */
function resetClient(email){
  /* usage and the chat. Never the programme: a reset wipes what they have
     done, not what they have been given. */
  const parts=[];
  if(confirm('Clear '+email+"'s usage? Sessions, opens, holds, last seen, and everything they have logged: habits, metrics, check-ins, check point readings and photos.")) parts.push('activity','tracking');
  if(confirm('Clear the chat? Every message goes and one opening message from you is left in its place.')) parts.push('chat');
  if(!parts.length) return;
  if(!confirm('Last check. Clearing '+(parts.indexOf('activity')>-1?'usage':'')+(parts.length>2||parts[0]==='chat'?(parts.indexOf('activity')>-1?' and ':'')+'the chat':'')+' for '+email+'. Their programme and check points are not touched. This cannot be undone.')) return;
  fetch(API+'/reset',{method:'POST',headers:hdr(),body:JSON.stringify({email, parts})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not do that')))
    .then(d=>{ prog[email]=null; tracks[email]=null; cpDefs[email]=null; pendingCoach=[];
               if(builder && builder.email===email) builder=null;
               alert('Cleared: '+(d.cleared||[]).join(', ')+'.');
               openThread(email); })
    .catch(e=>alert(String(e)));
}
/* Check points were only reachable by opening the programme builder, which
   is a lot of screen for four short rows. This edits just them. */
let cpEdit=null;
function openCps(email){
  cpEdit={email, list:null, busy:true}; draw();
  fetch(API+'/programme?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{ libIndex=(d.library&&d.library.names)||libIndex||{};
               cpEdit={email, list:((d.plan||{}).checkpoints||[]).slice(), dirty:false}; draw(); })
    .catch(()=>{ cpEdit={email, list:[], dirty:false, error:true}; draw(); });

  if(cpEdit && cpEdit.dirty && !confirm('Close without saving?')) return;
  cpEdit=null; draw();
}
function cpAdd(){ cpEdit.list.push({k:'cp'+Date.now().toString(36),n:'',kind:'secs',target:null,
  note:'',demo:'',lower:false,video:true,from:''});
  cpEdit.dirty=true; draw(); }

function cpSet(i,f,v){ const c=cpEdit.list[i]; if(!c) return;
  c[f]=(f==='video'||f==='lower')?!!v:v; cpEdit.dirty=true;

     are on screen, so that one has to redraw */

function cpSave(){
  const b=document.getElementById('cpSave'); if(b){ b.disabled=true; b.textContent='Saving…'; }
  fetch(API+'/programme',{method:'POST',headers:hdr(),
    body:JSON.stringify({email:cpEdit.email, checkpoints:cpEdit.list})})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(()=>{ cpEdit.dirty=false; cpDefs[cpEdit.email]=cpEdit.list.slice();
      const c=document.getElementById('cpSave');
      if(c){ c.disabled=false; c.textContent='Saved'; setTimeout(()=>{ const x=document.getElementById('cpSave');
        if(x) x.textContent='Save check points'; },1500); } })
    .catch(()=>{ const c=document.getElementById('cpSave');
      if(c){ c.disabled=false; c.textContent='Could not save, try again'; } });

/* The optimistic push means a clip appears in the coach's own thread the
   moment it uploads, whether or not the server accepted it. Without this
   a rejected send looks identical to a delivered one — which is how a
   photo could reach the coach's screen and never reach the client. */
function sendOK(r){

/* ── sending a photo ───────────────────────────────────────────────
   Shrunk here rather than sent whole: a phone photo is 4MB of detail
   nobody needs to judge a shoulder angle, and small enough to go
   through the function means no second storage provider. */
async function shrinkPhoto(file, max=1600, quality=0.82){
  let src;
  try{ src=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){
    src=await new Promise((res,rej)=>{
      const i=new Image(), u=URL.createObjectURL(file);
      i.onload=()=>{ URL.revokeObjectURL(u); res(i); };
      i.onerror=()=>{ URL.revokeObjectURL(u); rej('Could not read that photo'); };
      i.src=u;
    });
  }
  const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight;
  if(!w||!h) throw 'Could not read that photo';
  const s=Math.min(1, max/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  return c.toDataURL('image/jpeg',quality);
}

/* ── what the numbers mean ──────────────────────────────────────
   opens is one entry per day the app was opened, so a streak is a real
   habit rather than a count of taps. */
function daysAgo(t){ if(!t) return '—'; const d=Math.floor((Date.now()-t)/86400000);
  return d===0?'today':d===1?'yesterday':d+' days ago'; }
function streak(opens){
  if(!opens||!opens.length) return 0;
  const set=new Set(opens); let n=0; const d=new Date();
  for(;;){ const k=d.toISOString().slice(0,10);
    if(set.has(k)) n++; else if(n||k!==new Date().toISOString().slice(0,10)) break;
    d.setDate(d.getDate()-1); if(n>365) break; }
  return n;
}
function last7(opens){
  if(!opens) return 0; const cut=Date.now()-7*86400000;
  return opens.filter(k=>new Date(k+'T00:00:00Z').getTime()>=cut).length;
}

/* ── analysis ────────────────────────────────────────────────────
   Charts are hand-drawn SVG on purpose: no library, no CDN, and the
   whole page stays one file. */
const DAY=86400000;
const iso=t=>new Date(t).toISOString().slice(0,10);
const dayStart=t=>{const d=new Date(t); d.setHours(0,0,0,0); return d.getTime();};

function analysis(email){
  const p=prog[email]||{};
  const done=(p.sessions||[]).filter(x=>x.done);
  const all=(p.sessions||[]);
  const opens=(p.opens||[]).slice().sort();
  const holds=(p.holds||[]).slice().sort((a,b)=>a.at-b.at);
  const start=all.length?Math.min(...all.map(x=>x.at)) : (opens.length?new Date(opens[0]+'T00:00:00').getTime():Date.now());

  /* weeks since they started, capped at what we can usefully draw */
  const weeks=Math.max(1,Math.min(12,Math.ceil((Date.now()-start)/(7*DAY))));
  const perWeek=[...Array(weeks)].map((_,i)=>{
    const a=start+i*7*DAY, b=a+7*DAY;
    return done.filter(x=>x.at>=a&&x.at<b).length;
  });
  /* they pick their own frequency at signup — measuring everyone against
     three made a 2-a-week beginner look like they were failing and a
     5-a-week client look better than they were */
  const target=(intakes[email]&&Number(intakes[email].days))||3;
  const adherence=weeks?Math.round(done.length/(weeks*target)*100):0;
  const sinceLast=done.length?Math.floor((Date.now()-Math.max(...done.map(x=>x.at)))/DAY):null;
  const abandoned=all.length-done.length;

  /* status is the thing you want to see before anything else */
  let status='On track', tone='ok';
  if(sinceLast===null){ status='Not started'; tone='warn'; }
  else if(sinceLast>10){ status='At risk'; tone='bad'; }
  else if(sinceLast>6||adherence<50){ status='Slipping'; tone='warn'; }

  return {p,done,all,opens,holds,start,weeks,perWeek,target,adherence,sinceLast,abandoned,status,tone};
}

function heatmap(opens,done){
  const weeks=12; let cols='';
  const doneDays=new Set(done.map(x=>iso(x.at)));
  const openDays=new Set(opens);
  const today=dayStart(Date.now());
  const startCol=today-(weeks*7-1)*DAY;
  for(let w=0;w<weeks;w++){
    let cells='';
    for(let d=0;d<7;d++){
      const t=startCol+(w*7+d)*DAY, k=iso(t);
      const lvl=doneDays.has(k)?2:openDays.has(k)?1:0;
      const fill=lvl===2?'var(--forest)':lvl===1?'#cfe6ec':'var(--mist)';
      const title=new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+
        (lvl===2?' — session':lvl===1?' — opened':' — nothing');
      cells+=`<rect x="0" y="${d*13}" width="11" height="11" rx="2.5" fill="${fill}"><title>${title}</title></rect>`;
    }
    cols+=`<g transform="translate(${w*13},0)">${cells}</g>`;
  }
  return `<svg viewBox="0 0 ${weeks*13} 91" width="100%" style="max-width:340px;height:auto" role="img"
    aria-label="Activity over the last twelve weeks">${cols}</svg>`;
}

function barChart(vals,target){
  if(!vals.length) return '';
  const w=26, gap=8, h=88, max=Math.max(target+1,...vals);
  const bars=vals.map((v,i)=>{
    const bh=Math.max(2,Math.round(v/max*h));
    const x=i*(w+gap);
    const col=v>=target?'var(--forest)':v>0?'var(--sand)':'var(--mist)';
    return `<rect x="${x}" y="${h-bh}" width="${w}" height="${bh}" rx="4" fill="${col}">
        <title>Week ${i+1}: ${v} session${v===1?'':'s'}</title></rect>
      <text x="${x+w/2}" y="${h+14}" text-anchor="middle" font-size="9"
        fill="var(--grey2)" font-family="var(--sans)">${i+1}</text>`;
  }).join('');
  const ty=h-Math.round(target/max*h);
  return `<svg viewBox="0 0 ${vals.length*(w+gap)} ${h+20}" width="100%"
    style="max-width:${vals.length*(w+gap)}px;height:auto" role="img"
    aria-label="Sessions completed each week against a target of ${target}">
    <line x1="0" y1="${ty}" x2="${vals.length*(w+gap)}" y2="${ty}"
      stroke="var(--terra)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
    ${bars}</svg>`;
}

function lineChart(points,unit){
  if(points.length<2) return '';
  const w=300,h=90,pad=6;
  const xs=points.map(p=>p.at), ys=points.map(p=>p.s);
  const x0=Math.min(...xs), x1=Math.max(...xs), y1=Math.max(...ys);
  const px=t=>pad+((t-x0)/Math.max(1,x1-x0))*(w-pad*2);
  const py=v=>h-pad-(v/Math.max(1,y1))*(h-pad*2);
  const d=points.map((p,i)=>(i?'L':'M')+px(p.at).toFixed(1)+' '+py(p.s).toFixed(1)).join(' ');
  const area=d+` L${px(x1).toFixed(1)} ${h-pad} L${px(x0).toFixed(1)} ${h-pad} Z`;
  const dots=points.map(p=>`<circle cx="${px(p.at).toFixed(1)}" cy="${py(p.s).toFixed(1)}" r="2.5"
      fill="var(--forest)"><title>${p.s}${unit} · ${new Date(p.at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;height:auto" role="img"
    aria-label="Best hold over time, now ${points[points.length-1].s}${unit}">
    <path d="${area}" fill="var(--forest)" opacity=".08"/>
    <path d="${d}" fill="none" stroke="var(--forest)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}


/* ── month calendar ─────────────────────────────────────────────
   The heatmap answers "have they been consistent". This answers
   "what did they actually do on the 14th", which is the question you
   ask before a check-in. */
function monthCal(sessions,opens,offset){
  const now=new Date(); now.setMonth(now.getMonth()-(offset||0));
  const y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7;                    /* Monday first */
  const byDay={};
  sessions.forEach(function(x){
    const d=new Date(x.at); if(d.getFullYear()!==y||d.getMonth()!==m) return;
    const k=d.getDate();
    byDay[k]=byDay[k]||{mins:0,done:0,part:0,names:[]};
    byDay[k].mins+=(x.actual||x.mins||0);
    byDay[k][x.done?'done':'part']++;
    byDay[k].names.push((x.name||'session')+(x.done?'':' (stopped)'));
  });
  const openSet=new Set(opens||[]);
  const today=new Date(); const isThisMonth=today.getFullYear()===y&&today.getMonth()===m;

  let cells='';
  for(let i=0;i<lead;i++) cells+='<div style="aspect-ratio:1;min-height:38px"></div>';
  for(let d=1;d<=days;d++){
    const e=byDay[d];
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const opened=openSet.has(key);
    const isToday=isThisMonth&&today.getDate()===d;
    const bg=e?(e.done?'var(--forest)':'rgba(196,122,86,.22)'):opened?'#e9e4de':'transparent';
    const fg=e&&e.done?'#fff':'var(--ink)';
    const title=e?`${e.names.join(', ')} · ${e.mins} min`:opened?'opened the app':'nothing';
    cells+=`<div title="${esc(title)}" style="aspect-ratio:1;border-radius:9px;background:${bg};

/* which of the three programme days actually gets done */
function dayBreakdown(sessions){
  const by={};
  sessions.forEach(function(x){
    const k=x.name||('Day '+((x.day||0)+1));
    by[k]=by[k]||{done:0,part:0};
    by[k][x.done?'done':'part']++;
  });
  const keys=Object.keys(by).sort();
  if(!keys.length) return '';
  const max=Math.max(...keys.map(k=>by[k].done+by[k].part));
  return keys.map(function(k){
    const v=by[k], tot=v.done+v.part;
    return `<div style="display:flex;align-items:center;gap:10px;margin-top:8px">
      <span style="font:400 13px/1 var(--sans);width:66px;flex:none">${esc(k)}</span>
      <span style="flex:1;height:9px;border-radius:999px;background:var(--mist);overflow:hidden;display:flex">
        <i style="width:${(v.done/max*100).toFixed(1)}%;background:var(--forest)"></i>
        <i style="width:${(v.part/max*100).toFixed(1)}%;background:rgba(196,122,86,.5)"></i>
      </span>
      <span style="font:400 12px/1 var(--sans);color:var(--grey2);width:64px;text-align:right">
        ${v.done} done${v.part?` · ${v.part} part`:''}</span>
    </div>`;
  }).join('');
}

/* when in the day they train — tells you when a nudge would land */
function timeOfDay(sessions){
  if(!sessions.length) return '';
  const buckets=[0,0,0,0];   /* early / morning / afternoon / evening */
  sessions.forEach(function(x){
    const h=new Date(x.at).getHours();
    buckets[h<9?0:h<12?1:h<17?2:3]++;
  });
  const names=['Before 9','9–12','12–5','After 5'];
  const max=Math.max(...buckets);
  return names.map((n,i)=>`<div style="display:flex;align-items:center;gap:10px;margin-top:7px">
      <span style="font:400 12.5px/1 var(--sans);width:66px;flex:none;color:var(--grey)">${n}</span>
      <span style="flex:1;height:8px;border-radius:999px;background:var(--mist);overflow:hidden">
        <i style="display:block;height:100%;width:${max?(buckets[i]/max*100).toFixed(0):0}%;background:var(--sand)"></i></span>
      <span style="font:400 12px/1 var(--sans);color:var(--grey2);width:22px;text-align:right">${buckets[i]}</span>
    </div>`).join('');
}


/* ── the read ────────────────────────────────────────────────────
   Everything below this is already on the page as a number. This is
   the version you can take into a check-in without doing the maths. */
function summarise(email){
  const a=analysis(email), p=a.p, out=[];
  if(!a.all.length&&!a.opens.length) return ['Nothing recorded yet.'];

  const wks=a.weeks;
  out.push(`${a.done.length} session${a.done.length===1?'':'s'} in ${wks} week${wks===1?'':'s'} — ${a.adherence}% of a ${a.target}-a-week plan.`);

  /* direction of travel matters more than the total */
  if(a.perWeek.length>=4){
    const half=Math.floor(a.perWeek.length/2);
    const early=a.perWeek.slice(0,half).reduce((t,v)=>t+v,0)/half;
    const late=a.perWeek.slice(half).reduce((t,v)=>t+v,0)/(a.perWeek.length-half);
    if(late>early+0.4) out.push('Training more than she was a month ago.');
    else if(early>late+0.4) out.push('Training less than she was a month ago — worth asking why.');
    else out.push('Holding steady week to week.');
  }

  /* which session gets avoided is the most actionable thing here */
  const by={};
  a.all.forEach(x=>{const k=x.name||('Day '+((x.day||0)+1));
    by[k]=by[k]||{done:0,part:0}; by[k][x.done?'done':'part']++;});
  const keys=Object.keys(by);
  if(keys.length>1){
    const sorted=keys.slice().sort((x,y)=>by[y].done-by[x].done);
    const top=sorted[0], bot=sorted[sorted.length-1];
    if(by[top].done-by[bot].done>=2)
      out.push(`Does ${top} most (${by[top].done}) and ${bot} least (${by[bot].done}).`);
  }

  if(a.abandoned){
    const st=a.all.filter(x=>!x.done&&x.stoppedAt);
    out.push(`${a.abandoned} session${a.abandoned===1?'':'s'} started and abandoned` +
      (st.length?` — last one at ${st[st.length-1].stoppedAt}.`:'.'));
  }

  const avgA=a.done.filter(x=>x.actual).map(x=>x.actual);
  if(avgA.length>2){
    const avg=Math.round(avgA.reduce((t,v)=>t+v,0)/avgA.length);
    const plan=Math.round(a.done.filter(x=>x.mins).reduce((t,x)=>t+x.mins,0)/Math.max(1,a.done.filter(x=>x.mins).length));
    if(plan&&avg<plan*0.8) out.push(`Sessions run ${avg} min against ${plan} planned — the plan may be too long.`);
  }

  if(a.holds.length>1){
    const f=a.holds[0].s, l=a.holds[a.holds.length-1].s;
    out.push(l>f ? `Hold up from ${f}s to ${l}s.` : l<f ? `Hold down from ${f}s to ${l}s.` : `Hold flat at ${l}s.`);
  } else if(p.bestHold) out.push(`Best hold ${p.bestHold}s.`);

  const hard=Object.entries(p.flags||{}).filter(([,v])=>v.rate==='hard');
  if(hard.length) out.push(`Finding ${hard.map(([d])=>d).join(', ')} too hard.`);
  const easy=Object.entries(p.flags||{}).filter(([,v])=>v.rate==='easy');
  if(easy.length) out.push(`${easy.map(([d])=>d).join(', ')} marked too easy — room to progress.`);

  if(a.sinceLast!==null&&a.sinceLast>6)
    out.push(`No session for ${a.sinceLast} days.`);
  return out;
}

function longestStreak(opens){
  if(!opens||!opens.length) return 0;
  const days=[...new Set(opens)].sort();
  let best=1, run=1;
  for(let i=1;i<days.length;i++){
    const gap=(new Date(days[i]+'T00:00:00')-new Date(days[i-1]+'T00:00:00'))/86400000;
    run = gap===1 ? run+1 : 1;
    if(run>best) best=run;
  }
  return best;
}

/* ── activity, from what is already recorded ───────────────────────
   opens[] is one ISO date per active day, kept for 180 days. sessions[]
   holds up to 200, each with planned and actual minutes. Neither needed
   any new instrumentation — the app has been collecting both all along
   and showing three numbers. */
function dayKey(d){ return new Date(d).toISOString().slice(0,10); }

let rosterFilter='all';
let calOff=0;      /* months back from this one */
let calDay=null;   /* the ISO date being inspected */

/* The shared four-week panel is right for a client looking at their own
   habit. A coach needs to go back through the block and ask what happened
   on a particular day, which is a different question. */
/* "11 sessions · 5h 52m" — the header line from the design */
function monthStats(byDay,y,m){
  const pre=`${y}-${String(m+1).padStart(2,'0')}`;
  const days=Object.keys(byDay).filter(k=>k.slice(0,7)===pre);
  const n=days.reduce((t,k)=>t+byDay[k].length,0);
  const mins=days.reduce((t,k)=>t+byDay[k].reduce((a,x)=>a+(x.actual||x.mins||0),0),0);
  if(!n) return 'Nothing logged';
  const h=Math.floor(mins/60), mm=mins%60;
  return `${n} session${n===1?'':'s'} · ${h?h+'h ':''}${mm}m`;
}

/* what a day's sessions actually got through, as drills done over drills set */
function dayParts(list){
  let got=0, of=0;
  (list||[]).forEach(x=>{
    (x.items||[]).forEach(it=>{
      const o=Number(it.of)||0;
      if(!o) return;
      of+=o; got+=Math.min(o, Number(it.got)||0);
    });
  });
  return {got, of};
}
function dayCompletion(list){
  const t=dayParts(list);
  if(t.of) return Math.max(0, Math.min(1, t.got/t.of));
  /* older sessions carry no per-drill detail, so fall back to the flag */
  return (list||[]).some(x=>x.done) ? 1 : 0;
}

function coachCalendar(email){

    cells.push(`<button onclick="calDay=${isSel?'null':`'${k}'`};draw()" title="${esc(tip)}"

      <span style="font:${(on||did)?'700':'400'} 12.5px/1 var(--sans);color:${fg}">${dnum}</span>
      ${did&&!done&&pc>0
        ? `<span style="width:70%;height:3px;border-radius:2px;background:rgba(255,255,255,.35);

             background:#fff"></i></span>`
        : mins?`<span style="font:600 9.5px/1 var(--sans);font-variant-numeric:tabular-nums;

        :on?`<span style="width:14px;height:3px;border-radius:2px;background:rgba(28,32,25,.16)"></span>`:''}
    </button>`);
  }

  const head=['M','T','W','T','F','S','S'].map(x=>
    `<div style="text-align:center;font:600 9px/1 var(--sans);letter-spacing:.1em;

  /* the month being shown, as the app writes it. monthVisitLine was being

/* How often they are actually in the app, not just whether they were. An

let visitsBy={};
const visitsFor = e => visitsBy[e] || {};
function visitMins(v){
  if(!v || !v.ms) return '';
  const m=Math.round(v.ms/60000);
  return m>=1 ? ', '+m+' min' : ', under a minute';
}
function monthVisitLine(email, month){

  const m=Math.round(ms/60000);
  return ' · '+n+' visit'+(n===1?'':'s')+(m?', '+m+' min in total':'');

function panelWeek(p){
  const ss=((p&&p.sessions)||[]).filter(x=>x&&x.at);
  const now=new Date(); now.setHours(23,59,59,999);
  const mins=[], labels=[];
  let thisWk=0, lastWk=0, drills=0, drillsLast=0;
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    const m=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.actual||x.mins||0),0);
    mins.push(m); thisWk+=m;
    drills+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.drills||0),0);
    labels.push(i===0?'TOD':['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]);
  }
  for(let i=13;i>=7;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    lastWk+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.actual||x.mins||0),0);
    drillsLast+=ss.filter(x=>dayKey(x.at)===k).reduce((a,x)=>a+(x.drills||0),0);
  }
  const peak=Math.max(30,...mins);
  const bars=mins.map((m,i)=>`<div style="flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:flex-end;gap:7px">
    <div style="width:100%;height:78px;display:flex;align-items:flex-end">
      <div title="${m} min" style="width:100%;border-radius:6px 6px 3px 3px;
        height:${Math.max(m?7:3,Math.round(m/peak*78))}px;
        background:${m?(i===6?'var(--forest)':'var(--sage)'):'rgba(28,32,25,.07)'}"></div></div>
    <span style="font:600 9px/1 var(--sans);letter-spacing:.06em;
      color:${i===6?'var(--forest)':'var(--grey2)'}">${labels[i]}</span></div>`).join('');
  const dm=thisWk-lastWk, dd=drills-drillsLast;
  const hrs=n=>n>=60?(n/60).toFixed(1)+'h':n+'m';
  return `<div class="card"><div class="kick2">THIS WEEK</div>
    <div style="display:flex;gap:5px;align-items:flex-end;margin-top:16px">${bars}</div>
    <div style="display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(28,32,25,.08)">
      ${[['Time',hrs(thisWk)],['Drills',String(drills)],
         ['vs last week',(dm>0?'+':'')+hrs(Math.abs(dm)).replace('-','')+' · '+(dd>0?'+':'')+dd]]
        .map(([n,v])=>`<div style="flex:1">
        <div style="font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${n.toUpperCase()}</div>
        <div class="h-sm" style="font-size:19px;margin-top:5px">${v}</div></div>`).join('')}
    </div>
    ${thisWk?'':`<div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:12px">
      Nothing logged this week yet. Finish a session and it turns up here.</div>`}</div>`;
}

/* ── what they told us ────────────────────────────────────────────
   The quiz answers were reaching the database and stopping there. Goal,
   level, what hurts and how often they said they would train — none of
   it was visible to the person writing their programme. The injuries
   line is the one that matters: someone declares a bad wrist and the
   coach could not see it. */
const GOAL_LABEL={learn:'Learn to handstand',hold:'Hold a freestanding handstand',
  improve:'Improve my handstand',advanced:'Advanced skills — press, one-arm'};
const LEVEL_LABEL=['Never done handstands',"Stuck at the wall",
  'Can briefly balance','Can hold ten seconds or more'];

/* ── what the client has been tracking ─────────────────────────────
   Habits, the three numbers, and the fortnightly check-in. Read-only:
   this is what they said, and the point is to see it before writing the
   next block. */
/* ── the programme builder ─────────────────────────────────────────
   A programme was a generated file, so every change to Hannah's Tuesday
   was a code deploy. This writes it. Drills are stored as an id and a
   dose; the name, clip and cues come from the library when it is read,
   so nothing can drift out of sync again. */
let builder=null;          /* {email, plan, dirty} while a programme is open */
let libIndex=null;         /* id → name, for the picker */

function openBuilder(email){
  fetch(API+'/programme?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{
      libIndex=(d.library&&d.library.names)||{};
      builder={email, plan:d.plan||{days:[]}, dirty:false, edited:d.edited, day:0, grp:0,
               exLib:d.explainerLib||{}, exOn:(d.explainersOn||[]).slice()};
      draw();
    })
    .catch(()=>{ builder={email, plan:{days:[]}, dirty:false, error:true}; draw(); });
}
function closeBuilder(){
  if(builder&&builder.dirty&&!confirm('Close without saving?')) return;
  builder=null; draw();
}
function bMark(){ builder.dirty=true; }
function bDays(){ return (builder.plan.days=builder.plan.days||[]); }

/* Which day and which block are open. The builder was one long column and
   a five day block meant scrolling past everything to reach the end of it. */
function bDay(){
  const n=bDays().length;
  if(!n) return 0;
  builder.day = Math.max(0, Math.min(n-1, builder.day|0));
  return builder.day;
}
function bGrp(){
  const d=bDays()[bDay()]; const n=((d&&d.groups)||[]).length;
  if(!n) return 0;
  builder.grp = Math.max(0, Math.min(n-1, builder.grp|0));
  return builder.grp;
}
/* ── what the day says versus what it comes to ────────────────────
   The minutes box is a promise and the drills are the thing. They drift:
   a block gets another two drills and the label still says forty-five.
   Both numbers, side by side, worked out with the same arithmetic the app
   counts down with, so the two cannot disagree. */
function dayActualSecs(d){
  return (typeof lhaSessionSecs==='function') ? lhaSessionSecs(d.groups||[]) : 0;
}
function lengthLine(d){
  const secs=dayActualSecs(d);
  if(!secs) return '';
  const actual=lhaMins(secs);
  /* the minutes field is written by hand and is often a range, "35-40".
     Stripping the punctuation turned that into thirty-five thousand. */
  const nums=(String(d.mins||'').match(/\d+/g)||[]).map(Number).filter(n=>n>0&&n<=240);
  const lo=nums[0], hi=nums.length>1?nums[nums.length-1]:nums[0];
  const drills=(d.groups||[]).reduce((n,g)=>n+((g.items||[]).length),0);
  const sets=(d.groups||[]).reduce((n,g)=>n+(g.items||[]).reduce((m,it)=>m+lhaSets(it.d),0),0);
  let verdict='', colour='var(--grey2)';
  if(lo){
    /* inside the range counts as right, so a day written as 35 to 40 is not
       reported as five minutes wrong for landing on either end */
    const diff = actual>hi ? actual-hi : actual<lo ? actual-lo : 0;
    const pct = Math.abs(diff)/hi;
    colour = diff===0 ? 'var(--forest)' : pct<=0.2 ? '#8a6524' : 'var(--terra)';
    verdict = diff===0 ? 'about right'
      : (diff>0 ? '+'+diff+' min over' : diff+' min under');
  }
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;
    padding:9px 11px;border-radius:11px;background:rgba(17,17,17,.04)">
    <span style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">LENGTH</span>
    <span style="font:500 12.5px/1 var(--sans);color:var(--grey)">
      says <b style="color:var(--ink)">${lo?(lo===hi?lo:lo+'\u2013'+hi)+' min':'—'}</b></span>
    <span style="font:500 12.5px/1 var(--sans);color:var(--grey)">
      actually <b style="color:${colour}">${actual} min</b></span>
    ${verdict?`<span style="font:700 10.5px/1 var(--sans);padding:4px 8px;border-radius:999px;
      background:${colour==='var(--forest)'?'rgba(0,102,99,.12)':colour==='var(--terra)'
        ?'rgba(164,80,60,.14)':'rgba(243,169,73,.18)'};color:${colour}">${verdict}</span>`:''}
    <span style="flex:1"></span>
    <span style="font:400 11.5px/1 var(--sans);color:var(--grey2)">${drills} drills · ${sets} sets</span>
  </div>`;
}

/* ── the app's own workouts ────────────────────────────────────────
   A coached client's days are edited in the builder. The free ladder's
   were not editable at all: the seconds came out of a rule, and a rule
   cannot know that one hold wants longer to set up than another.

   Every drill a stage uses, with the dose, the seconds it runs and the
   rest after it. Blank means the rule decides. Saved per drill, so a
   change follows the drill into every workout it appears in. */
let wkStage=0, wkLevel=0, wkTiming=null, wkEdits={}, wkBusy=false;
function wkLoad(){
  if(wkTiming) return;
  wkTiming={};
  fetch(API+'/coach/timing',{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ wkTiming=(d&&d.timing)||{}; draw(); })
    .catch(()=>{ wkTiming={}; });
}
function wkPick(i){ wkStage=i; wkLevel=0; draw(); }
/* 0 is every level, 1 to 4 is that difficulty on its own */
function wkLvl(n){ wkLevel=n; draw(); }
/* which of the three buttons in the app ever reach this difficulty. A level
   no band asks for is work nobody is given, which is worth seeing while you
   are tuning it. */
function wkBandsFor(L){
  return [1,2,3].filter(b=>((BAND_MIX[b]||{})[L]||0)>0).map(b=>BAND_NAME[b]);
}
function wkSet(v,f,val){
  wkEdits[v]=Object.assign({}, wkTiming[v]||{}, wkEdits[v]||{});
  if(val==='' || val==null) delete wkEdits[v][f];
  else wkEdits[v][f] = (f==='d') ? val : Number(val);
  /* repaint only the line that changed, or the field loses focus mid-type */
  const row=document.getElementById('wk-'+v);
  if(row) row.textContent=wkRowLen(v);
  const tot=document.getElementById('wkTotal');
  if(tot) tot.textContent=wkStageLine();
}
function wkMerged(v){ return Object.assign({}, (wkTiming||{})[v]||{}, wkEdits[v]||{}); }
function wkDrill(v){
  const d=wkMerged(v);
  return { v, n:(libIndex||{})[v]||v, d:d.d||FREE_DOSE[v]||'3 × 8', w:d.w, r:d.r };
}
function wkRowLen(v){
  const it=wkDrill(v), grp=(POOL[wkStage]||[]).find(x=>x.v===v);
  /* The app does the sets the dose names, and three where it names none, so
     the length shown here has to use the same rule or the tab reports a
     third of the work it is about to give somebody. A warm-up drill is one
     pass, never three, which is how the app builds it. */
  const warm=grp && /warm|mobility|wrist/i.test(grp.g||'');
  const w=lhaWork(it, grp?grp.g:'');
  const n=warm ? 1 : (lhaSets(it.d)>1?lhaSets(it.d):3);
  const r=(it.r!=null)?it.r:lhaRest(it, grp?grp.g:'');
  return (w?`${n} × ${w}s`:`${n} × untimed`) + ` · ${r}s rest · ${Math.round((n*w+(n-1)*r)/60*10)/10} min`;
}
function wkStageLine(){
  const week=WEEK[wkStage];
  if(!week) return 'This stage has no written week yet, so a session is built from the whole pool.';
  return week.map((day,i)=>{
    const ids=[]; (day.focus||[]).forEach(g=>(POOL[wkStage]||[]).filter(x=>x.g===g)
      .forEach(x=>{ if(ids.indexOf(x.v)<0) ids.push(x.v); }));
    const groups=[{name:day.n, items:ids.map(v=>wkDrill(v))}];
    return `${day.n}: ${lhaMins(lhaSessionSecs(groups))} min`;
  }).join('  ·  ');
}
function wkSave(){
  if(wkBusy) return;
  const rows=Object.keys(wkEdits).map(v=>Object.assign({v}, wkMerged(v)));
  if(!rows.length) return;
  wkBusy=true; draw();
  fetch(API+'/coach/timing',{method:'POST',headers:hdr(),body:JSON.stringify({timing:rows})})
    .then(r=>r.ok?r.json():Promise.reject('the server said '+r.status))
    .then(d=>{ wkTiming=d.timing||{}; wkEdits={}; wkBusy=false; draw(); })
    .catch(e=>{ wkBusy=false; alert(String(e)); draw(); });
}
/* ── the review tool ─────────────────────────────────────────────
   Elliott's own tool, kept as its own file and mounted in a same-origin
   iframe rather than folded into this one. It is 1,700 lines with its own
   CSS and a full-screen layout, and this page is one inline script where a
   single syntax error takes the whole dashboard down. An iframe also means
   the tool still works on its own, which is how it was built.

   Clips reach it by postMessage. A clip a client sent is a Cloudflare
   Stream uid, and the tool needs a URL it can paint onto a canvas without
   tainting it, which /coach/clip works out. */
let reviewQueue=[], reviewReady=false, reviewBusy='';

function reviewFrame(){ const f=document.getElementById('reviewFrame'); return f&&f.contentWindow; }
function reviewPost(clip){
  const w=reviewFrame(); if(!w) return false;
  w.postMessage({type:'lha-review-clip', url:clip.src, title:clip.title}, location.origin);
  return true;
}
window.addEventListener('message', e=>{
  if(e.origin!==location.origin || !e.data || e.data.type!=='lha-review-ready') return;
  reviewReady=true;
  /* anything queued while the tool was still parsing */
  reviewQueue.filter(c=>c.src && !c.sent).forEach(c=>{ if(reviewPost(c)) c.sent=true; });
});

/* Send a client's clip to the tool. The uid is all the dashboard has; the
   server turns it into something the canvas can read. */
function reviewClip(uid, title){
  uid=String(uid||''); if(!uid) return;
  const have=reviewQueue.find(c=>c.uid===uid);
  if(have && have.src){ view='review'; draw(); setTimeout(()=>reviewPost(have),0); return; }
  const row={uid, title:title||'Client clip', src:'', sent:false};
  if(!have) reviewQueue.push(row);
  reviewBusy=uid; view='review'; draw();
  fetch(API+'/coach/clip?uid='+encodeURIComponent(uid),{headers:hdr()})
    .then(r=>r.json().then(d=>r.ok?d:Promise.reject(d.error||('the server said '+r.status))))
    .then(d=>{
      const c=reviewQueue.find(x=>x.uid===uid)||row;
      c.src=d.src; reviewBusy='';
      if(reviewReady && reviewPost(c)) c.sent=true;
      draw();
    })
    .catch(err=>{ reviewBusy=''; const c=reviewQueue.find(x=>x.uid===uid);
      if(c) c.error=String(err); draw(); });
}
function reviewDrop(uid){
  reviewQueue=reviewQueue.filter(c=>c.uid!==uid); draw();
}
/* The iframe is mounted once, outside #v, and never moves. draw() replaces
   the whole of #v on every keystroke, and an iframe that is re-created, or
   even just re-parented, reloads: the clips, the drawing and a recording in
   progress would all go with it. Only the bar above it repaints. */
function ensureReview(){
  let wrap=document.getElementById('reviewWrap');
  if(wrap) return wrap;
  wrap=document.createElement('div');
  wrap.id='reviewWrap';
  wrap.style.cssText='position:fixed;inset:0;z-index:60;display:none;'
    +'flex-direction:column;background:var(--bg)';
  wrap.innerHTML='<div id="reviewBar" style="flex:none;padding:8px 12px;display:flex;'
    +'align-items:center;gap:9px;flex-wrap:wrap;border-bottom:1px solid var(--line);'
    +'background:var(--surface,#f7f4f1)"></div>'
    +'<iframe id="reviewFrame" src="/coach-review.html" allow="camera;microphone"'
    +' style="flex:1;width:100%;border:0;display:block"></iframe>';
  document.body.appendChild(wrap);
  return wrap;
}
function reviewBack(){ view='clients'; draw(); }
function syncReview(){
  const wrap=(view==='review') ? ensureReview() : document.getElementById('reviewWrap');
  if(!wrap) return;
  wrap.style.display = (view==='review') ? 'flex' : 'none';
  if(view!=='review') return;
  const bar=document.getElementById('reviewBar');
  if(!bar) return;
  const chip=c=>`<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 8px;
    border-radius:999px;border:1px solid var(--line);background:#fff;
    font:600 11px/1 var(--sans);color:${c.error?'var(--red)':'var(--ink)'}">
    <span style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${
      esc(c.title)}</span>
    <span style="font-weight:500;color:var(--grey2)">${
      c.error?esc(c.error):(c.src?'loaded':'fetching…')}</span>
    <button onclick="reviewDrop('${esc(c.uid)}')" title="Remove"
      style="cursor:pointer;border:0;background:none;color:var(--grey2);padding:0;
      font-size:14px;line-height:1">×</button></span>`;
  bar.innerHTML=`<button onclick="reviewBack()" style="cursor:pointer;border:1px solid var(--line);
      background:#fff;border-radius:9px;padding:6px 11px;font:600 12px/1 var(--sans)">
      ← Dashboard</button>
    <span style="font:600 11px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">REVIEW</span>
    ${reviewQueue.map(chip).join('')}
    ${reviewQueue.length?'':`<span style="font:400 11.5px/1.4 var(--sans);color:var(--grey2)">
      Press Review on any clip a client has sent, or add files below.</span>`}`;
}
/* the tab body is only what shows for the split second before the panel
   opens, and what shows if the panel somehow cannot mount */
function reviewHTML(){
  return `<div class="glass" style="padding:16px 18px">
    <div style="font:400 21px/1.1 var(--serif)">Review a client's footage</div>
    <div style="font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:6px;max-width:66ch">
      Opening the review tool. Every clip a client has sent has a Review button next
      to it, in their thread and on their check points; press it and the clip lands
      here. You can add files from this Mac too. Draw on it, turn your camera on,
      record the lot as one video, then save it and send it however you do today.</div>
  </div>`;
}

function workoutsHTML(){
  wkLoad();
  const inp='border:1px solid var(--line);border-radius:9px;padding:7px 8px;'
    +'font:500 12.5px/1 var(--sans);background:#fff;width:100%';
  const tabs=STAGES.map((x,i)=>`<button onclick="wkPick(${i})" style="cursor:pointer;
    border-radius:999px;padding:8px 14px;font:600 12px/1 var(--sans);
    border:1.5px solid ${wkStage===i?'var(--forest)':'var(--line)'};
    background:${wkStage===i?'var(--forest)':'#fff'};color:${wkStage===i?'#fff':'var(--ink)'}">
    ${i+1}. ${esc(x.n)}</button>`).join('');

  const all=POOL[wkStage]||[];
  /* Sub tabs for the difficulty levels inside the stage. A stage mixes four
     of them across six groupings, so tuning "the level two work" meant
     hunting it down grouping by grouping. */
  const lvlsHere=[];
  all.forEach(x=>{ if(x.L && lvlsHere.indexOf(x.L)<0) lvlsHere.push(x.L); });
  lvlsHere.sort((a,b)=>a-b);
  if(lvlsHere.indexOf(wkLevel)<0) wkLevel=0;
  const lvlTab=(n,label,count)=>`<button onclick="wkLvl(${n})" style="cursor:pointer;
    border-radius:999px;padding:6px 12px;font:600 11.5px/1 var(--sans);
    border:1.5px solid ${wkLevel===n?'var(--forest)':'var(--line)'};
    background:${wkLevel===n?'rgba(0,102,99,.09)':'#fff'};
    color:${wkLevel===n?'var(--forest)':'var(--grey)'}">${esc(label)}
    <span style="opacity:.6">${count}</span></button>`;
  const levelTabs = lvlsHere.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;
    align-items:center;margin-top:10px">
    ${lvlTab(0,'All levels', all.filter(x=>x.L).length)}
    ${lvlsHere.map(L=>lvlTab(L,'Level '+L, all.filter(x=>x.L===L).length)).join('')}
    </div>
    <div style="font:400 11.5px/1.5 var(--sans);color:var(--grey2);margin-top:7px">${
      wkLevel ? (()=>{ const b=wkBandsFor(wkLevel);
        return b.length
          ? 'Level '+wkLevel+' is used by '+esc(b.join(', '))+'.'
          : 'Level '+wkLevel+' is used by none of the three buttons, so nobody is given it.'; })()
            : 'Every difficulty in this stage. Pick one to tune it on its own.'}</div>` : '';

  const pool=wkLevel ? all.filter(x=>x.L===wkLevel) : all;
  const groups=[];
  pool.forEach(x=>{ if(groups.indexOf(x.g)<0) groups.push(x.g); });
  const body = groups.length ? groups.map(g=>`
    <div style="margin-top:16px">
      <div style="font:700 9.5px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">${esc(g)}</div>
      ${pool.filter(x=>x.g===g).sort((a,b)=>a.L-b.L).map(x=>{
        const it=wkDrill(x.v), edited=!!wkEdits[x.v];
        return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;
          padding:9px 10px;border-radius:12px;background:${edited?'rgba(243,169,73,.1)':'#fff'};
          border:1px solid var(--line)">
          <span style="flex:1;min-width:150px">

              level ${x.L}${/warm|mobility|wrist/i.test(g)
                ? ' · warm-up, so one pass at 30s and the dose does not set the sets'
                : ''}${(libIndex||{})[x.v]?'':' · not in the library'}</span>
          </span>
          <label style="flex:0 0 116px"><span style="font:600 9px/1 var(--sans);letter-spacing:.1em;
            color:var(--grey2)">DOSE</span>
            <input value="${esc(it.d||'')}" oninput="wkSet('${x.v}','d',this.value)"
              style="${inp};margin-top:4px"></label>
          <label style="flex:0 0 74px"><span style="font:600 9px/1 var(--sans);letter-spacing:.1em;
            color:var(--grey2)">SECONDS</span>
            <input type="number" min="0" value="${it.w==null?'':it.w}" placeholder="auto"
              oninput="wkSet('${x.v}','w',this.value)" style="${inp};margin-top:4px"></label>
          <label style="flex:0 0 74px"><span style="font:600 9px/1 var(--sans);letter-spacing:.1em;
            color:var(--grey2)">REST</span>
            <input type="number" min="0" value="${it.r==null?'':it.r}" placeholder="auto"
              oninput="wkSet('${x.v}','r',this.value)" style="${inp};margin-top:4px"></label>
          <span id="wk-${x.v}" style="flex:0 0 168px;text-align:right;font:500 11.5px/1.3 var(--sans);
            color:var(--grey)">${wkRowLen(x.v)}</span>
        </div>`;}).join('')}
    </div>`).join('')
    : `<div style="font:400 13.5px/1.6 var(--sans);color:var(--grey);margin-top:16px">
        This stage has no groupings written yet, so its sessions come from the whole
        drill pool and there is nothing here to tune.</div>`;

  const dirty=Object.keys(wkEdits).length;
  return `<div class="glass" style="padding:16px 18px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font:400 21px/1.1 var(--serif)">The app's workouts</div>
        <div style="font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:4px;max-width:62ch">

          it reaches the app on its next load. No deploy.</div>
      </div>

        style="${dirty&&!wkBusy?'':'opacity:.5'}">${
        wkBusy?'Saving…':dirty?`Save ${dirty} change${dirty===1?'':'s'}`:'Saved'}</button>

        Harder. Read it as the size of the pool you are tuning, not as a session
        length.</div>
    </div>
    ${body}
  </div>`;
}

function bDelDay(i){

function bAddGroup(i){
  (bDays()[i].groups=bDays()[i].groups||[]).push({name:'New block',items:[]});

  bDays()[i].groups.splice(g,1);

function bGroupName(i,g,v){ bDays()[i].groups[g].name=v; bMark(); }
function bAddItem(i,g){

function bDelItem(i,g,k){ bDays()[i].groups[g].items.splice(k,1); bMark(); draw(); }
function bItem(i,g,k,f,v){

/* ── a drill the coach makes, on the spot ──────────────────────────
   Everything in the library came out of a build, so adding a drill meant
   a developer and a deploy. This uploads the clip to Stream and writes the
   drill into settings, where the server folds it into the library for both
   the app and this dashboard. It can go straight onto a ladder stage, or
   nowhere, in which case it is just available to drop into a programme. */
let newDrill=null, ndBusy=false;
const ND_GROUPS=['Warm-up','Kick ups','Falling','Chest to wall','Chair assisted','Crow',
  'Strength','Entries','Box work','Slides','Off the wall','Shapes'];
function ndSlug(n){ return String(n||'').toLowerCase()
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }
function openNewDrill(target){
  newDrill={n:'',v:'',desc:'',cues:'',file:null,stage:'',group:'Strength',level:1,
            msg:'',target:target||null};
  draw();
}
function closeNewDrill(){ if(ndBusy) return; newDrill=null; draw(); }
function ndSet(f,val){
  if(!newDrill) return;
  newDrill[f]=val;
  /* the slug follows the name until someone types their own */
  if(f==='n' && !newDrill.slugEdited) newDrill.v=ndSlug(val);
  if(f==='v') newDrill.slugEdited=true;
  const sl=document.getElementById('ndSlug'); if(sl && f==='n') sl.value=newDrill.v;
}
function ndPickFile(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove();
    if(f){ newDrill.file=f; newDrill.msg=f.name; draw(); } };
  inp.click();
}
function ndSay(m){ if(newDrill) newDrill.msg=m;
  const el=document.getElementById('ndMsg'); if(el) el.textContent=m; }
function ndSave(){
  if(!newDrill || ndBusy) return;
  const name=(document.getElementById('ndName')||{}).value||'';
  const slug=ndSlug((document.getElementById('ndSlug')||{}).value||name);
  const desc=(document.getElementById('ndDesc')||{}).value||'';
  const cues=((document.getElementById('ndCues')||{}).value||'')
    .split('\n').map(x=>x.trim()).filter(Boolean);
  if(!name.trim()) return ndSay('It needs a name.');
  if(!slug) return ndSay('That name has no letters in it.');
  Object.assign(newDrill,{n:name,v:slug,desc:desc,cuesArr:cues});
  ndBusy=true; draw();
  const post=uid=>fetch(API+'/coach/drill',{method:'POST',headers:hdr(),
      body:JSON.stringify({v:slug,n:name,desc,cues,uid,
        stage:newDrill.stage===''?null:Number(newDrill.stage),
        group:newDrill.group, level:newDrill.level})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||('the server said '+r.status))));
  const step = newDrill.file
    ? fetch(API+'/upload',{method:'POST',headers:hdr(),body:'{}'})
        .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start the upload')))
        .then(d=>new Promise((res,rej)=>{
          const fd=new FormData(); fd.append('file',newDrill.file);
          const x=new XMLHttpRequest(); x.open('POST',d.uploadURL);
          x.upload.onprogress=e=>{ if(e.lengthComputable)
            ndSay('Uploading… '+Math.round(e.loaded/e.total*100)+'%'); };
          x.onload=()=> (x.status>=200&&x.status<300)?res(d.uid):rej('Upload failed ('+x.status+')');
          x.onerror=()=>rej('Upload failed, check your signal');
          x.send(fd);
        })).then(uid=>{ ndSay('Saving the drill…'); return post(uid); })
    : (ndSay('Saving the drill…'), post(''));
  step.then(()=>{
      ndBusy=false;
      libIndex[slug]=name;
      /* read the target before clearing it, then drop the drill straight into
         whatever was open when they pressed New drill */
      const t=newDrill.target;
      if(t && t.kind==='item' && builder){
        const it=((bDays()[t.day]||{}).groups||[])[t.grp]
          && bDays()[t.day].groups[t.grp].items[t.idx];
        if(it){ it.drill=slug; it.v=slug; it.n=name; builder.dirty=true; }
      } else if(t && t.kind==='cpdemo' && cpEdit && cpEdit.list){
        const c=cpEdit.list[t.idx]; if(c){ c.demo=slug; cpEdit.dirty=true; }
      }
      newDrill=null; draw();
    })
    .catch(e=>{ ndBusy=false; ndSay(String(e&&e.message||e)); draw(); });
}
