<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Coach · London Handstand Academy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#ece7e2;--page:#e4dfda;--forest:#006663;--forest-d:#00403d;--deep:#00403d;
 --ink:#111111;--sand:#cfe6ec;--sage:#8fbeca;--amber:#f3a949;--amber-d:#8a6524;--on-primary:#f7f4f1;
 --grey:#6b6b6b;--grey2:#8a8a8a;--mist:#e3ded8;--red:#a4503c;
 --terra:#a4503c;                     /* only warnings still reach for it */
 --line:rgba(17,17,17,.12);--surface:rgba(255,255,255,.55);
 --space-1:5px;--space-2:10px;--space-3:15px;--space-4:20px;--space-6:30px;--space-8:40px;
 --r-sm:10px;--r-md:14px;--r-lg:20px;
 --shadow-md:0 12px 30px -18px rgba(28,32,25,.5);--shadow-lg:0 22px 48px -28px rgba(28,32,25,.5);
 --serif:Newsreader,Georgia,serif;--sans:Figtree,system-ui,sans-serif}
body{margin:0;background:#f4f4f5;font-family:var(--sans);color:var(--ink)}
/* Ambient ground from the design canvas: three slow washes under everything,
   so the glass surfaces have something to refract. */
.amb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:
  radial-gradient(circle at 15% 8%,rgba(0,102,99,.07),transparent 40%),
  radial-gradient(circle at 90% 30%,rgba(143,190,202,.12),transparent 45%),
  radial-gradient(circle at 30% 80%,rgba(243,169,73,.05),transparent 40%),#f4f4f5}
.amb i{position:absolute;border-radius:50%;display:block}
.amb i:nth-child(1){width:62vw;height:62vw;left:-14vw;top:-18vw;filter:blur(18px);
  background:radial-gradient(circle at 40% 40%,rgba(143,190,202,.55),rgba(143,190,202,0) 68%);
  animation:drift 28s ease-in-out infinite}
.amb i:nth-child(2){width:48vw;height:48vw;right:-10vw;top:6vw;filter:blur(22px);
  background:radial-gradient(circle at 50% 50%,rgba(207,230,236,.60),rgba(207,230,236,0) 66%);
  animation:driftB 34s ease-in-out infinite}
.amb i:nth-child(3){width:54vw;height:54vw;left:24vw;bottom:-24vw;filter:blur(26px);
  background:radial-gradient(circle at 50% 50%,rgba(0,102,99,.22),rgba(0,102,99,0) 70%);
  animation:drift 40s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,-4%,0) scale(1.08)}}
@keyframes driftB{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-4%,3%,0) scale(1)}}
@keyframes sheen{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@media(prefers-reduced-motion:reduce){.amb i,.sheen{animation:none}}
.glass{background:rgba(255,255,255,.44);backdrop-filter:blur(26px) saturate(1.6);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 22px 48px -28px rgba(28,32,25,.5)}
.sheen{position:absolute;top:0;left:0;width:30%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 100%);
  animation:sheen 9s ease-in-out infinite}
.wrap{position:relative;z-index:1}
h1{font:400 34px/1 var(--serif);margin:0}
.kick{font:600 9.5px/1 var(--sans);letter-spacing:.16em;color:var(--grey2)}
.grid{display:grid;grid-template-columns:260px minmax(320px,1fr) minmax(340px,1.15fr);
 gap:18px;margin-top:22px;align-items:start}
@media(max-width:1120px){
 .grid{grid-template-columns:250px 1fr}
 /* three children into two columns puts the analysis in the narrow
    client column, where the calendar does not fit — give it the row */
 .grid > :nth-child(3){grid-column:1 / -1}
}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{border-radius:24px;padding:18px;min-width:0;
  background:rgba(255,255,255,.5);backdrop-filter:blur(26px) saturate(1.6);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 22px 48px -30px rgba(28,32,25,.5)}
/* the activity panels are shared verbatim with the app, where they are
   their own cards. Nested in here they should read as sections. */
.card .card{border:none;border-radius:0;padding:0 0 16px;background:none}
/* Activity at full width. Two columns so a wide screen does not turn the
   panels into one very long ribbon; each panel stays whole. */
.wideGrid{column-count:2;column-gap:22px}
.wideGrid > *{break-inside:avoid}
@media(max-width:900px){.wideGrid{column-count:1}}
.card .card + .card{border-top:1px solid var(--line);padding-top:16px}
.cli{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;cursor:pointer;border:none;
 background:none;width:100%;text-align:left}
.cli:hover{background:var(--mist)}
.cli.on{background:var(--forest);color:#fff}
.cli .av{width:34px;height:34px;border-radius:999px;background:var(--terra);color:#fff;flex:none;
 display:grid;place-items:center;font:700 13px/1 var(--sans)}
.cli b{font:600 14.5px/1.2 var(--sans);display:block}
.cli span{font:500 11.5px/1 var(--sans);color:var(--grey2);display:block;margin-top:5px}
.cli.on span{color:var(--sage)}
.dot{margin-left:auto;background:var(--terra);color:#fff;border-radius:999px;padding:3px 8px;
 font:700 10px/1 var(--sans)}
.msg{max-width:76%;padding:13px 15px;border-radius:18px;font:400 14.5px/1.5 var(--sans);white-space:pre-wrap}
.me{margin-left:auto;background:var(--forest);color:var(--bg);border-bottom-right-radius:6px}
.them{background:var(--mist);border-bottom-left-radius:6px}
.at{font:500 10.5px/1 var(--sans);color:var(--grey2);margin-top:5px}
input,textarea{font-family:var(--sans);font-size:15px;border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
button.send{border:none;background:var(--forest);color:var(--on-primary);border-radius:999px;padding:12px 22px;
 font:700 13px/1 var(--sans);cursor:pointer}
/* Ten call sites narrow this button by setting padding:0 14px, which took the
   vertical padding with it and left a flat strip that read as a text link.
   A floor on the height means those keep their width and still look like a
   button. */
button.send{min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
/* secondary actions: same shape, a third of the presence */
button.quiet{border:1px solid rgba(28,32,25,.14);background:rgba(255,255,255,.7);color:var(--ink);
 border-radius:999px;padding:9px 15px;font:600 12.5px/1 var(--sans);cursor:pointer}
button.quiet:hover{background:#fff}
.gate{max-width:400px;margin:16vh auto;text-align:center}

/* ── the shell ───────────────────────────────────────────────────────
   Eleven tabs down a sidebar became four across a bar. A ranked column
   only earns its width when there is a lot to rank; with Today, Clients,
   Library and Settings the ranking is the order itself, so the nav is one
   sticky strip and the work gets the whole page under it. */
.shell{display:flex;flex-direction:column;gap:18px;padding:18px 24px 48px;min-height:100dvh}
.bar{display:flex;align-items:center;gap:var(--space-6);padding:14px 26px;flex-wrap:wrap;
  max-width:1180px;width:100%;margin:0 auto;position:sticky;top:12px;z-index:40;border-radius:24px}
.main{flex:1;width:100%;max-width:1180px;margin:0 auto;min-width:0}
.navbtn{background:none;border:0;cursor:pointer;font:500 14.5px/1 var(--sans);
  padding:9px 14px;border-radius:999px;display:inline-flex;gap:6px;align-items:baseline}
.navbtn:hover{color:var(--forest-d)}
.navbtn .n{font:600 11px/1 var(--sans);background:var(--amber);color:#111;border-radius:10px;padding:3px 7px}

/* ── the pieces every screen is built from ──────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  border:1px solid transparent;border-radius:999px;padding:10px 18px;font:600 13px/1 var(--sans);
  color:var(--ink);background:transparent;min-height:38px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--forest);color:#f7f4f1;box-shadow:0 6px 16px rgba(0,102,99,.25)}
.btn-primary:hover:not(:disabled){background:var(--forest-d)}
.btn-secondary{border-color:rgba(28,32,25,.14);background:rgba(255,255,255,.7)}
.btn-secondary:hover:not(:disabled){background:#fff}
.btn-ghost{color:var(--forest);padding-inline:10px}
.btn-ghost:hover:not(:disabled){background:rgba(0,102,99,.08)}
.btn-sm{font-size:12px;padding:7px 13px;min-height:0}
.tag{display:inline-flex;align-items:center;font:600 9.5px/1 var(--sans);letter-spacing:.1em;
  text-transform:uppercase;padding:4px 7px;border-radius:5px;white-space:nowrap}
.tag-accent{background:rgba(0,102,99,.1);color:var(--forest-d)}
.tag-accent-2{background:rgba(164,80,60,.12);color:var(--terra)}
.tag-neutral{background:var(--mist);color:var(--grey)}
.input{width:100%;min-height:40px;padding:10px 12px;font:400 14px/1.5 var(--sans);color:var(--ink);
  background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:12px}
.input::placeholder{color:var(--grey)}
.input:hover{border-color:rgba(17,17,17,.3)}
.input:focus-visible{border-color:var(--forest);outline-offset:0}
textarea.input{resize:vertical}
.row-hit{border-radius:14px}
.row-hit:hover{background:rgba(255,255,255,.5)}
.menuitem{border-radius:10px;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;
  font:400 14px/1.4 var(--sans);color:inherit;display:flex;justify-content:space-between;gap:12px}
.menuitem:hover{background:rgba(0,102,99,.08)}
.menu{position:absolute;bottom:calc(100% + 6px);z-index:25;background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow-md);
  border:1px solid rgba(255,255,255,.9);border-radius:var(--r-md);padding:var(--space-1);
  display:flex;flex-direction:column;min-width:190px}
.ghostlink{background:none;border:0;padding:0;cursor:pointer;color:var(--forest);
  font:500 13px/1.4 var(--sans);text-underline-offset:3px}
.ghostlink:hover{text-decoration:underline}
.dialog-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:70;
  background:rgba(20,30,28,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dialog{display:flex;flex-direction:column;gap:15px;padding:24px;border-radius:24px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(26px) saturate(1.6);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow-lg);max-height:88vh;overflow:auto}
.dialog-title{font:400 26px/1.1 var(--serif)}
.dialog-body{font:400 13.5px/1.5 var(--sans);color:var(--grey)}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.field>label{display:block;font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;
  color:var(--grey2);margin-bottom:6px}
.radio{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font:400 14px/1.4 var(--sans)}
.radio input{accent-color:var(--forest);width:16px;height:16px;margin:0;flex:none}
h4{font:400 22px/1.1 var(--serif);margin:0 0 var(--space-2)}
h5{font:400 18px/1.1 var(--serif);margin:0 0 var(--space-2)}
.muted{color:var(--grey)}
/* ── the phone ───────────────────────────────────────────────────────
   The bar keeps its shape: the wordmark on its own line and the four tabs
   in one row under it, which all four fit on without scrolling. */
@media (max-width:880px){
  .shell{padding:12px 14px 40px;gap:14px}
  .bar{padding:12px 16px;gap:10px;top:8px;border-radius:20px}
  .bar .wordmark{font-size:24px!important}
  .bar nav{width:100%;justify-content:flex-start}
  .navbtn{font-size:13.5px;padding:8px 12px}
}
/* Both lists are tables, and a table is three columns of nothing on a phone.
   The inbox puts the age on the name's line and drops the action underneath;
   the roster drops the two numeric columns onto their own line rather than
   squeezing five columns into 390px. */
@media (max-width:760px){
  .inboxRow{grid-template-columns:minmax(0,1fr)!important;gap:var(--space-1)!important;
    align-items:stretch!important}
  .inboxAge{flex-direction:row!important;align-items:baseline;gap:8px!important}
  .inboxAge span:first-child{font-size:21px!important}
  .inboxAct{justify-self:start;padding-top:2px}
  .rosterHead{display:none!important}
  .rosterRow{grid-template-columns:22px minmax(0,1fr)!important;
    gap:var(--space-2)!important;align-items:start!important}
  .rosterRow>div:nth-child(3),
  .rosterRow>div:nth-child(4),
  .rosterRow>div:nth-child(5){grid-column:2;font-size:13px!important}
  .rosterRow>div:nth-child(4):before{content:'adherence ';color:var(--grey2)}
  .rosterRow>div:nth-child(5):before{content:'waiting ';color:var(--grey2)}
}
@media (max-width:520px){
  .shell{padding:10px 11px 40px}
  .card{padding:15px 14px;border-radius:20px}
  h1{font-size:27px}
  /* a bubble that can only use three quarters of a narrow screen wastes the
     quarter and then wraps every other word */
  .msg{max-width:88%}
}
</style></head><body><div class="amb"><i></i><i></i><i></i></div><div id="v" class="wrap"></div>
<!-- Relative, not root relative. "/ladder-data.js" resolves to the disk
     root when the file is opened straight from Finder, so the app loaded
     with no ladder in it and threw "STAGES is not defined" before it drew
     anything. Relative works from a server at the site root, from a
     subfolder, and from file:// alike. -->
<script src="ladder-data.js"></script>
<script src="timing.js"></script>
<script>
const API='/api/app/coach';
/* Not every route the dashboard needs is a coach route. /upload is the same
   one the app uses, so it sits under /api/app and asking for it under
   /api/app/coach reached nothing at all. */
const APP='/api/app';
let TOKEN=localStorage.getItem('lha_coach_token')||'';
let WHO=localStorage.getItem('lha_coach_email')||'';
let sel=null, clients=[], thread=[];
/* which coaches appear in the list at all — only worth labelling when there is more than one */
const COACHES=new Set();
/* replies sent but not yet echoed back by Blobs — see openThread */
let pendingCoach=[];
const msgKey=m=>(m.video?'v:'+m.video:m.image?'i:'+m.image:'t:'+String(m.text||'').trim());
/* one draft per client, so switching threads never loses what you typed */
let drafts={};
let subs={};      /* what each client has sent for review */
let cycles={};    /* which block each client is on, and when the test is due */
let weeks={};     /* the line the coach wrote to each client about this week */
let weekDraft={}, weekBusy='', weekOpen='';
/* Whether the person signed in owns the business. A coach added from here
   does the coaching; prices, discount codes, comping a tier and putting a
   workshop on sale stay with the owner. The server refuses them either way,
   so this only decides whether the controls are on screen at all. */
let owner=true;
let queue=[];     /* everything waiting on a review, whoever it came from */
let apps=[];      /* coaching applications */
let cpDefs={};    /* the check points each client was set */
/* ── where you are ───────────────────────────────────────────────────
   today | clients | client | library | settings | review. "client" is one
   person's whole screen and is reached from either of the two before it,
   so it remembers which, and Back goes where you came from. */
let view='today';
let cameFrom='today';
let ctab='thread';           /* thread | programme | progress | notes */
let libTab='ladder';         /* programmes | ladder | drills | explainers */
let inboxFilter='all';
let rosterQ='', rosterPick={}, drillQ='';
let bulkOpen=false, bulkText='', bulkEmail=true, bulkBusy=0;
let copyOpen=false, copyFrom='', copyTo='', copyDays=true, copyCps=true, copyEx=false, copyBusy=false;
let moreOpen=false, attachOpen=false;
let progMore=false;          /* the long analysis, behind a tap */
let clientTools=false;       /* email, the free check, the coach, the reset */
let clipPickOn=false, clipSel={};   /* choosing which of their clips go to the review tool */
let toastMsg='', toastT=null;
let mailguard=null;   /* null until loaded; {suppress, clients} after */
let dbstate=null;
let migstate=null;
let prog={};
let intakes={};   /* what they said about themselves at signup */
let tracks={};    /* habits, metrics and check-ins they have logged since */
/* names fall back to the address, so a placeholder could read
   "Reply to elliottstaley…" and truncate mid-handle */
const firstName=e=>{
  const c=clients.find(x=>x.email===e)||{};
  const n=(c.name||'').trim();
  /* the roster falls back to the address's local part when there is no
     name, so "elliottstaley" is not a name — it is the handle wearing one */
  const handle=String(e||'').split('@')[0];
  if(!n || n===handle || n.indexOf('@')>=0) return '';
  return n.split(' ')[0];
};
let notes={};
let noteDrafts={};
const $=s=>document.querySelector(s);
/* the apostrophe is escaped too. Nothing today puts a user value inside a
   single-quoted attribute, so this changes nothing now; it is here so that
   the day something does, it cannot break out of one. */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{ if(!t) return 'no messages'; const m=Math.round((Date.now()-t)/60000);
  if(m<60) return m+' min ago'; const h=Math.round(m/60);
  if(h<24) return h+' hr ago';
  const d=Math.round(h/24); return d===1 ? 'yesterday' : d+' days ago'; };
const hdr=()=>({'Content-Type':'application/json','Authorization':'Bearer '+TOKEN});

function gate(msg){
  $('#v').innerHTML=`<div class="gate"><h1>Coach</h1>
    <p style="font:400 14.5px/1.6 var(--sans);color:var(--grey);margin:14px 0 18px">
      Sign in with your London Handstand Academy account.</p>
    <form onsubmit="signIn(event)">
      <input id="em" type="email" autocomplete="username" placeholder="you@londonhandstandacademy.com"
        value="${esc(WHO)}" style="margin-bottom:10px">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
      ${msg?`<p style="color:var(--terra);font:500 13px/1.5 var(--sans);margin-top:10px">${esc(msg)}</p>`:''}
      <button class="send" style="margin-top:14px" type="submit">Sign in</button>
    </form>
    <p style="font:400 12.5px/1.6 var(--sans);color:var(--grey2);margin-top:16px">
      No password on this account? Sign in at
      <a href="/lha-app.html" style="color:var(--forest)">the app</a> with an emailed
      code instead. A coach signing in there lands here.</p></div>`;
}
function signIn(ev){
  if(ev) ev.preventDefault();
  const em=($('#em').value||'').trim().toLowerCase(), pw=$('#pw').value||'';
  /* the box is redrawn on every failure, and WHO was only set on success, so
     a wrong password meant typing the address again */
  if(em) WHO=em;
  if(!em||!pw) return gate('Both fields, please.');
  gate('Checking…');
  fetch('/api/app/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:em,password:pw})})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{
      if(!d.coach) return gate('That password was right, so the account is fine. '
        + 'The address is not on the coach roster, which is the COACHES variable '
        + 'in the Netlify settings for this site. Add it as email:Name and redeploy.');
      TOKEN=d.token; WHO=em;
      localStorage.setItem('lha_coach_token',TOKEN);
      localStorage.setItem('lha_coach_email',WHO);
      load();
    })
    .catch(c=>gate(c===429?'Too many tries. Wait a few minutes.':'That email and password did not match.'));
}

function load(){
  fetch(API+'/clients',{headers:hdr()})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(d=>{ clients=d.clients||[];
      owner = d.youAreOwner !== false;
      loadQueue(); loadApps(); loadQuestions(); loadFeedback(); loadSessions();
      if(mailguard===null) loadMailguard();
      COACHES.clear(); clients.forEach(c=>{ if(c.coach) COACHES.add(c.coach); });
      if(!sel&&clients.length) sel=clients[0].email; draw();
      if(sel) openThread(sel);
      /* fetch everyone so the list can show who needs chasing */
      clients.forEach(c=>fetch(API+'/progress?email='+encodeURIComponent(c.email),{headers:hdr()})
        .then(r=>r.ok?r.json():null)
        .then(x=>{ if(x){ prog[c.email]=x.progress||{}; draw(); } }).catch(()=>{}));
    })
    .catch(e=>gate(e===401?'Sign in again — that session has expired.':'Could not reach the server.'));
}
function openThread(email){
  sel=email; draw();
  fetch(API+'/progress?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ prog[email]=d.progress||{}; intakes[email]=d.intake||null;
                      tracks[email]=d.track||null; cpDefs[email]=d.checkpoints||[];
                      cycles[email]=d.cycle||null;
                      if(weekOpen!==email) weeks[email]=d.week||null;
                      visitsBy[email]=d.visits||{}; draw(); } })
    .catch(()=>{});
  if(!fcState[email]) loadFormCheck(email);
  fetch(API+'/submissions?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ subs[email]=d.submissions||[]; draw(); } })
    .catch(()=>{});
  fetch(API+'/notes?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d&&notes[email]===undefined){ notes[email]=d; draw(); } })
    .catch(()=>{});
  fetch(API+'/thread?email='+encodeURIComponent(email),{headers:hdr()})
    .then(r=>r.ok?r.json():Promise.reject(r.status)).then(d=>{
      const next=d.messages||[];
      /* Blobs takes up to ~15s to propagate, so a read straight after a reply
         comes back without it. Re-append anything not echoed yet instead of
         letting a stale read wipe it off the screen. */
      const seen=new Set(next.map(msgKey));
      pendingCoach=pendingCoach.filter(p=>Date.now()-p.at<600000
        && !(p.email===email && seen.has(msgKey(p))));
      const mine=pendingCoach.filter(p=>p.email===email);
      const merged=next.concat(mine.map(p=>({from:'coach',text:p.text,
        ...(p.video?{video:p.video}:{}),...(p.image?{image:p.image}:{}),at:p.at})));
      /* redrawing rebuilds the reply box and loses what is half-typed */
      const shape=a=>JSON.stringify((a||[]).map(m=>[m.from,m.text||'',m.video||'',m.image||'']));
      const same=shape(merged)===shape(thread);
      thread=merged;
      const c=clients.find(x=>x.email===email);
      const cleared=!!(c&&c.unread); if(c) c.unread=0;
      if(!same||cleared) draw();
      const p=$('#pane'); if(p) p.scrollTop=p.scrollHeight; })
    /* keep whatever is on screen rather than replacing it with nothing */
    .catch(()=>coachSay('Could not refresh the thread — what you see may be behind.'));
}

/* Dry run first, always. It reports exactly what a real run would copy
   without writing anything, which is the cheapest way to find out that
   something is shaped differently than expected. */
function runMigrate(dry){
  if(!dry && !confirm('Copy everything from Blobs into Supabase?\n\n'
    + 'Safe to run more than once — it updates rather than duplicates. '
    + 'Nothing in Blobs is touched or deleted.')) return;
  migstate={running:true,dry}; draw();
  fetch(API+'/migrate'+(dry?'?dry=1':''),{method:'POST',headers:hdr()})
    .then(r=>r.json())
    .then(d=>{ migstate=d; draw(); })
    .catch(e=>{ migstate={error:String(e)}; draw(); });
}

/* The global switch covers coaching clients as a group. This says what is
   true for the person on screen, and lets you change just them — useful
   when one client is real and the rest are test accounts. */
function mailFor(email){
  const off=(mailguard&&mailguard.off)||{};
  if(off[email]===true) return {on:false,why:'Email off for them specifically'};

  return {on:true,why:isClient?'On, via the global switch':'Not a coaching client, always reachable'};
}

    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||('the server said '+r.status))))

      ${step('INSTALLED', n('install'), 0, 'to a home screen')}

        No source yet. Add <b>?ref=suryava</b> or <b>?ref=reel-banana</b> to a link and everything that follows from it is counted here.</div>`;
      const cols=['open','signup','quiz','wall','checkout','subscribed','fixopen','fixstart'];
      const tbl=(title,map,keys)=>`<div style="margin-top:14px"><div class="kick">${title}</div>
        <div style="overflow-x:auto;margin-top:8px"><table style="border-collapse:collapse;width:100%;min-width:560px;font:400 12.5px/1.4 var(--sans)">

        ${Object.keys(map).sort((a,b)=>(Object.values(map[b]).reduce((x,y)=>x+y,0))-(Object.values(map[a]).reduce((x,y)=>x+y,0))).map(k=>`<tr style="border-top:1px solid var(--line)">
          <td style="padding:6px 8px;font-weight:600">${esc(k)}</td>${keys.map(c=>cell(map[k][c]||0)).join('')}</tr>`).join('')}

      return (srcs.length?tbl('BY SOURCE',by,cols):'')+(fxs.length?tbl('BY FIX',fx,['sitefix','fixopen','fixstart','fixdone']):''); })()}
    <details style="margin-top:14px">
      <summary style="cursor:pointer;font:600 12px/1 var(--sans);color:var(--forest)">Day by day</summary>
      <div style="overflow-x:auto;margin-top:10px">
      <table style="border-collapse:collapse;width:100%;min-width:640px;font:400 12px/1.4 var(--sans)">
        <tr style="color:var(--grey2);font-size:9.5px;letter-spacing:.1em">
          <th style="text-align:left;padding:6px 8px">DAY</th>
          ${['OPEN','QUIZ','WALL','CHECKOUT','SUBSCRIBED','START','FINISH','RET 7','INSTALL','SIGNUP']
            .map(h=>`<th style="text-align:right;padding:6px 8px">${h}</th>`).join('')}</tr>
        ${rows.map(r=>`<tr style="border-top:1px solid var(--line)">
          <td style="padding:6px 8px;white-space:nowrap">${esc(r.day.slice(5))}</td>
          ${['open','quiz','wall','checkout','subscribed','start','finish','ret7','install','signup']
            .map(k=>cell(r[k]||0)).join('')}</tr>`).join('')}
      </table></div>
    </details>
    <div style="font:400 11.5px/1.6 var(--sans);color:var(--grey2);margin-top:12px;max-width:72ch">
      Counts, not people. Nothing here identifies anyone and nothing is stored per person; the app
      adds one to a daily total. Counting started on 15 September 2026, so earlier days are empty.</div>
  </div>`;
}

/* ── everyone who ever signed up ───────────────────────────────────
   The dashboard showed coaching clients and enquiries, which is a handful
   of people. Everybody who did the quiz, used the free ladder and drifted
   off was invisible, and that is the whole top of the funnel. */
let leads=null, leadQ='', leadSort='last', grantBusy='', leadErr='', leadsAsked=false;
function loadLeads(force){
  if(leadsAsked && !force) return;
  leadsAsked=true;
  fetch(API+'/leads',{headers:hdr()})
    .then(r=>r.ok?r.json():Promise.reject('the server said '+r.status))
    .then(d=>{ leads=d.leads||[]; draw(); })
    .catch(e=>{ leadErr=String(e); draw(); });
}
/* Active means seen in the last fortnight. Anything longer and "still
   training" stops meaning anything. */
const leadLive = a => a.last && (Date.now()-a.last) < 14*DAY;
const leadNew  = a => a.first && (Date.now()-a.first) < 7*DAY;
function grant(email, on){
  const word = on
    ? 'Give '+email+' the whole ladder, free?\n\nThey get every stage straight away. You can take it back from this screen at any time.'
    : 'Take the paid stages back from '+email+'?\n\nThey keep their account and their history, and drop to stage one. If they are paying through Stripe this does not cancel that, so check before you do it.';
  if(!confirm(word)) return;
  grantBusy=email; draw();
  fetch(API+'/grant',{method:'POST',headers:hdr(),
    body:JSON.stringify({email, plus:!!on})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||('the server said '+r.status))))
    .then(()=>{ grantBusy=''; loadLeads(true); })
    .catch(e=>{ grantBusy=''; draw(); alert(String(e)); });
}
function leadsHTML(){
  loadLeads();
  if(leadErr) return `<div class="card"><div class="kick">ACCOUNTS</div>
    <div style="font:400 14px/1.6 var(--sans);color:var(--grey);margin-top:12px">
      Could not load them. ${esc(leadErr)}.</div>
    <button class="send" style="width:auto;padding:0 16px;margin-top:12px"
      onclick="leadErr='';leadsAsked=false;loadLeads()">Try again</button></div>`;
  if(!leads || !leads.length) return `<div class="card"><div class="kick">ACCOUNTS</div>
    <div style="font:400 14px/1.6 var(--sans);color:var(--grey);margin-top:12px">
      ${leads?'Nobody has signed up yet.':'Loading…'}</div></div>`;

  const coachedSet=new Set(clients.filter(c=>c.coached!==false).map(c=>c.email));
  const paid=leads.filter(a=>a.plus), live=leads.filter(leadLive), fresh=leads.filter(leadNew);
  const q=leadQ.trim().toLowerCase();
  const rows=leads
    .filter(a=>!q || (a.email||'').toLowerCase().indexOf(q)>-1
                  || (a.name||'').toLowerCase().indexOf(q)>-1)
    .slice()
    .sort((a,b)=> leadSort==='first' ? (b.first||0)-(a.first||0) : (b.last||0)-(a.last||0));

  const stat=(n,label,note)=>`<div style="flex:1;min-width:118px;padding:12px 14px;
    border-radius:14px;background:#fff;border:1px solid var(--line)">
    <div style="font:600 26px/1 var(--sans);font-variant-numeric:tabular-nums">${n}</div>
    <div style="font:600 9.5px/1 var(--sans);letter-spacing:.12em;color:var(--grey2);margin-top:7px">
      ${label}</div>
    ${note?`<div style="font:400 11px/1.4 var(--sans);color:var(--grey2);margin-top:5px">${note}</div>`:''}
  </div>`;
  const sortBtn=(id,label)=>`<button onclick="leadSort='${id}';draw()"
    style="cursor:pointer;border-radius:999px;padding:6px 12px;font:600 11.5px/1 var(--sans);
    border:1.5px solid ${leadSort===id?'var(--forest)':'var(--line)'};
    background:${leadSort===id?'var(--forest)':'#fff'};
    color:${leadSort===id?'#fff':'var(--ink)'}">${label}</button>`;

  return `<div class="card">
    <div class="kick">ACCOUNTS · ${leads.length}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      ${stat(leads.length,'SIGNED UP','every account ever')}
      ${stat(live.length,'STILL TRAINING','opened it in the last fortnight')}
      ${stat(fresh.length,'NEW THIS WEEK','')}
      ${stat(paid.length,'ON £5','including anyone you have comped')}
    </div>
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:16px">
      <input value="${esc(leadQ)}" oninput="leadQ=this.value;draw()" placeholder="Find an address…"
        style="flex:1;min-width:190px;border:1px solid var(--line);border-radius:10px;
        padding:9px 11px;font:400 13.5px/1 var(--sans);background:#fff">
      ${sortBtn('last','Last seen')}${sortBtn('first','Newest')}
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
      ${rows.map(a=>{
        const isC=coachedSet.has(a.email), busy=grantBusy===a.email;
        const tag=(t,c)=>`<span style="font:600 9px/1 var(--sans);letter-spacing:.1em;
          border-radius:999px;padding:4px 8px;background:${c}1a;color:${c}">${t}</span>`;
        return `<div style="display:flex;gap:11px;align-items:center;flex-wrap:wrap;
          padding:11px 13px;border-radius:13px;background:#fff;border:1px solid var(--line)">
          <span style="flex:1;min-width:190px">
            <b style="font:600 13.5px/1.3 var(--sans)">${esc(a.name||a.email.split('@')[0])}</b>${a.ref?` <span class="tag tag-neutral" title="Where they came from">${esc(a.ref)}</span>`:''}
            <span style="display:block;font:400 11.5px/1.3 var(--sans);color:var(--grey2);margin-top:3px">
              ${esc(a.email)}</span>
          </span>
          <span style="flex:none;display:flex;gap:6px;flex-wrap:wrap">
            ${isC?tag('COACHED','#006663'):''}
            ${a.plus?tag(a.stripeCustomer?'£5 · STRIPE':(a.until?'£5 · CODE TO '+String(a.until).slice(5,10):'£5 · COMPED'),'#006663'):''}
            ${leadLive(a)?'':tag('QUIET','#5a5a5a')}
          </span>
          <span style="flex:none;min-width:148px;text-align:right;font:400 11.5px/1.5 var(--sans);
            color:var(--grey2)">
            ${a.last?'seen '+ago(a.last):'never opened it'}
            ${a.first?`<span style="display:block">joined ${ago(a.first)}</span>`:''}
          </span>
          <button onclick="openClient('${esc(a.email)}')"
            style="flex:none;cursor:pointer;border-radius:10px;padding:8px 12px;font:600 11.5px/1 var(--sans);
            background:#fff;border:1.5px solid var(--line);color:var(--ink)">Message</button>
          ${owner?`<button onclick="grant('${esc(a.email)}',${a.plus?'false':'true'})"${busy?' disabled':''}
            style="flex:none;cursor:pointer;border-radius:10px;padding:8px 12px;
            font:600 11.5px/1 var(--sans);background:#fff;
            border:1.5px solid ${a.plus?'var(--line)':'var(--forest)'};
            color:${a.plus?'var(--grey)':'var(--forest)'};opacity:${busy?.5:1}">
            ${busy?'…':a.plus?'Take it back':'Give them £5 free'}</button>`:''}
        </div>`;}).join('')
        || '<div style="font:400 13.5px/1.6 var(--sans);color:var(--grey2)">Nobody matches.</div>'}
    </div>
    <div style="font:400 11.5px/1.6 var(--sans);color:var(--grey2);margin-top:14px;max-width:70ch">
      Giving someone the tier is instant and reversible from the same button. It does not
      touch Stripe: if they are already paying, taking it back here does not cancel the
      subscription, and giving it to a payer does not stop them being charged.</div>
  </div>`;
}

/* ── is Stripe wired up ────────────────────────────────────────────
   Configuration, not customer data: whether the key, the price and the
   webhook secret exist, and whether the key is a test one. The failure it
   catches is a live site quietly running on test keys. */
let stripeCfg=null, stripeAsked=false;
function loadStripe(){
  if(stripeAsked) return; stripeAsked=true;
  fetch(API+'/stripe-status',{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ stripeCfg=d; draw(); } })
    .catch(()=>{});
}
function stripeHTML(){
  loadStripe();
  if(!stripeCfg) return '';
  const c=stripeCfg;
  const bad = c.secretKey==='missing' || c.priceId==='missing' || c.webhookSecret==='missing'
           || /TEST/.test(c.secretKey||'');
  const line=(label,val,ok)=>`<div style="display:flex;gap:10px;align-items:baseline;
    padding:7px 0;border-top:1px solid var(--line)">
    <span style="flex:0 0 150px;font:600 9.5px/1.4 var(--sans);letter-spacing:.11em;
      color:var(--grey2)">${label}</span>
    <span style="flex:1;font:600 13px/1.4 var(--sans);color:${ok?'var(--ink)':'var(--terra)'}">
      ${esc(val)}</span></div>`;
  return `<div class="card" style="margin-top:14px">
    <div class="kick">PAYMENTS${bad?' · CHECK THIS':''}</div>
    <div style="margin-top:10px">
      ${line('SECRET KEY', c.secretKey, c.secretKey!=='missing' && !/TEST/.test(c.secretKey||''))}
      ${line('£5 PRICE', c.priceId, c.priceId!=='missing')}
      ${line('WEBHOOK SECRET', c.webhookSecret, c.webhookSecret!=='missing')}
      ${line('BUILD', (c.context||'')+' · '+(c.branch||''), true)}
    </div>
    <div style="font:400 12px/1.6 var(--sans);color:${bad?'var(--terra)':'var(--grey2)'};
      margin-top:12px;max-width:64ch">
      ${bad
        ? 'Something here is not right. A missing webhook secret means a payment goes through and the account never turns on. A test key means no real money moves at all.'
        : 'Keys, price and webhook are all set on live keys. Nothing to do.'}</div>
  </div>`;
}

/* ── what people say about the app ─────────────────────────────────
   Questions are about handstands and go to a coach. This is about the app
   itself, from anyone, signed in or not. Kept rather than only emailed,
   because the same bug reported by four people is a different thing from
   one reported once, and an inbox cannot tell you that. */
let feedback=[], fbAsked=false, fbShowDone=false, fbFilter='all', fbBusy='';
/* the questions as the app words them, so the answers read as answers */
const FB_Q={often:'Training with it:',stuck:'Stuck on:',keep:'Would keep using it if:',
  pay:'The monthly price:',
  better:'Got better:',friction:'Got in the way:',next:'Change next block:',quote:'Quote publicly, first name only:'};
const FB_LABEL={bug:['Bug','var(--terra)'],idea:['Idea','#8a5a12'],review:['Feedback','var(--forest)'],block:['Block review','var(--forest)']};
function loadFeedback(){
  if(fbAsked) return; fbAsked=true;
  fetch(API+'/feedback',{headers:hdr()})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d){ feedback=d.feedback||[]; draw(); } })
    .catch(()=>{}).finally(homeStep);
}
const fbOpenList = () => feedback.filter(f=>!f.done);
function fbDone(id,on){
  fbBusy=id; draw();
  fetch(API+'/feedback',{method:'POST',headers:hdr(),body:JSON.stringify({id,done:on})})
    .then(r=>r.ok?r.json():Promise.reject('the server said '+r.status))
    .then(d=>{ feedback=d.feedback||feedback; fbBusy=''; draw(); })
    .catch(e=>{ fbBusy=''; draw(); alert(String(e)); });
}
function feedbackHTML(){
  loadFeedback();
  const open=fbOpenList(), done=feedback.filter(f=>f.done);
  const counts={bug:0,idea:0,review:0};
  open.forEach(f=>{ counts[f.kind]=(counts[f.kind]||0)+1; });
  const shown=(fbFilter==='all'?open:open.filter(f=>f.kind===fbFilter));
  const tag=(k)=>{ const pair=FB_LABEL[k]||FB_LABEL.review;
    return `<span style="font:700 8.5px/1 var(--sans);letter-spacing:.11em;border-radius:6px;
      padding:5px 8px;background:${pair[1]}1a;color:${pair[1]}">${pair[0].toUpperCase()}</span>`; };
  const filt=(id,label,n)=>`<button onclick="fbFilter='${id}';draw()"
    style="cursor:pointer;border-radius:999px;padding:7px 13px;font:600 12px/1 var(--sans);
    border:1.5px solid ${fbFilter===id?'var(--forest)':'var(--line)'};
    background:${fbFilter===id?'var(--forest)':'#fff'};
    color:${fbFilter===id?'#fff':'var(--ink)'}">${label}${n?' '+n:''}</button>`;
  const card=(f,isDone)=>`<div style="border:1px solid ${isDone?'var(--line)':'rgba(0,102,99,.3)'};
    border-radius:16px;padding:14px 16px;background:${isDone?'rgba(255,255,255,.6)':'#fff'}">
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      ${tag(f.kind)}
      <b style="font:600 13.5px/1.2 var(--sans)">${esc(f.name||f.email||'Someone not signed in')}</b>
      ${f.email?`<span style="font:400 11.5px/1 var(--sans);color:var(--grey2)">${esc(f.email)}</span>`:''}
      <span style="flex:1"></span>
      <span style="font:400 11.5px/1 var(--sans);color:var(--grey2)">
        stage ${f.stage||'?'}${f.plus?' · £5':''}${f.at?' · '+ago(f.at):''}</span>
    </div>
    <div style="font:400 14.5px/1.6 var(--sans);color:var(--ink);margin-top:9px;
      white-space:pre-wrap">${esc(f.text||'')}</div>
    ${Object.keys(f.extra||{}).length?`<div style="margin-top:11px;padding:11px 13px;border-radius:12px;
      background:rgba(0,64,61,.05);display:flex;flex-direction:column;gap:7px">
      ${Object.keys(f.extra).map(k=>`<div style="font:400 12.5px/1.5 var(--sans);color:var(--grey)">
        <b style="color:var(--ink);font-weight:600">${esc(FB_Q[k]||k)}</b> ${esc(f.extra[k])}</div>`).join('')}
    </div>`:''}
    <div style="display:flex;gap:10px;align-items:center;margin-top:11px;flex-wrap:wrap">
      <button class="quiet" onclick="fbDone('${esc(f.id)}',${isDone?'false':'true'})"${
        fbBusy===f.id?' disabled':''}>${fbBusy===f.id?'…':isDone?'Put it back':'Done with it'}</button>
      ${f.email?`<button class="quiet" onclick="openClient('${esc(f.email)}')">
        Open their thread</button>`:''}
    </div>
  </div>`;
  return `<div class="card">
    <div class="kick">FEEDBACK${open.length?' · '+open.length+' OPEN':''}</div>
    ${!feedback.length
      ? `<div style="font:400 14.5px/1.6 var(--sans);color:var(--grey);margin-top:12px">
           Nobody has sent anything yet. The button is in the app's top bar.</div>`
      : `<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:14px">
           ${filt('all','Everything',open.length)}${filt('bug','Bugs',counts.bug)}
           ${filt('idea','Ideas',counts.idea)}${filt('review','How it is going',counts.review)}
         </div>
         <div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
           ${shown.map(f=>card(f,false)).join('')
             || `<div style="font:400 14.5px/1.6 var(--sans);color:var(--grey)">
                  Nothing open here.</div>`}
         </div>
         ${done.length?`<button class="quiet" style="margin-top:16px"
           onclick="fbShowDone=${fbShowDone?'false':'true'};draw()">${
           fbShowDone?'Hide':'Show'} the ${done.length} you have dealt with</button>
           ${fbShowDone?`<div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
             ${done.map(f=>card(f,true)).join('')}</div>`:''}`:''}`}
  </div>`;
}

        <span style="font:400 12px/1 var(--sans);color:${late?'var(--terra)':'var(--grey2)'}">
          ${since(s.at)}${late?' · past the 48 you promise':''}</span>
      </div>
      <div style="margin-top:11px">${nums}</div>
      <div style="font:400 12.5px/1.4 var(--sans);color:var(--grey2);margin-top:9px">

      ${s.kind==='checkpoint'?`<div style="margin-top:12px;padding:11px 12px;border-radius:12px;background:rgba(0,64,61,.05)">
        <div style="font:700 9px/1 var(--sans);letter-spacing:.14em;color:var(--grey2)">YOUR VERDICT</div>
        <input id="vnote-${esc(s.id)}" placeholder="One line they will read beside it, optional"
          style="width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
          font:400 13px/1.3 var(--sans);background:#fff">
        <div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">
          <button class="send" style="width:auto;padding:0 14px;font-size:12.5px"
            onclick="markReviewed('${esc(email)}','${esc(s.id)}',false,'reached')">Reached, verified</button>
          <button class="send" style="width:auto;padding:0 14px;font-size:12.5px;background:rgba(243,169,73,.25);color:#7a4a10"
            onclick="markReviewed('${esc(email)}','${esc(s.id)}',false,'notyet')">Not there yet</button>
        </div>
        <div style="font:400 11.5px/1.5 var(--sans);color:var(--grey2);margin-top:8px">
          Either one marks it reviewed and shows on their check point beside the number. Reached counts as the check point met, whatever the number said.</div>
      </div>`:''}
      <div style="display:flex;gap:8px;margin-top:13px;flex-wrap:wrap">
        ${s.clips.length?`<button class="send" style="width:auto;padding:0 14px;font-size:12.5px"
          onclick="reviewClips('${esc(email)}',${JSON.stringify(s.clips).replace(/"/g,'&quot;')},'${esc((clients.find(c=>c.email===email)||{}).name||'Client')}')">

function loadFormCheck(email){
  fetch(API+'/formcheck?email='+encodeURIComponent(email),{headers:hdr()})

    .catch(()=>{});
}
function setFormCheck(email,used){
  if(!confirm(used ? 'Mark '+email+' as having used their free form check?'
                   : 'Give '+email+' their free form check back?')) return;
  fetch(API+'/formcheck/reset',{method:'POST',headers:hdr(),
    body:JSON.stringify({email, ...(used?{used:true}:{})})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not save that')))
    .then(d=>{ fcState[email]={used:!!used,at:Date.now()}; draw(); if(d.note) alert(d.note); })
    .catch(e=>alert(String(e)));
}
/* Wiping a client's account is not something to do by accident, so it asks
   twice and says exactly what goes. */
function resetClient(email){
  /* usage and the chat. Never the programme: a reset wipes what they have
     done, not what they have been given. */
  const parts=[];
  if(confirm('Clear '+email+"'s usage? Sessions, opens, holds, last seen, and everything they have logged: habits, metrics, check-ins, check point readings and photos.")) parts.push('activity','tracking');
  if(confirm('Clear the chat? Every message goes and one opening message from you is left in its place.')) parts.push('chat');
  if(!parts.length) return;
  if(!confirm('Last check. Clearing '+(parts.indexOf('activity')>-1?'usage':'')+(parts.length>2||parts[0]==='chat'?(parts.indexOf('activity')>-1?' and ':'')+'the chat':'')+' for '+email+'. Their programme and check points are not touched. This cannot be undone.')) return;
  fetch(API+'/reset',{method:'POST',headers:hdr(),body:JSON.stringify({email, parts})})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not do that')))
    .then(d=>{ prog[email]=null; tracks[email]=null; cpDefs[email]=null; pendingCoach=[];
               if(builder && builder.email===email) builder=null;
               alert('Cleared: '+(d.cleared||[]).join(', ')+'.');
               openThread(email); })
    .catch(e=>alert(String(e)));
}

/* Name, address and password in one place. All three were scattered: the
   name only settable when creating the account, the address not at all, and
   the password only on the create form. */
function acctDetails(email){
  const c=clients.find(x=>x.email===email)||{};
  const nm=(c.name||'').trim();
  const say=t=>{ const m=document.getElementById('adMsg'); if(m) m.textContent=t; };

  window.adRename=function(){
    const v=(document.getElementById('adName')||{}).value.trim();
    if(!v) return say('Give them a name.');
    say('Saving…');
    fetch(API+'/roster',{method:'POST',headers:hdr(),
      body:JSON.stringify({email, name:v, coach:c.coach||''})})
      .then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(()=>{ say('Name saved.'); load(); })
      .catch(()=>say('Could not save that.'));
  };
  window.adMove=function(){
    const v=(document.getElementById('adEmail')||{}).value.trim().toLowerCase();
    if(!v||v===email) return say('Type the new address.');
    if(!confirm('Move '+email+' to '+v+'?\n\nTheir programme, progress, check points and the whole chat move with it. They sign in with the new address from then on, and they are emailed to say so.')) return;
    say('Moving…');
    fetch(API+'/email',{method:'POST',headers:hdr(),body:JSON.stringify({email,next:v})})
      .then(r=>r.json().then(d=>r.ok?d:Promise.reject(d.error||'Could not move it')))
      .then(d=>{ say('Moved to '+d.to+'.'); sel=d.to; acct=null; load(); })
      .catch(e=>say(String(e)));
  };
  window.adPw=function(){
    const v=(document.getElementById('adPw')||{}).value||'';
    if(v.length<8) return say('At least 8 characters.');
    say('Setting…');
    fetch(API+'/setpw',{method:'POST',headers:hdr(),body:JSON.stringify({email,password:v})})
      .then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(()=>{ say('Password set. Tell them what it is, it is not emailed.');
                  const el=document.getElementById('adPw'); if(el) el.value=''; })
      .catch(()=>say('Could not set that.'));
  };

  /* ── deleting them ──────────────────────────────────────────────
     Gone for good, and the address has to be typed again to get there. The
     server refuses a coach and refuses a live subscription, so the second
     press is only ever offered after it has said why. */
  window.adDelete=function(force){
    const v=(document.getElementById('adDel')||{}).value.trim().toLowerCase();
    if(v!==email) return say('Type '+email+' to confirm.');
    if(!force && !confirm('Delete '+email+'?\n\nTheir messages, progress, check point '
      +'history, submissions and questions go with it. This cannot be undone.')) return;
    say(force?'Deleting anyway…':'Deleting…');
    fetch(API+'/coach/account/delete',{method:'POST',headers:hdr(),
      body:JSON.stringify(force?{email,confirm:v,force:true}:{email,confirm:v})})
      .then(r=>r.json().then(d=>r.ok?d:Promise.reject(Object.assign(d,{status:r.status}))))
      .then(()=>{ acct=null; if(sel===email) sel=''; thread=[]; load();
                  flash('Deleted '+email+'.'); })
      .catch(e=>{
        if(e && e.status===409){
          say(String(e.error||'Still on a live subscription.'));
          const b=document.getElementById('adDelForce'); if(b) b.hidden=false;
          return;
        }
        say(String((e&&e.error)||'Could not delete that.'));
      });
  };

  const fld=(id,val,ph,btn,fn)=>`<div style="display:flex;gap:8px;margin-top:9px">
    <input id="${id}" value="${esc(val||'')}" placeholder="${esc(ph)}"
      style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
      font:400 14px/1 var(--sans);background:#fff">
    <button onclick="${fn}" style="${bGhost};flex:none">${btn}</button></div>`;

  return `<div onclick="if(event.target===this)closeAcct()" style="position:fixed;inset:0;z-index:70;
    background:rgba(8,20,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;justify-content:center;overflow-y:auto;padding:22px 14px">
    <div style="width:100%;max-width:520px;height:max-content;background:var(--bg);border-radius:22px;
      padding:20px;box-shadow:0 30px 70px -30px rgba(0,0,0,.5)">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="flex:1;min-width:0">
          <div style="font:400 22px/1.1 var(--serif)">Account</div>
          <div style="font:500 11px/1.4 var(--sans);color:var(--grey2);margin-top:4px">${esc(email)}</div>
        </div>
        <button onclick="closeAcct()" style="${bGhost}">Close</button>
      </div>

      <div class="kick" style="margin-top:18px">NAME</div>
      ${fld('adName',nm,'What you call them','Save','adRename()')}

      <div class="kick" style="margin-top:18px">EMAIL</div>
      <div style="font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:6px">
        They sign in with this. Moving it brings everything across. Use this when they have
        lost the old inbox, otherwise they can do it themselves in the app.</div>
      ${fld('adEmail',email,'New address','Move','adMove()')}

      <div class="kick" style="margin-top:18px">PASSWORD</div>
      <div style="font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:6px">
        Sets it outright and clears any lockout from failed attempts. It is not emailed,
        so tell them what it is.</div>
      ${fld('adPw','','New password, 8+ characters','Set','adPw()')}

      <div class="kick" style="margin-top:22px;color:var(--terra)">DELETE</div>
      <div style="font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:6px">
        Their messages, progress, check point history, submissions and questions go
        with the account and cannot be brought back. Use it for a test account or a
        duplicate. If this is the one with the real history and only the address is
        wrong, move the address instead. It does not touch Stripe, so cancel a paying
        subscription there first.</div>
      <div style="display:flex;gap:8px;margin-top:9px">
        <input id="adDel" placeholder="Type ${esc(email)} to confirm"
          style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
          font:400 14px/1 var(--sans);background:#fff">
        <button onclick="adDelete(false)" style="${bGhost};flex:none;
          border-color:rgba(164,80,60,.5);color:var(--terra)">Delete</button></div>
      <button id="adDelForce" hidden onclick="adDelete(true)" style="${bGhost};margin-top:9px;
        width:100%;border-color:var(--terra);color:var(--terra)">
        Delete anyway, I have cancelled it in Stripe</button>

      <div id="adMsg" style="font:500 12.5px/1.5 var(--sans);color:var(--forest);
        text-align:center;min-height:18px;margin-top:16px"></div>
    </div></div>`;
}

   Adding a coach meant editing a Netlify variable and spending a deploy on

/* The optimistic push means a clip appears in the coach's own thread the
   moment it uploads, whether or not the server accepted it. Without this
   a rejected send looks identical to a delivered one — which is how a
   photo could reach the coach's screen and never reach the client. */
function sendOK(r){
  if(r.ok) return r;
  return r.json().catch(()=>({})).then(d=>{
    const why=(d && d.error) || ('the server said '+r.status);
    throw new Error('Not delivered — '+why);
  });
}

function pickCoachFile(accept){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept=accept; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove();
    if(!f) return;
    (f.type||'').startsWith('image/') ? sendCoachPhoto(f) : sendCoachClip(f); };
  inp.click();
}
/* ── sending a photo ───────────────────────────────────────────────
   Shrunk here rather than sent whole: a phone photo is 4MB of detail
   nobody needs to judge a shoulder angle, and small enough to go
   through the function means no second storage provider. */
async function shrinkPhoto(file, max=1600, quality=0.82){
  let src;
  try{ src=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){
    src=await new Promise((res,rej)=>{
      const i=new Image(), u=URL.createObjectURL(file);
      i.onload=()=>{ URL.revokeObjectURL(u); res(i); };
      i.onerror=()=>{ URL.revokeObjectURL(u); rej('Could not read that photo'); };
      i.src=u;
    });
  }
  const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight;
  if(!w||!h) throw 'Could not read that photo';
  const s=Math.min(1, max/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  return c.toDataURL('image/jpeg',quality);
}

function sendCoachPhoto(file){
  if(upBusy||!sel) return;
  upBusy=true; coachSay('Preparing the photo…');
  shrinkPhoto(file)
    .then(data=>fetch('/api/app/image',{method:'POST',headers:hdr(),
      body:JSON.stringify({data})})
      .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not send that photo'))))
    .then(d=>{
      const el=document.getElementById('reply');
      const text=(el&&el.value||'').trim();
      if(el) el.value=''; drafts[sel]='';
      pendingCoach.push({email:sel,text,image:d.id,at:Date.now()});
      thread.push({from:'coach',text,image:d.id,at:Date.now()}); draw();
      return fetch(API+'/thread?email='+encodeURIComponent(sel),{method:'POST',headers:hdr(),
        body:JSON.stringify({text,image:d.id})}).then(sendOK);
    })
    .then(()=>{ upBusy=false; coachSay(''); setTimeout(()=>openThread(sel),1200); })
    .catch(e=>{ upBusy=false; coachSay(String(e)); });
}

function sendCoachClip(file, after){
  if(upBusy||!sel){ if(after) after(false, 'busy'); return; }
  upBusy=true; coachSay('Getting ready…');
  fetch('/api/app/upload',{method:'POST',headers:hdr(),body:'{}'})
    .then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(d.error||'Could not start upload')))
    .then(d=>new Promise((res,rej)=>{
      const fd=new FormData(); fd.append('file',file);
      const x=new XMLHttpRequest(); x.open('POST',d.uploadURL);
      x.upload.onprogress=e=>{ if(e.lengthComputable) coachSay('Uploading… '+Math.round(e.loaded/e.total*100)+'%'); };
      x.onload=()=> (x.status>=200&&x.status<300)?res(d.uid):rej('Upload failed ('+x.status+')');
      x.onerror=()=>rej('Upload failed');
      x.send(fd);
    }))
    .then(uid=>{
      const el=document.getElementById('reply');
      const text=(el&&el.value||'').trim();
      if(el) el.value=''; drafts[sel]='';
      pendingCoach.push({email:sel,text,video:uid,at:Date.now()});
      thread.push({from:'coach',text,video:uid,at:Date.now()}); draw();
      return fetch(API+'/thread?email='+encodeURIComponent(sel),{method:'POST',headers:hdr(),
        body:JSON.stringify({text,video:uid})}).then(sendOK);
    })
    .then(()=>{ upBusy=false; coachSay(''); if(after) after(true); setTimeout(()=>openThread(sel),1200); })
    .catch(e=>{ upBusy=false; coachSay(String(e)); if(after) after(false, String(e)); });
}
/* the recording the review tool made, sent back as a video reply to whoever
   the clips were from. The tool hands the file over; this owns the upload
   and the thread, the same path as any other video reply. */
window.addEventListener('message', e=>{
  if(e.origin!==location.origin || !e.data || e.data.type!=='lha-review-recording') return;
  const w=reviewFrame();
  const tell=(ok,error)=>{ try{ w && w.postMessage({type:'lha-review-sent', ok, error,
    to:(clients.find(c=>c.email===sel)||{}).name||sel}, location.origin); }catch(err){} };
  const to=reviewFor||sel;
  if(!to){ tell(false,'nobody to send it to'); return; }
  sel=to;
  const ext=e.data.ext||'webm';
  let file;
  try{ file=new File([e.data.blob], 'review-'+Date.now()+'.'+ext, {type:e.data.blob.type||'video/'+ext}); }
  catch(err){ file=e.data.blob; }
  sendCoachClip(file, tell);
});

function openSub(email){

    .sort((a,b)=>(a.at||0)-(b.at||0)))[0]||null;
}

/* ── what the numbers mean ──────────────────────────────────────
   opens is one entry per day the app was opened, so a streak is a real
   habit rather than a count of taps. */
function daysAgo(t){ if(!t) return '—'; const d=Math.floor((Date.now()-t)/86400000);
  return d===0?'today':d===1?'yesterday':d+' days ago'; }
function streak(opens){
  if(!opens||!opens.length) return 0;
  const set=new Set(opens); let n=0; const d=new Date();
  for(;;){ const k=d.toISOString().slice(0,10);
    if(set.has(k)) n++; else if(n||k!==new Date().toISOString().slice(0,10)) break;
    d.setDate(d.getDate()-1); if(n>365) break; }
  return n;
}
function last7(opens){
  if(!opens) return 0; const cut=Date.now()-7*86400000;
  return opens.filter(k=>new Date(k+'T00:00:00Z').getTime()>=cut).length;
}

/* ── analysis ────────────────────────────────────────────────────
   Charts are hand-drawn SVG on purpose: no library, no CDN, and the
   whole page stays one file. */
const DAY=86400000;
const iso=t=>new Date(t).toISOString().slice(0,10);
const dayStart=t=>{const d=new Date(t); d.setHours(0,0,0,0); return d.getTime();};

function analysis(email){
  const p=prog[email]||{};
  const done=(p.sessions||[]).filter(x=>x.done);
  const all=(p.sessions||[]);
  const opens=(p.opens||[]).slice().sort();
  const holds=(p.holds||[]).slice().sort((a,b)=>a.at-b.at);
  const start=all.length?Math.min(...all.map(x=>x.at)) : (opens.length?new Date(opens[0]+'T00:00:00').getTime():Date.now());

  /* weeks since they started, capped at what we can usefully draw */
  const weeks=Math.max(1,Math.min(12,Math.ceil((Date.now()-start)/(7*DAY))));
  const perWeek=[...Array(weeks)].map((_,i)=>{
    const a=start+i*7*DAY, b=a+7*DAY;
    return done.filter(x=>x.at>=a&&x.at<b).length;
  });
  /* they pick their own frequency at signup — measuring everyone against
     three made a 2-a-week beginner look like they were failing and a
     5-a-week client look better than they were */
  const target=(intakes[email]&&Number(intakes[email].days))||3;
  const adherence=weeks?Math.round(done.length/(weeks*target)*100):0;
  const sinceLast=done.length?Math.max(0,Math.floor((Date.now()-Math.max(...done.map(x=>x.at)))/DAY)):null;
  /* a day they ticked some of and not all of is a part day, not an
     abandoned session. Only a session actually started and walked out of
     counts as abandoned, which is the one worth asking about. */
  const part=all.filter(x=>!x.done&&(x.kind==='part'||x.mode==='ticks'||x.mode==='checkin'));
  const abandoned=Math.max(0, all.length-done.length-part.length);

  /* status is the thing you want to see before anything else */
  let status='On track', tone='ok';
  if(sinceLast===null){ status='Not started'; tone='warn'; }
  else if(sinceLast>10){ status='At risk'; tone='bad'; }
  else if(sinceLast>6||adherence<50){ status='Slipping'; tone='warn'; }

  return {p,done,all,opens,holds,start,weeks,perWeek,target,adherence,sinceLast,part,abandoned,status,tone};
}

function heatmap(opens,done){
  const weeks=12; let cols='';
  const doneDays=new Set(done.map(x=>iso(x.at)));
  const openDays=new Set(opens);
  const today=dayStart(Date.now());
  const startCol=today-(weeks*7-1)*DAY;
  for(let w=0;w<weeks;w++){
    let cells='';
    for(let d=0;d<7;d++){
      const t=startCol+(w*7+d)*DAY, k=iso(t);
      const lvl=doneDays.has(k)?2:openDays.has(k)?1:0;
      const fill=lvl===2?'var(--forest)':lvl===1?'#cfe6ec':'var(--mist)';
      const title=new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+
        (lvl===2?' — session':lvl===1?' — opened':' — nothing');
      cells+=`<rect x="0" y="${d*13}" width="11" height="11" rx="2.5" fill="${fill}"><title>${title}</title></rect>`;
    }
    cols+=`<g transform="translate(${w*13},0)">${cells}</g>`;
  }
  return `<svg viewBox="0 0 ${weeks*13} 91" width="100%" style="max-width:340px;height:auto" role="img"
    aria-label="Activity over the last twelve weeks">${cols}</svg>`;
}

function barChart(vals,target){
  if(!vals.length) return '';
  const w=26, gap=8, h=88, max=Math.max(target+1,...vals);
  const bars=vals.map((v,i)=>{
    const bh=Math.max(2,Math.round(v/max*h));
    const x=i*(w+gap);
    const col=v>=target?'var(--forest)':v>0?'var(--sand)':'var(--mist)';
    return `<rect x="${x}" y="${h-bh}" width="${w}" height="${bh}" rx="4" fill="${col}">
        <title>Week ${i+1}: ${v} session${v===1?'':'s'}</title></rect>
      <text x="${x+w/2}" y="${h+14}" text-anchor="middle" font-size="9"
        fill="var(--grey2)" font-family="var(--sans)">${i+1}</text>`;
  }).join('');
  const ty=h-Math.round(target/max*h);
  return `<svg viewBox="0 0 ${vals.length*(w+gap)} ${h+20}" width="100%"
    style="max-width:${vals.length*(w+gap)}px;height:auto" role="img"
    aria-label="Sessions completed each week against a target of ${target}">
    <line x1="0" y1="${ty}" x2="${vals.length*(w+gap)}" y2="${ty}"
      stroke="var(--terra)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
    ${bars}</svg>`;
}

function lineChart(points,unit){
  if(points.length<2) return '';
  const w=300,h=90,pad=6;
  const xs=points.map(p=>p.at), ys=points.map(p=>p.s);
  const x0=Math.min(...xs), x1=Math.max(...xs), y1=Math.max(...ys);
  const px=t=>pad+((t-x0)/Math.max(1,x1-x0))*(w-pad*2);
  const py=v=>h-pad-(v/Math.max(1,y1))*(h-pad*2);
  const d=points.map((p,i)=>(i?'L':'M')+px(p.at).toFixed(1)+' '+py(p.s).toFixed(1)).join(' ');
  const area=d+` L${px(x1).toFixed(1)} ${h-pad} L${px(x0).toFixed(1)} ${h-pad} Z`;
  const dots=points.map(p=>`<circle cx="${px(p.at).toFixed(1)}" cy="${py(p.s).toFixed(1)}" r="2.5"
      fill="var(--forest)"><title>${p.s}${unit} · ${new Date(p.at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;height:auto" role="img"
    aria-label="Best hold over time, now ${points[points.length-1].s}${unit}">
    <path d="${area}" fill="var(--forest)" opacity=".08"/>
    <path d="${d}" fill="none" stroke="var(--forest)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}


/* ── month calendar ─────────────────────────────────────────────
   The heatmap answers "have they been consistent". This answers
   "what did they actually do on the 14th", which is the question you
   ask before a check-in. */
function monthCal(sessions,opens,offset){
  const now=new Date(); now.setMonth(now.getMonth()-(offset||0));
  const y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7;                    /* Monday first */
  const byDay={};
  sessions.forEach(function(x){
    const d=new Date(x.at); if(d.getFullYear()!==y||d.getMonth()!==m) return;
    const k=d.getDate();
    byDay[k]=byDay[k]||{mins:0,done:0,part:0,names:[]};
    byDay[k].mins+=(x.actual||x.mins||0);
    byDay[k][x.done?'done':'part']++;
    byDay[k].names.push((x.name||'session')+(x.done?'':' (stopped)'));
  });
  const openSet=new Set(opens||[]);
  const today=new Date(); const isThisMonth=today.getFullYear()===y&&today.getMonth()===m;

  let cells='';
  for(let i=0;i<lead;i++) cells+='<div style="aspect-ratio:1;min-height:38px"></div>';
  for(let d=1;d<=days;d++){
    const e=byDay[d];
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const opened=openSet.has(key);
    const isToday=isThisMonth&&today.getDate()===d;
    const bg=e?(e.done?'var(--forest)':'rgba(196,122,86,.22)'):opened?'#e9e4de':'transparent';
    const fg=e&&e.done?'#fff':'var(--ink)';
    const title=e?`${e.names.join(', ')} · ${e.mins} min`:opened?'opened the app':'nothing';
    cells+=`<div title="${esc(title)}" style="aspect-ratio:1;border-radius:9px;background:${bg};
      border:${isToday?'1.5px solid var(--terra)':'1px solid var(--line)'};
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
      color:${fg};min-height:38px">
      <span style="font:500 11px/1 var(--sans);opacity:${e?1:.55}">${d}</span>
      ${e?`<span style="font:600 9px/1 var(--sans);opacity:.85">${e.mins}m</span>`:''}</div>`;
  }
  const label=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const total=Object.values(byDay).reduce((t,x)=>t+x.mins,0);
  const count=Object.values(byDay).reduce((t,x)=>t+x.done,0);
  return `<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <div style="font:500 13px/1 var(--sans)">${label}</div>
      <div style="font:400 12px/1 var(--sans);color:var(--grey2)">${count} session${count===1?'':'s'} · ${total} min</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px;max-width:100%">
      ${['M','T','W','T','F','S','S'].map(d=>`<div style="font:600 9px/1 var(--sans);
        letter-spacing:.1em;color:var(--grey2);text-align:center;padding-bottom:2px">${d}</div>`).join('')}
      ${cells}
    </div>`;
}

/* which of the three programme days actually gets done */
function dayBreakdown(sessions){
  const by={};
  sessions.forEach(function(x){
    const k=x.name||('Day '+((x.day||0)+1));
    by[k]=by[k]||{done:0,part:0};
    by[k][x.done?'done':'part']++;
  });
  const keys=Object.keys(by).sort();
  if(!keys.length) return '';
  const max=Math.max(...keys.map(k=>by[k].done+by[k].part));
  return keys.map(function(k){
    const v=by[k], tot=v.done+v.part;
    return `<div style="display:flex;align-items:center;gap:10px;margin-top:8px">
      <span style="font:400 13px/1 var(--sans);width:66px;flex:none">${esc(k)}</span>
      <span style="flex:1;height:9px;border-radius:999px;background:var(--mist);overflow:hidden;display:flex">
        <i style="width:${(v.done/max*100).toFixed(1)}%;background:var(--forest)"></i>
        <i style="width:${(v.part/max*100).toFixed(1)}%;background:rgba(196,122,86,.5)"></i>
      </span>
      <span style="font:400 12px/1 var(--sans);color:var(--grey2);width:64px;text-align:right">
        ${v.done} done${v.part?` · ${v.part} part`:''}</span>
    </div>`;
  }).join('');
}

/* when in the day they train — tells you when a nudge would land */
function timeOfDay(sessions){
  if(!sessions.length) return '';
  const buckets=[0,0,0,0];   /* early / morning / afternoon / evening */
  sessions.forEach(function(x){
    const h=new Date(x.at).getHours();
    buckets[h<9?0:h<12?1:h<17?2:3]++;
  });
  const names=['Before 9','9–12','12–5','After 5'];
  const max=Math.max(...buckets);
  return names.map((n,i)=>`<div style="display:flex;align-items:center;gap:10px;margin-top:7px">
      <span style="font:400 12.5px/1 var(--sans);width:66px;flex:none;color:var(--grey)">${n}</span>
      <span style="flex:1;height:8px;border-radius:999px;background:var(--mist);overflow:hidden">
        <i style="display:block;height:100%;width:${max?(buckets[i]/max*100).toFixed(0):0}%;background:var(--sand)"></i></span>
      <span style="font:400 12px/1 var(--sans);color:var(--grey2);width:22px;text-align:right">${buckets[i]}</span>
    </div>`).join('');
}


/* ── the read ────────────────────────────────────────────────────
   Everything below this is already on the page as a number. This is
   the version you can take into a check-in without doing the maths. */
function summarise(email){
  const a=analysis(email), p=a.p, out=[];
  if(!a.all.length&&!a.opens.length) return ['Nothing recorded yet.'];

  const wks=a.weeks;
  out.push(`${a.done.length} session${a.done.length===1?'':'s'} in ${wks} week${wks===1?'':'s'}, ${a.adherence}% of a ${a.target}-a-week plan.`);

  /* direction of travel matters more than the total */
  if(a.perWeek.length>=4){
    const half=Math.floor(a.perWeek.length/2);
    const early=a.perWeek.slice(0,half).reduce((t,v)=>t+v,0)/half;
    const late=a.perWeek.slice(half).reduce((t,v)=>t+v,0)/(a.perWeek.length-half);
    if(late>early+0.4) out.push('Training more than they were a month ago.');
    else if(early>late+0.4) out.push('Training less than they were a month ago, worth asking why.');
    else out.push('Holding steady week to week.');
  }

  /* which session gets avoided is the most actionable thing here */
  const by={};
  a.all.forEach(x=>{const k=x.name||('Day '+((x.day||0)+1));
    by[k]=by[k]||{done:0,part:0}; by[k][x.done?'done':'part']++;});
  const keys=Object.keys(by);
  if(keys.length>1){
    const sorted=keys.slice().sort((x,y)=>by[y].done-by[x].done);
    const top=sorted[0], bot=sorted[sorted.length-1];
    if(by[top].done-by[bot].done>=2)
      out.push(`Does ${top} most (${by[top].done}) and ${bot} least (${by[bot].done}).`);
  }

  if(a.part.length){
    out.push(`${a.part.length} day${a.part.length===1?'':'s'} part done, ticked off but not finished.`);
  }
  if(a.abandoned){
    const st=a.all.filter(x=>!x.done&&x.stoppedAt);
    out.push(`${a.abandoned} session${a.abandoned===1?'':'s'} started and abandoned` +
      (st.length?`, last one at ${st[st.length-1].stoppedAt}.`:'.'));
  }

  const avgA=a.done.filter(x=>x.actual).map(x=>x.actual);
  if(avgA.length>2){
    const avg=Math.round(avgA.reduce((t,v)=>t+v,0)/avgA.length);
    const plan=Math.round(a.done.filter(x=>x.mins).reduce((t,x)=>t+x.mins,0)/Math.max(1,a.done.filter(x=>x.mins).length));
    if(plan&&avg<plan*0.8) out.push(`Sessions run ${avg} min against ${plan} planned, so the plan may be too long.`);
  }

  if(a.holds.length>1){
    const f=a.holds[0].s, l=a.holds[a.holds.length-1].s;
    out.push(l>f ? `Hold up from ${f}s to ${l}s.` : l<f ? `Hold down from ${f}s to ${l}s.` : `Hold flat at ${l}s.`);
  }

  const hard=Object.entries(p.flags||{}).filter(([,v])=>v.rate==='hard');
  if(hard.length) out.push(`Finding ${hard.map(([d])=>d).join(', ')} too hard.`);
  const easy=Object.entries(p.flags||{}).filter(([,v])=>v.rate==='easy');
  if(easy.length) out.push(`${easy.map(([d])=>d).join(', ')} marked too easy — room to progress.`);

  if(a.sinceLast!==null&&a.sinceLast>6)
    out.push(`No session for ${a.sinceLast} days.`);
  return out;
}

function longestStreak(opens){
  if(!opens||!opens.length) return 0;
  const days=[...new Set(opens)].sort();
  let best=1, run=1;
  for(let i=1;i<days.length;i++){
    const gap=(new Date(days[i]+'T00:00:00')-new Date(days[i-1]+'T00:00:00'))/86400000;
    run = gap===1 ? run+1 : 1;
    if(run>best) best=run;
  }
  return best;
}

/* ── activity, from what is already recorded ───────────────────────
   opens[] is one ISO date per active day, kept for 180 days. sessions[]
   holds up to 200, each with planned and actual minutes. Neither needed
   any new instrumentation — the app has been collecting both all along
   and showing three numbers. */
function dayKey(d){ return new Date(d).toISOString().slice(0,10); }
/* Hours are the right unit for the first day or two, which is the window
   Elliott answers in. Past that they stop meaning anything: a declined
   application read "400h ago" rather than seventeen days. */
function since(at){
  const h=Math.max(0,Math.round((Date.now()-(at||0))/3600000));
  if(h<48) return h+'h ago';
  const d=Math.round(h/24);
  if(d<14) return d+' days ago';
  const w=Math.round(d/7);
  return w<9 ? w+' weeks ago' : Math.round(d/30)+' months ago';
}

let rosterFilter='all';
let calOff=0;      /* months back from this one */
let calDay=null;   /* the ISO date being inspected */

/* The shared four-week panel is right for a client looking at their own
   habit. A coach needs to go back through the block and ask what happened
   on a particular day, which is a different question. */
/* "11 sessions · 5h 52m" — the header line from the design */
function monthStats(byDay,y,m){
  const pre=`${y}-${String(m+1).padStart(2,'0')}`;
  const days=Object.keys(byDay).filter(k=>k.slice(0,7)===pre);
  const n=days.reduce((t,k)=>t+byDay[k].length,0);
  const mins=days.reduce((t,k)=>t+byDay[k].reduce((a,x)=>a+(x.actual||x.mins||0),0),0);
  if(!n) return 'Nothing logged';
  const h=Math.floor(mins/60), mm=mins%60;
  return `${n} session${n===1?'':'s'} · ${h?h+'h ':''}${mm}m`;
}

/* what a day's sessions actually got through, as drills done over drills set */
function dayParts(list){
  let got=0, of=0;
  (list||[]).forEach(x=>{
    (x.items||[]).forEach(it=>{
      const o=Number(it.of)||0;
      if(!o) return;
      of+=o; got+=Math.min(o, Number(it.got)||0);
    });
  });
  return {got, of};
}
function dayCompletion(list){
  const t=dayParts(list);
  if(t.of) return Math.max(0, Math.min(1, t.got/t.of));
  /* older sessions carry no per-drill detail, so fall back to the flag */
  return (list||[]).some(x=>x.done) ? 1 : 0;
}

/* Which way they trained. The follow-along player sent no mode at all until
   now, so anything without one is the player: that is the only thing it can
   have been. */
const HOW_LABEL={ player:'Follow along', list:'Drill by drill', ticks:'Ticked off',
                  checkin:'Said so', plan:'Opened the plan' };
const HOW = x => HOW_LABEL[x && x.mode] || (x && x.mode ? x.mode : 'Follow along');

function coachCalendar(email){
  const p=prog[email]||{};
  const opens=new Set(p.opens||[]);
  const sess=(p.sessions||[]).filter(x=>x&&x.at);
  const iso=d=>new Date(d).toISOString().slice(0,10);
  const byDay={};
  sess.forEach(x=>{ (byDay[iso(x.at)]=byDay[iso(x.at)]||[]).push(x); });

  const now=new Date(); now.setDate(1);
  now.setMonth(now.getMonth()-calOff);
  const y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const lead=(first.getDay()+6)%7;                 /* Monday-first */
  const title=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});

  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<div></div>');
  for(let dnum=1;dnum<=last.getDate();dnum++){
    const k=iso(new Date(y,m,dnum,12));
    const on=opens.has(k), did=(byDay[k]||[]).length;
    const done=(byDay[k]||[]).some(x=>x.done);
    /* how much of the session they actually got through. Missing one drill
       out of eight is worth knowing and is not a failure — the calendar was
       painting it the same red as never starting. */
    const pc=dayCompletion(byDay[k]||[]);
    const partsTip=(()=>{
      const t=dayParts(byDay[k]||[]);
      return t.of ? t.got+' of '+t.of+' drills' : '';
    })();
    const isSel=calDay===k;
    const future=new Date(y,m,dnum)>new Date();
    const tip = done ? ('Finished the session'+(partsTip?', '+partsTip:'')+'. Click for detail')
      : did ? ((partsTip||'Started a session')+'. Click to see which')
      : on ? 'Opened the app, no session logged'
      : future ? '' : 'Nothing';
    /* the design's squares: shading says what kind of day it was, the bar

/* How often they are actually in the app, not just whether they were. An

let visitsBy={};
const visitsFor = e => visitsBy[e] || {};
function visitMins(v){
  if(!v || !v.ms) return '';
  const m=Math.round(v.ms/60000);
  return m>=1 ? ', '+m+' min' : ', under a minute';
}
function monthVisitLine(email, month){
  const v=visitsFor(email);
  let n=0, ms=0;
  Object.keys(v).forEach(d=>{ if(d.slice(0,7)===month){ n+=v[d].n||0; ms+=v[d].ms||0; } });
  if(!n) return '';
  const m=Math.round(ms/60000);
  return ' · '+n+' visit'+(n===1?'':'s')+(m?', '+m+' min in total':'');
}

/* what actually happened on one day, in the client's own words where

/* panelMonth lived here. coachCalendar replaced it — a coach needs to
   page back through months, which the client's fixed four weeks cannot. */

/* ── how much, and how long ────────────────────────────────────────
   The dashboard counted sessions, minutes and days on the app, and never
   once said how much work was in them. The client's sessions carry a row
   per drill with what one set asked for and how many sets were finished,
   so the reps and the seconds are already there to be added up. Kept
   apart, because a rep and a second are different things. */
const MONDAY = t => { const d=new Date(t); const w=(d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-w); return d.getTime(); };
function volumeBetween(p, from, to){
  const ss=((p&&p.sessions)||[]).filter(s=>s && (s.at||0)>=from && (s.at||0)<(to||Infinity));
  let reps=0, secs=0, sets=0, mins=0;
  const drills=new Set();
  ss.forEach(s=>{
    mins += Number(s.actual)||Number(s.mins)||0;
    (s.items||[]).forEach(it=>{
      const n=Number(it.reps)||0;
      sets += Number(it.got)||0;
      if(it.v && (Number(it.got)||0)) drills.add(it.v);
      if(!n) return;
      if(it.unit==='s') secs+=n; else reps+=n;
    });
  });
  return {reps, secs, sets, mins, drills:drills.size, sessions:ss.length};
}
function appTimeBetween(v, from, to){
  let ms=0, opens=0, days=0;
  Object.keys(v||{}).forEach(k=>{
    const t=new Date(k+'T12:00:00').getTime();
    if(t<from || (to && t>=to)) return;
    const d=v[k]||{}; ms+=Number(d.ms)||0; opens+=Number(d.n)||0; days++;
  });
  return {ms, opens, days};
}
function hm(ms){
  const m=Math.round((ms||0)/60000);
  if(m<1) return ms>0?'<1m':'0m';
  if(m<60) return m+'m';
  return Math.floor(m/60)+'h '+(m%60?(m%60)+'m':'');
}
function mmss(s){ s=Math.round(s||0);
  if(s<60) return s+'s';
  const m=Math.floor(s/60); return m+'m'+(s%60?' '+(s%60)+'s':''); }
/* eight weeks of both, newest last */
/* ── the progress photos ───────────────────────────────────────────
   The client can take a side, front and back shot, they upload, and the
   whole record reached the server and stopped there. The only mention of
   photos anywhere in this dashboard was in the wording of the button that

const PHOTO_VIEWS=[['side','Side on'],['front','Front on'],['back','From behind']];
function panelPhotos(email){

  const first=shots[0], last=shots[shots.length-1];
  const gap=(first&&last&&first!==last)
    ? Math.round(((last.at||0)-(first.at||0))/864e5) : 0;
  const tabs=PHOTO_VIEWS.map(([v,l])=>{
    const n=all.filter(p=>(p.view||'side')===v).length;
    return `<button onclick="photoView['${esc(email)}']='${v}';draw()"
      style="flex:1;border:0;cursor:${n?'pointer':'default'};border-radius:10px;padding:9px 6px;

    :`<div style="font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:12px">
      Nothing from this angle yet.</div>`}

let photoView={};

function panelVolume(p, email){
  const thisWk=MONDAY(Date.now()), wks=[];
  for(let i=7;i>=0;i--){
    const from=thisWk-i*7*864e5, to=from+7*864e5;

  const appNow=now.app, appWas=(wks[wks.length-2]||{app:{ms:0}}).app;
  const stat=(v,l,s)=>`<div style="flex:1;min-width:74px">
    <div style="font:600 9.5px/1 var(--sans);letter-spacing:.1em;color:var(--grey2)">${l}</div>
    <div class="h-sm" style="font-size:21px;margin-top:6px">${v}</div>
