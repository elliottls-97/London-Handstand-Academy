<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A free call · London Handstand Academy</title>
<link rel="canonical" href="https://londonhandstandacademy.com/call.html">
<meta name="description" content="A free 15 minute video call with Elliott Staley: tell him what you are stuck on and he will tell you which kind of training you actually need.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* The free call and the welcome call, booked here rather than in Calendly:
   pick a time from Elliott's free ones, in your own time zone, and the
   link to join comes by email. The same page moves or cancels a call from
   the link in that email. With booking here switched off, it sends you on
   to Calendly as before. */
:root{--bg:#f4f4f5;--forest:#006663;--deep:#00403d;--ink:#111111;--sand:#cfe6ec;--terra:#a4503c;
 --grey:#5c6660;--grey2:#8a8f8c;--line:rgba(17,17,17,.12);
 --serif:Newsreader,Georgia,serif;--sans:Figtree,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.6 var(--sans)}
.wrap{max-width:620px;margin:0 auto;padding:28px 20px 90px}
.brand{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--forest);text-decoration:none}
.kick{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--forest);margin-top:34px}
h1{font:400 40px/1.04 var(--serif);letter-spacing:-.015em;margin:10px 0 0;text-wrap:balance}
p{margin:14px 0 0;max-width:60ch}
.muted{color:var(--grey)}
.card{margin:16px 0 0;padding:20px;border-radius:22px;background:#fff;box-shadow:0 18px 40px -26px rgba(28,32,25,.5)}
label{display:block;font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--grey2);margin:16px 0 6px}
label:first-child{margin-top:0}
input,textarea{width:100%;min-height:48px;padding:12px 14px;font:400 16px/1.4 var(--sans);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--forest);outline-offset:0;border-color:var(--forest)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:16px;min-height:56px;border:0;border-radius:16px;cursor:pointer;text-align:center;padding:0 14px;
 background:linear-gradient(180deg,#0a7a76,#006663);color:#f7f4f1;font:600 17px/1.2 var(--sans);box-shadow:0 12px 30px rgba(0,102,99,.3);text-decoration:none}
.btn:disabled{opacity:.6;cursor:default}
.ghost{display:block;width:100%;margin-top:14px;border:1px solid var(--line);background:#fff;border-radius:16px;min-height:52px;cursor:pointer;font:600 15px/1 var(--sans);color:var(--terra)}
.ghost:disabled{opacity:.6;cursor:default}
.msg{font:500 13.5px/1.5 var(--sans);color:var(--terra);margin-top:10px;min-height:20px}
.fine{font:400 12.5px/1.6 var(--sans);color:var(--grey2);margin-top:12px}
.fine a{color:var(--deep);font-weight:600}
.zone{font:400 13px/1.5 var(--sans);color:var(--grey);margin:8px 0 0}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:64px;padding:10px 10px 9px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:center;font:inherit;color:inherit}
.day b{display:block;font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--grey2)}
.day span{display:block;font:400 22px/1.1 var(--serif);margin-top:5px}
.day.on{border-color:var(--forest);background:rgba(0,102,99,.06)}.day.on b{color:var(--forest)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.time{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:600 15px/1 var(--sans);color:var(--ink)}
.time.on{border-color:var(--forest);background:var(--forest);color:#fff}
.when{font:400 20px/1.4 var(--sans);color:var(--ink);margin:16px 0 0}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.row b{font:400 24px/1.1 var(--serif)}.row span{font:400 13.5px/1.4 var(--sans);color:var(--grey)}
.links a{color:var(--forest);font-weight:600}
.done{text-align:center;padding:30px 0 10px}
.done .tick{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:rgba(0,102,99,.1);color:var(--forest);font-size:30px}
.foot{font:400 12.5px/1.6 var(--sans);color:var(--grey2);margin-top:30px}.foot a{color:var(--forest)}
@media (max-width:520px){h1{font-size:33px}.wrap{padding:22px 16px 80px}}
.linkb{display:inline;border:0;background:none;padding:0;margin-top:14px;cursor:pointer;font:600 13.5px/1.5 var(--sans);color:var(--forest);text-decoration:underline;text-underline-offset:3px;text-align:left}
</style><link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
</head><body>
<div class="wrap">
  <a class="brand" href="/">London Handstand Academy</a>
  <div id="s"><p class="muted">Finding the free times…</p></div>
</div>
<script>
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const q=new URLSearchParams(location.search);
  const mtok=q.get('m')||'';
  const box=document.getElementById('s');
  const beacon=n=>{ try{ navigator.sendBeacon('/api/app/event', JSON.stringify({n})); }catch(e){} };
  const MAIL='<a href="mailto:info@londonhandstandacademy.com">info@londonhandstandacademy.com</a>';
  const CALENDLY='https://calendly.com/londonhandstandacademy-info/intro-call';
  /* the visitor's own time zone; London's beside it when it differs */
  const TZ=(()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/London'; }catch(e){ return 'Europe/London'; } })();
  const LON='Europe/London';
  const dayKey=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:TZ});
  const clockIn=(t,z)=>new Date(t).toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:z}).replace(':00','').replace(/\s/g,'').toLowerCase();
  const clock=t=>clockIn(t,TZ);
  const dayShort=t=>new Date(t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:TZ});
  const dayLong=t=>new Date(t).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:TZ});
  const whenTxt=t=>dayLong(t)+', '+clock(t)+(TZ!==LON&&clockIn(t,LON)!==clock(t)?' ('+clockIn(t,LON)+' in London)':'');
  const zoneName=()=>TZ.replace(/_/g,' ').split('/').pop();
  const zoneLine=()=>'<p class="zone">Times are in your time zone'+(TZ===LON?' (London)':', '+esc(zoneName())+'. Elliott is in London.')+'</p>';
  const done=(head,lines,cta)=>{ box.innerHTML='<div class="done"><div class="tick">&#10003;</div><h1 style="font-size:34px;margin-top:18px">'+head+'</h1>'
    +lines.map(l=>'<p style="margin:14px auto 0;max-width:42ch;text-align:center">'+l+'</p>').join('')
    +(cta?'<a class="btn" href="'+esc(cta[0])+'" style="max-width:360px;margin:22px auto 0">'+cta[1]+'</a>':'')+'</div>'; };
  function pickerHTML(slots,day,sel){
    const days=[...new Set(slots.map(dayKey))];
    const times=slots.filter(t=>dayKey(t)===day);
    return '<div class="days">'+days.map(k=>{ const t=slots.find(x=>dayKey(x)===k);
        return '<button type="button" class="day'+(k===day?' on':'')+'" data-day="'+k+'"><b>'+esc(new Date(t).toLocaleDateString('en-GB',{weekday:'short',timeZone:TZ}))+'</b><span>'
          +esc(new Date(t).toLocaleDateString('en-GB',{day:'numeric',timeZone:TZ}))+'</span><b style="margin-top:4px">'+esc(new Date(t).toLocaleDateString('en-GB',{month:'short',timeZone:TZ}))+'</b></button>'; }).join('')+'</div>'
      +'<div class="times">'+times.map(t=>'<button type="button" class="time'+(t===sel?' on':'')+'" data-t="'+esc(t)+'">'+esc(clock(t))+'</button>').join('')+'</div>';
  }
  const wire=(onDay,onTime)=>{ box.querySelectorAll('.day').forEach(b=>{ b.onclick=()=>onDay(b.getAttribute('data-day')); });
    box.querySelectorAll('.time').forEach(b=>{ b.onclick=()=>onTime(b.getAttribute('data-t')); }); };
  const linksHTML=c=>'<div class="links" style="margin-top:12px;font:400 14px/1.6 var(--sans)">'
    +(c.link?'<a href="'+esc(c.link)+'" target="_blank" rel="noopener">The link to join'+(c.linkName?', on '+esc(c.linkName):'')+'</a> &middot; ':'')
    +'<a href="'+esc(c.ics)+'">Add to calendar</a> &middot; <a href="'+esc(c.gcal)+'" target="_blank" rel="noopener">Google Calendar</a></div>';

  /* ── moving or cancelling, from the link in the email ── */
  if(mtok){
    let d=null, day='', sel='', busy=false;
    const post=body=>{ body.t=mtok; return fetch('/api/app/call/manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(r=>r.json().then(x=>r.ok?x:Promise.reject(x))); };
    const again=()=>d&&d.kind==='welcome'?['/lha-app.html','Open the app']:['/call.html','Book another time'];
    const head=()=>'<div class="kick">Your '+(d.kind==='welcome'?'welcome call':'free call')+'</div><h1>'+esc(d.len)+' minutes with Elliott.</h1>'
      +'<div class="when">'+esc(whenTxt(d.when))+'</div>';
    const draw=note=>{
      if(d.status==='cancelled'){ box.innerHTML=head()+'<div class="card"><b>This call is cancelled.</b> <a href="'+again()[0]+'" style="color:var(--forest)">'+again()[1]+'</a>.</div>'; return; }
      if(!d.live){ box.innerHTML=head()+'<div class="card"><b>This call has happened.</b> Questions? '+MAIL+'</div>'; return; }
      const slots=d.slots;
      if(slots&&slots.length&&!slots.some(t=>dayKey(t)===day)) day=dayKey(slots[0]);
      box.innerHTML=head()+zoneLine()
        +'<div class="card"><div class="row"><b>When it is time</b></div>'+linksHTML(d)+'</div>'
        +(slots&&slots.length?'<div class="card"><div class="row"><b>Move it</b><span>Another free time</span></div>'+pickerHTML(slots,day,sel)
          +(sel?'<button class="btn" id="mv">Move it to '+esc(dayShort(sel))+', '+esc(clock(sel))+'</button>':'')+'<div class="msg" id="mmsg">'+(note||'')+'</div></div>'
          :'<div class="card"><div class="row"><b>Move it</b></div><p class="muted" style="font-size:14.5px">No other time is free just now. Cancel it and book again later, or email '+MAIL+'.</p></div>')
        +'<div class="card"><div class="row"><b>Cancel it</b></div><p class="muted" style="font-size:14.5px">Elliott is told, and the time is free for somebody else.</p>'
        +'<button class="ghost" id="cx">Cancel my call</button><div class="msg" id="cmsg"></div></div>'
        +'<div class="foot">Questions? '+MAIL+'</div>';
      wire(k=>{ day=k; sel=''; draw(); },t=>{ sel=t; draw(); });
      const lock=on=>{ busy=on; box.querySelectorAll('button').forEach(b=>{ b.disabled=on; }); };
      const mv=document.getElementById('mv');
      if(mv) mv.onclick=()=>{ if(busy) return; lock(true); document.getElementById('mmsg').textContent='Moving…';
        post({action:'move',slot:sel}).then(r=>done('Your call has moved.',['It is now on <b>'+esc(whenTxt(r.call.when))+'</b>.','The new time, and a calendar file, are on their way by email.']))
          .catch(e=>{ lock(false); if(e&&e.gone) return load('That time has just gone. Pick another.'); document.getElementById('mmsg').textContent=String((e&&e.error)||'Something went wrong'); }); };
      const cx=document.getElementById('cx');
      cx.onclick=()=>{ if(cx.dataset.sure!=='1'){ cx.dataset.sure='1'; cx.textContent='Yes, cancel it'; return; }
        if(busy) return; lock(true); document.getElementById('cmsg').textContent='Cancelling…';
        post({action:'cancel'}).then(()=>done('Your call is cancelled.',['Elliott has been told.'],again()))
          .catch(e=>{ lock(false); document.getElementById('cmsg').textContent=String((e&&e.error)||'Something went wrong'); }); };
    };
    const load=note=>fetch('/api/app/call/manage?t='+encodeURIComponent(mtok)).then(r=>r.json().then(x=>r.ok?x:Promise.reject(x)))
      .then(x=>{ d=x; sel=''; draw(note); }).catch(e=>{ box.innerHTML='<div class="kick">Your call</div><p>'+esc(String((e&&e.error)||'This could not be loaded.'))+' Questions? '+MAIL+'</p>'; });
    load('');
    return;
  }

  /* ── booking the free call ── */
  beacon('sitecall');
  let slots=[], day='', slot='', busy=false, asking=false;
  /* asked when they book, so the fifteen minutes go on them */
  const ABOUT=[['work','What do you want to work on?','Your handstand, press, a skill, or something that keeps going wrong'],
    ['goals','What are your goals?','Where you would like to be in a few months'],
    ['history','What is your training history?','What you have trained before, for how long, and how often you train now']];
  const aboutFields=()=>ABOUT.map(([k,l,ph])=>'<label for="ab-'+k+'">'+esc(l)+'</label><textarea id="ab-'+k+'" placeholder="'+esc(ph)+'"></textarea>').join('');
  const aboutRead=()=>{ const a={}; ABOUT.forEach(([k])=>{ const el=document.getElementById('ab-'+k); if(el&&el.value.trim()) a[k]=el.value.trim(); }); return a; };
  const draw=()=>{
    const kept=['nm','em','pf'].concat(ABOUT.map(([k])=>'ab-'+k)).map(id=>{ const el=document.getElementById(id); return [id,el?el.value:'']; });
    const ask=asking||!slots.length;
    if(!slots.some(t=>dayKey(t)===day)) day=slots.length?dayKey(slots[0]):'';
    if(slot&&!slots.includes(slot)) slot='';
    box.innerHTML='<div class="kick">Free call · 15 minutes</div><h1>Fifteen minutes, free.</h1>'
      +'<p>Tell me what you are stuck on. I will tell you which way of training with me you actually need, including if the answer is none of them yet.</p>'
      +(!ask?'<div class="card"><label>Pick a time</label>'+pickerHTML(slots,day,slot)+zoneLine()
        +'<button class="linkb" id="none">None of these work? Ask for another time</button></div>'
        :'<div class="card"><div class="row"><b>Ask for another time</b></div><p class="muted" style="font-size:14.5px">'
          +(slots.length?'Say what suits you and Elliott will find a time.':'No free times in the next few weeks. Say what suits you and Elliott will find one.')+'</p>'
          +'<label for="pf">Days and times that suit you</label><textarea id="pf" placeholder="Weekday evenings after 6, or Saturday mornings."></textarea>'+zoneLine()+'</div>')
      +'<div class="card">'
        +'<label for="nm">Your name</label><input id="nm" autocomplete="name" placeholder="First and last">'
        +'<label for="em">Email</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com">'
        +'<p class="muted" style="font-size:14.5px;margin-top:18px">So the call goes on you. Write as much or as little as you like.</p>'
        +aboutFields()
        +(ask?'<button class="btn" id="go">Ask for a time</button>'
          :'<button class="btn" id="go"'+(slot?'':' disabled')+'>'+(slot?'Book the call, '+esc(dayShort(slot))+', '+esc(clock(slot)):'Pick a time above')+'</button>')
        +'<div class="msg" id="msg"></div>'
        +'<div class="fine">'+(ask?'Elliott comes back with a time within 48 hours, by email, with the link to join. ':'A video call. The link to join comes by email, with a calendar file, and a reminder the day before. ')
        +'How we use your details: <a href="/privacy" target="_blank" rel="noopener">privacy</a>.</div>'
        +(ask&&slots.length?'<button class="linkb" id="back">Back to the free times</button>':'')+'</div>'
      +'<div class="foot">Questions? '+MAIL+'</div>';
    kept.forEach(([id,v])=>{ const el=document.getElementById(id); if(el&&v) el.value=v; });
    wire(k=>{ day=k; slot=''; draw(); },t=>{ slot=t; draw(); });
    const none=document.getElementById('none'); if(none) none.onclick=()=>{ asking=true; slot=''; draw(); const p=document.getElementById('pf'); if(p) p.focus(); };
    const bk=document.getElementById('back'); if(bk) bk.onclick=()=>{ asking=false; draw(); };
    const go=document.getElementById('go');
    if(!go) return;
    if(ask){ go.onclick=()=>{
      const name=(document.getElementById('nm').value||'').trim(), email=(document.getElementById('em').value||'').trim(), prefs=(document.getElementById('pf').value||'').trim();
      const msg=document.getElementById('msg');
      if(!prefs){ msg.textContent='Say which days and times suit you.'; return; }
      if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent='Your name and a real email address, please.'; return; }
      if(busy) return; busy=true; go.disabled=true; go.textContent='Sending…'; msg.textContent='';
      fetch('/api/app/call/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,prefs,about:aboutRead(),tz:TZ})})
        .then(r=>r.json().then(d=>r.ok?d:Promise.reject(d)))
        .then(()=>{ beacon('sitecallasked'); done('Asked.',['Elliott comes back to you with a time within 48 hours.','It comes by email to '+esc(email)+', with the link to join.']); })
        .catch(e=>{ busy=false; if(e&&e.off){ location.replace(CALENDLY); return; }
          go.disabled=false; go.textContent='Ask for a time'; msg.textContent=String((e&&e.error)||'Something went wrong'); }); };
      return; }
    go.onclick=()=>{
      const name=(document.getElementById('nm').value||'').trim(), email=(document.getElementById('em').value||'').trim(), about=aboutRead();
      const msg=document.getElementById('msg');
      if(!slot){ msg.textContent='Pick a time first.'; return; }
      if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent='Your name and a real email address, please.'; return; }
      if(busy) return; busy=true; go.disabled=true; go.textContent='Booking…'; msg.textContent='';
      fetch('/api/app/call/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'intro',slot,name,email,about,tz:TZ,src:q.get('from')||'site'})})
        .then(r=>r.json().then(d=>r.ok?d:Promise.reject(d)))
        .then(d=>{ beacon('sitecallbooked'); const c=d.call;
          box.innerHTML='';
          done('Booked.',['Your call is on <b>'+esc(whenTxt(c.when))+'</b>.','The link to join, and a calendar file, are on their way to '+esc(email)+'.'+(c.link?'':' ')]);
          box.querySelector('.done').insertAdjacentHTML('beforeend','<div style="text-align:center">'+linksHTML(c)+'</div>'); })
        .catch(e=>{ busy=false;
          if(e&&e.already&&e.call){ box.innerHTML='<div class="kick">Free call</div><h1>You already have one.</h1><div class="when">'+esc(whenTxt(e.call.when))+'</div>'
            +'<div class="card">'+linksHTML(e.call)+'<a class="btn" href="'+esc(e.call.manage)+'">Move or cancel it</a></div>'; return; }
          /* the call itself is only ever told to its own inbox */
          if(e&&e.already){ box.innerHTML='';
            done('You already have one.',[esc(String(e.error||'The link to it has been sent to your inbox again.'))]); return; }
          if(e&&e.gone){ slot=''; return load().then(()=>{ const m=document.getElementById('msg'); if(m) m.textContent=String(e.error); }); }
          if(e&&e.off){ location.replace(CALENDLY); return; }
          go.disabled=false; go.textContent='Book the call, '+dayShort(slot)+', '+clock(slot); msg.textContent=String((e&&e.error)||'Something went wrong'); });
    };
  };
  /* off here, or the calendars unreadable: Calendly, as before */
  const load=()=>fetch('/api/app/call/slots?kind=intro').then(r=>r.json()).then(d=>{
    if(!d||!d.open){ location.replace((d&&d.calendly)||CALENDLY); return; }
    slots=d.slots||[]; draw(); }).catch(()=>{ location.replace(CALENDLY); });
  load();
})();
</script>
<footer style="max-width:640px;margin:36px auto 28px;padding:0 20px;text-align:center;font-size:13px;color:#686868">London Handstand Academy · <a href="/" style="color:inherit">Home</a> · <a href="/terms" style="color:inherit">Terms</a> · <a href="/privacy" style="color:inherit">Privacy</a> · <a href="/support" style="color:inherit">Help</a></footer>

</body></html>
