<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Fix preview · London Handstand Academy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* What a fix looks like, on its own, so the shape of one can be worked on
   without the app around it. Reads a live fix by ?slug=, or a draft posted
   in from the dashboard editor while it is being written. */
:root{--bg:#f4f4f5;--forest:#006663;--deep:#00403d;--ink:#111111;--sand:#cfe6ec;--amber:#f3a949;--on-primary:#f7f4f1;
 --grey:#5c6660;--grey2:#8a8f8c;--mist:#e6e3de;--serif:Newsreader,Georgia,serif;--sans:Figtree,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#dcdad6;color:var(--ink);font:400 16px/1.5 var(--sans)}
.phone{width:100%;max-width:420px;min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.pad{padding:0 20px}
.hero{position:relative;aspect-ratio:4/3;background:#11150f;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55))}
.hero .over{position:absolute;left:20px;right:20px;bottom:18px;color:#fff}
.kick{font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--forest)}
.hero .kick{color:rgba(255,255,255,.8)}
h1{font:400 34px/1.05 var(--serif);letter-spacing:-.015em;margin:8px 0 0}
.tag{font:400 15px/1.5 var(--sans);color:var(--grey);margin-top:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:8px 11px;border-radius:999px;background:#fff;border:1px solid rgba(0,64,61,.12);color:var(--deep)}
.chip.set{background:var(--forest);color:var(--on-primary);border-color:var(--forest)}
.start{margin-top:16px;height:62px;border-radius:18px;background:linear-gradient(180deg,#0a7a76,#006663);color:var(--on-primary);
 display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 22px;font:600 18px/1.15 var(--sans);box-shadow:0 12px 30px rgba(0,102,99,.3)}
.start i{width:44px;height:44px;border-radius:50%;background:var(--on-primary);display:grid;place-items:center}
.link{display:block;width:100%;background:none;border:0;font:500 13.5px/1.4 var(--sans);color:var(--forest);padding:8px;text-align:center}
.clip{margin-top:14px;padding:14px 16px;border-radius:16px;background:#fff;border:1px dashed rgba(0,64,61,.3)}
.clip b{display:block;font:600 14.5px/1.3 var(--sans)}.clip span{display:block;font:400 13px/1.45 var(--sans);color:var(--grey);margin-top:3px}
h2{font:400 26px/1.15 var(--serif);letter-spacing:-.01em;margin:26px 0 8px}
p{font:400 16px/1.6 var(--sans);margin:0 0 14px;white-space:pre-wrap}
blockquote{margin:18px 0;padding:4px 0 4px 16px;border-left:3px solid var(--forest);font:400 20px/1.35 var(--serif);color:var(--deep)}
figure{margin:16px 0}figure img,figure video{width:100%;border-radius:18px;display:block;background:#11150f}
figure .frame{border-radius:18px;overflow:hidden;background:#000;aspect-ratio:16/9}figure iframe{display:block;width:100%;height:100%;border:0}
figcaption{font:400 12.5px/1.5 var(--sans);color:var(--grey);margin-top:7px}
.drills{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.drill{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px 8px 8px}
.drill .th{width:72px;height:44px;border-radius:9px;background:#000;overflow:hidden;flex:none}.drill .th img{width:100%;height:100%;object-fit:cover}
.drill b{display:block;font:600 14px/1.25 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drill span{display:block;font:400 12px/1.3 var(--sans);color:var(--grey2);margin-top:3px}
.sub{font:400 13px/1.5 var(--sans);color:var(--grey);margin-top:6px}
.empty{padding:60px 20px;text-align:center;color:var(--grey)}
.note{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--deep);color:#fff;border-radius:999px;padding:8px 14px;font:600 11.5px/1 var(--sans);opacity:.9}
</style></head><body>
<div class="phone" id="p"><div class="empty">Waiting for a fix. Open this from the dashboard editor, or add ?slug=the-fix to the address.</div></div>
<div class="note" id="note" hidden></div>
<script>
const STREAM='https://customer-pns1oongdltmkjwa.cloudflarestream.com/';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb=uid=>uid?STREAM+uid+'/thumbnails/thumbnail.jpg?time=3s&height=320':'';
const uidOf=u=>{ const m=/\/([a-f0-9]{32})\//.exec(String(u||'')); return m?m[1]:''; };
const dose=d=>{ const sets=Number(d.sets), amt=Number(d.amt);
  if(Number.isFinite(amt)&&amt>0) return (Number.isFinite(sets)&&sets>=1?Math.round(sets)+' x ':'')+Math.round(amt)+(d.unit==='s'?'s':'');
  return d.d||''; };
function block(b){
  if(!b) return '';
  if(b.t==='h') return `<h2>${esc(b.text)}</h2>`;
  if(b.t==='p') return `<p>${esc(b.text)}</p>`;
  if(b.t==='quote') return `<blockquote>${esc(b.text)}</blockquote>`;
  if(b.t==='img'&&b.id) return `<figure><img src="/api/app/image/${esc(b.id)}" alt="">${b.cap?`<figcaption>${esc(b.cap)}</figcaption>`:''}</figure>`;
  if(b.t==='vid'&&b.uid) return `<figure><div class="frame"><iframe src="${STREAM}${esc(b.uid)}/iframe?preload=metadata" allow="fullscreen" loading="lazy"></iframe></div>${b.cap?`<figcaption>${esc(b.cap)}</figcaption>`:''}</figure>`;
  if(b.t==='drill'&&b.v) return `<figure>${b.url?`<video src="${esc(b.url)}" controls playsinline loop muted poster="${thumb(uidOf(b.url))}" style="aspect-ratio:16/10;object-fit:contain"></video>`:''}
    <figcaption><b style="color:var(--ink)">${esc(b.n||b.v)}</b>${b.cap?` · ${esc(b.cap)}`:''}</figcaption></figure>`;
  return '';
}
function draw(f){
  const cover=(f.cover&&f.cover.uid)?thumb(f.cover.uid):(f.cover&&f.cover.img)?'/api/app/image/'+f.cover.img
    :((f.drills||[]).find(d=>d.url)?thumb(uidOf((f.drills||[]).find(d=>d.url).url)):'');
  const drills=(f.drills||[]);
  document.getElementById('p').innerHTML=`
    <div class="hero">${cover?`<img src="${esc(cover)}" alt="">`:''}<div class="shade"></div>
      <div class="over"><div class="kick">${f.live?'A fix':'A fix · draft'}${f.access==='free'?' · free':''}</div></div></div>
    <div class="pad" style="padding-top:18px">
      <h1>${esc(f.name||'Untitled fix')}</h1>
      ${f.tag?`<div class="tag">${esc(f.tag)}</div>`:''}
      <div class="chips"><span class="chip">${esc(f.weeks||4)} weeks</span><span class="chip">${esc(f.perWeek||3)} a week</span><span class="chip">${esc(f.mins||20)} min</span><span class="chip ${f.set?'set':''}">${f.set?'Set workout':'Rotates'}</span></div>
      ${f.goal?`<div class="sub" style="margin-top:14px;color:var(--ink)"><span class="kick">In ${esc(f.weeks||4)} weeks</span><br>${esc(f.goal)}</div>`:''}
      <div class="start"><span>Start the first session</span><i><svg width="16" height="18" viewBox="0 0 17 19" fill="#006663"><path d="M16 8.63a1 1 0 0 1 0 1.74L1.5 18.6A1 1 0 0 1 0 17.73V1.27A1 1 0 0 1 1.5.4z"/></svg></i></div>
      <div class="link">See the drills first</div>
      <div class="clip"><b>${esc((f.start&&f.start.n)||'Film it before you start')}</b><span>${esc((f.start&&f.start.note)||'So you can see the difference in four weeks. Elliott sees it too.')}</span></div>
      ${(f.article||[]).map(block).join('')}
      ${drills.length?`<h2 style="font-size:24px">The drills.</h2>
        <div class="sub">${f.set?drills.length+' drills, in this order, the same every time.':drills.length+' in the pool. A session takes six to ten and starts further down each time.'}</div>
        <div class="drills">${drills.map(d=>`<div class="drill"><div class="th">${d.url?`<img src="${thumb(uidOf(d.url))}" alt="">`:''}</div>
          <div style="flex:1;min-width:0"><b>${esc(d.n||d.v)}</b><span>${esc(d.g||'')}${d.g?' · ':''}level ${esc(d.L||1)}${dose(d)?' · '+esc(dose(d)):''}${d.r!=null?' · rest '+esc(d.r)+'s':''}</span></div></div>`).join('')}</div>`:''}
      ${(f.warmDrills||f.warm||[]).length?`<div class="sub" style="margin-top:14px"><span class="kick">Warm-up</span><br>${(f.warmDrills||f.warm).map(w=>esc(w.n||w.v||w)).join(', ')}</div>`:''}
      <div class="clip" style="margin-top:22px"><b>${esc((f.finish&&f.finish.n)||'Film it again')}</b><span>${esc((f.finish&&f.finish.note)||'Same angle as before. Put the two side by side.')}</span></div>
      <div style="height:60px"></div>
    </div>`;
}
const say=t=>{ const n=document.getElementById('note'); n.textContent=t; n.hidden=!t; };
window.addEventListener('message',e=>{ if(e.origin!==location.origin) return; const d=e.data||{};
  if(d.type==='lha-fix-draft' && d.fix){ draw(d.fix); say('Draft, as it is in the editor'); } });
const slug=new URLSearchParams(location.search).get('slug');
if(slug){ fetch('/api/app/fixes').then(r=>r.json()).then(d=>{ const f=(d.fixes||{})[slug]; if(f) draw(f); else say('No live fix called '+slug); }).catch(()=>say('Could not load the fixes')); }
</script></body></html>
