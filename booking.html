<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your booking · London Handstand Academy</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Cancel or move your workshop place.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* One place, from the link in the confirmation or the reminder: move it to
   another date, or cancel it. No sign in; the link is the key, and it runs
   out after the class. */
:root{--bg:#f4f4f5;--forest:#006663;--deep:#00403d;--ink:#111111;--sand:#cfe6ec;--amber:#f3a949;--terra:#a4503c;
 --grey:#5c6660;--grey2:#8a8f8c;--mist:#e6e3de;--line:rgba(17,17,17,.12);
 --serif:Newsreader,Georgia,serif;--sans:Figtree,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.6 var(--sans)}
.wrap{max-width:620px;margin:0 auto;padding:28px 20px 90px}
.brand{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--forest);text-decoration:none}
.kick{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--forest);margin-top:34px}
h1{font:400 40px/1.04 var(--serif);letter-spacing:-.015em;margin:10px 0 0;text-wrap:balance}
.when{font:400 20px/1.4 var(--sans);color:var(--ink);margin:16px 0 0}
.meta{font:400 15px/1.6 var(--sans);color:var(--grey);margin:6px 0 0}
p{margin:14px 0 0;max-width:62ch;white-space:pre-wrap}
.card{margin:26px 0 0;padding:20px;border-radius:22px;background:#fff;box-shadow:0 18px 40px -26px rgba(28,32,25,.5)}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.price b{font:400 30px/1 var(--serif)}
.price span{font:400 13.5px/1.4 var(--sans);color:var(--grey)}
label{display:block;font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--grey2);margin:16px 0 6px}
input{width:100%;min-height:48px;padding:12px 14px;font:400 16px/1.4 var(--sans);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px}
input:focus{outline:2px solid var(--forest);outline-offset:0;border-color:var(--forest)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:16px;min-height:56px;border:0;border-radius:16px;cursor:pointer;
 background:linear-gradient(180deg,#0a7a76,#006663);color:#f7f4f1;font:600 17px/1 var(--sans);box-shadow:0 12px 30px rgba(0,102,99,.3)}
.btn:disabled{opacity:.6;cursor:default}
.msg{font:500 13.5px/1.5 var(--sans);color:var(--terra);margin-top:10px;min-height:20px}
.fine{font:400 12.5px/1.6 var(--sans);color:var(--grey2);margin-top:12px}
.list a{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:#fff;text-decoration:none;color:inherit;margin-top:10px}
.list .n{font:600 15px/1.3 var(--sans)}.list .m{font:400 13px/1.4 var(--sans);color:var(--grey);margin-top:3px}
.list .p{font:400 20px/1 var(--serif);color:var(--forest);white-space:nowrap}
.done{text-align:center;padding:30px 0 10px}
.done .tick{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:rgba(0,102,99,.1);color:var(--forest);font-size:30px}
.foot{font:400 12.5px/1.6 var(--sans);color:var(--grey2);margin-top:30px}.foot a{color:var(--forest)}
@media (max-width:520px){h1{font-size:33px}.wrap{padding:22px 16px 80px}}
.card .price b{font-size:24px}
.opt{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);
 font:inherit;color:inherit;text-align:left;cursor:pointer;margin-top:10px}
.opt:disabled{opacity:.5;cursor:default}
.opt .n{font:600 15px/1.3 var(--sans)}.opt .m{font:400 13px/1.4 var(--sans);color:var(--grey);margin-top:3px}
.opt i{font-style:normal;font:600 13px/1 var(--sans);color:var(--forest);white-space:nowrap}
.ghost{display:block;width:100%;margin-top:14px;border:1px solid var(--line);background:#fff;border-radius:16px;min-height:52px;cursor:pointer;font:600 15px/1 var(--sans);color:var(--terra)}
</style><link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
</head><body>
<div class="wrap">
  <a class="brand" href="/">London Handstand Academy</a>
  <div id="bk"><p style="color:var(--grey)">Loading your booking…</p></div>
</div>
<script>
(function(){
  var esc=function(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var t=new URLSearchParams(location.search).get('t')||'';
  var box=document.getElementById('bk');
  var day=function(w){ return w?new Date(w).toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit',hour12:true,timeZone:'Europe/London'}).replace(':00','').replace(/\s?([ap]m)/i,'$1').replace(' at ',', '):''; };
  var pounds=function(p){ return '£'+(p/100).toFixed(2).replace(/\.00$/,''); };
  var post=function(body){ body.t=t; return fetch('/api/app/workshop/manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(d){ return r.ok?d:Promise.reject(d.error||'Something went wrong'); }); }); };
  var done=function(head,line){ box.innerHTML='<div class="done"><div class="tick">&#10003;</div><h1 style="font-size:34px;margin-top:18px">'+head+'</h1>'
    +'<p style="margin:14px auto 0;max-width:40ch;text-align:center">'+line+' An email with the details is on its way.</p>'
    +'<p style="margin:14px auto 0;text-align:center"><a href="/handstand-class" style="color:var(--forest)">The class page</a></p></div>'; };
  function draw(d){
    var head='<div class="kick">Your booking</div><h1>'+esc(d.title)+'</h1><div class="when">'+esc(day(d.when))+'</div>'+(d.place?'<div class="meta">'+esc(d.place)+'</div>':'');
    if(d.status==='cancelled'||d.status==='refunded'){ box.innerHTML=head+'<div class="card"><b>This place is cancelled.</b>'+(d.status==='refunded'?' It was refunded.':'')+' <a href="/handstand-class#book" style="color:var(--forest)">Book another date</a>.</div>'; return; }
    if(!d.canChange){ box.innerHTML=head+'<div class="card"><b>It is less than '+d.cutoff+' hours away,</b> so it can no longer be moved or cancelled online. Can’t make it? Email <a href="mailto:info@londonhandstandacademy.com" style="color:var(--forest)">info@londonhandstandacademy.com</a> and Elliott will do what he can.</div>'; return; }
    var others=(d.others||[]);
    box.innerHTML=head
      +'<div class="card"><div class="price"><b>Move to another date</b><span>Free</span></div>'
      +(others.length?others.map(function(o){ var off=o.mine||o.left<=0;
          return '<button class="opt" data-to="'+esc(o.slug)+'"'+(off?' disabled':'')+'><span><span class="n">'+esc(day(o.when))+'</span><span class="m" style="display:block">'
            +(o.mine?'You already have this date':o.left<=0?'Full':o.left<=5?o.left+' places left':'Places available')+'</span></span><i>'+(off?'':'Move here &rarr;')+'</i></button>'; }).join('')
        :'<p style="color:var(--grey)">No other date is open yet. The next ones go out by email.</p>')
      +'<div class="msg" id="mmsg"></div></div>'
      +'<div class="card"><div class="price"><b>Cancel</b><span>'+(d.back>0?pounds(d.back)+' back':(d.paid>0?'':'Nothing to refund'))+'</span></div>'
      +'<p style="color:var(--grey);font-size:14.5px">'+(d.back>0?(d.guest?'Your place is given up, and '+pounds(d.back)+' goes back to the card that paid for it, in a few days.'
  :d.group?'The places booked with it are charged at their own price now, so '+pounds(d.back)+' comes back to your card.'
  :'The '+pounds(d.back)+' you paid goes back to your card, in a few days.'):'Your place is given up and freed for somebody else.')+'</p>'
      +'<button class="ghost" id="cx">Cancel my place</button><div class="msg" id="cmsg"></div></div>'
      +'<div class="fine">You can move or cancel up to '+d.cutoff+' hours before the start. Questions? <a href="mailto:info@londonhandstandacademy.com" style="color:var(--forest)">info@londonhandstandacademy.com</a></div>';
    /* one thing at a time: a move and a cancel at once each acted on the same place */
    var working=false, lockAll=function(on){ working=on; [].forEach.call(box.querySelectorAll('.opt[data-to],#cx'),function(x){ if(on) x.dataset.was=x.disabled?'1':''; x.disabled=on||x.dataset.was==='1'; }); };
    [].forEach.call(box.querySelectorAll('.opt[data-to]'),function(b){ b.onclick=function(){
      if(working) return;
      var to=b.getAttribute('data-to'), m=document.getElementById('mmsg'); lockAll(true); m.textContent='Moving…';
      post({action:'move',to:to}).then(function(){ var o=others.filter(function(x){ return x.slug===to; })[0]; done('You have moved.','Your place is now on '+esc(day(o&&o.when))+'.'); })
        .catch(function(e){ lockAll(false); m.textContent=String(e); }); }; });
    var cx=document.getElementById('cx'); cx.onclick=function(){
      if(cx.dataset.sure!=='1'){ cx.dataset.sure='1'; cx.textContent='Yes, cancel it'+(d.back>0?' and refund '+pounds(d.back):''); return; }
      if(working) return;
      var m=document.getElementById('cmsg'); lockAll(true); m.textContent='Cancelling…';
      post({action:'cancel'}).then(function(r){ done('Your place is cancelled.', r.refunded?pounds(r.refunded)+' is on its way back to your card.':'Your place has been freed.'); })
        .catch(function(e){ lockAll(false); m.textContent=String(e); }); };
  }
  if(!t){ box.innerHTML='<p>This page opens from the link in your booking email.</p>'; return; }
  fetch('/api/app/workshop/manage?t='+encodeURIComponent(t)).then(function(r){ return r.json().then(function(d){ return r.ok?d:Promise.reject(d.error||'Could not load this'); }); })
    .then(draw).catch(function(e){ box.innerHTML='<div class="kick">Your booking</div><p>'+esc(String(e))+'</p>'; });
})();
</script>
</body></html>
